.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); font-weight: 600; }
.btn.small { padding: 4px 9px; font-size: .8rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.note-line { font-size: .84rem; color: var(--muted); }

/* quiz */
.quiz { margin: 22px 0; }
.qz { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.qz-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.qz-title { margin: 0; font: 700 1.02rem var(--f-display); }
.qz-badge { font: 600 .75rem var(--f-mono); background: var(--surface-2); border-radius: 99px; padding: 3px 9px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.qz-body { padding: 18px 20px; }
.qz-q { font-weight: 700; margin: 0 0 14px; }
.qz-opts { display: grid; gap: 8px; }
.qz-opt { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; text-align: left; cursor: pointer; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: .95rem; line-height: 1.45; }
.qz-opt .l { font: 700 .75rem/1.9 var(--f-mono); color: var(--muted); }
.qz-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.qz-opt:disabled { cursor: default; }
.qz-opt.good { border-color: var(--ok); background: var(--ok-soft); }
.qz-opt.bad { border-color: var(--ko); background: var(--ko-soft); }
.qz-opt.good .l, .qz-opt.bad .l { color: var(--fg); }
.qz-hint { margin-top: 12px; }
.qz-hint-box, .hint-box { margin-top: 8px; padding: 10px 14px; border-radius: 10px; background: var(--mid-soft); font-size: .92rem; }
.qz-fb { margin-top: 14px; padding: 12px 16px; border-radius: 10px; font-size: .94rem; }
.qz-fb.good { background: var(--ok-soft); }
.qz-fb.bad { background: var(--ko-soft); }
.qz-fb > strong { display: block; margin-bottom: 4px; }
.qz-fb.good > strong { color: var(--ok); }
.qz-fb.bad > strong { color: var(--ko); }
.qz-fb p { margin: 6px 0 0; }
.qz-foot { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2); }
.qz-track { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.qz-track > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.qz-score { font: 700 2.2rem var(--f-display); margin: 0; font-variant-numeric: tabular-nums; }
.qz-recap { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; font-size: .9rem; }
.qz-recap li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; max-width: none; margin: 0; }

/* réponse rédigée */
.answer { margin: 18px 0 26px; }
.ans { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.ans-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.ans-tag { font: 600 .74rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.ans-saved { font-size: .78rem; color: var(--muted); }
.ans-body { padding: 14px 16px; display: grid; gap: 10px; }
.ans textarea { width: 100%; resize: vertical; min-height: 4.5em; font: .95rem/1.55 var(--f-body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.ans.k-schema textarea { font-family: var(--f-mono); font-size: .88rem; }
.ans textarea:focus, .te input:focus, .field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.ans-syntax { font-size: .8rem; color: var(--muted); }
.ans-syntax code { font-size: .78rem; }
.ans-preview { font-family: var(--f-mono); font-size: .88rem; padding: 8px 12px; border-radius: 10px; border: 1px dashed var(--line); white-space: pre-wrap; overflow-x: auto; min-height: 2.4em; }
.ans-preview:empty::before { content: "Aperçu de la notation…"; color: var(--muted); font-style: italic; }
.ans-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ans-corr { border-top: 1px solid var(--line); padding: 14px 16px; background: var(--ok-soft); }
.ans-corr-title { margin: 0 0 6px; font: 700 .78rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ok); }
.ans-corr > :last-child { margin-bottom: 0; }
.ans-corr .schema, .ans-corr .dfl, .ans-corr table.data { background: var(--surface); }
.ans-self { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 8px; border-radius: 0 0 14px 14px; }
.ans-self p { margin: 0; font-size: .9rem; font-weight: 700; }
.self-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.self-btn { cursor: pointer; border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 99px; font-size: .88rem; font-weight: 700; }
.self-btn[aria-pressed="true"].s-ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.self-btn[aria-pressed="true"].s-mid { background: var(--mid); border-color: var(--mid); color: var(--surface); }
.self-btn[aria-pressed="true"].s-ko { background: var(--ko); border-color: var(--ko); color: var(--surface); }
.self-btn.s-ok:hover { border-color: var(--ok); }
.self-btn.s-mid:hover { border-color: var(--mid); }
.self-btn.s-ko:hover { border-color: var(--ko); }

/* éditeur de tables */
.te { display: grid; gap: 12px; }
.te-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); min-width: 0; }
.te-name { font: 700 .85rem var(--f-mono); width: min(100%, 22ch); padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--fg); text-transform: uppercase; }
.te-scroll { overflow-x: auto; margin: 8px 0; }
.te table { border-collapse: collapse; }
.te th, .te td { border: 1px solid var(--line); padding: 0; background: var(--surface); }
.te th { background: var(--surface-2); vertical-align: top; }
.te input.c { font: .82rem var(--f-mono); width: 16ch; border: 0; padding: 6px 7px; background: transparent; color: var(--fg); }
.te th input.c { font-weight: 600; }
.te th.is-pk input.c { text-decoration: underline; text-decoration-color: var(--key); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.te-flags { display: flex; gap: 4px; padding: 0 5px 5px; }
.te-flag { cursor: pointer; font: 600 .65rem var(--f-mono); padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.te-flag[aria-pressed="true"] { background: var(--key); border-color: var(--key); color: var(--surface); }
.te-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.te-links { display: grid; gap: 4px; font-size: .85rem; }
.te-links input { font: .85rem var(--f-mono); padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }

/* tableau à cocher (OUI / NON…) */
.ctab, .match, .pick { margin: 18px 0 26px; }
.ck { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.ck-head { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.ck-scroll { overflow-x: auto; }
.ck table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.ck th, .ck td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.ck th { font: 600 .74rem var(--f-mono); background: var(--surface-2); letter-spacing: .03em; white-space: nowrap; }
.ck td.lab { min-width: 14em; }
.ck td.cell { white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { cursor: pointer; border: 0; background: var(--surface); padding: 5px 10px; font: 600 .78rem var(--f-mono); color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.seg button:disabled { cursor: not-allowed; opacity: .4; }
td.cell.good .seg { outline: 2px solid var(--ok); outline-offset: 2px; }
td.cell.bad .seg { outline: 2px solid var(--ko); outline-offset: 2px; }
td.cell .mark, .m-row .mark { font: 700 .8rem var(--f-mono); margin-left: 6px; }
.good .mark { color: var(--ok); }
.bad .mark { color: var(--ko); }
tr.ck-expl td { background: var(--surface-2); font-size: .86rem; color: var(--fg); padding-top: 6px; }
.ck-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: var(--surface-2); }
.ck-msg { font-size: .9rem; font-weight: 700; }
.ck-msg.good { color: var(--ok); }
.ck-msg.bad { color: var(--ko); }
.ck-msg.mid { color: var(--mid); }
.ck-after { padding: 12px 16px; border-top: 1px solid var(--line); background: var(--ok-soft); font-size: .93rem; }
.ck-after > :first-child { margin-top: 0; }
.ck-after > :last-child { margin-bottom: 0; }

.m-list { display: grid; }
.m-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(12rem, 16rem); gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.m-row select { font: inherit; font-size: .88rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; }
.m-row.good select { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
.m-row.bad select { border-color: var(--ko); box-shadow: 0 0 0 1px var(--ko); }
.m-row .m-expl { grid-column: 1 / -1; font-size: .85rem; background: var(--surface-2); padding: 6px 10px; border-radius: 8px; }

.pick tbody tr { cursor: pointer; }
.pick tbody tr:hover td { background: var(--accent-soft); }
.pick tbody tr.picked td { background: var(--accent-soft); box-shadow: inset 0 0 0 0 transparent; }
.pick tbody tr.picked td:first-child { box-shadow: inset 4px 0 0 var(--accent); }
.pick tbody tr.p-good td { background: var(--ok-soft); }
.pick tbody tr.p-bad td { background: var(--ko-soft); }
.pick tbody tr.p-miss td { background: var(--mid-soft); }
.pick tbody tr.p-good td:first-child { box-shadow: inset 4px 0 0 var(--ok); }
.pick tbody tr.p-bad td:first-child { box-shadow: inset 4px 0 0 var(--ko); }
.pick tbody tr.p-miss td:first-child { box-shadow: inset 4px 0 0 var(--mid); }
.pick .ck-scroll { padding: 12px 16px; }
.pick table.data { width: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

/* progression de la page */
.page-progress { margin: 48px 0 0; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); display: grid; gap: 10px; }
.page-progress p { margin: 0; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.bar.full > span { background: var(--ok); }

/* navigation de séquence */
.seq { margin-top: 28px; display: grid; gap: 12px; }
.seq-progress { font-size: .85rem; color: var(--muted); margin: 0; }
.seq-links { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seq-link { display: grid; gap: 2px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--fg); background: var(--surface); }
.seq-link:hover { border-color: var(--accent); }
.seq-link.next { text-align: right; grid-column: 2; }
.seq-dir { font-size: .8rem; color: var(--muted); }
.seq-title { font-weight: 700; color: var(--accent); line-height: 1.3; }

/* champs (accueil / bilan) */
.field { display: grid; gap: 4px; }
.field label { font-size: .85rem; font-weight: 700; }
.field input, .field textarea, .field select { font: inherit; font-size: .95rem; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; }
.field textarea { font: .82rem/1.45 var(--f-mono); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 12px; margin: 14px 0; }
.panel { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 16px 18px; margin: 18px 0; box-shadow: var(--shadow); }
.panel > :first-child { margin-top: 0; }
.panel > :last-child { margin-bottom: 0; }

.parcours { list-style: none; padding: 0; margin: 18px 0; display: grid; gap: 8px; }
.parcours li { max-width: none; margin: 0; }
.parcours a { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; color: var(--fg); }
.parcours a:hover { border-color: var(--accent); }
.parcours .k { font: 600 .74rem var(--f-mono); color: var(--muted); letter-spacing: .03em; }
.parcours .k.tp { color: var(--key); }
.parcours .t { font-weight: 700; line-height: 1.3; }
.parcours .t small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 12px; margin: 16px 0; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.stat b { display: block; font: 700 1.7rem var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: .82rem; color: var(--muted); }
.bilan-tbl td, .bilan-tbl th { white-space: nowrap; }
.bilan-tbl td:first-child { white-space: normal; min-width: 12em; }
.revoir { display: grid; gap: 6px; padding-left: 1.2em; }
.chip { display: inline-block; font: 600 .7rem var(--f-mono); padding: 1px 7px; border-radius: 99px; margin-right: 6px; }
.chip.ko { background: var(--ko-soft); color: var(--ko); }
.chip.mid { background: var(--mid-soft); color: var(--mid); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .9rem; }

/* ---------- responsive ---------- */
@media (max-width: 1240px) {
  .page-grid { grid-template-columns: minmax(0, 46rem); }
  .notices { max-width: 46rem; }
  .toc { display: none; }
}
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-block; }
  .sidebar { position: fixed; z-index: 45; top: calc(var(--top) + env(safe-area-inset-top, 0px)); left: 0; width: min(86vw, 320px); transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow); }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 25, .4); }
  .who { display: none; }
}
@media (max-width: 560px) {
  body { font-size: 16px; }
  .brand small { display: none; }
  .brand { font-size: 1.05rem; }
  .topbar { gap: 8px; }
  .theme-sel { display: none; }
  .brand span { display: none; }
  .seq-links { grid-template-columns: 1fr; }
  .seq-link.next { grid-column: 1; }
  .parcours a { grid-template-columns: minmax(0, 1fr) auto; }
  .parcours .k { grid-column: 1 / -1; }
  .m-row { grid-template-columns: minmax(0, 1fr); }
  .qz-body, .qz-head, .qz-foot { padding-left: 14px; padding-right: 14px; }
  .carte-in { flex-direction: column; align-items: flex-start; min-width: 0; gap: 10px; }
  .carte ul { padding-left: 14px; }
  .carte ul::before { display: none; }
  .carte li > span { white-space: normal; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}

/* ---------- fichier unique : démarrage, entraînement, rappel ---------- */
.mono { font-family: var(--f-mono); letter-spacing: .03em; }
.qz-badge.train { background: var(--mid-soft); color: var(--mid); }
.qz-first, .qz-first-inline { font-size: .84rem; color: var(--muted); }
.qz-first { padding: 8px 20px; border-top: 1px solid var(--line); }
.panel.start { border-width: 2px; border-color: var(--accent); display: grid; gap: 10px; }
.panel.start.ok { border-color: var(--ok); }
.panel.start p { margin: 0; }
.panel.start hr { margin: 6px 0; }
.start-step { font: 600 .74rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.panel.start.ok .start-step { color: var(--ok); }
.start-who { font: 700 1.3rem var(--f-display); margin: 0; }
.panel.start .fields { margin: 0; }
.ident-edit summary { cursor: pointer; font-size: .88rem; color: var(--muted); }
.ident-edit[open] { display: grid; gap: 10px; }
.notice.gate { margin-top: 10px; }
a.btn { text-decoration: none; display: inline-block; }
.remind {
  position: fixed; z-index: 70; max-width: min(26rem, calc(100vw - 32px));
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border: 2px solid var(--mid); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); font-size: .92rem;
  display: grid; gap: 8px;
}
.remind p { margin: 0; }
.notices:empty, .notices[hidden] { display: none; }

/* ---------- code (SQL, C#, PHP…) ---------- */
pre.code { font: .86rem/1.55 var(--f-mono); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 14px 0; }
pre.code.terminal { background: #10151f; color: #dce3f0; border-color: #10151f; }
pre.code .kw { color: var(--accent); font-weight: 600; }
pre.code.terminal .kw { color: #93a6ff; }
.ans.k-code textarea { font-family: var(--f-mono); font-size: .88rem; tab-size: 4; }

/* ---------- Ajouts du chapitre 2 (réseaux) ---------- */
.answer, .ans-prompt, .task-body { min-width: 0; }
.ans-prompt pre.code { max-width: 100%; overflow-x: auto; }
pre.code .cm { color: var(--muted); font-style: italic; }
pre.code .pr { color: var(--ok); font-weight: 600; }
pre.code .st { color: var(--key); }
pre.code .hl { background: var(--mid-soft); color: var(--fg); border-radius: 3px; }
figure.fig { margin: 1.4rem 0; padding: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
figure.fig svg { display: block; width: 100%; height: auto; max-width: 760px; margin: 0 auto; }
figure.fig figcaption { margin-top: .6rem; font-size: .88rem; color: var(--muted); text-align: center; }
figure.fig svg text { fill: var(--fg); font-family: var(--f-body); font-size: 13px; }
figure.fig svg text.sm { font-size: 11px; fill: var(--muted); }
figure.fig svg text.b { font-weight: 700; }
figure.fig svg .ln { stroke: var(--muted); stroke-width: 2; fill: none; }
figure.fig svg .ln-acc { stroke: var(--accent); stroke-width: 2.5; fill: none; }
figure.fig svg .bx { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; }
figure.fig svg .bx-acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
figure.fig svg .bx-key { fill: var(--key-soft); stroke: var(--key); stroke-width: 1.5; }
figure.fig svg .bx-ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.5; }
figure.fig svg .bx-mid { fill: var(--mid-soft); stroke: var(--mid); stroke-width: 1.5; }
figure.fig svg .dot { fill: var(--accent); }
.encap { display: grid; gap: 6px; font-family: var(--f-mono); font-size: .8rem; margin: 1rem 0; }
.encap > div { display: flex; align-items: stretch; gap: 0; overflow-x: auto; }
.encap .lab { flex: 0 0 8.5rem; font-family: var(--f-body); font-size: .85rem; color: var(--muted); padding: .35rem .5rem .35rem 0; }
.encap span { padding: .35rem .55rem; border: 1px solid var(--line); white-space: nowrap; }
.encap span + span { border-left: 0; }
.encap .h2l { background: var(--key-soft); } .encap .h3l { background: var(--accent-soft); }
.encap .h4l { background: var(--ok-soft); } .encap .d7 { background: var(--surface-2); flex: 1 0 auto; }
.encap .t2l { background: var(--key-soft); }
table.data.bits td, table.data.bits th { text-align: center; font-family: var(--f-mono); padding-left: .45rem; padding-right: .45rem; }
table.data td.hl, table.data th.hl { background: var(--mid-soft); }
table.data td.mono, .mono { font-family: var(--f-mono); }
.dl-cap { display: inline-flex; align-items: center; gap: .5rem; padding: .55rem .9rem; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; text-decoration: none; }
.dl-cap:hover { background: var(--accent); color: #fff; }
.aside.deep { border-color: var(--accent); background: var(--accent-soft); }
.aside.deep .aside-title::before { content: "EN PROFONDEUR"; color: var(--accent); }

<h1 data-cfg="title">Titre du cours</h1>
<p class="lead"><span data-cfg="lead"></span> Chaque activité se corrige seul : répondre, comparer, s’auto-évaluer.</p>

<div class="aside caution">

  <p><strong>Fermer le navigateur sans avoir sauvegardé, c’est risquer de perdre son travail.</strong> Les réponses sont gardées par le navigateur tant qu’il le veut bien : un autre poste, un poste du lycée réinitialisé ou un navigateur qui efface ses données suffisent à tout perdre. Seul le <strong>fichier de sauvegarde</strong> est sûr.</p>

<p>Avant d’accéder au cours : saisir son identité, puis créer son fichier de sauvegarde. Si le travail a déjà commencé ailleurs, ouvrir son dernier fichier de sauvegarde.</p>

      <li>En fin de séance : <strong>Sauvegarder</strong>, puis ranger le fichier téléchargé (dossier <em>Téléchargements</em>) dans OneDrive, Teams, sur une clé USB ou dans son dépôt GitHub.</li>

<h2>Mode d’emploi</h2>
<ol class="steps">
  <li>Suivre le parcours dans l’ordre : chaque partie s’appuie sur la précédente, et les TP arrivent au moment où les notions nécessaires ont été vues.</li>
  <li>Lire le cours, répondre aux questions au fil de la page, puis faire le quiz « Vérifier ses connaissances ».</li>
  <li>Pour chaque réponse rédigée, écrire sa propre réponse avant de demander la correction : le bouton « Comparer avec la correction » ne s’active qu’ensuite.</li>
  <li>Comparer, puis s’auto-évaluer : <span class="chip ok">Réussi</span><span class="chip mid">En partie</span><span class="chip ko">À revoir</span></li>
  <li>Terminer par le bilan : il liste les points à revoir et produit le compte rendu à rendre.</li>
</ol>

<h2>Les types d’activités</h2>
<dl class="def">
  <dt>Quiz</dt><dd>Questions à choix multiple, avec indice et explication après chaque réponse.</dd>
  <dt>Activité auto-corrigée</dt><dd>Tableaux à cocher, associations, lignes à repérer dans une capture ou une table : la vérification est immédiate, avec une explication pour chaque ligne.</dd>
  <dt>Réponse rédigée</dt><dd>Calculs d’adressage, plans d’adressage, commandes, explications et diagnostics. La correction se débloque après la rédaction ; l’auto-évaluation termine l’activité. Pour un calcul, <strong>poser le calcul</strong> (binaire, taille de bloc) : c’est la méthode qui est corrigée, pas seulement le résultat.</dd>
  <dt>La première tentative fait foi</dt><dd>Pour les quiz et les activités auto-corrigées, le premier résultat est retenu dans le bilan. Il est ensuite possible de recommencer autant de fois que l’on veut, en mode <span class="qz-badge train">Entraînement</span>, sans changer ce résultat.</dd>
  <dt>Niveaux d’exercice</dt><dd><span class="chip ok">essentiel</span> pour tous, <span class="chip" style="background:var(--accent-soft);color:var(--accent)">intermédiaire</span> pour consolider, <span class="chip" style="background:var(--key-soft);color:var(--key)">défi</span> pour aller plus loin.</dd>
  <dt>Encadrés « En profondeur » et « En entreprise »</dt><dd>Ils expliquent le pourquoi des choses (histoire, normes, fonctionnement interne) et la réalité du terrain. Ils ne sont pas évalués, mais ce sont eux qui permettent de comprendre au lieu d’apprendre par cœur, et de savoir réexpliquer une notion à quelqu’un.</dd>
</dl>

<h2>Le fil rouge : la Maison des Ligues de Lorraine (M2L)</h2>
<p>Tout au long du chapitre, les exemples et les TP s’appuient sur le contexte <strong>M2L</strong> du Réseau Certa : un établissement de la Région qui héberge 24 ligues sportives dans quatre bâtiments (A, B, C et D), avec 80 bureaux, un amphithéâtre de 200 places, 8 salles de réunion, une salle multimédia de 24 postes et un Wi-Fi pour les visiteurs. Son service informatique doit faire évoluer un réseau qui a grandi au fil des années. C’est exactement le type de structure dans laquelle un technicien ou une technicienne SIO fait son stage.</p>

<ul class="refco">

  <li><strong>B1.1</strong> Gérer le patrimoine informatique : recenser et identifier les ressources numériques (équipements d’interconnexion, adresses, nommage).</li>

</ul>

<template data-page="p1">
<h1>Qu’est-ce qu’un réseau ?</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Aucun prérequis réseau : cette partie part de ce que chacun utilise tous les jours (box, Wi-Fi, téléphone). Le chapitre 1 a présenté le poste de travail et sa carte réseau ; on regarde maintenant ce qui relie les postes entre eux. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Un réseau</div><ul>
  <li><span><b>Des éléments</b> : hôtes, supports, équipements d’interconnexion</span></li>
  <li><span><b>Une étendue</b> : PAN, LAN, MAN, WAN, Internet</span></li>
  <li><span><b>Une forme</b> : topologies physique et logique</span></li>
  <li><span><b>Une organisation</b> : client-serveur ou pair-à-pair</span></li>
  <li><span><b>Des performances</b> : débit, latence, unités</span></li>
</ul></div></figure>

<p class="lead">Un réseau informatique relie des équipements pour qu’ils échangent des données et partagent des ressources. Avant d’entrer dans les protocoles, il faut savoir nommer ce qui le compose, reconnaître sa forme et parler correctement de ses performances : c’est le vocabulaire de base de tout ticket d’assistance.</p>

<h2>Les éléments d’un réseau</h2>
<p>Un <strong>réseau informatique</strong> est un ensemble d’équipements reliés entre eux par des supports de transmission, qui échangent des données en respectant des règles communes, les <strong>protocoles</strong>. Il sert à partager des ressources (fichiers, imprimantes, accès à Internet, applications) et à communiquer (messagerie, visioconférence, téléphonie).</p>

<dl class="def">
  <dt>Hôte <small>terminal, nœud d’extrémité</small></dt><dd>Équipement qui produit ou consomme des données : poste de travail, ordinateur portable, smartphone, serveur, imprimante réseau, caméra IP, téléphone IP. Chaque hôte possède au moins une <strong>carte réseau</strong> (filaire ou Wi-Fi).</dd>
  <dt>Support de transmission <small>média</small></dt><dd>Ce qui transporte le signal : câble en cuivre (paire torsadée), fibre optique, ondes radio (Wi-Fi, 4G/5G).</dd>
  <dt>Équipement d’interconnexion <small>équipement actif</small></dt><dd>Équipement qui relie les hôtes et achemine les données : commutateur, routeur, point d’accès Wi-Fi, pare-feu.</dd>
  <dt>Service réseau</dt><dd>Fonction rendue par un logiciel à travers le réseau : partage de fichiers, impression, site web, messagerie, annuaire, attribution automatique d’adresses.</dd>
  <dt>Protocole</dt><dd>Ensemble de règles qui fixe le format des messages et l’ordre des échanges entre deux équipements. Exemples : Ethernet, IP, TCP, HTTP. Sans protocole commun, deux équipements ne se comprennent pas, comme deux personnes sans langue commune.</dd>
</dl>

<h3>Les équipements d’interconnexion</h3>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Équipement</th><th>Rôle</th><th>Ce qu’il « regarde » dans les données</th></tr>
  <tr><td>Carte réseau <small>(NIC)</small></td><td>Relie un hôte au support. Possède une adresse physique unique (adresse MAC).</td><td>—</td></tr>
  <tr><td>Concentrateur <small>(hub)</small></td><td>Répète le signal reçu sur tous ses ports. Obsolète : remplacé par le commutateur.</td><td>Rien : il ne fait que répéter des bits.</td></tr>
  <tr><td>Commutateur <small>(switch)</small></td><td>Relie les hôtes d’un même réseau local et envoie chaque trame <strong>uniquement</strong> vers le port du destinataire.</td><td>L’adresse MAC de destination.</td></tr>
  <tr><td>Point d’accès Wi-Fi <small>(borne, AP)</small></td><td>Relie les appareils sans fil au réseau filaire.</td><td>L’adresse MAC.</td></tr>
  <tr><td>Routeur</td><td>Relie des <strong>réseaux différents</strong> entre eux (réseau local et Internet, deux sites, deux services) et choisit le chemin.</td><td>L’adresse IP de destination.</td></tr>
  <tr><td>Pare-feu <small>(firewall)</small></td><td>Filtre les échanges entre réseaux selon des règles (autoriser, bloquer).</td><td>Adresses IP, ports, parfois le contenu.</td></tr>
  <tr><td>Box Internet</td><td>Boîtier « tout-en-un » des particuliers : modem, routeur, commutateur, point d’accès Wi-Fi et pare-feu.</td><td>Tout cela à la fois.</td></tr>
</table></div>

<div class="aside pro">
  <p class="aside-title">La box, un piège pour comprendre</p>
  <p>À la maison, tout est dans une seule boîte : on ne voit ni le commutateur, ni le routeur. En entreprise, ces fonctions sont <strong>séparées</strong> dans des équipements distincts, installés dans des armoires de brassage. Pour dépanner, il faut savoir lequel de ces rôles est en cause : « le Wi-Fi ne marche pas » peut venir de la borne, du commutateur, du routeur ou du service qui distribue les adresses.</p>
</div>

<div class="match" data-id="m-equip" data-label="Associer chaque besoin à l’équipement adapté" data-options="Commutateur|Routeur|Point d’accès Wi-Fi|Pare-feu|Carte réseau">
  <div class="r" data-ok="Commutateur" data-expl="Le commutateur relie les postes d’un même réseau local.">Relier les 20 postes d’un étage entre eux</div>
  <div class="r" data-ok="Routeur" data-expl="Relier deux réseaux différents (le réseau local et Internet) est le rôle du routeur.">Relier le réseau local de l’entreprise à Internet</div>
  <div class="r" data-ok="Point d’accès Wi-Fi" data-expl="La borne Wi-Fi fait le lien entre les appareils sans fil et le réseau filaire.">Permettre aux visiteurs de se connecter avec leur smartphone</div>
  <div class="r" data-ok="Pare-feu" data-expl="Autoriser ou bloquer des échanges selon des règles : c’est le filtrage, rôle du pare-feu.">Empêcher Internet d’accéder aux postes des salariés</div>
  <div class="r" data-ok="Carte réseau" data-expl="Sans carte réseau, un équipement ne peut pas se raccorder au support.">Raccorder une imprimante au câble réseau</div>
</div>

<h2>L’étendue d’un réseau</h2>
<p>On classe les réseaux selon la zone géographique qu’ils couvrent. Cette classification sert surtout à savoir <strong>qui gère</strong> le réseau : l’organisation elle-même ou un opérateur.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Type</th><th>Étendue</th><th>Exemples</th><th>Qui le gère</th></tr>
  <tr><td><strong>PAN</strong> <small>Personal Area Network</small></td><td>Quelques mètres</td><td>Téléphone et écouteurs Bluetooth, montre connectée</td><td>L’utilisateur</td></tr>
  <tr><td><strong>LAN</strong> <small>Local Area Network</small></td><td>Une pièce, un bâtiment, un site</td><td>Le réseau d’un lycée, d’une PME, de la M2L</td><td>L’organisation (son service informatique)</td></tr>
  <tr><td><strong>WLAN</strong> <small>Wireless LAN</small></td><td>Comme un LAN</td><td>Le réseau Wi-Fi du site</td><td>L’organisation</td></tr>
  <tr><td><strong>MAN</strong> <small>Metropolitan Area Network</small></td><td>Une ville, une agglomération</td><td>Réseau reliant les bâtiments d’une métropole ou d’un campus</td><td>Une collectivité ou un opérateur</td></tr>
  <tr><td><strong>WAN</strong> <small>Wide Area Network</small></td><td>Une région, un pays, le monde</td><td>Liaison entre deux sites d’une entreprise, réseau d’un opérateur</td><td>Un opérateur, loué par l’organisation</td></tr>
</table></div>
<p><strong>Internet</strong> n’est pas un réseau unique : c’est l’interconnexion de dizaines de milliers de réseaux indépendants (opérateurs, hébergeurs, universités, entreprises) qui utilisent tous le même protocole, IP. D’où son nom : <em>inter-network</em>, « entre les réseaux ».</p>

<h2>La topologie : la forme du réseau</h2>
<p>La <strong>topologie physique</strong> décrit la façon dont les câbles relient les équipements. La <strong>topologie logique</strong> décrit le chemin réellement suivi par les données. Les deux peuvent différer.</p>

</table></div>

<h3>Le réseau de la M2L</h3>
<p>D’après la description du contexte M2L : chaque niveau de bureaux du bâtiment A possède une <strong>armoire de brassage</strong> secondaire avec un commutateur de 26 ports. Le bâtiment C a une armoire au 2<sup>e</sup> étage avec quatre commutateurs de 48 ports, reliée en <strong>fibre optique</strong>. Toutes ces armoires sont reliées à l’<strong>armoire principale du bâtiment B</strong>, qui regroupe les commutateurs centraux, le routeur, la baie des serveurs et l’accès à Internet loué à un prestataire. Les bornes Wi-Fi sont réparties dans les étages et dans les salles du rez-de-chaussée.</p>

<div class="quiz" data-id="q-topo-m2l" data-title="La topologie de la M2L">
  <div class="q" data-ok="3">
    <p class="qt">Quelle est la topologie physique du réseau filaire de la M2L ?</p>
    <ul><li>Bus</li><li>Anneau</li><li>Étoile étendue (hiérarchique)</li><li>Maillée complète</li></ul>
    <p class="hint">Chaque étage a son équipement central, et ces équipements sont tous reliés à un point central.</p>
    <div class="expl"><p>Chaque armoire d’étage forme une étoile (les prises des bureaux convergent vers son commutateur), et toutes les armoires convergent vers l’armoire principale du bâtiment B : c’est une <strong>étoile étendue</strong>. Conséquence pour le dépannage : si la liaison entre une armoire d’étage et le bâtiment B est coupée, <strong>tout l’étage</strong> perd l’accès aux serveurs et à Internet, mais les postes de l’étage communiquent encore entre eux.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Le réseau de la M2L est un…</p>
    <ul><li>PAN</li><li>LAN (avec un WLAN pour le Wi-Fi)</li><li>MAN</li><li>WAN</li></ul>
    <div class="expl"><p>Il couvre un site (quatre bâtiments voisins) et il est géré par la M2L elle-même : c’est un <strong>réseau local</strong>. La connexion à Internet, elle, passe par le réseau étendu (WAN) du prestataire.</p></div>
  </div>
</div>

<h2>Deux façons d’organiser les échanges</h2>
<dl class="def">
  <dt>Client-serveur</dt><dd>Un <strong>serveur</strong> fournit un service (fichiers, site web, messagerie) et attend les demandes ; des <strong>clients</strong> envoient des requêtes et reçoivent les réponses. Administration centralisée, sauvegarde et sécurité plus simples. C’est le modèle de l’entreprise : à la M2L, le serveur d’annuaire et de fichiers, le serveur d’impression, le serveur web.</dd>
  <dt>Pair-à-pair <small>peer-to-peer, P2P</small></dt><dd>Chaque machine est à la fois cliente et serveuse : elle partage ses propres ressources avec les autres. Simple pour deux ou trois postes (un dossier partagé dans une petite association), mais difficile à administrer et à sécuriser au-delà.</dd>
</dl>
<p>Attention : « serveur » désigne d’abord un <strong>logiciel</strong> qui rend un service. Par extension, on appelle aussi serveur la machine (souvent puissante et redondante) qui héberge ces logiciels. Une même machine peut héberger plusieurs services, et un même service peut être réparti sur plusieurs machines.</p>

<h2>Parler des performances : débit, latence, unités</h2>
<h3>Bits et octets</h3>
<p>Un <strong>bit</strong> (b) vaut 0 ou 1. Un <strong>octet</strong> (o, en anglais <em>byte</em>, B) vaut 8 bits. Les <strong>débits</strong> se mesurent en <strong>bits par seconde</strong> (b/s ou bps), alors que les <strong>tailles de fichiers</strong> se mesurent en <strong>octets</strong>. C’est la première source d’erreurs de calcul.</p>
<div class="tbl-wrap"><table class="data">
  <tr><th>Préfixe décimal (SI)</th><th>Valeur</th><th>Préfixe binaire (CEI)</th><th>Valeur</th></tr>
  <tr><td>kilo (k)</td><td>10<sup>3</sup> = 1 000</td><td>kibi (Ki)</td><td>2<sup>10</sup> = 1 024</td></tr>
  <tr><td>méga (M)</td><td>10<sup>6</sup> = 1 000 000</td><td>mébi (Mi)</td><td>2<sup>20</sup> = 1 048 576</td></tr>
  <tr><td>giga (G)</td><td>10<sup>9</sup></td><td>gibi (Gi)</td><td>2<sup>30</sup> = 1 073 741 824</td></tr>
  <tr><td>téra (T)</td><td>10<sup>12</sup></td><td>tébi (Ti)</td><td>2<sup>40</sup></td></tr>
</table></div>
<p>En réseau, les préfixes sont <strong>toujours décimaux</strong> : 1 Gb/s = 1 000 000 000 bits par seconde. L’explorateur de fichiers de Windows, lui, calcule en puissances de 2 tout en affichant « Mo » ou « Go » : un disque vendu « 1 To » apparaît comme « 931 Go ». Il n’y a pas d’erreur, seulement deux unités différentes.</p>

<h3>Débit, bande passante, latence</h3>
<dl class="def">
  <dt>Débit</dt><dd>Quantité de données transmises par seconde. Le <strong>débit nominal</strong> est celui annoncé (1 Gb/s pour une carte Gigabit). Le <strong>débit utile</strong> (réel), toujours plus faible, tient compte des en-têtes des protocoles, des erreurs et du partage du support.</dd>
  <dt>Bande passante</dt><dd>Au sens strict, la plage de fréquences d’un support (en hertz). Dans le langage courant, synonyme de débit maximal d’une liaison.</dd>
  <dt>Latence <small>délai</small></dt><dd>Temps mis par une donnée pour aller d’un point à un autre (en millisecondes). La commande <code>ping</code> mesure le temps d’aller-retour (<em>RTT</em>). Un débit élevé avec une forte latence donne un jeu en ligne ou une visioconférence pénibles.</dd>
  <dt>Gigue</dt><dd>Variation de la latence d’un paquet à l’autre. Gênante pour la voix et la vidéo.</dd>
</dl>

<h3>Calculer une durée de transfert</h3>
<p>Méthode : convertir la taille en <strong>bits</strong>, puis diviser par le débit en bits par seconde.</p>
<pre class="code">Fichier de 700 Mo sur une liaison à 100 Mb/s
Taille en bits : 700 Mo × 8 = 5 600 Mb
Durée : 5 600 Mb ÷ 100 Mb/s = 56 s   (durée théorique minimale)</pre>
<p>Le résultat est un minimum : en pratique, les en-têtes des protocoles et le partage de la liaison allongent la durée d’environ 5 à 10 % sur un réseau filaire, beaucoup plus en Wi-Fi.</p>

<div class="answer" data-id="a-debit" data-label="Calculer une durée de transfert" data-min="30" data-rows="5">
  <p>La ligue de tennis veut envoyer une vidéo de 1,5 Go vers le serveur de fichiers de la M2L. Calculer la durée théorique du transfert : a) avec la prise Cat 5 de son bureau du bâtiment A, reliée à un port à 100 Mb/s ; b) depuis un bureau du bâtiment C, relié à un port Gigabit (1 Gb/s). Poser les calculs.</p>
  <p class="hint">1,5 Go = 1 500 Mo (préfixes décimaux). Multiplier par 8 pour obtenir des mégabits.</p>
  <div class="corr">
    <pre class="code">Taille : 1,5 Go = 1 500 Mo = 1 500 × 8 = 12 000 Mb
a) 12 000 Mb ÷ 100 Mb/s   = 120 s, soit 2 minutes
b) 12 000 Mb ÷ 1 000 Mb/s = 12 s</pre>
    <p>Le passage à 1 Gb/s divise la durée par 10. Les ports des commutateurs du bâtiment A sont à 10/100 Mb/s : c’est un argument chiffré pour proposer leur remplacement. Ne pas oublier le ×8 : sans lui, on trouve 15 s et 1,5 s, huit fois trop peu.</p>
  </div>
</div>

<div class="aside deep">
  <p class="aside-title">Commutation de paquets : l’idée qui a fait Internet</p>
  <p>Le téléphone classique réservait un <strong>circuit</strong> pendant tout l’appel, même pendant les silences. Les réseaux informatiques découpent au contraire les données en petits <strong>paquets</strong> indépendants, qui partagent les liaisons avec les paquets des autres utilisateurs et peuvent emprunter des chemins différents. Cette <strong>commutation de paquets</strong> (années 1960-1970, réseaux ARPANET aux États-Unis et Cyclades en France, dont s’est inspiré TCP/IP) utilise beaucoup mieux les liaisons et résiste aux pannes : si un chemin est coupé, les paquets en prennent un autre. Contrepartie : le délai n’est pas garanti, d’où la latence et la gigue.</p>
</div>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Confondre bits et octets : une connexion « fibre 1 Gb/s » télécharge au mieux environ 125 Mo par seconde (1 000 ÷ 8), et non 1 Go par seconde.</li>
    <li>Croire qu’un commutateur et un routeur font la même chose : le commutateur relie les postes <strong>d’un même réseau</strong>, le routeur relie <strong>des réseaux différents</strong>.</li>
    <li>Croire que « Internet » et « le Web » sont synonymes : le Web (les sites en HTTP/HTTPS) n’est qu’un des services qui utilisent Internet, comme la messagerie ou la visioconférence.</li>
  </ul>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p1" data-title="Qu’est-ce qu’un réseau ?" data-label="Quiz de fin de partie">
  <div class="q" data-ok="2">
    <p class="qt">Quel équipement relie deux réseaux différents, par exemple le réseau local et Internet ?</p>
    <ul><li>Le commutateur</li><li>Le routeur</li><li>Le point d’accès Wi-Fi</li><li>Le concentrateur</li></ul>
    <div class="expl"><p>Le routeur relie des réseaux différents en se basant sur les adresses IP. Le commutateur et le point d’accès travaillent à l’intérieur d’un même réseau local.</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Une liaison entre le siège d’une entreprise à Amiens et son agence de Lille, louée à un opérateur, fait partie…</p>
    <ul><li>d’un PAN</li><li>d’un LAN</li><li>d’un WLAN</li><li>d’un WAN</li></ul>
    <div class="expl"><p>Elle relie deux sites éloignés à travers le réseau d’un opérateur : c’est un réseau étendu (WAN).</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Pourquoi la topologie en étoile s’est-elle imposée dans les réseaux locaux ?</p>
    <ul><li>Elle utilise moins de câble que toutes les autres</li><li>Elle n’a aucun point unique de panne</li><li>Une coupure de câble n’isole qu’un seul poste et l’ajout d’un poste est simple</li><li>Elle évite d’avoir à utiliser des commutateurs</li></ul>
    <div class="expl"><p>Chaque poste a son propre câble vers le commutateur : une coupure n’affecte qu’un poste. En revanche, le commutateur central reste un point unique de panne (deuxième proposition fausse), et l’étoile utilise plus de câble qu’un bus.</p></div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Combien de temps faut-il, au minimum, pour transférer 250 Mo sur une liaison à 1 Gb/s ?</p>
    <ul><li>2 secondes</li><li>0,25 seconde</li><li>8 secondes</li><li>20 secondes</li></ul>
    <p class="hint">250 Mo × 8 = ? Mb, puis diviser par 1 000 Mb/s.</p>
    <div class="expl"><p>250 × 8 = 2 000 Mb ; 2 000 ÷ 1 000 = 2 s. La réponse 0,25 s oublie la conversion en bits.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Que mesure la commande <code>ping</code> ?</p>
    <ul><li>Le débit maximal de la liaison</li><li>Le temps d’aller-retour d’un message vers un hôte (latence)</li><li>La taille des fichiers échangés</li><li>Le nombre de postes du réseau</li></ul>
    <div class="expl"><p><code>ping</code> envoie une demande d’écho et mesure le temps jusqu’à la réponse : c’est une mesure de latence (et de joignabilité), pas de débit. On l’étudiera en détail en partie 6.</p></div>
  </div>
</div>

<h1>Les modèles OSI et TCP/IP</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : <a href="#p1">partie 1</a> (vocabulaire des équipements). Cette partie est la plus « théorique » du chapitre, mais tout le reste s’y accroche : chaque protocole, chaque équipement et chaque panne se situe dans une couche. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Modèles en couches</div><ul>
  <li><span><b>Pourquoi</b> : normaliser, découper un problème complexe</span></li>
  <li><span><b>OSI</b> : 7 couches, le modèle de référence</span></li>
  <li><span><b>TCP/IP</b> : 4 couches, le modèle réellement utilisé</span></li>
  <li><span><b>Encapsulation</b> : chaque couche ajoute son en-tête</span></li>
  <li><span><b>Équipements</b> : chacun travaille jusqu’à une couche</span></li>
</ul></div></figure>

<p class="lead">Envoyer un courriel met en jeu des dizaines de mécanismes : l’application, la fiabilité de la transmission, l’adressage, le passage par des routeurs, l’accès au câble ou au Wi-Fi, le codage électrique des bits. Pour s’y retrouver, on range ces mécanismes en <strong>couches</strong>, empilées les unes sur les autres.</p>

<h2>Pourquoi un modèle en couches ?</h2>
<p>Un modèle en couches découpe la communication en niveaux. Chaque couche :</p>
<ul>
  <li>a <strong>un rôle précis</strong> (par exemple : acheminer d’un réseau à un autre) ;</li>
  <li>rend un <strong>service à la couche du dessus</strong> et utilise les services de la couche du dessous, sans savoir comment ils sont réalisés ;</li>
  <li>dialogue avec la <strong>même couche</strong> de l’équipement distant, grâce à un <strong>protocole</strong>.</li>
</ul>
<p>Intérêts : on peut changer une couche sans toucher aux autres (passer du câble au Wi-Fi ne change rien pour le navigateur web) ; des constructeurs différents fabriquent des équipements compatibles en respectant les <strong>normes</strong> ; et pour dépanner, on vérifie les couches une par une.</p>

<dl class="def">
  <dt>Norme <small>standard</small></dt><dd>Document qui décrit précisément un protocole ou un matériel, publié par un organisme : <strong>ISO</strong> (modèle OSI), <strong>IEEE</strong> (Ethernet 802.3, Wi-Fi 802.11), <strong>IETF</strong> (protocoles d’Internet, publiés dans des documents appelés <strong>RFC</strong>, <em>Request For Comments</em>), <strong>UIT</strong> (télécommunications).</dd>
</dl>

<div class="aside tip">
  <p class="aside-title">Une analogie : envoyer une lettre</p>
  <p>On écrit la lettre (application), on la met dans une enveloppe avec l’adresse (réseau), La Poste la trie de centre en centre (routage), un camion la transporte sur la route (physique). Personne n’a besoin de connaître le métier des autres : il suffit que l’enveloppe soit au bon format. Le facteur ne lit pas la lettre, comme le routeur ne lit pas le contenu du courriel.</p>
</div>

<h2>Le modèle OSI : 7 couches</h2>
<p>Le modèle <strong>OSI</strong> (<em>Open Systems Interconnection</em>, norme ISO 7498 publiée en 1984) est un modèle de <strong>référence</strong> : il sert à décrire et à comparer. On numérote les couches de 1 (en bas, le plus près du câble) à 7 (en haut, le plus près de l’utilisateur).</p>

<div class="tbl-wrap"><table class="data wide">
  <tr><th>N°</th><th>Couche</th><th>Rôle</th><th>Unité de données (PDU)</th><th>Exemples</th><th>Équipement</th></tr>
  <tr><td>7</td><td><strong>Application</strong></td><td>Offre les services réseau aux logiciels de l’utilisateur</td><td rowspan="3">Données</td><td>HTTP, DNS, SMTP, FTP, DHCP</td><td rowspan="3">Hôtes (postes, serveurs)</td></tr>
  <tr><td>6</td><td><strong>Présentation</strong></td><td>Format des données : codage des caractères, compression, chiffrement</td><td>UTF-8, JPEG, chiffrement TLS</td></tr>
  <tr><td>5</td><td><strong>Session</strong></td><td>Ouvre, maintient et ferme le dialogue entre applications</td><td>Ouverture de session sur un partage, reprise après coupure</td></tr>
  <tr><td>4</td><td><strong>Transport</strong></td><td>Transmission de bout en bout entre <strong>applications</strong> : découpage, fiabilité (selon le protocole), numéros de <strong>ports</strong></td><td>Segment (TCP), datagramme (UDP)</td><td>TCP, UDP</td><td>Pare-feu</td></tr>
  <tr><td>3</td><td><strong>Réseau</strong></td><td>Adressage <strong>logique</strong> (adresse IP) et acheminement entre réseaux (<strong>routage</strong>)</td><td>Paquet</td><td>IPv4, IPv6, ICMP</td><td>Routeur, commutateur de niveau 3</td></tr>
  <tr><td>2</td><td><strong>Liaison de données</strong></td><td>Transmission entre deux équipements <strong>voisins</strong> sur le même support : adressage <strong>physique</strong> (adresse MAC), détection d’erreurs</td><td>Trame</td><td>Ethernet (IEEE 802.3), Wi-Fi (802.11), ARP*</td><td>Commutateur, point d’accès, carte réseau</td></tr>
  <tr><td>1</td><td><strong>Physique</strong></td><td>Transmission des bits sous forme de signaux électriques, lumineux ou radio ; connecteurs, câbles</td><td>Bit</td><td>RJ45, fibre, ondes radio, 1000BASE-T</td><td>Câbles, répéteur, concentrateur</td></tr>
</table></div>
<p class="refco">* ARP fait le lien entre les couches 2 et 3 : il est souvent classé en couche 2, parfois appelé « couche 2,5 ». On l’étudie en <a href="#p6">partie 6</a>.</p>

<div class="aside tip">
  <p class="aside-title">Retenir l’ordre des couches</p>
  <p>De la couche 1 à la couche 7 : « <strong>P</strong>our <strong>L</strong>e <strong>R</strong>éseau, <strong>T</strong>out <strong>S</strong>e <strong>P</strong>asse <strong>A</strong>utomatiquement » : Physique, Liaison, Réseau, Transport, Session, Présentation, Application.</p>
</div>

<div class="match" data-id="m-couches" data-label="Associer chaque description à sa couche OSI" data-options="1 Physique|2 Liaison|3 Réseau|4 Transport|5 Session|6 Présentation|7 Application">

</div>

<h2>Le modèle TCP/IP : 4 couches</h2>
<p>Le modèle <strong>TCP/IP</strong> (ou modèle Internet) a été conçu en même temps que les protocoles d’Internet (années 1970, décrit dans la RFC 1122 en 1989). Il est plus simple et c’est lui qui est réellement mis en œuvre dans les systèmes d’exploitation. Il regroupe certaines couches d’OSI.</p>

<div class="tbl-wrap"><table class="data wide">
  <tr><th>Modèle OSI</th><th>Modèle TCP/IP</th><th>Protocoles</th></tr>
  <tr><td>7 Application<br>6 Présentation<br>5 Session</td><td><strong>Application</strong></td><td>HTTP, HTTPS, DNS, DHCP, SMTP, IMAP, FTP, SSH, RDP</td></tr>
  <tr><td>4 Transport</td><td><strong>Transport</strong></td><td>TCP, UDP</td></tr>
  <tr><td>3 Réseau</td><td><strong>Internet</strong></td><td>IPv4, IPv6, ICMP, ICMPv6</td></tr>
  <tr><td>2 Liaison<br>1 Physique</td><td><strong>Accès réseau</strong> <small>(ou liaison, ou interface réseau)</small></td><td>Ethernet, Wi-Fi, ARP, PPP</td></tr>
</table></div>
<p>Certains ouvrages présentent un modèle TCP/IP « en 5 couches », qui sépare la couche d’accès réseau en Liaison et Physique. C’est la même idée. En entreprise, on parle surtout avec les <strong>numéros OSI</strong> : « un commutateur de niveau 2 », « un problème de couche 1 » (câble), « un filtrage de niveau 4 » (ports).</p>

<div class="aside deep">
  <p class="aside-title">Pourquoi deux modèles ?</p>
  <p>Dans les années 1980, deux approches s’affrontent : les protocoles OSI, normalisés par l’ISO et soutenus par les opérateurs et les États, et les protocoles TCP/IP, plus simples, gratuits et déjà en service sur ARPANET et dans le système Unix des universités. TCP/IP a gagné par l’usage : « du code qui tourne » plutôt que des normes sur papier. Les protocoles OSI ont presque disparu, mais leur <strong>modèle</strong> en 7 couches est resté, parce qu’il décrit très bien les rôles. On utilise donc les protocoles TCP/IP et on les décrit avec le vocabulaire OSI.</p>
</div>

<h2>L’encapsulation</h2>
<p>Quand un poste envoie des données, elles <strong>descendent</strong> les couches. Chaque couche ajoute devant les données reçues un <strong>en-tête</strong> qui contient les informations dont elle a besoin (adresses, numéros, contrôles) : c’est l’<strong>encapsulation</strong>. La couche liaison ajoute aussi une <strong>queue</strong> (en anglais <em>trailer</em>) avec un code de contrôle d’erreurs. À l’arrivée, les données <strong>remontent</strong> : chaque couche lit et retire son en-tête, c’est la <strong>désencapsulation</strong>.</p>

<div class="encap" aria-label="Encapsulation d’une requête web">
  <div><span class="lab">7 Application</span><span class="d7">Données HTTP : GET /index.html</span></div>
  <div><span class="lab">4 Transport</span><span class="h4l">En-tête TCP<br>ports 49152 → 443</span><span class="d7">Données HTTP</span></div>
  <div><span class="lab">3 Réseau</span><span class="h3l">En-tête IP<br>IP src → IP dest</span><span class="h4l">En-tête TCP</span><span class="d7">Données HTTP</span></div>
  <div><span class="lab">2 Liaison</span><span class="h2l">En-tête Ethernet<br>MAC dest, MAC src</span><span class="h3l">En-tête IP</span><span class="h4l">En-tête TCP</span><span class="d7">Données HTTP</span><span class="t2l">FCS</span></div>
  <div><span class="lab">1 Physique</span><span class="d7">0100110101110010… (signaux sur le câble)</span></div>
</div>
<p>Vocabulaire : les données de la couche transport s’appellent un <strong>segment</strong> (TCP) ou un <strong>datagramme</strong> (UDP) ; une fois l’en-tête IP ajouté, c’est un <strong>paquet</strong> ; une fois l’en-tête et la queue Ethernet ajoutés, c’est une <strong>trame</strong>. On appelle ces unités des <strong>PDU</strong> (<em>Protocol Data Unit</em>).</p>

<h3>Ce que fait chaque équipement sur le chemin</h3>
<p>Un équipement intermédiaire ne désencapsule que jusqu’à la couche dont il a besoin :</p>
<ul>
  <li>le <strong>commutateur</strong> lit l’en-tête de la trame (couche 2) pour trouver l’adresse MAC de destination, et transmet la trame sans toucher au paquet ;</li>
  <li>le <strong>routeur</strong> retire l’en-tête Ethernet, lit l’en-tête IP (couche 3), choisit la sortie, puis <strong>réencapsule</strong> le paquet dans une <strong>nouvelle trame</strong> avec de nouvelles adresses MAC ;</li>
  <li>le <strong>serveur</strong> de destination remonte jusqu’à la couche 7 pour lire la requête.</li>
</ul>
<p>Conséquence essentielle, à retenir pour toute la suite : <strong>les adresses IP restent les mêmes de bout en bout</strong>, alors que <strong>les adresses MAC changent à chaque routeur</strong> traversé. On le vérifiera dans une capture au <a href="#tp4">TP 4</a>.</p>

<div class="ctab" data-id="c-encap" data-head="Affirmation" data-cols="Vrai ?" data-choices="VRAI|FAUX" data-label="Vrai ou faux : encapsulation et équipements">
  <div class="r" data-ok="VRAI" data-expl="Chaque couche ajoute son en-tête devant ce que lui donne la couche supérieure.">À l’envoi, l’en-tête IP est ajouté avant l’en-tête Ethernet (il se retrouve à l’intérieur de la trame).</div>
  <div class="r" data-ok="FAUX" data-expl="Le commutateur s’arrête à la couche 2 : il ne lit pas l’adresse IP.">Un commutateur lit l’adresse IP de destination pour savoir sur quel port envoyer la trame.</div>
  <div class="r" data-ok="VRAI" data-expl="Le routeur fabrique une nouvelle trame pour le réseau suivant : nouvelles adresses MAC source et destination.">Après un routeur, les adresses MAC de la trame ne sont plus les mêmes.</div>
  <div class="r" data-ok="FAUX" data-expl="Les adresses IP source et destination restent identiques de bout en bout (sauf traduction d’adresses NAT, vue au chapitre 4).">Après un routeur, l’adresse IP de destination est remplacée par celle du routeur suivant.</div>
  <div class="r" data-ok="FAUX" data-expl="Le FCS est une queue ajoutée par la couche liaison, à la fin de la trame.">Le code de contrôle d’erreurs FCS est ajouté par la couche transport.</div>
</div>

<div class="answer" data-id="a-encap" data-label="Expliquer l’encapsulation avec ses mots" data-min="60" data-rows="5">
  <p>Un utilisateur de la M2L demande : « Quand j’ouvre le site de ma ligue, comment ma demande arrive-t-elle au bon serveur, puis au bon programme sur ce serveur ? » Rédiger une réponse claire, en 4 à 6 phrases, qui cite les couches et les deux types d’adresses, et le rôle des ports.</p>
  <p class="hint">Qui trouve le bon réseau ? Qui livre au voisin ? Qui désigne le bon programme ?</p>
  <div class="corr">
    <p>Proposition : « Votre navigateur prépare une requête (couche application, HTTP). La couche transport y ajoute un numéro de port, 443 pour le web sécurisé, qui désigne le bon programme sur le serveur. La couche réseau ajoute l’adresse IP du serveur : grâce à elle, les routeurs trouvent le chemin de réseau en réseau jusqu’au serveur. À chaque étape, la couche liaison emballe le tout dans une trame portant l’adresse MAC de l’équipement suivant, qui change à chaque routeur. À l’arrivée, le serveur retire les emballages un par un et transmet la requête au programme qui écoute sur le port 443. »</p>
    <p>Points attendus : IP = trouver la machine (de bout en bout) ; MAC = livrer au voisin (change à chaque saut) ; port = trouver le programme. Le vocabulaire doit rester accessible à un utilisateur.</p>
  </div>
</div>

<h2>Les couches pour diagnostiquer</h2>
<p>Le modèle sert aussi de méthode de dépannage. On teste <strong>de bas en haut</strong> : inutile de chercher un problème de site web si le câble est débranché.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Couche</th><th>Question à se poser</th><th>Exemple de vérification</th></tr>
  <tr><td>1 Physique</td><td>Le câble est-il branché, le voyant allumé, le Wi-Fi connecté ?</td><td>Voyant de la prise, icône réseau, câble testé</td></tr>
  <tr><td>2 Liaison</td><td>La carte réseau est-elle activée et reliée au commutateur ?</td><td><code>ipconfig /all</code> (adresse physique), état de la carte</td></tr>
  <tr><td>3 Réseau</td><td>Le poste a-t-il une adresse IP correcte ? Joint-il la passerelle ?</td><td><code>ipconfig</code>, <code>ping</code> de la passerelle</td></tr>
  <tr><td>4 Transport</td><td>Le port du service est-il ouvert ou bloqué par un pare-feu ?</td><td><code>Test-NetConnection serveur -Port 443</code></td></tr>
  <tr><td>7 Application</td><td>Le service fonctionne-t-il ? Le nom est-il résolu ?</td><td>Navigateur, <code>nslookup</code></td></tr>
</table></div>
<p>Cette méthode sera détaillée en <a href="#p6">partie 6</a>.</p>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Inverser la numérotation : la couche 1 est la couche <strong>physique</strong>, en bas ; la couche 7 est l’application, en haut.</li>
    <li>Croire que l’adresse IP de destination change à chaque routeur : ce sont les adresses <strong>MAC</strong> qui changent, les adresses IP restent.</li>
    <li>Mélanger les noms des PDU : on parle de <strong>trame</strong> en couche 2, de <strong>paquet</strong> en couche 3, de <strong>segment</strong> en couche 4 (TCP).</li>
  </ul>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p2" data-title="Modèles OSI et TCP/IP" data-label="Quiz de fin de partie">
  <div class="q" data-ok="3">
    <p class="qt">À quelle couche OSI travaille un routeur ?</p>
    <ul><li>1 Physique</li><li>2 Liaison</li><li>3 Réseau</li><li>4 Transport</li></ul>
    <div class="expl"><p>Le routeur lit l’adresse IP de destination pour choisir le chemin : couche 3, réseau.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Comment s’appelle l’unité de données de la couche liaison ?</p>
    <ul><li>Le paquet</li><li>La trame</li><li>Le segment</li><li>Le bit</li></ul>
    <div class="expl"><p>Couche 2 : trame. Couche 3 : paquet. Couche 4 : segment (TCP) ou datagramme (UDP). Couche 1 : bit.</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Dans le modèle TCP/IP, la couche « Application » correspond à quelles couches OSI ?</p>
    <ul><li>7 uniquement</li><li>6 et 7</li><li>4 à 7</li><li>5, 6 et 7</li></ul>
    <div class="expl"><p>Le modèle TCP/IP regroupe Session, Présentation et Application dans une seule couche Application.</p></div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Un utilisateur ne peut plus ouvrir aucun site ; son voyant réseau est éteint. Par quelle couche commencer le diagnostic ?</p>
    <ul><li>La couche physique (câble, prise, carte)</li><li>La couche application (navigateur)</li><li>La couche transport (ports)</li><li>La couche réseau (adresse IP)</li></ul>
    <div class="expl"><p>Un voyant éteint indique un problème de couche 1. On commence toujours par le bas : rien ne peut fonctionner au-dessus d’une couche physique en panne.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Quel organisme publie les RFC qui décrivent les protocoles d’Internet (IP, TCP, HTTP…) ?</p>
    <ul><li>L’ISO</li><li>L’IETF</li><li>L’IEEE</li><li>La CNIL</li></ul>
    <div class="expl"><p>L’IETF (<em>Internet Engineering Task Force</em>) publie les RFC. L’IEEE normalise Ethernet et le Wi-Fi ; l’ISO a publié le modèle OSI.</p></div>
  </div>
</div>

<h1>Couches physique et liaison : câbles, Wi-Fi, Ethernet</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : <a href="#p2">partie 2</a> (couches 1 et 2, notion de trame). Garder un terminal ouvert : quelques commandes de lecture sont proposées, sans danger pour le poste. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Couches 1 et 2</div><ul>
  <li><span><b>Cuivre</b> : paire torsadée, catégories, RJ45, 100 m</span></li>
  <li><span><b>Fibre</b> : multimode, monomode, SFP</span></li>
  <li><span><b>Wi-Fi</b> : 802.11, bandes, support partagé</span></li>
  <li><span><b>Adresse MAC</b> : 48 bits, OUI, diffusion</span></li>
  <li><span><b>Trame Ethernet</b> : champs et tailles</span></li>
  <li><span><b>Commutateur</b> : table MAC, inondation, domaines</span></li>
</ul></div></figure>

<p class="lead">Les couches 1 et 2 sont celles des pannes les plus fréquentes (câble abîmé, prise mal brassée, borne Wi-Fi saturée) et celles que l’on manipule le plus dans une baie de brassage. Cette partie donne les repères pour choisir un support, lire une adresse MAC, comprendre une trame et prédire le comportement d’un commutateur.</p>

<h2>Le câble en cuivre : la paire torsadée</h2>
<p>Le câble réseau courant contient <strong>4 paires</strong> de fils de cuivre torsadés deux à deux (8 fils). La torsade limite les perturbations électromagnétiques et la diaphonie (un fil qui « déborde » sur son voisin). Il se termine par un connecteur <strong>RJ45</strong> (8 broches).</p>
<h3>Blindage</h3>
<dl class="def">
  <dt>U/UTP <small>non blindé</small></dt><dd>Aucun blindage. Le moins cher, le plus souple ; suffisant dans un bureau.</dd>
  <dt>F/UTP <small>écranté</small></dt><dd>Une feuille d’aluminium autour des 4 paires. Courant en entreprise.</dd>
  <dt>S/FTP <small>blindé</small></dt><dd>Chaque paire écrantée et une tresse autour de l’ensemble. Pour les environnements perturbés (ateliers, ascenseurs, câbles électriques proches) et les très hauts débits.</dd>
</dl>
<h3>Catégories</h3>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Catégorie</th><th>Fréquence</th><th>Débit Ethernet sur 100 m</th><th>Usage</th></tr>
  <tr><td>Cat 5</td><td>100 MHz</td><td>100 Mb/s</td><td>Installations anciennes (bureaux du bâtiment A de la M2L)</td></tr>
  <tr><td>Cat 5e</td><td>100 MHz</td><td>1 Gb/s</td><td>Minimum actuel pour un poste de travail</td></tr>
  <tr><td>Cat 6</td><td>250 MHz</td><td>1 Gb/s (10 Gb/s jusqu’à 55 m environ)</td><td>Installations récentes (bâtiment C de la M2L)</td></tr>
  <tr><td>Cat 6A</td><td>500 MHz</td><td>10 Gb/s</td><td>Recommandée pour une installation neuve (bornes Wi-Fi récentes, serveurs)</td></tr>
  <tr><td>Cat 8</td><td>2 000 MHz</td><td>25 ou 40 Gb/s sur 30 m</td><td>Salles serveurs, liaisons courtes</td></tr>
</table></div>
<p>Une liaison en cuivre ne dépasse pas <strong>100 mètres</strong> entre deux équipements actifs : en général 90 m de câble fixe (dans les murs, de la prise à la baie) et 10 m de cordons (poste-prise et brassage dans la baie). Au-delà, le signal est trop affaibli.</p>

<h3>Le connecteur RJ45 et le câblage</h3>
<p>L’ordre des 8 fils dans le connecteur suit l’une des deux normes <strong>T568A</strong> ou <strong>T568B</strong> (en France, la T568B est la plus répandue). Le même ordre doit être utilisé aux deux extrémités.</p>
<ul>
  <li><strong>Câble droit</strong> : même norme aux deux bouts. C’est le câble normal (poste-prise, prise-commutateur).</li>
  <li><strong>Câble croisé</strong> : T568A d’un côté, T568B de l’autre. Il servait à relier deux équipements de même type (deux PC, deux commutateurs). Aujourd’hui, presque toutes les cartes réseau gèrent l’<strong>Auto-MDI/X</strong> : elles détectent le câble et s’adaptent ; le câble croisé n’est plus nécessaire.</li>
</ul>
<p>Le 100 Mb/s n’utilise que 2 paires (broches 1-2 et 3-6) ; le Gigabit utilise les 4 paires. Un câble dont une paire est abîmée peut donc fonctionner à 100 Mb/s mais pas à 1 Gb/s : un symptôme classique de câble défectueux est un poste qui « négocie » à 100 Mb/s au lieu de 1 Gb/s.</p>

<div class="aside pro">
  <p class="aside-title">Alimenter par le câble : le PoE</p>
  <p>Le <strong>PoE</strong> (<em>Power over Ethernet</em>, normes IEEE 802.3af, 802.3at et 802.3bt) fait passer le courant électrique dans le câble réseau, jusqu’à 15 W, 30 W, puis 60 à 90 W selon la norme. Les bornes Wi-Fi, les téléphones IP et les caméras sont ainsi alimentés directement par le commutateur, sans prise électrique. À la M2L, les téléphones IP des bâtiments C et D et les bornes Wi-Fi en sont de bons candidats : le budget PoE du commutateur (puissance totale disponible) devient un critère de choix.</p>
</div>

<h2>La fibre optique</h2>
<p>La fibre transporte la lumière dans un fil de verre très fin. Avantages : très longues distances, très hauts débits, <strong>insensibilité aux perturbations électromagnétiques</strong> et <strong>isolation électrique</strong> (pas de courant entre deux bâtiments, donc pas de risque lié aux différences de potentiel ou à la foudre). Inconvénients : plus fragile, plus coûteuse à raccorder.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th></th><th>Multimode</th><th>Monomode</th></tr>
  <tr><td>Cœur</td><td>50 µm (gros) : la lumière suit plusieurs chemins</td><td>9 µm environ (très fin) : un seul chemin</td></tr>
  <tr><td>Source lumineuse</td><td>Laser peu coûteux (VCSEL)</td><td>Laser plus précis</td></tr>
  <tr><td>Distance</td><td>Quelques centaines de mètres (10 Gb/s : 300 m en OM3, 400 m en OM4)</td><td>Plusieurs kilomètres à des dizaines de km</td></tr>
  <tr><td>Catégories</td><td>OM3, OM4, OM5</td><td>OS2</td></tr>
  <tr><td>Usage</td><td>Dans un bâtiment, entre bâtiments proches, salle serveurs</td><td>Entre sites, réseaux d’opérateurs, fibre jusqu’au domicile</td></tr>
</table></div>
<p>Connecteurs courants : <strong>LC</strong> (petit, le plus répandu en baie) et <strong>SC</strong> (carré). Sur les commutateurs, la fibre se branche dans un <strong>module SFP</strong> (ou SFP+ pour 10 Gb/s) que l’on insère dans un port dédié : on choisit le module selon le type de fibre et la distance. Les commutateurs du bâtiment A de la M2L ont justement 2 ports « combo » RJ45/SFP pour leurs liaisons montantes.</p>

<h3>Lire la désignation d’une norme Ethernet</h3>
<p>Les normes Ethernet (IEEE 802.3) se nomment <strong>débit + BASE + support</strong> : <code>1000BASE-T</code> = 1 000 Mb/s, transmission en bande de base, paire torsadée (<em>Twisted pair</em>).</p>

  <tr><td>100BASE-TX</td><td>100 Mb/s</td><td>Cuivre Cat 5</td><td>100 m</td></tr>
  <tr><td>1000BASE-T</td><td>1 Gb/s</td><td>Cuivre Cat 5e</td><td>100 m</td></tr>

  <tr><td>10GBASE-SR</td><td>10 Gb/s</td><td>Fibre multimode</td><td>300 m (OM3) à 400 m (OM4)</td></tr>

<h2>Le Wi-Fi</h2>
<p>Le Wi-Fi (normes <strong>IEEE 802.11</strong>) transmet par ondes radio. Les générations portent aujourd’hui un numéro commercial :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Nom commercial</th><th>Norme</th><th>Bandes de fréquences</th></tr>
  <tr><td>Wi-Fi 4</td><td>802.11n</td><td>2,4 et 5 GHz</td></tr>
  <tr><td>Wi-Fi 5</td><td>802.11ac</td><td>5 GHz</td></tr>
  <tr><td>Wi-Fi 6 / 6E</td><td>802.11ax</td><td>2,4 et 5 GHz (6E : plus la bande des 6 GHz)</td></tr>
  <tr><td>Wi-Fi 7</td><td>802.11be</td><td>2,4, 5 et 6 GHz</td></tr>
</table></div>
<ul>
  <li><strong>2,4 GHz</strong> : porte plus loin et traverse mieux les murs, mais peu de canaux (seulement 3 canaux sans chevauchement : 1, 6 et 11) et beaucoup d’interférences (Bluetooth, micro-ondes, réseaux voisins).</li>
  <li><strong>5 et 6 GHz</strong> : beaucoup plus de canaux et de débit, mais portée plus courte.</li>
  <li>Le réseau sans fil est identifié par son <strong>SSID</strong> (son nom). Une borne peut diffuser plusieurs SSID (salariés, visiteurs).</li>
  <li>Le support radio est <strong>partagé</strong> : tous les appareils d’une borne se partagent le débit, et un seul « parle » à la fois sur un canal. Les appareils évitent de parler en même temps grâce au mécanisme <strong>CSMA/CA</strong> (écouter avant d’émettre, attendre un délai aléatoire). Les débits annoncés sont des maxima théoriques ; le débit réel par appareil est très inférieur.</li>
</ul>
<p>La sécurité du Wi-Fi (WPA2, WPA3, authentification des utilisateurs) sera traitée dans le chapitre consacré à la cybersécurité. À la M2L, la disposition des bornes « en quinconce » d’un étage à l’autre évite que deux bornes superposées se gênent sur le même canal.</p>

<div class="quiz" data-id="q-support" data-title="Choisir un support">
  <div class="q" data-ok="3">
    <p class="qt">Il faut relier l’armoire du bâtiment C à l’armoire principale du bâtiment B, à 180 m, à 10 Gb/s. Quel support choisir ?</p>
    <ul><li>Un câble Cat 6A</li><li>Une liaison Wi-Fi entre les deux bâtiments</li><li>Une fibre optique multimode OM4 avec des modules SFP+</li><li>Deux câbles Cat 6 en série avec un commutateur au milieu, à l’extérieur</li></ul>
    <p class="hint">Quelle est la distance maximale du cuivre ? Que se passe-t-il entre deux bâtiments ?</p>
    <div class="expl"><p>180 m dépasse les 100 m du cuivre. La fibre multimode OM4 porte 10 Gb/s jusqu’à 400 m et isole électriquement les deux bâtiments. Une liaison Wi-Fi serait moins fiable et moins rapide ; un commutateur en extérieur est une très mauvaise idée (intempéries, sécurité). C’est d’ailleurs la solution retenue à la M2L.</p></div>
  </div>
</div>

<h2>L’adresse MAC</h2>
<p>Chaque carte réseau (Ethernet ou Wi-Fi) possède une <strong>adresse MAC</strong> (<em>Media Access Control</em>), aussi appelée <strong>adresse physique</strong>. Elle sert à désigner une carte <strong>sur le réseau local</strong> : c’est l’adresse utilisée dans les trames.</p>
<dl class="def">
  <dt>Format</dt><dd><strong>48 bits</strong>, soit <strong>6 octets</strong>, écrits en hexadécimal. Notations selon les systèmes : <code>08-00-27-3A-5C-01</code> (Windows), <code>08:00:27:3a:5c:01</code> (Linux, Wireshark), <code>0800.273a.5c01</code> (matériel Cisco).</dd>
  <dt>OUI <small>Organizationally Unique Identifier</small></dt><dd>Les <strong>3 premiers octets</strong> identifient le fabricant, qui les achète auprès de l’IEEE. Exemples : <code>00:00:0C</code> Cisco, <code>08:00:27</code> VirtualBox (cartes virtuelles). Les 3 derniers octets sont un numéro attribué par le fabricant à chaque carte.</dd>
  <dt>Adresse de diffusion <small>broadcast</small></dt><dd><code>FF:FF:FF:FF:FF:FF</code> (48 bits à 1) : la trame est destinée à <strong>toutes</strong> les cartes du réseau local.</dd>
  <dt>Adresse de multidiffusion <small>multicast</small></dt><dd>Destinée à un groupe d’équipements. Elle se reconnaît au <strong>dernier bit du premier octet à 1</strong> : premier octet impair (<code>01:00:5E:…</code> pour le multicast IPv4, <code>33:33:…</code> pour IPv6). Une carte réseau n’a jamais une adresse de ce type comme adresse propre.</dd>
</dl>

<div class="aside deep">
  <p class="aside-title">Les deux bits spéciaux du premier octet</p>
  <p>Dans le premier octet, le bit de poids faible (bit I/G) vaut 0 pour une adresse individuelle et 1 pour un groupe (multicast ou diffusion). Le bit suivant (bit U/L) vaut 0 pour une adresse <strong>universelle</strong>, gravée par le fabricant, et 1 pour une adresse <strong>administrée localement</strong>, choisie par un logiciel. Les smartphones et Windows utilisent des adresses MAC <strong>aléatoires</strong> sur les réseaux Wi-Fi pour éviter d’être suivis à la trace : ces adresses ont le bit U/L à 1, ce qui se repère au 2<sup>e</sup> chiffre hexadécimal : 2, 6, A ou E (par exemple <code>3A:F1:22:…</code>). Conséquence pratique : un filtrage par adresse MAC ou une réservation d’adresse sur le Wi-Fi peut « ne plus marcher » si l’appareil change d’adresse.</p>
</div>

<h3>Lire son adresse MAC</h3>
<pre class="code terminal"><span class="cm"># Windows (invite de commandes ou PowerShell)</span>
<span class="pr">C:\&gt;</span> ipconfig /all
   Description. . . . . . . . . . . . . . : Intel(R) Ethernet Connection I219-LM
   Adresse physique . . . . . . . . . . . : 08-00-27-3A-5C-01
<span class="pr">PS C:\&gt;</span> Get-NetAdapter | Select-Object Name, MacAddress, LinkSpeed

<span class="cm"># Linux (Debian, Kubuntu)</span>
<span class="pr">$</span> ip link show
2: enp0s3: &lt;BROADCAST,MULTICAST,UP,LOWER_UP&gt; mtu 1500 ...
    link/ether 08:00:27:3a:5c:01 brd ff:ff:ff:ff:ff:ff</pre>
<p>Dans la sortie Linux, <code>brd</code> donne l’adresse de diffusion et <code>mtu 1500</code> la taille maximale des données d’une trame. <code>LinkSpeed</code> sous PowerShell affiche la vitesse négociée (100 Mbps ou 1 Gbps) : utile pour repérer un câble défectueux.</p>
