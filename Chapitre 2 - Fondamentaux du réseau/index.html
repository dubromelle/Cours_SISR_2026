</div>

<h2>La trame Ethernet</h2>
<p>Sur un réseau Ethernet, les données circulent dans des <strong>trames</strong>. Le format utilisé partout aujourd’hui est la trame <strong>Ethernet II</strong> :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Champ</th><th>Taille</th><th>Rôle</th></tr>
  <tr><td>Préambule et SFD</td><td>7 + 1 octets</td><td>Suite de bits alternés qui synchronise le récepteur, puis délimiteur de début de trame. Géré par la couche physique : <strong>invisible</strong> dans Wireshark.</td></tr>
  <tr class="hl"><td>Adresse MAC de destination</td><td>6 octets</td><td>Placée en premier : le commutateur peut décider où envoyer la trame dès qu’il l’a lue.</td></tr>
  <tr class="hl"><td>Adresse MAC source</td><td>6 octets</td><td>La carte qui a émis la trame.</td></tr>
  <tr class="hl"><td>EtherType</td><td>2 octets</td><td>Le protocole transporté dans les données : <code>0x0800</code> IPv4, <code>0x0806</code> ARP, <code>0x86DD</code> IPv6.</td></tr>
  <tr class="hl"><td>Données <small>(charge utile)</small></td><td>46 à 1 500 octets</td><td>Le paquet de la couche 3. Moins de 46 octets : la carte ajoute des octets de remplissage (<em>padding</em>). 1 500 octets est la <strong>MTU</strong> d’Ethernet.</td></tr>
  <tr><td>FCS <small>Frame Check Sequence</small></td><td>4 octets</td><td>Code de contrôle (CRC) calculé sur la trame. Le récepteur le recalcule : s’il diffère, la trame est abîmée et elle est <strong>détruite</strong> (pas corrigée, pas redemandée). Retiré par la carte réseau : rarement visible dans Wireshark.</td></tr>
</table></div>
<p>Une trame Ethernet mesure donc de <strong>64 octets</strong> (14 d’en-tête + 46 de données + 4 de FCS) à <strong>1 518 octets</strong> (14 + 1 500 + 4), préambule non compris. Les lignes surlignées sont celles que l’on voit dans une capture Wireshark : 14 octets d’en-tête, puis les données.</p>

<div class="quiz" data-id="q-trame" data-title="La trame Ethernet">
  <div class="q" data-ok="2">
    <p class="qt">Dans une capture, une trame a pour EtherType <code>0x86DD</code>. Que transporte-t-elle ?</p>
    <ul><li>Un paquet IPv4</li><li>Un paquet IPv6</li><li>Un message ARP</li><li>Une trame Wi-Fi</li></ul>
    <div class="expl"><p><code>0x86DD</code> = IPv6, <code>0x0800</code> = IPv4, <code>0x0806</code> = ARP. Ces trois valeurs sont à connaître.</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Que fait une carte réseau qui reçoit une trame dont le FCS est incorrect ?</p>
    <ul><li>Elle corrige les bits erronés</li><li>Elle demande à l’émetteur de renvoyer la trame</li><li>Elle la transmet quand même à la couche 3</li><li>Elle détruit la trame</li></ul>
    <div class="expl"><p>Ethernet détecte les erreurs mais ne les corrige pas et ne redemande rien : la trame est simplement détruite. Si les données doivent arriver, c’est une couche supérieure (TCP) qui s’apercevra du manque et retransmettra. Un compteur d’erreurs FCS qui augmente sur un port de commutateur signale souvent un câble défectueux.</p></div>
  </div>
</div>

<h2>Le commutateur</h2>
<h3>Du concentrateur au commutateur</h3>
<p>Le <strong>concentrateur</strong> (hub) répétait chaque signal sur tous ses ports : tous les postes recevaient toutes les trames, et deux postes qui émettaient en même temps provoquaient une <strong>collision</strong>. Les postes devaient alors attendre et réémettre (mécanisme CSMA/CD). Plus il y avait de postes, plus le réseau ralentissait.</p>
<p>Le <strong>commutateur</strong> (switch) est un équipement de couche 2 qui envoie chaque trame <strong>uniquement</strong> vers le port où se trouve le destinataire. Chaque port fonctionne en <strong>full-duplex</strong> (émission et réception simultanées, sur des paires différentes) : il n’y a plus de collisions.</p>

<h3>La table d’adresses MAC</h3>
<p>Pour savoir où envoyer les trames, le commutateur tient une <strong>table d’adresses MAC</strong> (ou table CAM) : pour chaque adresse MAC, le port derrière lequel elle se trouve. Il la remplit tout seul, en observant le trafic :</p>
<ol class="steps">
  <li><strong>Apprentissage</strong> : à chaque trame reçue, le commutateur lit l’adresse MAC <strong>source</strong> et note « cette adresse est derrière ce port ».</li>
  <li><strong>Acheminement</strong> : il lit l’adresse MAC de <strong>destination</strong>. Si elle est dans la table, il envoie la trame <strong>uniquement</strong> sur le port correspondant (et la jette si c’est le port d’arrivée : <em>filtrage</em>).</li>
  <li><strong>Inondation</strong> (<em>flooding</em>) : si la destination est inconnue, ou si c’est l’adresse de diffusion <code>FF:FF:FF:FF:FF:FF</code>, il envoie la trame sur <strong>tous les ports sauf celui d’arrivée</strong>.</li>
  <li><strong>Vieillissement</strong> : une entrée qui n’a pas servi depuis un certain temps (300 secondes par défaut sur un commutateur Cisco) est effacée. La table suit ainsi les postes déplacés.</li>
</ol>
<pre class="code terminal"><span class="pr">SW-A2#</span> show mac address-table
          Mac Address Table
-------------------------------------------
Vlan    Mac Address       Type        Ports
----    -----------       --------    -----
   1    0800.273a.5c01    DYNAMIC     Fa0/1
   1    0800.2791.b24e    DYNAMIC     Fa0/4
Total Mac Addresses for this criterion: 2</pre>
<p><code>DYNAMIC</code> signifie que l’entrée a été apprise automatiquement (par opposition à <code>STATIC</code>, saisie par l’administrateur).</p>

<h3>Exercice : prévoir le comportement d’un commutateur</h3>
<p>Un commutateur vient de démarrer : sa table est vide. Quatre équipements y sont branchés : PC-A sur Fa0/1, PC-B sur Fa0/2, PC-C sur Fa0/3 et le serveur SRV sur Fa0/4. Cinq trames sont émises, dans l’ordre. Pour chacune, indiquer sur quel(s) port(s) le commutateur la fait sortir.</p>
<div class="match" data-id="m-switch" data-label="Prévoir les ports de sortie d’un commutateur" data-options="Fa0/1 seulement|Fa0/2 seulement|Fa0/4 seulement|Fa0/2, Fa0/3 et Fa0/4|Fa0/1, Fa0/3 et Fa0/4|Fa0/1, Fa0/2, Fa0/3 et Fa0/4">
  <div class="r" data-ok="Fa0/2, Fa0/3 et Fa0/4" data-expl="Table vide : le commutateur apprend PC-A sur Fa0/1, mais ne connaît pas SRV. Il inonde : tous les ports sauf Fa0/1.">Trame 1 : PC-A envoie une trame à SRV</div>
  <div class="r" data-ok="Fa0/1 seulement" data-expl="Il apprend SRV sur Fa0/4. PC-A est connu (appris à la trame 1) : envoi sur Fa0/1 seulement.">Trame 2 : SRV répond à PC-A</div>
  <div class="r" data-ok="Fa0/1, Fa0/3 et Fa0/4" data-expl="Il apprend PC-B sur Fa0/2. Une trame de diffusion est toujours inondée : tous les ports sauf le port d’arrivée Fa0/2.">Trame 3 : PC-B envoie une trame de diffusion (FF:FF:FF:FF:FF:FF)</div>
  <div class="r" data-ok="Fa0/4 seulement" data-expl="SRV est connu depuis la trame 2 : envoi direct sur Fa0/4.">Trame 4 : PC-A envoie une nouvelle trame à SRV</div>
  <div class="r" data-ok="Fa0/2 seulement" data-expl="Il apprend PC-C sur Fa0/3. PC-B est connu depuis la trame 3 (sa trame de diffusion lui a permis d’apprendre l’adresse source) : envoi sur Fa0/2.">Trame 5 : PC-C envoie une trame à PC-B</div>
</div>

<div class="answer" data-id="a-table-mac" data-label="Écrire la table MAC après les cinq trames" data-min="40" data-rows="6">
  <p>Écrire le contenu de la table d’adresses MAC du commutateur après ces cinq trames (une ligne par entrée : équipement, port), puis expliquer pourquoi PC-B a été appris alors qu’aucune trame ne lui avait encore été adressée.</p>
  <div class="corr">
    <div class="tables"><div class="tbl"><p class="tbl-name">TABLE MAC</p><table class="data">
      <tr><th>Adresse MAC de</th><th>Port</th><th>Apprise à la trame</th></tr>
      <tr><td>PC-A</td><td>Fa0/1</td><td>1</td></tr>
      <tr><td>SRV</td><td>Fa0/4</td><td>2</td></tr>
      <tr><td>PC-B</td><td>Fa0/2</td><td>3</td></tr>
      <tr><td>PC-C</td><td>Fa0/3</td><td>5</td></tr>
    </table></div></div>
    <p>Le commutateur apprend à partir de l’adresse <strong>source</strong> des trames qu’il reçoit, pas de leur destination. PC-B a <strong>émis</strong> la trame de diffusion de la trame 3 : son adresse est donc apprise à ce moment-là.</p>
  </div>
</div>

<h3>Domaines de collision et domaines de diffusion</h3>
<dl class="def">
  <dt>Domaine de collision</dt><dd>Zone où deux émissions simultanées entrent en collision. Avec un concentrateur, tous les ports formaient un seul domaine ; avec un commutateur, <strong>chaque port</strong> est un domaine séparé (et en full-duplex, il n’y a plus de collision du tout).</dd>
  <dt>Domaine de diffusion</dt><dd>Ensemble des équipements qui reçoivent une trame de diffusion. Un commutateur <strong>propage</strong> les diffusions sur tous ses ports, et les commutateurs reliés entre eux aussi : tout le réseau local forme un seul domaine de diffusion. Seul un <strong>routeur</strong> (ou un découpage en VLAN, vu au chapitre 4) arrête les diffusions.</dd>
</dl>
<p>Pourquoi c’est important : chaque diffusion est traitée par <strong>tous</strong> les postes. Un réseau local trop grand (plusieurs centaines de postes à la M2L, en comptant le Wi-Fi des visiteurs) est ralenti par les diffusions et moins sûr, puisque chacun voit les diffusions des autres. C’est une des raisons du découpage en sous-réseaux (<a href="#p5">partie 5</a>), prévu dans le projet de segmentation de la M2L.</p>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Croire que le commutateur apprend l’adresse de <strong>destination</strong> : il apprend toujours la <strong>source</strong>.</li>
    <li>Penser qu’un commutateur arrête les diffusions : il les propage sur tous ses ports. Seul un routeur (ou un VLAN) les arrête.</li>
    <li>Dépasser les 100 m en cuivre, ou poser du cuivre entre deux bâtiments : dans les deux cas, il faut de la fibre.</li>
  </ul>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p3" data-title="Couches physique et liaison" data-label="Quiz de fin de partie">
  <div class="q" data-ok="2">
    <p class="qt">Combien de bits compte une adresse MAC ?</p>
    <ul><li>32</li><li>48</li><li>64</li><li>128</li></ul>
    <div class="expl"><p>48 bits, soit 6 octets. (32 bits : adresse IPv4 ; 128 bits : adresse IPv6.)</p></div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Que représentent les 3 premiers octets d’une adresse MAC universelle ?</p>
    <ul><li>L’identifiant du fabricant (OUI)</li><li>Le numéro du réseau</li><li>Le numéro de port du commutateur</li><li>Le type de câble</li></ul>
    <div class="expl"><p>Ce sont l’OUI, attribué au fabricant par l’IEEE. Les 3 suivants sont le numéro de la carte chez ce fabricant. Il n’y a pas de « numéro de réseau » dans une adresse MAC : c’est une grande différence avec l’adresse IP.</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Un commutateur reçoit sur Fa0/7 une trame dont l’adresse MAC de destination n’est pas dans sa table. Que fait-il ?</p>
    <ul><li>Il la jette</li><li>Il la renvoie sur Fa0/7</li><li>Il l’envoie sur tous les ports sauf Fa0/7</li><li>Il l’envoie au routeur</li></ul>
    <div class="expl"><p>Destination inconnue : inondation sur tous les ports sauf celui d’arrivée. Quand le destinataire répondra, le commutateur apprendra son port.</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Quelle est la longueur maximale d’une liaison 1000BASE-T entre un poste et un commutateur ?</p>
    <ul><li>10 m</li><li>55 m</li><li>90 m</li><li>100 m</li></ul>
    <div class="expl"><p>100 m au total, dont en général 90 m de câble fixe et 10 m de cordons. 55 m est la limite du 10 Gb/s sur Cat 6.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Un poste neuf affiche une vitesse de liaison de 100 Mb/s sur un port Gigabit avec un câble Cat 6. Quelle est l’hypothèse la plus probable ?</p>
    <ul><li>Le serveur DNS est en panne</li><li>Un fil ou une paire du câble (ou de la prise) est abîmé</li><li>L’adresse IP est en double</li><li>Le Wi-Fi est activé</li></ul>
    <div class="expl"><p>Le 100 Mb/s n’utilise que 2 paires, le Gigabit en utilise 4 : si une paire est défectueuse, la carte se rabat sur 100 Mb/s. C’est un problème de couche 1 : tester ou changer le cordon, puis vérifier la prise.</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Quel équipement arrête la propagation des trames de diffusion ?</p>
    <ul><li>Le concentrateur</li><li>Le commutateur</li><li>Le routeur</li><li>Le point d’accès Wi-Fi</li></ul>
    <div class="expl"><p>Le routeur sépare les domaines de diffusion : il ne transmet pas les trames de diffusion d’un réseau à l’autre.</p></div>
  </div>
</div>

<h1>Observer le réseau avec Wireshark</h1>
<p class="lead">Un technicien de la salle réseau a capturé le trafic de son poste pendant qu’il testait la connexion avec deux commandes <code>ping</code>. À partir de cette capture, il faut retrouver les adresses MAC, les types de trames, les diffusions, et comprendre pourquoi une trame destinée à Internet porte l’adresse MAC du routeur.</p>

<div class="aside caution">
  <p class="aside-title">Consignes</p>
  <ul>
    <li>Outil : <strong>Wireshark</strong> (Windows 11 ou Kubuntu). La capture est fournie : ouvrir un fichier ne demande aucun droit d’administration.</li>
    <li>Travail individuel, <strong>sans IA</strong>. Répondre dans les zones prévues ; la correction se débloque après la rédaction.</li>
    <li>Niveaux : <span class="chip ok">essentiel</span><span class="chip" style="background:var(--accent-soft);color:var(--accent)">intermédiaire</span><span class="chip" style="background:var(--key-soft);color:var(--key)">défi</span></li>
  </ul>
</div>

<h2>Le contexte</h2>
<p>Dans la salle réseau, trois équipements sont reliés au même commutateur :</p>
<div class="tbl-wrap"><table class="data">
  <tr><th>Équipement</th><th>Adresse IPv4</th><th>Adresse MAC</th></tr>
  <tr><td>PC-ETU (poste du technicien, machine virtuelle Debian)</td><td class="mono">192.168.10.21</td><td class="mono">08:00:27:3a:5c:01</td></tr>
  <tr><td>SRV (serveur de la salle)</td><td class="mono">192.168.10.10</td><td class="mono">08:00:27:91:b2:4e</td></tr>
  <tr><td>Routeur Cisco (passerelle vers Internet)</td><td class="mono">192.168.10.254</td><td class="mono">00:00:0c:5e:21:a7</td></tr>
</table></div>
<p>Pendant la capture, le technicien a tapé sur PC-ETU :</p>
<pre class="code terminal"><span class="pr">$</span> ping -c 2 192.168.10.10
<span class="pr">$</span> ping -c 1 9.9.9.9</pre>
<p><code>9.9.9.9</code> est un serveur public sur Internet (le service DNS Quad9) : il n’est donc pas dans le réseau de la salle.</p>

<h2>Prendre en main Wireshark</h2>
<ol class="steps">
  <li>Lancer Wireshark, puis <strong>Fichier &gt; Ouvrir</strong> et choisir <code>capture-tp4-ethernet-arp.pcap</code> (dossier <em>Téléchargements</em>).</li>
  <li>Repérer les trois zones : en haut la <strong>liste des trames</strong> (une ligne par trame), au milieu le <strong>détail</strong> de la trame sélectionnée, couche par couche (cliquer sur les triangles pour déplier), en bas les <strong>octets</strong> bruts en hexadécimal.</li>
  <li>Dans le détail, la ligne <em>Frame</em> donne des informations sur la capture (taille, heure) ; <em>Ethernet II</em> est l’en-tête de couche 2 ; viennent ensuite la couche 3 (<em>Internet Protocol</em>, <em>Address Resolution Protocol</em>…) et au-dessus.</li>
  <li>Cliquer sur un champ du détail surligne les octets correspondants dans la zone du bas : c’est le meilleur moyen de voir où se trouve chaque champ dans la trame.</li>
  <li>La barre <strong>« Appliquer un filtre d’affichage »</strong> (au-dessus de la liste) n’affiche que les trames qui correspondent. Essayer : <code>arp</code>, <code>icmp</code>, <code>eth.dst == ff:ff:ff:ff:ff:ff</code>, <code>eth.type == 0x0806</code>. Effacer le filtre (croix) pour tout revoir.</li>
</ol>
<div class="aside tip">
  <p class="aside-title">Wireshark connaît les fabricants</p>
  <p>Wireshark remplace les 3 premiers octets des adresses MAC par le nom du fabricant (OUI) : <code>PCSSystemtec_3a:5c:01</code> pour une carte virtuelle VirtualBox (OUI <code>08:00:27</code>, enregistré par la société PCS Systemtechnik), <code>Cisco_5e:21:a7</code> pour le routeur. L’adresse complète reste affichée entre parenthèses dans le détail.</p>
</div>

<p>La liste des trames ressemble à ceci (colonnes simplifiées) :</p>
<div class="pick" data-id="k-broadcast" data-ok="2,8" data-label="Repérer les trames de diffusion">

    <tr><td class="num">1</td><td>0.000000</td><td>fe80::a00:27ff:fe3a:5c01</td><td>ff02::2</td><td>ICMPv6</td><td>70</td><td>Router Solicitation</td></tr>

    <tr><td class="num">9</td><td>6.712498</td><td>Cisco_5e:21:a7</td><td>PCSSystemtec_3a:5c:01</td><td>ARP</td><td>60</td><td>192.168.10.254 is at 00:00:0c:5e:21:a7</td></tr>

  <div class="after"><p>Les trames 2 et 8 sont des <strong>requêtes ARP</strong> : PC-ETU connaît l’adresse IP qu’il veut joindre, mais pas l’adresse MAC correspondante ; il demande donc « à tout le monde ». Les réponses (trames 3 et 9) sont envoyées directement au demandeur. La trame 1 n’est pas une diffusion mais une <strong>multidiffusion</strong> (adresse <code>33:33:00:00:00:02</code>) : voir la mission 4.</p></div>

<h2>Mission 1 : lire une trame couche par couche</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Décortiquer la trame 4</summary>
  <div class="task-body">
    <p>Sélectionner la trame 4 et déplier <em>Ethernet II</em> et <em>Internet Protocol Version 4</em>.</p>
    <div class="answer" data-id="e1-trame4" data-label="Mission 1 : champs de la trame 4" data-min="80" data-rows="8" data-kind="code" data-placeholder="MAC destination : …">
      <p>Relever : l’adresse MAC de destination, l’adresse MAC source, la valeur de l’EtherType (en hexadécimal) et le protocole qu’elle désigne, l’adresse IP source, l’adresse IP de destination, le TTL, le protocole transporté par IP, et la longueur totale de la trame. Dire à quel équipement correspond chaque adresse MAC.</p>
      <p class="hint">L’EtherType est le champ <em>Type</em> de la ligne Ethernet II. Le protocole transporté par IP est le champ <em>Protocol</em> de la ligne Internet Protocol.</p>
      <div class="corr">
        <pre class="code">MAC destination : 08:00:27:91:b2:4e  (SRV)
MAC source      : 08:00:27:3a:5c:01  (PC-ETU)
EtherType       : 0x0800 → IPv4
IP source       : 192.168.10.21      (PC-ETU)
IP destination  : 192.168.10.10      (SRV)
TTL             : 64
Protocole       : ICMP (valeur 1)
Longueur        : 98 octets
                  = 14 (en-tête Ethernet) + 20 (en-tête IPv4)
                  + 8 (en-tête ICMP) + 56 (données du ping)</pre>
        <p>SRV est dans le même réseau que PC-ETU : la trame lui est adressée directement, adresses MAC et adresses IP désignent les mêmes machines.</p>
      </div>
    </div>
  </div>
</details>

<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Compter les types de trames</summary>
  <div class="task-body">
    <p>Utiliser les filtres <code>eth.type == 0x0806</code>, <code>eth.type == 0x0800</code> et <code>eth.type == 0x86dd</code>. La barre d’état, en bas de la fenêtre, indique le nombre de trames affichées.</p>
    <div class="quiz" data-id="q-ethertypes" data-title="Les EtherTypes de la capture">
      <div class="q" data-ok="3">
        <p class="qt">Combien de trames de la capture transportent de l’ARP (EtherType <code>0x0806</code>) ?</p>
        <ul><li>2</li><li>3</li><li>4</li><li>6</li></ul>
        <div class="expl"><p>Les trames 2, 3, 8 et 9 : deux requêtes et deux réponses.</p></div>
      </div>
      <div class="q" data-ok="4">
        <p class="qt">Combien de trames transportent de l’IPv4 (EtherType <code>0x0800</code>) ?</p>
        <ul><li>2</li><li>4</li><li>5</li><li>6</li></ul>
        <div class="expl"><p>Les trames 4 à 7, 10 et 11 : les six messages ICMP des deux commandes <code>ping</code> (trois demandes, trois réponses). ICMP est transporté dans IPv4, c’est pourquoi l’EtherType est celui d’IPv4.</p></div>
      </div>
      <div class="q" data-ok="1">
        <p class="qt">Quelle trame transporte de l’IPv6 ?</p>
        <ul><li>La trame 1</li><li>La trame 2</li><li>La trame 10</li><li>Aucune</li></ul>
        <div class="expl"><p>La trame 1 (EtherType <code>0x86dd</code>) : le poste a IPv6 activé et cherche un routeur IPv6 dès qu’il se connecte, sans que l’utilisateur ait rien demandé. On l’étudiera en partie 7.</p></div>
      </div>
    </div>
  </div>
</details>

<h2>Mission 2 : la taille des trames</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>42 octets ou 60 octets ?</summary>
  <div class="task-body">
    <div class="answer" data-id="e2-padding" data-label="Mission 2 : expliquer les tailles 42 et 60 octets" data-min="80" data-rows="6">
      <p>Les requêtes ARP (trames 2 et 8) mesurent 42 octets, les réponses (trames 3 et 9) 60 octets, alors que les messages ARP ont la même taille. Sélectionner la trame 3 et observer la fin du détail. Expliquer la différence, en s’appuyant sur la taille minimale d’une trame Ethernet vue en partie 3. Préciser pourquoi on lit 60 et non 64.</p>
      <p class="hint">Un message ARP mesure 28 octets. Quelle est la taille minimale des données d’une trame ? Qui ajoute le remplissage, et à quel moment la capture a-t-elle « vu » chaque trame ?</p>
      <div class="corr">
        <p>Un message ARP mesure 28 octets ; avec l’en-tête Ethernet (14 octets), on obtient 42 octets. Or les données d’une trame doivent faire au moins 46 octets : la carte réseau ajoute donc 18 octets de <strong>remplissage</strong> (<em>Padding</em>, des zéros, visibles à la fin du détail de la trame 3), soit 14 + 46 = 60 octets, plus le FCS de 4 octets : 64 octets sur le câble.</p>
        <p>La capture a été faite sur PC-ETU. Les trames <strong>envoyées</strong> par PC-ETU sont capturées <strong>avant</strong> que sa carte ajoute le remplissage : 42 octets. Les trames <strong>reçues</strong> sont capturées telles qu’elles sont arrivées, déjà complétées : 60 octets. On lit 60 et non 64 parce que la carte réseau vérifie puis retire le FCS avant de transmettre la trame au système, donc avant Wireshark.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 3 : sortir du réseau local</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Une trame pour Internet adressée au routeur</summary>
  <div class="task-body">
    <div class="pick" data-id="k-gw" data-ok="9,11" data-label="Repérer les trames émises par le routeur">
      <div class="pq"><p>Le tableau ci-dessous ne montre pas les adresses MAC. Chercher dans Wireshark, puis cliquer sur les trames dont l’<strong>adresse MAC source</strong> est celle du routeur, <code>00:00:0c:5e:21:a7</code>. Le filtre <code>eth.src == 00:00:0c:5e:21:a7</code> permet de vérifier.</p></div>
      <div class="tbl-wrap"><table class="data"><thead><tr><th class="num">N°</th><th>IP source</th><th>IP destination</th><th>Protocole</th><th>Info</th></tr></thead><tbody>
        <tr><td class="num">1</td><td>fe80::a00:27ff:fe3a:5c01</td><td>ff02::2</td><td>ICMPv6</td><td>Router Solicitation</td></tr>
        <tr><td class="num">2</td><td>—</td><td>—</td><td>ARP</td><td>Who has 192.168.10.10?</td></tr>
        <tr><td class="num">3</td><td>—</td><td>—</td><td>ARP</td><td>192.168.10.10 is at …</td></tr>
        <tr><td class="num">4</td><td>192.168.10.21</td><td>192.168.10.10</td><td>ICMP</td><td>Echo request</td></tr>
        <tr><td class="num">5</td><td>192.168.10.10</td><td>192.168.10.21</td><td>ICMP</td><td>Echo reply</td></tr>
        <tr><td class="num">6</td><td>192.168.10.21</td><td>192.168.10.10</td><td>ICMP</td><td>Echo request</td></tr>
        <tr><td class="num">7</td><td>192.168.10.10</td><td>192.168.10.21</td><td>ICMP</td><td>Echo reply</td></tr>
        <tr><td class="num">8</td><td>—</td><td>—</td><td>ARP</td><td>Who has 192.168.10.254?</td></tr>
        <tr><td class="num">9</td><td>—</td><td>—</td><td>ARP</td><td>192.168.10.254 is at …</td></tr>
        <tr><td class="num">10</td><td>192.168.10.21</td><td>9.9.9.9</td><td>ICMP</td><td>Echo request</td></tr>
        <tr><td class="num">11</td><td>9.9.9.9</td><td>192.168.10.21</td><td>ICMP</td><td>Echo reply</td></tr>
      </tbody></table></div>
      <div class="after"><p>La trame 11 a pour adresse IP source <code>9.9.9.9</code>, mais pour adresse MAC source celle du <strong>routeur</strong> : c’est le routeur qui a fabriqué cette trame pour la livrer sur le réseau local. Le serveur 9.9.9.9, lui, est très loin et n’a jamais émis de trame sur ce réseau.</p></div>
    </div>

    <div class="answer" data-id="e3-passerelle" data-label="Mission 3 : pourquoi la trame 10 est adressée au routeur" data-min="100" data-rows="7">
      <p>Ouvrir le détail de la trame 10. a) Relever l’adresse MAC de destination et l’adresse IP de destination. b) Expliquer pourquoi elles ne désignent pas la même machine. c) Expliquer pourquoi PC-ETU a envoyé la requête ARP de la trame 8 juste avant, et pourquoi il ne demande pas l’adresse MAC de 9.9.9.9.</p>
      <p class="hint">Relire la partie 2 : qu’est-ce qui reste identique de bout en bout, qu’est-ce qui change à chaque routeur ?</p>
      <div class="corr">
        <p>a) MAC destination : <code>00:00:0c:5e:21:a7</code> (le routeur) ; IP destination : <code>9.9.9.9</code>.</p>
        <p>b) L’adresse <strong>IP</strong> désigne la destination <strong>finale</strong> et reste la même de bout en bout. L’adresse <strong>MAC</strong> désigne le <strong>prochain équipement</strong> sur le réseau local. 9.9.9.9 n’est pas dans le réseau de la salle : PC-ETU confie donc le paquet à sa <strong>passerelle</strong> (le routeur), qui le fera suivre vers Internet dans une nouvelle trame.</p>
        <p>c) Pour fabriquer la trame, PC-ETU a besoin de l’adresse MAC de sa passerelle (<code>192.168.10.254</code>) ; il ne la connaissait pas encore, d’où la requête ARP de la trame 8. Il ne demande jamais l’adresse MAC de 9.9.9.9 : une requête ARP ne sort pas du réseau local (c’est une diffusion, arrêtée par le routeur), et cette adresse MAC ne lui servirait à rien puisque la trame ne va pas directement à 9.9.9.9.</p>
      </div>
    </div>

    <div class="answer" data-id="e3-ttl" data-label="Mission 3 : TTL et temps de réponse" data-min="60" data-rows="5">
      <p>a) Comparer le TTL des réponses de SRV (trame 5) et de 9.9.9.9 (trame 11). Sachant qu’un système Linux envoie ses paquets avec un TTL de 64 et que chaque routeur traversé diminue le TTL de 1, combien de routeurs la réponse de 9.9.9.9 a-t-elle probablement traversés ? b) Calculer, à partir de la colonne Temps, le temps de réponse (aller-retour) du premier ping vers SRV, puis du ping vers 9.9.9.9. Commenter.</p>
      <p class="hint">Temps de réponse = temps de la réponse − temps de la requête.</p>
      <div class="corr">
        <p>a) Trame 5 : TTL 64 (SRV est dans le même réseau, aucun routeur). Trame 11 : TTL 57. Si le serveur a émis avec un TTL de 64 : 64 − 57 = <strong>7 routeurs</strong> traversés. C’est une estimation : on ne connaît pas avec certitude le TTL de départ choisi par le système de 9.9.9.9 (64 pour Linux, 128 pour Windows, 255 pour de nombreux routeurs).</p>
        <p>b) Vers SRV : 2,105102 − 2,104730 = 0,000372 s, soit <strong>0,372 ms</strong>. Vers 9.9.9.9 : 6,731877 − 6,712530 = 0,019347 s, soit environ <strong>19,3 ms</strong>. Le serveur d’Internet répond environ 50 fois plus lentement : le paquet traverse plusieurs routeurs et parcourt des centaines de kilomètres. Un temps de réponse inférieur à la milliseconde est normal sur un réseau local.</p>
      </div>
    </div>
  </div>
</details>

<h2>Défi : capturer soi-même</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Une capture en direct avec tcpdump dans la machine virtuelle Debian</summary>
  <div class="task-body">
    <p>La capture en direct demande des droits d’administration : on la fait dans la machine virtuelle Debian, dont on est administrateur. Prérequis : la carte réseau de la machine virtuelle en mode <strong>NAT</strong> dans VirtualBox (accès à Internet ; la passerelle de VirtualBox a alors l’adresse <code>10.0.2.2</code>).</p>
    <ol class="steps">
      <li>Installer l’outil de capture en ligne de commande : <code>sudo apt install tcpdump</code>.</li>
      <li>Repérer le nom de la carte : <code>ip link</code> (souvent <code>enp0s3</code>).</li>
      <li>Vider le cache ARP pour forcer de nouvelles requêtes : <code>sudo ip neigh flush all</code>.</li>
      <li>Lancer la capture en arrière-plan, avec affichage des adresses MAC (<code>-e</code>) et sans résolution de noms (<code>-n</code>) : <code>sudo tcpdump -n -e -i enp0s3 arp or icmp &amp;</code></li>
      <li>Taper <code>ping -c 2 10.0.2.2</code>, observer, puis arrêter la capture : <code>sudo pkill tcpdump</code>.</li>
    </ol>
    <div class="answer" data-id="e4-defi" data-kind="code" data-label="Défi : capture en direct commentée" data-min="80" data-rows="8">
      <p>Coller les lignes obtenues, puis annoter : quelle ligne est une diffusion ? quelle est l’adresse MAC de la passerelle de VirtualBox ? retrouve-t-on la même suite d’échanges que dans la capture du TP (requête ARP, réponse ARP, demande d’écho, réponse d’écho) ?</p>
      <div class="corr">
        <p>On obtient une suite de la forme (les adresses et les heures varient) :</p>
        <pre class="code terminal">08:00:27:3a:5c:01 &gt; ff:ff:ff:ff:ff:ff, ethertype ARP (0x0806), length 42: Request who-has 10.0.2.2 tell 10.0.2.15
52:54:00:12:35:02 &gt; 08:00:27:3a:5c:01, ethertype ARP (0x0806), length 60: Reply 10.0.2.2 is-at 52:54:00:12:35:02
08:00:27:3a:5c:01 &gt; 52:54:00:12:35:02, ethertype IPv4 (0x0800), length 98: 10.0.2.15 &gt; 10.0.2.2: ICMP echo request ...
52:54:00:12:35:02 &gt; 08:00:27:3a:5c:01, ethertype IPv4 (0x0800), length 98: 10.0.2.2 &gt; 10.0.2.15: ICMP echo reply ...</pre>
        <p>La première ligne est une diffusion (destination <code>ff:ff:ff:ff:ff:ff</code>). La passerelle virtuelle de VirtualBox répond avec une adresse MAC de la forme <code>52:54:00:12:35:0x</code>. On retrouve exactement la même logique que dans la capture du TP : ARP pour obtenir l’adresse MAC, puis les échanges ICMP, avec les mêmes tailles (42, 60 et 98 octets).</p>
      </div>
    </div>
  </div>
</details>

<template data-page="p4">
<h1>L’adressage IPv4</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : <a href="#p2">partie 2</a> (couche réseau) et <a href="#tp4">TP 4</a> (rôle de la passerelle). Prévoir une feuille de brouillon : <strong>les conversions binaires se font à la main</strong>, sans calculatrice et <strong>sans IA</strong>. C’est la compétence la plus évaluée du chapitre, en stage comme à l’examen.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Adresse IPv4</div><ul>
  <li><span><b>32 bits</b> : 4 octets en notation décimale pointée</span></li>
  <li><span><b>Binaire</b> : 128 64 32 16 8 4 2 1</span></li>
  <li><span><b>Masque</b> : partie réseau / partie hôte, /n</span></li>
  <li><span><b>Calculs</b> : réseau, diffusion, plage, nombre d’hôtes</span></li>
  <li><span><b>Passerelle</b> : local ou distant ?</span></li>
  <li><span><b>Adresses particulières</b> : privées, bouclage, APIPA</span></li>
</ul></div></figure>

<p class="lead">L’adresse MAC désigne une carte, mais elle ne dit pas <em>où</em> se trouve cette carte. Pour acheminer un paquet à travers des milliers de réseaux, il faut une adresse <strong>hiérarchique</strong>, qui indique d’abord le réseau, puis l’hôte dans ce réseau : c’est l’adresse IP. Cette partie donne la méthode pour tout calculer à partir d’une adresse et d’un masque.</p>

<h2>Le rôle de l’adresse IP</h2>
<p>L’adresse IP est une adresse <strong>logique</strong> de couche 3, attribuée à une interface réseau par configuration (manuelle ou automatique). Elle a deux parties :</p>
<ul>
  <li>la <strong>partie réseau</strong> (le préfixe), identique pour tous les hôtes d’un même réseau ;</li>
  <li>la <strong>partie hôte</strong>, qui distingue les hôtes à l’intérieur de ce réseau.</li>
</ul>
<div class="aside tip">
  <p class="aside-title">MAC et IP : l’analogie du numéro de sécurité sociale et de l’adresse postale</p>
  <p>L’adresse MAC ressemble à un numéro de sécurité sociale : unique, mais il ne dit pas où habite la personne. L’adresse IP ressemble à une adresse postale : elle change quand on déménage (un portable qui passe du réseau de la M2L à la box de la maison change d’adresse IP, pas d’adresse MAC), et elle est hiérarchique : le code postal (partie réseau) permet de trier le courrier sans connaître la rue (partie hôte). Les routeurs ne regardent que la « partie code postal ».</p>
</div>

<h2>Format d’une adresse IPv4</h2>
<p>Une adresse IPv4 compte <strong>32 bits</strong>, soit 4 octets. On l’écrit en <strong>notation décimale pointée</strong> : la valeur de chaque octet en décimal (de 0 à 255), séparée par des points. Exemple : <code>192.168.10.21</code>. Il existe 2<sup>32</sup> = 4 294 967 296 adresses IPv4, soit environ 4,3 milliards : beaucoup moins que le nombre d’appareils connectés aujourd’hui, d’où IPv6 (<a href="#p7">partie 7</a>).</p>

<h3>Rappel : le binaire</h3>
<p>Un octet est formé de 8 bits. Chaque position a un <strong>poids</strong>, qui double de droite à gauche :</p>
<div class="tbl-wrap"><table class="data bits">
  <tr><th>Poids</th><th>128</th><th>64</th><th>32</th><th>16</th><th>8</th><th>4</th><th>2</th><th>1</th><th>Valeur</th></tr>
  <tr><td>Bits</td><td>1</td><td>0</td><td>1</td><td>0</td><td>1</td><td>1</td><td>0</td><td>0</td><td>128 + 32 + 8 + 4 = <strong>172</strong></td></tr>
  <tr><td>Bits</td><td>1</td><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>128 + 64 = <strong>192</strong></td></tr>
  <tr><td>Bits</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td><strong>255</strong> (valeur maximale)</td></tr>
</table></div>
<p><strong>Binaire → décimal</strong> : additionner les poids des bits à 1.</p>
<p><strong>Décimal → binaire</strong> (méthode des soustractions) : pour chaque poids, de 128 à 1, si le poids « rentre » dans ce qui reste, écrire 1 et le soustraire ; sinon écrire 0.</p>
<pre class="code">Convertir 168 :
168 ≥ 128 → 1, reste 40
 40 ≥ 64 ? non → 0
 40 ≥ 32 → 1, reste 8
  8 ≥ 16 ? non → 0
  8 ≥ 8  → 1, reste 0
  puis 0, 0, 0
168 = 1010 1000</pre>

<div class="answer" data-id="a-conv" data-kind="code" data-label="Conversions binaire et décimal" data-min="60" data-rows="6">
  <p>Sans calculatrice : a) écrire <code>192.168.10.21</code> en binaire ; b) écrire <code>10.0.2.15</code> en binaire ; c) écrire en décimal <code>11000000.10101000.00000001.11111110</code> ; d) écrire en binaire le masque <code>255.255.255.224</code> et compter ses bits à 1.</p>
  <p class="hint">Toujours écrire 8 bits par octet, en complétant à gauche par des 0.</p>
  <div class="corr">
    <pre class="code">a) 192.168.10.21  = 11000000.10101000.00001010.00010101
   (192 = 128+64 ; 168 = 128+32+8 ; 10 = 8+2 ; 21 = 16+4+1)
b) 10.0.2.15      = 00001010.00000000.00000010.00001111
c) 11000000.10101000.00000001.11111110 = 192.168.1.254
   (11111110 = 255 − 1 = 254)
d) 255.255.255.224 = 11111111.11111111.11111111.11100000
   → 27 bits à 1 (224 = 128+64+32)</pre>
  </div>
</div>

<h2>Le masque de sous-réseau</h2>
<p>Le <strong>masque</strong> indique quelle partie de l’adresse est la partie réseau. Il compte aussi 32 bits : des <strong>1</strong> pour la partie réseau, puis des <strong>0</strong> pour la partie hôte. Les 1 sont toujours <strong>contigus</strong>, à gauche.</p>
<dl class="def">
  <dt>Notation décimale</dt><dd><code>255.255.255.0</code> : 24 bits à 1, puis 8 bits à 0.</dd>
  <dt>Notation CIDR <small>préfixe, « slash »</small></dt><dd><code>/24</code> : le nombre de bits à 1. On écrit l’adresse et son masque ensemble : <code>192.168.10.21/24</code>.</dd>
</dl>
<p>Un octet de masque ne peut prendre que <strong>9 valeurs</strong> :</p>
<div class="tbl-wrap"><table class="data bits">
  <tr><th>Bits à 1 dans l’octet</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr>
  <tr><td>Valeur</td><td>0</td><td>128</td><td>192</td><td>224</td><td>240</td><td>248</td><td>252</td><td>254</td><td>255</td></tr>
  <tr><td>Taille de bloc (256 − valeur)</td><td>—</td><td>128</td><td>64</td><td>32</td><td>16</td><td>8</td><td>4</td><td>2</td><td>1</td></tr>
</table></div>
<p>Masques à connaître par cœur : /8 = <code>255.0.0.0</code>, /16 = <code>255.255.0.0</code>, /24 = <code>255.255.255.0</code>, /25 = <code>…255.128</code>, /26 = <code>…255.192</code>, /27 = <code>…255.224</code>, /28 = <code>…255.240</code>, /29 = <code>…255.248</code>, /30 = <code>…255.252</code>.</p>
<div class="quiz" data-id="q-masque" data-title="Reconnaître un masque valide">
  <div class="q" data-ok="3">
    <p class="qt">Lequel de ces masques est valide ?</p>
    <ul><li>255.255.0.255</li><li>255.255.250.0</li><li>255.255.248.0</li><li>255.0.255.0</li></ul>
    <p class="hint">Les 1 doivent être contigus, et chaque octet doit faire partie des 9 valeurs possibles.</p>
    <div class="expl"><p><code>255.255.248.0</code> = /21 (8 + 8 + 5 bits à 1). <code>255.255.0.255</code> et <code>255.0.255.0</code> ont des 1 après des 0 ; <code>250</code> = 11111010 n’est pas une valeur de masque.</p></div>
  </div>
</div>

<h2>Calculer les caractéristiques d’un réseau</h2>
<p>À partir d’une adresse et de son masque, on calcule quatre éléments :</p>
<dl class="def">
  <dt>Adresse de réseau</dt><dd>Tous les bits de la partie hôte à <strong>0</strong>. Elle désigne le réseau lui-même et ne peut pas être donnée à un hôte. On l’obtient par un <strong>ET logique</strong> bit à bit entre l’adresse et le masque (1 ET 1 = 1, sinon 0).</dd>
  <dt>Adresse de diffusion <small>broadcast</small></dt><dd>Tous les bits de la partie hôte à <strong>1</strong>. Un paquet envoyé à cette adresse est reçu par tous les hôtes du réseau. Elle ne peut pas non plus être donnée à un hôte.</dd>
  <dt>Plage d’adresses utilisables</dt><dd>De l’adresse de réseau + 1 à l’adresse de diffusion − 1.</dd>
  <dt>Nombre d’hôtes</dt><dd>Avec <em>h</em> bits pour la partie hôte : <strong>2<sup>h</sup> − 2</strong> (on retire l’adresse de réseau et l’adresse de diffusion). Avec /24 : h = 32 − 24 = 8, soit 2<sup>8</sup> − 2 = 254 hôtes.</dd>
</dl>

<h3>Méthode 1 : en binaire (la méthode de référence)</h3>
<p>Exemple : <code>192.168.10.77/26</code>. Les trois premiers octets du masque valent 255 : ils sont recopiés. Seul le dernier octet est à calculer.</p>
<div class="tbl-wrap"><table class="data bits">
  <tr><th></th><th colspan="2">Partie réseau (2 bits)</th><th colspan="6">Partie hôte (6 bits)</th><th>Décimal</th></tr>
  <tr><td>Adresse (77)</td><td>0</td><td>1</td><td>0</td><td>0</td><td>1</td><td>1</td><td>0</td><td>1</td><td>77</td></tr>
  <tr><td>Masque (192)</td><td>1</td><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>192</td></tr>
  <tr class="hl"><td>Réseau (hôte à 0)</td><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td><strong>64</strong></td></tr>
  <tr class="hl"><td>Diffusion (hôte à 1)</td><td>0</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td><strong>127</strong></td></tr>
</table></div>
<p>Résultat : réseau <code>192.168.10.64</code>, diffusion <code>192.168.10.127</code>, plage <code>192.168.10.65</code> à <code>192.168.10.126</code>, 2<sup>6</sup> − 2 = <strong>62 hôtes</strong>.</p>

<h3>Méthode 2 : la taille de bloc (la méthode rapide)</h3>
<ol class="steps">
  <li>Repérer l’<strong>octet « intéressant »</strong> : celui où le masque n’est ni 255 ni 0.</li>
  <li>Calculer la <strong>taille de bloc</strong> : 256 − valeur du masque dans cet octet.</li>
  <li>Les réseaux commencent aux <strong>multiples</strong> de la taille de bloc (0, bloc, 2 × bloc…) dans cet octet. L’adresse de réseau est le plus grand multiple inférieur ou égal à la valeur de l’adresse ; les octets suivants passent à 0.</li>
  <li>L’adresse de diffusion est le réseau suivant − 1 ; les octets suivants passent à 255.</li>
</ol>
<p>Exemple : <code>172.16.45.130/20</code>.</p>
<pre class="code">Masque /20       = 255.255.240.0 → octet intéressant : le 3e (240)
Taille de bloc   = 256 − 240 = 16
Multiples de 16  : 0, 16, 32, 48, 64…   → 32 ≤ 45 &lt; 48
Réseau           = 172.16.32.0
Diffusion        = 172.16.47.255   (48 − 1 = 47, puis 255)
Plage            = 172.16.32.1 à 172.16.47.254
Hôtes            = 2^(32−20) − 2 = 2^12 − 2 = 4 094</pre>
<p>Attention : dans ce réseau, <code>172.16.40.0</code> ou <code>172.16.33.255</code> sont des adresses d’hôte <strong>tout à fait valides</strong>. Une adresse qui se termine par 0 ou 255 n’est pas forcément une adresse de réseau ou de diffusion : tout dépend du masque.</p>

<div class="answer" data-id="a-calc" data-kind="code" data-label="Calculer réseau, diffusion, plage et nombre d’hôtes" data-min="120" data-rows="12">
  <p>Pour chacune des adresses suivantes, donner l’adresse de réseau, l’adresse de diffusion, la plage utilisable et le nombre d’hôtes. Montrer la méthode (taille de bloc ou binaire). a) <code>192.168.1.200/27</code> ; b) <code>10.45.200.17/8</code> ; c) <code>172.20.130.5/18</code>.</p>
  <p class="hint">c) /18 = 16 + 2 : l’octet intéressant est le 3e, avec un masque de 192.</p>
  <div class="corr">
    <pre class="code">a) 192.168.1.200/27 : masque 255.255.255.224, bloc 256−224 = 32
   multiples : 0,32,64,96,128,160,192,224 → 192 ≤ 200 &lt; 224
   réseau 192.168.1.192   diffusion 192.168.1.223
   plage 192.168.1.193 à 192.168.1.222   2^5 − 2 = 30 hôtes

b) 10.45.200.17/8 : masque 255.0.0.0, seul le 1er octet est réseau
   réseau 10.0.0.0   diffusion 10.255.255.255
   plage 10.0.0.1 à 10.255.255.254   2^24 − 2 = 16 777 214 hôtes

c) 172.20.130.5/18 : masque 255.255.192.0, bloc 256−192 = 64 (3e octet)
   multiples : 0,64,128,192 → 128 ≤ 130 &lt; 192
   réseau 172.20.128.0   diffusion 172.20.191.255
   plage 172.20.128.1 à 172.20.191.254   2^14 − 2 = 16 382 hôtes</pre>
  </div>
</div>

<h2>Local ou distant : le rôle de la passerelle</h2>
<p>Avant d’envoyer un paquet, un hôte se pose une seule question : <strong>la destination est-elle dans mon réseau ?</strong> Il applique <strong>son propre masque</strong> à l’adresse de destination et compare le résultat à son adresse de réseau.</p>
<ul>
  <li><strong>Même réseau</strong> : envoi <strong>direct</strong>. L’hôte cherche l’adresse MAC du destinataire (ARP) et lui adresse la trame.</li>
  <li><strong>Réseau différent</strong> : envoi à la <strong>passerelle par défaut</strong> (<em>default gateway</em>), le routeur du réseau local. L’hôte cherche l’adresse MAC de la passerelle et lui confie le paquet, qui garde l’adresse IP de la destination finale. C’est exactement ce qu’on a observé avec <code>9.9.9.9</code> au <a href="#tp4">TP 4</a>.</li>
</ul>
<p>Conséquence : la passerelle doit être <strong>dans le même réseau</strong> que l’hôte. Sinon, l’hôte ne peut pas la joindre et rien ne sort du réseau local.</p>
<pre class="code">Poste 192.168.10.77/26 (réseau 192.168.10.64) veut joindre 192.168.10.130
192.168.10.130 ET 255.255.255.192 = 192.168.10.128   ≠ 192.168.10.64
→ réseau différent : envoi à la passerelle</pre>

</div>

<h2>Les différents types d’adresses</h2>
<h3>Envoi individuel, diffusion, multidiffusion</h3>
<dl class="def">
  <dt>Unicast <small>individuel</small></dt><dd>D’un hôte à un seul hôte. Le cas général.</dd>
  <dt>Broadcast <small>diffusion</small></dt><dd>À tous les hôtes d’un réseau : adresse de diffusion du réseau (<code>192.168.10.127</code> pour le réseau .64/26), ou <code>255.255.255.255</code>, la diffusion « limitée » au réseau local, utilisée par exemple par un poste qui cherche un serveur DHCP alors qu’il n’a pas encore d’adresse. Les routeurs ne transmettent pas les diffusions.</dd>
  <dt>Multicast <small>multidiffusion</small></dt><dd>À un groupe d’hôtes abonnés : plage <code>224.0.0.0</code> à <code>239.255.255.255</code> (<code>224.0.0.0/4</code>). Utilisé par des protocoles de routage, la diffusion vidéo…</dd>
</dl>

<h3>Les adresses privées et publiques</h3>
<p>Les <strong>adresses publiques</strong> sont uniques sur Internet ; elles sont attribuées par des organismes (l’IANA, puis, pour l’Europe, le RIPE NCC) aux opérateurs, qui les louent à leurs clients. Les <strong>adresses privées</strong> (RFC 1918) sont réservées aux réseaux internes : chacun peut les utiliser chez soi, elles ne sont <strong>jamais routées sur Internet</strong>.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Plage privée</th><th>Préfixe</th><th>Exemples d’usage</th></tr>
  <tr><td>10.0.0.0 à 10.255.255.255</td><td><code>10.0.0.0/8</code></td><td>Grandes entreprises, réseau NAT de VirtualBox (10.0.2.0/24)</td></tr>
  <tr><td>172.16.0.0 à 172.31.255.255</td><td><code>172.16.0.0/12</code></td><td>Entreprises (le contexte M2L utilise 172.16.x.x)</td></tr>
  <tr><td>192.168.0.0 à 192.168.255.255</td><td><code>192.168.0.0/16</code></td><td>Box des particuliers, petites structures</td></tr>
</table></div>
<p>Pour qu’un poste en adresse privée accède à Internet, le routeur de sortie remplace l’adresse privée par son adresse publique : c’est la <strong>traduction d’adresses</strong> (<strong>NAT</strong>), étudiée au chapitre 4.</p>

<h3>Les autres adresses particulières</h3>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Adresse ou plage</th><th>Nom</th><th>Signification</th></tr>
  <tr><td><code>127.0.0.0/8</code> (surtout <code>127.0.0.1</code>)</td><td>Bouclage (<em>loopback</em>, <code>localhost</code>)</td><td>La machine elle-même. Un <code>ping 127.0.0.1</code> teste la pile TCP/IP du poste, sans passer par la carte réseau.</td></tr>
  <tr><td><code>169.254.0.0/16</code></td><td>APIPA (adresse de lien local)</td><td>Adresse que Windows (et souvent Linux) se donne <strong>tout seul</strong> quand il n’a reçu aucune réponse d’un serveur DHCP. <strong>Symptôme classique</strong> : un poste en 169.254.x.x n’a pas pu obtenir d’adresse, il faut chercher du côté du câble, du commutateur ou du serveur DHCP.</td></tr>
  <tr><td><code>0.0.0.0</code></td><td>Adresse non spécifiée</td><td>« Aucune adresse » (poste qui démarre) ou, dans une table de routage, « toutes les destinations » (route par défaut).</td></tr>
  <tr><td><code>255.255.255.255</code></td><td>Diffusion limitée</td><td>Tous les hôtes du réseau local.</td></tr>
  <tr><td><code>100.64.0.0/10</code></td><td>Espace partagé des opérateurs (CGNAT)</td><td>Utilisé par certains opérateurs (box 4G/5G, fibre) qui partagent une adresse publique entre plusieurs clients.</td></tr>
</table></div>

<div class="aside deep">
  <p class="aside-title">Les classes d’adresses : une notion historique</p>
  <p>Jusqu’en 1993, le masque n’existait pas : la taille du réseau se déduisait du premier octet. <strong>Classe A</strong> (1 à 126) : masque /8 ; <strong>classe B</strong> (128 à 191) : /16 ; <strong>classe C</strong> (192 à 223) : /24 ; classe D (224 à 239) : multicast ; classe E (240 à 255) : réservée. Ce système gaspillait énormément d’adresses : une entreprise de 300 postes recevait une classe B de 65 534 adresses. Le <strong>CIDR</strong> (<em>Classless Inter-Domain Routing</em>, RFC 1519 en 1993, aujourd’hui RFC 4632) a supprimé les classes : le masque peut avoir n’importe quelle longueur. On entend encore « une classe C » pour dire « un /24 » : c’est un abus de langage, à éviter dans un document technique.</p>
</div>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Oublier le « − 2 » dans le nombre d’hôtes, ou attribuer l’adresse de réseau ou de diffusion à un hôte.</li>
    <li>Croire qu’une adresse en .0 ou en .255 est toujours interdite : avec un masque plus court que /24, ce sont souvent des adresses d’hôte valides.</li>
    <li>Configurer une passerelle qui n’est pas dans le réseau du poste : le poste communique avec ses voisins mais pas avec l’extérieur.</li>
  </ul>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p4" data-title="L’adressage IPv4" data-label="Quiz de fin de partie">
  <div class="q" data-ok="2">
    <p class="qt">Quelle est l’adresse de réseau de <code>192.168.5.157/28</code> ?</p>
    <ul><li>192.168.5.128</li><li>192.168.5.144</li><li>192.168.5.150</li><li>192.168.5.156</li></ul>
    <p class="hint">/28 : masque 240, taille de bloc 16.</p>
    <div class="expl"><p>Multiples de 16 : …, 128, 144, 160. 144 ≤ 157 &lt; 160 : réseau 192.168.5.144 (diffusion .159).</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Combien d’hôtes peut contenir un réseau /27 ?</p>
    <ul><li>32</li><li>27</li><li>62</li><li>30</li></ul>
    <div class="expl"><p>32 − 27 = 5 bits d’hôte : 2<sup>5</sup> − 2 = 30.</p></div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Un poste Windows affiche l’adresse <code>169.254.83.12</code>. Que faut-il en conclure ?</p>
    <ul><li>Il n’a pas obtenu de réponse d’un serveur DHCP</li><li>Il est correctement configuré en adresse privée</li><li>Il a une adresse publique</li><li>Il est connecté en Wi-Fi</li></ul>
    <div class="expl"><p>169.254.x.x est une adresse APIPA, que le poste se donne lui-même faute de serveur DHCP joignable. Vérifier le câble, le port du commutateur et le service DHCP.</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Le poste <code>10.1.1.20/24</code> a pour passerelle <code>10.1.2.1</code>. Que se passe-t-il ?</p>
    <ul><li>Tout fonctionne</li><li>Le poste ne joint plus ses voisins du réseau 10.1.1.0/24</li><li>Le poste joint ses voisins, mais aucune destination hors de son réseau</li><li>Le poste obtient une adresse APIPA</li></ul>
    <div class="expl"><p>La passerelle 10.1.2.1 n’est pas dans le réseau 10.1.1.0/24 : le poste ne peut pas la joindre. Les échanges directs avec le réseau local fonctionnent, mais rien ne sort.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Quelle notation correspond au masque <code>255.255.252.0</code> ?</p>
    <ul><li>/20</li><li>/22</li><li>/24</li><li>/26</li></ul>
    <div class="expl"><p>8 + 8 + 6 (252 = 11111100) + 0 = 22 bits à 1.</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Que teste <code>ping 127.0.0.1</code> ?</p>
    <ul><li>La liaison avec la passerelle</li><li>L’accès à Internet</li><li>Le fonctionnement de la pile TCP/IP de la machine elle-même</li><li>Le câble réseau</li></ul>
    <div class="expl"><p>127.0.0.1 est l’adresse de bouclage : le paquet ne sort pas de la machine. Si ce ping échoue, le problème vient du système lui-même.</p></div>
  </div>
</div>

  <p class="aside-title">La suite</p>
  <p>Le <a href="#tp5">TP 5</a> entraîne aux calculs, puis fait configurer des adresses IPv4 sous Windows et sous Linux, dans Packet Tracer et dans des machines virtuelles.</p>
</div>

<template data-page="tp5">
<h1>Calculer et configurer des adresses IPv4</h1>
<p class="lead">Le service informatique de la M2L prépare un réseau de test, <code>192.168.50.0/26</code>, pour valider de nouveaux serveurs avant leur mise en service. Il faut d’abord maîtriser les calculs, diagnostiquer des erreurs de configuration signalées par des tickets, puis configurer des adresses dans Packet Tracer et dans deux machines virtuelles (Debian et Windows Server 2019).</p>

<div class="aside caution">
  <p class="aside-title">Consignes</p>
  <ul>
    <li>Outils : <strong>Cisco Packet Tracer</strong> (mission 3) et <strong>VirtualBox</strong> avec une machine virtuelle Debian et une machine virtuelle Windows Server 2019 (mission 4). Les missions 1 et 2 se font sur papier.</li>
    <li><strong>Sans IA et sans calculatrice</strong> pour les missions 1 et 2.</li>
    <li>Ne jamais modifier la configuration réseau d’un poste physique du lycée : uniquement dans Packet Tracer et dans les machines virtuelles.</li>
    <li>Avant chaque test, <strong>écrire le résultat attendu</strong> : un test sans prévision ne prouve rien.</li>
  </ul>
</div>

<h2>Le réseau de test</h2>
<div class="tbl-wrap"><table class="data">
  <tr><th>Élément</th><th>Valeur</th></tr>
  <tr><td>Réseau</td><td class="mono">192.168.50.0/26 (masque 255.255.255.192)</td></tr>
  <tr><td>Convention de la M2L</td><td>passerelle = dernière adresse utilisable ; serveurs à partir de .10 ; postes de test à partir de .11</td></tr>
  <tr><td>SRV-DEB (Debian)</td><td class="mono">192.168.50.10</td></tr>
  <tr><td>SRV-WIN (Windows Server 2019)</td><td class="mono">192.168.50.20</td></tr>
  <tr><td>Passerelle (routeur, pas encore installé)</td><td class="mono">192.168.50.62</td></tr>
</table></div>

<h2>Mission 1 : s’entraîner au calcul</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Cinq adresses à analyser</summary>
  <div class="task-body">
    <div class="answer" data-id="m1-calc" data-kind="code" data-label="Mission 1 : réseau, diffusion, plage, hôtes de cinq adresses" data-min="200" data-rows="14" data-placeholder="1) réseau … diffusion … plage … hôtes …">
      <p>Pour chaque adresse : adresse de réseau, adresse de diffusion, plage utilisable, nombre d’hôtes. Indiquer la taille de bloc utilisée.</p>
      <ol>
        <li><code>192.168.50.10/26</code></li>
        <li><code>172.16.2.200/25</code></li>
        <li><code>10.10.10.10/30</code></li>
        <li><code>172.18.77.77/21</code></li>
        <li><code>192.168.0.1/23</code></li>
      </ol>
      <p class="hint">/21 et /23 : l’octet intéressant est le 3e. /21 = 16 + 5 bits → masque 248 ; /23 = 16 + 7 bits → masque 254.</p>
      <div class="corr">
        <pre class="code">1) /26, bloc 64 (4e octet)        réseau 192.168.50.0     diffusion 192.168.50.63
   plage .1 à .62                  2^6 − 2  = 62 hôtes
2) /25, bloc 128 (4e octet)       réseau 172.16.2.128     diffusion 172.16.2.255
   plage .129 à .254               2^7 − 2  = 126 hôtes
3) /30, bloc 4 (4e octet) 8≤10&lt;12 réseau 10.10.10.8       diffusion 10.10.10.11
   plage .9 à .10                  2^2 − 2  = 2 hôtes (liaison entre 2 routeurs)
4) /21, masque 255.255.248.0, bloc 8 (3e octet), 72 ≤ 77 &lt; 80
   réseau 172.18.72.0   diffusion 172.18.79.255
   plage 172.18.72.1 à 172.18.79.254   2^11 − 2 = 2 046 hôtes
5) /23, masque 255.255.254.0, bloc 2 (3e octet), 0 ≤ 0 &lt; 2
   réseau 192.168.0.0   diffusion 192.168.1.255
   plage 192.168.0.1 à 192.168.1.254   2^9 − 2  = 510 hôtes</pre>
      </div>
    </div>
  </div>
</details>

<h2>Mission 2 : traiter des tickets d’incident</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Quatre erreurs de configuration</summary>
  <div class="task-body">
    <p>Dans le réseau de production de l’administration, le réseau des postes est <code>192.168.50.0/26</code> (passerelle <code>.62</code>) et celui des imprimantes <code>192.168.50.64/26</code> (passerelle <code>.126</code>). Quatre tickets arrivent au service informatique.</p>
    <div class="tbl-wrap"><table class="data wide">
      <tr><th>Ticket</th><th>Poste</th><th>Configuration relevée (<code>ipconfig</code>)</th><th>Symptôme décrit par l’utilisateur</th></tr>
      <tr><td>T1</td><td>PC-COMPTA</td><td class="mono">192.168.50.25 / 255.255.255.0 / passerelle 192.168.50.62</td><td>« Internet et les collègues fonctionnent, mais je n’arrive pas à imprimer sur l’imprimante 192.168.50.70. »</td></tr>
      <tr><td>T2</td><td>PC-ACCUEIL</td><td class="mono">192.168.50.40 / 255.255.255.192 / passerelle 192.168.50.1</td><td>« Je vois les dossiers partagés de mes collègues, mais aucun site web. »</td></tr>
      <tr><td>T3</td><td>PC-DIRECTION</td><td class="mono">192.168.50.12 / 255.255.255.192 / passerelle 192.168.50.62</td><td>« Le réseau se coupe de temps en temps, et Windows parle d’un conflit d’adresse. » Le poste PC-RH a la même configuration.</td></tr>
      <tr><td>T4</td><td>PC-STAGIAIRE</td><td class="mono">192.168.50.63 / 255.255.255.192 / passerelle 192.168.50.62</td><td>« Windows refuse ma configuration. »</td></tr>
    </table></div>
    <div class="answer" data-id="m2-tickets" data-label="Mission 2 : diagnostic des quatre tickets" data-min="200" data-rows="10">
      <p>Pour chaque ticket : identifier l’erreur, expliquer le symptôme (en s’appuyant sur le raisonnement « local ou distant »), et proposer la correction.</p>
      <p class="hint">T1 : avec le masque /24, où le poste croit-il que se trouve 192.168.50.70 ? Comment envoie-t-il alors les données ?</p>
      <div class="corr">
        <p><strong>T1</strong> : masque erroné (/24 au lieu de /26). Avec /24, le poste croit que 192.168.50.70 est dans son réseau (192.168.50.0/24) : il envoie une requête ARP directe pour trouver l’imprimante, au lieu de passer par la passerelle. L’imprimante est dans un autre réseau, derrière le routeur : la requête ARP (une diffusion) ne l’atteint jamais et il n’y a pas de réponse. Internet et les collègues fonctionnent, car ces destinations sont bien classées. Correction : masque <code>255.255.255.192</code>.</p>
        <p><strong>T2</strong> : passerelle erronée (<code>.1</code> au lieu de <code>.62</code>). Les échanges avec le réseau local sont directs et fonctionnent ; tout ce qui sort du réseau est envoyé à 192.168.50.1, qui n’est pas le routeur (c’est au mieux un autre poste, qui ignore ces paquets). Correction : passerelle <code>192.168.50.62</code>.</p>
        <p><strong>T3</strong> : <strong>adresse IP en double</strong> avec PC-RH. Les deux postes répondent aux requêtes ARP pour 192.168.50.12 : les autres équipements envoient leurs trames tantôt à l’un, tantôt à l’autre, d’où des coupures. Windows détecte le doublon et l’affiche. Correction : donner à l’un des deux une adresse libre (après vérification dans le plan d’adressage), ou passer les postes en DHCP.</p>
        <p><strong>T4</strong> : <code>192.168.50.63</code> est l’adresse de <strong>diffusion</strong> du réseau 192.168.50.0/26 : elle ne peut pas être attribuée à un hôte. Correction : une adresse libre entre .1 et .61 (la .62 étant la passerelle).</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 3 : configurer dans Packet Tracer</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Trois postes, un commutateur</summary>
  <div class="task-body">
    <ol class="steps">
      <li>Lancer Packet Tracer. Dans la zone des équipements (en bas), choisir <em>Network Devices &gt; Switches</em> et placer un commutateur <strong>2960</strong>. Choisir <em>End Devices</em> et placer trois <strong>PC</strong>.</li>
      <li>Renommer les PC (clic sur le PC, onglet <em>Config</em>, champ <em>Display Name</em>) : PC-A, PC-B, PC-C.</li>
      <li>Câbler : <em>Connections</em> (icône éclair), câble <strong>Copper Straight-Through</strong> (câble droit). Relier <em>FastEthernet0</em> de chaque PC aux ports <em>Fa0/1</em>, <em>Fa0/2</em> et <em>Fa0/3</em> du commutateur. Attendre que les points des liaisons passent au vert (environ 30 secondes).</li>
      <li>Configurer chaque PC : onglet <em>Desktop &gt; IP Configuration</em>, choisir <em>Static</em>, saisir <em>IPv4 Address</em>, <em>Subnet Mask</em> et <em>Default Gateway</em> :
        PC-A <code>192.168.50.11</code>, PC-B <code>192.168.50.12</code>, PC-C <code>192.168.50.75</code>, tous en <code>255.255.255.192</code>, passerelle <code>192.168.50.62</code> pour PC-A et PC-B, <code>192.168.50.126</code> pour PC-C.</li>
      <li>Ouvrir <em>Desktop &gt; Command Prompt</em> sur PC-A. Vérifier avec <code>ipconfig</code>.</li>
    </ol>
    <div class="answer" data-id="m3-essai" data-label="Mission 3 : jeu d’essai (résultats attendus puis obtenus)" data-min="120" data-rows="8">
      <p><strong>Avant de lancer les tests</strong>, écrire le résultat attendu (succès ou échec) et sa justification pour : a) PC-A → <code>ping 192.168.50.12</code> ; b) PC-A → <code>ping 192.168.50.75</code> ; c) PC-A → <code>ping 192.168.50.62</code>. Lancer ensuite les tests et noter les résultats obtenus. Enfin, corriger l’adresse de PC-C en <code>192.168.50.13</code> (passerelle <code>.62</code>) et refaire le test b).</p>
      <div class="corr">
        <div class="tbl-wrap"><table class="data">
          <tr><th>Test</th><th>Attendu</th><th>Justification</th></tr>
          <tr><td>a) vers .12</td><td>Succès</td><td>Même réseau 192.168.50.0/26 : envoi direct. Réponse de la forme <code>Reply from 192.168.50.12: bytes=32 time&lt;1ms TTL=128</code>.</td></tr>
          <tr><td>b) vers .75</td><td>Échec</td><td>.75 est dans le réseau 192.168.50.64/26 : PC-A l’envoie à sa passerelle .62, qui n’existe pas (pas de routeur). <code>Request timed out.</code></td></tr>
          <tr><td>c) vers .62</td><td>Échec</td><td>Aucun équipement n’a cette adresse pour l’instant. Le jeu d’essai doit aussi prévoir les échecs « normaux ».</td></tr>
          <tr><td>b) après correction</td><td>Succès</td><td>PC-C (.13) est maintenant dans le réseau de PC-A.</td></tr>
        </table></div>
        <p>Le tout premier ping peut perdre une réponse (<em>Request timed out</em> puis 3 réponses) : le temps de la requête ARP. C’est normal.</p>
      </div>
    </div>
    <div class="aside tip">
      <p class="aside-title">Voir les trames passer</p>
      <p>Passer en mode <strong>Simulation</strong> (en bas à droite), filtrer sur ARP et ICMP (<em>Edit Filters</em>), relancer un <code>ping</code> et avancer avec <em>Capture/Forward</em>. On voit la requête ARP partir vers tous les PC (diffusion), la réponse revenir, puis l’écho ICMP : exactement la capture du <a href="#tp4">TP 4</a>. Cliquer sur une enveloppe affiche son contenu couche par couche (<em>OSI Model</em>).</p>
    </div>
    <p>Enregistrer le fichier sous <code>TP5-NOM-Prenom.pkt</code> (<em>File &gt; Save As</em>) et le déposer dans son dépôt GitHub ou sur Teams.</p>
  </div>
</details>

<h2>Mission 4 : configurer Debian et Windows Server</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Deux serveurs virtuels sur un réseau interne</summary>
  <div class="task-body">
    <h3>Préparer VirtualBox</h3>
    <ol class="steps">
      <li>Machine virtuelle éteinte : <em>Configuration &gt; Réseau &gt; Carte 1</em>, <em>Mode d’accès réseau</em> : <strong>Réseau interne</strong>, nom : <code>tp5</code>. Faire de même pour la seconde machine virtuelle, avec <strong>le même nom</strong>.</li>
      <li>Démarrer les deux machines. Elles sont maintenant reliées entre elles comme par un commutateur, sans accès au réseau du lycée : aucun risque de conflit.</li>
    </ol>

    <h3>Configurer SRV-DEB (Debian)</h3>
    <p>Les commandes suivantes demandent les droits d’administration. Si <code>sudo</code> n’est pas installé, passer administrateur avec <code>su -</code> et taper les commandes sans <code>sudo</code>.</p>
    <pre class="code terminal"><span class="cm"># 1. Repérer le nom de la carte et sa configuration actuelle</span>
<span class="pr">$</span> ip address
<span class="cm"># 2. Configuration temporaire (perdue au redémarrage) : utile pour tester</span>
<span class="pr">$</span> sudo ip address flush dev enp0s3
<span class="pr">$</span> sudo ip address add 192.168.50.10/26 dev enp0s3
<span class="pr">$</span> sudo ip link set enp0s3 up
<span class="pr">$</span> sudo ip route add default via 192.168.50.62
<span class="pr">$</span> ip address show enp0s3
<span class="pr">$</span> ip route</pre>
    <p>Pour que la configuration survive au redémarrage, on l’écrit dans le fichier <code>/etc/network/interfaces</code> (service <em>networking</em> de Debian) : <code>sudo nano /etc/network/interfaces</code>, puis remplacer la ligne <code>iface enp0s3 inet dhcp</code> par :</p>
    <pre class="code"><span class="cm"># Carte du réseau de test — configuration statique</span>
auto enp0s3
iface enp0s3 inet static
    address 192.168.50.10/26
    gateway 192.168.50.62</pre>
    <p>Enregistrer (<kbd>Ctrl</kbd>+<kbd>O</kbd>, <kbd>Entrée</kbd>), quitter (<kbd>Ctrl</kbd>+<kbd>X</kbd>), puis appliquer : <code>sudo systemctl restart networking</code>. En cas de doute, redémarrer la machine (<code>sudo reboot</code>) et vérifier avec <code>ip a</code> que l’adresse est bien là.</p>

    <h3>Configurer SRV-WIN (Windows Server 2019)</h3>
    <p><strong>Méthode graphique</strong> : touche Windows + R, <code>ncpa.cpl</code>, clic droit sur <em>Ethernet</em> &gt; <em>Propriétés</em> &gt; <em>Protocole Internet version 4 (TCP/IPv4)</em> &gt; <em>Propriétés</em> &gt; <em>Utiliser l’adresse IP suivante</em>.</p>
    <p><strong>Méthode PowerShell</strong> (en administrateur), plus rapide à documenter et à reproduire :</p>
    <pre class="code terminal"><span class="pr">PS C:\&gt;</span> Get-NetAdapter
<span class="pr">PS C:\&gt;</span> New-NetIPAddress -InterfaceAlias "Ethernet" -IPAddress 192.168.50.20 -PrefixLength 26 -DefaultGateway 192.168.50.62
<span class="pr">PS C:\&gt;</span> Get-NetIPConfiguration
<span class="pr">PS C:\&gt;</span> ipconfig /all</pre>

    <div class="answer" data-id="m4-essai" data-label="Mission 4 : tests entre Debian et Windows Server" data-min="120" data-rows="8">
      <p>Prévoir puis réaliser : a) depuis SRV-WIN, <code>ping 192.168.50.10</code> ; b) depuis SRV-DEB, <code>ping -c 4 192.168.50.20</code>. Noter les résultats. Si l’un des deux échoue alors que l’autre réussit, proposer une explication, puis la vérifier avec la commande donnée dans l’indice. Recopier enfin la sortie de <code>ip route</code> de SRV-DEB et l’expliquer.</p>
      <p class="hint">Le pare-feu de Windows Server bloque par défaut les demandes d’écho ICMP entrantes. Pour les autoriser : <code>Enable-NetFirewallRule -Name FPS-ICMP4-ERQ-In</code> (PowerShell administrateur).</p>
      <div class="corr">
        <p>a) Succès : Debian répond aux demandes d’écho par défaut. b) <strong>Échec</strong> (<code>100% packet loss</code>) tant que le pare-feu de Windows bloque l’ICMP entrant : la configuration IP est pourtant correcte. Après <code>Enable-NetFirewallRule -Name FPS-ICMP4-ERQ-In</code>, le test b) réussit.</p>
        <p>Leçon : <strong>un ping qui échoue ne prouve pas que la machine est injoignable</strong>. Un pare-feu peut bloquer ICMP. Le test dans les deux sens permet de localiser le problème.</p>
        <pre class="code terminal">default via 192.168.50.62 dev enp0s3
192.168.50.0/26 dev enp0s3 proto kernel scope link src 192.168.50.10</pre>
        <p>Selon la version et la méthode de configuration, des mentions comme <code>onlink</code> ou <code>proto static</code> peuvent s’ajouter : elles ne changent pas le sens. Deuxième ligne : le réseau 192.168.50.0/26 est joignable <strong>directement</strong> par la carte enp0s3 (route ajoutée automatiquement à partir de l’adresse et du masque). Première ligne : <strong>toutes les autres destinations</strong> (route par défaut) passent par la passerelle 192.168.50.62. C’est exactement la décision « local ou distant » de la partie 4, écrite sous forme de table de routage.</p>
      </div>
    </div>
  </div>
</details>

<h2>Défi</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Le plus petit réseau commun</summary>
  <div class="task-body">
    <div class="answer" data-id="m5-defi" data-kind="code" data-label="Défi : plus petit réseau contenant deux adresses" data-min="60" data-rows="6">
      <p>Quel est le plus petit réseau (le masque le plus long) qui contient à la fois <code>192.168.50.10</code> et <code>192.168.50.100</code> ? Donner son adresse, son masque et sa diffusion. Méthode : écrire le dernier octet des deux adresses en binaire et chercher le plus long début commun.</p>
      <div class="corr">
        <pre class="code"> 10 = 0000 1010
100 = 0110 0100
       ^ seul le premier bit est commun (0)
Préfixe commun : 24 + 1 = 25 bits
Réseau 192.168.50.0/25 (255.255.255.128), diffusion 192.168.50.127</pre>
        <p>Cette technique (chercher le préfixe commun) sert aussi à <strong>résumer</strong> plusieurs réseaux en une seule route, comme on le verra au chapitre 4.</p>
      </div>
    </div>
    <div class="aside pro">
      <p class="aside-title">Et sur un poste Kubuntu ?</p>
      <p>Les postes de bureau Linux (Kubuntu, Ubuntu) utilisent <strong>NetworkManager</strong> : on configure par l’applet réseau ou par la commande <code>nmcli</code>, par exemple <code>nmcli con show</code> pour voir le nom de la connexion, puis <code>nmcli con mod "Connexion filaire 1" ipv4.method manual ipv4.addresses 192.168.50.30/26 ipv4.gateway 192.168.50.62</code> et <code>nmcli con up "Connexion filaire 1"</code>. À ne faire que dans une machine virtuelle Kubuntu ou sur son ordinateur personnel, jamais sur un poste du lycée.</p>
    </div>
  </div>
</details>

<div class="aside next">
  <p class="aside-title">La suite</p>
  <p>Le réseau de test utilisait un seul /26 « tout prêt ». Comment découper un bloc d’adresses pour donner à chaque service le réseau qui lui convient ? C’est l’objet de la <a href="#p5">partie 5</a>.</p>
</div>
</template>
