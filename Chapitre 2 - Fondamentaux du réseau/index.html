<template data-page="p5">
<h1>Sous-réseaux, VLSM et plan d’adressage</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : <a href="#p4">partie 4</a> et <a href="#tp5">TP 5</a>. Il faut savoir calculer sans hésiter une adresse de réseau et une diffusion avec la taille de bloc. Brouillon obligatoire, <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Découper un bloc</div><ul>
  <li><span><b>Pourquoi</b> : diffusion, sécurité, organisation</span></li>
  <li><span><b>Taille fixe</b> : emprunter n bits → 2<sup>n</sup> sous-réseaux</span></li>
  <li><span><b>Besoin en hôtes</b> : 2<sup>h</sup> − 2 ≥ besoin</span></li>
  <li><span><b>VLSM</b> : du plus grand au plus petit</span></li>
  <li><span><b>Plan d’adressage</b> : le document de référence</span></li>
</ul></div></figure>

<p class="lead">Une organisation reçoit (ou choisit, en adresses privées) un <strong>bloc</strong> d’adresses, puis le découpe en réseaux plus petits, un par service, par usage ou par étage. Bien découpé, le réseau reste lisible, évolutif et facile à sécuriser. Le résultat est consigné dans un <strong>plan d’adressage</strong>, document que tout technicien consulte avant de configurer un équipement.</p>

<h2>Pourquoi découper en sous-réseaux ?</h2>
<ul>
  <li><strong>Limiter les diffusions</strong> : chaque diffusion est traitée par tous les hôtes du réseau (<a href="#p3">partie 3</a>). Des réseaux de quelques dizaines ou centaines d’hôtes restent fluides.</li>
  <li><strong>Sécuriser</strong> : entre deux sous-réseaux, le trafic passe par un routeur ou un pare-feu, où l’on peut filtrer. Le Wi-Fi des visiteurs de la M2L ne doit pas pouvoir atteindre le serveur de fichiers de l’administration.</li>
  <li><strong>Organiser</strong> : l’adresse renseigne sur l’équipement (« 172.16.2.x, c’est la téléphonie »), ce qui accélère le diagnostic.</li>
  <li><strong>Préparer les VLAN</strong> : au chapitre 4, chaque sous-réseau sera associé à un réseau local virtuel sur les commutateurs.</li>
</ul>
<dl class="def">
  <dt>Sous-réseau <small>subnet</small></dt><dd>Réseau obtenu en allongeant le masque d’un réseau plus grand : on « emprunte » des bits de la partie hôte pour numéroter des sous-réseaux.</dd>
</dl>

<h2>Découper en sous-réseaux de même taille</h2>
<p>Emprunter <strong>n</strong> bits à la partie hôte donne <strong>2<sup>n</sup> sous-réseaux</strong>. Le masque s’allonge de n bits, et chaque sous-réseau garde h − n bits d’hôte.</p>
<p>Exemple : découper <code>192.168.20.0/24</code> en 4 sous-réseaux. 4 = 2<sup>2</sup>, donc n = 2 : nouveau masque /26 (255.255.255.192), taille de bloc 64.</p>
<div class="tbl-wrap"><table class="data">
  <tr><th>Sous-réseau</th><th>Adresse de réseau</th><th>Plage utilisable</th><th>Diffusion</th></tr>
  <tr><td>1</td><td class="mono">192.168.20.0/26</td><td class="mono">.1 à .62</td><td class="mono">.63</td></tr>
  <tr><td>2</td><td class="mono">192.168.20.64/26</td><td class="mono">.65 à .126</td><td class="mono">.127</td></tr>
  <tr><td>3</td><td class="mono">192.168.20.128/26</td><td class="mono">.129 à .190</td><td class="mono">.191</td></tr>
  <tr><td>4</td><td class="mono">192.168.20.192/26</td><td class="mono">.193 à .254</td><td class="mono">.255</td></tr>
</table></div>
<p>Chaque sous-réseau contient 2<sup>6</sup> − 2 = 62 hôtes. Si le nombre de sous-réseaux voulu n’est pas une puissance de 2, on prend la puissance de 2 <strong>immédiatement supérieure</strong> : pour 6 sous-réseaux, n = 3 (8 sous-réseaux, dont 2 en réserve).</p>

<div class="answer" data-id="a-fixe" data-kind="code" data-label="Découper un /24 en 8 sous-réseaux égaux" data-min="80" data-rows="8">
  <p>Découper <code>172.16.100.0/24</code> en 8 sous-réseaux de même taille. Donner le nouveau masque (décimal et CIDR), le nombre d’hôtes par sous-réseau, la liste des 8 adresses de réseau, puis la plage et la diffusion du 3<sup>e</sup> et du dernier sous-réseau.</p>
  <p class="hint">8 = 2<sup>?</sup> ; la taille de bloc donne directement la liste des adresses de réseau.</p>
  <div class="corr">
    <pre class="code">8 = 2^3 → 3 bits empruntés → /27 = 255.255.255.224, bloc 32
Hôtes par sous-réseau : 2^5 − 2 = 30
Réseaux : .0  .32  .64  .96  .128  .160  .192  .224   (tous en /27)
3e sous-réseau  : 172.16.100.64/27   plage .65 à .94    diffusion .95
Dernier (8e)    : 172.16.100.224/27  plage .225 à .254  diffusion .255</pre>
  </div>
</div>

<h2>Partir du nombre d’hôtes</h2>
<p>Le plus souvent, on connaît le <strong>nombre d’adresses nécessaires</strong> dans chaque réseau. On cherche alors le plus petit nombre de bits d’hôte <em>h</em> tel que <strong>2<sup>h</sup> − 2 ≥ besoin</strong>.</p>
<div class="tbl-wrap"><table class="data bits">
  <tr><th>Bits d’hôte h</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr>
  <tr><td>Masque</td><td>/30</td><td>/29</td><td>/28</td><td>/27</td><td>/26</td><td>/25</td><td>/24</td><td>/23</td><td>/22</td></tr>
  <tr><td>Taille de bloc</td><td>4</td><td>8</td><td>16</td><td>32</td><td>64</td><td>128</td><td>256</td><td>512</td><td>1 024</td></tr>
  <tr><td>Hôtes</td><td>2</td><td>6</td><td>14</td><td>30</td><td>62</td><td>126</td><td>254</td><td>510</td><td>1 022</td></tr>
</table></div>
<p>Pour calculer le besoin, compter <strong>tout ce qui a une adresse</strong> : postes, imprimantes, téléphones IP, bornes Wi-Fi, écrans, <strong>et la passerelle</strong> (le routeur a une adresse dans chaque réseau qu’il relie). Ajouter une <strong>marge d’évolution</strong> raisonnable : changer de masque plus tard oblige à reconfigurer tous les équipements.</p>
<div class="quiz" data-id="q-besoin" data-title="Choisir le masque">
  <div class="q" data-ok="3">
    <p class="qt">Un service compte 30 postes. Quel masque choisir pour son réseau ?</p>
    <ul><li>/28</li><li>/27</li><li>/26</li><li>/25</li></ul>
    <p class="hint">30 postes + la passerelle = ? adresses.</p>
    <div class="expl"><p>30 postes + 1 passerelle = 31 adresses. Un /27 n’offre que 30 adresses d’hôte : insuffisant. Il faut un /26 (62 hôtes), qui laisse en plus de la marge. C’est le piège le plus fréquent : oublier la passerelle.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Pour relier deux routeurs entre eux, quel masque est le plus économe ?</p>
    <ul><li>/24</li><li>/30</li><li>/31</li><li>/29</li></ul>
    <div class="expl"><p>Une liaison point à point entre deux routeurs n’a besoin que de 2 adresses : le /30 (2 hôtes) est le choix classique. Le /31 existe aussi (RFC 3021, sans adresses de réseau ni de diffusion) sur le matériel récent, mais il sort du cadre de ce cours.</p></div>
  </div>
</div>

<h2>Le VLSM : des sous-réseaux de tailles différentes</h2>
<p>Découper en parts égales gaspille des adresses : un réseau de 6 serveurs n’a pas besoin d’autant d’adresses qu’un réseau de 100 postes. Le <strong>VLSM</strong> (<em>Variable Length Subnet Mask</em>, masque de longueur variable) donne à chaque réseau un masque adapté à son besoin.</p>
<h3>La règle d’alignement</h3>
<p>Un réseau de taille de bloc <em>B</em> commence <strong>toujours à un multiple de B</strong>. Un /27 commence à .0, .32, .64…, jamais à .48 ; un /22 commence à un 3<sup>e</sup> octet multiple de 4. Une adresse « mal alignée » n’est pas une adresse de réseau.</p>
<div class="ctab" data-id="c-align" data-head="Réseau proposé" data-cols="Adresse de réseau correcte ?" data-choices="OUI|NON" data-label="Adresses de réseau bien alignées ou non">
  <div class="r" data-ok="OUI" data-expl="/27 : bloc 32 ; 32 est un multiple de 32.">192.168.1.32/27</div>
  <div class="r" data-ok="NON" data-expl="48 n’est pas un multiple de 32 : 192.168.1.48 appartient au réseau 192.168.1.32/27.">192.168.1.48/27</div>
  <div class="r" data-ok="OUI" data-expl="/28 : bloc 16 ; 96 = 6 × 16.">192.168.1.96/28</div>
  <div class="r" data-ok="OUI" data-expl="/30 : bloc 4 ; 252 = 63 × 4. Diffusion .255.">192.168.1.252/30</div>
  <div class="r" data-ok="OUI" data-expl="/22 : bloc 4 sur le 3e octet ; 4 est un multiple de 4.">10.0.4.0/22</div>
  <div class="r" data-ok="NON" data-expl="6 n’est pas un multiple de 4 : 10.0.6.0 fait partie du réseau 10.0.4.0/22.">10.0.6.0/22</div>
  <div class="r" data-ok="NON" data-expl="/23 : bloc 2 sur le 3e octet ; 3 est impair. Le réseau est 172.16.2.0/23.">172.16.3.0/23</div>
</div>

<h3>La méthode</h3>
<ol class="steps">
  <li>Lister les réseaux et leur besoin en adresses (passerelle et marge comprises).</li>
  <li>Pour chacun, choisir le masque (tableau ci-dessus).</li>
  <li><strong>Trier du plus grand au plus petit.</strong></li>
  <li>Attribuer les réseaux à la suite, en partant du début du bloc : chaque réseau commence juste après la diffusion du précédent. Grâce au tri, chaque réseau tombe automatiquement sur une adresse bien alignée.</li>
  <li>Noter les adresses qui restent libres, pour les évolutions.</li>
</ol>

<h3>Exemple : le site annexe d’une ligue</h3>
<p>Bloc disponible : <code>192.168.60.0/24</code>. Besoins : salle de formation, 50 postes ; bureaux, 25 postes ; direction, 10 postes ; une liaison entre deux routeurs.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Réseau</th><th>Besoin (+ passerelle)</th><th>Masque</th><th>Adresse de réseau</th><th>Plage</th><th>Diffusion</th></tr>
  <tr><td>Formation</td><td>50 + 1 = 51</td><td>/26 (62)</td><td class="mono">192.168.60.0</td><td class="mono">.1 à .62</td><td class="mono">.63</td></tr>
  <tr><td>Bureaux</td><td>25 + 1 = 26</td><td>/27 (30)</td><td class="mono">192.168.60.64</td><td class="mono">.65 à .94</td><td class="mono">.95</td></tr>
  <tr><td>Direction</td><td>10 + 1 = 11</td><td>/28 (14)</td><td class="mono">192.168.60.96</td><td class="mono">.97 à .110</td><td class="mono">.111</td></tr>
  <tr><td>Liaison routeurs</td><td>2</td><td>/30 (2)</td><td class="mono">192.168.60.112</td><td class="mono">.113 à .114</td><td class="mono">.115</td></tr>
  <tr><td colspan="6">Libre : <code>192.168.60.116</code> à <code>192.168.60.255</code> (par exemple .116/30, .120/29, .128/25)</td></tr>
</table></div>
<p>Pourquoi trier ? Si l’on plaçait d’abord la direction (/28) en .0, le /26 de la formation ne pourrait commencer qu’en .64 (alignement), et les adresses .16 à .63 seraient éparpillées en petits morceaux difficiles à réutiliser.</p>

<div class="answer" data-id="a-vlsm" data-kind="code" data-label="Réaliser un découpage VLSM" data-min="150" data-rows="10">
  <p>Une entreprise dispose du bloc <code>10.5.0.0/24</code>. Besoins (en postes, passerelle non comprise) : production 100 ; logistique 40 ; qualité 20 ; serveurs 6 ; une liaison entre deux routeurs. Réaliser le découpage VLSM : pour chaque réseau, besoin total, masque, adresse de réseau, plage, diffusion. Indiquer les adresses restées libres.</p>
  <p class="hint">Attention aux serveurs : 6 + 1 = 7 adresses. Combien d’hôtes offre un /29 ?</p>
  <div class="corr">
    <pre class="code">Production  100+1 = 101 → /25 (126)  10.5.0.0/25    .1 à .126    diff .127
Logistique   40+1 =  41 → /26 (62)   10.5.0.128/26  .129 à .190  diff .191
Qualité      20+1 =  21 → /27 (30)   10.5.0.192/27  .193 à .222  diff .223
Serveurs      6+1 =   7 → /28 (14)   10.5.0.224/28  .225 à .238  diff .239
Liaison           =   2 → /30 (2)    10.5.0.240/30  .241 à .242  diff .243
Libre : 10.5.0.244 à 10.5.0.255 (.244/30, .248/29)</pre>
    <p>Piège : un /29 n’offre que 6 adresses d’hôte, insuffisant pour 6 serveurs <strong>et</strong> la passerelle. Il faut un /28.</p>
  </div>
</div>

<h2>Le plan d’adressage</h2>
<p>Le <strong>plan d’adressage</strong> est le document qui décrit tous les réseaux d’une organisation et les règles d’attribution des adresses. Il fait partie de la documentation du patrimoine informatique (compétence B1.1) : sans lui, chaque nouvelle configuration risque de créer un doublon.</p>
<h3>Ce qu’il contient</h3>
<ul>
  <li>pour chaque réseau : le nom ou l’usage, l’adresse et le masque, la passerelle, la diffusion ;</li>
  <li>la répartition des adresses à l’intérieur : plage distribuée automatiquement (DHCP, chapitre 3), plage des adresses fixes (serveurs, imprimantes, équipements réseau) ;</li>
  <li>les <strong>conventions</strong> : passerelle sur la première ou la dernière adresse ; serveurs en début de plage ; équipements d’administration à une adresse précise ;</li>
  <li>plus tard : le numéro de VLAN associé et le préfixe IPv6.</li>
</ul>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Réseau</th><th>Adresse / masque</th><th>Passerelle</th><th>Adresses fixes</th><th>Plage DHCP</th><th>Diffusion</th></tr>
  <tr><td>Bureaux (site annexe)</td><td class="mono">192.168.60.64/27</td><td class="mono">.94</td><td class="mono">.65 à .69 (imprimantes)</td><td class="mono">.70 à .93</td><td class="mono">.95</td></tr>
</table></div>

<h3>Le plan de nommage</h3>
<p>À côté du plan d’adressage, un <strong>plan de nommage</strong> fixe la façon de nommer les équipements, pour savoir immédiatement ce qu’est et où se trouve une machine. Exemple du contexte M2L : <code>BAE2L06S01P01</code> = <strong>B</strong>âtiment <strong>A</strong>, <strong>É</strong>tage <strong>2</strong>, <strong>L</strong>igue <strong>06</strong>, <strong>S</strong>alle <strong>01</strong>, <strong>P</strong>rise <strong>01</strong>. On le travaillera au <a href="#tp6">TP 6</a>.</p>

<div class="aside deep">
  <p class="aside-title">Le résumé de routes : le découpage à l’envers</p>
  <p>Le découpage raccourcit la partie hôte ; on peut aussi faire l’inverse et <strong>regrouper</strong> des réseaux contigus sous un seul préfixe plus court. Les quatre réseaux <code>172.16.8.0/24</code>, <code>172.16.9.0/24</code>, <code>172.16.10.0/24</code> et <code>172.16.11.0/24</code> ont en commun leurs 22 premiers bits (8, 9, 10 et 11 s’écrivent <code>000010xx</code>) : ils se résument en <code>172.16.8.0/22</code>. Un routeur distant n’a alors besoin que d’une seule route au lieu de quatre. C’est ce qui permet aux routeurs d’Internet de ne pas avoir des milliards de routes, et c’est une raison de plus de <strong>regrouper</strong> les réseaux d’un même site ou d’une même catégorie dans un bloc aligné quand on conçoit un plan d’adressage.</p>
</div>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Oublier de compter la passerelle (et les imprimantes, téléphones, bornes) dans le besoin en adresses.</li>
    <li>Ne pas trier les besoins du plus grand au plus petit en VLSM : on obtient des réseaux mal alignés ou des adresses qui se chevauchent.</li>
    <li>Ne prévoir aucune marge : un service qui grandit oblige alors à changer de masque, donc à reconfigurer tous ses équipements.</li>
  </ul>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p5" data-title="Sous-réseaux et VLSM" data-label="Quiz de fin de partie">
  <div class="q" data-ok="3">
    <p class="qt">Combien de réseaux /28 peut-on créer dans un /24 ?</p>
    <ul><li>4</li><li>8</li><li>16</li><li>28</li></ul>
    <div class="expl"><p>On emprunte 28 − 24 = 4 bits : 2<sup>4</sup> = 16 sous-réseaux (de 14 hôtes chacun).</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Un réseau doit accueillir 100 téléphones IP, plus la passerelle. Quel masque choisir ?</p>
    <ul><li>/26</li><li>/25</li><li>/24</li><li>/27</li></ul>
    <div class="expl"><p>101 adresses : un /26 (62) ne suffit pas, un /25 (126) convient. Un /24 conviendrait aussi, mais gaspillerait 153 adresses.</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Dans un découpage VLSM, pourquoi attribuer les réseaux du plus grand au plus petit ?</p>
    <ul><li>Parce que les petits réseaux sont moins importants</li><li>Pour avoir moins de diffusions</li><li>Parce que le routeur l’exige</li><li>Pour que chaque réseau tombe sur une adresse alignée sans laisser de trous inutilisables</li></ul>
    <div class="expl"><p>Un grand réseau doit commencer à un multiple de sa (grande) taille de bloc. En plaçant les grands d’abord, les suivants, plus petits, s’alignent naturellement à la suite.</p></div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Après le réseau <code>192.168.60.64/27</code>, quelle est la première adresse de réseau disponible pour un /28 ?</p>
    <ul><li>192.168.60.96</li><li>192.168.60.95</li><li>192.168.60.80</li><li>192.168.60.112</li></ul>
    <div class="expl"><p>Le /27 va de .64 à .95. La suite commence en .96, qui est un multiple de 16 : c’est bien une adresse de /28 valide.</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Quel préfixe résume les réseaux <code>10.1.4.0/24</code> à <code>10.1.7.0/24</code> ?</p>
    <ul><li>10.1.0.0/16</li><li>10.1.4.0/23</li><li>10.1.4.0/22</li><li>10.1.4.0/21</li></ul>
    <div class="expl"><p>4 réseaux /24 = 2<sup>2</sup> : on raccourcit le masque de 2 bits, /22. 4 est un multiple de 4 : 10.1.4.0/22 couvre exactement de 10.1.4.0 à 10.1.7.255.</p></div>
  </div>
</div>

<div class="aside next">
  <p class="aside-title">La suite</p>
  <p>Au <a href="#tp6">TP 6</a>, on conçoit le plan d’adressage de la M2L, qui prépare son projet de segmentation.</p>
</div>

<h1>Le plan d’adressage de la M2L</h1>
<p class="lead">La Maison des Ligues de Lorraine a un réseau commun aux ligues et à l’administration. Son projet de <strong>segmentation</strong>, prévu pour renforcer la sécurité, n’est pas encore en place. Le responsable informatique demande de préparer le plan d’adressage IPv4 qui servira de base à ce projet : un réseau par usage, un réseau par ligue, et un plan de nommage appliqué.</p>

<div class="aside caution">
  <p class="aside-title">Consignes</p>
  <ul>
    <li>Travail sur papier puis dans les zones de réponse, <strong>sans IA et sans calculatrice</strong>.</li>
    <li>Le plan proposé ici est une <strong>proposition pédagogique</strong> construite à partir de la description du contexte M2L (Réseau Certa) : il ne reproduit pas un plan officiel.</li>
    <li>Niveaux : <span class="chip ok">essentiel</span><span class="chip" style="background:var(--accent-soft);color:var(--accent)">intermédiaire</span><span class="chip" style="background:var(--key-soft);color:var(--key)">défi</span></li>

</div>

<h2>Le contexte</h2>
<h3>L’organisation</h3>
<ul>
  <li>La M2L est un établissement de la Région, administré par le CROSL (Comité régional olympique et sportif de Lorraine). Elle héberge <strong>24 ligues</strong> sportives.</li>
  <li>Quatre bâtiments : <strong>A</strong> (bureaux des ligues sur 4 niveaux), <strong>B</strong> (plain-pied, armoire de brassage principale et baie des serveurs), <strong>C</strong> (bureaux des ligues sur 4 niveaux, bâtiment neuf), <strong>D</strong> (plain-pied, neuf).</li>
  <li>80 bureaux, un amphithéâtre de 200 places, 8 salles de réunion, une salle multimédia de 24 postes (25 prises pour les PC et 1 pour une imprimante réseau), une salle de reprographie.</li>
  <li>L’administration de la M2L occupe 9 bureaux, avec 27 prises réseau.</li>
  <li>Téléphonie : analogique dans les bâtiments A et B, <strong>sur IP</strong> dans les bâtiments C et D.</li>
  <li>Wi-Fi « visiteurs » gratuit, limité à l’accès à Internet, dans les salles du rez-de-chaussée et les étages de bureaux.</li>

<h3>Les choix du responsable informatique</h3>
<ul>
  <li>Adresses privées dans le bloc <code>172.16.0.0/20</code> : <code>172.16.0.0/21</code> pour les réseaux de services, <code>172.16.8.0/22</code> pour les ligues, le reste en réserve.</li>
  <li><strong>Passerelle = dernière adresse utilisable</strong> de chaque réseau (convention déjà utilisée dans le réseau de test du TP 5).</li>
  <li>Le besoin de chaque réseau est donné <strong>passerelle non comprise</strong>.</li>
</ul>

  <tr><td>Serveurs</td><td>3 serveurs de l’administration, avec une marge</td><td>10</td></tr>
  <tr><td>DMZ</td><td>Serveur web, serveur de messagerie, serveur de gestion des configurations</td><td>3</td></tr>
  <tr><td>Interconnexion</td><td>Liaison entre le routeur principal et le pare-feu</td><td>2 (les deux équipements)</td></tr>
</table></div>

<h2>Mission 1 : choisir les masques</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Un masque par réseau</summary>
  <div class="task-body">
    <div class="answer" data-id="t6-masques" data-kind="code" data-label="Mission 1 : besoin total et masque de chaque réseau" data-min="120" data-rows="9">
      <p>Pour chaque réseau de services : calculer le besoin total (passerelle comprise, sauf pour l’interconnexion), puis choisir le masque le plus petit possible. Indiquer le nombre d’hôtes du masque choisi, puis classer les réseaux du plus grand au plus petit.</p>
      <p class="hint">Tableau de la partie 5 : 2<sup>h</sup> − 2 ≥ besoin. Pour la salle multimédia : 26 + 1 = 27.</p>
      <div class="corr">
        <pre class="code">Wi-Fi visiteurs   300 + 1 = 301 → /23  (510 hôtes)
Téléphonie IP     100 + 1 = 101 → /25  (126)
Administration     40 + 1 =  41 → /26  (62)
Salle multimédia   26 + 1 =  27 → /27  (30)
Serveurs           10 + 1 =  11 → /28  (14)
DMZ                 3 + 1 =   4 → /29  (6)
Interconnexion            =   2 → /30  (2)
Ordre : Wi-Fi, téléphonie, administration, multimédia, serveurs, DMZ, interconnexion</pre>
        <p>Pour le Wi-Fi, un /24 (254 hôtes) ne suffit pas : il faut un /23. Pour la salle multimédia, le /27 est juste suffisant (27 adresses sur 30) : c’est acceptable, car le nombre de prises de la salle est fixe.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 2 : le découpage VLSM des réseaux de services</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Attribuer les réseaux dans 172.16.0.0/21</summary>
  <div class="task-body">
    <div class="answer" data-id="t6-vlsm" data-kind="code" data-label="Mission 2 : plan d’adressage des réseaux de services" data-min="200" data-rows="12">
      <p>À partir de <code>172.16.0.0</code>, attribuer les réseaux dans l’ordre de la mission 1. Pour chacun : adresse de réseau et masque (CIDR et décimal), première et dernière adresse utilisables, passerelle, diffusion. Indiquer ensuite les adresses restées libres dans <code>172.16.0.0/21</code>.</p>
      <p class="hint">Le /23 occupe 172.16.0.0 à 172.16.1.255. Le réseau suivant commence donc en 172.16.2.0.</p>
      <div class="corr">
        <div class="tbl-wrap"><table class="data wide">
          <tr><th>Réseau</th><th>Adresse / masque</th><th>Plage utilisable</th><th>Passerelle</th><th>Diffusion</th></tr>
          <tr><td>Wi-Fi visiteurs</td><td class="mono">172.16.0.0/23<br>255.255.254.0</td><td class="mono">172.16.0.1 à 172.16.1.254</td><td class="mono">172.16.1.254</td><td class="mono">172.16.1.255</td></tr>

          <tr><td>Administration</td><td class="mono">172.16.2.128/26<br>255.255.255.192</td><td class="mono">172.16.2.129 à 172.16.2.190</td><td class="mono">172.16.2.190</td><td class="mono">172.16.2.191</td></tr>
          <tr><td>Salle multimédia</td><td class="mono">172.16.2.192/27<br>255.255.255.224</td><td class="mono">172.16.2.193 à 172.16.2.222</td><td class="mono">172.16.2.222</td><td class="mono">172.16.2.223</td></tr>
          <tr><td>Serveurs</td><td class="mono">172.16.2.224/28<br>255.255.255.240</td><td class="mono">172.16.2.225 à 172.16.2.238</td><td class="mono">172.16.2.238</td><td class="mono">172.16.2.239</td></tr>

      </div>
    </div>

<h2>Mission 3 : un réseau par ligue</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Découper 172.16.8.0/22 en réseaux de même taille</summary>
  <div class="task-body">
    <p>Chaque ligue disposera de son propre réseau, pour isoler les ligues les unes des autres. Une ligue compte au plus <strong>20 postes et 1 imprimante</strong>. Pour simplifier l’administration, tous les réseaux de ligues ont la même taille, et la ligue numéro <em>n</em> reçoit le <em>n</em>-ième réseau du bloc <code>172.16.8.0/22</code>.</p>
    <div class="answer" data-id="t6-ligues" data-kind="code" data-label="Mission 3 : réseaux des ligues" data-min="150" data-rows="11">
      <p>a) Choisir le masque des réseaux de ligues. b) Combien de réseaux de ce masque le bloc <code>172.16.8.0/22</code> contient-il ? Combien en reste-t-il en réserve ? c) Trouver une règle de calcul pour le réseau de la ligue <em>n</em>. d) Donner l’adresse de réseau, la passerelle et la diffusion des ligues 01, 06 (volley), 09 et 24.</p>
      <p class="hint">Un /22 contient 1 024 adresses. Le réseau de la ligue <em>n</em> commence (n − 1) × taille de bloc adresses après 172.16.8.0 ; 256 adresses font passer au 3e octet suivant.</p>
      <div class="corr">
        <pre class="code">a) 20 + 1 + 1 (passerelle) = 22 adresses → /27 (30 hôtes)
b) /22 → /27 : 5 bits empruntés → 2^5 = 32 réseaux ; 32 − 24 = 8 en réserve
c) Réseau de la ligue n = 172.16.8.0 + (n − 1) × 32
   (8 réseaux /27 par valeur du 3e octet : 8 × 32 = 256)
d) Ligue 01 : décalage 0          → 172.16.8.0/27
              passerelle 172.16.8.30    diffusion 172.16.8.31
   Ligue 06 : décalage 5 × 32 = 160 → 172.16.8.160/27
              passerelle 172.16.8.190   diffusion 172.16.8.191
   Ligue 09 : décalage 8 × 32 = 256 → 172.16.9.0/27
              passerelle 172.16.9.30    diffusion 172.16.9.31
   Ligue 24 : décalage 23 × 32 = 736 = 2 × 256 + 224 → 172.16.10.224/27
              passerelle 172.16.10.254  diffusion 172.16.10.255</pre>
        <p>Les ligues 25 à 32 (réserve) occupent <code>172.16.11.0</code> à <code>172.16.11.255</code>. Avantage du bloc commun : tous les réseaux des ligues se résument en une seule route, <code>172.16.8.0/22</code>, et une seule règle de pare-feu suffit pour traiter « toutes les ligues ».</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 4 : répartir les adresses et nommer les équipements</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>La salle multimédia et le plan de nommage</summary>
  <div class="task-body">
    <div class="answer" data-id="t6-repartition" data-kind="code" data-label="Mission 4 : répartition des adresses de la salle multimédia" data-min="80" data-rows="6">
      <p>Pour le réseau de la salle multimédia (<code>172.16.2.192/27</code>), proposer la répartition : passerelle, adresse fixe de l’imprimante, plage distribuée automatiquement aux 25 PC. Vérifier que la plage est assez grande.</p>
      <div class="corr">
        <pre class="code">Passerelle   : 172.16.2.222   (dernière adresse utilisable, convention)
Imprimante   : 172.16.2.193   (adresse fixe, en début de plage)
Plage DHCP   : 172.16.2.194 à 172.16.2.221 → 221 − 194 + 1 = 28 adresses ≥ 25 PC
Diffusion    : 172.16.2.223</pre>
        <p>Il reste 3 adresses de marge dans la plage automatique (pour un PC de remplacement, par exemple). D’autres répartitions sont possibles si elles respectent la convention de la passerelle et ne chevauchent pas l’adresse fixe.</p>
      </div>
    </div>

    <p>Le contexte M2L fixe un <strong>plan de nommage</strong> des postes des ligues : <code>B</code> + code du bâtiment (A ou C) + <code>E</code> + numéro d’étage (1 à 4) + <code>L</code> + numéro de ligue (01 à 24) + <code>S</code> + numéro de salle (2 chiffres) + <code>P</code> + numéro de la prise murale (2 chiffres). Pour une imprimante réseau, la lettre <code>L</code> remplace le <code>P</code> de la prise. Exemple : <code>BAE2L06S01P01</code> est le poste branché sur la prise 01 du bureau A201, occupé par la ligue 06 (volley), au 2<sup>e</sup> étage du bâtiment A.</p>
    <div class="match" data-id="t6-noms" data-label="Mission 4 : décoder et construire des noms" data-options="BCE3L11S04P02|BCE3L11S04L01|BAE1L03S02P01|BCE1L03S02P01|BAE4L20S10P03">
      <div class="r" data-ok="BCE3L11S04P02" data-expl="Bâtiment C, étage 3, ligue 11, salle 04, prise 02, et un P pour un poste.">Poste de la ligue 11, salle 04, 3e étage du bâtiment C, prise 02</div>
      <div class="r" data-ok="BCE3L11S04L01" data-expl="Pour une imprimante, L remplace P devant le numéro de prise.">Imprimante de la ligue 11, salle 04, 3e étage du bâtiment C, prise 01</div>
      <div class="r" data-ok="BAE1L03S02P01" data-expl="A pour le bâtiment, E1 pour le 1er étage, L03, S02, P01.">Poste de la ligue 03, salle 02, 1er étage du bâtiment A, prise 01</div>
      <div class="r" data-ok="BAE4L20S10P03" data-expl="Bâtiment A, étage 4, ligue 20, salle 10, prise 03.">Poste de la ligue 20, salle 10, 4e étage du bâtiment A, prise 03</div>
    </div>
    <div class="aside deep">
      <p class="aside-title">Pourquoi un nom sans point et de 13 caractères ?</p>
      <p>Le format écrit dans le contexte M2L comporte un point avant le numéro de prise (« …S[salle].P[poste] »), alors que l’exemple donné n’en a pas (<code>BAE2L06S01P01</code>). L’exemple a raison : dans un nom DNS, le point <strong>sépare</strong> les niveaux (<code>bae2l06s01p01.m2l.lan</code>) ; un point dans le nom d’hôte lui-même le couperait en deux. Par ailleurs, Windows limite le nom d’un ordinateur à <strong>15 caractères</strong> (héritage du protocole NetBIOS) : les 13 caractères du plan de nommage de la M2L respectent cette limite.</p>
    </div>
  </div>
</details>

<h2>Défi : et si la M2L grandissait ?</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Passer à 80 ligues</summary>
  <div class="task-body">
    <div class="answer" data-id="t6-defi" data-kind="code" data-label="Défi : bloc d’adresses pour 80 ligues" data-min="80" data-rows="7">
      <p>La Région envisage d’accueillir jusqu’à 80 ligues, avec les mêmes besoins par ligue. a) Le bloc <code>172.16.8.0/22</code> suffit-il ? b) Proposer un nouveau bloc, correctement aligné, qui ne chevauche pas les réseaux de services, et qui garde la règle « un /27 par ligue ». c) Ce bloc reste-t-il dans <code>172.16.0.0/12</code> (adresses privées) ?</p>
      <div class="corr">
        <pre class="code">a) 80 réseaux /27 &gt; 32 réseaux disponibles dans un /22 : insuffisant
b) Il faut au moins 80 réseaux /27 → 2^7 = 128 réseaux → 7 bits empruntés
   27 − 7 = /20 (4 096 adresses). Bloc aligné sur 16 au 3e octet,
   hors de 172.16.0.0/21 : 172.16.16.0/20 (172.16.16.0 à 172.16.31.255)
   Ligue n : 172.16.16.0 + (n − 1) × 32
c) Oui : 172.16.0.0/12 va jusqu’à 172.31.255.255.</pre>
        <p>Remarque : 172.16.8.0/20 ne serait pas une réponse valide, car 8 n’est pas un multiple de 16 ; l’adresse de réseau serait en réalité 172.16.0.0/20, qui chevauche les réseaux de services. Un changement de plan d’adressage se prépare donc tôt : il oblige à reconfigurer les réseaux concernés.</p>
      </div>
    </div>
  </div>
</details>

<template data-page="p6">
<h1>ARP, ICMP et méthode de diagnostic</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : <a href="#tp4">TP 4</a> (requêtes ARP observées dans la capture) et <a href="#p4">partie 4</a> (décision « local ou distant »). Les commandes de cette partie sont des commandes de <strong>lecture</strong> : elles peuvent être essayées sur un poste du lycée. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Faire marcher et diagnostiquer</div><ul>
  <li><span><b>ARP</b> : de l’adresse IP à l’adresse MAC</span></li>
  <li><span><b>Le trajet complet</b> : MAC qui changent, IP qui restent</span></li>
  <li><span><b>ICMP</b> : messages d’erreur et de contrôle</span></li>
  <li><span><b>ping et tracert</b> : lire les réponses</span></li>
  <li><span><b>Méthode</b> : du câble à l’application</span></li>
</ul></div></figure>

<p class="lead">Un poste qui a une adresse IP ne peut pas encore envoyer de trame : il lui faut l’adresse MAC du destinataire ou de la passerelle. C’est le travail d’ARP. Quand quelque chose ne va pas, ICMP renvoie des messages d’erreur, que <code>ping</code> et <code>tracert</code> permettent de lire. Ces trois outils sont la base de tout diagnostic réseau en assistance.</p>

<h2>ARP : trouver l’adresse MAC</h2>
<p><strong>ARP</strong> (<em>Address Resolution Protocol</em>, RFC 826) fait le lien entre la couche 3 et la couche 2 : il trouve l’adresse MAC qui correspond à une adresse IPv4 <strong>du réseau local</strong>.</p>
<ol class="steps">
  <li>Le poste consulte son <strong>cache ARP</strong> (une table en mémoire). Si l’adresse MAC est déjà connue, il l’utilise directement.</li>
  <li>Sinon, il envoie une <strong>requête ARP en diffusion</strong> (<code>ff:ff:ff:ff:ff:ff</code>) : « Qui a l’adresse 192.168.10.10 ? Répondre à 192.168.10.21. »</li>
  <li>Tous les hôtes du réseau la reçoivent ; seul celui qui possède l’adresse demandée répond, par une <strong>réponse ARP en envoi individuel</strong> : « 192.168.10.10 est à 08:00:27:91:b2:4e ».</li>
  <li>Le demandeur enregistre la correspondance dans son cache, pour quelques dizaines de secondes à quelques minutes, puis envoie ses trames.</li>
</ol>
<p>On reconnaît exactement les trames 2 et 3 de la capture du <a href="#tp4">TP 4</a>. Pour une destination <strong>distante</strong>, l’hôte ne demande jamais l’adresse MAC de la destination finale, mais celle de sa <strong>passerelle</strong> (trames 8 et 9).</p>

<h3>Lire et vider le cache ARP</h3>
<pre class="code terminal"><span class="cm"># Windows</span>
<span class="pr">C:\&gt;</span> arp -a
Interface : 192.168.10.21 --- 0xc
  Adresse Internet      Adresse physique      Type
  192.168.10.10         08-00-27-91-b2-4e     dynamique
  192.168.10.254        00-00-0c-5e-21-a7     dynamique
  192.168.10.255        ff-ff-ff-ff-ff-ff     statique
<span class="pr">C:\&gt;</span> arp -d *          <span class="cm"># vider le cache (invite de commandes en administrateur)</span>

<span class="cm"># Linux</span>
<span class="pr">$</span> ip neigh
192.168.10.254 dev enp0s3 lladdr 00:00:0c:5e:21:a7 REACHABLE
192.168.10.10 dev enp0s3 lladdr 08:00:27:91:b2:4e STALE
<span class="pr">$</span> sudo ip neigh flush all   <span class="cm"># vider le cache</span></pre>
<p>Sous Linux, <code>REACHABLE</code> signifie que l’entrée vient d’être confirmée, <code>STALE</code> qu’elle est ancienne et sera revérifiée à la prochaine utilisation, <code>FAILED</code> que personne n’a répondu : un indice fort quand une machine du réseau local est injoignable.</p>

<div class="aside deep">
  <p class="aside-title">ARP gratuit et adresse en double</p>
  <p>Quand une carte réseau obtient une adresse, le système envoie souvent un <strong>ARP gratuit</strong> : une requête ARP pour sa <em>propre</em> adresse. Si quelqu’un répond, c’est que l’adresse est déjà utilisée : Windows affiche alors un avertissement de conflit d’adresse IP (ticket T3 du <a href="#tp5">TP 5</a>). ARP n’a <strong>aucune authentification</strong> : n’importe quel poste peut répondre « c’est moi » à la place d’un autre. Cette faiblesse est à la base de l’attaque par <strong>usurpation ARP</strong> (<em>ARP spoofing</em>), qui permet d’intercepter le trafic d’un réseau local ; ses contre-mesures seront vues dans le chapitre consacré à la cybersécurité.</p>
</div>

<h3>Exercice : quelle adresse MAC en destination ?</h3>
<p>Le poste <code>BAE2L06S01P01</code> de la ligue de volley a l’adresse <code>172.16.8.165/27</code> et la passerelle <code>172.16.8.190</code> (plan d’adressage du <a href="#tp6">TP 6</a>). Pour chaque destination, indiquer l’adresse MAC que le poste mettra en destination de la trame.</p>
<div class="match" data-id="m-macdest" data-label="Choisir l’adresse MAC de destination de la trame" data-options="L’adresse MAC de la destination elle-même|L’adresse MAC de la passerelle 172.16.8.190">
  <div class="r" data-ok="L’adresse MAC de la destination elle-même" data-expl="Le réseau du poste va de 172.16.8.161 à .190 : l’imprimante .161 est dans le réseau local.">L’imprimante de la ligue, 172.16.8.161</div>
  <div class="r" data-ok="L’adresse MAC de la passerelle 172.16.8.190" data-expl="Le serveur est dans le réseau des serveurs (172.16.2.224/28) : destination distante.">Le serveur de fichiers, 172.16.2.225</div>
  <div class="r" data-ok="L’adresse MAC de la destination elle-même" data-expl="Le voisin .170 est dans le même /27.">Un poste voisin de la ligue, 172.16.8.170</div>
  <div class="r" data-ok="L’adresse MAC de la passerelle 172.16.8.190" data-expl="172.16.8.5 est dans le réseau de la ligue 01 (172.16.8.0/27), un autre réseau, même s’il « ressemble » au réseau du poste.">Un poste de la ligue 01, 172.16.8.5</div>
  <div class="r" data-ok="L’adresse MAC de la passerelle 172.16.8.190" data-expl="Toute adresse d’Internet est distante.">Un site web sur Internet</div>
  <div class="r" data-ok="L’adresse MAC de la destination elle-même" data-expl="Pour parler à la passerelle elle-même (par exemple pour un ping), c’est bien sûr son adresse MAC.">La passerelle elle-même, 172.16.8.190</div>
</div>

<h2>Le trajet complet d’un paquet</h2>
<p>Synthèse des parties 2 à 6, sur l’exemple d’un ping de PC-ETU (<code>192.168.10.21</code>) vers <code>9.9.9.9</code>, à travers le routeur R1 puis le réseau de l’opérateur :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Tronçon</th><th>MAC source</th><th>MAC destination</th><th>IP source</th><th>IP destination</th></tr>
  <tr><td>PC-ETU → R1 (réseau de la salle)</td><td>PC-ETU</td><td>R1, interface côté salle</td><td class="mono">192.168.10.21</td><td class="mono">9.9.9.9</td></tr>
  <tr><td>R1 → routeur de l’opérateur</td><td>R1, interface côté Internet</td><td>Routeur de l’opérateur</td><td class="mono">192.168.10.21*</td><td class="mono">9.9.9.9</td></tr>
  <tr><td>… → dernier routeur → serveur</td><td>Dernier routeur</td><td>Serveur 9.9.9.9</td><td class="mono">192.168.10.21*</td><td class="mono">9.9.9.9</td></tr>
</table></div>
<p class="refco">* En réalité, comme 192.168.10.21 est une adresse privée, le routeur de sortie la remplace par son adresse publique (NAT, chapitre 4). Sans NAT, les adresses IP ne changent jamais.</p>
<p>À chaque tronçon, l’émetteur fait la même chose : décider « local ou distant », trouver par ARP l’adresse MAC du prochain équipement, fabriquer une nouvelle trame. Chaque routeur diminue aussi le <strong>TTL</strong> (<em>Time To Live</em>) du paquet de 1 ; à 0, il détruit le paquet. Le TTL évite qu’un paquet tourne indéfiniment en cas de boucle de routage.</p>

<h2>ICMP : les messages de contrôle</h2>
<p><strong>ICMP</strong> (<em>Internet Control Message Protocol</em>, RFC 792) transporte des messages de contrôle et d’erreur entre équipements IP. Il est transporté dans IP (numéro de protocole 1) et fait partie de la couche réseau.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Type</th><th>Message</th><th>Quand ?</th></tr>
  <tr><td>8</td><td>Demande d’écho (<em>Echo request</em>)</td><td>Envoyé par <code>ping</code>.</td></tr>
  <tr><td>0</td><td>Réponse d’écho (<em>Echo reply</em>)</td><td>Réponse à une demande d’écho.</td></tr>
  <tr><td>3</td><td>Destination injoignable (<em>Destination unreachable</em>)</td><td>Un routeur ne trouve pas de route (code 0 : réseau), ne trouve pas l’hôte (code 1), ou un hôte n’a pas d’application sur le port demandé (code 3).</td></tr>
  <tr><td>11</td><td>Temps dépassé (<em>Time exceeded</em>)</td><td>Un routeur a détruit un paquet dont le TTL est arrivé à 0. Utilisé par <code>tracert</code>.</td></tr>
</table></div>
<p>Beaucoup de pare-feu bloquent ICMP, en particulier les demandes d’écho entrantes (c’est le cas par défaut sur Windows Server, voir le <a href="#tp5">TP 5</a>). <strong>Un ping sans réponse ne prouve donc pas qu’une machine est éteinte.</strong></p>

<h2>Utiliser et lire <code>ping</code></h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Action</th><th>Windows</th><th>Linux</th></tr>
  <tr><td>Nombre de demandes</td><td><code>ping -n 10 cible</code> (4 par défaut)</td><td><code>ping -c 10 cible</code> (illimité par défaut, <kbd>Ctrl</kbd>+<kbd>C</kbd> pour arrêter)</td></tr>
  <tr><td>Ping continu</td><td><code>ping -t cible</code></td><td>par défaut</td></tr>
  <tr><td>Forcer IPv4 ou IPv6</td><td><code>ping -4</code> / <code>ping -6</code></td><td><code>ping -4</code> / <code>ping -6</code></td></tr>
  <tr><td>Taille des données</td><td><code>ping -l 1400 cible</code></td><td><code>ping -s 1400 cible</code></td></tr>
</table></div>
<pre class="code terminal"><span class="pr">C:\&gt;</span> ping 192.168.10.10

Envoi d’une requête 'Ping'  192.168.10.10 avec 32 octets de données :
Réponse de 192.168.10.10 : octets=32 temps&lt;1ms TTL=64
Réponse de 192.168.10.10 : octets=32 temps&lt;1ms TTL=64
Réponse de 192.168.10.10 : octets=32 temps=1 ms TTL=64
Réponse de 192.168.10.10 : octets=32 temps&lt;1ms TTL=64

Statistiques Ping pour 192.168.10.10:
    Paquets : envoyés = 4, reçus = 4, perdus = 0 (perte 0%),
Durée approximative des boucles en millisecondes :
    Minimum = 0ms, Maximum = 1ms, Moyenne = 0ms</pre>
<p>Le <strong>TTL</strong> reçu donne un indice sur le système distant : environ 64 pour Linux, 128 pour Windows, 255 pour beaucoup d’équipements réseau (moins le nombre de routeurs traversés).</p>

<div class="match" data-id="m-ping" data-label="Interpréter les messages de ping" data-options="Tout va bien|Pas de réponse : machine éteinte, filtrage ou réponse perdue|Le poste (ou sa passerelle) ne trouve pas l’hôte sur le réseau local|Le nom n’a pas pu être traduit en adresse IP (DNS)|Le poste n’a aucune route vers cette destination">
  <div class="r" data-ok="Tout va bien" data-expl="Une réponse avec un temps et un TTL : la cible est joignable.">Réponse de 172.16.2.225 : octets=32 temps&lt;1ms TTL=128</div>
  <div class="r" data-ok="Pas de réponse : machine éteinte, filtrage ou réponse perdue" data-expl="La demande est partie, aucune réponse n’est revenue dans le délai. On ne sait pas encore pourquoi : il faut d’autres tests.">Délai d’attente de la demande dépassé.</div>
  <div class="r" data-ok="Le poste (ou sa passerelle) ne trouve pas l’hôte sur le réseau local" data-expl="Le message vient du poste lui-même ou de la passerelle : la requête ARP pour la cible est restée sans réponse (machine éteinte, câble, adresse erronée).">Réponse de 172.16.8.165 : Impossible de joindre l’hôte de destination.</div>
  <div class="r" data-ok="Le nom n’a pas pu être traduit en adresse IP (DNS)" data-expl="Aucun paquet n’est même parti : la résolution du nom a échoué. Tester avec l’adresse IP, puis vérifier le serveur DNS configuré.">La requête Ping n’a pas pu trouver l’hôte intranet.m2l.lan. Vérifiez le nom et essayez à nouveau.</div>
  <div class="r" data-ok="Le poste n’a aucune route vers cette destination" data-expl="Message de Linux : pas de route correspondante ni de route par défaut (passerelle absente ou carte désactivée).">connect: Network is unreachable</div>
</div>

<h2>Suivre le chemin : <code>tracert</code> et <code>traceroute</code></h2>
<p><code>tracert</code> (Windows) et <code>traceroute</code> (Linux) affichent la liste des routeurs traversés. Principe : envoyer des paquets avec un TTL de 1, puis 2, puis 3… Le routeur où le TTL tombe à 0 renvoie un message ICMP « temps dépassé » (type 11), ce qui révèle son adresse. Chaque ligne est un <strong>saut</strong> (<em>hop</em>), mesuré trois fois.</p>
<pre class="code terminal"><span class="pr">C:\&gt;</span> tracert -d 9.9.9.9

Détermination de l’itinéraire vers 9.9.9.9 avec un maximum de 30 sauts.

  1    &lt;1 ms    &lt;1 ms    &lt;1 ms  192.168.10.254
  2     2 ms     1 ms     2 ms  100.64.0.1
  3     *        *        *     Délai d’attente de la demande dépassé.
  4     9 ms     8 ms     9 ms  198.51.100.17
  5    19 ms    19 ms    20 ms  9.9.9.9

Itinéraire déterminé.</pre>
<p><code>-d</code> évite de chercher le nom de chaque routeur (plus rapide). Une ligne d’étoiles signifie qu’un routeur ne répond pas aux sondes (souvent par choix) : ce n’est pas une panne si les sauts suivants répondent. Sous Linux, <code>traceroute</code> envoie par défaut des paquets UDP (paquet <code>traceroute</code> à installer) ; <code>tracepath</code> est souvent déjà présent.</p>

<h2>La méthode de diagnostic</h2>
<p>Face à « ça ne marche pas », on procède <strong>de bas en haut</strong>, en notant le résultat de chaque test. Chaque test réussi élimine une famille de causes.</p>
<ol class="steps">
  <li><strong>Couche physique</strong> : voyant de la carte et du port, câble branché, Wi-Fi connecté au bon réseau. Commande : <code>Get-NetAdapter</code> (état <em>Up</em> ou <em>Disconnected</em>), <code>ip link</code> (<code>state UP</code>).</li>
  <li><strong>Configuration IP</strong> : <code>ipconfig /all</code> ou <code>ip a</code> et <code>ip route</code>. L’adresse est-elle dans le bon réseau (plan d’adressage) ? Le masque, la passerelle, le serveur DNS sont-ils corrects ? Une adresse en <code>169.254.x.x</code> signale l’absence de DHCP.</li>
  <li><strong>Pile TCP/IP</strong> : <code>ping 127.0.0.1</code>.</li>
  <li><strong>Réseau local</strong> : <code>ping</code> de la passerelle (et d’un voisin). Succès : couches 1 à 3 du réseau local en bon état.</li>
  <li><strong>Routage</strong> : <code>ping</code> d’une adresse IP extérieure (un serveur de l’organisation dans un autre réseau, puis <code>9.9.9.9</code>). Échec : problème au-delà de la passerelle (routeur, pare-feu, accès Internet) ; <code>tracert</code> montre où cela s’arrête.</li>
  <li><strong>Résolution de noms</strong> : <code>ping</code> d’un <strong>nom</strong> ou <code>nslookup nom</code>. Si l’IP répond mais pas le nom : problème DNS (chapitre 3).</li>
  <li><strong>Application</strong> : le service lui-même (site, partage, imprimante) et son port.</li>
</ol>
<div class="aside pro">
  <p class="aside-title">Le réflexe du professionnel</p>
  <p>Avant de modifier quoi que ce soit : <strong>comparer avec un poste voisin qui fonctionne</strong> (même réseau, même prise de la même armoire), <strong>demander ce qui a changé</strong> (« depuis quand ? », « avez-vous déplacé le poste ? ») et <strong>noter</strong> chaque test et son résultat dans le ticket (GLPI à la M2L). Un ticket bien documenté permet à un collègue de reprendre le dépannage, et alimente la base de connaissances.</p>
</div>

<div class="answer" data-id="a-diag" data-label="Diagnostiquer trois situations à partir des tests" data-min="200" data-rows="10">
  <p>Trois postes de la ligue de volley (réseau <code>172.16.8.160/27</code>, passerelle <code>172.16.8.190</code>) ont un problème. Pour chacun, indiquer la couche ou le service en cause, la cause la plus probable et le test ou l’action suivante.</p>
  <ol>
    <li>Poste 1 : <code>ipconfig</code> affiche <code>169.254.31.7</code>, masque <code>255.255.0.0</code>, pas de passerelle.</li>
    <li>Poste 2 : adresse <code>172.16.8.166/27</code>, passerelle <code>.190</code>. <code>ping 172.16.8.190</code> : réponses. <code>ping 9.9.9.9</code> : réponses. <code>ping www.lorraine-sport.net</code> : « La requête Ping n’a pas pu trouver l’hôte… ».</li>
    <li>Poste 3 : adresse <code>172.16.8.167/27</code>, passerelle <code>.190</code>. <code>ping 172.16.8.190</code> : « Réponse de 172.16.8.167 : Impossible de joindre l’hôte de destination. » Le poste voisin, branché dans la même salle, fonctionne.</li>
  </ol>
  <div class="corr">
    <p><strong>Poste 1</strong> : adresse APIPA, le poste n’a reçu aucune réponse DHCP. Causes possibles : câble ou prise (couche 1), port du commutateur, serveur DHCP arrêté ou injoignable. Actions : vérifier le voyant et le câble, comparer avec un voisin ; si les voisins sont aussi en 169.254, le problème vient du serveur DHCP ou de l’équipement réseau commun. Puis <code>ipconfig /renew</code>.</p>
    <p><strong>Poste 2</strong> : les couches 1 à 3 et le routage fonctionnent (la passerelle et 9.9.9.9 répondent), seul le <strong>nom</strong> échoue : problème de <strong>résolution DNS</strong>. Action : <code>ipconfig /all</code> pour vérifier le serveur DNS configuré, puis <code>nslookup www.lorraine-sport.net</code>.</p>
    <p><strong>Poste 3</strong> : le message vient du poste lui-même : sa requête ARP vers la passerelle n’a pas de réponse, il ne communique pas sur le réseau local. Le voisin fonctionne, donc la passerelle va bien : le problème est propre au poste 3 ou à sa liaison (couche 1 ou 2 : câble, prise, port du commutateur ; ou carte réseau). Actions : vérifier le voyant, échanger le cordon, tester la prise avec le poste voisin, regarder l’état du port sur le commutateur (<code>show interfaces status</code>).</p>
  </div>
</div>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Conclure qu’une machine est éteinte parce qu’elle ne répond pas au ping : un pare-feu peut bloquer ICMP.</li>
    <li>Croire qu’un poste fait une requête ARP pour l’adresse d’un serveur d’Internet : il la fait pour sa <strong>passerelle</strong>.</li>
    <li>Commencer le diagnostic par le haut (navigateur, application) au lieu de vérifier d’abord le câble et la configuration IP.</li>
  </ul>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p6" data-title="ARP, ICMP et diagnostic" data-label="Quiz de fin de partie">
  <div class="q" data-ok="2">
    <p class="qt">Comment est envoyée une requête ARP ?</p>
    <ul><li>En envoi individuel à la passerelle</li><li>En diffusion à tout le réseau local</li><li>En multidiffusion à tous les routeurs</li><li>Au serveur DNS</li></ul>
    <div class="expl"><p>Le demandeur ne connaît pas encore l’adresse MAC cherchée : il diffuse sa question (<code>ff:ff:ff:ff:ff:ff</code>). La réponse, elle, est envoyée directement au demandeur.</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Quel message ICMP un routeur renvoie-t-il quand le TTL d’un paquet tombe à 0 ?</p>
    <ul><li>Réponse d’écho (type 0)</li><li>Destination injoignable (type 3)</li><li>Temps dépassé (type 11)</li><li>Demande d’écho (type 8)</li></ul>
    <div class="expl"><p>Type 11, <em>Time exceeded</em>. C’est ce message qui permet à <code>tracert</code> de découvrir chaque routeur.</p></div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Un poste joint sa passerelle et <code>9.9.9.9</code>, mais aucun site par son nom. Que vérifier en priorité ?</p>
    <ul><li>Le serveur DNS configuré et la résolution de noms</li><li>Le câble réseau</li><li>Le masque de sous-réseau</li><li>La table d’adresses MAC du commutateur</li></ul>
    <div class="expl"><p>Tout fonctionne jusqu’à la couche 3, y compris vers Internet : seule la traduction des noms en adresses échoue. C’est le DNS.</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Sous Linux, quelle commande affiche le cache ARP (table des voisins) ?</p>
    <ul><li><code>arp -a</code> uniquement</li><li><code>ip route</code></li><li><code>ip link</code></li><li><code>ip neigh</code></li></ul>
    <div class="expl"><p><code>ip neigh</code> (<em>neighbour</em>). <code>ip route</code> affiche la table de routage et <code>ip link</code> les cartes. La commande <code>arp</code> existe aussi sous Linux, mais elle est ancienne et pas toujours installée.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Dans un <code>tracert</code>, le saut 3 affiche des étoiles, mais les sauts 4 et 5 répondent. Que conclure ?</p>
    <ul><li>La liaison est coupée au saut 3</li><li>Le routeur du saut 3 ne répond pas aux sondes, mais il transmet bien les paquets</li><li>Le serveur de destination est éteint</li><li>Le TTL est trop grand</li></ul>
    <div class="expl"><p>Si le paquet atteint les sauts suivants, c’est que le routeur 3 le transmet : il choisit simplement de ne pas envoyer de message ICMP (configuration courante chez les opérateurs).</p></div>
  </div>
</div>

<div class="aside next">
  <p class="aside-title">La suite</p>

</div>

<h1>L’adressage IPv6</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : <a href="#p4">partie 4</a> (préfixe, masque) et <a href="#p6">partie 6</a> (ARP, ICMP). Savoir compter en <strong>hexadécimal</strong> : 0 à 9 puis A (10) à F (15) ; un chiffre hexadécimal = 4 bits. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">IPv6</div><ul>
  <li><span><b>128 bits</b> : 8 groupes hexadécimaux, règles d’abréviation</span></li>
  <li><span><b>Préfixe /64</b> : réseau + identifiant d’interface</span></li>
  <li><span><b>Types</b> : globale, lien local, ULA, multicast</span></li>
  <li><span><b>NDP</b> : ICMPv6 remplace ARP</span></li>
  <li><span><b>Configuration</b> : SLAAC, DHCPv6, statique</span></li>
  <li><span><b>Cohabitation</b> : double pile</span></li>
</ul></div></figure>

<p class="lead">IPv6 n’est pas « IPv4 avec plus d’adresses » : les principes de routage restent les mêmes, mais la notation, les types d’adresses et la façon dont un poste obtient son adresse changent. Les postes Windows et Linux l’activent par défaut, souvent sans que personne le sache : un technicien doit savoir le lire et le diagnostiquer.</p>

<h2>Pourquoi IPv6 ?</h2>
<p>IPv4 offre environ 4,3 milliards d’adresses. L’IANA a distribué ses derniers blocs en <strong>février 2011</strong> ; le RIPE NCC, qui attribue les adresses en Europe, a épuisé son stock en <strong>novembre 2019</strong>. Le NAT a permis de prolonger IPv4 en partageant une adresse publique entre de nombreux appareils, au prix d’une complexité croissante (une connexion entrante vers un appareil derrière un NAT est difficile).</p>
<p>IPv6 (RFC 8200) utilise des adresses de <strong>128 bits</strong> : 2<sup>128</sup> ≈ 3,4 × 10<sup>38</sup> adresses. Chaque réseau local reçoit à lui seul 2<sup>64</sup> adresses, soit plus de 18 milliards de milliards.</p>

<h2>Écrire une adresse IPv6</h2>
<p>Une adresse IPv6 s’écrit en <strong>8 groupes de 16 bits</strong>, chacun noté par <strong>4 chiffres hexadécimaux</strong>, séparés par deux-points :</p>
<pre class="code">2001:0db8:acad:0001:0000:0000:0000:0010</pre>
<h3>Les règles d’abréviation</h3>
<ol class="steps">
  <li>Dans chaque groupe, supprimer les <strong>zéros de tête</strong> : <code>0db8</code> → <code>db8</code>, <code>0001</code> → <code>1</code>, <code>0000</code> → <code>0</code>, <code>0010</code> → <code>10</code> (jamais les zéros de fin : <code>0010</code> ne devient pas <code>1</code>).</li>
  <li>Remplacer <strong>une seule</strong> suite de groupes nuls consécutifs par <code>::</code>. Sinon, on ne saurait plus combien de groupes chaque <code>::</code> remplace.</li>
  <li>Recommandations de la RFC 5952, pour que tout le monde écrive la même chose : utiliser <code>::</code> pour la suite de zéros <strong>la plus longue</strong> (la première en cas d’égalité), ne pas l’utiliser pour un seul groupe nul, écrire en <strong>minuscules</strong>.</li>
</ol>
<pre class="code">2001:0db8:acad:0001:0000:0000:0000:0010
→ 2001:db8:acad:1:0:0:0:10      (zéros de tête supprimés)
→ 2001:db8:acad:1::10           (suite de trois groupes nuls → ::)</pre>
<p>Pour <strong>développer</strong> une adresse abrégée : compter les groupes écrits, le <code>::</code> remplace autant de groupes <code>0000</code> qu’il en manque pour arriver à 8.</p>

<p>Pour chaque écriture, dire si elle est valide, puis, si oui, si c’est la forme recommandée par la RFC 5952.</p>
<div class="ctab" data-id="c-abrev" data-head="Écriture" data-cols="Écriture valide ?|Forme recommandée ?" data-choices="OUI|NON" data-gate="NON" data-label="Abréviations IPv6 valides et recommandées">
  <div class="r" data-ok="OUI|OUI" data-expl="Forme complète 2001:0db8:0000:0000:0000:ff00:0042:8329 : zéros de tête supprimés, la suite de trois groupes nuls remplacée par ::.">2001:db8::ff00:42:8329</div>
  <div class="r" data-ok="NON|" data-expl="Deux :: dans la même adresse : impossible de savoir combien de groupes chacun remplace.">2001:db8::1::1</div>
  <div class="r" data-ok="OUI|NON" data-expl="Valide (2001:db8:0:0:1:0:0:1), mais quand deux suites de zéros ont la même longueur, la RFC 5952 demande d’abréger la première : 2001:db8::1:0:0:1.">2001:db8:0:0:1::1</div>
  <div class="r" data-ok="OUI|NON" data-expl="Valide (les majuscules et les zéros de tête sont acceptés), mais la forme recommandée est fe80::a00:27ff:fe3a:5c01.">FE80:0000:0000:0000:0A00:27FF:FE3A:5C01</div>
  <div class="r" data-ok="OUI|NON" data-expl="Valide, mais le zéro de tête de 0042 doit être supprimé : 2001:db8::42:1.">2001:db8::0042:1</div>
  <div class="r" data-ok="OUI|NON" data-expl="Ici :: ne remplace qu’un seul groupe (2001:db8:0:1:0:0:0:1), alors qu’une suite de trois zéros existe plus loin : forme recommandée 2001:db8:0:1::1.">2001:db8::1:0:0:0:1</div>
  <div class="r" data-ok="OUI|OUI" data-expl="Forme abrégée correcte de 2001:0db8:acad:0001:0000:0000:0000:0010.">2001:db8:acad:1::10</div>
</div>

<div class="answer" data-id="a-abrev" data-kind="code" data-label="Développer et abréger des adresses IPv6" data-min="100" data-rows="8">
  <p>a) Développer (8 groupes de 4 chiffres) : <code>2001:db8:acad:1::10</code>, <code>fe80::1</code>, <code>::1</code>. b) Abréger selon la RFC 5952 : <code>2001:0db8:0000:0000:0000:0000:0000:0001</code> et <code>ff02:0000:0000:0000:0000:0001:ff00:0010</code>.</p>
  <div class="corr">
    <pre class="code">a) 2001:db8:acad:1::10 → 5 groupes écrits, :: = 3 groupes
   = 2001:0db8:acad:0001:0000:0000:0000:0010
   fe80::1 → 2 groupes écrits, :: = 6 groupes
   = fe80:0000:0000:0000:0000:0000:0000:0001
   ::1 → 1 groupe écrit, :: = 7 groupes
   = 0000:0000:0000:0000:0000:0000:0000:0001
b) 2001:db8::1
   ff02::1:ff00:10</pre>
  </div>
</div>

<h2>Préfixe et identifiant d’interface</h2>
<p>Comme en IPv4, une adresse IPv6 a une partie réseau, appelée <strong>préfixe</strong>, notée en CIDR : <code>2001:db8:acad:1::10/64</code>. Il n’y a pas de masque en notation décimale.</p>
<ul>
  <li>Sur un réseau local, le préfixe fait <strong>toujours 64 bits</strong> (/64) : les 4 premiers groupes. Les 64 bits restants forment l’<strong>identifiant d’interface</strong> (IID), l’équivalent de la partie hôte. La configuration automatique (SLAAC) exige un /64.</li>
  <li>Un opérateur attribue à un site un préfixe plus court, en général un <strong>/48</strong> (ou un /56 pour un particulier). Avec un /48, le 4<sup>e</sup> groupe sert à numéroter les réseaux : 2<sup>16</sup> = 65 536 réseaux /64. Le découpage se fait alors simplement en choisissant la valeur de ce groupe, sans calcul de taille de bloc.</li>
  <li>Il n’y a <strong>pas d’adresse de diffusion</strong> en IPv6, et la première adresse du réseau n’est pas « interdite » comme en IPv4.</li>
</ul>
<pre class="code">2001:0db8:acad:0001 : 0a00:27ff:fe3a:5c01
└─ préfixe /64 ─────┘   └─ identifiant d’interface ┘
└ /48 du site ┘└ n° de réseau (16 bits)</pre>

<h2>Les types d’adresses</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Type</th><th>Préfixe</th><th>Exemple</th><th>Rôle</th></tr>
  <tr><td><strong>Globale</strong> (GUA)</td><td><code>2000::/3</code> (commence par 2 ou 3)</td><td><code>2a01:cb00:1234:5600::42</code></td><td>Unique et routée sur Internet. L’équivalent d’une adresse publique : en IPv6, pas besoin de NAT.</td></tr>
  <tr><td><strong>Lien local</strong></td><td><code>fe80::/10</code></td><td><code>fe80::a00:27ff:fe3a:5c01</code></td><td>Valable seulement sur le lien (le réseau local) ; jamais routée. <strong>Toute interface IPv6 en a une</strong>, automatiquement. Utilisée par NDP et par les routeurs entre eux.</td></tr>
  <tr><td><strong>Unique locale</strong> (ULA)</td><td><code>fc00::/7</code> (en pratique <code>fd00::/8</code>)</td><td><code>fd4c:2c3e:7a10:1::1</code></td><td>Usage interne, non routée sur Internet : l’équivalent des adresses privées.</td></tr>
  <tr><td><strong>Multicast</strong></td><td><code>ff00::/8</code></td><td><code>ff02::1</code> (tous les nœuds du lien), <code>ff02::2</code> (tous les routeurs du lien)</td><td>Destinée à un groupe. Remplace la diffusion.</td></tr>
  <tr><td>Bouclage</td><td><code>::1/128</code></td><td><code>::1</code></td><td>La machine elle-même (équivalent de 127.0.0.1).</td></tr>
  <tr><td>Non spécifiée</td><td><code>::/128</code></td><td><code>::</code></td><td>« Aucune adresse » : utilisée par un poste qui n’a pas encore d’adresse.</td></tr>
  <tr><td>Documentation</td><td><code>2001:db8::/32</code></td><td><code>2001:db8:acad:1::10</code></td><td>Réservée aux exemples et aux maquettes (comme dans ce cours).</td></tr>
</table></div>
<p>Une interface IPv6 a donc <strong>plusieurs adresses en même temps</strong> : au minimum une adresse de lien local, en général une ou plusieurs adresses globales, et elle est abonnée à plusieurs groupes multicast. C’est normal, et très différent d’IPv4.</p>

<div class="match" data-id="m-types6" data-label="Reconnaître les types d’adresses IPv6" data-options="Globale (GUA)|Lien local|Unique locale (ULA)|Multicast|Bouclage|Non spécifiée">
  <div class="r" data-ok="Globale (GUA)" data-expl="Commence par 2 : dans 2000::/3.">2a01:e0a:1f2:3c40::5</div>
  <div class="r" data-ok="Lien local" data-expl="fe80::/10.">fe80::1</div>
  <div class="r" data-ok="Unique locale (ULA)" data-expl="fd00::/8 : adresse interne.">fd12:3456:789a:1::1</div>
  <div class="r" data-ok="Multicast" data-expl="Commence par ff : ff02::2 désigne tous les routeurs du lien.">ff02::2</div>
  <div class="r" data-ok="Bouclage" data-expl="::1 = la machine elle-même.">::1</div>
  <div class="r" data-ok="Non spécifiée" data-expl="128 bits à 0 : pas encore d’adresse.">::</div>
  <div class="r" data-ok="Globale (GUA)" data-expl="2001:db8::/32 fait partie de 2000::/3 : c’est une adresse globale par son format. Ce bloc est cependant réservé à la documentation et aux maquettes : on ne le voit jamais sur Internet.">2001:db8:acad:1::10</div>
</div>

<h2>L’identifiant d’interface</h2>
<p>Les 64 bits de l’identifiant d’interface peuvent être :</p>
<ul>
  <li><strong>choisis par l’administrateur</strong> (adresse statique) : <code>::1</code> pour un routeur, <code>::10</code> pour un serveur. Faciles à retenir ;</li>
  <li><strong>calculés à partir de l’adresse MAC</strong>, selon la méthode <strong>EUI-64</strong> (Debian et le matériel Cisco par défaut) ;</li>
  <li><strong>aléatoires</strong> : Windows, macOS, Android et NetworkManager (Kubuntu) génèrent des identifiants aléatoires ou stables mais opaques, pour éviter qu’un appareil soit suivi d’un réseau à l’autre grâce à son adresse MAC. Windows crée en plus des adresses <strong>temporaires</strong>, renouvelées régulièrement, pour les connexions sortantes.</li>
</ul>
<h3>La méthode EUI-64</h3>
<ol class="steps">
  <li>Couper l’adresse MAC en deux : <code>08:00:27</code> | <code>3a:5c:01</code>.</li>
  <li>Insérer <code>ff:fe</code> au milieu : <code>08:00:27:ff:fe:3a:5c:01</code> (64 bits).</li>
  <li>Inverser le 7<sup>e</sup> bit du premier octet (bit U/L) : <code>08</code> = <code>0000 1000</code> → <code>0000 1010</code> = <code>0a</code>.</li>
  <li>Grouper par 16 bits : <code>0a00:27ff:fe3a:5c01</code>, soit <code>a00:27ff:fe3a:5c01</code>.</li>
</ol>
<p>Adresse de lien local : <code>fe80::a00:27ff:fe3a:5c01</code>. C’est bien l’adresse source de la trame 1 de la capture du <a href="#tp4">TP 4</a>. On reconnaît une adresse EUI-64 au <code>ff:fe</code> au milieu de l’identifiant.</p>
<div class="answer" data-id="a-eui64" data-kind="code" data-label="Calculer des identifiants EUI-64" data-min="60" data-rows="6">
  <p>Calculer l’adresse de lien local EUI-64 : a) du routeur dont l’adresse MAC est <code>00:00:0c:5e:21:a7</code> ; b) du serveur dont l’adresse MAC est <code>08:00:27:91:b2:4e</code>. c) Quelle sera l’adresse globale du serveur dans le réseau <code>2001:db8:acad:1::/64</code> s’il utilise EUI-64 ?</p>
  <div class="corr">
    <pre class="code">a) 00:00:0c | 5e:21:a7 → 00:00:0c:ff:fe:5e:21:a7
   00 = 0000 0000 → 0000 0010 = 02 → 0200:0cff:fe5e:21a7
   fe80::200:cff:fe5e:21a7
b) 08:00:27 | 91:b2:4e → 08 → 0a → 0a00:27ff:fe91:b24e
   fe80::a00:27ff:fe91:b24e
c) 2001:db8:acad:1:a00:27ff:fe91:b24e</pre>
  </div>
</div>

<h2>NDP : la découverte des voisins</h2>
<p>IPv6 n’utilise ni ARP ni diffusion. Ces rôles sont tenus par <strong>NDP</strong> (<em>Neighbor Discovery Protocol</em>, RFC 4861), qui utilise des messages <strong>ICMPv6</strong> envoyés en <strong>multicast</strong> :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Type ICMPv6</th><th>Message</th><th>Rôle</th><th>Équivalent IPv4</th></tr>
  <tr><td>133</td><td>Sollicitation de routeur (<strong>RS</strong>)</td><td>Un poste qui démarre demande « y a-t-il un routeur ? » à <code>ff02::2</code>.</td><td>—</td></tr>
  <tr><td>134</td><td>Annonce de routeur (<strong>RA</strong>)</td><td>Le routeur annonce, à <code>ff02::1</code>, le <strong>préfixe</strong> du réseau, sa propre adresse de lien local (qui devient la passerelle), et la méthode de configuration à utiliser.</td><td>Une partie de DHCP</td></tr>
  <tr><td>135</td><td>Sollicitation de voisin (<strong>NS</strong>)</td><td>« Qui a cette adresse IPv6 ? » envoyé à une adresse multicast particulière, dite <em>de nœud sollicité</em>.</td><td>Requête ARP</td></tr>
  <tr><td>136</td><td>Annonce de voisin (<strong>NA</strong>)</td><td>« C’est moi, voici mon adresse MAC. »</td><td>Réponse ARP</td></tr>
  <tr><td>137</td><td>Redirection</td><td>Un routeur indique un meilleur premier saut.</td><td>ICMP redirect</td></tr>
</table></div>
<dl class="def">
  <dt>Adresse multicast de nœud sollicité</dt><dd><code>ff02::1:ff</code> suivi des <strong>24 derniers bits</strong> de l’adresse cherchée. Pour <code>2001:db8:acad:1::10</code> : <code>ff02::1:ff00:10</code>. Seuls les quelques hôtes dont l’adresse finit pareil traitent le message : c’est beaucoup plus économe qu’une diffusion ARP, traitée par tout le monde.</dd>
  <dt>Adresse MAC multicast</dt><dd>Une trame vers une adresse multicast IPv6 a pour adresse MAC de destination <code>33:33</code> suivi des <strong>32 derniers bits</strong> de l’adresse IPv6 : <code>ff02::2</code> → <code>33:33:00:00:00:02</code> (trame 1 du TP 4).</dd>
  <dt>Détection d’adresse dupliquée (DAD)</dt><dd>Avant d’utiliser une nouvelle adresse, le poste envoie une NS pour sa propre adresse, depuis l’adresse non spécifiée <code>::</code>. Sans réponse, l’adresse est libre.</dd>
</dl>

<h2>Obtenir une adresse</h2>
<dl class="def">
  <dt>Configuration statique</dt><dd>Saisie par l’administrateur : routeurs, serveurs.</dd>
  <dt>SLAAC <small>configuration automatique sans état</small></dt><dd>Le poste reçoit le préfixe dans l’annonce de routeur (drapeau <em>A</em> de l’option préfixe) et fabrique lui-même son identifiant d’interface (EUI-64 ou aléatoire), puis vérifie qu’il est libre (DAD). Aucun serveur ne garde la trace des adresses attribuées. Mode par défaut sur la plupart des réseaux.</dd>
  <dt>DHCPv6</dt><dd>Un serveur DHCPv6 fournit des informations : soit seulement les serveurs DNS (<em>sans état</em>, drapeau <em>O</em> de la RA), soit aussi l’adresse (<em>avec état</em>, drapeau <em>M</em>). À noter : Android ne prend pas en charge DHCPv6 avec état, d’où l’importance de SLAAC.</dd>
</dl>
<p>Dans tous les cas, la <strong>passerelle</strong> est apprise par l’annonce de routeur : c’est l’adresse <strong>de lien local</strong> du routeur (<code>fe80::1</code>), et non une adresse globale.</p>

<h3>Lire sa configuration IPv6</h3>
<pre class="code terminal"><span class="pr">C:\&gt;</span> ipconfig
Carte Ethernet Ethernet :
   Adresse IPv6. . . . . . . . . . . . . .: 2001:db8:acad:1:3c5e:91aa:7b2:e41f
   Adresse IPv6 temporaire . . . . . . . .: 2001:db8:acad:1:9d1:4f20:c6e3:12ab
   Adresse IPv6 de liaison locale. . . . .: fe80::3c5e:91aa:7b2:e41f%12
   Adresse IPv4. . . . . . . . . . . . . .: 192.168.10.30
   Masque de sous-réseau. . . . . . . . . : 255.255.255.0
   Passerelle par défaut. . . . . . . . . : fe80::1%12
                                            192.168.10.254
<span class="pr">$</span> ip -6 address show dev enp0s3
    inet6 2001:db8:acad:1:a00:27ff:fe3a:5c01/64 scope global dynamic
    inet6 fe80::a00:27ff:fe3a:5c01/64 scope link
<span class="pr">$</span> ip -6 route
<span class="pr">$</span> ip -6 neigh</pre>
<p>Le <code>%12</code> (Windows) ou <code>%enp0s3</code> (Linux) est l’<strong>index de zone</strong> : une adresse de lien local existe sur chaque carte, il faut donc préciser laquelle utiliser (<code>ping fe80::1%12</code>). Le poste Windows ci-dessus est en <strong>double pile</strong> : IPv4 et IPv6 fonctionnent en même temps.</p>

<h2>L’en-tête IPv6 et la cohabitation avec IPv4</h2>
<p>L’en-tête IPv6 a une taille fixe de <strong>40 octets</strong> (contre 20 à 60 en IPv4) et moins de champs : version, classe de trafic, étiquette de flux, longueur des données, <strong>en-tête suivant</strong> (le protocole transporté : 58 pour ICMPv6, 6 pour TCP, 17 pour UDP), <strong>limite de sauts</strong> (<em>hop limit</em>, l’équivalent du TTL), adresse source, adresse de destination. Il n’y a plus de somme de contrôle (les couches 2 et 4 en ont une) et les routeurs ne fragmentent plus les paquets : c’est l’émetteur qui adapte leur taille. Ces simplifications accélèrent le traitement dans les routeurs.</p>
<p>IPv4 et IPv6 ne sont pas compatibles entre eux : un hôte uniquement IPv6 ne peut pas parler directement à un hôte uniquement IPv4. La transition se fait surtout par la <strong>double pile</strong> (chaque équipement a les deux), complétée selon les cas par des tunnels ou des traducteurs (NAT64). En France, une grande partie des connexions grand public sont déjà en IPv6.</p>

<div class="aside deep">
  <p class="aside-title">IPv6 et sécurité : l’oubli fréquent</p>
  <p>Un réseau « en IPv4 » où personne n’a configuré IPv6 a quand même des postes qui parlent IPv6 en lien local, et qui accepteraient l’annonce de routeur d’un équipement malveillant. Les règles de pare-feu écrites pour IPv4 ne s’appliquent pas à IPv6 : il faut <strong>les deux jeux de règles</strong>. Désactiver IPv6 « pour être tranquille » n’est pas une bonne pratique (Microsoft le déconseille) : il vaut mieux le maîtriser.</p>
</div>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Utiliser <code>::</code> deux fois dans la même adresse, ou supprimer les zéros de <strong>fin</strong> d’un groupe.</li>
    <li>Chercher l’adresse de diffusion d’un réseau IPv6 : elle n’existe pas, le multicast la remplace.</li>
    <li>S’étonner qu’une carte ait plusieurs adresses IPv6 : lien local, globale, temporaire… c’est le fonctionnement normal.</li>
  </ul>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p7" data-title="L’adressage IPv6" data-label="Quiz de fin de partie">
  <div class="q" data-ok="3">
    <p class="qt">Combien de bits compte une adresse IPv6 ?</p>
    <ul><li>32</li><li>64</li><li>128</li><li>48</li></ul>
    <div class="expl"><p>128 bits, écrits en 8 groupes de 16 bits. Le préfixe d’un réseau local fait 64 bits.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Quelle est la forme abrégée recommandée de <code>2001:0db8:0000:0000:0000:0000:0000:00a1</code> ?</p>
    <ul><li>2001:db8::a1:0</li><li>2001:db8::a1</li><li>2001:db8:0::a1</li><li>2001:db8::0a1</li></ul>
    <div class="expl"><p>Zéros de tête supprimés (<code>0db8</code> → <code>db8</code>, <code>00a1</code> → <code>a1</code>), puis la suite de 5 groupes nuls remplacée par <code>::</code>.</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Quel protocole remplace ARP en IPv6 ?</p>
    <ul><li>DHCPv6</li><li>ICMP (type 8)</li><li>DNS</li><li>NDP, avec les messages ICMPv6 NS et NA</li></ul>
    <div class="expl"><p>La sollicitation de voisin (NS, type 135) et l’annonce de voisin (NA, type 136) de NDP jouent le rôle de la requête et de la réponse ARP.</p></div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Une adresse qui commence par <code>fe80</code> est…</p>
    <ul><li>une adresse de lien local, présente sur toute interface IPv6 et jamais routée</li><li>une adresse globale routée sur Internet</li><li>une adresse multicast</li><li>l’adresse de diffusion du réseau</li></ul>
    <div class="expl"><p><code>fe80::/10</code> : lien local. Chaque interface IPv6 en a une, créée automatiquement.</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">En SLAAC, d’où le poste tient-il le préfixe de son réseau ?</p>
    <ul><li>D’un serveur DHCP IPv4</li><li>De son adresse MAC</li><li>De l’annonce de routeur (RA) envoyée par le routeur</li><li>Du serveur DNS</li></ul>
    <div class="expl"><p>Le routeur annonce le préfixe dans ses RA ; le poste y ajoute son identifiant d’interface. L’adresse MAC peut servir à calculer l’identifiant (EUI-64), pas le préfixe.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Combien de réseaux /64 un site peut-il créer avec un préfixe /48 ?</p>
    <ul><li>16</li><li>65 536</li><li>256</li><li>2<sup>64</sup></li></ul>
    <div class="expl"><p>64 − 48 = 16 bits pour numéroter les réseaux : 2<sup>16</sup> = 65 536.</p></div>
  </div>
</div>
