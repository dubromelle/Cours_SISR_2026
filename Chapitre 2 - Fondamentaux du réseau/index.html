<h2>Mission 1 : un routeur IPv6 dans Packet Tracer</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Deux réseaux, un routeur, des postes en SLAAC</summary>
  <div class="task-body">
    <p>Maquette à construire : un routeur <strong>R1</strong> (modèle 4331 ; avec un 2911, les interfaces s’appellent <code>GigabitEthernet0/0</code> et <code>GigabitEthernet0/1</code>), deux commutateurs 2960, PC-A et PC-B sur le réseau 1, PC-C sur le réseau 2.</p>
    <div class="tbl-wrap"><table class="data">
      <tr><th>Réseau</th><th>Préfixe</th><th>Interface de R1</th><th>Adresses de R1</th></tr>
      <tr><td>Réseau 1</td><td class="mono">2001:db8:acad:1::/64</td><td class="mono">G0/0/0</td><td class="mono">2001:db8:acad:1::1 et fe80::1</td></tr>
      <tr><td>Réseau 2</td><td class="mono">2001:db8:acad:2::/64</td><td class="mono">G0/0/1</td><td class="mono">2001:db8:acad:2::1 et fe80::1</td></tr>
    </table></div>
    <ol class="steps">
      <li>Placer et câbler les équipements (câbles droits) : R1 G0/0/0 vers le commutateur 1, R1 G0/0/1 vers le commutateur 2, chaque PC vers son commutateur.</li>
      <li>Ouvrir R1, onglet <em>CLI</em>. Répondre <code>no</code> à la question de configuration initiale, puis saisir la configuration ci-dessous <strong>en la tapant</strong> (pas de copier-coller : la mémorisation des commandes fait partie de l’apprentissage).</li>
    </ol>
    <pre class="code terminal">Router&gt; enable
Router# configure terminal
Router(config)# hostname R1
R1(config)# ipv6 unicast-routing
R1(config)# interface GigabitEthernet0/0/0
R1(config-if)# ipv6 address 2001:db8:acad:1::1/64
R1(config-if)# ipv6 address fe80::1 link-local
R1(config-if)# no shutdown
R1(config-if)# exit
R1(config)# interface GigabitEthernet0/0/1
R1(config-if)# ipv6 address 2001:db8:acad:2::1/64
R1(config-if)# ipv6 address fe80::1 link-local
R1(config-if)# no shutdown
R1(config-if)# end
R1# show ipv6 interface brief
R1# copy running-config startup-config</pre>
    <ol class="steps">
      <li>Sur chaque PC : <em>Desktop &gt; IP Configuration</em>, rubrique <em>IPv6 Configuration</em>, choisir <strong>Automatic</strong>. Après quelques secondes, l’adresse et la passerelle apparaissent.</li>
      <li>Sur PC-A : <em>Command Prompt</em>, <code>ipconfig</code>, puis tester avec <code>ping</code> l’adresse globale de PC-B, puis celle de PC-C.</li>
      <li>Sur R1 : <code>show ipv6 route</code> et <code>show ipv6 neighbors</code>.</li>
    </ol>
    <div class="answer" data-id="t7-pt" data-label="Mission 1 : configuration observée et tests" data-min="150" data-rows="9">
      <p>a) Relever l’adresse IPv6 globale et la passerelle obtenues par PC-A. Expliquer comment la partie préfixe et la partie identifiant ont été obtenues. b) Pourquoi R1 peut-il avoir la même adresse <code>fe80::1</code> sur ses deux interfaces ? c) À quoi sert la commande <code>ipv6 unicast-routing</code> ? Que se passe-t-il sans elle ? d) Donner le résultat attendu, puis obtenu, des pings PC-A → PC-B et PC-A → PC-C.</p>
      <p class="hint">Dans Packet Tracer, l’identifiant d’interface des PC est calculé par EUI-64 : retrouver l’adresse MAC du PC dans <code>ipconfig /all</code>.</p>
      <div class="corr">
        <p>a) Adresse de la forme <code>2001:db8:acad:1:2xx:xxff:fexx:xxxx</code> : le <strong>préfixe</strong> <code>2001:db8:acad:1::/64</code> vient de l’<strong>annonce de routeur</strong> (RA) de R1 ; l’<strong>identifiant</strong> est calculé par le PC à partir de son adresse MAC (EUI-64 : <code>ff:fe</code> au milieu, 7<sup>e</sup> bit inversé). Passerelle : <code>FE80::1</code>, l’adresse de lien local de R1, apprise elle aussi par la RA.</p>
        <p>b) Une adresse de lien local n’a de sens que <strong>sur un lien</strong> : elle n’est jamais routée. Deux interfaces sur deux liens différents peuvent donc porter la même ; c’est même une bonne pratique, car tous les postes ont ainsi la même passerelle, facile à retenir.</p>
        <p>c) Elle active le <strong>routage IPv6</strong> : R1 transmet les paquets IPv6 d’un réseau à l’autre et envoie des annonces de routeur. Sans elle, R1 ne route pas l’IPv6 et n’envoie pas de RA : les PC en <em>Automatic</em> n’obtiennent qu’une adresse de lien local, sans adresse globale ni passerelle.</p>
        <p>d) Attendu et obtenu : succès pour PC-B (même réseau, découverte par NDP), succès pour PC-C (autre réseau, en passant par R1). Le premier écho peut être perdu, le temps de la découverte des voisins.</p>
      </div>
    </div>
    <pre class="code terminal">R1# show ipv6 interface brief
GigabitEthernet0/0/0   [up/up]
    FE80::1
    2001:DB8:ACAD:1::1
GigabitEthernet0/0/1   [up/up]
    FE80::1
    2001:DB8:ACAD:2::1</pre>
    <p>Le matériel Cisco affiche les adresses IPv6 en majuscules : c’est sans importance, l’hexadécimal ne distingue pas la casse. <code>[up/up]</code> : couche 1 active (câble) / couche 2 active (protocole) ; <code>[administratively down/down]</code> signale un <code>no shutdown</code> oublié.</p>
    <p>Enregistrer la maquette sous <code>TP7-NOM-Prenom.pkt</code>.</p>
  </div>
</details>

<h2>Mission 2 : analyser une capture NDP</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>De la sollicitation de routeur au premier écho</summary>
  <div class="task-body">
    <p>Cette capture a été faite sur PC-A (MAC <code>08:00:27:3a:5c:01</code>) au moment où il se branche sur le réseau 1 d’une maquette identique, puis lance <code>ping -c 2 2001:db8:acad:1::10</code> vers un serveur (MAC <code>08:00:27:91:b2:4e</code>). Le routeur R1 a l’adresse MAC <code>00:00:0c:5e:21:a7</code>.</p>
    <p><a class="dl-cap" href="data:application/vnd.tcpdump.pcap;base64,1MOyoQIABAAAAAAAAAAAAP//AAABAAAA4LThagAAAABGAAAARgAAADMzAAAAAggAJzpcAYbdYAAAAAAQOv/+gAAAAAAAAAoAJ//+OlwB/wIAAAAAAAAAAAAAAAAAAoUAZLcAAAAAAQEIACc6XAHgtOFq/AUAAHYAAAB2AAAAMzMAAAABAAAMXiGnht1gAAAAAEA6//6AAAAAAAAAAAAAAAAAAAH/AgAAAAAAAAAAAAAAAAABhgAVN0AABwgAAAAAAAAAAAEBAAAMXiGnBQEAAAAABdwDBEDAACeNAAAJOoAAAAAAIAENuKytAAEAAAAAAAAAAOC04Wr4BwAATgAAAE4AAAAzM/86XAEIACc6XAGG3WAAAAAAGDr/AAAAAAAAAAAAAAAAAAAAAP8CAAAAAAAAAAAAAf86XAGHALfJAAAAACABDbisrQABCgAn//46XAHltOFqXUcDAFYAAABWAAAAMzP/AAAQCAAnOlwBht1gAAAAACA6/yABDbisrQABCgAn//46XAH/AgAAAAAAAAAAAAH/AAAQhwCtOAAAAAAgAQ24rK0AAQAAAAAAAAAQAQEIACc6XAHltOFqBUkDAFYAAABWAAAACAAnOlwBCAAnkbJOht1gAAAAACA6/yABDbisrQABAAAAAAAAABAgAQ24rK0AAQoAJ//+OlwBiAAYMWAAAAAgAQ24rK0AAQAAAAAAAAAQAgEIACeRsk7ltOFqJkkDAHYAAAB2AAAACAAnkbJOCAAnOlwBht1gAAAAAEA6QCABDbisrQABCgAn//46XAEgAQ24rK0AAQAAAAAAAAAQgABagysRAAEQERITFBUWFxgZGhscHR4fICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj9AQUJDREVGR+W04WqeSgMAdgAAAHYAAAAIACc6XAEIACeRsk6G3WAAAAAAQDpAIAENuKytAAEAAAAAAAAAECABDbisrQABCgAn//46XAGBAFmDKxEAARAREhMUFRYXGBkaGxwdHh8gISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+P0BBQkNERUZH5rThakZPAwB2AAAAdgAAAAgAJ5GyTggAJzpcAYbdYAAAAABAOkAgAQ24rK0AAQoAJ//+OlwBIAENuKytAAEAAAAAAAAAEIAAWoIrEQACEBESExQVFhcYGRobHB0eHyAhIiMkJSYnKCkqKywtLi8wMTIzNDU2Nzg5Ojs8PT4/QEFCQ0RFRkfmtOFqp1ADAHYAAAB2AAAACAAnOlwBCAAnkbJOht1gAAAAAEA6QCABDbisrQABAAAAAAAAABAgAQ24rK0AAQoAJ//+OlwBgQBZgisRAAIQERITFBUWFxgZGhscHR4fICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj9AQUJDREVGRw==" download="capture-tp7-ipv6-ndp.pcap">⬇ Télécharger la capture capture-tp7-ipv6-ndp.pcap</a></p>
    <p>Filtres utiles : <code>icmpv6</code>, <code>icmpv6.type == 134</code> (annonces de routeur), <code>icmpv6.type == 135 or icmpv6.type == 136</code> (NS et NA).</p>
    <div class="pick" data-id="t7-arp" data-ok="4,5" data-label="Mission 2 : repérer les trames qui jouent le rôle d’ARP">
      <div class="pq"><p>Cliquer sur les deux trames qui jouent le rôle de la requête et de la réponse ARP (PC-A cherche l’adresse MAC du serveur).</p></div>
      <div class="tbl-wrap"><table class="data"><thead><tr><th class="num">N°</th><th>Source</th><th>Destination</th><th>Long.</th><th>Info</th></tr></thead><tbody>
        <tr><td class="num">1</td><td>fe80::a00:27ff:fe3a:5c01</td><td>ff02::2</td><td>70</td><td>Router Solicitation</td></tr>
        <tr><td class="num">2</td><td>fe80::1</td><td>ff02::1</td><td>118</td><td>Router Advertisement</td></tr>
        <tr><td class="num">3</td><td>::</td><td>ff02::1:ff3a:5c01</td><td>78</td><td>Neighbor Solicitation for 2001:db8:acad:1:a00:27ff:fe3a:5c01</td></tr>
        <tr><td class="num">4</td><td>2001:db8:acad:1:a00:27ff:fe3a:5c01</td><td>ff02::1:ff00:10</td><td>86</td><td>Neighbor Solicitation for 2001:db8:acad:1::10</td></tr>
        <tr><td class="num">5</td><td>2001:db8:acad:1::10</td><td>2001:db8:acad:1:a00:27ff:fe3a:5c01</td><td>86</td><td>Neighbor Advertisement 2001:db8:acad:1::10 (sol, ovr)</td></tr>
        <tr><td class="num">6</td><td>2001:db8:acad:1:a00:27ff:fe3a:5c01</td><td>2001:db8:acad:1::10</td><td>118</td><td>Echo (ping) request seq=1</td></tr>
        <tr><td class="num">7</td><td>2001:db8:acad:1::10</td><td>2001:db8:acad:1:a00:27ff:fe3a:5c01</td><td>118</td><td>Echo (ping) reply seq=1</td></tr>
        <tr><td class="num">8</td><td>2001:db8:acad:1:a00:27ff:fe3a:5c01</td><td>2001:db8:acad:1::10</td><td>118</td><td>Echo (ping) request seq=2</td></tr>
        <tr><td class="num">9</td><td>2001:db8:acad:1::10</td><td>2001:db8:acad:1:a00:27ff:fe3a:5c01</td><td>118</td><td>Echo (ping) reply seq=2</td></tr>
      </tbody></table></div>
      <div class="after"><p>Trame 4 : sollicitation de voisin (NS, type 135) « qui a 2001:db8:acad:1::10 ? », envoyée à l’adresse multicast de nœud sollicité du serveur, et non en diffusion. Trame 5 : annonce de voisin (NA, type 136) « c’est moi, mon adresse MAC est 08:00:27:91:b2:4e », envoyée directement à PC-A.</p></div>
    </div>

    <div class="answer" data-id="t7-ra" data-kind="code" data-label="Mission 2 : contenu de l’annonce de routeur" data-min="120" data-rows="9">
      <p>Déplier la trame 2 (<em>Internet Control Message Protocol v6</em>) et relever : l’adresse IPv6 source et l’adresse MAC source ; les drapeaux <em>M</em> et <em>O</em> ; la durée de vie du routeur (<em>Router lifetime</em>) ; la MTU annoncée ; dans l’option <em>Prefix information</em>, le préfixe, sa longueur, le drapeau <em>A</em> (<em>Autonomous</em>), et les durées de validité. En déduire : la passerelle de PC-A, et la méthode de configuration qu’il doit utiliser.</p>
      <div class="corr">
        <pre class="code">IPv6 source      : fe80::1            MAC source : 00:00:0c:5e:21:a7 (R1)
Destination      : ff02::1 (tous les nœuds) → MAC 33:33:00:00:00:01
Drapeaux         : M = 0, O = 0
Router lifetime  : 1800 s (30 min)
MTU              : 1500
Préfixe          : 2001:db8:acad:1::/64, drapeaux L = 1, A = 1
Valid lifetime   : 2592000 s (30 jours)
Preferred lifetime : 604800 s (7 jours)</pre>
        <p>Passerelle de PC-A : <code>fe80::1</code>, l’adresse <strong>source</strong> de la RA. Méthode : <strong>SLAAC seul</strong> (A = 1 : le poste fabrique son adresse avec ce préfixe ; M = 0 : pas d’adresse par DHCPv6 ; O = 0 : pas d’autres informations par DHCPv6). Conséquence à noter : aucun serveur DNS n’est annoncé ici ; dans un vrai réseau, il faudrait l’option RDNSS de la RA ou un DHCPv6 sans état (O = 1).</p>
      </div>
    </div>

    <div class="answer" data-id="t7-dad" data-label="Mission 2 : la détection d’adresse dupliquée" data-min="100" data-rows="7">
      <p>Étudier la trame 3. a) Quelle adresse PC-A vérifie-t-il ? Comment l’a-t-il construite ? b) Pourquoi l’adresse source est-elle <code>::</code> ? c) Retrouver par le calcul l’adresse IPv6 de destination (<code>ff02::1:ff3a:5c01</code>) et l’adresse MAC de destination (<code>33:33:ff:3a:5c:01</code>). d) Personne ne répond à cette trame : que conclut PC-A ?</p>
      <div class="corr">
        <p>a) <code>2001:db8:acad:1:a00:27ff:fe3a:5c01</code> : le préfixe de la RA (trame 2) suivi de son identifiant EUI-64, calculé à partir de sa MAC <code>08:00:27:3a:5c:01</code>.</p>
        <p>b) PC-A n’a pas encore le droit d’utiliser cette adresse tant qu’il n’a pas vérifié qu’elle est libre : il émet donc depuis l’adresse non spécifiée <code>::</code>.</p>
        <p>c) Nœud sollicité : <code>ff02::1:ff</code> + les 24 derniers bits de l’adresse (<code>3a:5c:01</code>) → <code>ff02::1:ff3a:5c01</code>. MAC : <code>33:33</code> + les 32 derniers bits de cette adresse multicast (<code>ff3a:5c01</code>) → <code>33:33:ff:3a:5c:01</code>.</p>
        <p>d) Aucune annonce de voisin ne revient : l’adresse n’est utilisée par personne, PC-A la garde. On voit d’ailleurs la trame 4, quelques secondes plus tard, émise avec cette adresse.</p>
      </div>
    </div>
    <div class="aside deep">
      <p class="aside-title">Pourquoi une limite de sauts de 255 ?</p>
      <p>Dans les trames 1 à 5, le champ <em>Hop limit</em> vaut 255, alors que les échos ont 64. Les messages NDP doivent être émis avec 255, et le récepteur rejette tout message NDP qui arrive avec moins : comme chaque routeur diminue la valeur de 1, un message à 255 prouve qu’il vient <strong>du lien local</strong> et n’a traversé aucun routeur. C’est une protection simple contre des annonces envoyées depuis un autre réseau.</p>
    </div>
  </div>
</details>

<h2>Mission 3 : IPv6 sur les serveurs virtuels</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Lien local, multicast et adresses statiques</summary>
  <div class="task-body">
    <p>Reprendre les machines virtuelles SRV-DEB et SRV-WIN du <a href="#tp5">TP 5</a>, toujours sur le réseau interne <code>tp5</code> (il n’y a pas de routeur IPv6 sur ce réseau).</p>
    <pre class="code terminal"><span class="cm"># Sur SRV-DEB</span>
<span class="pr">$</span> ip -6 address show dev enp0s3
<span class="pr">$</span> ping -c 2 ff02::1%enp0s3            <span class="cm"># « tous les nœuds » du lien</span>
<span class="pr">$</span> ip -6 neigh
<span class="pr">$</span> sudo ip -6 address add 2001:db8:acad:50::10/64 dev enp0s3

<span class="cm"># Sur SRV-WIN (PowerShell administrateur)</span>
<span class="pr">PS C:\&gt;</span> New-NetIPAddress -InterfaceAlias "Ethernet" -IPAddress 2001:db8:acad:50::20 -PrefixLength 64
<span class="pr">PS C:\&gt;</span> Enable-NetFirewallRule -Name FPS-ICMP6-ERQ-In
<span class="pr">PS C:\&gt;</span> ping 2001:db8:acad:50::10</pre>
    <div class="answer" data-id="t7-vm" data-label="Mission 3 : observations sur les serveurs" data-min="150" data-rows="9">
      <p>a) Avant toute configuration, quelle(s) adresse(s) IPv6 SRV-DEB possède-t-il ? D’où vient-elle ? b) Que montre <code>ping ff02::1%enp0s3</code> ? Pourquoi faut-il ajouter <code>%enp0s3</code> ? c) Après l’ajout des adresses statiques, noter le résultat de <code>ping -c 2 2001:db8:acad:50::20</code> depuis SRV-DEB et de <code>ping 2001:db8:acad:50::10</code> depuis SRV-WIN. d) Écrire les lignes à ajouter dans <code>/etc/network/interfaces</code> pour rendre l’adresse IPv6 de SRV-DEB permanente.</p>
      <div class="corr">
        <p>a) Une seule adresse : <code>fe80::a00:27ff:fe…/64</code> (lien local EUI-64 sous Debian, <code>scope link</code>), créée automatiquement dès que la carte est active. Pas d’adresse globale : aucun routeur n’envoie de RA sur ce réseau interne.</p>
        <p>b) Les réponses arrivent depuis les adresses de lien local de <strong>tous les hôtes du lien</strong> qui répondent aux échos multicast (Debian répond ; Windows, en général non). C’est un moyen rapide de découvrir ses voisins IPv6 ; <code>ip -6 neigh</code> les montre ensuite. L’index de zone <code>%enp0s3</code> est obligatoire avec une adresse de lien local ou multicast de lien : chaque carte a son propre lien, le système doit savoir sur laquelle envoyer.</p>
        <p>c) Les deux tests réussissent, une fois la règle de pare-feu ICMPv6 activée sur Windows (même remarque qu’au TP 5 : sans elle, le ping vers Windows échoue).</p>
        <pre class="code">iface enp0s3 inet6 static
    address 2001:db8:acad:50::10/64</pre>
        <p>Ces lignes s’ajoutent sous la configuration IPv4 existante (<code>iface enp0s3 inet static</code>) : une même carte peut avoir une section <code>inet</code> et une section <code>inet6</code>, c’est la <strong>double pile</strong>.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 4 : le plan d’adressage IPv6 de la M2L</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Un /64 par réseau dans le /48 du prestataire</summary>
  <div class="task-body">
    <p>Le prestataire attribue à la M2L le préfixe <code>2001:db8:4d32::/48</code> (adresse de documentation utilisée pour l’exercice). Le responsable fixe deux règles : chaque réseau du plan IPv4 du <a href="#tp6">TP 6</a> reçoit un /64 ; le 4<sup>e</sup> groupe doit être <strong>lisible</strong> : <code>0100</code> à <code>0700</code> pour les réseaux de services, dans l’ordre du plan IPv4 (Wi-Fi visiteurs, téléphonie, administration, multimédia, serveurs, DMZ, interconnexion), et <code>10nn</code> pour la ligue numéro <em>nn</em>. Passerelle : <code>::1</code> (plus <code>fe80::1</code> en lien local).</p>
    <div class="answer" data-id="t7-plan" data-kind="code" data-label="Mission 4 : plan d’adressage IPv6 de la M2L" data-min="150" data-rows="11">
      <p>a) Combien de réseaux /64 la M2L peut-elle créer ? b) Écrire le préfixe IPv6 et la passerelle (adresse globale) des réseaux de services, puis des ligues 06 et 24. c) Le serveur web de la DMZ a l’adresse IPv4 <code>172.16.2.241</code> : proposer une adresse IPv6 statique facile à retenir. d) Pourquoi n’a-t-on plus besoin de calculer des tailles de blocs comme en IPv4 ?</p>
      <div class="corr">
        <pre class="code">a) 64 − 48 = 16 bits → 2^16 = 65 536 réseaux /64
b) Wi-Fi visiteurs   2001:db8:4d32:100::/64    passerelle 2001:db8:4d32:100::1
   Téléphonie IP     2001:db8:4d32:200::/64    passerelle 2001:db8:4d32:200::1
   Administration    2001:db8:4d32:300::/64    passerelle 2001:db8:4d32:300::1
   Salle multimédia  2001:db8:4d32:400::/64    passerelle 2001:db8:4d32:400::1
   Serveurs          2001:db8:4d32:500::/64    passerelle 2001:db8:4d32:500::1
   DMZ               2001:db8:4d32:600::/64    passerelle 2001:db8:4d32:600::1
   Interconnexion    2001:db8:4d32:700::/64    (routeur ::1, pare-feu ::2)
   Ligue 06          2001:db8:4d32:1006::/64   passerelle 2001:db8:4d32:1006::1
   Ligue 24          2001:db8:4d32:1024::/64   passerelle 2001:db8:4d32:1024::1
c) Par exemple 2001:db8:4d32:600::241 (on reprend la fin de l’adresse IPv4)
   ou 2001:db8:4d32:600::80 (port du web)</pre>
        <p>Remarque d’écriture : le 4<sup>e</sup> groupe <code>0100</code> s’abrège en <code>100</code> (zéros de <strong>tête</strong>), jamais en <code>1</code>.</p>
        <p>d) Tous les réseaux locaux ont la même taille (/64), qui offre de toute façon bien plus d’adresses que nécessaire : il suffit de choisir une valeur du 4<sup>e</sup> groupe. La difficulté se déplace vers la <strong>lisibilité</strong> et la cohérence du plan. Pour les liaisons entre deux routeurs, on rencontre aussi des /127 (RFC 6164), mais un /64 reste accepté et simple.</p>
      </div>
    </div>
  </div>
</details>

<h2>Défi : résumer les réseaux des ligues</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Une seule règle de pare-feu pour toutes les ligues</summary>
  <div class="task-body">
    <div class="answer" data-id="t7-defi" data-kind="code" data-label="Défi : préfixe résumant les ligues" data-min="60" data-rows="6">
      <p>Les réseaux des ligues vont de <code>2001:db8:4d32:1001::/64</code> à <code>2001:db8:4d32:1024::/64</code>, et le plan doit pouvoir accueillir jusqu’à 80 ligues. Quel préfixe unique, le plus long possible, contient tous les réseaux de ligues possibles avec la règle <code>10nn</code> (nn de 01 à 99), sans contenir les réseaux de services ? Combien de /64 contient-il ?</p>
      <p class="hint">Écrire le 4e groupe en binaire : 1001 et 1099 en hexadécimal. Quels bits sont communs ?</p>
      <div class="corr">
        <pre class="code">0x1001 = 0001 0000 0000 0001
0x1099 = 0001 0000 1001 1001
          commun : 0001 0000 (8 bits)
Préfixe : 48 + 8 = /56 → 2001:db8:4d32:1000::/56
Il couvre 1000 à 10ff : 2^(64−56) = 256 réseaux /64</pre>
        <p>Il ne contient pas les réseaux de services (<code>0100</code> à <code>0700</code>). Une seule route et une seule règle de pare-feu (« <code>2001:db8:4d32:1000::/56</code> n’a pas accès au réseau de l’administration ») suffisent pour toutes les ligues. Le préfixe <code>2001:db8:4d32:1000::/52</code> (de <code>1000</code> à <code>1fff</code>) conviendrait aussi, mais il est plus large que nécessaire.</p>
      </div>
    </div>
  </div>
</details>

<h2>Fiche mémo : les notions</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Notion</th><th>À retenir</th></tr>
  <tr><td>Commutateur / routeur</td><td>Le commutateur (couche 2) relie les hôtes d’un même réseau grâce aux adresses MAC ; le routeur (couche 3) relie des réseaux différents grâce aux adresses IP.</td></tr>
  <tr><td>Débit</td><td>En bits par seconde, préfixes décimaux. Durée = taille en bits ÷ débit (octets × 8).</td></tr>
  <tr><td>Modèle OSI</td><td>7 couches : Physique, Liaison, Réseau, Transport, Session, Présentation, Application. PDU : bit, trame, paquet, segment.</td></tr>
  <tr><td>Modèle TCP/IP</td><td>4 couches : Accès réseau, Internet, Transport, Application.</td></tr>
  <tr><td>Encapsulation</td><td>Chaque couche ajoute son en-tête. Les adresses IP restent de bout en bout ; les adresses MAC changent à chaque routeur.</td></tr>
  <tr><td>Paire torsadée</td><td>100 m maximum. Cat 5e : 1 Gb/s ; Cat 6A : 10 Gb/s. Au-delà de 100 m ou entre bâtiments : fibre (multimode : centaines de mètres ; monomode : kilomètres).</td></tr>
  <tr><td>Adresse MAC</td><td>48 bits, 6 octets hexadécimaux ; OUI = 3 premiers octets (fabricant). Diffusion : <code>ff:ff:ff:ff:ff:ff</code>.</td></tr>
  <tr><td>Trame Ethernet</td><td>MAC dest (6) + MAC src (6) + EtherType (2) + données (46 à 1 500) + FCS (4). EtherType : <code>0x0800</code> IPv4, <code>0x0806</code> ARP, <code>0x86DD</code> IPv6.</td></tr>
  <tr><td>Commutateur</td><td>Apprend l’adresse MAC <strong>source</strong> ; transmet selon la destination ; inonde si inconnue ou diffusion. Ne stoppe pas les diffusions.</td></tr>
  <tr><td>Adresse IPv4</td><td>32 bits, partie réseau + partie hôte selon le masque (/n). Hôtes : 2<sup>h</sup> − 2.</td></tr>
  <tr><td>Taille de bloc</td><td>256 − valeur du masque dans l’octet intéressant. Réseau = plus grand multiple ≤ valeur ; diffusion = réseau suivant − 1.</td></tr>
  <tr><td>Passerelle</td><td>Destination hors du réseau (calcul avec son propre masque) → envoi à la passerelle, qui doit être dans le réseau du poste.</td></tr>
  <tr><td>Adresses privées</td><td><code>10.0.0.0/8</code>, <code>172.16.0.0/12</code>, <code>192.168.0.0/16</code>. Bouclage <code>127.0.0.1</code> ; APIPA <code>169.254.x.x</code> = pas de DHCP.</td></tr>
  <tr><td>VLSM</td><td>Besoin = hôtes + passerelle + marge ; trier du plus grand au plus petit ; un réseau commence à un multiple de sa taille de bloc.</td></tr>
  <tr><td>ARP</td><td>Requête en diffusion, réponse en envoi individuel ; pour une destination distante, on cherche la MAC de la passerelle.</td></tr>
  <tr><td>ICMP</td><td>8 demande d’écho, 0 réponse, 3 destination injoignable, 11 temps dépassé (TTL à 0, utilisé par <code>tracert</code>). Un ping sans réponse ne prouve pas qu’une machine est éteinte.</td></tr>
  <tr><td>Diagnostic</td><td>De bas en haut : physique, configuration IP, 127.0.0.1, passerelle, IP extérieure, nom (DNS), application. Comparer avec un voisin, documenter le ticket.</td></tr>
  <tr><td>Adresse IPv6</td><td>128 bits, 8 groupes hexadécimaux ; supprimer les zéros de tête ; un seul <code>::</code>. Réseau local : /64.</td></tr>
  <tr><td>Types IPv6</td><td>Globale <code>2000::/3</code>, lien local <code>fe80::/10</code> (toujours présente), ULA <code>fd00::/8</code>, multicast <code>ff00::/8</code>, bouclage <code>::1</code>. Pas de diffusion.</td></tr>
  <tr><td>NDP</td><td>ICMPv6 : RS 133, RA 134 (préfixe, passerelle), NS 135 et NA 136 (remplacent ARP), DAD. SLAAC : préfixe de la RA + identifiant d’interface (EUI-64 ou aléatoire).</td></tr>
</table></div>

<script>

(function () {

  /* ---------- utilitaires ---------- */

  function plain(html) { var d = document.createElement('div'); d.innerHTML = html; return (d.textContent || '').replace(/\s+/g, ' ').trim(); }

  function arrows(x) { return String(x || '').replace(/-df-(&gt;|>)/g, ARROW); }

  function ago(t) { var m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'à l’instant' : m < 60 ? 'il y a ' + m + ' min' : 'il y a ' + Math.floor(m / 60) + ' h ' + two(m % 60); }
  function slug(s) { return (s || 'etudiant').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase(); }

  /* ---------- état ---------- */

  var saveTimer = null;
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* stockage indisponible : l'état reste en mémoire */ } updateSaveBtn(); }
  function save() { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 150); }
  function saveNow() { clearTimeout(saveTimer); persist(); }

  }
  function sig() {

  }

  function lastActivity(s) { var l = s.log && s.log.length ? s.log[s.log.length - 1].t : 0; return Math.max(l, s.ui && s.ui.fileAt || 0); }
  function newId() {

  }

  /* ---------- fichiers ---------- */

  }
  function restoreText(txt, box, force) {

    state = s; state.ui.theme = theme; state.ui.started = true;
    if (!state.student.id) state.student.id = newId();
    logEvent('restore', null, { id: fromId || null, date: fromDate || null, forced: !!force });
    state.ui.fileSig = sig(); saveNow();
    render(PAGE);
    var m = $('[data-restore-ok]'); if (m) m.hidden = false;
  }
  function setMsg(box, txt, cls) { if (box) box.innerHTML = '<span class="ck-msg ' + cls + '">' + txt + '</span>'; }
  function fileInput(input, box) {
    input.addEventListener('change', function (e) {
      var f = e.target.files[0]; if (!f) return;
      var r = new FileReader(); r.onload = function () { restoreText(r.result, box, false); input.value = ''; }; r.readAsText(f);
    });
  }
  function copyText(txt, btn, area) {

  }

  /* ---------- manifeste de toutes les activités (calculé depuis les modèles) ---------- */
  var MANIFEST = {};
  var SEL = '.quiz, .answer, .ctab, .match, .pick';
  function typeOf(el) { return el.classList.contains('quiz') ? 'quiz' : el.classList.contains('answer') ? 'answer' : 'check'; }

  }
  function buildManifest() {

  function isDone(it) {

  function pageStats(id) { var its = MANIFEST[id] || []; return { done: its.filter(isDone).length, total: its.length, started: its.some(function (it) { return !!state.items[it.key]; }) }; }

  /* ---------- coque ---------- */
  var PAGE = 'accueil', PINFO = PAGES[0], article, tocObserver = null;
  function applyTheme(t) {

    else document.documentElement.removeAttribute('data-theme');
  }
  function buildShell() {
    article = $('article'); article.id = 'page-top';

    top.innerHTML =
      '<button class="menu-btn" type="button" aria-expanded="false" aria-controls="sidebar">Menu</button>' +
      '<a class="brand" href="#accueil">' + esc(CONFIG.brand || TITLE) + '<span>·</span><small>' + esc(CONFIG.brandSub || 'BTS SIO') + '</small></a>' +
      '<span class="spacer"></span><span class="who" id="who"></span>' +
      '<button type="button" class="btn small save-btn" id="save-btn">Sauvegarder</button>' +
      '<label class="sr-only" for="theme-sel">Thème</label>' +
      '<select class="theme-sel" id="theme-sel"><option value="auto">Thème auto</option><option value="light">Clair</option><option value="dark">Sombre</option></select>';
    var layout = h('div', { class: 'layout' });
    var side = h('nav', { class: 'sidebar', id: 'sidebar', 'aria-label': 'Parcours' });
    var groups = CONFIG.groups || [['Parcours', PAGES.map(function (p) { return p.id; })]];
    side.innerHTML = groups.map(function (g) {
      return '<div class="nav-group"><p>' + g[0] + '</p><ol>' + g[1].map(function (id) {
        var p = pageById(id);
        return '<li><a class="nav-link" href="#' + p.id + '" data-nav="' + p.id + '"><span><span class="n">' + p.n + (p.dur ? ' · ' + p.dur : '') + '</span>' + p.title + '</span><span class="pill" data-pill="' + p.id + '"></span></a></li>';

    sel.addEventListener('change', function () { state.ui.theme = sel.value; applyTheme(sel.value); save(); });

  }
  function updateWho() {
    var w = $('#who'); if (!w) return;
    w.textContent = state.student.nom ? fullName() + (state.student.classe ? ' · ' + state.student.classe : '') + (state.student.id ? ' · ' + state.student.id : '') : '';
  }
  function updateSaveBtn() {
    var b = document.getElementById('save-btn'); if (!b) return;
    var d = !!(state.ui.started && dirty());

    b.textContent = d || !hasWork() || !state.ui.started ? 'Sauvegarder' : 'Sauvegardé ✓';
    b.title = !state.ui.started ? 'Commencer par la page de démarrage.' : d ? 'Des réponses ne sont pas encore dans votre fichier de sauvegarde : cliquer pour le télécharger.' : (state.ui.fileAt ? 'Fichier de sauvegarde à jour (' + fmtDate(state.ui.fileAt, true) + ').' : '');
  }

  /* ---------- rappel des 20 minutes ---------- */
  function checkReminder() {
    var r = $('#remind'); if (!r || !state.ui.started) return;
    if (!dirty()) { r.hidden = true; return; }
    var since = Math.max(state.ui.fileAt || 0, SESSION_START);
    if (Date.now() - since < REMIND_MS || Date.now() < (state.ui.snooze || 0)) return;

  /* ---------- rendu d'une page ---------- */
  function go(id, anchor) {

  function render(id, anchor) {

    if (gated) {
      article.innerHTML = '<h1>' + esc(PINFO.title) + '</h1><div class="notice warn gate"><p><strong>Commencer par la page de démarrage.</strong> Avant d’accéder au cours, il faut saisir son nom, son prénom et sa classe, puis créer son fichier de sauvegarde (ou rouvrir celui d’une séance précédente).</p><p><a class="btn primary" href="#accueil">Aller à la page de démarrage</a></p></div>';
    } else if (tpl) {
      article.appendChild(tpl.content.cloneNode(true));
    }
    // en-tête
    var h1 = $('h1', article);
    if (h1 && PAGE !== 'accueil') article.insertBefore(h('p', { class: 'eyebrow' }, '<span class="kind">' + PINFO.kind + '</span>' + (PINFO.n !== PINFO.kind ? '<span>' + PINFO.n + '</span>' : '') + (PINFO.dur ? '<span>Durée indicative : ' + PINFO.dur + '</span>' : '')), h1);
    // champs remplis depuis la configuration : <span data-cfg="title"></span>
    $$('[data-cfg]', article).forEach(function (x) { var v = CONFIG[x.getAttribute('data-cfg')]; if (v != null) x.textContent = v; });
    // liens vers les anciennes pages -> navigation interne
    $$('a[href]', article).forEach(function (a) {
      var m = a.getAttribute('href').match(/^([\w-]+\.html)(?:#(.+))?$/);
      if (m && FILES[m[1]]) { a.setAttribute('href', '#' + FILES[m[1]]); if (m[2]) a.setAttribute('data-anchor', m[2]); }
    });
    // flèches de DF dans les textes
    var tw = document.createTreeWalker(article, NodeFilter.SHOW_TEXT, null), tn, todo = [];
    while ((tn = tw.nextNode())) if (tn.nodeValue.indexOf('-df->') > -1) todo.push(tn);
    todo.forEach(function (t) {

      else if (a === 'addcol') { t.cols.push({ n: '' }); t.rows.forEach(function (r) { r.push(''); }); }
      else if (a === 'delcol' && t.cols.length > 1) { t.cols.pop(); t.rows.forEach(function (r) { r.pop(); }); }
      else if (a === 'addrow') t.rows.push(t.cols.map(function () { return ''; }));

  }

      rows.forEach(function (r, i) {

  /* ---------- bilan ---------- */
  function allItems() {
    var out = [];
    PAGES.forEach(function (p) { (MANIFEST[p.id] || []).forEach(function (it) { out.push({ page: p, it: it, st: state.items[it.key], f: state.firsts[it.key] }); }); });

  }
  function itemResult(x) {
    var it = x.it, s = x.st, f = x.f;
    if (it.type === 'answer') {
      if (!s) return { txt: 'non commencé', level: null };
      if (!s.self) return { txt: s.revealed ? 'correction vue, non évaluée' : 'rédigée, correction non consultée', level: null };
      var t = SELF[s.self] + (f && f.self && f.self !== s.self ? ' (1re évaluation : ' + SELF[f.self] + ')' : '');
      return { txt: t, level: f && f.self ? f.self : s.self };
    }
    if (!f) return { txt: s ? 'en cours' : 'non commencé', level: null };
    var p = pct(f.score, f.total), lv = it.type === 'quiz' ? (p >= 80 ? 'ok' : p >= 50 ? 'mid' : 'ko') : (p === 100 ? 'ok' : p >= 60 ? 'mid' : 'ko');
    var extra = s && s.attempts > 1 ? ' · ' + s.attempts + ' tentatives' + (s.best != null ? ', meilleur ' + s.best + ' / ' + f.total : '') : '';
    return { txt: '1re tentative ' + f.score + ' / ' + f.total + extra, level: lv };

  function renderBilan(el) {

    var qz = items.filter(function (x) { return x.it.type === 'quiz' && x.f; }), ck = items.filter(function (x) { return x.it.type === 'check' && x.f; });
    function sum(a, k2) { return a.reduce(function (t, x) { return t + x.f[k2]; }, 0); }
    var selfs = { ok: 0, mid: 0, ko: 0 }; items.forEach(function (x) { if (x.it.type === 'answer' && x.st && x.st.self) selfs[x.st.self]++; });
    var html = '<div class="stats"><div class="stat"><b>' + done + ' / ' + items.length + '</b><span>activités terminées</span></div>' +
      '<div class="stat"><b>' + (qz.length ? pct(sum(qz, 'score'), sum(qz, 'total')) + ' %' : '—') + '</b><span>réussite aux quiz (1res tentatives)</span></div>' +
      '<div class="stat"><b>' + (ck.length ? pct(sum(ck, 'score'), sum(ck, 'total')) + ' %' : '—') + '</b><span>réussite aux activités auto-corrigées (1res tentatives)</span></div>' +
      '<div class="stat"><b>' + selfs.ok + ' · ' + selfs.mid + ' · ' + selfs.ko + '</b><span>réponses rédigées : réussi · en partie · à revoir</span></div></div>';
    html += '<div class="tbl-wrap"><table class="data wide bilan-tbl"><thead><tr><th>Étape</th><th>Activités</th><th>Quiz</th><th>Auto-corrigé</th><th>Auto-évaluation</th></tr></thead><tbody>';
    PAGES.forEach(function (p) {
      var its = items.filter(function (x) { return x.page.id === p.id; }); if (!its.length) return;
      var s = pageStats(p.id);
      if (!s.started) { html += '<tr><td><a href="#' + p.id + '">' + p.n + ' — ' + p.title + '</a></td><td colspan="4" class="null">pas encore commencée</td></tr>'; return; }
      var q = its.filter(function (x) { return x.it.type === 'quiz' && x.f; }), c = its.filter(function (x) { return x.it.type === 'check' && x.f; });
      var se = { ok: 0, mid: 0, ko: 0 }; its.forEach(function (x) { if (x.it.type === 'answer' && x.st && x.st.self) se[x.st.self]++; });
      var na = its.filter(function (x) { return x.it.type === 'answer'; }).length;
      html += '<tr><td><a href="#' + p.id + '">' + p.n + ' — ' + p.title + '</a></td><td>' + s.done + ' / ' + s.total + '</td><td>' + (q.length ? sum(q, 'score') + ' / ' + sum(q, 'total') : '—') + '</td><td>' + (c.length ? sum(c, 'score') + ' / ' + sum(c, 'total') : '—') + '</td><td>' + (na ? '<span class="chip ok">' + se.ok + '</span><span class="chip mid">' + se.mid + '</span><span class="chip ko">' + se.ko + '</span>' : '—') + '</td></tr>';
    });
    html += '</tbody></table></div><p class="note-line">Les scores affichés sont ceux de la première tentative ; les tentatives suivantes servent à s’entraîner.</p>';
    var rev = items.filter(function (x) { var r = itemResult(x); return r.level === 'ko' || r.level === 'mid'; });
    html += '<h3 class="nonum">Points à revoir</h3>' + (rev.length ? '<ul class="revoir">' + rev.map(function (x) { var r = itemResult(x); return '<li><span class="chip ' + r.level + '">' + esc(r.txt) + '</span><a href="#' + x.page.id + '" data-anchor="' + x.it.anchor + '">' + x.page.n + ' · ' + esc(x.it.label) + '</a></li>'; }).join('') + '</ul>' : '<p class="note-line">Aucun point signalé pour l’instant.</p>');
    el.innerHTML = html;
  }

  /* ---------- journal et compte rendu ---------- */
  function labelOf(k) { var p = k && k.split(':')[0]; var it = (MANIFEST[p] || []).filter(function (x) { return x.key === k; })[0]; return it ? (pageById(p).n + ' · ' + it.label) : (k || ''); }
  function eventText(ev) {
    var d = ev.d || {};
    switch (ev.e) {
      case 'start': return 'Début du travail (identifiant ' + d.id + ')';
      case 'save': return 'Sauvegarde dans un fichier n° ' + d.n;
      case 'restore': return 'Restauration d’un fichier' + (d.id ? ' (identifiant ' + d.id + ')' : '') + (d.date ? ', sauvegardé le ' + fmtDate(d.date, true) : '') + (d.forced ? ' — malgré l’avertissement' : '');
      case 'quiz': return labelOf(ev.k) + ' : ' + d.s + ' / ' + d.t + ' (tentative ' + d.a + ')';
      case 'check': return labelOf(ev.k) + ' : ' + d.s + ' / ' + d.t + ' (tentative ' + d.a + ')';
      case 'reveal': return labelOf(ev.k) + ' : correction consultée' + (d.sec != null ? ' ' + (d.sec < 90 ? d.sec + ' s' : Math.round(d.sec / 60) + ' min') + ' après le début de la rédaction' : '') + (d.len != null ? ' (' + d.len + ' caractères écrits)' : '');
      case 'edit-after': return labelOf(ev.k) + ' : réponse modifiée après la correction';
      case 'self': return labelOf(ev.k) + ' : auto-évaluation « ' + SELF[d.to] + ' »';
      case 'self-change': return labelOf(ev.k) + ' : auto-évaluation changée de « ' + SELF[d.from] + ' » à « ' + SELF[d.to] + ' »';
      case 'hint': return labelOf(ev.k) + ' : indice consulté';
      case 'reset': return 'Effacement des réponses en cours (les premiers résultats sont conservés)';
      case 'identity': return 'Identité modifiée : ' + d.from + ' → ' + d.to;
      default: return ev.e;
    }
  }
  function headerLines() {
    var s = state.student;
    return { who: fullName() || 'Nom non renseigné', classe: s.classe || '', id: s.id || '—', created: s.createdAt ? fmtDate(s.createdAt, true) : '—', saves: state.ui.saves || 0, restores: state.log.filter(function (e) { return e.e === 'restore'; }).length };
  }
  function buildReport(asHTML) {
    var items = allItems(), H = headerLines(), d = fmtDate(Date.now(), true);
    var pages = PAGES.filter(function (p) { return (MANIFEST[p.id] || []).length; });
    if (!asHTML) {
      var t = 'COMPTE RENDU — ' + TITLE.toUpperCase() + '\n' + H.who + ' — ' + H.classe + ' — identifiant ' + H.id + '\nTravail commencé le ' + H.created + ' · édité le ' + d + ' · ' + H.saves + ' sauvegarde(s), ' + H.restores + ' restauration(s)\n';
      pages.forEach(function (p) {
        t += '\n==== ' + p.n + ' — ' + p.title + ' ====\n';
        if (!pageStats(p.id).started) { t += '(pas encore commencée)\n'; return; }
        items.filter(function (x) { return x.page.id === p.id; }).forEach(function (x) {
          var r = itemResult(x);
          t += '\n• ' + x.it.label + ' [' + r.txt + ']' + (x.st && x.st.editedAfter ? ' (complétée après la correction)' : '') + '\n';
          if (x.it.type === 'answer' && x.st) { if (x.st.text) t += x.st.text.replace(/^/gm, '    ') + '\n'; if (x.st.tables) t += tablesToText(x.st).replace(/^/gm, '    ') + '\n'; }
        });
      });
      t += '\n==== Journal ====\n' + state.log.map(function (ev) { return fmtDate(ev.t, true) + ' · ' + eventText(ev); }).join('\n') + '\n';
      return t;
    }
    var css = 'body{font:15px/1.5 system-ui,sans-serif;max-width:52rem;margin:2rem auto;padding:0 16px;color:#161d2e}h1{font-size:1.5rem}h2{margin-top:2rem;border-bottom:2px solid #2c48c9;padding-bottom:4px;font-size:1.15rem}.it{border:1px solid #d8ddeb;border-radius:8px;padding:10px 14px;margin:10px 0}.lab{font-weight:700}.res{float:right;font-size:.8rem;padding:2px 8px;border-radius:99px;background:#eef1f8;margin-left:8px}.ok{background:#e3f4e8;color:#17803d}.mid{background:#fbf1d9;color:#9a6200}.ko{background:#fbe6e6;color:#c53030}pre{white-space:pre-wrap;font:13px/1.45 ui-monospace,Consolas,monospace;background:#f6f7fb;padding:8px;border-radius:6px}table{border-collapse:collapse;margin:6px 6px 6px 0;font-size:13px}td,th{border:1px solid #ccd;padding:3px 8px;text-align:left}th{background:#eef1f8}.tables{display:flex;flex-wrap:wrap;gap:8px}u{text-decoration-thickness:2px}.tbl-name{font-weight:700;margin:4px 0 0;font-size:12px}.note{color:#9a6200;font-size:.8rem}.id{font-family:ui-monospace,Consolas,monospace;font-weight:700}.log{font-size:13px}.log td:first-child{white-space:nowrap;color:#556079}.null{color:#556079;font-style:italic}';
    var out = '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Compte rendu — ' + esc(H.who) + '</title><style>' + css + '</style></head><body><h1>Compte rendu — ' + esc(TITLE) + '</h1><p><strong>' + esc(H.who) + '</strong> — ' + esc(H.classe) + ' — identifiant <span class="id">' + esc(H.id) + '</span><br>Travail commencé le ' + H.created + ' · édité le ' + d + ' · ' + H.saves + ' sauvegarde(s) dans un fichier, ' + H.restores + ' restauration(s)</p>';
    pages.forEach(function (p) {
      out += '<h2>' + p.n + ' — ' + esc(p.title) + '</h2>';
      if (!pageStats(p.id).started) { out += '<p class="null">Pas encore commencée.</p>'; return; }
      items.filter(function (x) { return x.page.id === p.id; }).forEach(function (x) {
        var r = itemResult(x);
        out += '<div class="it"><span class="res ' + (r.level || '') + '">' + esc(r.txt) + '</span><div class="lab">' + esc(x.it.label) + '</div>';
        if (x.st && x.st.editedAfter) out += '<div class="note">Réponse complétée après la consultation de la correction.</div>';
        if (x.it.type === 'answer' && x.st) { if (x.st.text) out += '<pre>' + esc(x.st.text) + '</pre>'; if (x.st.tables) out += tablesToHTML(x.st); }
        out += '</div>';
      });
    });
    out += '<h2>Journal</h2><table class="log">' + state.log.map(function (ev) { return '<tr><td>' + fmtDate(ev.t, true) + '</td><td>' + esc(eventText(ev)) + '</td></tr>'; }).join('') + '</table>';
    return out + '</body></html>';
  }
  function renderExport(el) {
    el.innerHTML = '<div class="row"><button type="button" class="btn primary" data-dlrep>Télécharger le compte rendu (.html)</button><button type="button" class="btn" data-copyrep>Copier le compte rendu (texte)</button><button type="button" class="btn ghost" data-showrep>Afficher</button></div><p class="note-line">Le compte rendu contient les réponses, les résultats des premières tentatives et le journal horodaté (tentatives, corrections consultées, sauvegardes, restaurations).</p><textarea id="rep-area" rows="12" readonly hidden style="width:100%;font:.8rem/1.45 var(--f-mono);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)"></textarea>';
    var area = $('#rep-area', el);
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-copyrep')) copyText(buildReport(false), b, area);
      if (b.hasAttribute('data-dlrep')) download('compte-rendu-' + (CONFIG.fileSlug || 'cours') + '-' + slug(fullName()) + '.html', buildReport(true), 'text/html');
      if (b.hasAttribute('data-showrep')) { area.hidden = !area.hidden; area.value = buildReport(false); b.textContent = area.hidden ? 'Afficher' : 'Masquer'; }
    });
  }
  function renderBackup(el) {
    el.innerHTML = '<div class="row"><button type="button" class="btn primary" data-dlbk>Sauvegarder dans un fichier</button><label class="btn" for="bk-file">Ouvrir un fichier de sauvegarde</label><input type="file" id="bk-file" accept=".json,application/json" class="sr-only"></div><div data-bkmsg></div>' +
      '<hr><div class="row"><button type="button" class="btn ghost" data-reset>Effacer mes réponses en cours…</button><span class="confirm" data-confirm hidden>Effacer les réponses de ce navigateur ? Les résultats des premières tentatives et le journal sont conservés. <button type="button" class="btn small" data-reset-yes style="border-color:var(--ko);color:var(--ko)">Oui, effacer</button><button type="button" class="btn small" data-reset-no>Annuler</button></span></div>';
    fileInput($('#bk-file', el), $('[data-bkmsg]', el));
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-dlbk')) fileSave();
      if (b.hasAttribute('data-reset')) $('[data-confirm]', el).hidden = false;
      if (b.hasAttribute('data-reset-no')) $('[data-confirm]', el).hidden = true;
      if (b.hasAttribute('data-reset-yes')) { state.items = {}; logEvent('reset'); saveNow(); render(PAGE); }
    });
  }

  /* ---------- démarrage ---------- */
  function start() {
    load(); buildShell(); buildManifest();
    var t = location.hash.slice(1);
    render(pageById(t) ? t : 'accueil');
    window.__support = { state: function () { return state; } }; // utile pour les tests
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
</body>
</html>
