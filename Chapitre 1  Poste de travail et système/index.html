<template data-page="tp1">
<h1>Inventorier et choisir un poste de travail</h1>
<p class="lead">Le service informatique de la M2L met à jour l’inventaire de son parc et doit renouveler plusieurs postes. Vous commencez par relever, avec les outils de Windows et de Linux, les caractéristiques exactes de votre poste, comme le ferait un technicien. Puis vous analysez des offres de matériel pour proposer le bon poste à chaque usage.</p>

<div class="aside caution">
  <p class="aside-title">Consignes</p>
  <ul>
    <li>Sur le poste de la salle, on <strong>observe seulement</strong> : aucune commande ne modifie le système. Si une commande demande des droits d’administration, on ne cherche pas à les obtenir : on passe par l’outil graphique indiqué.</li>
    <li>Travail individuel, <strong>sans IA</strong>. Noter les valeurs exactes affichées.</li>
  </ul>
</div>

<h2>Mission 1 : relever les caractéristiques de son poste</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Une fiche d’inventaire complète</summary>
  <div class="task-body">
    <h3>Sous Windows</h3>
    <p>Outils graphiques : <em>Gestionnaire des tâches</em> (Ctrl + Maj + Échap), onglet <em>Performance</em> ; <em>Informations système</em> (<code>msinfo32</code>) ; <em>Paramètres &gt; Système &gt; Informations système</em>. En PowerShell (sans droits particuliers) :</p>
    <pre class="code terminal"><span class="pr">PS C:\&gt;</span> Get-ComputerInfo -Property CsName, CsManufacturer, CsModel, OsName, OsVersion, OsArchitecture
<span class="pr">PS C:\&gt;</span> Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed
<span class="pr">PS C:\&gt;</span> Get-CimInstance Win32_PhysicalMemory | Select-Object Capacity, Speed, Manufacturer
<span class="pr">PS C:\&gt;</span> Get-CimInstance Win32_DiskDrive | Select-Object Model, Size, InterfaceType
<span class="pr">PS C:\&gt;</span> Get-NetAdapter | Select-Object Name, InterfaceDescription, MacAddress, LinkSpeed
<span class="pr">PS C:\&gt;</span> Get-CimInstance Win32_BIOS | Select-Object Manufacturer, SMBIOSBIOSVersion, SerialNumber</pre>
    <h3>Sous Linux (Kubuntu)</h3>
    <pre class="code terminal"><span class="pr">etudiant@poste:~$</span> hostnamectl                                   <span class="cm"># nom, système, noyau, fabricant et modèle</span>
<span class="pr">etudiant@poste:~$</span> lscpu | head -n 20
<span class="pr">etudiant@poste:~$</span> free -h
<span class="pr">etudiant@poste:~$</span> lsblk -d -o NAME,SIZE,ROTA,MODEL                <span class="cm"># ROTA = 1 : disque dur ; 0 : SSD</span>
<span class="pr">etudiant@poste:~$</span> lspci | grep -iE 'vga|ethernet|network'
<span class="pr">etudiant@poste:~$</span> ip link
<span class="pr">etudiant@poste:~$</span> cat /etc/os-release</pre>
    <div class="answer" data-id="t1-fiche" data-label="Mission 1 : fiche d’inventaire du poste" data-min="250" data-rows="12">
      <p>Remplir la fiche : nom du poste ; fabricant et modèle ; numéro de série (si affiché) ; processeur (modèle, cœurs, threads, fréquence) ; mémoire vive (capacité, nombre de barrettes, type si affiché) ; stockage (type HDD ou SSD, interface, capacité) ; carte(s) réseau (nom, adresse MAC, vitesse du lien) ; système d’exploitation (nom, version, architecture). Indiquer pour chaque ligne la commande ou l’outil utilisé.</p>
      <div class="corr">
        <p>Les valeurs dépendent du poste. Points de contrôle :</p>
        <ul>
          <li><code>NumberOfLogicalProcessors</code> (threads) est souvent le double de <code>NumberOfCores</code> (technologie Hyper-Threading ou SMT) ; <code>MaxClockSpeed</code> est en MHz.</li>
          <li><code>Capacity</code> de chaque barrette est en octets : 8 589 934 592 = 8 Gio. Le nombre de lignes donne le nombre de barrettes.</li>
          <li><code>Size</code> du disque est en octets ; sous Linux, <code>ROTA 0</code> indique un SSD, et un nom en <code>nvme0n1</code> un SSD NVMe.</li>
          <li><code>LinkSpeed</code> : 1 Gbps en général pour une prise Ethernet ; « Disconnected » pour une carte non branchée. L’adresse MAC s’écrit avec des tirets sous Windows, des deux-points sous Linux.</li>
          <li>L’architecture <code>64 bits</code> (x86-64, nommée <code>x86_64</code> ou <code>amd64</code> sous Linux).</li>
        </ul>
        <p>Une fiche d’inventaire sert à la gestion du parc (GLPI, chapitre 5) : garantie, compatibilité d’un logiciel, choix d’une évolution, dépannage.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 2 : interpréter les valeurs</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Des chiffres aux explications</summary>
  <div class="task-body">
    <div class="answer" data-id="t1-interpreter" data-label="Mission 2 : interpréter l’inventaire" data-min="200" data-rows="9">
      <p>a) Convertir en Gio la capacité du disque relevée en octets, et comparer avec la capacité annoncée par le fabricant (étiquette, fiche technique) ou affichée par l’Explorateur. Expliquer l’écart. b) Ouvrir l’onglet <em>Performance</em> du Gestionnaire des tâches (ou <code>htop</code> sous Linux) et lancer plusieurs logiciels : quelle ressource est la plus sollicitée ? c) Votre poste pourrait-il faire tourner en même temps les deux machines virtuelles du TP 2 (2 Go de mémoire pour SRV-DEB, 4 Go pour SRV-WIN) ? Justifier.</p>
      <div class="corr">
        <p>a) Exemple : 512 110 190 592 octets / 2<sup>30</sup> ≈ 476,9 Gio, pour un SSD vendu « 512 Go » (décimaux). L’Explorateur affiche « 476 Go » : ce sont des Gio (partie 2). Une partie de l’espace est aussi occupée par les partitions système (démarrage, récupération).</p>
        <p>b) Réponse personnelle, à justifier par les pourcentages observés : en bureautique, le processeur est peu chargé ; c’est souvent la mémoire qui est la plus occupée (navigateur).</p>
        <p>c) Il faut additionner : 2 + 4 = 6 Go pour les machines virtuelles, plus environ 4 Go pour le système hôte et VirtualBox. Avec 16 Go, c’est confortable ; avec 8 Go, c’est juste (machines virtuelles lentes, l’hôte utilise son fichier d’échange) : on n’allume alors qu’une machine virtuelle à la fois, ou on réduit leur mémoire. Il faut aussi assez d’espace disque (environ 20 Go pour SRV-DEB et 50 Go pour SRV-WIN, au maximum) et un processeur qui gère la virtualisation matérielle (partie 4).</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 3 : choisir les nouveaux postes de la M2L</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Le bon poste pour chaque usage</summary>
  <div class="task-body">
    <p>Le fournisseur de la M2L propose quatre configurations (prix hors taxes) :</p>
    <div class="tbl-wrap"><table class="data wide">
      <tr><th>Offre</th><th>Description</th><th>Prix HT</th></tr>
      <tr><td><strong>A</strong></td><td>Mini-PC, processeur 6 cœurs, 16 Go DDR5, SSD NVMe 512 Go, graphique intégrée, Ethernet 1 Gbit/s et Wi-Fi 6, 2 sorties écran, consommation en bureautique environ 15 W, Windows 11 Professionnel, garantie 3 ans sur site</td><td>720 €</td></tr>
      <tr><td><strong>B</strong></td><td>Tour, processeur 16 cœurs, 32 Go DDR5, SSD NVMe 1 To et disque dur 4 To, carte graphique dédiée 12 Go, 4 sorties écran, alimentation 750 W, Windows 11 Professionnel, garantie 3 ans sur site</td><td>1 650 €</td></tr>
      <tr><td><strong>C</strong></td><td>Portable 14 pouces, 1,3 kg, processeur 8 cœurs, 16 Go (soudés, non extensibles), SSD 512 Go, autonomie annoncée 12 h, USB-C et Thunderbolt, lecteur d’empreinte, Windows 11 Professionnel, garantie 3 ans</td><td>1 150 €</td></tr>
      <tr><td><strong>D</strong></td><td>Tour <strong>reconditionnée</strong> (fabriquée en 2021), processeur 6 cœurs, 16 Go DDR4, SSD 256 Go, Windows 11 Professionnel, garantie 1 an</td><td>290 €</td></tr>
    </table></div>
    <div class="ctab" data-id="c-offres" data-head="Besoin" data-cols="Offre la plus adaptée" data-choices="A|B|C|D" data-label="Choisir l’offre adaptée à chaque besoin">
      <div class="r" data-ok="D" data-expl="Bureautique, messagerie et visioconférence : 6 cœurs, 16 Go et un SSD suffisent largement. Le reconditionné divise le coût par plus de deux et évite la fabrication d’un poste neuf ; la garantie plus courte est le compromis.">Poste de la secrétaire d’une ligue : bureautique, messagerie, visioconférence ; la ligue a un budget très serré.</div>
      <div class="r" data-ok="B" data-expl="Montage vidéo : beaucoup de cœurs, de mémoire, une carte graphique dédiée pour l’encodage, un grand espace de stockage pour les rushes, et plusieurs écrans.">Station de montage vidéo de la salle multimédia (vidéos des compétitions, deux écrans).</div>
      <div class="r" data-ok="C" data-expl="Mobilité : léger, grande autonomie, connexion USB-C à une station d’accueil au bureau ; le lecteur d’empreinte facilite une authentification forte. Penser au chiffrement du disque.">Directeur de la M2L, souvent en réunion à l’extérieur et en télétravail.</div>
      <div class="r" data-ok="A" data-expl="Peu encombrant, sobre en énergie (allumé toute la journée), assez puissant pour l’accueil, avec une garantie sur site qui limite l’indisponibilité.">Poste de l’accueil, sur un comptoir étroit, allumé de 8 h à 19 h ; il doit tomber le moins possible en panne.</div>
    </div>
    <div class="answer" data-id="t1-choix" data-label="Mission 3 : argumenter un choix" data-min="200" data-rows="8">
      <p>Le trésorier propose d’équiper aussi les secrétaires des ligues avec l’offre B, « pour être tranquilles pendant dix ans ». Rédiger une réponse argumentée (coût, besoins, consommation, environnement). Puis expliquer pourquoi le portable C, dont la mémoire est soudée, doit être choisi avec 16 Go et non 8 Go.</p>
      <div class="corr">
        <p>L’offre B coûte plus de cinq fois l’offre D : pour une ligue, 1 360 € de plus par poste, sans aucun bénéfice en bureautique (le processeur et la carte graphique resteraient inutilisés). Sa consommation est bien plus élevée (alimentation 750 W, carte graphique dédiée). La fabrication est la principale source d’empreinte environnementale d’un ordinateur : surdimensionner, c’est payer et polluer pour rien. « Dix ans » n’est pas garanti : l’usure, la fin du support du système ou de nouveaux besoins décident souvent de la durée de vie. Le bon choix est le poste <strong>adapté au besoin</strong>, avec une marge raisonnable.</p>
        <p>Mémoire soudée : on ne pourra jamais l’augmenter. Or la mémoire est la ressource qui s’épuise en premier avec l’évolution des logiciels (navigateurs, visioconférence). 8 Go limiterait la durée de vie du portable ; 16 Go lui donne de la marge pour toute sa durée d’utilisation.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 4 : le cycle de vie et la fin de support</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Que faire des anciens postes ?</summary>
  <div class="task-body">
    <div class="answer" data-id="t1-fin-vie" data-label="Mission 4 : fin de support et fin de vie" data-min="250" data-rows="10">
      <p>La M2L possède 30 postes de 2016 sous Windows 10. Le support de Windows 10 a pris fin le 14 octobre 2025 (plus de correctifs de sécurité, sauf programme payant de mises à jour étendues), et leur processeur n’est pas compatible avec Windows 11. a) Pourquoi ne pas les garder tels quels ? b) Proposer trois solutions, avec leurs avantages et leurs limites. c) Si des postes sont mis au rebut, quelles précautions prendre ?</p>
      <div class="corr">
        <p>a) Un système qui ne reçoit plus de correctifs accumule des failles connues et publiées : un poste relié au réseau devient une porte d’entrée (chapitre 6). Les logiciels (navigateurs, antivirus) cessent aussi peu à peu de le prendre en charge.</p>
        <p>b) 1) Souscrire temporairement aux mises à jour de sécurité étendues de Microsoft : rapide, mais payant et limité dans le temps ; c’est une solution d’attente. 2) Installer un système libre maintenu (une distribution Linux comme Kubuntu, déjà utilisée au lycée) : prolonge la vie du matériel sans coût de licence ; demande d’accompagner les utilisateurs et de vérifier la compatibilité des logiciels métier. 3) Remplacer par des postes reconditionnés compatibles Windows 11 (offre D) : coût modéré, compatibilité assurée ; les anciens postes partent au recyclage. On peut combiner : Linux pour les postes à usage simple, remplacement pour ceux qui ont un logiciel Windows indispensable.</p>
        <p>c) Effacer les données de façon sûre (outil d’effacement, ou destruction physique des disques défectueux), car un disque simplement formaté se relit facilement ; retirer les postes de l’inventaire et de l’annuaire ; confier le matériel à une filière agréée de collecte des DEEE ou à une association de réemploi, avec un bordereau ; vérifier ce que permettent les licences (une licence OEM est liée au poste).</p>
      </div>
    </div>
  </div>
</details>

<h2>Défi : automatiser l’inventaire</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Une ligne de PowerShell pour tout le parc</summary>
  <div class="task-body">
    <div class="answer" data-id="t1-defi" data-kind="code" data-label="Défi : exporter l’inventaire en CSV" data-min="80" data-rows="6">
      <p>Écrire une commande PowerShell qui enregistre dans <code>inventaire.csv</code> le nom du poste, le fabricant, le modèle et la mémoire totale en Gio (arrondie), à partir de la classe <code>Win32_ComputerSystem</code>. Ouvrir le fichier dans un tableur. Quel outil, vu au chapitre 5, fait ce travail automatiquement pour tous les postes ?</p>
      <div class="corr">
<pre class="code">Get-CimInstance Win32_ComputerSystem |
    Select-Object Name, Manufacturer, Model, @{Name='MemoireGio'; Expression={[math]::Round($_.TotalPhysicalMemory / 1GB)}} |
    Export-Csv -Path .\inventaire.csv -NoTypeInformation -Encoding UTF8 -Delimiter ';'</pre>
        <p>En PowerShell, <code>1GB</code> vaut 2<sup>30</sup> (malgré son nom, c’est un gibioctet). Le séparateur <code>;</code> facilite l’ouverture dans un tableur réglé en français. À l’échelle d’un parc, l’<strong>agent d’inventaire de GLPI</strong> remonte automatiquement ces informations (et bien plus) pour chaque poste dans la base de gestion du parc.</p>
      </div>
    </div>
  </div>
</details>

<template data-page="p3">
<h1>Le système d’exploitation</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : parties 1 et 2. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Système d’exploitation</div><ul>
  <li><span><b>Rôles</b> : matériel, processus, mémoire, fichiers, utilisateurs</span></li>
  <li><span><b>Familles</b> : Windows, Linux et ses distributions</span></li>
  <li><span><b>Démarrage</b> : UEFI, chargeur, noyau, services</span></li>
  <li><span><b>Stockage</b> : partitions, MBR et GPT, systèmes de fichiers</span></li>
  <li><span><b>Licences et support</b> : libre, propriétaire, fin de vie</span></li>
</ul></div></figure>

<p class="lead">Le <strong>système d’exploitation</strong> (en anglais <em>operating system</em>, OS) est le logiciel qui fait le lien entre le matériel et les applications. Sans lui, chaque programme devrait savoir piloter lui-même chaque modèle de disque, de carte réseau ou d’écran. Le technicien installe, configure, met à jour et dépanne des systèmes d’exploitation tous les jours.</p>

<h2>Les rôles du système d’exploitation</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Rôle</th><th>Ce que fait le système</th><th>Ce qu’on en voit</th></tr>
  <tr><td><strong>Gérer le matériel</strong></td><td>Dialogue avec chaque périphérique grâce à un <strong>pilote</strong> (<em>driver</em>)</td><td>Gestionnaire de périphériques (Windows), <code>lspci</code>, <code>lsusb</code> (Linux)</td></tr>
  <tr><td><strong>Gérer les processus</strong></td><td>Un <strong>processus</strong> est un programme en cours d’exécution. Le système partage le temps du processeur entre des centaines de processus (ordonnancement), si vite qu’ils semblent tourner en même temps</td><td>Gestionnaire des tâches, <code>Get-Process</code>, <code>ps</code>, <code>top</code></td></tr>
  <tr><td><strong>Gérer la mémoire</strong></td><td>Donne à chaque processus son propre espace de mémoire, protégé des autres ; quand la RAM manque, déplace des pages de mémoire vers le disque (<strong>mémoire virtuelle</strong>, fichier d’échange ou partition <em>swap</em>)</td><td>Mémoire « validée » sous Windows, ligne <code>Swap</code> de <code>free -h</code></td></tr>
  <tr><td><strong>Gérer les fichiers</strong></td><td>Organise les données du disque en fichiers et dossiers (système de fichiers)</td><td>Explorateur, arborescence Linux</td></tr>
  <tr><td><strong>Gérer les utilisateurs et la sécurité</strong></td><td>Comptes, mots de passe, droits sur les fichiers, séparation entre utilisateur ordinaire et administrateur</td><td>Contrôle de compte d’utilisateur (UAC), <code>sudo</code></td></tr>
  <tr><td><strong>Offrir une interface</strong></td><td>Interface graphique, ligne de commande, et interface de programmation pour les applications (appels système)</td><td>Bureau, terminal, PowerShell</td></tr>
</table></div>
<p>Le cœur du système est le <strong>noyau</strong> (<em>kernel</em>) : il s’exécute avec tous les privilèges sur le matériel. Les applications s’exécutent dans l’<strong>espace utilisateur</strong>, sans accès direct au matériel ; elles demandent tout au noyau par des appels système (« ouvre ce fichier », « envoie ces données sur le réseau »). Ainsi, une application qui plante ne fait pas tomber tout le système.</p>
<p>Un <strong>service</strong> (sous Linux : un <em>démon</em>) est un processus qui tourne en arrière-plan, sans fenêtre, souvent dès le démarrage : serveur web, serveur DHCP, service d’impression, client de mise à jour. Les serveurs des chapitres suivants sont surtout des ensembles de services.</p>

<h2>Les familles de systèmes</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Famille</th><th>Exemples</th><th>Où on la trouve</th></tr>
  <tr><td><strong>Windows</strong> (Microsoft)</td><td>Windows 11 (éditions Famille, Professionnel, Entreprise, Éducation) ; Windows Server 2019, 2022, 2025</td><td>La grande majorité des postes de travail en entreprise ; serveurs d’annuaire (Active Directory), de fichiers, applications métier</td></tr>
  <tr><td><strong>Linux</strong> (noyau libre créé par Linus Torvalds en 1991)</td><td>Distributions : <strong>Debian</strong>, Ubuntu et Kubuntu (dérivées de Debian), Red Hat Enterprise Linux, Rocky Linux, Fedora…</td><td>La majorité des serveurs web et de l’informatique en nuage, les équipements réseau, les objets connectés ; Android repose sur le noyau Linux</td></tr>
  <tr><td><strong>macOS, iOS</strong> (Apple)</td><td>macOS (ordinateurs), iOS et iPadOS (téléphones, tablettes)</td><td>Postes et téléphones Apple</td></tr>
</table></div>
<p>Une <strong>distribution</strong> Linux rassemble le noyau, les outils de base, un gestionnaire de paquets, une interface (ou non) et des milliers de logiciels testés ensemble. Debian, utilisée dans ce cours pour SRV-DEB, est une distribution communautaire réputée pour sa stabilité, très utilisée sur les serveurs.</p>
<p>Un même système existe souvent en version <strong>poste de travail</strong> (interface graphique, logiciels bureautiques) et en version <strong>serveur</strong> (services réseau, souvent sans interface graphique pour économiser des ressources et réduire la surface d’attaque). Windows Server propose ainsi une installation « Expérience de bureau » ou « Core » (sans bureau).</p>

<h2>Le démarrage de l’ordinateur</h2>
<ol class="steps">
  <li><strong>Micrologiciel</strong> : à la mise sous tension, le processeur exécute le micrologiciel de la carte mère, aujourd’hui l’<strong>UEFI</strong> (successeur du BIOS). Il teste le matériel (POST) et cherche un périphérique de démarrage selon l’ordre configuré.</li>
  <li><strong>Démarrage sécurisé</strong> (<em>Secure Boot</em>) : l’UEFI vérifie que le chargeur est signé par un éditeur de confiance, ce qui bloque les logiciels malveillants qui s’installent avant le système.</li>
  <li><strong>Chargeur d’amorçage</strong> : Windows Boot Manager, ou GRUB sous Linux (qui permet de choisir entre plusieurs systèmes). Il charge le noyau en mémoire.</li>
  <li><strong>Noyau</strong> : il détecte le matériel, charge les pilotes, monte le système de fichiers principal.</li>
  <li><strong>Services</strong> : le premier processus (<code>systemd</code> sous Linux, le gestionnaire de sessions et de services sous Windows) démarre les services, puis l’écran de connexion.</li>
</ol>

<h2>Disques, partitions et systèmes de fichiers</h2>
<p>Un disque est d’abord découpé en <strong>partitions</strong>, décrites dans une table de partitions :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Table</th><th>Limites</th><th>Usage</th></tr>
  <tr><td><strong>MBR</strong> (1983)</td><td>4 partitions principales ; disques de 2 Tio au plus</td><td>Anciens systèmes, démarrage BIOS</td></tr>
  <tr><td><strong>GPT</strong> (avec l’UEFI)</td><td>128 partitions sous Windows ; disques de plusieurs zettaoctets ; copie de secours de la table</td><td>Norme actuelle, obligatoire pour Windows 11</td></tr>
</table></div>
<p>Chaque partition est ensuite <strong>formatée</strong> avec un <strong>système de fichiers</strong>, qui organise les fichiers, les dossiers, leurs noms, leurs dates et leurs droits :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Système de fichiers</th><th>Points forts</th><th>Limites</th><th>Usage typique</th></tr>
  <tr><td><strong>NTFS</strong></td><td>Droits d’accès détaillés, journalisation (résiste aux coupures), chiffrement, quotas</td><td>Lecture et écriture limitées sur les autres systèmes</td><td>Windows</td></tr>
  <tr><td><strong>ext4</strong></td><td>Droits Unix, journalisation, robuste et rapide</td><td>Non lisible par Windows sans outil</td><td>Linux</td></tr>
  <tr><td><strong>FAT32</strong></td><td>Lisible partout (téléviseurs, appareils photo, UEFI)</td><td>Fichiers de <strong>4 Gio au plus</strong>, pas de droits, pas de journalisation</td><td>Petites clés USB, partition de démarrage UEFI</td></tr>
  <tr><td><strong>exFAT</strong></td><td>Lisible par Windows, macOS et Linux récents ; gros fichiers</td><td>Pas de droits, pas de journalisation</td><td>Clés USB et disques externes</td></tr>
</table></div>
<p>Windows désigne chaque partition par une <strong>lettre</strong> (<code>C:</code>, <code>D:</code>). Linux a une <strong>arborescence unique</strong> qui commence à la racine <code>/</code> : une partition ou une clé USB y est « montée » dans un dossier (par exemple <code>/media/etudiant/CLE</code>). La partie 5 détaille cette arborescence.</p>

<div class="ctab" data-id="c-fs" data-head="Situation" data-cols="Système de fichiers adapté" data-choices="NTFS|ext4|FAT32|exFAT" data-label="Choisir un système de fichiers">
  <div class="r" data-ok="exFAT" data-expl="Il faut des fichiers de plus de 4 Gio (exclut FAT32) et une lecture par Windows, macOS et Linux (exclut NTFS et ext4 sans outils).">Un disque externe de 2 To pour échanger des vidéos de 10 Go entre le poste Windows de l’accueil, un Mac et un poste Kubuntu.</div>
  <div class="r" data-ok="NTFS" data-expl="Disque de données d’un serveur Windows : NTFS pour les droits d’accès par utilisateur et par groupe (chapitre 3).">Le disque de données de SRV-WIN, qui hébergera les dossiers partagés des ligues avec des droits différents pour chacune.</div>
  <div class="r" data-ok="ext4" data-expl="Le système de fichiers par défaut de Debian, avec les droits Unix.">La partition principale de SRV-DEB, le serveur Debian.</div>
  <div class="r" data-ok="FAT32" data-expl="Petits fichiers, compatibilité maximale avec des appareils anciens ; c’est aussi le format exigé pour la partition de démarrage UEFI.">Une clé USB de 8 Go pour mettre à jour le micrologiciel d’un vieil appareil qui ne lit que le FAT32.</div>
</div>

<h2>Comptes et privilèges</h2>
<p>Tous les systèmes distinguent les utilisateurs ordinaires et les administrateurs :</p>
<ul>
  <li>sous <strong>Windows</strong>, le groupe <em>Administrateurs</em> ; même administrateur, on travaille avec des droits limités et le <strong>contrôle de compte d’utilisateur</strong> (UAC) demande une confirmation pour les actions d’administration ;</li>
  <li>sous <strong>Linux</strong>, le superutilisateur <strong>root</strong> a tous les droits ; on travaille avec un compte ordinaire et on préfixe les commandes d’administration par <code>sudo</code>, qui demande son propre mot de passe et garde une trace de la commande.</li>
</ul>
<p>Travailler en permanence en administrateur est une mauvaise pratique : la moindre erreur, ou le moindre logiciel malveillant, a alors tous les droits sur la machine (chapitre 6).</p>

<h2>Licences et cycle de vie</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Type de licence</th><th>Principe</th><th>Exemples</th></tr>
  <tr><td><strong>Propriétaire</strong></td><td>L’éditeur concède un droit d’usage, selon un contrat (CLUF) ; le code source n’est pas fourni. Licence liée au poste (OEM), achetée seule, ou en volume pour les organisations ; pour les serveurs Windows, des licences d’accès client (CAL) s’ajoutent</td><td>Windows, Microsoft 365, la plupart des logiciels métier</td></tr>
  <tr><td><strong>Libre</strong></td><td>Liberté d’utiliser, d’étudier (code source), de modifier et de redistribuer. Les licences « copyleft » (GPL) imposent que les versions modifiées restent libres ; les licences permissives (MIT, BSD, Apache) ne l’imposent pas</td><td>Linux, Debian, LibreOffice, Firefox, GLPI</td></tr>
  <tr><td><strong>Gratuiciel</strong> (<em>freeware</em>)</td><td>Gratuit, mais propriétaire : pas de code source, conditions d’usage fixées par l’éditeur (parfois gratuit seulement pour un usage personnel)</td><td>Adobe Acrobat Reader</td></tr>
  <tr><td><strong>Version d’évaluation</strong></td><td>Logiciel complet utilisable pendant une durée limitée, pour tester</td><td>Windows Server 2019 Evaluation (180 jours)</td></tr>
</table></div>
<p>« Libre » ne veut pas dire « sans règles » : la licence s’applique, et un logiciel libre peut être vendu ou accompagné d’un support payant. Pour une organisation, vérifier les licences fait partie de la gestion du patrimoine informatique : un logiciel utilisé sans licence valable expose à des poursuites (contrefaçon).</p>
<p>Chaque version de système a aussi une <strong>date de fin de support</strong>, après laquelle l’éditeur ne publie plus de correctifs de sécurité :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Système</th><th>Fin du support</th></tr>
  <tr><td>Windows 10</td><td>14 octobre 2025 (mises à jour de sécurité étendues payantes ensuite, pour une durée limitée)</td></tr>
  <tr><td>Windows Server 2019</td><td>9 janvier 2029 (support étendu)</td></tr>
  <tr><td>Debian 12 « bookworm »</td><td>support de sécurité de l’équipe Debian jusqu’au 12 juillet 2026, puis support à long terme (LTS) jusqu’au 30 juin 2028</td></tr>
  <tr><td>Debian 13 « trixie »</td><td>version stable depuis août 2025 ; support de sécurité prévu pendant environ trois ans, puis LTS</td></tr>
</table></div>

<div class="aside pro">
  <p class="aside-title">En entreprise</p>
  <p>Le service informatique tient à jour la liste des systèmes de son parc et leurs dates de fin de support (dans GLPI, par exemple), et planifie les migrations un an ou deux à l’avance. La fin de support de Windows 10 a obligé de nombreuses organisations à remplacer des postes encore en bon état, faute de compatibilité avec Windows 11 : c’est le genre de décision qui se prépare, et que le technicien doit savoir expliquer à sa direction (TP 1, mission 4).</p>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p3" data-title="Le système d’exploitation" data-label="Quiz de fin de partie">
  <div class="q" data-ok="2">
    <p class="qt">Qu’est-ce qu’un pilote (<em>driver</em>) ?</p>
    <ul><li>Un logiciel antivirus</li><li>Un logiciel qui permet au système de dialoguer avec un périphérique</li><li>Le premier processus lancé au démarrage</li><li>Un compte administrateur</li></ul>
    <div class="expl">Chaque modèle de carte réseau, de carte graphique ou d’imprimante a son pilote. Un pilote absent ou défectueux est une cause fréquente de panne d’un périphérique.</div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">On veut copier un fichier vidéo de 6 Go sur une clé USB formatée en FAT32. Que se passe-t-il ?</p>
    <ul><li>La copie réussit</li><li>La vidéo est compressée automatiquement</li><li>La clé est reformatée</li><li>La copie échoue : FAT32 limite la taille d’un fichier à 4 Gio</li></ul>
    <div class="expl">Windows affiche « Le fichier est trop volumineux pour le système de fichiers de destination ». On reformate la clé en exFAT (après avoir sauvegardé son contenu).</div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Quel est le rôle de <code>sudo</code> sous Linux ?</p>
    <ul><li>Exécuter une commande avec les droits d’administration, de façon tracée</li><li>Supprimer un utilisateur</li><li>Mettre à jour le noyau</li><li>Ouvrir une session graphique</li></ul>
    <div class="expl">On travaille avec un compte ordinaire et on n’élève ses droits que pour la commande qui en a besoin. Les appels à <code>sudo</code> sont journalisés.</div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Qu’est-ce qui caractérise un logiciel libre ?</p>
    <ul><li>Il est forcément gratuit</li><li>Il n’a pas de licence</li><li>Sa licence autorise à l’utiliser, l’étudier, le modifier et le redistribuer</li><li>Il ne fonctionne que sous Linux</li></ul>
    <div class="expl">Les quatre libertés définissent le logiciel libre. Il peut être vendu, et un logiciel gratuit n’est pas forcément libre (gratuiciel).</div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Pourquoi un système arrivé en fin de support est-il un problème ?</p>
    <ul><li>Il devient plus lent</li><li>Il ne reçoit plus de correctifs de sécurité, alors que de nouvelles failles sont découvertes</li><li>Il s’arrête de fonctionner à la date de fin de support</li><li>Ses licences sont annulées</li></ul>
    <div class="expl">Le système continue de fonctionner, mais chaque faille découverte ensuite reste ouverte. Un poste relié au réseau devient alors une porte d’entrée.</div>
  </div>
</div>

<div class="aside next">
  <p class="aside-title">La suite</p>
  <p>Pour installer des serveurs sans acheter de matériel, on utilise la virtualisation. La <a href="#p4">partie 4</a> présente les machines virtuelles et VirtualBox.</p>

<template data-page="p4">
<h1>La virtualisation</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : parties 1 et 3. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Virtualisation</div><ul>
  <li><span><b>Principe</b> : plusieurs machines sur un seul ordinateur</span></li>
  <li><span><b>Hyperviseurs</b> : type 1 et type 2</span></li>
  <li><span><b>Machine virtuelle</b> : processeur, mémoire, disque, carte réseau</span></li>
  <li><span><b>Instantanés et clones</b></span></li>
  <li><span><b>Réseau de VirtualBox</b> : NAT, pont, réseau interne</span></li>
</ul></div></figure>

<p class="lead">La plupart des serveurs d’entreprise ne sont plus des machines physiques, mais des <strong>machines virtuelles</strong> : des ordinateurs simulés par logiciel, plusieurs dizaines sur un même serveur physique. Dans ce cours, la virtualisation permet à chacun d’avoir ses propres serveurs Debian et Windows, de les casser sans risque et de revenir en arrière en quelques secondes.</p>

<h2>Le principe</h2>
<p>Un logiciel appelé <strong>hyperviseur</strong> partage les ressources d’un ordinateur physique (l’<strong>hôte</strong>) entre plusieurs machines virtuelles (les <strong>invités</strong>). Chaque machine virtuelle voit un matériel virtuel complet : processeurs virtuels (vCPU), mémoire, disque, carte réseau, écran. Elle y installe son propre système d’exploitation, qui ignore le plus souvent qu’il est virtualisé.</p>
<figure class="fig">
  <svg viewBox="0 0 640 250" role="img" aria-label="Hyperviseurs de type 1 et de type 2">

</figure>
<dl class="def">
  <dt>Hyperviseur de type 1</dt><dd>Installé directement sur le matériel, à la place d’un système d’exploitation : VMware ESXi, Microsoft Hyper-V, Proxmox VE (libre, basé sur Debian et KVM). Performances proches du matériel ; c’est la solution des salles serveurs.</dd>
  <dt>Hyperviseur de type 2</dt><dd>Logiciel installé sur un système existant : <strong>Oracle VirtualBox</strong> (gratuit, en grande partie libre), VMware Workstation. Idéal pour les tests, la formation, le développement.</dd>
</dl>
<p>Les processeurs modernes ont des instructions dédiées à la virtualisation (<strong>Intel VT-x</strong>, <strong>AMD-V</strong>), à activer dans l’UEFI. Sans elles, VirtualBox refuse de démarrer une machine 64 bits. Sous Windows, si Hyper-V ou ses dérivés (sous-système Linux WSL 2, sécurité basée sur la virtualisation) sont actifs, VirtualBox fonctionne en mode dégradé, beaucoup plus lent (une tortue verte s’affiche dans la barre d’état de la machine virtuelle).</p>

<h2>Ce qu’apporte la virtualisation</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Avantage</th><th>Explication</th></tr>
  <tr><td>Consolidation</td><td>Un serveur physique bien rempli remplace dix serveurs peu utilisés : moins d’achats, de place, d’électricité</td></tr>
  <tr><td>Isolation</td><td>Une machine virtuelle qui plante ou qui est compromise n’affecte pas les autres</td></tr>
  <tr><td>Souplesse</td><td>Créer un serveur en quelques minutes, ajouter de la mémoire par un réglage, déplacer une machine virtuelle d’un hôte à l’autre</td></tr>
  <tr><td>Instantanés et clones</td><td>Figer l’état d’une machine avant une modification risquée ; dupliquer une machine de test</td></tr>
  <tr><td>Maquettes</td><td>Reproduire un réseau complet sur un seul poste, comme dans ce cours</td></tr>
</table></div>
<p>Limites : toutes les machines virtuelles dépendent de l’hôte (une panne de l’hôte les arrête toutes, d’où des grappes de plusieurs hôtes en entreprise) ; les ressources sont partagées (une machine virtuelle gourmande ralentit les autres) ; chaque système invité a besoin de sa propre licence.</p>

<h2>Les composants d’une machine virtuelle VirtualBox</h2>
<ul>
  <li><strong>Processeurs et mémoire</strong> : réservés sur ceux de l’hôte. On ne donne jamais toute la mémoire de l’hôte à ses machines virtuelles.</li>
  <li><strong>Disque virtuel</strong> : un fichier sur le disque de l’hôte (<code>.vdi</code> pour VirtualBox, <code>.vmdk</code> pour VMware, <code>.vhdx</code> pour Hyper-V). <strong>Dynamique</strong> : il grossit au fur et à mesure jusqu’à la taille maximale choisie (économise la place) ; <strong>taille fixe</strong> : tout l’espace est réservé dès la création (un peu plus rapide).</li>
  <li><strong>Lecteur optique virtuel</strong> : on y « insère » une image ISO, le fichier qui contient le disque d’installation du système.</li>
  <li><strong>Cartes réseau</strong> : jusqu’à quatre dans l’interface graphique, chacune avec son mode d’accès réseau et son adresse MAC.</li>
  <li><strong>Additions invité</strong> (<em>Guest Additions</em>) : pilotes à installer dans le système invité pour un affichage adapté à la fenêtre, le copier-coller et les dossiers partagés avec l’hôte.</li>
</ul>

<h3>Instantanés et clones</h3>
<p>Un <strong>instantané</strong> (<em>snapshot</em>) enregistre l’état d’une machine virtuelle à un instant donné ; on peut y revenir à tout moment. Il est rapide, mais ce n’est <strong>pas une sauvegarde</strong> : il est stocké avec la machine, sur le même disque, et dépend du disque virtuel d’origine (chapitre 5). Un <strong>clone</strong> est une copie de la machine : intégral (indépendant) ou lié (qui partage le disque d’origine, plus économe). En clonant, on demande à VirtualBox de <strong>générer de nouvelles adresses MAC</strong> : deux machines avec la même adresse MAC sur un même réseau ne communiquent pas correctement (chapitre 2).</p>

<h2>Les modes réseau de VirtualBox</h2>
<p>Ce point est essentiel pour tous les TP de l’année : le mode choisi pour chaque carte réseau détermine avec qui la machine virtuelle peut communiquer.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Mode</th><th>La machine virtuelle peut joindre…</th><th>Usage dans le cours</th></tr>
  <tr><td><strong>NAT</strong> (par défaut)</td><td>Internet et le réseau de l’hôte, en passant par l’hôte, qui traduit les adresses ; elle n’est pas joignable depuis l’extérieur. Chaque machine virtuelle a son propre NAT : deux machines en NAT ne se voient pas. Adresse habituelle : <code>10.0.2.15</code>, passerelle <code>10.0.2.2</code></td><td>Installation et mises à jour (TP 2)</td></tr>
  <tr><td><strong>Réseau NAT</strong></td><td>Internet, et les autres machines virtuelles du même réseau NAT</td><td>Plusieurs machines qui doivent se voir et accéder à Internet</td></tr>
  <tr><td><strong>Accès par pont</strong></td><td>Le réseau physique, comme un vrai ordinateur branché sur la prise : elle y obtient sa propre adresse</td><td><strong>Interdit au lycée</strong> : un serveur DHCP ou un test de sécurité perturberait le réseau de l’établissement</td></tr>
  <tr><td><strong>Réseau interne</strong></td><td>Seulement les machines virtuelles connectées au même réseau interne (même nom), sans l’hôte ni Internet</td><td>Maquettes isolées : réseau <code>tp5</code> du chapitre 2, puis DHCP, DNS, domaine</td></tr>
  <tr><td><strong>Réseau privé hôte</strong></td><td>L’hôte et les machines virtuelles de ce réseau, sans Internet</td><td>Administrer une machine virtuelle depuis l’hôte (SSH, navigateur)</td></tr>
  <tr><td><strong>Non connecté</strong></td><td>Personne : câble débranché</td><td>Simuler une panne, isoler une machine</td></tr>
</table></div>

<div class="match" data-id="m-modes-reseau" data-label="Quel mode réseau choisir ?" data-options="NAT|Réseau interne|Réseau privé hôte|Accès par pont|Non connecté">
  <div class="r" data-ok="NAT" data-expl="Le mode NAT donne accès à Internet sans exposer la machine virtuelle ni la mettre sur le réseau du lycée.">SRV-DEB doit télécharger des paquets pendant son installation.</div>
  <div class="r" data-ok="Réseau interne" data-expl="Le réseau interne relie les machines virtuelles entre elles, isolées de tout le reste ; il faut le même nom sur les deux.">SRV-DEB et SRV-WIN doivent communiquer entre eux dans une maquette isolée, avec leur propre serveur DHCP.</div>
  <div class="r" data-ok="Réseau privé hôte" data-expl="Le réseau privé hôte relie l’hôte et les machines virtuelles, sans accès à Internet.">Depuis le poste hôte, on veut se connecter en SSH à SRV-DEB, sans que SRV-DEB soit joignable par d’autres machines.</div>
  <div class="r" data-ok="Accès par pont" data-expl="Seul l’accès par pont met la machine virtuelle sur le réseau physique comme un vrai poste. C’est pour cette raison qu’il est interdit sur le réseau du lycée.">À la maison, on veut que la console de jeux du salon puisse joindre un serveur installé dans une machine virtuelle.</div>
  <div class="r" data-ok="Non connecté" data-expl="Débrancher le câble virtuel coupe la machine de tout réseau, sans l’éteindre : c’est le premier réflexe face à une infection (chapitre 6).">On soupçonne qu’une machine virtuelle de test est infectée et on veut l’isoler sans l’éteindre.</div>
</div>

<div class="aside deep">
  <p class="aside-title">En profondeur : machines virtuelles et conteneurs</p>
  <p>Un <strong>conteneur</strong> (Docker, Podman) n’embarque pas de système d’exploitation complet : il partage le noyau de l’hôte et n’isole que les processus, les fichiers et le réseau d’une application. Il démarre en une fraction de seconde et consomme peu, mais ne peut faire tourner que des applications compatibles avec le noyau de l’hôte (un conteneur Linux a besoin d’un noyau Linux). Les développeurs SLAM utiliseront les conteneurs pour déployer leurs applications ; les SISR les administreront, souvent dans des machines virtuelles. L’informatique en nuage (Azure, AWS, OVHcloud, Scaleway) loue des machines virtuelles et des conteneurs à la demande.</p>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p4" data-title="La virtualisation" data-label="Quiz de fin de partie">
  <div class="q" data-ok="3">
    <p class="qt">VirtualBox est un hyperviseur…</p>
    <ul><li>de type 1, installé directement sur le matériel</li><li>de conteneurs</li><li>de type 2, installé sur un système existant</li><li>réservé à Linux</li></ul>
    <div class="expl">VirtualBox s’installe comme une application sur Windows, Linux ou macOS. ESXi, Hyper-V et Proxmox sont des hyperviseurs de type 1.</div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">VirtualBox refuse de démarrer une machine virtuelle 64 bits : « VT-x is disabled in the BIOS ». Que faut-il faire ?</p>
    <ul><li>Activer la virtualisation matérielle dans l’UEFI du poste</li><li>Réinstaller VirtualBox</li><li>Donner plus de mémoire à la machine virtuelle</li><li>Passer la carte réseau en mode pont</li></ul>
    <div class="expl">Les instructions de virtualisation du processeur (VT-x ou AMD-V) sont souvent désactivées par défaut dans l’UEFI. Au lycée, c’est l’enseignant ou l’administrateur qui le fait.</div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Deux machines virtuelles en mode NAT peuvent-elles communiquer entre elles ?</p>
    <ul><li>Oui, toujours</li><li>Oui, si elles ont la même adresse IP</li><li>Seulement en IPv6</li><li>Non : chacune a son propre NAT ; il faut un réseau interne ou un réseau NAT</li></ul>
    <div class="expl">En mode NAT simple, chaque machine virtuelle est seule derrière l’hôte (toutes ont d’ailleurs l’adresse 10.0.2.15). Pour qu’elles se voient : réseau interne, réseau NAT ou réseau privé hôte.</div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Pourquoi un instantané n’est-il pas une sauvegarde ?</p>
    <ul><li>Parce qu’il ne contient pas le système</li><li>Parce qu’il est stocké avec la machine virtuelle et dépend de son disque : si le disque de l’hôte est perdu, l’instantané aussi</li><li>Parce qu’il ne fonctionne qu’une fois</li><li>Parce qu’il est trop lent</li></ul>
    <div class="expl">Une sauvegarde doit être une copie indépendante, sur un autre support (règle 3-2-1, chapitre 5). L’instantané sert à revenir en arrière après une manipulation ratée.</div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Pourquoi le mode « accès par pont » est-il interdit sur le réseau du lycée ?</p>
    <ul><li>Parce qu’il est plus lent</li><li>Parce qu’il n’existe pas sous Windows</li><li>Parce que la machine virtuelle serait sur le réseau de l’établissement et pourrait le perturber</li><li>Parce qu’il empêche l’accès à Internet</li></ul>
    <div class="expl">Un serveur DHCP de test en mode pont distribuerait de fausses adresses à toute la salle, voire à tout l’établissement (chapitre 6, TP 16).</div>
  </div>
</div>

<div class="aside next">
  <p class="aside-title">La suite</p>
  <p>Au <a href="#tp2">TP 2</a>, vous créez les deux serveurs virtuels qui vous accompagneront toute l’année : SRV-DEB et SRV-WIN.</p>
</div>

<p class="lead">Le service informatique de la M2L veut une maquette pour tester ses futurs services avant de les mettre en production. Vous créez dans VirtualBox les deux serveurs qui vous accompagneront toute l’année : <strong style="white-space:nowrap">SRV-DEB</strong>, un serveur Debian sans interface graphique, et <strong>SRV-WIN</strong>, un serveur Windows Server 2019. Vous documentez chaque choix, comme pour une vraie installation.</p>

      <tr><td>Type et version</td><td>Linux, Debian (64-bit)</td><td>Microsoft Windows, Windows 2019 (64-bit)</td></tr>
      <tr><td>Image ISO</td><td>Debian netinst</td><td>Windows Server 2019 Evaluation</td></tr>
      <tr><td>Installation automatique</td><td colspan="2"><strong>Désactivée</strong> : cocher l’option qui ignore l’installation sans surveillance (<em>Skip Unattended Installation</em>), pour faire l’installation soi-même</td></tr>
      <tr><td>Mémoire</td><td>2 048 Mo</td><td>4 096 Mo</td></tr>
      <tr><td>Processeurs</td><td>2</td><td>2</td></tr>
      <tr><td>Disque virtuel</td><td>VDI, dynamique, 20 Go</td><td>VDI, dynamique, 50 Go</td></tr>
      <tr><td>Réseau (carte 1)</td><td>NAT</td><td>NAT</td></tr>
    </table></div>
    <p>Dans VirtualBox : <em>Machine &gt; Nouvelle</em>, renseigner les réglages ci-dessus, puis vérifier dans <em>Configuration</em> : <em>Système</em> (ordre d’amorçage, nombre de processeurs), <em>Stockage</em> (l’ISO est dans le lecteur optique), <em>Réseau</em> (NAT).</p>
    <div class="answer" data-id="t2-ressources" data-label="Mission 1 : justifier les ressources" data-min="200" data-rows="8">
      <p>a) Pourquoi SRV-WIN reçoit-il deux fois plus de mémoire et un disque bien plus grand que SRV-DEB ? b) Avec un disque dynamique de 50 Go, combien d’espace le fichier <code>.vdi</code> occupe-t-il juste après sa création ? c) Retrouver dans la configuration l’adresse MAC de la carte réseau de chaque machine : par quels 3 octets commencent-elles, et pourquoi ?</p>
      <div class="corr">
        <p>a) Windows Server avec l’expérience de bureau a une interface graphique et de nombreux services : il demande au minimum 2 Go de mémoire (4 Go pour être à l’aise) et environ 32 Go de disque. Debian sans interface graphique tourne avec quelques centaines de Mo de mémoire et moins de 2 Go de disque : 2 Go et 20 Go laissent de la marge pour les services des chapitres suivants.</p>
        <p>b) Quelques Mo seulement : un disque dynamique grossit au fur et à mesure de l’écriture des données, jusqu’à 50 Go au maximum. Il faut donc surveiller l’espace libre de l’hôte : si ce dernier est plein, les machines virtuelles s’arrêtent avec une erreur d’écriture.</p>
        <p>c) <code>08:00:27</code> (affiché <code>080027…</code> dans VirtualBox) : c’est le préfixe de fabricant (OUI) attribué à la société qui a créé VirtualBox, PCS Systemtechnik. Les 3 octets suivants sont tirés au hasard pour chaque carte (chapitre 2).</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 2 : installer Debian sur SRV-DEB</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Un serveur Linux minimal et à jour</summary>
  <div class="task-body">
    <p>Démarrer SRV-DEB et choisir <em>Install</em> (installation en mode texte, la plus courante sur un serveur). Réponses à donner :</p>
    <div class="tbl-wrap"><table class="data wide">
      <tr><th>Étape de l’installateur</th><th>Réponse</th><th>Pourquoi</th></tr>
      <tr><td>Langue, pays, clavier</td><td>Français, France, Français</td><td>Messages et clavier AZERTY</td></tr>
      <tr><td>Nom de machine, domaine</td><td><code>srv-deb</code>, <code>m2l.lan</code></td><td>Nom en minuscules, sans espace ; le domaine de la maquette (chapitre 3)</td></tr>
      <tr><td>Mot de passe du superutilisateur (root)</td><td><strong>Laisser vide</strong> (deux fois)</td><td>Le compte root est alors verrouillé, et le premier utilisateur pourra administrer avec <code>sudo</code> (partie 3)</td></tr>
      <tr><td>Utilisateur</td><td>Nom complet « Étudiant SIO », identifiant <code>etudiant</code>, un mot de passe de maquette</td><td>Compte d’administration utilisé dans tous les supports</td></tr>
      <tr><td>Partitionnement</td><td>Assisté, utiliser un disque entier ; tout dans une seule partition ; terminer et appliquer</td><td>Simple pour une maquette ; en production, on sépare souvent <code>/var</code> ou <code>/home</code></td></tr>
      <tr><td>Miroir de l’archive Debian</td><td>France, <code>deb.debian.org</code>, pas de mandataire (sauf indication de l’enseignant)</td><td>Source des paquets</td></tr>
      <tr><td>Sélection des logiciels</td><td><strong>Décocher</strong> « environnement de bureau Debian » et « GNOME » ; <strong>cocher</strong> « serveur SSH » et « utilitaires usuels du système »</td><td>Un serveur n’a pas d’interface graphique : moins de ressources, moins de failles</td></tr>
      <tr><td>Programme de démarrage GRUB</td><td>Oui, sur <code>/dev/sda</code></td><td>Le chargeur d’amorçage (partie 3)</td></tr>
    </table></div>
    <p>Au redémarrage, se connecter avec <code>etudiant</code>, puis :</p>
    <pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> cat /etc/debian_version ; uname -r
<span class="pr">etudiant@srv-deb:~$</span> hostnamectl
<span class="pr">etudiant@srv-deb:~$</span> lsblk
<span class="pr">etudiant@srv-deb:~$</span> df -h /
<span class="pr">etudiant@srv-deb:~$</span> free -h
<span class="pr">etudiant@srv-deb:~$</span> ip a
<span class="pr">etudiant@srv-deb:~$</span> ip route
<span class="pr">etudiant@srv-deb:~$</span> sudo apt update
<span class="pr">etudiant@srv-deb:~$</span> sudo apt full-upgrade
<span class="pr">etudiant@srv-deb:~$</span> sudo poweroff</pre>
    <div class="answer" data-id="t2-debian" data-label="Mission 2 : observer le serveur Debian" data-min="250" data-rows="10">
      <p>Relever et expliquer : a) la version de Debian et du noyau ; b) les partitions créées par l’installateur (<code>lsblk</code>) et la place occupée sur <code>/</code> ; c) la mémoire utilisée ; d) le nom de la carte réseau, son adresse IPv4, la passerelle par défaut ; e) ce qu’a fait <code>sudo apt update</code>, puis <code>sudo apt full-upgrade</code> ; f) ce qui se passe si l’on tape <code>apt update</code> sans <code>sudo</code>.</p>
      <div class="corr">
        <p>a) Par exemple <code>13.x</code> et un noyau <code>6.12.x-amd64</code> pour Debian 13 (<code>12.x</code> et <code>6.1.x</code> pour Debian 12).</p>
        <p>b) <code>sda</code> (20G) avec <code>sda1</code> monté sur <code>/</code> (la quasi-totalité du disque), <code>sda2</code> (partition étendue) et <code>sda5</code> (<code>[SWAP]</code>, l’espace d’échange, environ 1 à 2 Go). Selon l’installation, la table peut être en GPT avec une petite partition de démarrage. <code>/</code> n’est occupé qu’à hauteur de 1,5 à 2 Go environ.</p>
        <p>c) Environ 150 à 300 Mo utilisés sur 2 Go : sans interface graphique, Debian est très léger.</p>
        <p>d) <code>enp0s3</code> (nom de carte prévisible : bus PCI 0, emplacement 3), adresse <code>10.0.2.15/24</code> reçue par DHCP du NAT de VirtualBox, passerelle <code>10.0.2.2</code> (ligne <code>default via 10.0.2.2</code>), plus l’interface de bouclage <code>lo</code> (<code>127.0.0.1</code>).</p>
        <p>e) <code>apt update</code> télécharge la <strong>liste</strong> des paquets disponibles depuis les dépôts, sans rien installer ; <code>apt full-upgrade</code> installe les nouvelles versions des paquets installés (dont les correctifs de sécurité), en ajoutant ou retirant des dépendances si nécessaire.</p>
        <p>f) Message d’erreur de permission (« Permission non accordée », impossible d’ouvrir le verrou) : mettre à jour la liste des paquets modifie des fichiers système, ce qui demande les droits d’administration.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 3 : installer Windows Server 2019 sur SRV-WIN</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Un serveur Windows nommé et à jour</summary>
  <div class="task-body">
    <ol class="steps">
      <li>Démarrer SRV-WIN. Langue français, clavier français, <em>Installer maintenant</em>.</li>
      <li>Système : <strong>Windows Server 2019 Standard Evaluation (expérience de bureau)</strong>. Sans « expérience de bureau », on obtient la version Core, sans interface graphique.</li>
      <li>Accepter la licence, choisir <em>Personnalisé : installer uniquement Windows</em>, sélectionner l’espace non alloué, <em>Suivant</em>.</li>
      <li>Après les redémarrages, définir le mot de passe du compte <strong>Administrateur</strong> (il doit respecter la complexité : 8 caractères au moins, trois types de caractères parmi majuscules, minuscules, chiffres et caractères spéciaux).</li>
      <li>Pour ouvrir la session : menu <em>Entrée &gt; Insérer Ctrl-Alt-Suppr</em> de VirtualBox (ou Ctrl droit + Suppr), car Ctrl + Alt + Suppr est capté par l’hôte.</li>
      <li>Installer les <strong>additions invité</strong> : <em>Périphériques &gt; Insérer l’image CD des Additions invité</em>, puis lancer <code>VBoxWindowsAdditions.exe</code> depuis le lecteur de CD et redémarrer.</li>
      <li>En PowerShell (administrateur), renommer le serveur : <code>Rename-Computer -NewName SRV-WIN -Restart</code>.</li>
      <li>Lancer les mises à jour : <em>Paramètres &gt; Mise à jour et sécurité &gt; Windows Update</em> (ou l’outil <code>sconfig</code>, option 6). Elles peuvent être longues : continuer avec la mission 4 pendant ce temps.</li>
    </ol>
    <pre class="code terminal"><span class="pr">PS C:\Users\Administrateur&gt;</span> Get-ComputerInfo -Property CsName, OsName, OsVersion, OsArchitecture, CsTotalPhysicalMemory
<span class="pr">PS C:\Users\Administrateur&gt;</span> Get-Disk ; Get-Partition
<span class="pr">PS C:\Users\Administrateur&gt;</span> ipconfig /all
<span class="pr">PS C:\Users\Administrateur&gt;</span> slmgr /dlv</pre>
    <div class="answer" data-id="t2-windows" data-label="Mission 3 : observer le serveur Windows" data-min="250" data-rows="10">
      <p>Relever et expliquer : a) le nom, l’édition et la version du système ; b) les partitions créées par l’installateur ; c) l’adresse IPv4, la passerelle et le serveur DNS de la carte réseau, et leur origine ; d) ce qu’indique <code>slmgr /dlv</code> sur la licence ; e) la mémoire utilisée au repos (Gestionnaire des tâches), comparée à celle de SRV-DEB.</p>
      <div class="corr">
        <p>a) <code>SRV-WIN</code> (après le renommage), <code>Microsoft Windows Server 2019 Standard Evaluation</code>, version <code>10.0.17763</code> (le numéro de build de Windows Server 2019), 64 bits.</p>
        <p>b) Selon le micrologiciel de la machine virtuelle : avec un démarrage BIOS (réglage par défaut le plus courant), une partition « Réservé au système » d’environ 50 à 100 Mo (fichiers de démarrage) et la partition <code>C:</code> ; avec l’EFI activé, une table GPT avec une partition système EFI (FAT32), une partition réservée (MSR), <code>C:</code> et une partition de récupération.</p>
        <p>c) <code>10.0.2.15</code>, passerelle <code>10.0.2.2</code>, DNS <code>10.0.2.3</code> (ou celui de l’hôte), avec « DHCP activé : Oui » : c’est le serveur DHCP intégré au NAT de VirtualBox. Chaque machine virtuelle en NAT a la même adresse, sans conflit, car chacune a son propre réseau NAT (partie 4).</p>
        <p>d) Le canal de licence (<code>EVAL</code>) et le temps restant avant l’expiration de la période d’évaluation de 180 jours. À l’expiration, Windows affiche des avertissements et s’éteint régulièrement : la maquette doit être prévue pour une année scolaire, ou utiliser les licences fournies à l’établissement.</p>
        <p>e) Environ 1,2 à 2 Go utilisés au repos, contre 150 à 300 Mo pour SRV-DEB : l’interface graphique et les services de Windows Server consomment davantage. C’est une des raisons pour lesquelles les serveurs Linux, et Windows Server Core, sont souvent installés sans interface graphique.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 4 : instantanés et documentation</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Un point de retour propre</summary>
  <div class="task-body">
    <ol class="steps">
      <li>Éteindre proprement chaque machine (<code>sudo poweroff</code> ; sous Windows, <em>Démarrer &gt; Arrêter</em>), retirer l’ISO du lecteur optique virtuel.</li>
      <li>Dans VirtualBox, onglet <em>Instantanés</em> de chaque machine : <em>Prendre</em>, nom <code>installation-propre</code>, avec une description (date, version, mises à jour faites).</li>
      <li>Tester : sur SRV-DEB, créer un fichier (<code>touch test.txt</code>), éteindre, restaurer l’instantané, redémarrer et vérifier.</li>
    </ol>
    <div class="answer" data-id="t2-doc" data-label="Mission 4 : fiche de documentation de la maquette" data-min="200" data-rows="9">
      <p>Rédiger la fiche technique de la maquette, comme pour un collègue qui devrait la reprendre : pour chaque serveur, le nom, le système et sa version, les ressources, le mode réseau, l’adresse obtenue, les comptes créés (sans les mots de passe : indiquer où ils sont rangés), l’instantané disponible. Expliquer ensuite ce qu’est devenu <code>test.txt</code> après la restauration, et pourquoi.</p>
      <div class="corr">
        <p>Fiche attendue (exemple) : SRV-DEB, Debian 13.x amd64, 2 vCPU, 2 Go, disque dynamique 20 Go, carte 1 en NAT (<code>10.0.2.15/24</code>, passerelle <code>10.0.2.2</code>), compte <code>etudiant</code> (membre du groupe <code>sudo</code>), root verrouillé, serveur SSH installé, instantané <code>installation-propre</code> du jour ; SRV-WIN, Windows Server 2019 Standard Evaluation (10.0.17763), 2 vCPU, 4 Go, disque dynamique 50 Go, NAT, compte <code>Administrateur</code>, additions invité installées, instantané <code>installation-propre</code>. Les mots de passe sont rangés dans un fichier ou un gestionnaire de mots de passe, jamais dans la fiche elle-même.</p>
        <p><code>test.txt</code> a disparu : restaurer un instantané remet le disque virtuel dans l’état exact où il était lors de la prise de l’instantané. Tout ce qui a été fait ensuite est perdu, ce qui est le but recherché après une erreur, mais aussi un piège si l’on oublie d’en reprendre un après un travail réussi.</p>
      </div>
    </div>
  </div>
</details>

<h2>Défi : administrer SRV-DEB depuis l’hôte en SSH</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Une redirection de port de VirtualBox</summary>
  <div class="task-body">
    <div class="answer" data-id="t2-defi" data-label="Défi : connexion SSH depuis l’hôte" data-min="150" data-rows="7">
      <p>Dans la configuration réseau de SRV-DEB (carte 1, NAT), ouvrir <em>Avancé &gt; Redirection de ports</em> et créer une règle : protocole TCP, IP hôte <code>127.0.0.1</code>, port hôte <code>2222</code>, port invité <code>22</code>. Depuis l’hôte, se connecter avec <code>ssh -p 2222 etudiant@127.0.0.1</code>. Expliquer le chemin suivi par la connexion, le message affiché à la première connexion, et l’intérêt d’administrer un serveur en SSH plutôt que par sa console.</p>
      <div class="corr">
        <p>Le client SSH de l’hôte se connecte à son propre port 2222 sur l’adresse de bouclage ; VirtualBox écoute ce port et retransmet la connexion au port 22 de la machine virtuelle, à travers le NAT (c’est une redirection de ports, comme celle d’une box Internet, chapitre 4). Restreindre à <code>127.0.0.1</code> empêche les autres machines du réseau du lycée de l’utiliser.</p>
        <p>À la première connexion, SSH affiche l’empreinte de la clé du serveur et demande de confirmer (« Are you sure you want to continue connecting? ») : c’est la vérification de l’identité du serveur (chapitre 6). Intérêt : copier-coller, plusieurs sessions, outils de l’hôte, et c’est ainsi qu’on administre les serveurs à distance en entreprise, la console n’étant utilisée qu’en dépannage.</p>
      </div>
    </div>
  </div>
</details>
