<template data-page="p5">
<h1>Administrer en ligne de commande : Linux et Windows</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : TP 2 (SRV-DEB et SRV-WIN installés). Tester chaque commande dans les machines virtuelles au fil de la lecture. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Ligne de commande</div><ul>
  <li><span><b>Le terminal</b> : invite, commande, options, arguments, aide</span></li>
  <li><span><b>Fichiers</b> : arborescence, chemins, commandes de base</span></li>
  <li><span><b>Comptes et droits</b> : utilisateurs, groupes, rwx, NTFS</span></li>
  <li><span><b>Logiciels et services</b> : paquets, processus, services</span></li>
  <li><span><b>Windows</b> : PowerShell et ses équivalents</span></li>
</ul></div></figure>

<p class="lead">Les serveurs n’ont souvent pas d’interface graphique, et quand ils en ont une, la ligne de commande reste plus rapide, plus précise et reproductible : une commande se note dans une documentation, se refait à l’identique, s’exécute à distance par SSH et s’intègre dans un script (chapitre 5). Cette partie présente les commandes indispensables de Linux, puis leurs équivalents sous Windows.</p>

<h2>Le terminal Linux</h2>
<p>Le programme qui lit et exécute les commandes s’appelle le <strong>shell</strong> ; sous Debian, c’est <strong>Bash</strong>. Il affiche une <strong>invite</strong> :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Invite</th><th>Signification</th></tr>
  <tr><td><code>etudiant@srv-deb:~$</code></td><td>utilisateur <code>etudiant</code>, sur la machine <code>srv-deb</code>, dans le dossier <code>~</code> (son dossier personnel) ; <code>$</code> : utilisateur ordinaire</td></tr>
  <tr><td><code>root@srv-deb:/etc#</code></td><td>superutilisateur <code>root</code>, dans le dossier <code>/etc</code> ; <code>#</code> : tous les droits, prudence !</td></tr>
</table></div>
<p>Une commande s’écrit <code>commande -options arguments</code>, par exemple <code>ls -l /etc</code>. Les options courtes s’écrivent avec un tiret (<code>-l</code>) et se combinent (<code>-la</code>) ; les options longues avec deux (<code>--all</code>). Linux distingue <strong>majuscules et minuscules</strong> : <code>Rapport.txt</code> et <code>rapport.txt</code> sont deux fichiers différents.</p>
<ul>
  <li><strong>Aide</strong> : <code>man ls</code> (manuel complet, <code>q</code> pour quitter), <code>ls --help</code> (résumé).</li>
  <li><strong>Complétion</strong> : la touche Tab complète les noms de commandes et de fichiers. À utiliser sans modération : elle évite les fautes de frappe.</li>
  <li><strong>Historique</strong> : flèches haut et bas ; <code>history</code>.</li>
  <li><strong>Interrompre</strong> : Ctrl + C arrête la commande en cours.</li>
</ul>

<h2>L’arborescence et les chemins</h2>
<p>Sous Linux, tout part de la racine <code>/</code>. Les dossiers principaux sont normalisés :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Dossier</th><th>Contenu</th></tr>
  <tr><td><code>/etc</code></td><td>Fichiers de configuration du système et des services (texte modifiable)</td></tr>
  <tr><td><code>/home</code></td><td>Dossiers personnels des utilisateurs (<code>/home/etudiant</code>, noté <code>~</code>)</td></tr>
  <tr><td><code>/root</code></td><td>Dossier personnel du superutilisateur</td></tr>
  <tr><td><code>/var</code></td><td>Données variables : journaux (<code>/var/log</code>), sites web (<code>/var/www</code>), files d’attente</td></tr>
  <tr><td><code>/usr</code></td><td>Programmes et bibliothèques installés (<code>/usr/bin</code>)</td></tr>
  <tr><td><code>/srv</code></td><td>Données servies par le serveur (partages, sites)</td></tr>
  <tr><td><code>/tmp</code></td><td>Fichiers temporaires, effacés au redémarrage</td></tr>
  <tr><td><code>/dev</code>, <code>/proc</code></td><td>Périphériques (<code>/dev/sda</code>) et informations du noyau, présentés comme des fichiers</td></tr>
  <tr><td><code>/media</code>, <code>/mnt</code></td><td>Points de montage des clés USB et des disques ajoutés</td></tr>
</table></div>
<p>Un <strong>chemin absolu</strong> part de la racine : <code>/home/etudiant/notes.txt</code>. Un <strong>chemin relatif</strong> part du dossier courant : depuis <code>/home/etudiant</code>, <code>notes.txt</code> désigne le même fichier. <code>.</code> désigne le dossier courant, <code>..</code> le dossier parent, <code>~</code> le dossier personnel. Sous Windows, les chemins utilisent la barre oblique inverse et une lettre de lecteur : <code>C:\Users\Administrateur\Documents</code>.</p>

<h2>Les commandes de base</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Besoin</th><th>Linux (Bash)</th><th>Windows (PowerShell)</th></tr>
  <tr><td>Où suis-je ?</td><td><code>pwd</code></td><td><code>Get-Location</code> (<code>pwd</code>)</td></tr>
  <tr><td>Lister</td><td><code>ls -la</code> (détails, fichiers cachés commençant par un point)</td><td><code>Get-ChildItem -Force</code> (<code>ls</code>, <code>dir</code>)</td></tr>
  <tr><td>Changer de dossier</td><td><code>cd /etc</code>, <code>cd ..</code>, <code>cd ~</code></td><td><code>Set-Location C:\Windows</code> (<code>cd</code>)</td></tr>
  <tr><td>Créer un dossier</td><td><code>mkdir -p /srv/ligues/volley</code></td><td><code>New-Item -ItemType Directory C:\Partages\Volley</code></td></tr>
  <tr><td>Créer un fichier vide</td><td><code>touch notes.txt</code></td><td><code>New-Item notes.txt</code></td></tr>
  <tr><td>Copier, déplacer, renommer</td><td><code>cp -r source dest</code>, <code>mv ancien nouveau</code></td><td><code>Copy-Item -Recurse</code>, <code>Move-Item</code>, <code>Rename-Item</code></td></tr>
  <tr><td>Supprimer</td><td><code>rm fichier</code>, <code>rm -r dossier</code></td><td><code>Remove-Item -Recurse</code></td></tr>
  <tr><td>Afficher un fichier texte</td><td><code>cat</code>, <code>less</code>, <code>head -n 5</code>, <code>tail -n 5</code></td><td><code>Get-Content</code> (<code>-Head 5</code>, <code>-Tail 5</code>)</td></tr>
  <tr><td>Modifier un fichier texte</td><td><code>nano fichier</code> (Ctrl + O pour enregistrer, Ctrl + X pour quitter)</td><td><code>notepad fichier</code></td></tr>
  <tr><td>Chercher un texte</td><td><code>grep -i "erreur" fichier</code></td><td><code>Select-String -Pattern "erreur" fichier</code></td></tr>
  <tr><td>Chercher un fichier</td><td><code>find / -name "*.conf"</code></td><td><code>Get-ChildItem -Recurse -Filter *.conf</code></td></tr>
</table></div>
<div class="aside caution">
  <p class="aside-title">Pas de corbeille</p>
  <p>En ligne de commande, <code>rm</code> et <code>Remove-Item</code> suppriment <strong>définitivement</strong>. <code>rm -r</code> sur le mauvais dossier, avec <code>sudo</code>, peut détruire un serveur. Avant une suppression : vérifier le dossier courant (<code>pwd</code>), lister ce qui sera supprimé (<code>ls</code>), et avoir un instantané ou une sauvegarde. En PowerShell, <code>-WhatIf</code> montre ce qui serait supprimé sans rien faire.</p>
</div>

<h2>Utilisateurs et groupes sous Linux</h2>
<p>Chaque utilisateur a un identifiant numérique (UID), un dossier personnel et un shell ; il appartient à un groupe principal et éventuellement à d’autres groupes. Ces informations sont dans <code>/etc/passwd</code> et <code>/etc/group</code> ; les condensats des mots de passe dans <code>/etc/shadow</code>, lisible seulement par root (chapitre 6).</p>
<pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> id                                   <span class="cm"># mon UID, mes groupes (dont sudo)</span>
<span class="pr">etudiant@srv-deb:~$</span> sudo adduser benevole1                 <span class="cm"># crée le compte, son dossier, demande le mot de passe</span>
<span class="pr">etudiant@srv-deb:~$</span> sudo addgroup ligue-volley
<span class="pr">etudiant@srv-deb:~$</span> sudo adduser benevole1 ligue-volley    <span class="cm"># ajoute benevole1 au groupe</span>
<span class="pr">etudiant@srv-deb:~$</span> id benevole1
<span class="pr">etudiant@srv-deb:~$</span> sudo passwd benevole1                  <span class="cm"># change son mot de passe</span>
<span class="pr">etudiant@srv-deb:~$</span> su - benevole1                         <span class="cm"># ouvrir une session en tant que benevole1 (exit pour revenir)</span>
<span class="pr">etudiant@srv-deb:~$</span> sudo deluser --remove-home benevole1   <span class="cm"># supprime le compte et son dossier</span></pre>
<p><code>adduser</code> et <code>addgroup</code> sont les commandes interactives de Debian ; <code>useradd</code>, <code>groupadd</code> et <code>usermod -aG</code> font la même chose sans poser de questions, et sont utilisées dans les scripts (chapitre 5). Un utilisateur ajouté à un groupe doit ouvrir une nouvelle session pour que ce groupe soit pris en compte.</p>

<h2>Les droits sous Linux</h2>
<p>Chaque fichier et chaque dossier appartient à un <strong>utilisateur</strong> (le propriétaire) et à un <strong>groupe</strong>, et porte trois séries de droits : pour le propriétaire (<strong>u</strong>), pour le groupe (<strong>g</strong>), pour tous les autres (<strong>o</strong>).</p>
<pre class="code"><span class="pr">etudiant@srv-deb:/srv$</span> ls -l
drwxr-x--- 3 root     ligue-volley 4096 sept. 15 10:12 volley
-rw-r----- 1 etudiant ligue-volley  843 sept. 15 10:14 bilan.txt
│└┬┘└┬┘└┬┘
│ │  │  └── droits des autres (o)
│ │  └───── droits du groupe (g)
│ └──────── droits du propriétaire (u)
└────────── type : d = dossier, - = fichier, l = lien</pre>
<p>Viennent ensuite le nombre de liens, le <strong>propriétaire</strong> (<code>root</code>, <code>etudiant</code>), le <strong>groupe</strong> (<code>ligue-volley</code>), la taille en octets, la date de modification et le nom.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Droit</th><th>Valeur</th><th>Sur un fichier</th><th>Sur un dossier</th></tr>
  <tr><td><code>r</code> (lecture)</td><td>4</td><td>lire le contenu</td><td>lister les noms des fichiers</td></tr>
  <tr><td><code>w</code> (écriture)</td><td>2</td><td>modifier le contenu</td><td>créer, renommer, supprimer des fichiers dans le dossier</td></tr>
  <tr><td><code>x</code> (exécution)</td><td>1</td><td>exécuter (programme, script)</td><td>entrer dans le dossier et accéder à ses fichiers</td></tr>
</table></div>
<p>En notation <strong>octale</strong>, on additionne les valeurs pour chaque série : <code>rwx</code> = 4 + 2 + 1 = 7, <code>r-x</code> = 5, <code>r--</code> = 4, <code>---</code> = 0. Ainsi <code>drwxr-x---</code> s’écrit <strong>750</strong> : le propriétaire fait tout, le groupe lit et entre, les autres n’ont rien.</p>
<pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> sudo chown root:ligue-volley /srv/volley     <span class="cm"># propriétaire root, groupe ligue-volley</span>
<span class="pr">etudiant@srv-deb:~$</span> sudo chmod 770 /srv/volley                   <span class="cm"># en octal</span>
<span class="pr">etudiant@srv-deb:~$</span> chmod u+x script.sh                          <span class="cm"># en symbolique : ajoute x au propriétaire</span>
<span class="pr">etudiant@srv-deb:~$</span> chmod go-rwx notes.txt                       <span class="cm"># retire tous les droits au groupe et aux autres</span></pre>
<p>Les nouveaux fichiers reçoivent des droits par défaut fixés par le <strong>masque</strong> (<code>umask</code>, souvent <code>022</code>) : <code>644</code> pour un fichier, <code>755</code> pour un dossier. Root, lui, n’est pas limité par les droits.</p>

<div class="ctab" data-id="c-chmod" data-head="Besoin" data-cols="Droits en octal" data-choices="600|640|644|700|750|755|770" data-label="Traduire des droits en octal">
  <div class="r" data-ok="640" data-expl="rw- (6) pour le propriétaire, r-- (4) pour le groupe, --- (0) pour les autres.">Le fichier <code>bilan.txt</code> : le propriétaire le modifie, les membres du groupe de la ligue le lisent seulement, les autres n’y ont pas accès.</div>
  <div class="r" data-ok="770" data-expl="rwx pour le propriétaire et le groupe : les membres peuvent créer et supprimer des fichiers ; rien pour les autres.">Le dossier partagé de la ligue : le propriétaire et tous les membres du groupe y créent et modifient des fichiers ; les autres ne peuvent même pas y entrer.</div>
  <div class="r" data-ok="600" data-expl="rw- pour le propriétaire seulement : c’est le cas des clés privées SSH (chapitre 6).">Un fichier qui contient une clé privée : seul son propriétaire peut le lire et le modifier.</div>
  <div class="r" data-ok="755" data-expl="rwx pour le propriétaire, r-x pour le groupe et les autres : tout le monde peut entrer et lire, seul le propriétaire modifie. C’est le droit par défaut des dossiers.">Le dossier du site web : seul le propriétaire le modifie, mais tout le monde (dont le serveur web) doit pouvoir y entrer et lire les fichiers.</div>
  <div class="r" data-ok="700" data-expl="rwx pour le propriétaire seulement : un dossier personnel privé.">Le dossier personnel d’un utilisateur, dans lequel personne d’autre ne doit pouvoir entrer.</div>
</div>

<h2>Logiciels, processus et services sous Linux</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Besoin</th><th>Commande</th></tr>
  <tr><td>Mettre à jour la liste des paquets, puis le système</td><td><code>sudo apt update</code>, <code>sudo apt full-upgrade</code></td></tr>
  <tr><td>Chercher, installer, supprimer un logiciel</td><td><code>apt search htop</code>, <code>sudo apt install htop</code>, <code>sudo apt remove htop</code></td></tr>
  <tr><td>Lister les processus</td><td><code>ps aux</code>, <code>top</code> ou <code>htop</code> (en direct, <code>q</code> pour quitter)</td></tr>
  <tr><td>Arrêter un processus</td><td><code>kill</code> suivi du numéro de processus (PID)</td></tr>
  <tr><td>État d’un service</td><td><code>systemctl status ssh</code></td></tr>
  <tr><td>Démarrer, arrêter, redémarrer</td><td><code>sudo systemctl start</code> / <code>stop</code> / <code>restart ssh</code></td></tr>
  <tr><td>Lancer au démarrage ou non</td><td><code>sudo systemctl enable</code> / <code>disable ssh</code></td></tr>
  <tr><td>Éteindre, redémarrer la machine</td><td><code>sudo poweroff</code>, <code>sudo reboot</code></td></tr>
  <tr><td>Réseau</td><td><code>ip a</code>, <code>ip route</code>, <code>ping -c 4 10.0.2.2</code> (chapitre 2)</td></tr>
</table></div>
<p>Un <strong>paquet</strong> est une archive qui contient un logiciel, sa configuration par défaut et la liste de ses <strong>dépendances</strong> (les autres paquets dont il a besoin) ; <code>apt</code> les télécharge depuis les <strong>dépôts</strong> de Debian, des serveurs dont l’authenticité est vérifiée par signature. On n’installe pas de logiciel téléchargé au hasard sur un serveur.</p>

<h2>PowerShell sous Windows</h2>
<p>Windows a deux lignes de commande : l’ancienne invite <code>cmd</code> (commandes héritées de MS-DOS : <code>dir</code>, <code>ipconfig</code>, <code>ping</code>) et <strong>PowerShell</strong>, à privilégier. Ses commandes, les <em>cmdlets</em>, suivent la forme <strong>Verbe-Nom</strong> : <code>Get-Service</code>, <code>Start-Service</code>, <code>New-LocalUser</code>. Elles manipulent des <strong>objets</strong>, avec des propriétés que l’on peut filtrer et trier (chapitre 5). Les commandes de <code>cmd</code> fonctionnent aussi dans PowerShell, et des alias (<code>ls</code>, <code>cd</code>, <code>cat</code>) facilitent la transition. Aide : <code>Get-Help Get-Service -Examples</code> ; trouver une commande : <code>Get-Command *LocalUser*</code>. Contrairement à Linux, les noms de fichiers et de commandes ne tiennent pas compte de la casse.</p>
<pre class="code terminal"><span class="cm"># Comptes et groupes locaux (PowerShell lancé en tant qu’administrateur)</span>
<span class="pr">PS C:\&gt;</span> Get-LocalUser
<span class="pr">PS C:\&gt;</span> New-LocalUser -Name "benevole1" -FullName "Bénévole 1" -Password (Read-Host -AsSecureString "Mot de passe")
<span class="pr">PS C:\&gt;</span> New-LocalGroup -Name "Ligue-Volley"
<span class="pr">PS C:\&gt;</span> Add-LocalGroupMember -Group "Ligue-Volley" -Member "benevole1"
<span class="pr">PS C:\&gt;</span> Get-LocalGroupMember -Group "Administrateurs"
<span class="cm"># Services et processus</span>
<span class="pr">PS C:\&gt;</span> Get-Service | Where-Object Status -eq Running
<span class="pr">PS C:\&gt;</span> Restart-Service -Name Spooler
<span class="pr">PS C:\&gt;</span> Get-Process | Sort-Object CPU -Descending | Select-Object -First 5
<span class="cm"># Réseau</span>
<span class="pr">PS C:\&gt;</span> ipconfig /all ; Get-NetIPAddress -AddressFamily IPv4</pre>

<h3>Les droits NTFS</h3>
<p>NTFS gère des droits plus détaillés que Linux, sous forme de <strong>listes de contrôle d’accès</strong> (ACL) : pour chaque utilisateur ou groupe, on autorise ou on refuse des droits comme <em>Lecture</em>, <em>Lecture et exécution</em>, <em>Modification</em> ou <em>Contrôle total</em>. Les droits d’un dossier sont en principe <strong>hérités</strong> par son contenu. On les gère dans l’onglet <em>Sécurité</em> des propriétés, ou avec <code>icacls</code> :</p>
<pre class="code terminal"><span class="pr">PS C:\&gt;</span> icacls C:\Partages\Volley
<span class="pr">PS C:\&gt;</span> icacls C:\Partages\Volley /grant "Ligue-Volley:(OI)(CI)M"     <span class="cm"># M = modification, hérité par fichiers (OI) et sous-dossiers (CI)</span>
<span class="pr">PS C:\&gt;</span> icacls C:\Partages\Volley /inheritance:r                      <span class="cm"># couper l’héritage et retirer les droits hérités</span></pre>
<p>Couper l’héritage avec <code>/inheritance:r</code> retire aussi les droits des administrateurs s’ils n’étaient qu’hérités : il faut les rajouter explicitement avant. Le chapitre 3 utilise ces droits pour les partages des ligues, et le chapitre 5 les applique à des groupes du domaine.</p>

<div class="match" data-id="m-equivalents" data-label="Trouver l’équivalent Windows" data-options="Get-ChildItem|Get-Content|New-Item -ItemType Directory|Get-Service|New-LocalUser|icacls">
  <div class="r" data-ok="Get-ChildItem" data-expl="Get-ChildItem liste le contenu d’un dossier (alias ls et dir).">Linux : <code>ls -l</code></div>
  <div class="r" data-ok="Get-Content" data-expl="Get-Content affiche le contenu d’un fichier texte (alias cat).">Linux : <code>cat notes.txt</code></div>
  <div class="r" data-ok="New-Item -ItemType Directory" data-expl="New-Item crée des fichiers et, avec ce paramètre, des dossiers (mkdir est aussi accepté).">Linux : <code>mkdir</code></div>
  <div class="r" data-ok="Get-Service" data-expl="Get-Service affiche l’état d’un ou de plusieurs services Windows.">Linux : <code>systemctl status</code></div>
  <div class="r" data-ok="New-LocalUser" data-expl="New-LocalUser crée un compte local ; dans un domaine, ce sera New-ADUser (chapitre 5).">Linux : <code>adduser</code></div>
  <div class="r" data-ok="icacls" data-expl="icacls affiche et modifie les droits NTFS d’un fichier ou d’un dossier.">Linux : <code>chmod</code> et <code>chown</code></div>
</div>

<div class="answer" data-id="a-ls" data-label="Lire une ligne de ls -l" data-min="150" data-rows="7">
  <p>On lit <code>-rw-r--r-- 1 www-data www-data 2048 sept. 15 11:02 index.html</code> et <code>drwxrwx--- 2 root ligue-tennis 4096 sept. 15 11:05 tennis</code>. a) Pour chaque ligne : type, propriétaire, groupe, droits en octal, et ce que peuvent faire les autres utilisateurs. b) L’utilisateur <code>benevole1</code>, membre de <code>ligue-volley</code> seulement, peut-il lire <code>index.html</code> ? créer un fichier dans <code>tennis</code> ? Quelle commande donnerait à <code>benevole1</code> l’accès au dossier <code>tennis</code> sans changer les droits ?</p>
  <div class="corr">
    <p>a) <code>index.html</code> : fichier, propriétaire et groupe <code>www-data</code> (le compte du serveur web), <strong>644</strong> ; les autres peuvent le lire, pas le modifier. <code>tennis</code> : dossier, propriétaire <code>root</code>, groupe <code>ligue-tennis</code>, <strong>770</strong> ; les autres n’ont aucun droit, pas même d’y entrer.</p>
    <p>b) Oui, <code>benevole1</code> peut lire <code>index.html</code> (droit <code>r</code> des autres). Non, il ne peut pas créer de fichier dans <code>tennis</code> : il fait partie des « autres », qui n’ont aucun droit. Pour lui donner accès, on l’ajoute au groupe : <code>sudo adduser benevole1 ligue-tennis</code> (ou <code>sudo usermod -aG ligue-tennis benevole1</code>), puis il ouvre une nouvelle session. On gère les accès par les <strong>groupes</strong>, pas en ouvrant les droits à tout le monde.</p>
  </div>
</div>

<div class="aside pro">
  <p class="aside-title">En entreprise</p>
  <p>Un technicien tient un <strong>cahier de bord</strong> (dans GLPI, un wiki ou un dépôt Git) où il note les commandes passées sur chaque serveur et pourquoi. Les commandes passées avec <code>sudo</code> sont de toute façon journalisées sur le serveur. Avant de taper une commande trouvée sur Internet, on la comprend : <code>man</code>, <code>--help</code>, <code>Get-Help</code> et la documentation officielle sont les premiers réflexes, et ce sera aussi le cas quand vous utiliserez une IA.</p>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p5" data-title="La ligne de commande" data-label="Quiz de fin de partie">
  <div class="q" data-ok="3">
    <p class="qt">Que signifie le <code>#</code> à la fin de l’invite <code>root@srv-deb:/etc#</code> ?</p>
    <ul><li>Un commentaire</li><li>Une erreur</li><li>On travaille en superutilisateur</li><li>Le dossier est vide</li></ul>
    <div class="expl"><code>$</code> pour un utilisateur ordinaire, <code>#</code> pour root : toutes les commandes ont alors tous les droits. On préfère <code>sudo</code> commande par commande.</div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Dans quel dossier se trouvent les fichiers de configuration des services sous Linux ?</p>
    <ul><li><code>/home</code></li><li><code>/etc</code></li><li><code>/tmp</code></li><li><code>/dev</code></li></ul>
    <div class="expl"><code>/etc</code> contient la configuration du système et des services (<code>/etc/ssh/sshd_config</code>, <code>/etc/apache2/</code>…).</div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Que vaut <code>rwxr-x---</code> en octal ?</p>
    <ul><li>755</li><li>644</li><li>770</li><li>750</li></ul>
    <div class="expl">rwx = 7, r-x = 5, --- = 0, soit 750.</div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Que fait <code>sudo apt update</code> ?</p>
    <ul><li>Il met à jour la liste des paquets disponibles, sans rien installer</li><li>Il installe toutes les mises à jour</li><li>Il met à jour le noyau uniquement</li><li>Il redémarre le serveur</li></ul>
    <div class="expl">C’est <code>apt upgrade</code> ou <code>apt full-upgrade</code> qui installe ensuite les nouvelles versions.</div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Sur un dossier Linux, à quoi sert le droit <code>x</code> ?</p>
    <ul><li>À exécuter tous les programmes qu’il contient</li><li>À supprimer le dossier</li><li>À entrer dans le dossier et accéder à son contenu</li><li>Rien : il ne s’applique qu’aux fichiers</li></ul>
    <div class="expl">Sans <code>x</code>, on ne peut pas faire <code>cd</code> dans le dossier ni ouvrir ses fichiers, même si on connaît leur nom.</div>
  </div>
</div>

<h1>Administrer les fichiers, les comptes et les droits</h1>
<p class="lead">Deux ligues de la M2L, le volley et le tennis, vont stocker leurs documents sur les serveurs. Chaque ligue doit avoir un dossier que seuls ses membres peuvent lire et modifier, et toutes les ligues partagent un dossier commun. Vous mettez cette organisation en place en ligne de commande, d’abord sur SRV-DEB, puis sur SRV-WIN, et vous prouvez par des tests qu’elle fonctionne.</p>

<div class="aside caution">
  <p class="aside-title">Consignes</p>

    <li>Noter chaque commande passée et son résultat : ce journal fait partie du rendu. Travail individuel, <strong>sans IA</strong>.</li>
    <li>Les comptes de ce TP (<code>volley1</code>, <code>tennis1</code>) sont des comptes de test avec des mots de passe de maquette.</li>

<h2>Mission 1 : l’arborescence et les comptes sur SRV-DEB</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Dossiers, groupes, utilisateurs</summary>
  <div class="task-body">
    <p>Organisation à mettre en place :</p>
    <div class="tbl-wrap"><table class="data wide">
      <tr><th>Dossier</th><th>Groupe propriétaire</th><th>Qui y a accès</th></tr>
      <tr><td><code>/srv/ligues/volley</code></td><td><code>ligue-volley</code></td><td>les membres de la ligue de volley, en lecture et écriture</td></tr>
      <tr><td><code>/srv/ligues/tennis</code></td><td><code>ligue-tennis</code></td><td>les membres de la ligue de tennis, en lecture et écriture</td></tr>
      <tr><td><code>/srv/ligues/commun</code></td><td><code>ligues</code></td><td>les membres de toutes les ligues, en lecture et écriture</td></tr>
    </table></div>
    <pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> sudo mkdir -p /srv/ligues/volley /srv/ligues/tennis /srv/ligues/commun
<span class="pr">etudiant@srv-deb:~$</span> sudo addgroup ligue-volley
<span class="pr">etudiant@srv-deb:~$</span> sudo addgroup ligue-tennis

    <p>Compléter vous-même pour <code>tennis1</code>, puis vérifier avec <code>id volley1</code>, <code>id tennis1</code> et <code>getent group ligues</code>. Installer l’outil <code>tree</code> (<code>sudo apt install tree</code>) et afficher <code>tree /srv/ligues</code>.</p>
    <div class="answer" data-id="t3-comptes" data-kind="code" data-label="Mission 1 : comptes et groupes" data-min="120" data-rows="8">
      <p>Coller les commandes passées pour <code>tennis1</code> et le résultat de <code>id volley1</code>, <code>id tennis1</code> et <code>getent group ligues</code>. Quel est le groupe principal de <code>volley1</code>, et d’où vient-il ? Retrouver la ligne de <code>volley1</code> dans <code>/etc/passwd</code> et expliquer ses champs.</p>
      <div class="corr">
<pre class="code">sudo adduser tennis1 ligue-tennis
sudo adduser tennis1 ligues
id volley1   -&gt; uid=1001(volley1) gid=1001(volley1) groupes=1001(volley1),100(users),1002(ligue-volley),1004(ligues)
id tennis1   -&gt; uid=1002(tennis1) gid=1002(tennis1) groupes=1002(tennis1),100(users),1003(ligue-tennis),1004(ligues)
getent group ligues -&gt; ligues:x:1004:volley1,tennis1
grep volley1 /etc/passwd -&gt; volley1:x:1001:1001:,,,:/home/volley1:/bin/bash</pre>
        <p>Les numéros peuvent différer. Le groupe principal de <code>volley1</code> est <code>volley1</code> : sous Debian, <code>adduser</code> crée pour chaque utilisateur un groupe personnel du même nom. Champs de <code>/etc/passwd</code> : identifiant, <code>x</code> (le mot de passe est dans <code>/etc/shadow</code>), UID, GID du groupe principal, informations (nom complet…), dossier personnel, shell. Les versions récentes d’<code>adduser</code> ajoutent aussi le groupe <code>users</code>.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 2 : les droits et les tests</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Chaque ligue chez elle</summary>
  <div class="task-body">
    <pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> sudo chown root:ligue-volley /srv/ligues/volley
<span class="pr">etudiant@srv-deb:~$</span> sudo chown root:ligue-tennis /srv/ligues/tennis
<span class="pr">etudiant@srv-deb:~$</span> sudo chown root:ligues /srv/ligues/commun
<span class="pr">etudiant@srv-deb:~$</span> sudo chmod 770 /srv/ligues/volley /srv/ligues/tennis /srv/ligues/commun
<span class="pr">etudiant@srv-deb:~$</span> ls -l /srv/ligues</pre>
    <p>Prévoir le résultat de chaque test <strong>avant</strong> de le faire, puis tester en ouvrant une session au nom de chaque utilisateur (<code>su - volley1</code>, puis <code>exit</code>) :</p>
    <div class="tbl-wrap"><table class="data wide">
      <tr><th class="num">N°</th><th>Utilisateur</th><th>Commande</th></tr>
      <tr><td class="num">1</td><td><code>volley1</code></td><td><code>touch /srv/ligues/volley/planning.txt</code></td></tr>
      <tr><td class="num">2</td><td><code>volley1</code></td><td><code>ls /srv/ligues/tennis</code></td></tr>
      <tr><td class="num">3</td><td><code>tennis1</code></td><td><code>touch /srv/ligues/commun/tournoi.txt</code></td></tr>
      <tr><td class="num">4</td><td><code>volley1</code></td><td><code>echo "Inscription volley" &gt;&gt; /srv/ligues/commun/tournoi.txt</code></td></tr>
      <tr><td class="num">5</td><td><code>etudiant</code></td><td><code>ls /srv/ligues/volley</code>, puis <code>sudo ls /srv/ligues/volley</code></td></tr>
    </table></div>
    <div class="answer" data-id="t3-tests" data-label="Mission 2 : prévisions et résultats des tests" data-min="300" data-rows="12">
      <p>Pour chaque test : prévision, résultat exact, explication. Pour le test 4, regarder <code>ls -l /srv/ligues/commun</code> : quel est le groupe du fichier <code>tournoi.txt</code>, et pourquoi le test échoue-t-il alors que <code>volley1</code> est membre du groupe <code>ligues</code> ?</p>
      <div class="corr">
        <p>1) Réussi : <code>volley1</code> est membre de <code>ligue-volley</code>, qui a <code>rwx</code> sur le dossier.</p>
        <p>2) Échec : <code>ls: impossible d'ouvrir le répertoire '/srv/ligues/tennis': Permission non accordée</code>. Pour ce dossier, <code>volley1</code> fait partie des « autres », qui n’ont aucun droit.</p>
        <p>3) Réussi : <code>tennis1</code> est membre de <code>ligues</code>.</p>
        <p>4) Échec : <code>Permission non accordée</code>. Le fichier <code>tournoi.txt</code> appartient à <code>tennis1</code> et à son <strong>groupe principal</strong> <code>tennis1</code>, pas au groupe <code>ligues</code> : <code>-rw-rw-r-- 1 tennis1 tennis1 … tournoi.txt</code>. Pour ce fichier, <code>volley1</code> fait partie des « autres », qui ont seulement <code>r</code>. Avoir le droit d’écrire dans un dossier (créer, supprimer des fichiers) ne donne pas le droit de modifier les fichiers des autres.</p>
        <p>5) <code>etudiant</code> n’est membre d’aucun groupe de ligue : <code>ls</code> est refusé. Avec <code>sudo</code>, la commande s’exécute en root, qui n’est pas limité par les droits : la liste s’affiche. Les administrateurs peuvent tout lire, d’où les règles de confidentialité de la charte informatique (chapitre 6).</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 3 : corriger le partage du dossier commun</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Le bit setgid</summary>
  <div class="task-body">
    <p>Pour que les fichiers créés dans un dossier partagé appartiennent au groupe du dossier, et non au groupe personnel de leur auteur, on active sur ce dossier le droit spécial <strong>setgid</strong> (valeur 2, placée devant les trois chiffres habituels) :</p>
    <pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> sudo chmod 2770 /srv/ligues/volley /srv/ligues/tennis /srv/ligues/commun
<span class="pr">etudiant@srv-deb:~$</span> ls -ld /srv/ligues/commun
<span class="pr">etudiant@srv-deb:~$</span> sudo chgrp ligues /srv/ligues/commun/tournoi.txt</pre>
    <p>Refaire le test 4, puis faire créer un nouveau fichier <code>reunion.txt</code> par <code>tennis1</code> dans <code>commun</code> et vérifier que <code>volley1</code> peut le modifier.</p>
    <div class="answer" data-id="t3-setgid" data-label="Mission 3 : effet du setgid" data-min="150" data-rows="7">
      <p>a) Comment le setgid apparaît-il dans <code>ls -ld</code> ? b) Quel est le groupe de <code>reunion.txt</code> et quels sont ses droits ? Pourquoi <code>volley1</code> peut-il désormais le modifier ? c) Pourquoi a-t-il fallu corriger <code>tournoi.txt</code> à la main ?</p>
      <div class="corr">
        <p>a) <code>drwxrws---</code> : un <code>s</code> remplace le <code>x</code> du groupe.</p>
        <p>b) <code>-rw-rw-r-- 1 tennis1 ligues … reunion.txt</code> : le fichier hérite du groupe <code>ligues</code> du dossier. Les droits <code>rw-</code> du groupe viennent du masque des utilisateurs sous Debian (<code>umask 0002</code> pour les comptes qui ont un groupe personnel) : tous les membres de <code>ligues</code>, dont <code>volley1</code>, peuvent le modifier.</p>
        <p>c) Le setgid ne s’applique qu’aux fichiers créés <strong>après</strong> son activation ; les fichiers existants gardent leur groupe. On les corrige avec <code>chgrp</code> (ou <code>chgrp -R</code> pour tout un dossier).</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 4 : la même organisation sur SRV-WIN</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Comptes locaux et droits NTFS en PowerShell</summary>
  <div class="task-body">
    <p>Ouvrir PowerShell <strong>en tant qu’administrateur</strong> :</p>
    <pre class="code terminal"><span class="pr">PS C:\&gt;</span> New-Item -ItemType Directory C:\Ligues\Volley, C:\Ligues\Tennis, C:\Ligues\Commun
<span class="pr">PS C:\&gt;</span> "Ligue-Volley", "Ligue-Tennis", "Ligues" | ForEach-Object { New-LocalGroup -Name $_ }
<span class="pr">PS C:\&gt;</span> $mdp = Read-Host -AsSecureString "Mot de passe de maquette"
<span class="pr">PS C:\&gt;</span> New-LocalUser -Name volley1 -Password $mdp
<span class="pr">PS C:\&gt;</span> New-LocalUser -Name tennis1 -Password $mdp
<span class="pr">PS C:\&gt;</span> Add-LocalGroupMember -Group Ligue-Volley -Member volley1
<span class="pr">PS C:\&gt;</span> Add-LocalGroupMember -Group Ligues -Member volley1, tennis1
<span class="pr">PS C:\&gt;</span> Add-LocalGroupMember -Group Ligue-Tennis -Member tennis1
<span class="pr">PS C:\&gt;</span> icacls C:\Ligues\Volley
<span class="cm"># Couper l’héritage et ne garder que les administrateurs, le système et la ligue</span>
<span class="pr">PS C:\&gt;</span> icacls C:\Ligues\Volley /inheritance:r /grant "*S-1-5-32-544:(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" "Ligue-Volley:(OI)(CI)M"
<span class="pr">PS C:\&gt;</span> icacls C:\Ligues\Volley</pre>
    <p><code>*S-1-5-32-544</code> et <code>*S-1-5-18</code> sont les identifiants de sécurité (SID) du groupe <em>Administrateurs</em> et du compte <em>Système</em> : ils sont les mêmes quelle que soit la langue de Windows, contrairement aux noms. <code>F</code> signifie contrôle total, <code>M</code> modification.</p>
    <p>Faire de même pour <code>Tennis</code> (groupe <code>Ligue-Tennis</code>) et <code>Commun</code> (groupe <code>Ligues</code>). Pour tester, ouvrir une invite au nom d’un utilisateur : <code>runas /user:volley1 powershell</code>, puis, dans la nouvelle fenêtre, <code>New-Item C:\Ligues\Volley\planning.txt</code>, <code>Get-ChildItem C:\Ligues\Tennis</code> et <code>Add-Content C:\Ligues\Commun\tournoi.txt "Inscription volley"</code> (après que <code>tennis1</code> l’a créé).</p>
    <div class="answer" data-id="t3-windows" data-label="Mission 4 : droits NTFS et tests" data-min="250" data-rows="10">
      <p>a) Que montrait <code>icacls C:\Ligues\Volley</code> avant la modification, et que signifie <code>(I)</code> ? b) Que montre-t-il après ? c) Résultats des trois tests. d) Le test du fichier commun donne-t-il le même résultat que sous Linux (test 4 de la mission 2) ? Pourquoi ?</p>
      <div class="corr">
        <p>a) Des droits <strong>hérités</strong> de <code>C:\</code>, marqués <code>(I)</code> : notamment <code>BUILTIN\Administrateurs:(I)(OI)(CI)(F)</code>, <code>AUTORITE NT\Système:(I)(OI)(CI)(F)</code>, <code>BUILTIN\Utilisateurs:(I)(OI)(CI)(RX)</code> (tous les utilisateurs peuvent lire !) et <code>CREATEUR PROPRIETAIRE</code>.</p>
        <p>b) Trois entrées seulement, sans <code>(I)</code> : <code>BUILTIN\Administrateurs:(OI)(CI)(F)</code>, <code>AUTORITE NT\Système:(OI)(CI)(F)</code>, <code>SRV-WIN\Ligue-Volley:(OI)(CI)(M)</code>.</p>
        <p>c) <code>volley1</code> crée <code>planning.txt</code> dans <code>Volley</code> ; la liste de <code>Tennis</code> est refusée (<code>Accès refusé</code>) ; l’ajout dans <code>tournoi.txt</code> réussit.</p>
        <p>d) Non : sous Windows, le droit <em>Modification</em> donné au groupe <code>Ligues</code> sur le dossier est hérité par chaque fichier créé dedans (grâce à <code>(OI)</code>), quel que soit son créateur. Sous Linux, les droits d’un fichier dépendent de son propriétaire, de son groupe et du masque de celui qui le crée : il a fallu le setgid. Les deux systèmes protègent les mêmes choses avec des modèles différents ; le technicien doit connaître les deux.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 5 : services et nettoyage</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Observer un service, puis tout documenter</summary>
  <div class="task-body">
    <pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> systemctl status ssh
<span class="pr">etudiant@srv-deb:~$</span> sudo systemctl stop ssh ; systemctl is-active ssh
<span class="pr">etudiant@srv-deb:~$</span> sudo systemctl start ssh ; systemctl is-enabled ssh
<span class="pr">PS C:\&gt;</span> Get-Service -Name Spooler, W32Time | Select-Object Name, Status, StartType</pre>
    <div class="answer" data-id="t3-service" data-label="Mission 5 : services et fiche de configuration" data-min="200" data-rows="9">
      <p>a) Que signifient <code>active (running)</code>, <code>enabled</code> et <code>disabled</code> ? Si l’on avait été connecté en SSH, qu’aurait provoqué <code>systemctl stop ssh</code> ? b) Rédiger la fiche de configuration des dossiers des ligues sur les deux serveurs (dossiers, groupes, membres, droits), telle qu’elle serait remise à un collègue. c) Pourquoi garder les comptes de test une fois le TP terminé est-il une mauvaise pratique, et comment les supprimer proprement sur chaque serveur ?</p>
      <div class="corr">
        <p>a) <code>active (running)</code> : le service tourne en ce moment ; <code>enabled</code> : il démarre automatiquement au démarrage ; <code>disabled</code> : il ne démarre pas automatiquement. Arrêter SSH n’interrompt pas toujours la session en cours, mais empêche toute nouvelle connexion : sur un serveur distant, c’est se priver de son accès d’administration (règle d’or du chapitre 6).</p>
        <p>b) Fiche attendue : tableau dossier / groupe / membres / droits, pour SRV-DEB (<code>/srv/ligues/…</code>, <code>root:groupe</code>, <code>2770</code>) et SRV-WIN (<code>C:\Ligues\…</code>, héritage coupé, Administrateurs et Système en contrôle total, groupe de la ligue en modification), avec la date et l’auteur.</p>
        <p>c) Des comptes inutiles, avec des mots de passe connus, sont des portes d’entrée (chapitre 6). Linux : <code>sudo deluser --remove-home volley1</code>, puis <code>sudo delgroup</code> pour les groupes devenus inutiles. Windows : <code>Remove-LocalUser volley1</code>, <code>Remove-LocalGroup</code>. Ou, dans cette maquette, restaurer l’instantané <code>avant-TP3</code>, à condition de n’avoir rien fait d’autre d’utile depuis. Remarque : un fichier dont le propriétaire a été supprimé affiche ensuite un numéro (UID sous Linux, SID sous Windows) au lieu d’un nom.</p>
      </div>
    </div>
  </div>
</details>

<h2>Défi : le défi des commandes</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Retrouver des informations sans interface graphique</summary>
  <div class="task-body">
    <div class="answer" data-id="t3-defi" data-kind="code" data-label="Défi : commandes de recherche" data-min="150" data-rows="9">
      <p>Sur SRV-DEB, trouver la commande qui : a) affiche le nombre de comptes ayant le shell <code>/bin/bash</code> ; b) liste les fichiers de plus de 10 Mo dans <code>/var</code> ; c) affiche les 3 processus qui utilisent le plus de mémoire ; d) affiche la ligne de <code>/etc/ssh/sshd_config</code> qui contient <code>PermitRootLogin</code>. Puis, sous SRV-WIN, l’équivalent PowerShell de c).</p>
      <div class="corr">
<pre class="code">a) grep -c '/bin/bash$' /etc/passwd
b) sudo find /var -type f -size +10M -exec ls -lh {} \;
c) ps aux --sort=-%mem | head -n 4          (l’en-tête + 3 lignes)
d) grep -i permitrootlogin /etc/ssh/sshd_config
PowerShell : Get-Process | Sort-Object WorkingSet -Descending | Select-Object -First 3 Name, WorkingSet</pre>
        <p>Le tube (<code>|</code>) enchaîne les commandes : la sortie de l’une devient l’entrée de la suivante. C’est la base des scripts du chapitre 5. Dans d), la ligne est en commentaire (<code>#PermitRootLogin prohibit-password</code>) : la valeur par défaut s’applique.</p>
      </div>
    </div>
  </div>
</details>

<h2>Fiche mémo : les notions</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Notion</th><th>À retenir</th></tr>
  <tr><td>Architecture</td><td>Von Neumann : processeur (contrôle, calcul), mémoire (programmes et données), entrées-sorties, bus. Cycle lire, décoder, exécuter.</td></tr>
  <tr><td>Composants</td><td>Carte mère (UEFI), processeur (cœurs, threads, GHz), RAM (volatile), stockage (HDD, SSD SATA ou NVMe), carte graphique, carte réseau (adresse MAC), alimentation (W, 80 PLUS).</td></tr>
  <tr><td>Performances</td><td>Hiérarchie : registres, cache, RAM, SSD, disque dur. Chercher le goulet d’étranglement (mémoire, stockage, processeur, réseau, graphique) avant d’acheter.</td></tr>
  <tr><td>Cycle de vie</td><td>Besoin, achat adapté, inventaire, maintenance, fin de support, fin de vie (effacement sûr, DEEE). La fabrication pèse le plus dans l’empreinte environnementale.</td></tr>
  <tr><td>Numération</td><td>n bits → 2<sup>n</sup> valeurs ; octet = 8 bits (0 à 255). Binaire : poids 128 à 1. Hexadécimal : 1 chiffre = 4 bits (A = 10, F = 15). <code>0xAC</code> = <code>10101100</code> = 172.</td></tr>
  <tr><td>Texte</td><td>ASCII (A = 65), Unicode, UTF-8 (é = C3 A9) ; « LÃ©a » = UTF-8 lu dans un autre codage.</td></tr>
  <tr><td>Unités</td><td>ko = 1 000 o ; Kio = 1 024 o. 1 To = 931 Gio. Débits en bit/s : diviser par 8 (1 Gbit/s = 125 Mo/s).</td></tr>
  <tr><td>Système d’exploitation</td><td>Gère matériel (pilotes), processus, mémoire (virtuelle, échange), fichiers, utilisateurs, interfaces. Noyau et espace utilisateur ; services (démons).</td></tr>
  <tr><td>Démarrage et disques</td><td>UEFI, Secure Boot, chargeur (GRUB, Windows Boot Manager), noyau, services. MBR (4 partitions, 2 Tio) ou GPT. NTFS, ext4, FAT32 (fichiers de 4 Gio au plus), exFAT.</td></tr>
  <tr><td>Licences et support</td><td>Propriétaire (OEM, volume, CAL), libre (GPL, MIT), gratuiciel, évaluation. Fin de support : Windows 10 le 14 octobre 2025 ; Debian 12 en LTS depuis juillet 2026.</td></tr>
  <tr><td>Virtualisation</td><td>Hyperviseur de type 1 (ESXi, Hyper-V, Proxmox) ou 2 (VirtualBox). VT-x / AMD-V. Disque dynamique, instantané (pas une sauvegarde), clone (nouvelles MAC). Modes : NAT, réseau NAT, pont (interdit au lycée), réseau interne, privé hôte.</td></tr>
  <tr><td>Droits Linux</td><td>Propriétaire, groupe, autres ; r = 4, w = 2, x = 1 (x sur un dossier : y entrer). 640, 750, 770… setgid (2770) : les fichiers créés prennent le groupe du dossier. Root n’est pas limité.</td></tr>
  <tr><td>Droits NTFS</td><td>Listes de contrôle d’accès : Lecture, Modification, Contrôle total ; héritage <code>(I)</code>, <code>(OI)(CI)</code> ; couper l’héritage avec prudence.</td></tr>
</table></div>

  /* ---------- bilan ---------- */
  function allItems() {
    var out = [];
    PAGES.forEach(function (p) { (MANIFEST[p.id] || []).forEach(function (it) { out.push({ page: p, it: it, st: state.items[it.key], f: state.firsts[it.key] }); }); });
    return out;
  }
  function itemResult(x) {

      if (!s.self) return { txt: s.revealed ? 'correction vue, non évaluée' : 'rédigée, correction non consultée', level: null };
      var t = SELF[s.self] + (f && f.self && f.self !== s.self ? ' (1re évaluation : ' + SELF[f.self] + ')' : '');
      return { txt: t, level: f && f.self ? f.self : s.self };
    }
    if (!f) return { txt: s ? 'en cours' : 'non commencé', level: null };
    var p = pct(f.score, f.total), lv = it.type === 'quiz' ? (p >= 80 ? 'ok' : p >= 50 ? 'mid' : 'ko') : (p === 100 ? 'ok' : p >= 60 ? 'mid' : 'ko');

  function renderBilan(el) {

      '<div class="stat"><b>' + selfs.ok + ' · ' + selfs.mid + ' · ' + selfs.ko + '</b><span>réponses rédigées : réussi · en partie · à revoir</span></div></div>';

      var q = its.filter(function (x) { return x.it.type === 'quiz' && x.f; }), c = its.filter(function (x) { return x.it.type === 'check' && x.f; });
      var se = { ok: 0, mid: 0, ko: 0 }; its.forEach(function (x) { if (x.it.type === 'answer' && x.st && x.st.self) se[x.st.self]++; });
      var na = its.filter(function (x) { return x.it.type === 'answer'; }).length;

  /* ---------- journal et compte rendu ---------- */
  function labelOf(k) { var p = k && k.split(':')[0]; var it = (MANIFEST[p] || []).filter(function (x) { return x.key === k; })[0]; return it ? (pageById(p).n + ' · ' + it.label) : (k || ''); }

  function buildReport(asHTML) {

      var t = 'COMPTE RENDU — ' + TITLE.toUpperCase() + '\n' + H.who + ' — ' + H.classe + ' — identifiant ' + H.id + '\nTravail commencé le ' + H.created + ' · édité le ' + d + ' · ' + H.saves + ' sauvegarde(s), ' + H.restores + ' restauration(s)\n';
      pages.forEach(function (p) {
        t += '\n==== ' + p.n + ' — ' + p.title + ' ====\n';
        if (!pageStats(p.id).started) { t += '(pas encore commencée)\n'; return; }
        items.filter(function (x) { return x.page.id === p.id; }).forEach(function (x) {
          var r = itemResult(x);
          t += '\n• ' + x.it.label + ' [' + r.txt + ']' + (x.st && x.st.editedAfter ? ' (complétée après la correction)' : '') + '\n';
          if (x.it.type === 'answer' && x.st) { if (x.st.text) t += x.st.text.replace(/^/gm, '    ') + '\n'; if (x.st.tables) t += tablesToText(x.st).replace(/^/gm, '    ') + '\n'; }
        });
      });
      t += '\n==== Journal ====\n' + state.log.map(function (ev) { return fmtDate(ev.t, true) + ' · ' + eventText(ev); }).join('\n') + '\n';
      return t;
    }
    var css = 'body{font:15px/1.5 system-ui,sans-serif;max-width:52rem;margin:2rem auto;padding:0 16px;color:#161d2e}h1{font-size:1.5rem}h2{margin-top:2rem;border-bottom:2px solid #2c48c9;padding-bottom:4px;font-size:1.15rem}.it{border:1px solid #d8ddeb;border-radius:8px;padding:10px 14px;margin:10px 0}.lab{font-weight:700}.res{float:right;font-size:.8rem;padding:2px 8px;border-radius:99px;background:#eef1f8;margin-left:8px}.ok{background:#e3f4e8;color:#17803d}.mid{background:#fbf1d9;color:#9a6200}.ko{background:#fbe6e6;color:#c53030}pre{white-space:pre-wrap;font:13px/1.45 ui-monospace,Consolas,monospace;background:#f6f7fb;padding:8px;border-radius:6px}table{border-collapse:collapse;margin:6px 6px 6px 0;font-size:13px}td,th{border:1px solid #ccd;padding:3px 8px;text-align:left}th{background:#eef1f8}.tables{display:flex;flex-wrap:wrap;gap:8px}u{text-decoration-thickness:2px}.tbl-name{font-weight:700;margin:4px 0 0;font-size:12px}.note{color:#9a6200;font-size:.8rem}.id{font-family:ui-monospace,Consolas,monospace;font-weight:700}.log{font-size:13px}.log td:first-child{white-space:nowrap;color:#556079}.null{color:#556079;font-style:italic}';
    var out = '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Compte rendu — ' + esc(H.who) + '</title><style>' + css + '</style></head><body><h1>Compte rendu — ' + esc(TITLE) + '</h1><p><strong>' + esc(H.who) + '</strong> — ' + esc(H.classe) + ' — identifiant <span class="id">' + esc(H.id) + '</span><br>Travail commencé le ' + H.created + ' · édité le ' + d + ' · ' + H.saves + ' sauvegarde(s) dans un fichier, ' + H.restores + ' restauration(s)</p>';
    pages.forEach(function (p) {
      out += '<h2>' + p.n + ' — ' + esc(p.title) + '</h2>';
      if (!pageStats(p.id).started) { out += '<p class="null">Pas encore commencée.</p>'; return; }
      items.filter(function (x) { return x.page.id === p.id; }).forEach(function (x) {
        var r = itemResult(x);
        out += '<div class="it"><span class="res ' + (r.level || '') + '">' + esc(r.txt) + '</span><div class="lab">' + esc(x.it.label) + '</div>';
        if (x.st && x.st.editedAfter) out += '<div class="note">Réponse complétée après la consultation de la correction.</div>';
        if (x.it.type === 'answer' && x.st) { if (x.st.text) out += '<pre>' + esc(x.st.text) + '</pre>'; if (x.st.tables) out += tablesToHTML(x.st); }
        out += '</div>';
      });
    });
    out += '<h2>Journal</h2><table class="log">' + state.log.map(function (ev) { return '<tr><td>' + fmtDate(ev.t, true) + '</td><td>' + esc(eventText(ev)) + '</td></tr>'; }).join('') + '</table>';
    return out + '</body></html>';
  }
  function renderExport(el) {
    el.innerHTML = '<div class="row"><button type="button" class="btn primary" data-dlrep>Télécharger le compte rendu (.html)</button><button type="button" class="btn" data-copyrep>Copier le compte rendu (texte)</button><button type="button" class="btn ghost" data-showrep>Afficher</button></div><p class="note-line">Le compte rendu contient les réponses, les résultats des premières tentatives et le journal horodaté (tentatives, corrections consultées, sauvegardes, restaurations).</p><textarea id="rep-area" rows="12" readonly hidden style="width:100%;font:.8rem/1.45 var(--f-mono);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)"></textarea>';
    var area = $('#rep-area', el);
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-copyrep')) copyText(buildReport(false), b, area);
      if (b.hasAttribute('data-dlrep')) download('compte-rendu-' + (CONFIG.fileSlug || 'cours') + '-' + slug(fullName()) + '.html', buildReport(true), 'text/html');
      if (b.hasAttribute('data-showrep')) { area.hidden = !area.hidden; area.value = buildReport(false); b.textContent = area.hidden ? 'Afficher' : 'Masquer'; }
    });
  }
  function renderBackup(el) {
    el.innerHTML = '<div class="row"><button type="button" class="btn primary" data-dlbk>Sauvegarder dans un fichier</button><label class="btn" for="bk-file">Ouvrir un fichier de sauvegarde</label><input type="file" id="bk-file" accept=".json,application/json" class="sr-only"></div><div data-bkmsg></div>' +
      '<hr><div class="row"><button type="button" class="btn ghost" data-reset>Effacer mes réponses en cours…</button><span class="confirm" data-confirm hidden>Effacer les réponses de ce navigateur ? Les résultats des premières tentatives et le journal sont conservés. <button type="button" class="btn small" data-reset-yes style="border-color:var(--ko);color:var(--ko)">Oui, effacer</button><button type="button" class="btn small" data-reset-no>Annuler</button></span></div>';
    fileInput($('#bk-file', el), $('[data-bkmsg]', el));
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-dlbk')) fileSave();
      if (b.hasAttribute('data-reset')) $('[data-confirm]', el).hidden = false;
      if (b.hasAttribute('data-reset-no')) $('[data-confirm]', el).hidden = true;
      if (b.hasAttribute('data-reset-yes')) { state.items = {}; logEvent('reset'); saveNow(); render(PAGE); }
    });
  }

  /* ---------- démarrage ---------- */
  function start() {
    load(); buildShell(); buildManifest();
    var t = location.hash.slice(1);
    render(pageById(t) ? t : 'accueil');
    window.__support = { state: function () { return state; } }; // utile pour les tests
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
</body>
</html>
