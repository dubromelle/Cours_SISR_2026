<template data-page="tp13">
<h1>Créer le domaine m2l.lan et y joindre un poste</h1>
<p class="lead">Le service informatique de la M2L centralise les comptes : SRV-WIN devient le contrôleur du domaine <code>m2l.lan</code>. Il faut préparer le serveur, le promouvoir, construire l’arborescence de l’annuaire, faire rejoindre le domaine à un poste, puis appliquer une première stratégie de groupe et une politique de mots de passe. Pour finir, on dépanne les erreurs les plus fréquentes.</p>

<div class="aside caution">
  <p class="aside-title">Consignes</p>
  <ul>
    <li>Machines virtuelles : <strong>SRV-WIN</strong> (Windows Server 2019, <code>192.168.50.20</code>, DNS et DHCP des TP 8 à 12) et <strong>PC-CLIENT</strong> (Windows 10 ou 11, édition <strong>Professionnel ou Éducation</strong>), toutes deux sur le réseau interne <code>tp5</code>. PC-CLIENT obtient son adresse par le DHCP de SRV-WIN.</li>
    <li><strong>Instantané <code>avant-TP13</code> obligatoire</strong> pour SRV-WIN et PC-CLIENT : la promotion d’un contrôleur de domaine ne s’annule pas simplement.</li>
    <li>Travail individuel, <strong>sans IA</strong>. Pour chaque commande PowerShell, savoir dire ce qu’elle fait.</li>
  </ul>
</div>

<h2>Mission 1 : préparer et promouvoir le contrôleur de domaine</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>De serveur membre d’un groupe de travail à contrôleur de domaine</summary>
  <div class="task-body">
    <p>Au chapitre 3, SRV-WIN héberge une zone DNS <code>m2l.lan</code> classique (non intégrée à Active Directory). La promotion va créer une zone <code>m2l.lan</code> intégrée à l’annuaire : on sauvegarde donc la liste des enregistrements, puis on supprime l’ancienne zone.</p>
    <pre class="code terminal"><span class="cm"># 1. Garder une trace des enregistrements, puis supprimer l’ancienne zone</span>
<span class="pr">PS C:\&gt;</span> Get-DnsServerResourceRecord -ZoneName "m2l.lan" | Format-Table HostName, RecordType, RecordData -AutoSize | Out-File C:\enregistrements-m2l.txt
<span class="pr">PS C:\&gt;</span> Remove-DnsServerZone -Name "m2l.lan" -Force
<span class="cm"># 2. Installer le rôle Services de domaine Active Directory</span>
<span class="pr">PS C:\&gt;</span> Install-WindowsFeature AD-Domain-Services -IncludeManagementTools
<span class="cm"># 3. Créer la forêt et le domaine (le serveur redémarre à la fin)</span>
<span class="pr">PS C:\&gt;</span> Install-ADDSForest -DomainName "m2l.lan" -DomainNetbiosName "M2L" -InstallDns -SafeModeAdministratorPassword (Read-Host -AsSecureString "Mot de passe de restauration (DSRM)")</pre>
    <p>Méthode graphique équivalente : <em>Gestionnaire de serveur &gt; Ajouter des rôles et fonctionnalités &gt; Services AD DS</em>, puis le drapeau jaune <em>Promouvoir ce serveur en contrôleur de domaine &gt; Ajouter une nouvelle forêt</em>.</p>
    <p>Après le redémarrage, se connecter en <code>M2L\Administrateur</code>, puis :</p>
    <pre class="code terminal"><span class="pr">PS C:\&gt;</span> Get-ADDomain | Select-Object DNSRoot, NetBIOSName, DomainMode
<span class="pr">PS C:\&gt;</span> Get-DnsServerZone
<span class="pr">PS C:\&gt;</span> Resolve-DnsName -Type SRV _ldap._tcp.dc._msdcs.m2l.lan
<span class="cm"># Le serveur DHCP doit être autorisé dans l’annuaire pour distribuer des adresses</span>
<span class="pr">PS C:\&gt;</span> Add-DhcpServerInDC -DnsName "SRV-WIN.m2l.lan" -IPAddress 192.168.50.20
<span class="pr">PS C:\&gt;</span> Get-LocalUser</pre>
    <div class="answer" data-id="t13-promo" data-label="Mission 1 : ce que la promotion a changé" data-min="200" data-rows="9">
      <p>Relever et expliquer : a) le nom DNS, le nom NetBIOS et le niveau fonctionnel du domaine ; b) les zones DNS présentes et le résultat de la requête SRV ; c) ce qu’affiche <code>Get-LocalUser</code>, et ce que sont devenus les comptes <code>volley.tresorier</code> et <code>tennis.secretaire</code> du TP 9, ainsi que les droits du partage <code>Volley</code> ; d) pourquoi il faut autoriser le serveur DHCP.</p>
      <div class="corr">
        <p>a) <code>m2l.lan</code>, <code>M2L</code>, niveau Windows Server 2016 (le plus élevé proposé par Windows Server 2019).</p>
        <p>b) Les zones <code>m2l.lan</code> et <code>_msdcs.m2l.lan</code>, intégrées à Active Directory (et la zone inverse du chapitre 3). La requête SRV renvoie <code>srv-win.m2l.lan</code> sur le port 389 : c’est ainsi que les postes trouveront le contrôleur.</p>
        <p>c) Sur un contrôleur de domaine, il n’y a plus de base de comptes locaux : <code>Get-LocalUser</code> échoue ou n’affiche rien d’utile. Les comptes et le groupe local créés au TP 9 ont disparu. Le partage <code>Volley</code> existe toujours, mais ses autorisations désignent des identifiants de sécurité (SID) devenus inconnus, affichés comme des suites de chiffres : il faudra les remplacer par des groupes du domaine (TP 14). C’est l’intérêt d’avoir documenté la configuration du TP 9.</p>
        <p>d) Dans un domaine, un serveur DHCP Windows ne distribue des adresses que s’il est autorisé dans l’annuaire : cela empêche un serveur installé par erreur de perturber le réseau (chapitre 3, partie 2).</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 2 : construire l’annuaire</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Unités d’organisation, utilisateurs, groupe, enregistrements DNS</summary>
  <div class="task-body">
    <pre class="code terminal"><span class="cm"># Arborescence de la M2L</span>
<span class="pr">PS C:\&gt;</span> New-ADOrganizationalUnit -Name "M2L" -Path "DC=m2l,DC=lan"
<span class="pr">PS C:\&gt;</span> "Administration","Ligues","Ordinateurs","Groupes" | ForEach-Object { New-ADOrganizationalUnit -Name $_ -Path "OU=M2L,DC=m2l,DC=lan" }
<span class="pr">PS C:\&gt;</span> New-ADOrganizationalUnit -Name "Volley" -Path "OU=Ligues,OU=M2L,DC=m2l,DC=lan"
<span class="cm"># Le groupe global de la ligue et un premier compte</span>
<span class="pr">PS C:\&gt;</span> New-ADGroup -Name "GG_Volley" -GroupScope Global -GroupCategory Security -Path "OU=Volley,OU=Ligues,OU=M2L,DC=m2l,DC=lan"
<span class="pr">PS C:\&gt;</span> New-ADUser -Name "Léa Martin" -GivenName "Léa" -Surname "Martin" -SamAccountName "lea.martin" -UserPrincipalName "lea.martin@m2l.lan" -Title "Présidente" -Path "OU=Volley,OU=Ligues,OU=M2L,DC=m2l,DC=lan" -AccountPassword (Read-Host -AsSecureString "Mot de passe provisoire") -ChangePasswordAtLogon $true -Enabled $true
<span class="pr">PS C:\&gt;</span> Add-ADGroupMember -Identity "GG_Volley" -Members "lea.martin"
<span class="cm"># Recréer les enregistrements DNS des serveurs (adresse de SRV-DEB : celle de la DMZ du TP 12, ou 192.168.50.10)</span>
<span class="pr">PS C:\&gt;</span> Add-DnsServerResourceRecordA -ZoneName "m2l.lan" -Name "srv-deb" -IPv4Address 172.16.2.241
<span class="pr">PS C:\&gt;</span> Add-DnsServerResourceRecordCName -ZoneName "m2l.lan" -Name "www" -HostNameAlias "srv-deb.m2l.lan"
<span class="pr">PS C:\&gt;</span> Add-DnsServerResourceRecordCName -ZoneName "m2l.lan" -Name "intranet" -HostNameAlias "srv-deb.m2l.lan"</pre>
    <p>Créer ensuite <strong>avec la console graphique</strong> <em>Utilisateurs et ordinateurs Active Directory</em> (<code>dsa.msc</code>) le compte du directeur, Paul Garnier (<code>paul.garnier</code>), dans l’OU <code>Administration</code>, puis son compte d’administration <code>adm.paul.garnier</code>, membre du groupe <em>Admins du domaine</em>.</p>
    <div class="answer" data-id="t13-annuaire" data-kind="code" data-label="Mission 2 : vérifier l’annuaire en PowerShell" data-min="120" data-rows="8">
      <p>Écrire les commandes PowerShell qui affichent : a) toutes les OU sous <code>OU=M2L</code> ; b) les utilisateurs de l’OU <code>Volley</code> avec leur fonction ; c) les membres du groupe <code>GG_Volley</code> ; d) les groupes dont <code>adm.paul.garnier</code> est membre. Les tester.</p>
      <div class="corr">
        <pre class="code">a) Get-ADOrganizationalUnit -Filter * -SearchBase "OU=M2L,DC=m2l,DC=lan" | Select-Object Name, DistinguishedName
b) Get-ADUser -Filter * -SearchBase "OU=Volley,OU=Ligues,OU=M2L,DC=m2l,DC=lan" -Properties Title | Select-Object Name, SamAccountName, Title
c) Get-ADGroupMember -Identity "GG_Volley"
d) Get-ADPrincipalGroupMembership -Identity "adm.paul.garnier" | Select-Object Name</pre>
        <p><code>-Properties Title</code> est nécessaire : par défaut, <code>Get-ADUser</code> ne renvoie qu’une partie des attributs.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 3 : joindre PC-CLIENT au domaine</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Vérifier le DNS, joindre, ranger, se connecter</summary>
  <div class="task-body">
    <ol class="steps">
      <li>Sur PC-CLIENT : <code>ipconfig /all</code>. Vérifier l’adresse (reçue du DHCP), le serveur DNS (<code>192.168.50.20</code>) et le suffixe (<code>m2l.lan</code>). Tester <code>nslookup m2l.lan</code>.</li>
      <li>Joindre le domaine, en PowerShell administrateur : <code>Add-Computer -DomainName m2l.lan -Credential M2L\Administrateur -Restart</code> (ou <em>Paramètres &gt; Système &gt; Informations système &gt; Domaine ou groupe de travail &gt; Modifier</em>).</li>
      <li>Sur SRV-WIN, ranger l’ordinateur : <code>Get-ADComputer PC-CLIENT | Move-ADObject -TargetPath "OU=Ordinateurs,OU=M2L,DC=m2l,DC=lan"</code>.</li>
      <li>Sur PC-CLIENT, ouvrir une session avec <code>lea.martin@m2l.lan</code> (changement de mot de passe demandé), puis taper <code>whoami</code>, <code>echo %LOGONSERVER%</code> et <code>nltest /dsgetdc:m2l.lan</code>.</li>
    </ol>
    <div class="answer" data-id="t13-jonction" data-label="Mission 3 : jonction au domaine et ouverture de session" data-min="150" data-rows="7">
      <p>a) Pourquoi vérifier le serveur DNS du poste avant de joindre le domaine ? b) Où l’objet ordinateur a-t-il été créé, et pourquoi le déplacer ? c) Que montrent <code>whoami</code> et <code>%LOGONSERVER%</code> ? d) Couper SRV-WIN, puis fermer et rouvrir la session de Léa Martin sur PC-CLIENT : que se passe-t-il, et pourquoi ?</p>
      <div class="corr">
        <p>a) Le poste trouve le contrôleur de domaine par une requête DNS SRV : avec un autre serveur DNS, il ne le trouve pas et la jonction échoue (« Impossible de contacter un contrôleur de domaine Active Directory pour le domaine m2l.lan »).</p>
        <p>b) Dans le conteneur par défaut <code>Computers</code>, où aucune stratégie de groupe ne peut être liée ; on le déplace dans l’OU <code>Ordinateurs</code> pour pouvoir lui appliquer des stratégies d’ordinateur.</p>
        <p>c) <code>m2l\lea.martin</code> : le compte du domaine, et non un compte local ; <code>\\SRV-WIN</code> : le contrôleur qui a authentifié la session.</p>
        <p>d) La session s’ouvre quand même : Windows garde en cache les informations d’identification des dernières sessions pour permettre de travailler hors du réseau. Un nouvel utilisateur, jamais connecté sur ce poste, ne pourrait pas ouvrir de session. Les ressources du domaine (partages, stratégies) sont en revanche inaccessibles : d’où l’importance d’un second contrôleur de domaine.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 4 : stratégie de groupe et politique de mots de passe</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Restreindre les postes des ligues, verrouiller les comptes</summary>
  <div class="task-body">
    <pre class="code terminal"><span class="cm"># Une GPO liée à l’OU Ligues : pas d’accès au Panneau de configuration ni aux Paramètres</span>
<span class="pr">PS C:\&gt;</span> New-GPO -Name "GPO-Ligues-Restrictions" | New-GPLink -Target "OU=Ligues,OU=M2L,DC=m2l,DC=lan"
<span class="pr">PS C:\&gt;</span> Set-GPRegistryValue -Name "GPO-Ligues-Restrictions" -Key "HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer" -ValueName "NoControlPanel" -Type DWord -Value 1
<span class="cm"># Politique de mots de passe du domaine</span>
<span class="pr">PS C:\&gt;</span> Set-ADDefaultDomainPasswordPolicy -Identity "m2l.lan" -MinPasswordLength 12 -LockoutThreshold 5 -LockoutDuration 00:15:00 -LockoutObservationWindow 00:15:00
<span class="pr">PS C:\&gt;</span> Get-ADDefaultDomainPasswordPolicy</pre>
    <p>Méthode graphique : console <em>Gestion des stratégies de groupe</em> (<code>gpmc.msc</code>), clic droit sur l’OU <code>Ligues</code> &gt; <em>Créer un objet GPO dans ce domaine, et le lier ici</em> ; dans l’éditeur : <em>Configuration utilisateur &gt; Stratégies &gt; Modèles d’administration &gt; Panneau de configuration &gt; Interdire l’accès au Panneau de configuration et à l’application Paramètres du PC</em>.</p>
    <div class="answer" data-id="t13-gpo" data-label="Mission 4 : tests de la GPO et du verrouillage" data-min="200" data-rows="9">
      <p>a) Sur PC-CLIENT, session de Léa Martin : <code>gpupdate /force</code>, fermer et rouvrir la session, puis tenter d’ouvrir le Panneau de configuration. Relever le message et le résultat de <code>gpresult /r</code> (partie utilisateur). b) Se connecter avec <code>paul.garnier</code> : la restriction s’applique-t-elle ? Pourquoi ? c) Saisir 5 fois un mauvais mot de passe pour <code>lea.martin</code>. Que se passe-t-il ? Quelles commandes, sur SRV-WIN, permettent de trouver et de débloquer le compte ?</p>
      <div class="corr">
        <p>a) Message : « Cette opération a été annulée en raison de restrictions en vigueur sur cet ordinateur ». <code>gpresult /r</code> liste <code>GPO-Ligues-Restrictions</code> dans les objets de stratégie appliqués à l’utilisateur.</p>
        <p>b) Non : le compte de Paul Garnier est dans l’OU <code>Administration</code>, à laquelle la GPO n’est pas liée. Une stratégie s’applique selon l’emplacement du compte (pour la configuration utilisateur) ou de l’ordinateur (pour la configuration ordinateur), pas selon le poste utilisé.</p>
        <p>c) Au 5<sup>e</sup> échec, le compte est verrouillé pendant 15 minutes (« Le compte référencé est actuellement verrouillé »). Sur SRV-WIN : <code>Search-ADAccount -LockedOut</code> pour le trouver, <code>Unlock-ADAccount -Identity lea.martin</code> pour le débloquer. Le verrouillage protège contre les attaques qui essaient de nombreux mots de passe ; le contrôleur enregistre l’événement 4740 dans le journal Sécurité (partie 3).</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 5 : dépanner le domaine</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Trois messages d’erreur à connaître</summary>
  <div class="task-body">
    <div class="tbl-wrap"><table class="data wide">
      <tr><th>Ticket</th><th>Message ou symptôme</th></tr>
      <tr><td>T1</td><td>À la jonction d’un nouveau poste : « Impossible de contacter un contrôleur de domaine Active Directory (AD DC) pour le domaine m2l.lan ». Le poste a pour serveur DNS <code>192.168.50.62</code> (pfSense).</td></tr>
      <tr><td>T2</td><td>Après la restauration d’un ancien instantané de PC-CLIENT, à l’ouverture de session : « La relation d’approbation entre cette station de travail et le domaine principal a échoué ».</td></tr>
      <tr><td>T3</td><td>Un poste dont l’horloge a 20 minutes d’avance ne peut plus ouvrir de session de domaine, alors que le réseau fonctionne.</td></tr>
    </table></div>
    <div class="answer" data-id="t13-pannes" data-label="Mission 5 : diagnostic des pannes du domaine" data-min="200" data-rows="8">
      <p>Pour chaque ticket : cause et correction.</p>
      <div class="corr">
        <p><strong>T1</strong> : le poste interroge pfSense, qui ne connaît pas les enregistrements SRV du domaine. Corriger le serveur DNS du poste (ou l’option 006 du DHCP) pour qu’il pointe vers le contrôleur <code>192.168.50.20</code>. Règle : dans un domaine, les postes n’utilisent que les serveurs DNS du domaine, qui eux-mêmes redirigent vers l’extérieur.</p>
        <p><strong>T2</strong> : l’ordinateur a un mot de passe de compte machine, renouvelé automatiquement avec le contrôleur (tous les 30 jours par défaut). L’ancien instantané contient un ancien mot de passe, que le domaine ne reconnaît plus. Correction : se connecter avec un compte local administrateur et réparer le lien (<code>Test-ComputerSecureChannel -Repair -Credential M2L\Administrateur</code>), ou retirer le poste du domaine et le joindre à nouveau. À retenir : restaurer un instantané d’un poste ou d’un serveur membre d’un domaine a des conséquences.</p>
        <p><strong>T3</strong> : Kerberos refuse les écarts d’heure de plus de 5 minutes. Les postes du domaine doivent se synchroniser sur le contrôleur (<code>w32tm /resync</code>), lui-même synchronisé sur une source NTP fiable.</p>
      </div>
    </div>
  </div>
</details>

<h2>Défi : faut-il joindre le serveur web au domaine ?</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Un choix d’architecture à justifier</summary>
  <div class="task-body">
    <div class="answer" data-id="t13-defi" data-label="Défi : joindre ou non un serveur de la DMZ au domaine" data-min="150" data-rows="7">
      <p>Un collègue propose de joindre SRV-DEB (le serveur web, dans la DMZ du TP 12) au domaine <code>m2l.lan</code>, pour que les administrateurs s’y connectent avec leur compte du domaine. Quels flux faudrait-il ouvrir dans le pare-feu ? Est-ce une bonne idée ? Proposer une alternative.</p>
      <div class="corr">
        <p>Il faudrait autoriser la DMZ à joindre le contrôleur de domaine dans le LAN : DNS (53), Kerberos (88), LDAP (389), SMB (445), NTP (123), RPC… C’est contraire à la règle « aucun flux de la DMZ vers le LAN » (chapitre 4) : un serveur web compromis offrirait alors un chemin direct vers le cœur de la sécurité du réseau, l’annuaire.</p>
        <p>Alternatives : laisser le serveur hors domaine, avec des comptes locaux et une authentification SSH par clés réservée aux postes d’administration ; ou, dans une grande organisation, un annuaire séparé pour la DMZ ou un contrôleur en lecture seule. Ce type de raisonnement (« quel flux crée ce choix ? ») est attendu dans un dossier de choix.</p>
      </div>
    </div>
  </div>
</details>

  <p class="aside-title">La suite</p>
  <p>Créer 300 comptes un par un serait long et source d’erreurs. La <a href="#p2">partie 2</a> présente les scripts Bash et PowerShell qui automatisent ce travail.</p>
</div>

<template data-page="p2">
<h1>Les scripts d’administration : Bash et PowerShell</h1>
<p class="lead">Un administrateur répète souvent les mêmes gestes : créer des comptes, vérifier l’espace disque, archiver des journaux. Un script est un fichier texte qui enchaîne des commandes, avec des variables, des conditions et des boucles. Vous connaissez déjà ces notions en C# : on les retrouve ici dans deux langages de script, Bash pour Linux et PowerShell pour Windows.</p>

<div class="aside caution">
  <p class="aside-title">Règle du cours</p>
  <p>Pas d’IA pour écrire ou corriger les scripts de ce chapitre. Un script d’administration s’exécute avec des droits élevés : vous devez comprendre chaque ligne avant de la lancer.</p>
</div>

<h2>Pourquoi écrire des scripts ?</h2>
<ul>
  <li><strong>Gagner du temps</strong> : créer 300 comptes prend quelques secondes au lieu d’une journée.</li>
  <li><strong>Éviter les erreurs</strong> : le script applique toujours la même règle (format de l’identifiant, groupe, mot de passe provisoire).</li>
  <li><strong>Documenter</strong> : le script décrit exactement ce qui a été fait, et peut être relu, versionné dans Git et rejoué.</li>
  <li><strong>Planifier</strong> : un script peut être lancé automatiquement chaque nuit (<code>cron</code> sous Linux, Planificateur de tâches sous Windows).</li>
</ul>

<div class="tbl-wrap"><table class="data wide">
  <tr><th>Notion</th><th>Bash (Linux)</th><th>PowerShell (Windows)</th><th>C# (rappel)</th></tr>
  <tr><td>Extension, exécution</td><td><code>.sh</code>, première ligne <code>#!/bin/bash</code>, puis <code>chmod +x script.sh</code> et <code>./script.sh</code></td><td><code>.ps1</code>, lancé par <code>.\script.ps1</code></td><td>programme compilé</td></tr>
  <tr><td>Variable</td><td><code>nom="Martin"</code> (sans espaces autour de <code>=</code>), lue avec <code>$nom</code></td><td><code>$nom = "Martin"</code></td><td><code>string nom = "Martin";</code></td></tr>
  <tr><td>Résultat d’une commande</td><td><code>jour=$(date +%A)</code></td><td><code>$jour = (Get-Date).DayOfWeek</code></td><td>valeur de retour d’une méthode</td></tr>
  <tr><td>Paramètres du script</td><td><code>$1</code>, <code>$2</code>… ; <code>$#</code> = nombre</td><td>bloc <code>param(...)</code></td><td><code>args[0]</code></td></tr>
  <tr><td>Comparaison de nombres</td><td><code>-eq -ne -lt -le -gt -ge</code></td><td><code>-eq -ne -lt -le -gt -ge</code></td><td><code>== != &lt; &lt;= &gt; &gt;=</code></td></tr>
  <tr><td>Commentaire</td><td><code># ...</code></td><td><code># ...</code></td><td><code>// ...</code></td></tr>
</table></div>

<p>Point commun aux deux langages : <strong>les opérateurs de comparaison s’écrivent avec des lettres</strong>. Le signe <code>&gt;</code> sert à rediriger la sortie vers un fichier : <code>if [ $a &gt; 5 ]</code> en Bash ne compare rien, il crée un fichier nommé <code>5</code> !</p>

<h2>Bash : les bases</h2>
<h3>Variables, guillemets et paramètres</h3>
<pre class="code"><span class="cm">#!/bin/bash</span>
<span class="cm"># bonjour.sh : affiche un message pour la ligue passée en paramètre</span>
ligue=<span class="st">"$1"</span>
jour=$(date +%d/%m/%Y)
echo <span class="st">"Bonjour la ligue de $ligue, nous sommes le $jour"</span>
echo <span class="st">'Avec des apostrophes, $ligue reste écrit tel quel'</span></pre>
<pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> chmod +x bonjour.sh
<span class="pr">etudiant@srv-deb:~$</span> ./bonjour.sh Volley
Bonjour la ligue de Volley, nous sommes le 10/03/2027
Avec des apostrophes, $ligue reste écrit tel quel</pre>
<p>Entre guillemets doubles, les variables sont remplacées par leur valeur ; entre apostrophes, rien n’est remplacé. On met <strong>toujours</strong> les variables entre guillemets doubles (<code>"$ligue"</code>) : sans eux, une valeur contenant une espace (« Le Gall ») serait coupée en deux mots.</p>

<h3>Conditions</h3>
<pre class="code"><span class="kw">if</span> [ <span class="st">"$#"</span> -ne 1 ]; <span class="kw">then</span>
    echo <span class="st">"Usage : $0 nom_de_ligue"</span> &gt;&amp;2
    <span class="kw">exit</span> 1
<span class="kw">fi</span>

<span class="kw">if</span> [ -f /etc/ssh/sshd_config ]; <span class="kw">then</span>
    echo <span class="st">"Le serveur SSH est installé"</span>
<span class="kw">elif</span> [ -d /etc/ssh ]; <span class="kw">then</span>
    echo <span class="st">"Seul le client SSH est installé"</span>
<span class="kw">else</span>
    echo <span class="st">"Pas de SSH"</span>
<span class="kw">fi</span></pre>
<div class="tbl-wrap"><table class="data">
  <tr><th>Test</th><th>Vrai si…</th></tr>
  <tr><td><code>[ -f fichier ]</code></td><td>le fichier existe</td></tr>
  <tr><td><code>[ -d dossier ]</code></td><td>le dossier existe</td></tr>
  <tr><td><code>[ -z "$v" ]</code></td><td>la variable est vide</td></tr>
  <tr><td><code>[ "$a" = "$b" ]</code></td><td>les deux textes sont égaux (<code>!=</code> : différents)</td></tr>
  <tr><td><code>[ "$n" -gt 80 ]</code></td><td>le nombre est strictement supérieur à 80</td></tr>
  <tr><td><code>[ ! -f fichier ]</code></td><td>le fichier n’existe pas (<code>!</code> = négation)</td></tr>
</table></div>
<p>Les espaces à l’intérieur des crochets sont obligatoires : <code>[ -f fichier ]</code>, jamais <code>[-f fichier]</code>.</p>

<h3>Boucles</h3>
<pre class="code"><span class="cm"># Boucle sur une liste</span>
<span class="kw">for</span> ligue <span class="kw">in</span> Volley Tennis Basket; <span class="kw">do</span>
    mkdir -p <span class="st">"/srv/partages/$ligue"</span>
<span class="kw">done</span>

<span class="cm"># Boucle sur les lignes d’un fichier (séparateur « ; »)</span>
<span class="kw">while</span> IFS=<span class="st">';'</span> read -r prenom nom ligue fonction; <span class="kw">do</span>
    echo <span class="st">"$prenom $nom est $fonction de la ligue $ligue"</span>
<span class="kw">done</span> &lt; &lt;(tail -n +2 membres-ligues.csv)</pre>
<p><code>IFS=';'</code> indique le séparateur de champs, <code>read -r</code> range chaque champ dans une variable, et <code>tail -n +2</code> envoie le fichier à partir de la ligne 2, donc sans la ligne d’en-têtes.</p>

<h3>Fonctions et code de retour</h3>
<pre class="code"><span class="kw">verifier_service</span>() {
    <span class="kw">if</span> systemctl is-active --quiet <span class="st">"$1"</span>; <span class="kw">then</span>
        echo <span class="st">"OK      $1"</span>
    <span class="kw">else</span>
        echo <span class="st">"ARRÊTÉ  $1"</span>
        <span class="kw">return</span> 1
    <span class="kw">fi</span>
}
verifier_service ssh
verifier_service apache2
echo <span class="st">"Code de retour de la dernière commande : $?"</span></pre>
<p>Chaque commande renvoie un <strong>code de retour</strong> : 0 si tout s’est bien passé, une autre valeur en cas d’erreur. On le lit dans <code>$?</code>. Un script bien écrit se termine par <code>exit 0</code> en cas de succès et par un code différent (1, 2…) en cas d’erreur, afin qu’un autre programme (une tâche planifiée, un outil de supervision) puisse savoir s’il a réussi.</p>

<div class="aside deep">
  <p class="aside-title">En profondeur : les trois flux</p>
  <p>Un programme a une entrée standard (le clavier, ou un fichier avec <code>&lt;</code>), une sortie standard (l’écran, numéro 1) et une sortie d’erreur (numéro 2). <code>commande &gt; fichier</code> remplace le fichier par la sortie standard, <code>&gt;&gt;</code> ajoute à la fin, <code>2&gt; erreurs.txt</code> enregistre les erreurs, <code>&gt;&amp;2</code> envoie un message vers la sortie d’erreur et <code>2&gt;/dev/null</code> fait disparaître les erreurs. Le tube <code>|</code> envoie la sortie d’une commande vers l’entrée de la suivante.</p>
</div>

<h2>PowerShell : les bases</h2>
<p>PowerShell manipule des <strong>objets</strong> et non du texte : <code>Get-Service</code> renvoie des objets « service » qui ont des propriétés (<code>Name</code>, <code>Status</code>…). Les commandes s’appellent des <em>cmdlets</em> et suivent la forme <strong>Verbe-Nom</strong> : <code>Get-ADUser</code>, <code>New-ADUser</code>, <code>Set-ADUser</code>, <code>Remove-ADUser</code>. <code>Get-Help New-ADUser -Examples</code> affiche des exemples, et <code>Get-Command *ADUser*</code> retrouve une commande.</p>
<pre class="code"><span class="cm"># verifier-disques.ps1</span>
<span class="kw">param</span>([int]$Seuil = 80)                          <span class="cm"># paramètre facultatif, 80 par défaut</span>

$disques = Get-Volume | Where-Object { $_.DriveLetter -and $_.Size -gt 0 }
<span class="kw">foreach</span> ($d <span class="kw">in</span> $disques) {
    $pourcent = [math]::Round(($d.Size - $d.SizeRemaining) / $d.Size * 100)
    <span class="kw">if</span> ($pourcent -ge $Seuil) {
        Write-Warning <span class="st">"Disque $($d.DriveLetter): rempli à $pourcent %"</span>
    } <span class="kw">else</span> {
        Write-Output <span class="st">"Disque $($d.DriveLetter): $pourcent %"</span>
    }
}</pre>
<ul>
  <li><code>$_</code> désigne l’objet en cours de traitement dans le tube (<code>|</code>).</li>
  <li><code>Where-Object</code> filtre, <code>Select-Object</code> choisit les propriétés, <code>Sort-Object</code> trie, <code>ForEach-Object</code> agit sur chaque objet.</li>
  <li><code>"$($d.DriveLetter)"</code> : pour insérer une propriété dans un texte, il faut l’entourer de <code>$( )</code>.</li>
  <li>Lancement : <code>.\verifier-disques.ps1 -Seuil 90</code>.</li>
</ul>

<h3>Lire un fichier CSV</h3>
<pre class="code">$membres = Import-Csv -Path <span class="st">".\membres-ligues.csv"</span> -Delimiter <span class="st">';'</span> -Encoding UTF8
<span class="kw">foreach</span> ($m <span class="kw">in</span> $membres) {
    Write-Output <span class="st">"$($m.Prenom) $($m.Nom) : $($m.Fonction) ($($m.Ligue))"</span>
}
$membres | Group-Object Ligue | Select-Object Name, Count</pre>
<p><code>Import-Csv</code> transforme chaque ligne en objet dont les propriétés portent le nom des colonnes (<code>Prenom</code>, <code>Nom</code>, <code>Ligue</code>, <code>Fonction</code>) : pas besoin de découper les lignes à la main. Sans <code>-Encoding UTF8</code>, Windows PowerShell 5.1 peut afficher « LÃ©a » au lieu de « Léa ».</p>

<h3>Sécurité et prudence</h3>
<ul>
  <li><strong>Stratégie d’exécution</strong> : par défaut, Windows refuse de lancer des scripts. Sur un serveur d’administration, <code>Set-ExecutionPolicy RemoteSigned</code> autorise les scripts locaux mais exige une signature pour les scripts téléchargés. Ce n’est pas une barrière de sécurité complète, c’est un garde-fou contre les lancements accidentels.</li>
  <li><strong><code>-WhatIf</code></strong> : beaucoup de cmdlets acceptent ce paramètre, qui affiche ce qui serait fait sans le faire (<code>Remove-ADUser lea.martin -WhatIf</code>). En Bash, on prévoit soi-même un mode test, comme l’option <code>--test</code> du script du TP 14.</li>
  <li><strong>Idempotence</strong> : relancer le script ne doit pas créer de doublons ni d’erreurs. On vérifie si le compte existe avant de le créer.</li>
  <li><strong>Pas de mot de passe écrit en clair dans le script</strong> : le script est copié, versionné, envoyé par courriel. On demande le mot de passe (<code>Read-Host -AsSecureString</code>) ou on le génère au hasard.</li>
  <li><strong>Tester dans une maquette</strong> (et après un instantané) avant de lancer sur le vrai annuaire.</li>
</ul>

<div class="aside pro">
  <p class="aside-title">En entreprise</p>
  <p>Les scripts d’un service informatique sont rangés dans un dépôt Git, relus par un collègue avant utilisation et lancés par un compte dédié. Pour gérer des centaines de serveurs, on passe à des outils de gestion de configuration (Ansible, PowerShell DSC), qui reprennent les mêmes principes : décrire l’état voulu, rendre l’opération rejouable, tracer ce qui a été fait.</p>
</div>

<h2>Lire un script : exercices de trace</h2>
<p>Lire un script et prévoir ce qu’il affiche est la meilleure façon de vérifier qu’on l’a compris, comme les traces d’algorithmes en programmation.</p>
<pre class="code"><span class="cm">#!/bin/bash</span>
total=0
<span class="kw">for</span> taille <span class="kw">in</span> 10 20 35; <span class="kw">do</span>
    total=$((total + taille))
<span class="kw">done</span>
<span class="kw">if</span> [ <span class="st">"$total"</span> -gt 50 ]; <span class="kw">then</span>
    echo <span class="st">"Alerte : $total Go"</span>
<span class="kw">else</span>
    echo <span class="st">"OK : $total Go"</span>
<span class="kw">fi</span></pre>

<div class="quiz" data-id="q-trace-p2">
  <div class="q" data-ok="3">
    <p class="qt">Qu’affiche le script ci-dessus ?</p>
    <ul><li>OK : 65 Go</li><li>Alerte : 35 Go</li><li>Alerte : 65 Go</li><li>Alerte : $total Go</li></ul>
    <p class="hint">Calculer la somme, puis la comparer à 50.</p>
    <div class="expl">La boucle additionne 10 + 20 + 35 = 65. Comme 65 est strictement supérieur à 50, la branche <code>then</code> s’exécute. Entre guillemets doubles, <code>$total</code> est remplacé par sa valeur.</div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Dans un script Bash, on écrit <code>ligue = "Volley"</code> (avec des espaces autour de =). Que se passe-t-il ?</p>
    <ul><li>La variable reçoit la valeur Volley</li><li>Erreur « ligue : commande introuvable »</li><li>La variable reçoit la valeur « = Volley »</li><li>Le script compare ligue et Volley</li></ul>
    <div class="expl">Avec des espaces, Bash comprend « lancer la commande <code>ligue</code> avec les arguments <code>=</code> et <code>Volley</code> ». Une affectation s’écrit sans espaces : <code>ligue="Volley"</code>.</div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Un script lancé chaque nuit doit signaler qu’il a échoué. Que doit-il faire ?</p>
    <ul><li>Afficher le mot « erreur »</li><li>Se terminer par <code>exit 0</code></li><li>Supprimer son fichier journal</li><li>Se terminer par un code de retour différent de 0</li></ul>
    <div class="expl">Le planificateur ou l’outil de supervision lit le code de retour : 0 signifie succès, toute autre valeur signale une erreur. Un message seul n’est lu par personne la nuit.</div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Quelle commande PowerShell affiche seulement les services arrêtés ?</p>
    <ul><li><code>Get-Service | Where-Object { $_.Status -eq "Stopped" }</code></li><li><code>Get-Service | Where-Object { $_.Status = "Stopped" }</code></li><li><code>Get-Service | Select-Object Stopped</code></li><li><code>Get-Service -Status == Stopped</code></li></ul>
    <div class="expl"><code>Where-Object</code> filtre ; <code>$_</code> est le service en cours ; la comparaison s’écrit <code>-eq</code>. Avec <code>=</code>, on tenterait une affectation.</div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Que fait <code>Remove-ADUser lea.martin -WhatIf</code> ?</p>
    <ul><li>Supprime le compte après confirmation</li><li>Désactive le compte sans le supprimer</li><li>Affiche ce qui serait supprimé, sans rien supprimer</li><li>Supprime le compte et garde une copie</li></ul>
    <div class="expl"><code>-WhatIf</code> simule l’opération. C’est le réflexe à avoir avant toute commande de suppression ou de modification en masse.</div>
  </div>
</div>

<h2>Mettre en pratique : un script de surveillance du disque</h2>
<p>Sur SRV-DEB, la commande <code>df --output=pcent / | tail -n 1 | tr -dc '0-9'</code> affiche le pourcentage d’occupation de la partition racine (par exemple <code>23</code>).</p>
<div class="answer" data-id="a-script-disque" data-kind="code" data-label="Script Bash de surveillance du disque" data-min="150" data-rows="14">
  <p>Écrire le script <code>verifier-disque.sh</code> qui : reçoit un seuil en paramètre (80 par défaut s’il est absent) ; lit l’occupation de <code>/</code> ; affiche « OK » ou « ALERTE » avec le pourcentage ; ajoute une ligne datée dans <code>/var/log/verif-disque.log</code> en cas d’alerte ; se termine par le code 0 si tout va bien, 1 en cas d’alerte. Le tester avec un seuil de 10 pour provoquer l’alerte.</p>
  <div class="corr">
<pre class="code"><span class="cm">#!/bin/bash</span>
<span class="cm"># verifier-disque.sh [seuil] : alerte si / dépasse le seuil (en %)</span>
seuil=<span class="st">"${1:-80}"</span>
occupation=$(df --output=pcent / | tail -n 1 | tr -dc <span class="st">'0-9'</span>)

<span class="kw">if</span> [ <span class="st">"$occupation"</span> -ge <span class="st">"$seuil"</span> ]; <span class="kw">then</span>
    echo <span class="st">"ALERTE : / est rempli à $occupation % (seuil $seuil %)"</span>
    echo <span class="st">"$(date '+%F %T') ALERTE / $occupation %"</span> &gt;&gt; /var/log/verif-disque.log
    <span class="kw">exit</span> 1
<span class="kw">fi</span>
echo <span class="st">"OK : / est rempli à $occupation %"</span>
<span class="kw">exit</span> 0</pre>
    <p><code>${1:-80}</code> prend le premier paramètre, ou 80 s’il est absent. L’écriture dans <code>/var/log</code> demande <code>sudo</code>. Pour le lancer chaque heure : <code>sudo crontab -e</code>, puis la ligne <code>0 * * * * /usr/local/bin/verifier-disque.sh 90</code>. La partie 3 montre comment centraliser ce type d’alerte.</p>
  </div>
</div>

<div class="aside tip">
  <p class="aside-title">Méthode</p>
  <p>Écrire un script par petites étapes : une ligne, un test ; puis la suivante. Ajouter des <code>echo</code> pour voir le contenu des variables. En Bash, <code>bash -x script.sh</code> affiche chaque commande avant de l’exécuter. En PowerShell, l’éditeur ISE ou VS Code permet de poser des points d’arrêt, comme dans Visual Studio.</p>
</div>

<div class="quiz" data-id="q-fin-p2">
  <div class="q" data-ok="2">
    <p class="qt">Que signifie la première ligne <code>#!/bin/bash</code> ?</p>
    <ul><li>C’est un commentaire sans effet</li><li>Elle indique quel interpréteur doit exécuter le fichier</li><li>Elle donne le droit d’exécution</li><li>Elle importe une bibliothèque</li></ul>
    <div class="expl">Cette ligne (le <em>shebang</em>) indique au système de faire lire le fichier par <code>/bin/bash</code>. Le droit d’exécution se donne avec <code>chmod +x</code>.</div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Pourquoi écrire <code>"$nom"</code> plutôt que <code>$nom</code> en Bash ?</p>
    <ul><li>Pour afficher le mot $nom</li><li>Pour rendre la variable globale</li><li>Pour convertir en majuscules</li><li>Pour qu’une valeur contenant des espaces reste un seul mot</li></ul>
    <div class="expl">Sans guillemets, « Le Gall » devient deux arguments, « Le » et « Gall ». Les guillemets doubles gardent la valeur entière tout en remplaçant la variable.</div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Quel est l’avantage principal de <code>Import-Csv</code> ?</p>
    <ul><li>Chaque ligne devient un objet dont les propriétés portent le nom des colonnes</li><li>Il crée automatiquement les comptes</li><li>Il chiffre le fichier</li><li>Il convertit le fichier en Excel</li></ul>
    <div class="expl">On écrit directement <code>$m.Nom</code> ou <code>$m.Ligue</code>, sans découper les lignes soi-même.</div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Un script de création de comptes est relancé par erreur. Il est idempotent si…</p>
    <ul><li>il crée les comptes une seconde fois</li><li>il s’arrête sur la première erreur</li><li>il ne crée pas de doublons et ignore les comptes qui existent</li><li>il supprime puis recrée tous les comptes</li></ul>
    <div class="expl">Une opération idempotente donne le même résultat qu’on la lance une ou dix fois. Supprimer puis recréer ferait perdre les fichiers et les mots de passe des utilisateurs.</div>
  </div>
</div>

<h1>Créer des comptes en masse à partir d’un fichier CSV</h1>
<p class="lead">Le secrétariat de la M2L envoie la liste des membres de trois ligues dans un fichier CSV. Il faut créer leurs comptes sur le serveur Linux SRV-DEB (avec un script Bash fourni, à comprendre avant de le lancer) puis dans l’annuaire Active Directory (avec un script PowerShell que vous écrivez). Enfin, on donne aux ligues l’accès à leur partage selon la méthode AGDLP.</p>

<div class="aside caution">
  <p class="aside-title">Consignes</p>
  <ul>
    <li>Machines : <strong>SRV-DEB</strong> (Debian) et <strong>SRV-WIN</strong>, contrôleur du domaine <code>m2l.lan</code> depuis le TP 13. <strong>Instantané <code>avant-TP14</code></strong> des deux serveurs.</li>
    <li>Travail <strong>sans IA</strong>. Le script PowerShell est votre production : il sera relu à l’oral, ligne par ligne.</li>
    <li>Déposer les deux scripts et le fichier CSV dans votre dépôt GitHub (dossier <code>ch5/tp14</code>), avec un message de validation clair. <strong>Aucun mot de passe dans le dépôt.</strong></li>
  </ul>

<h2>Mission 1 : comprendre le script Bash avant de le lancer</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Lire, prévoir, puis exécuter</summary>
  <div class="task-body">
    <p>Ouvrir <code>creer-comptes-ligues.sh</code> dans un éditeur (sur le poste ou avec <code>nano</code>) et le lire en entier. Puis répondre <strong>avant de lancer quoi que ce soit</strong>.</p>
    <div class="answer" data-id="t14-lecture" data-label="Mission 1 : lecture du script Bash" data-min="250" data-rows="10">
      <p>a) Que fait le script si on le lance sans paramètre ? sans <code>sudo</code> et sans <code>--test</code> ? b) Quel identifiant fabrique-t-il pour Thomas Le Gall, Inès Benali, Émilie Rousseau-Delacroix ? c) Quel groupe Linux reçoit Chloé Fontaine ? d) Que se passe-t-il pour un membre dont le compte existe déjà ? e) À quoi servent <code>chage -d 0</code> et la ligne <code>fonction="${fonction%$'\r'}"</code> ? f) Quel est le défaut de sécurité de l’affichage final des mots de passe, et comment le corriger ?</p>
      <div class="corr">
        <p>a) Sans paramètre : message d’usage sur la sortie d’erreur et code de retour 1. Sans <code>sudo</code> ni <code>--test</code> : message « Ce script doit être lancé avec sudo » et code 2. <code>useradd</code> demande les droits du superutilisateur.</p>
        <p>b) <code>thomas.legall</code> (espace retirée), <code>ines.benali</code> (accent retiré), <code>emilie.rousseau-dela</code> : <code>emilie.rousseau-delacroix</code> compte 25 caractères, <code>cut -c1-20</code> garde les 20 premiers. Le trait d’union est conservé.</p>
        <p>c) <code>ligue-tennis</code> : <code>ligue-</code> suivi du nom de la ligue en minuscules ; le groupe est créé s’il n’existe pas (<code>getent group … || groupadd …</code>).</p>
        <p>d) <code>id</code> trouve le compte : le script affiche « IGNORÉ », compte l’ignoré et passe au suivant (<code>continue</code>). Le script peut donc être relancé sans risque : il est idempotent.</p>
        <p>e) <code>chage -d 0</code> fixe la date du dernier changement de mot de passe au 1<sup>er</sup> janvier 1970 : le mot de passe est considéré comme expiré et l’utilisateur doit le changer à sa première connexion. La seconde ligne retire le retour chariot (<code>\r</code>) laissé à la fin de chaque ligne quand le fichier a été enregistré sous Windows ; sans elle, la fonction se terminerait par un caractère invisible.</p>
        <p>f) Les mots de passe provisoires s’affichent à l’écran (et restent dans l’historique du terminal si on redirige la sortie dans un fichier). Mieux : les écrire dans un fichier lisible seulement par root (<code>chmod 600</code>), remis aux utilisateurs par un canal sûr puis supprimé, ou ne pas en créer et envoyer un lien d’activation. Le journal <code>/var/log/creation-comptes.log</code>, lui, ne contient pas les mots de passe.</p>
      </div>
    </div>
    <pre class="code terminal"><span class="cm"># Copier les fichiers sur SRV-DEB (depuis le poste : scp, ou clé USB virtuelle)</span>
<span class="pr">etudiant@srv-deb:~$</span> chmod +x creer-comptes-ligues.sh
<span class="pr">etudiant@srv-deb:~$</span> ./creer-comptes-ligues.sh membres-ligues.csv --test
<span class="pr">etudiant@srv-deb:~$</span> sudo ./creer-comptes-ligues.sh membres-ligues.csv
<span class="pr">etudiant@srv-deb:~$</span> sudo ./creer-comptes-ligues.sh membres-ligues.csv        <span class="cm"># une seconde fois</span>
<span class="pr">etudiant@srv-deb:~$</span> getent group ligue-volley ; id thomas.legall ; sudo chage -l thomas.legall
<span class="pr">etudiant@srv-deb:~$</span> sudo tail /var/log/creation-comptes.log</pre>
    <div class="answer" data-id="t14-execution" data-label="Mission 1 : résultats de l’exécution" data-min="150" data-rows="7">
      <p>Comparer les résultats à vos prévisions : bilan de chaque exécution, membres du groupe <code>ligue-volley</code>, information « Dernière modification du mot de passe » de <code>chage -l</code>. Se connecter en <code>ssh thomas.legall@localhost</code> avec le mot de passe provisoire : que se passe-t-il ?</p>
      <div class="corr">
        <p>Mode test : 10 lignes « TEST », aucun compte créé (<code>id lea.martin</code> échoue encore). Première exécution : 10 « CRÉÉ », bilan « 10 compte(s) traité(s), 0 ignoré(s) ». Seconde exécution : 10 « IGNORÉ », bilan « 0 compte(s) traité(s), 10 ignoré(s) ».</p>
        <p><code>getent group ligue-volley</code> : <code>ligue-volley:x:1001:lea.martin,jean-marc.dubois,ines.benali</code> (le numéro peut différer). <code>chage -l</code> : « Dernière modification du mot de passe : le mot de passe doit être changé ». À la connexion SSH : « You are required to change your password immediately », puis demande de l’ancien mot de passe et du nouveau (deux fois), et la session se ferme ; il faut se reconnecter avec le nouveau mot de passe.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 2 : écrire le script PowerShell pour Active Directory</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Le même travail, dans l’annuaire</summary>
  <div class="task-body">
    <p>Sur SRV-WIN, créer le dossier <code>C:\Scripts</code>, y copier le fichier CSV, et écrire avec <strong>PowerShell ISE</strong> le script <code>creer-comptes-ad.ps1</code>. Cahier des charges :</p>
    <ol class="steps">
      <li>Un paramètre <code>-Fichier</code> (obligatoire) et un commutateur <code>-Test</code> qui affiche ce qui serait fait sans rien créer.</li>
      <li>Une fonction <code>Get-Login</code> qui applique la règle de nommage de la M2L.</li>
      <li>Pour chaque ligue : l’OU <code>OU=&lt;Ligue&gt;,OU=Ligues,OU=M2L,DC=m2l,DC=lan</code> et le groupe global de sécurité <code>GG_&lt;Ligue&gt;</code> dans cette OU, créés seulement s’ils n’existent pas.</li>
      <li>Pour chaque membre : un compte avec prénom, nom, identifiant, nom d’utilisateur principal <code>login@m2l.lan</code>, fonction (<em>Title</em>) et ligue (<em>Department</em>), un mot de passe provisoire aléatoire conforme à la politique du TP 13 (12 caractères au moins), le changement de mot de passe obligatoire à la première connexion, l’ajout au groupe de la ligue.</li>
      <li>Les comptes existants (<code>lea.martin</code>, créé au TP 13) sont ignorés et signalés.</li>
      <li>Une ligne datée par compte créé dans <code>C:\Scripts\creation-comptes.log</code>, sans mot de passe ; un bilan à la fin.</li>
    </ol>
    <p>Commandes utiles : <code>Import-Csv</code>, <code>Get-ADUser -Filter "SamAccountName -eq '$login'"</code>, <code>Get-ADOrganizationalUnit -Filter</code>, <code>Get-ADGroup -Filter</code>, <code>New-ADOrganizationalUnit</code>, <code>New-ADGroup</code>, <code>New-ADUser</code>, <code>Add-ADGroupMember</code>, <code>ConvertTo-SecureString</code>, <code>Add-Content</code>, <code>Get-Random</code>. Pour retirer les accents : <code>$texte.Normalize([Text.NormalizationForm]::FormD) -replace '\p{Mn}', ''</code> (la décomposition sépare « é » en « e » plus un accent, puis on supprime les accents).</p>
    <div class="aside note">
      <p class="aside-title">Encodage du script</p>
      <p>Windows PowerShell 5.1 lit un fichier <code>.ps1</code> sans indication d’encodage comme un fichier Windows-1252 : les chaînes accentuées du script deviennent alors « PrÃ©sidente ». PowerShell ISE enregistre en UTF-8 <strong>avec BOM</strong>, ce qui évite le problème ; dans VS Code, choisir l’encodage « UTF-8 with BOM ».</p>
    </div>
    <div class="answer" data-id="t14-script-ps" data-kind="code" data-label="Mission 2 : script creer-comptes-ad.ps1" data-min="600" data-rows="22">
      <p>Coller ici votre script complet, une fois testé (d’abord avec <code>-Test</code>, puis pour de bon).</p>
      <div class="corr">
<pre class="code"><span class="cm"># creer-comptes-ad.ps1 : crée les comptes des membres des ligues dans m2l.lan</span>
<span class="cm"># Usage : .\creer-comptes-ad.ps1 -Fichier .\membres-ligues.csv [-Test]</span>
<span class="kw">param</span>(
    [Parameter(Mandatory = $true)][string]$Fichier,
    [switch]$Test
)
Import-Module ActiveDirectory
$base    = <span class="st">"OU=Ligues,OU=M2L,DC=m2l,DC=lan"</span>
$journal = <span class="st">"C:\Scripts\creation-comptes.log"</span>
$crees = 0 ; $ignores = 0

<span class="kw">function</span> Get-Login([string]$Prenom, [string]$Nom) {
    $texte = (<span class="st">"$Prenom.$Nom"</span>).ToLower().Normalize([Text.NormalizationForm]::FormD)
    $texte = $texte -replace <span class="st">'\p{Mn}'</span>, <span class="st">''</span> -replace <span class="st">"[ ']"</span>, <span class="st">''</span>
    <span class="kw">if</span> ($texte.Length -gt 20) { $texte = $texte.Substring(0, 20) }
    <span class="kw">return</span> $texte
}

<span class="kw">function</span> New-MotDePasse {
    $caracteres = [char[]](<span class="st">'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'</span>)
    <span class="kw">return</span> <span class="st">"M2l!"</span> + -join ($caracteres | Get-Random -Count 8)
}

<span class="kw">if</span> (-not (Test-Path $Fichier)) { Write-Error <span class="st">"Fichier introuvable : $Fichier"</span> ; <span class="kw">exit</span> 1 }
$membres = Import-Csv -Path $Fichier -Delimiter <span class="st">';'</span> -Encoding UTF8

<span class="kw">foreach</span> ($m <span class="kw">in</span> $membres) {
    $login  = Get-Login $m.Prenom $m.Nom
    $ou     = <span class="st">"OU=$($m.Ligue),$base"</span>
    $groupe = <span class="st">"GG_$($m.Ligue)"</span>

    <span class="kw">if</span> (Get-ADUser -Filter <span class="st">"SamAccountName -eq '$login'"</span>) {
        Write-Output <span class="st">"IGNORÉ  $login existe déjà"</span> ; $ignores++ ; <span class="kw">continue</span>
    }
    <span class="kw">if</span> ($Test) {
        Write-Output <span class="st">"TEST    $login ($($m.Fonction)) -&gt; $ou, groupe $groupe"</span> ; $crees++ ; <span class="kw">continue</span>
    }
    <span class="cm"># OU et groupe de la ligue, s'ils n'existent pas encore</span>
    <span class="kw">if</span> (-not (Get-ADOrganizationalUnit -Filter <span class="st">"Name -eq '$($m.Ligue)'"</span> -SearchBase $base)) {
        New-ADOrganizationalUnit -Name $m.Ligue -Path $base
    }
    <span class="kw">if</span> (-not (Get-ADGroup -Filter <span class="st">"Name -eq '$groupe'"</span>)) {
        New-ADGroup -Name $groupe -GroupScope Global -GroupCategory Security -Path $ou
    }
    $mdp = New-MotDePasse
    New-ADUser -Name <span class="st">"$($m.Prenom) $($m.Nom)"</span> -GivenName $m.Prenom -Surname $m.Nom `
        -SamAccountName $login -UserPrincipalName <span class="st">"$login@m2l.lan"</span> `
        -Title $m.Fonction -Department $m.Ligue -Path $ou `
        -AccountPassword (ConvertTo-SecureString $mdp -AsPlainText -Force) `
        -ChangePasswordAtLogon $true -Enabled $true
    Add-ADGroupMember -Identity $groupe -Members $login
    Add-Content -Path $journal -Value <span class="st">"$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') CRÉÉ $login groupe=$groupe"</span>
    Write-Output <span class="st">"CRÉÉ    $login -&gt; $groupe, mot de passe provisoire : $mdp"</span>
    $crees++
}
Write-Output <span class="st">"Bilan : $crees compte(s) traité(s), $ignores ignoré(s)."</span></pre>
        <p>Points de vigilance : le caractère <code>`</code> en fin de ligne permet de couper une longue commande (aucune espace après lui) ; <code>SamAccountName</code> est limité à 20 caractères, d’où la règle de nommage ; la liste de caractères du mot de passe évite les caractères ambigus (<code>l</code>, <code>1</code>, <code>O</code>, <code>0</code>) ; le préfixe <code>M2l!</code> garantit une majuscule, une minuscule, un chiffre et un caractère spécial, exigés par la complexité par défaut du domaine. Le mot de passe est affiché une seule fois et jamais écrit dans le journal.</p>
        <p>Résultat attendu : 9 comptes créés, <code>lea.martin</code> ignoré ; OU <code>Tennis</code> et <code>Basket</code> créées ; groupes <code>GG_Tennis</code> et <code>GG_Basket</code> créés, <code>GG_Volley</code> réutilisé.</p>
      </div>
    </div>
    <pre class="code terminal"><span class="cm"># Vérifications</span>
<span class="pr">PS C:\Scripts&gt;</span> Get-ADUser -Filter * -SearchBase "OU=Ligues,OU=M2L,DC=m2l,DC=lan" -Properties Title, Department | Sort-Object Department | Format-Table SamAccountName, Title, Department
<span class="pr">PS C:\Scripts&gt;</span> Get-ADGroupMember GG_Basket | Select-Object SamAccountName
<span class="pr">PS C:\Scripts&gt;</span> Get-Content C:\Scripts\creation-comptes.log</pre>
  </div>
</details>

<h2>Mission 3 : donner accès au partage selon AGDLP</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Réparer les droits du partage Volley</summary>
  <div class="task-body">
    <p>Depuis la promotion, les droits du partage <code>Volley</code> (TP 9) désignent un groupe local qui n’existe plus. On applique la méthode AGDLP de la partie 1 : les comptes dans un groupe global, le groupe global dans un groupe de domaine local, et les droits donnés au groupe de domaine local.</p>
    <pre class="code terminal"><span class="pr">PS C:\&gt;</span> New-ADGroup -Name "GL_Partage_Volley_M" -GroupScope DomainLocal -GroupCategory Security -Path "OU=Groupes,OU=M2L,DC=m2l,DC=lan" -Description "Modification sur le partage Volley"
<span class="pr">PS C:\&gt;</span> Add-ADGroupMember -Identity "GL_Partage_Volley_M" -Members "GG_Volley"
<span class="pr">PS C:\&gt;</span> Grant-SmbShareAccess -Name "Volley" -AccountName "M2L\GL_Partage_Volley_M" -AccessRight Change -Force
<span class="pr">PS C:\&gt;</span> icacls "C:\Partages\Volley" /grant "M2L\GL_Partage_Volley_M:(OI)(CI)M"
<span class="pr">PS C:\&gt;</span> Get-SmbShareAccess -Name "Volley" ; icacls "C:\Partages\Volley"</pre>
    <p>Retirer ensuite, dans l’onglet <em>Sécurité</em> du dossier et dans les autorisations du partage, les entrées affichées sous forme de SID inconnus (<code>S-1-5-21-…</code>).</p>
    <div class="answer" data-id="t14-agdlp" data-label="Mission 3 : tests d’accès au partage" data-min="200" data-rows="8">
      <p>a) Sur PC-CLIENT, ouvrir une session avec <code>jean-marc.dubois</code>, puis avec <code>thomas.legall</code>, et tenter d’ouvrir <code>\\srv-win\Volley</code> et d’y créer un fichier. Noter les résultats. b) Le trésorier de volley devient aussi trésorier du tennis : quelle seule action faut-il faire, et pourquoi la méthode AGDLP simplifie-t-elle la gestion ? c) Un utilisateur ajouté à <code>GG_Volley</code> pendant qu’il est connecté n’a pas tout de suite l’accès : pourquoi ?</p>
      <div class="corr">
        <p>a) <code>jean-marc.dubois</code> (membre de <code>GG_Volley</code>, lui-même membre de <code>GL_Partage_Volley_M</code>) ouvre le partage et crée le fichier. <code>thomas.legall</code> obtient « Vous n’avez pas l’autorisation d’accéder à \\srv-win\Volley » : il n’est dans aucun groupe autorisé.</p>
        <p>b) Ajouter <code>jean-marc.dubois</code> au groupe <code>GG_Tennis</code>. On ne touche jamais aux droits des dossiers : ils sont donnés une fois pour toutes à des groupes de domaine local ; la gestion quotidienne se fait sur l’appartenance aux groupes globaux, qui décrivent les personnes (« qui fait partie de quelle ligue »). Cela reste lisible quand on a des dizaines de partages et des centaines de comptes.</p>
        <p>c) La liste des groupes d’un utilisateur est placée dans son ticket Kerberos à l’ouverture de session. Il doit fermer et rouvrir sa session (ou attendre le renouvellement du ticket) pour que le nouveau groupe soit pris en compte. <code>whoami /groups</code> permet de le vérifier.</p>
      </div>
    </div>
  </div>
</details>

<h2>Défi : désactiver les comptes des membres partis</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Le départ, l’autre moitié du cycle de vie d’un compte</summary>
  <div class="task-body">
    <div class="answer" data-id="t14-defi" data-kind="code" data-label="Défi : script de désactivation des comptes" data-min="250" data-rows="14">
      <p>Le secrétariat envoie chaque année la liste à jour des membres. Écrire un script PowerShell qui désactive (sans les supprimer) les comptes de l’OU <code>Ligues</code> absents du nouveau fichier, les déplace dans une OU <code>Desactives</code> et ajoute une description datée. Pourquoi désactiver plutôt que supprimer ? Quelle obligation réglementaire s’applique aux comptes et aux données des personnes parties ?</p>
      <div class="corr">
<pre class="code"><span class="kw">param</span>([Parameter(Mandatory = $true)][string]$Fichier, [switch]$Test)
$base  = <span class="st">"OU=Ligues,OU=M2L,DC=m2l,DC=lan"</span>
$cible = <span class="st">"OU=Desactives,OU=M2L,DC=m2l,DC=lan"</span>
<span class="cm"># Get-Login : la même fonction que dans creer-comptes-ad.ps1</span>
$attendus = Import-Csv $Fichier -Delimiter <span class="st">';'</span> -Encoding UTF8 | ForEach-Object { Get-Login $_.Prenom $_.Nom }
<span class="kw">foreach</span> ($u <span class="kw">in</span> Get-ADUser -Filter <span class="st">'Enabled -eq $true'</span> -SearchBase $base) {
    <span class="kw">if</span> ($attendus -notcontains $u.SamAccountName) {
        <span class="kw">if</span> ($Test) { Write-Output <span class="st">"TEST    désactiverait $($u.SamAccountName)"</span> ; <span class="kw">continue</span> }
        Disable-ADAccount -Identity $u
        Set-ADUser -Identity $u -Description <span class="st">"Désactivé le $(Get-Date -Format 'yyyy-MM-dd') : absent de la liste des membres"</span>
        Move-ADObject -Identity $u.DistinguishedName -TargetPath $cible
        Write-Output <span class="st">"DÉSACTIVÉ $($u.SamAccountName)"</span>
    }
}</pre>
        <p>L’OU <code>Desactives</code> doit exister (<code>New-ADOrganizationalUnit -Name Desactives -Path "OU=M2L,DC=m2l,DC=lan"</code>). Désactiver est réversible (un départ par erreur, un retour de membre) et garde le lien avec les fichiers et l’historique ; une suppression supprime aussi le SID, qu’on ne peut pas recréer.</p>
        <p>Le RGPD impose de ne pas conserver les données personnelles plus longtemps que nécessaire : il faut une durée de conservation définie (par exemple suppression des comptes désactivés au bout de 6 mois), appliquée et documentée. Un compte actif d’une personne partie est aussi une faille : il peut servir à une intrusion sans que personne ne le remarque.</p>
      </div>
    </div>
  </div>
</details>

<div class="aside next">
  <p class="aside-title">La suite</p>
  <p>Les comptes sont créés et le journal garde la trace de chaque création. La <a href="#p3">partie 3</a> montre comment lire et exploiter les journaux des serveurs.</p>
</div>

<template data-page="p3">
<h1>Journaux et indicateurs</h1>
<p class="lead">Un serveur raconte en permanence ce qu’il fait : démarrages de services, connexions réussies ou refusées, erreurs, comptes créés. Ces messages sont enregistrés dans des <strong>journaux</strong> (en anglais <em>logs</em>). Savoir les lire est indispensable pour dépanner, pour détecter une attaque et pour prouver ce qui s’est passé. Les <strong>indicateurs</strong> (espace disque, mémoire, charge) permettent, eux, d’anticiper les pannes.</p>

<div class="aside caution">
  <p class="aside-title">Règle du cours</p>
  <p>Pas d’IA pour interpréter les journaux : c’est précisément la compétence travaillée. Les messages d’erreur se lisent, se recopient exactement et se recherchent dans la documentation officielle.</p>
</div>

<h2>Qu’est-ce qu’un journal ?</h2>
<p>Un journal est une suite d’<strong>événements</strong>, un par ligne ou par enregistrement. Chaque événement contient au minimum :</p>
<ul>
  <li><strong>la date et l’heure</strong> (d’où l’importance de serveurs à l’heure, synchronisés par NTP : sans cela, impossible de reconstituer l’ordre des événements entre deux machines) ;</li>
  <li><strong>la source</strong> : la machine et le programme qui l’a produit (<code>sshd</code>, <code>apache2</code>, le service DHCP…) ;</li>
  <li><strong>le niveau de gravité</strong> : information, avertissement, erreur… ;</li>
  <li><strong>le message</strong> lui-même.</li>
</ul>
<pre class="code">Mar 10 09:14:41 srv-deb sshd[1288]: Failed password for root from 172.16.0.57 port 40112 ssh2</pre>
<p>Dans cette ligne : <code>Mar 10 09:14:41</code> est la date et l’heure, <code>srv-deb</code> la machine, <code>sshd[1288]</code> le programme et son numéro de processus, la suite le message. La gravité n’apparaît pas dans la ligne, mais elle est enregistrée (<code>journalctl -p</code> permet de filtrer dessus).</p>

<h3>Les niveaux de gravité (syslog)</h3>
<p>La norme <strong>syslog</strong> (RFC 5424), utilisée par Linux et par la plupart des équipements réseau (Cisco, pfSense), définit huit niveaux :</p>
<div class="tbl-wrap"><table class="data">
  <tr><th class="num">Niveau</th><th>Nom</th><th>Exemple</th></tr>
  <tr><td class="num">0</td><td>emerg (urgence)</td><td>le système est inutilisable</td></tr>
  <tr><td class="num">1</td><td>alert (alerte)</td><td>action immédiate nécessaire</td></tr>
  <tr><td class="num">2</td><td>crit (critique)</td><td>panne d’un disque</td></tr>
  <tr><td class="num">3</td><td>err (erreur)</td><td>un service ne démarre pas</td></tr>
  <tr><td class="num">4</td><td>warning (avertissement)</td><td>disque rempli à 90 %</td></tr>
  <tr><td class="num">5</td><td>notice (normal mais notable)</td><td>une interface réseau passe à l’état « up »</td></tr>
  <tr><td class="num">6</td><td>info (information)</td><td>une connexion réussie</td></tr>
  <tr><td class="num">7</td><td>debug (débogage)</td><td>détails techniques pour les développeurs</td></tr>
</table></div>
<p>Plus le numéro est petit, plus l’événement est grave. Sur un commutateur Cisco, un message <code>%LINK-3-UPDOWN</code> est de niveau 3, <code>%LINEPROTO-5-UPDOWN</code> de niveau 5.</p>

<h2>Les journaux sous Linux</h2>
<p>Sur Debian 12, les journaux sont gérés par <strong>journald</strong>, le service de journalisation de systemd. Le paquet <code>rsyslog</code>, qui écrivait les fichiers texte <code>/var/log/syslog</code> et <code>/var/log/auth.log</code>, n’est plus installé par défaut : on le rajoute si l’on veut ces fichiers ou envoyer les journaux vers un serveur central. Certains programmes écrivent toujours leurs propres fichiers, comme Apache dans <code>/var/log/apache2/</code>.</p>
<pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> sudo journalctl -u ssh --since today             <span class="cm"># le service SSH, depuis ce matin</span>
<span class="pr">etudiant@srv-deb:~$</span> sudo journalctl -p err -b                        <span class="cm"># erreurs et plus graves, depuis le démarrage</span>
<span class="pr">etudiant@srv-deb:~$</span> sudo journalctl -u apache2 -n 20                  <span class="cm"># les 20 dernières lignes d’Apache</span>
<span class="pr">etudiant@srv-deb:~$</span> sudo journalctl -f                                <span class="cm"># suivre en direct (Ctrl+C pour quitter)</span>
<span class="pr">etudiant@srv-deb:~$</span> sudo journalctl -u ssh | grep "Failed password" | wc -l
<span class="pr">etudiant@srv-deb:~$</span> sudo tail -f /var/log/apache2/access.log /var/log/apache2/error.log
<span class="pr">etudiant@srv-deb:~$</span> last -n 10 ; lastb -n 10                          <span class="cm"># dernières connexions réussies / échouées</span></pre>
<p>Une ligne du journal d’accès d’Apache se lit ainsi :</p>
<pre class="code">172.16.2.140 - - [10/Mar/2027:10:02:17 +0100] "GET /index.html HTTP/1.1" 200 1532 "-" "Mozilla/5.0 ..."</pre>
<p>On y lit, dans l’ordre : l’adresse du client, la date, la requête (méthode, page, version du protocole), le code de réponse, la taille de la réponse en octets, la page d’origine (ici aucune) et le navigateur. Le code 200 signifie succès, 404 page introuvable, 403 accès interdit, 500 erreur du serveur (chapitre 3). Une rafale de 404 sur des pages comme <code>/wp-login.php</code> ou <code>/phpmyadmin</code> révèle un robot qui cherche des failles.</p>

<h2>Les journaux sous Windows</h2>
<p>Windows enregistre les événements dans l’<strong>Observateur d’événements</strong> (<code>eventvwr.msc</code>). Les journaux principaux sont <em>Application</em>, <em>Système</em> et <em>Sécurité</em> ; chaque rôle ajoute les siens (<em>Serveur DNS</em>, <em>Services d’annuaire</em>…). Chaque événement a un <strong>identifiant</strong> (Event ID) qu’il est utile de connaître :</p>
<div class="tbl-wrap"><table class="data">
  <tr><th class="num">ID</th><th>Journal</th><th>Signification</th></tr>
  <tr><td class="num">4624</td><td>Sécurité</td><td>ouverture de session réussie</td></tr>
  <tr><td class="num">4625</td><td>Sécurité</td><td>échec d’ouverture de session</td></tr>
  <tr><td class="num">4720</td><td>Sécurité</td><td>un compte d’utilisateur a été créé</td></tr>
  <tr><td class="num">4740</td><td>Sécurité</td><td>un compte d’utilisateur a été verrouillé</td></tr>
  <tr><td class="num">7036</td><td>Système</td><td>un service a changé d’état (démarré, arrêté)</td></tr>
  <tr><td class="num">6005 / 6006</td><td>Système</td><td>démarrage / arrêt du service de journal des événements (donc de l’ordinateur)</td></tr>
  <tr><td class="num">1074</td><td>Système</td><td>arrêt ou redémarrage demandé par un utilisateur ou un programme</td></tr>
</table></div>
<pre class="code terminal"><span class="cm"># Les 10 derniers échecs d’ouverture de session</span>
<span class="pr">PS C:\&gt;</span> Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4625} -MaxEvents 10
<span class="cm"># Les erreurs du journal Système des dernières 24 heures</span>
<span class="pr">PS C:\&gt;</span> Get-WinEvent -FilterHashtable @{LogName='System'; Level=2; StartTime=(Get-Date).AddDays(-1)}
<span class="cm"># Les comptes créés (par le script du TP 14, par exemple)</span>
<span class="pr">PS C:\&gt;</span> Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4720} | Select-Object TimeCreated, Message</pre>
<p>Dans <code>Get-WinEvent</code>, les niveaux sont numérotés 1 (critique), 2 (erreur), 3 (avertissement), 4 (information). Sur un contrôleur de domaine, les événements de connexion de tout le domaine (4768, 4771 pour Kerberos) sont enregistrés sur le contrôleur, pas sur les postes.</p>

<div class="match" data-id="m-eventid" data-label="Quel événement rechercher ?" data-options="4624|4625|4720|4740|1074">
  <div class="r" data-ok="4740" data-expl="4740 : compte verrouillé, après trop d’échecs (politique du TP 13).">Une ligue appelle : « Mon compte est bloqué depuis ce matin. » On cherche à quelle heure et depuis quel poste le blocage a eu lieu.</div>
  <div class="r" data-ok="1074" data-expl="1074 : arrêt ou redémarrage demandé, avec le nom du compte ou du programme.">Le serveur a redémarré cette nuit. On veut savoir qui, ou quel programme, l’a demandé.</div>
  <div class="r" data-ok="4720" data-expl="4720 : création de compte. Le journal indique aussi quel compte a fait la création.">Un compte inconnu, <code>support2</code>, est apparu dans l’annuaire. On cherche quand et par qui il a été créé.</div>
  <div class="r" data-ok="4625" data-expl="4625 : échecs d’ouverture de session. Un grand nombre en peu de temps signale une attaque par essais de mots de passe.">On soupçonne quelqu’un d’essayer de deviner le mot de passe de l’administrateur.</div>
  <div class="r" data-ok="4624" data-expl="4624 : ouverture de session réussie, avec le type de session (10 = bureau à distance).">On veut vérifier si Paul Garnier s’est bien connecté au serveur par le bureau à distance samedi.</div>
</div>

<h2>Lire un journal pour détecter une attaque</h2>
<div class="pick" data-id="k-ssh-attaque" data-ok="2,3,4,8" data-label="Repérer les lignes d’une attaque dans le journal SSH">
  <div class="pq"><p>Voici un extrait de <code>journalctl -u ssh</code> sur SRV-DEB, dans la DMZ. Cliquer sur toutes les lignes qui font partie d’une <strong>tentative d’intrusion</strong>.</p></div>
  <div class="tbl-wrap"><table class="data"><thead><tr><th class="num">N°</th><th>Heure</th><th>Message</th></tr></thead><tbody>
    <tr><td class="num">1</td><td>09:12:03</td><td>Accepted publickey for etudiant from 172.16.2.130 port 51022 ssh2</td></tr>
    <tr><td class="num">2</td><td>09:14:41</td><td>Failed password for root from 172.16.0.57 port 40112 ssh2</td></tr>
    <tr><td class="num">3</td><td>09:14:44</td><td>Failed password for root from 172.16.0.57 port 40112 ssh2</td></tr>
    <tr><td class="num">4</td><td>09:14:47</td><td>Failed password for invalid user admin from 172.16.0.57 port 40130 ssh2</td></tr>
    <tr><td class="num">5</td><td>09:15:02</td><td>Received disconnect from 172.16.2.130 port 51022:11: disconnected by user</td></tr>
    <tr><td class="num">6</td><td>09:15:10</td><td>Failed password for thomas.legall from 172.16.2.140 port 50211 ssh2</td></tr>
    <tr><td class="num">7</td><td>09:15:19</td><td>Accepted password for thomas.legall from 172.16.2.140 port 50211 ssh2</td></tr>
    <tr><td class="num">8</td><td>09:15:50</td><td>Failed password for invalid user test from 172.16.0.57 port 40188 ssh2</td></tr>
  </tbody></table></div>
  <div class="after"><p>Lignes 2, 3, 4 et 8 : la même adresse essaie plusieurs comptes (<code>root</code>, <code>admin</code>, <code>test</code>), dont deux n’existent pas (<em>invalid user</em>), à quelques secondes d’intervalle : c’est une attaque par essais successifs. La ligne 6 est une simple faute de frappe de Thomas Le Gall, suivie d’une connexion réussie neuf secondes plus tard depuis le même poste.</p>
  <p>L’adresse <code>172.16.0.57</code> appartient au <strong>Wi-Fi visiteurs</strong> (<code>172.16.0.0/23</code>) : un visiteur atteint le port SSH d’un serveur de la DMZ. Le journal révèle donc aussi une <strong>erreur dans les règles du pare-feu</strong> (la matrice des flux du chapitre 4 interdit ce flux). Actions : corriger la règle pfSense, vérifier que la connexion par mot de passe de <code>root</code> est interdite (<code>PermitRootLogin no</code>), et installer un outil comme <code>fail2ban</code>, qui bloque automatiquement une adresse après plusieurs échecs.</p></div>
</div>

<h2>Centraliser les journaux</h2>
<p>Consulter les journaux machine par machine ne suffit pas : un attaquant qui prend le contrôle d’un serveur commence souvent par effacer ses journaux. On envoie donc une copie de tous les journaux vers un <strong>serveur central</strong>, en temps réel :</p>
<ul>
  <li>sous Linux, <code>rsyslog</code> transmet en UDP 514 (ou TCP 514, plus fiable ; TLS pour chiffrer) : une ligne <code>*.* @@172.16.2.230:514</code> dans <code>/etc/rsyslog.d/central.conf</code> ;</li>
  <li>les commutateurs et routeurs Cisco : <code>logging host 172.16.2.230</code> et <code>logging trap warnings</code> ;</li>
  <li>pfSense : <em>Status &gt; System Logs &gt; Settings &gt; Remote Logging</em> ;</li>
  <li>Windows : abonnements aux événements (<em>Windows Event Forwarding</em>) ou un agent.</li>
</ul>
<p>En entreprise, les journaux centralisés alimentent un <strong>SIEM</strong> (<em>Security Information and Event Management</em>), un outil qui corrèle les événements de toutes les sources et déclenche des alertes. Vous le reverrez au chapitre 6.</p>

<div class="aside pro">
  <p class="aside-title">En entreprise : obligations légales</p>
  <p>Les journaux contiennent des données personnelles (identifiants, adresses IP, heures de connexion) : le RGPD s’applique. La CNIL recommande de conserver les journaux de connexion entre <strong>6 mois et 1 an</strong>, d’en informer les utilisateurs (charte informatique) et d’en limiter l’accès aux personnes habilitées. Les opérateurs et hébergeurs ont en plus des obligations de conservation fixées par la loi. Les journaux peuvent servir de preuve : leur intégrité (horodatage fiable, copie sur un serveur protégé) est donc importante.</p>
</div>

<h2>Les indicateurs</h2>
<p>Un indicateur est une mesure suivie dans le temps. Il permet d’agir <strong>avant</strong> la panne : on ajoute du disque à 80 %, pas à 100 %, quand le service de messagerie s’est arrêté.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Indicateur</th><th>Linux</th><th>Windows (PowerShell)</th><th>Seuil d’alerte courant</th></tr>
  <tr><td>Espace disque</td><td><code>df -h</code></td><td><code>Get-Volume</code></td><td>plus de 80 % utilisé</td></tr>
  <tr><td>Mémoire</td><td><code>free -h</code></td><td><code>Get-Counter '\Mémoire\Octets disponibles'</code></td><td>peu de mémoire disponible pendant longtemps</td></tr>
  <tr><td>Processeur, charge</td><td><code>top</code>, <code>uptime</code> (charge moyenne)</td><td><code>Get-Counter '\Processeur(_Total)\% temps processeur'</code></td><td>plus de 90 % pendant plusieurs minutes</td></tr>
  <tr><td>Services</td><td><code>systemctl --failed</code></td><td><code>Get-Service | Where-Object Status -eq Stopped</code></td><td>un service important arrêté</td></tr>
  <tr><td>Réseau</td><td><code>ip -s link</code>, <code>ss -s</code></td><td><code>Get-NetAdapterStatistics</code></td><td>erreurs d’interface, saturation du lien</td></tr>
  <tr><td>Disponibilité</td><td colspan="2"><code>ping</code>, test du port (<code>nc -zv</code>, <code>Test-NetConnection -Port</code>)</td><td>pas de réponse</td></tr>
</table></div>
<p>Les noms des compteurs Windows dépendent de la langue du système (<code>'\Memory\Available MBytes'</code> sur un Windows en anglais). Un outil de <strong>supervision</strong> (Zabbix, Centreon, Nagios, PRTG) interroge toutes les machines à intervalle régulier, trace des courbes et envoie une alerte quand un seuil est dépassé. Le script <code>verifier-disque.sh</code> de la partie 2 en est une version artisanale.</p>

<div class="aside deep">
  <p class="aside-title">En profondeur : SNMP</p>
  <p>Les équipements réseau exposent leurs indicateurs (trafic par port, température, état des ventilateurs) par le protocole <strong>SNMP</strong> (UDP 161 ; UDP 162 pour les alertes envoyées par l’équipement, appelées <em>traps</em>). Les versions 1 et 2c protègent l’accès par un simple mot de passe en clair, la « communauté » (souvent <code>public</code> par défaut !) ; la version 3 ajoute l’authentification et le chiffrement. Sur un réseau de production, on utilise SNMPv3 et on limite l’accès au serveur de supervision.</p>
</div>

<div class="answer" data-id="a-indicateurs" data-label="Tableau de bord de SRV-DEB" data-min="150" data-rows="8">
  <p>Sur SRV-DEB, relever avec les commandes du tableau : l’occupation de chaque partition, la mémoire totale et disponible, la charge moyenne, les services en échec, le nombre d’échecs SSH depuis le démarrage. Indiquer pour chaque valeur si elle est normale, et quel seuil vous proposeriez pour une alerte.</p>
  <div class="corr">
    <p>Les valeurs dépendent de la machine. Attendus : <code>df -h</code> (colonne <code>Uti%</code>), <code>free -h</code> (colonne <code>disponible</code>, plus parlante que <code>libre</code> car Linux utilise la mémoire libre comme cache), <code>uptime</code> (trois valeurs : charge moyenne sur 1, 5 et 15 minutes, à comparer au nombre de processeurs donné par <code>nproc</code>), <code>systemctl --failed</code> (normalement « 0 loaded units listed »), <code>journalctl -u ssh -b | grep -c "Failed password"</code>.</p>
    <p>Seuils raisonnables : disque à 80 % (avertissement) et 90 % (critique) ; charge moyenne sur 15 minutes supérieure au nombre de processeurs ; tout service en échec ; plus de 10 échecs SSH en 5 minutes depuis la même adresse. Un seuil se justifie : il doit laisser le temps d’agir sans déclencher d’alertes inutiles, que plus personne ne lirait.</p>
  </div>
</div>

<div class="quiz" data-id="q-fin-p3">
  <div class="q" data-ok="2">
    <p class="qt">Pourquoi tous les serveurs doivent-ils être synchronisés par NTP ?</p>
    <ul><li>Pour accélérer le réseau</li><li>Pour pouvoir comparer et ordonner les événements des journaux de plusieurs machines</li><li>Pour chiffrer les journaux</li><li>Pour économiser de l’espace disque</li></ul>
    <div class="expl">Reconstituer un incident demande de comparer les journaux du pare-feu, du serveur et du contrôleur : sans heure commune, c’est impossible. Kerberos exige aussi des horloges à moins de 5 minutes d’écart.</div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Quel niveau syslog est le plus grave ?</p>
    <ul><li>7 (debug)</li><li>4 (warning)</li><li>3 (err)</li><li>0 (emerg)</li></ul>
    <div class="expl">Plus le numéro est petit, plus l’événement est grave : 0 signifie que le système est inutilisable.</div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Sur Debian 12, quelle commande affiche les journaux du service SSH depuis ce matin ?</p>
    <ul><li><code>journalctl -u ssh --since today</code></li><li><code>cat /var/log/ssh</code></li><li><code>systemctl log ssh</code></li><li><code>Get-WinEvent ssh</code></li></ul>
    <div class="expl"><code>-u</code> choisit l’unité systemd (le service), <code>--since</code> la période. <code>/var/log/auth.log</code> n’existe que si <code>rsyslog</code> est installé.</div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Pourquoi envoyer les journaux vers un serveur central ?</p>
    <ul><li>Pour libérer de la place sur les serveurs uniquement</li><li>Parce que les serveurs ne peuvent pas garder leurs journaux</li><li>Pour les consulter au même endroit et les protéger d’un attaquant qui voudrait les effacer</li><li>Pour les rendre publics</li></ul>
    <div class="expl">La centralisation facilite la corrélation des événements et garde une copie hors de portée d’un attaquant qui aurait pris le contrôle d’une machine.</div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Combien de temps la CNIL recommande-t-elle de conserver les journaux de connexion ?</p>
    <ul><li>1 semaine</li><li>Entre 6 mois et 1 an</li><li>10 ans</li><li>Sans limite</li></ul>
    <div class="expl">Assez longtemps pour enquêter sur un incident découvert tardivement, mais pas indéfiniment : ce sont des données personnelles (RGPD).</div>
  </div>
</div>

<div class="aside next">
  <p class="aside-title">La suite</p>
  <p>Surveiller permet d’anticiper, mais une panne de disque, une erreur de manipulation ou un rançongiciel peuvent malgré tout détruire des données. La <a href="#p4">partie 4</a> présente la sauvegarde et la restauration.</p>
</div>
