<style>
/* Normalisation des bases de données — BTS SIO
   Mise en page : documentation en trois colonnes (parcours · contenu · sommaire de la page),
   inspirée des supports « Partie 1…4 » ; une seule colonne sur téléphone. */
:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #eef1f8;
  --fg: #161d2e;
  --muted: #556079;
  --line: #d8ddeb;
  --accent: #2c48c9;
  --accent-soft: #e5e9fb;
  --key: #a8550a;          /* clés primaires / étrangères */
  --key-soft: #fbefe2;
  --ok: #17803d;
  --ok-soft: #e3f4e8;
  --mid: #9a6200;
  --mid-soft: #fbf1d9;
  --ko: #c53030;
  --ko-soft: #fbe6e6;
  --shadow: 0 1px 2px rgba(22, 29, 46, .06), 0 4px 16px rgba(22, 29, 46, .05);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --top: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1420; --surface: #161d2c; --surface-2: #1d2639; --fg: #e5e9f3; --muted: #9ba6bf;
    --line: #2c3651; --accent: #93a6ff; --accent-soft: #1f2a4d; --key: #f2b469; --key-soft: #33261a;
    --ok: #5ad48a; --ok-soft: #15301f; --mid: #f3c35a; --mid-soft: #33290f; --ko: #ff8a8a; --ko-soft: #3a1b1d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1420; --surface: #161d2c; --surface-2: #1d2639; --fg: #e5e9f3; --muted: #9ba6bf;
  --line: #2c3651; --accent: #93a6ff; --accent-soft: #1f2a4d; --key: #f2b469; --key-soft: #33261a;
  --ok: #5ad48a; --ok-soft: #15301f; --mid: #f3c35a; --mid-soft: #33290f; --ko: #ff8a8a; --ko-soft: #3a1b1d;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(var(--top) + 16px); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 17px/1.65 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code, kbd { font-family: var(--f-mono); font-size: .86em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: .05em .35em; }
button { font: inherit; color: inherit; }
img { max-width: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- barre du haut ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--top);
  display: flex; align-items: center; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: .5ch; text-decoration: none; color: var(--fg); font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; white-space: nowrap; }
.brand span { color: var(--accent); }
.brand small { font: 600 .72rem var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.topbar .spacer { flex: 1; }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.who { font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
.theme-sel { font: inherit; font-size: .85rem; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }

.save-btn { white-space: nowrap; }
.save-btn.dirty { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.save-btn.dirty::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--key-soft); margin-right: 6px; vertical-align: 1px; }
.save-btn.dirty:hover:not(:disabled) { color: var(--surface); filter: brightness(1.08); }
.notices { max-width: calc(46rem + 15rem + 48px); margin: 0 auto 20px; display: grid; gap: 10px; }
.notice { border-radius: 12px; padding: 12px 16px; border: 1px solid var(--line); font-size: .93rem; }
.notice p { margin: 0 0 6px; }
.notice p:last-child { margin-bottom: 0; }
.notice.warn { background: var(--mid-soft); border-color: var(--mid); }
.notice.ko { background: var(--ko-soft); border-color: var(--ko); }

/* ---------- grille ---------- */
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - var(--top)); }
.sidebar {
  position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px)); align-self: start;
  height: calc(100vh - var(--top)); overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--surface);
  padding: 20px 14px 40px max(16px, env(safe-area-inset-left, 0px));
}
.nav-group { margin: 0 0 18px; }
.nav-group > p { margin: 0 0 6px 10px; font: 600 .72rem var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.nav-group ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav-link { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--fg); font-size: .93rem; line-height: 1.3; }
.nav-link:hover { background: var(--surface-2); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav-link .n { display: block; font: 600 .7rem var(--f-mono); color: var(--muted); letter-spacing: .03em; }
.nav-link[aria-current="page"] .n { color: var(--accent); }
.pill { font: 600 .68rem var(--f-mono); padding: 2px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill:empty { display: none; }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.go { background: var(--accent-soft); color: var(--accent); }

.main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
.page-grid { display: grid; grid-template-columns: minmax(0, 46rem) 15rem; gap: 48px; justify-content: center; }
.toc { position: sticky; top: calc(var(--top) + 24px); align-self: start; max-height: calc(100vh - var(--top) - 48px); overflow-y: auto; font-size: .85rem; }
.toc p { margin: 0 0 8px; font: 700 1rem var(--f-display); }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.toc a { display: block; color: var(--muted); text-decoration: none; line-height: 1.35; padding: 2px 0; }
.toc a.h3 { padding-left: 14px; }
.toc a:hover, .toc a.on { color: var(--accent); }
.toc a.on { font-weight: 700; }

/* ---------- contenu ---------- */
article { min-width: 0; counter-reset: h2; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 0 0 10px; font: 600 .78rem var(--f-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.eyebrow .kind { color: var(--accent); }
article h1 { font: 700 clamp(2rem, 4.2vw, 2.75rem)/1.12 var(--f-display); letter-spacing: -.02em; margin: 0 0 18px; text-wrap: balance; }
.lead { font-size: 1.12rem; color: var(--muted); margin: 0 0 26px; }
article h2 { font: 700 1.75rem/1.2 var(--f-display); letter-spacing: -.01em; margin: 56px 0 14px; text-wrap: balance; counter-increment: h2; counter-reset: h3; }
article h2::before { content: counter(h2) ". "; color: var(--accent); }
article h2.nonum::before { content: none; }
article h3 { font: 700 1.25rem/1.3 var(--f-display); margin: 34px 0 10px; counter-increment: h3; text-wrap: balance; }
article h3::before { content: counter(h2) "." counter(h3) ". "; color: var(--muted); }
article h3.nonum::before { content: none; }
article p, article li { max-width: 68ch; }
article ul, article ol { padding-left: 1.3em; }
article li + li { margin-top: 4px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }

/* étapes numérotées (comme les supports modèles) */
ol.steps { list-style: none; padding: 0; counter-reset: st; display: grid; gap: 14px; }
ol.steps > li { counter-increment: st; position: relative; padding-left: 42px; margin: 0; min-height: 28px; }
ol.steps > li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; font: 600 .8rem var(--f-mono); }

/* encadrés */
.aside { border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; padding: 14px 18px; margin: 22px 0; }
.aside > :first-child { margin-top: 0; }
.aside > :last-child { margin-bottom: 0; }
.aside-title { font-weight: 700; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
.aside-title::before { font: 700 .75rem var(--f-mono); padding: 1px 7px; border-radius: 99px; background: var(--surface); }
.aside.tip { border-color: var(--ok); background: var(--ok-soft); }
.aside.tip .aside-title::before { content: "ASTUCE"; color: var(--ok); }
.aside.note { border-color: var(--accent); }
.aside.note .aside-title::before { content: "NOTE"; color: var(--accent); }
.aside.caution { border-color: var(--mid); background: var(--mid-soft); }
.aside.caution .aside-title::before { content: "IMPORTANT"; color: var(--mid); }
.aside.next { border-color: var(--muted); background: var(--surface-2); }
.aside.next .aside-title::before { content: "LA SUITE"; color: var(--muted); }

/* définition : une fiche de vocabulaire */
.def { margin: 22px 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 18px; box-shadow: var(--shadow); }
.def dt { font: 700 1.05rem var(--f-display); color: var(--accent); }
.def dt small { font: 600 .72rem var(--f-mono); color: var(--muted); margin-left: 8px; letter-spacing: .05em; text-transform: uppercase; }
.def dd { margin: 4px 0 0; }
.def dd + dt { margin-top: 12px; }

/* schéma relationnel et dépendances */
.schema, .dfl {
  font-family: var(--f-mono); font-size: .93rem; line-height: 1.7;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px; margin: 14px 0; overflow-x: auto; white-space: nowrap; max-width: 100%;
}
.schema.stack, .dfl.stack { white-space: normal; }
.schema.stack > div, .dfl.stack > div { white-space: nowrap; }
.schema b, .dfl b { color: var(--accent); }
u, .pk { text-decoration: underline; text-decoration-color: var(--key); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.fk { color: var(--key); font-weight: 600; }
.dfa { display: inline-flex; align-items: center; margin: 0 .5ch; vertical-align: middle; color: var(--muted); font: 600 .7rem var(--f-mono); }
.dfa::before { content: ""; width: 1.4em; border-top: 1.5px solid currentColor; }
.dfa > span { padding: 0 3px; }
.dfa > i { display: inline-block; width: 1.6em; height: 0; border-top: 1.5px solid currentColor; position: relative; }
.dfa > i::after { content: ""; position: absolute; right: -2px; top: -5.25px; border-left: 8px solid currentColor; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
.ok-t { color: var(--ok); font-weight: 700; }
.ko-t { color: var(--ko); font-weight: 700; }

/* tables de données */
.tables { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; margin: 16px 0; }
.tbl { min-width: 0; max-width: 100%; overflow-x: auto; }
.tbl-name { margin: 0 0 4px; font: 700 .8rem var(--f-mono); letter-spacing: .06em; color: var(--muted); }
table.data { border-collapse: separate; border-spacing: 0; font-size: .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
table.data th, table.data td { padding: 6px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data th { font: 600 .78rem var(--f-mono); background: var(--surface-2); letter-spacing: .02em; }
table.data td { font-variant-numeric: tabular-nums; }
table.data td.null { color: var(--muted); font: italic .8rem var(--f-mono); }
table.data td.num, table.data th.num { color: var(--muted); font: .75rem var(--f-mono); text-align: right; width: 2.5em; }
table.data tr.hl td { background: var(--mid-soft); }
table.wide { width: 100%; }
.tbl-wrap { overflow-x: auto; max-width: 100%; margin: 14px 0; }
.tbl-wrap > table.data { min-width: 100%; }

/* carte mentale (vue d'ensemble) */
.carte { margin: 8px 0 26px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow-x: auto; }
.carte-in { display: flex; align-items: center; gap: 0; min-width: max-content; }
.carte-root { font: 700 1.05rem var(--f-display); padding: 10px 16px; border-radius: 10px; background: var(--accent); color: var(--surface); }
.carte ul { list-style: none; margin: 0; padding: 0 0 0 28px; position: relative; display: grid; gap: 8px; }
.carte ul::before { content: ""; position: absolute; left: 0; top: 50%; width: 28px; border-top: 2px solid var(--line); }
.carte li { position: relative; padding-left: 22px; margin: 0; max-width: none; }
.carte li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 2px solid var(--line); }
.carte li:first-child::before { top: 50%; }
.carte li:last-child::before { bottom: 50%; }
.carte li:only-child::before { display: none; }
.carte li::after { content: ""; position: absolute; left: 0; top: 50%; width: 22px; border-top: 2px solid var(--line); }
.carte li > span { display: inline-block; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: .92rem; line-height: 1.3; }
.carte li > span b { color: var(--accent); }

/* facture (exemple de document métier) */
.facture { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 18px 20px; margin: 18px 0; box-shadow: var(--shadow); font-size: .92rem; }
.facture header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; border-bottom: 2px dashed var(--line); padding-bottom: 10px; margin-bottom: 12px; }
.facture h4 { margin: 0; font: 700 1.1rem var(--f-display); letter-spacing: .08em; }
.facture .meta { font-family: var(--f-mono); font-size: .82rem; color: var(--muted); }
.facture .total td { font-weight: 700; }

/* niveaux d'exercice */
details.task { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin: 16px 0; box-shadow: var(--shadow); }
details.task > summary { cursor: pointer; list-style: none; padding: 14px 18px; display: flex; gap: 12px; align-items: center; font: 700 1.05rem var(--f-display); }
details.task > summary::-webkit-details-marker { display: none; }
details.task > summary::after { content: "+"; margin-left: auto; font: 600 1.2rem var(--f-mono); color: var(--muted); }
details.task[open] > summary::after { content: "−"; }
details.task > summary .lvl { font: 600 .7rem var(--f-mono); padding: 3px 8px; border-radius: 99px; letter-spacing: .04em; white-space: nowrap; }
.lvl1 .lvl { background: var(--ok-soft); color: var(--ok); }
.lvl2 .lvl { background: var(--accent-soft); color: var(--accent); }
.lvl3 .lvl { background: var(--key-soft); color: var(--key); }
details.task > .task-body { padding: 0 18px 18px; border-top: 1px solid var(--line); }

/* ---------- composants interactifs ---------- */
.btn { cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: 9px; font-size: .9rem; font-weight: 700; line-height: 1.2; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover:not(:disabled) { color: var(--surface); filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); font-weight: 600; }
.btn.small { padding: 4px 9px; font-size: .8rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.note-line { font-size: .84rem; color: var(--muted); }

/* quiz */
.quiz { margin: 22px 0; }
.qz { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.qz-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.qz-title { margin: 0; font: 700 1.02rem var(--f-display); }
.qz-badge { font: 600 .75rem var(--f-mono); background: var(--surface-2); border-radius: 99px; padding: 3px 9px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.qz-body { padding: 18px 20px; }
.qz-q { font-weight: 700; margin: 0 0 14px; }
.qz-opts { display: grid; gap: 8px; }
.qz-opt { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; text-align: left; cursor: pointer; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: .95rem; line-height: 1.45; }
.qz-opt .l { font: 700 .75rem/1.9 var(--f-mono); color: var(--muted); }
.qz-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.qz-opt:disabled { cursor: default; }
.qz-opt.good { border-color: var(--ok); background: var(--ok-soft); }
.qz-opt.bad { border-color: var(--ko); background: var(--ko-soft); }
.qz-opt.good .l, .qz-opt.bad .l { color: var(--fg); }
.qz-hint { margin-top: 12px; }
.qz-hint-box, .hint-box { margin-top: 8px; padding: 10px 14px; border-radius: 10px; background: var(--mid-soft); font-size: .92rem; }
.qz-fb { margin-top: 14px; padding: 12px 16px; border-radius: 10px; font-size: .94rem; }
.qz-fb.good { background: var(--ok-soft); }
.qz-fb.bad { background: var(--ko-soft); }
.qz-fb > strong { display: block; margin-bottom: 4px; }
.qz-fb.good > strong { color: var(--ok); }
.qz-fb.bad > strong { color: var(--ko); }
.qz-fb p { margin: 6px 0 0; }
.qz-foot { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2); }
.qz-track { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.qz-track > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.qz-score { font: 700 2.2rem var(--f-display); margin: 0; font-variant-numeric: tabular-nums; }
.qz-recap { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; font-size: .9rem; }
.qz-recap li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; max-width: none; margin: 0; }

/* réponse rédigée */
.answer { margin: 18px 0 26px; }
.ans { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.ans-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.ans-tag { font: 600 .74rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.ans-saved { font-size: .78rem; color: var(--muted); }
.ans-body { padding: 14px 16px; display: grid; gap: 10px; }
.ans textarea { width: 100%; resize: vertical; min-height: 4.5em; font: .95rem/1.55 var(--f-body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.ans.k-schema textarea { font-family: var(--f-mono); font-size: .88rem; }
.ans textarea:focus, .te input:focus, .field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.ans-syntax { font-size: .8rem; color: var(--muted); }
.ans-syntax code { font-size: .78rem; }
.ans-preview { font-family: var(--f-mono); font-size: .88rem; padding: 8px 12px; border-radius: 10px; border: 1px dashed var(--line); white-space: pre-wrap; overflow-x: auto; min-height: 2.4em; }
.ans-preview:empty::before { content: "Aperçu de la notation…"; color: var(--muted); font-style: italic; }
.ans-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ans-corr { border-top: 1px solid var(--line); padding: 14px 16px; background: var(--ok-soft); }
.ans-corr-title { margin: 0 0 6px; font: 700 .78rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ok); }
.ans-corr > :last-child { margin-bottom: 0; }
.ans-corr .schema, .ans-corr .dfl, .ans-corr table.data { background: var(--surface); }
.ans-self { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 8px; border-radius: 0 0 14px 14px; }
.ans-self p { margin: 0; font-size: .9rem; font-weight: 700; }
.self-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.self-btn { cursor: pointer; border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 99px; font-size: .88rem; font-weight: 700; }
.self-btn[aria-pressed="true"].s-ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.self-btn[aria-pressed="true"].s-mid { background: var(--mid); border-color: var(--mid); color: var(--surface); }
.self-btn[aria-pressed="true"].s-ko { background: var(--ko); border-color: var(--ko); color: var(--surface); }
.self-btn.s-ok:hover { border-color: var(--ok); }
.self-btn.s-mid:hover { border-color: var(--mid); }
.self-btn.s-ko:hover { border-color: var(--ko); }

/* éditeur de tables */
.te { display: grid; gap: 12px; }
.te-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); min-width: 0; }
.te-name { font: 700 .85rem var(--f-mono); width: min(100%, 22ch); padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--fg); text-transform: uppercase; }
.te-scroll { overflow-x: auto; margin: 8px 0; }
.te table { border-collapse: collapse; }
.te th, .te td { border: 1px solid var(--line); padding: 0; background: var(--surface); }
.te th { background: var(--surface-2); vertical-align: top; }
.te input.c { font: .82rem var(--f-mono); width: 16ch; border: 0; padding: 6px 7px; background: transparent; color: var(--fg); }
.te th input.c { font-weight: 600; }
.te th.is-pk input.c { text-decoration: underline; text-decoration-color: var(--key); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.te-flags { display: flex; gap: 4px; padding: 0 5px 5px; }
.te-flag { cursor: pointer; font: 600 .65rem var(--f-mono); padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.te-flag[aria-pressed="true"] { background: var(--key); border-color: var(--key); color: var(--surface); }
.te-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.te-links { display: grid; gap: 4px; font-size: .85rem; }
.te-links input { font: .85rem var(--f-mono); padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }

/* tableau à cocher (OUI / NON…) */
.ctab, .match, .pick { margin: 18px 0 26px; }
.ck { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.ck-head { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.ck-scroll { overflow-x: auto; }
.ck table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.ck th, .ck td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.ck th { font: 600 .74rem var(--f-mono); background: var(--surface-2); letter-spacing: .03em; white-space: nowrap; }
.ck td.lab { min-width: 14em; }
.ck td.cell { white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { cursor: pointer; border: 0; background: var(--surface); padding: 5px 10px; font: 600 .78rem var(--f-mono); color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.seg button:disabled { cursor: not-allowed; opacity: .4; }
td.cell.good .seg { outline: 2px solid var(--ok); outline-offset: 2px; }
td.cell.bad .seg { outline: 2px solid var(--ko); outline-offset: 2px; }
td.cell .mark, .m-row .mark { font: 700 .8rem var(--f-mono); margin-left: 6px; }
.good .mark { color: var(--ok); }
.bad .mark { color: var(--ko); }
tr.ck-expl td { background: var(--surface-2); font-size: .86rem; color: var(--fg); padding-top: 6px; }
.ck-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: var(--surface-2); }
.ck-msg { font-size: .9rem; font-weight: 700; }
.ck-msg.good { color: var(--ok); }
.ck-msg.bad { color: var(--ko); }
.ck-msg.mid { color: var(--mid); }
.ck-after { padding: 12px 16px; border-top: 1px solid var(--line); background: var(--ok-soft); font-size: .93rem; }
.ck-after > :first-child { margin-top: 0; }
.ck-after > :last-child { margin-bottom: 0; }

.m-list { display: grid; }
.m-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(12rem, 16rem); gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.m-row select { font: inherit; font-size: .88rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; }
.m-row.good select { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
.m-row.bad select { border-color: var(--ko); box-shadow: 0 0 0 1px var(--ko); }
.m-row .m-expl { grid-column: 1 / -1; font-size: .85rem; background: var(--surface-2); padding: 6px 10px; border-radius: 8px; }

.pick tbody tr { cursor: pointer; }
.pick tbody tr:hover td { background: var(--accent-soft); }
.pick tbody tr.picked td { background: var(--accent-soft); box-shadow: inset 0 0 0 0 transparent; }
.pick tbody tr.picked td:first-child { box-shadow: inset 4px 0 0 var(--accent); }
.pick tbody tr.p-good td { background: var(--ok-soft); }
.pick tbody tr.p-bad td { background: var(--ko-soft); }
.pick tbody tr.p-miss td { background: var(--mid-soft); }
.pick tbody tr.p-good td:first-child { box-shadow: inset 4px 0 0 var(--ok); }
.pick tbody tr.p-bad td:first-child { box-shadow: inset 4px 0 0 var(--ko); }
.pick tbody tr.p-miss td:first-child { box-shadow: inset 4px 0 0 var(--mid); }
.pick .ck-scroll { padding: 12px 16px; }
.pick table.data { width: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

/* progression de la page */
.page-progress { margin: 48px 0 0; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); display: grid; gap: 10px; }
.page-progress p { margin: 0; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.bar.full > span { background: var(--ok); }

/* navigation de séquence */
.seq { margin-top: 28px; display: grid; gap: 12px; }
.seq-progress { font-size: .85rem; color: var(--muted); margin: 0; }
.seq-links { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seq-link { display: grid; gap: 2px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--fg); background: var(--surface); }
.seq-link:hover { border-color: var(--accent); }
.seq-link.next { text-align: right; grid-column: 2; }
.seq-dir { font-size: .8rem; color: var(--muted); }
.seq-title { font-weight: 700; color: var(--accent); line-height: 1.3; }

/* champs (accueil / bilan) */
.field { display: grid; gap: 4px; }
.field label { font-size: .85rem; font-weight: 700; }
.field input, .field textarea, .field select { font: inherit; font-size: .95rem; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; }
.field textarea { font: .82rem/1.45 var(--f-mono); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 12px; margin: 14px 0; }
.panel { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 16px 18px; margin: 18px 0; box-shadow: var(--shadow); }
.panel > :first-child { margin-top: 0; }
.panel > :last-child { margin-bottom: 0; }

.parcours { list-style: none; padding: 0; margin: 18px 0; display: grid; gap: 8px; }
.parcours li { max-width: none; margin: 0; }
.parcours a { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; color: var(--fg); }
.parcours a:hover { border-color: var(--accent); }
.parcours .k { font: 600 .74rem var(--f-mono); color: var(--muted); letter-spacing: .03em; }
.parcours .k.tp { color: var(--key); }
.parcours .t { font-weight: 700; line-height: 1.3; }
.parcours .t small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 12px; margin: 16px 0; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.stat b { display: block; font: 700 1.7rem var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: .82rem; color: var(--muted); }
.bilan-tbl td, .bilan-tbl th { white-space: nowrap; }
.bilan-tbl td:first-child { white-space: normal; min-width: 12em; }
.revoir { display: grid; gap: 6px; padding-left: 1.2em; }
.chip { display: inline-block; font: 600 .7rem var(--f-mono); padding: 1px 7px; border-radius: 99px; margin-right: 6px; }
.chip.ko { background: var(--ko-soft); color: var(--ko); }
.chip.mid { background: var(--mid-soft); color: var(--mid); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .9rem; }

/* ---------- responsive ---------- */
@media (max-width: 1240px) {
  .page-grid { grid-template-columns: minmax(0, 46rem); }
  .notices { max-width: 46rem; }
  .toc { display: none; }
}
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-block; }
  .sidebar { position: fixed; z-index: 45; top: calc(var(--top) + env(safe-area-inset-top, 0px)); left: 0; width: min(86vw, 320px); transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow); }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 25, .4); }
  .who { display: none; }
}
@media (max-width: 560px) {
  body { font-size: 16px; }
  .brand small { display: none; }
  .brand { font-size: 1.05rem; }
  .topbar { gap: 8px; }
  .theme-sel { display: none; }
  .brand span { display: none; }
  .seq-links { grid-template-columns: 1fr; }
  .seq-link.next { grid-column: 1; }
  .parcours a { grid-template-columns: minmax(0, 1fr) auto; }
  .parcours .k { grid-column: 1 / -1; }
  .m-row { grid-template-columns: minmax(0, 1fr); }
  .qz-body, .qz-head, .qz-foot { padding-left: 14px; padding-right: 14px; }
  .carte-in { flex-direction: column; align-items: flex-start; min-width: 0; gap: 10px; }
  .carte ul { padding-left: 14px; }
  .carte ul::before { display: none; }
  .carte li > span { white-space: normal; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}

/* ---------- fichier unique : démarrage, entraînement, rappel ---------- */
.mono { font-family: var(--f-mono); letter-spacing: .03em; }
.qz-badge.train { background: var(--mid-soft); color: var(--mid); }
.qz-first, .qz-first-inline { font-size: .84rem; color: var(--muted); }
.qz-first { padding: 8px 20px; border-top: 1px solid var(--line); }
.panel.start { border-width: 2px; border-color: var(--accent); display: grid; gap: 10px; }
.panel.start.ok { border-color: var(--ok); }
.panel.start p { margin: 0; }
.panel.start hr { margin: 6px 0; }
.start-step { font: 600 .74rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.panel.start.ok .start-step { color: var(--ok); }
.start-who { font: 700 1.3rem var(--f-display); margin: 0; }
.panel.start .fields { margin: 0; }
.ident-edit summary { cursor: pointer; font-size: .88rem; color: var(--muted); }
.ident-edit[open] { display: grid; gap: 10px; }
.notice.gate { margin-top: 10px; }
a.btn { text-decoration: none; display: inline-block; }
.remind {
  position: fixed; z-index: 70; max-width: min(26rem, calc(100vw - 32px));
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border: 2px solid var(--mid); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); font-size: .92rem;
  display: grid; gap: 8px;
}
.remind p { margin: 0; }
.notices:empty, .notices[hidden] { display: none; }

/* ---------- code (SQL, C#, PHP…) ---------- */
pre.code { font: .86rem/1.55 var(--f-mono); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 14px 0; }
pre.code.terminal { background: #10151f; color: #dce3f0; border-color: #10151f; }
pre.code .kw { color: var(--accent); font-weight: 600; }
pre.code.terminal .kw { color: #93a6ff; }
.ans.k-code textarea { font-family: var(--f-mono); font-size: .88rem; tab-size: 4; }

/* ---------- Ajouts du chapitre 2 (réseaux) ---------- */
.answer, .ans-prompt, .task-body { min-width: 0; }
.ans-prompt pre.code { max-width: 100%; overflow-x: auto; }
pre.code .cm { color: var(--muted); font-style: italic; }
pre.code .pr { color: var(--ok); font-weight: 600; }
pre.code .st { color: var(--key); }
pre.code .hl { background: var(--mid-soft); color: var(--fg); border-radius: 3px; }
figure.fig { margin: 1.4rem 0; padding: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
figure.fig svg { display: block; width: 100%; height: auto; max-width: 760px; margin: 0 auto; }
figure.fig figcaption { margin-top: .6rem; font-size: .88rem; color: var(--muted); text-align: center; }
figure.fig svg text { fill: var(--fg); font-family: var(--f-body); font-size: 13px; }
figure.fig svg text.sm { font-size: 11px; fill: var(--muted); }
figure.fig svg text.b { font-weight: 700; }
figure.fig svg .ln { stroke: var(--muted); stroke-width: 2; fill: none; }
figure.fig svg .ln-acc { stroke: var(--accent); stroke-width: 2.5; fill: none; }
figure.fig svg .bx { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; }
figure.fig svg .bx-acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
figure.fig svg .bx-key { fill: var(--key-soft); stroke: var(--key); stroke-width: 1.5; }
figure.fig svg .bx-ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.5; }
figure.fig svg .bx-mid { fill: var(--mid-soft); stroke: var(--mid); stroke-width: 1.5; }
figure.fig svg .dot { fill: var(--accent); }
.encap { display: grid; gap: 6px; font-family: var(--f-mono); font-size: .8rem; margin: 1rem 0; }
.encap > div { display: flex; align-items: stretch; gap: 0; overflow-x: auto; }
.encap .lab { flex: 0 0 8.5rem; font-family: var(--f-body); font-size: .85rem; color: var(--muted); padding: .35rem .5rem .35rem 0; }
.encap span { padding: .35rem .55rem; border: 1px solid var(--line); white-space: nowrap; }
.encap span + span { border-left: 0; }
.encap .h2l { background: var(--key-soft); } .encap .h3l { background: var(--accent-soft); }
.encap .h4l { background: var(--ok-soft); } .encap .d7 { background: var(--surface-2); flex: 1 0 auto; }
.encap .t2l { background: var(--key-soft); }
table.data.bits td, table.data.bits th { text-align: center; font-family: var(--f-mono); padding-left: .45rem; padding-right: .45rem; }
table.data td.hl, table.data th.hl { background: var(--mid-soft); }
table.data td.mono, .mono { font-family: var(--f-mono); }
.dl-cap { display: inline-flex; align-items: center; gap: .5rem; padding: .55rem .9rem; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; text-decoration: none; }
.dl-cap:hover { background: var(--accent); color: #fff; }
.aside.deep { border-color: var(--accent); background: var(--accent-soft); }
.aside.deep .aside-title::before { content: "EN PROFONDEUR"; color: var(--accent); }
.aside.pro { border-color: var(--key); background: var(--key-soft); }
.aside.pro .aside-title::before { content: "EN ENTREPRISE"; color: var(--key); }
.refco { font-size: .88rem; color: var(--muted); }
@media (max-width: 600px) {
  .encap > div { flex-wrap: wrap; }
  .encap .lab { flex-basis: 100%; padding-bottom: 0; }
}
ol.steps, ol.steps > li { min-width: 0; max-width: 100%; }

<template data-page="accueil">
<p class="eyebrow"><span class="kind" data-cfg="level">BTS SIO</span><span data-cfg="chapter"></span></p>
<h1 data-cfg="title">Titre du cours</h1>
<p class="lead"><span data-cfg="lead"></span> Chaque activité se corrige seul : répondre, comparer, s’auto-évaluer.</p>

<div class="aside caution">
  <p class="aside-title">À lire avant tout</p>
  <p><strong>Fermer le navigateur sans avoir sauvegardé, c’est risquer de perdre son travail.</strong> Les réponses sont gardées par le navigateur tant qu’il le veut bien : un autre poste, un poste du lycée réinitialisé ou un navigateur qui efface ses données suffisent à tout perdre. Seul le <strong>fichier de sauvegarde</strong> est sûr.</p>
</div>

<h2>Commencer</h2>
<p>Avant d’accéder au cours : saisir son identité, puis créer son fichier de sauvegarde. Si le travail a déjà commencé ailleurs, ouvrir son dernier fichier de sauvegarde.</p>
<div id="start" data-widget="start"></div>

<h2>Sauvegarder et reprendre son travail</h2>
<div class="tables">
  <div class="panel" style="flex:1 1 19rem;margin:0">
    <p class="tbl-name">AU LYCÉE</p>
    <ol class="steps">
      <li>Ouvrir <code>index.html</code> dans le dossier du chapitre (fichier récupéré sur Teams ou GitHub, jamais directement dans le .zip).</li>
      <li>Si le travail n’apparaît plus (autre poste, navigateur effacé) : « Ouvrir mon fichier de sauvegarde ».</li>
      <li>Pendant la séance, le bouton <strong>Sauvegarder</strong> (en haut de l’écran) devient bleu dès qu’il y a du nouveau. Un rappel apparaît après 20 minutes sans sauvegarde.</li>
      <li>En fin de séance : <strong>Sauvegarder</strong>, puis ranger le fichier téléchargé (dossier <em>Téléchargements</em>) dans OneDrive, Teams, sur une clé USB ou dans son dépôt GitHub.</li>
    </ol>
  </div>
  <div class="panel" style="flex:1 1 19rem;margin:0">
    <p class="tbl-name">À L’INTERNAT OU À LA MAISON</p>
    <ol class="steps">
      <li>Récupérer le cours (<code>index.html</code>) sur Teams ou GitHub et l’enregistrer sur l’ordinateur.</li>
      <li>Récupérer son dernier fichier de sauvegarde.</li>
      <li>Ouvrir <code>index.html</code>, puis « Ouvrir mon fichier de sauvegarde ».</li>
      <li>Travailler, puis <strong>Sauvegarder</strong> et ranger le nouveau fichier pour la séance suivante.</li>
    </ol>
  </div>
</div>
<div class="aside tip">
  <p class="aside-title">Toujours repartir du fichier le plus récent</p>
  <p>La date et l’heure figurent dans le nom du fichier (par exemple <code>sauvegarde-reseaux-ch5-lea-martin-2027-03-10-11h45.json</code>). Si l’on ouvre un fichier plus ancien que le travail en cours, le cours prévient avant de remplacer quoi que ce soit.</p>
</div>

<h2>Mode d’emploi</h2>
<ol class="steps">
  <li>Suivre le parcours dans l’ordre : chaque partie s’appuie sur la précédente, et les TP arrivent au moment où les notions nécessaires ont été vues.</li>
  <li>Lire le cours, répondre aux questions au fil de la page, puis faire le quiz « Vérifier ses connaissances ».</li>
  <li>Pour chaque réponse rédigée, écrire sa propre réponse avant de demander la correction : le bouton « Comparer avec la correction » ne s’active qu’ensuite.</li>
  <li>Comparer, puis s’auto-évaluer : <span class="chip ok">Réussi</span><span class="chip mid">En partie</span><span class="chip ko">À revoir</span></li>
  <li>Terminer par le bilan : il liste les points à revoir et produit le compte rendu à rendre.</li>
</ol>

<h2>Les types d’activités</h2>
<dl class="def">
  <dt>Quiz</dt><dd>Questions à choix multiple, avec indice et explication après chaque réponse.</dd>
  <dt>Activité auto-corrigée</dt><dd>Tableaux à cocher, associations, lignes à repérer dans une capture ou une table : la vérification est immédiate, avec une explication pour chaque ligne.</dd>
  <dt>Réponse rédigée</dt><dd>Calculs d’adressage, plans d’adressage, commandes, explications et diagnostics. La correction se débloque après la rédaction ; l’auto-évaluation termine l’activité. Pour un calcul, <strong>poser le calcul</strong> (binaire, taille de bloc) : c’est la méthode qui est corrigée, pas seulement le résultat.</dd>
  <dt>La première tentative fait foi</dt><dd>Pour les quiz et les activités auto-corrigées, le premier résultat est retenu dans le bilan. Il est ensuite possible de recommencer autant de fois que l’on veut, en mode <span class="qz-badge train">Entraînement</span>, sans changer ce résultat.</dd>
  <dt>Niveaux d’exercice</dt><dd><span class="chip ok">essentiel</span> pour tous, <span class="chip" style="background:var(--accent-soft);color:var(--accent)">intermédiaire</span> pour consolider, <span class="chip" style="background:var(--key-soft);color:var(--key)">défi</span> pour aller plus loin.</dd>
  <dt>Encadrés « En profondeur » et « En entreprise »</dt><dd>Ils expliquent le pourquoi des choses (histoire, normes, fonctionnement interne) et la réalité du terrain. Ils ne sont pas évalués, mais ce sont eux qui permettent de comprendre au lieu d’apprendre par cœur, et de savoir réexpliquer une notion à quelqu’un.</dd>
</dl>

<h2>Les outils du chapitre</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Outil</th><th>Usage dans ce chapitre</th><th>Où</th></tr>
  <tr><td>Windows Server 2019 (SRV-WIN)</td><td>Contrôleur du domaine <code>m2l.lan</code> : Active Directory, DNS, DHCP, stratégies de groupe ; scripts PowerShell ; Observateur d’événements ; Sauvegarde Windows Server.</td><td>Machine virtuelle, réseau interne <code>tp5</code>.</td></tr>
  <tr><td>Poste client Windows 10 ou 11 (PC-CLIENT)</td><td>Joint au domaine pour tester l’ouverture de session et les stratégies de groupe. Édition Professionnel ou Éducation obligatoire (l’édition Famille ne peut pas rejoindre un domaine).</td><td>Machine virtuelle, réseau interne <code>tp5</code>.</td></tr>
  <tr><td>Debian (SRV-DEB)</td><td>Scripts Bash, journaux <code>journalctl</code>, sauvegarde avec <code>tar</code>.</td><td>Machine virtuelle (DMZ du TP 12 ou réseau <code>tp5</code>).</td></tr>
  <tr><td>GLPI</td><td>Gestion des tickets, du parc et de la base de connaissances (TP 15).</td><td>Instance fournie par l’enseignant.</td></tr>
  <tr><td>Éditeurs</td><td>PowerShell ISE ou Visual Studio Code pour les scripts PowerShell ; <code>nano</code> ou VS Code pour Bash.</td><td>Machines virtuelles, postes.</td></tr>
</table></div>
<div class="aside caution">
  <p class="aside-title">Prendre un instantané avant chaque TP</p>
  <p>La promotion d’un contrôleur de domaine, un script qui crée des comptes en masse ou une restauration modifient profondément un serveur. Avant chaque TP : un instantané VirtualBox de chaque machine virtuelle. Et toujours tester un script en mode simulation avant de l’exécuter « pour de vrai » : c’est une règle professionnelle.</p>
</div>

<div class="aside note">
  <p class="aside-title">Règles du jeu</p>
  <ul>
    <li><strong>Travail individuel et sans IA</strong> : administrer un annuaire, écrire un script, lire un journal et traiter un ticket sont des gestes quotidiens du métier. L’IA pourra plus tard aider à écrire des scripts, à condition de savoir les lire, les tester et les corriger : c’est ce que ce chapitre construit.</li>
    <li>Les commandes sont à <strong>taper</strong>, pas à copier-coller : c’est en les tapant qu’on les retient et qu’on comprend leurs paramètres.</li>
    <li>Le compte rendu contient un <strong>journal horodaté</strong> : tentatives, corrections consultées (et combien de temps après le début de la rédaction), réponses modifiées après la correction, changements d’auto-évaluation, sauvegardes et restaurations.</li>
    <li>Chaque étudiant reçoit un <strong>identifiant personnel</strong> qui figure sur toutes les pages et sur le compte rendu. Le fichier de sauvegarde est personnel : ne pas le partager.</li>
  </ul>
</div>

<h2>Le fil rouge : administrer la M2L au quotidien</h2>
<p>Le contexte <strong>M2L</strong> du Réseau Certa précise que les postes de l’administration et de la salle multimédia sont intégrés à un annuaire central, que le serveur d’annuaire assure aussi le DHCP, qu’un NAS sauvegarde les données de l’administration et des ligues, que les postes ont un agent d’inventaire, et que le service informatique gère les demandes des ligues. Ce chapitre met en place ces outils : le domaine <code>m2l.lan</code> sur SRV-WIN, la création automatisée des comptes des ligues, la surveillance, la sauvegarde, et l’assistance avec GLPI.</p>
<p class="refco">Public : tronc commun (SISR et SLAM) ; les parties sur les scripts, les journaux et les incidents concernent aussi le bloc 2 SISR (B2.3). Prérequis : chapitres 2 et 3 (SRV-WIN avec DNS et DHCP, SRV-DEB, réseau de test <code>192.168.50.0/26</code>).</p>

<h2>Compétences travaillées</h2>
<ul class="refco">
  <li><strong>B1.1</strong> Gérer le patrimoine informatique : recenser les ressources, mettre en place et vérifier les niveaux d’habilitation, gérer des sauvegardes.</li>
  <li><strong>B1.2</strong> Répondre aux incidents et aux demandes : collecter, suivre et orienter des demandes ; méthodes de diagnostic ; base de connaissances ; langage de commande et script.</li>
  <li><strong>B2.3 SISR</strong> Exploiter, dépanner : automatiser des tâches d’administration, gérer des indicateurs et des fichiers d’activité, réagir face à un incident ou à un problème.</li>
  <li><strong>B3.3</strong> Gérer les accès et les privilèges, vérifier l’efficacité de la protection (traçabilité, journaux).</li>
</ul>

<template data-page="p1">
<h1>L’annuaire et l’authentification centralisée</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : chapitre 3 (DNS, enregistrements SRV, comptes locaux et partage SMB du TP 9). Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Active Directory</div><ul>
  <li><span><b>Annuaire</b> : objets, attributs, LDAP, noms distinctifs</span></li>
  <li><span><b>Domaine</b> : contrôleurs, DNS, Kerberos</span></li>
  <li><span><b>Objets</b> : utilisateurs, groupes, ordinateurs, unités d’organisation</span></li>
  <li><span><b>Droits</b> : la méthode AGDLP</span></li>
  <li><span><b>Stratégies de groupe</b> : configurer des centaines de postes</span></li>
</ul></div></figure>

<p class="lead">Au TP 9, deux comptes locaux ont été créés sur SRV-WIN pour le partage de la ligue de volley. Avec 24 ligues, des dizaines de postes et plusieurs serveurs, il faudrait créer chaque compte sur chaque machine et changer chaque mot de passe partout. Un <strong>annuaire</strong> centralise les comptes : une personne, un compte, un mot de passe, valables sur tout le réseau. Dans le monde Windows, c’est <strong>Active Directory</strong>.</p>

<h2>Qu’est-ce qu’un annuaire ?</h2>
<p>Un <strong>annuaire</strong> est une base de données <strong>hiérarchique</strong>, optimisée pour la lecture, qui décrit les <strong>objets</strong> d’une organisation (personnes, groupes, ordinateurs, imprimantes) et leurs <strong>attributs</strong> (nom, prénom, fonction, téléphone, mot de passe, appartenance à des groupes…). Les applications l’interrogent avec le protocole <strong>LDAP</strong> (<em>Lightweight Directory Access Protocol</em>, TCP 389, ou 636 chiffré en LDAPS).</p>
<p>Chaque objet est désigné par un <strong>nom distinctif</strong> (<em>Distinguished Name</em>, DN), qui décrit son chemin dans l’arbre, de l’objet vers la racine :</p>
<pre class="code">CN=Lea Martin,OU=Volley,OU=Ligues,OU=M2L,DC=m2l,DC=lan
│              │         │         │      └──────────── le domaine m2l.lan
│              │         │         └─ unité d’organisation M2L
│              │         └─ unité d’organisation Ligues
│              └─ unité d’organisation Volley
└─ nom commun de l’objet (Common Name)</pre>
<p>Annuaires courants : <strong>Active Directory</strong> (Microsoft, le plus répandu en entreprise), OpenLDAP (libre), Samba en mode contrôleur de domaine (libre, compatible Active Directory), Microsoft Entra ID (l’annuaire en ligne de Microsoft 365).</p>

<h2>Le domaine Active Directory</h2>
<dl class="def">
  <dt>Domaine</dt><dd>Ensemble d’utilisateurs, de groupes et d’ordinateurs qui partagent le même annuaire et les mêmes règles de sécurité. Il a un nom DNS (<code>m2l.lan</code>) et un nom court, dit NetBIOS (<code>M2L</code>) : on se connecte en <code>M2L\lea.martin</code> ou <code>lea.martin@m2l.lan</code>.</dd>
  <dt>Contrôleur de domaine (DC)</dt><dd>Serveur qui héberge l’annuaire et authentifie les utilisateurs et les ordinateurs. On en installe <strong>au moins deux</strong>, qui se répliquent : sans contrôleur joignable, plus personne ne peut ouvrir de nouvelle session.</dd>
  <dt>Forêt, arbre</dt><dd>Plusieurs domaines peuvent être regroupés (arbres, forêt) avec des relations d’approbation. Une PME comme la M2L n’a qu’<strong>un</strong> domaine, qui forme à lui seul une forêt.</dd>
</dl>
<h3>Ce dont Active Directory a besoin</h3>
<ul>
  <li><strong>DNS</strong> : les postes trouvent les contrôleurs grâce à des enregistrements <strong>SRV</strong> (chapitre 3) comme <code>_ldap._tcp.dc._msdcs.m2l.lan</code>. Un poste dont le DNS ne pointe pas vers un serveur DNS du domaine ne peut pas rejoindre le domaine : c’est la cause n° 1 des échecs. Le DNS des contrôleurs est en général <strong>intégré à Active Directory</strong> (zones stockées et répliquées dans l’annuaire).</li>
  <li><strong>Kerberos</strong> (TCP/UDP 88) : le protocole d’authentification. Après l’ouverture de session, l’utilisateur reçoit un « ticket » qui lui permet d’accéder aux serveurs du domaine sans retaper son mot de passe (authentification unique).</li>
  <li><strong>L’heure</strong> : Kerberos refuse les machines dont l’horloge s’écarte de plus de 5 minutes de celle du contrôleur (NTP, chapitre 3).</li>
</ul>

<h2>Les objets de l’annuaire</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Objet</th><th>Rôle</th><th>À savoir</th></tr>
  <tr><td><strong>Utilisateur</strong></td><td>Une personne (ou un service) qui s’authentifie.</td><td>Identifiant d’ouverture de session (<code>sAMAccountName</code>, 20 caractères au plus) et nom principal (UPN, <code>lea.martin@m2l.lan</code>).</td></tr>
  <tr><td><strong>Groupe</strong></td><td>Regrouper des comptes pour leur donner des droits ensemble.</td><td>Type <em>sécurité</em> (droits) ou <em>distribution</em> (listes de messagerie) ; étendue <em>domaine local</em>, <em>globale</em> ou <em>universelle</em>.</td></tr>
  <tr><td><strong>Ordinateur</strong></td><td>Un poste ou un serveur membre du domaine.</td><td>Créé quand la machine rejoint le domaine ; il a son propre mot de passe, renouvelé automatiquement.</td></tr>
  <tr><td><strong>Unité d’organisation (OU)</strong></td><td>Dossier qui range les objets.</td><td>Sert à <strong>organiser</strong>, à <strong>déléguer</strong> l’administration et à <strong>appliquer des stratégies de groupe</strong>. Elle ne donne aucun droit d’accès aux fichiers.</td></tr>
</table></div>
<p>Les conteneurs créés par défaut <code>Users</code> et <code>Computers</code> ne sont pas des OU : on ne peut pas leur lier de stratégie. On crée donc sa propre arborescence et on y déplace les objets. Exemple pour la M2L :</p>
<pre class="code">m2l.lan
└── M2L
    ├── Administration      (utilisateurs de l’administration)
    ├── Ligues
    │   ├── Volley          (membres de la ligue, groupe GG_Volley)
    │   ├── Tennis
    │   └── …
    ├── Ordinateurs         (postes joints au domaine)
    └── Groupes             (groupes de domaine local des ressources)</pre>

<div class="match" data-id="m-ou-groupe" data-label="Unité d’organisation ou groupe ?" data-options="Unité d’organisation|Groupe">
  <div class="r" data-ok="Groupe" data-expl="Un droit d’accès à un dossier se donne à un groupe, jamais à une OU.">Donner aux membres de la ligue de volley le droit de modifier le dossier partagé Volley</div>
  <div class="r" data-ok="Unité d’organisation" data-expl="Les stratégies de groupe se lient à une OU (ou au domaine, à un site).">Appliquer une stratégie qui interdit le Panneau de configuration à tous les comptes des ligues</div>
  <div class="r" data-ok="Unité d’organisation" data-expl="La délégation d’administration se fait sur une OU.">Permettre au secrétaire de la ligue de tennis de réinitialiser les mots de passe des membres de sa ligue, et seulement eux</div>
  <div class="r" data-ok="Groupe" data-expl="Une personne peut être dans plusieurs groupes, mais dans une seule OU : pour un accès transversal, on utilise un groupe.">Donner à la présidente de la ligue de volley et au directeur de la M2L l’accès à un dossier commun</div>
</div>

<h2>Donner des droits : la méthode AGDLP</h2>
<p>Donner des droits directement à des utilisateurs devient vite ingérable : quand quelqu’un arrive ou part, il faut modifier les droits de chaque dossier. Microsoft recommande la méthode <strong>AGDLP</strong> :</p>
<ol class="steps">
  <li><strong>A</strong>ccounts : les comptes utilisateurs…</li>
  <li>… sont membres de groupes <strong>G</strong>lobaux, qui représentent des <strong>personnes</strong> (« les membres de la ligue de volley » : <code>GG_Volley</code>) ;</li>
  <li>… eux-mêmes membres de groupes de <strong>D</strong>omaine <strong>L</strong>ocal, qui représentent un <strong>accès à une ressource</strong> (« modifier le partage Volley » : <code>GL_Partage_Volley_M</code>) ;</li>
  <li>… auxquels on donne les <strong>P</strong>ermissions (autorisations NTFS et de partage).</li>
</ol>
<p>Avantage : l’arrivée d’un nouveau trésorier = l’ajouter au groupe <code>GG_Volley</code>, sans toucher aux dossiers. Les noms de groupes suivent une <strong>convention</strong> (GG_ pour global, GL_ pour domaine local) qui fait partie de la documentation.</p>
<div class="aside pro">
  <p class="aside-title">Deux comptes pour l’administrateur</p>
  <p>Un administrateur utilise un compte <strong>ordinaire</strong> pour son travail quotidien (messagerie, navigation) et un compte <strong>administrateur</strong> distinct (<code>adm.paul.garnier</code>), réservé aux tâches d’administration. Si son compte ordinaire est piraté (hameçonnage), l’attaquant n’obtient pas les droits sur le domaine. C’est une recommandation de base de l’ANSSI.</p>
</div>

<h2>Les stratégies de groupe (GPO)</h2>
<p>Une <strong>stratégie de groupe</strong> (<em>Group Policy Object</em>, GPO) est un ensemble de paramètres appliqués automatiquement aux ordinateurs et aux utilisateurs du domaine : règles de mots de passe, restrictions, lecteurs réseau, imprimantes, fond d’écran, installation de logiciels, paramètres de sécurité…</p>
<ul>
  <li>Une GPO a une partie <strong>Configuration ordinateur</strong> (appliquée au démarrage, quel que soit l’utilisateur) et une partie <strong>Configuration utilisateur</strong> (appliquée à l’ouverture de session, quel que soit le poste).</li>
  <li>Elle est <strong>liée</strong> à un site, au domaine ou à une OU, et s’applique aux objets qu’ils contiennent, y compris dans les sous-OU (héritage).</li>
  <li>Ordre d’application : <strong>local, site, domaine, OU</strong> (moyen mnémotechnique LSDOU). En cas de conflit, <strong>la dernière appliquée l’emporte</strong>, donc celle de l’OU la plus proche de l’objet.</li>
  <li>Les postes appliquent les stratégies au démarrage, à l’ouverture de session, puis toutes les 90 minutes environ. Pour forcer : <code>gpupdate /force</code> ; pour vérifier : <code>gpresult /r</code>.</li>
  <li>La stratégie <strong>Default Domain Policy</strong>, liée au domaine, définit la politique de mots de passe et de verrouillage des comptes.</li>
</ul>
<div class="ctab" data-id="c-gpo" data-head="Paramètre de stratégie" data-cols="Partie de la GPO" data-choices="ORDINATEUR|UTILISATEUR" data-label="Configuration ordinateur ou utilisateur">
  <div class="r" data-ok="UTILISATEUR" data-expl="Un lecteur réseau suit la personne, quel que soit le poste où elle se connecte.">Connecter le lecteur V: vers le partage de sa ligue</div>
  <div class="r" data-ok="ORDINATEUR" data-expl="Le pare-feu protège la machine, quel que soit l’utilisateur.">Activer le pare-feu Windows sur tous les postes de la salle multimédia</div>
  <div class="r" data-ok="UTILISATEUR" data-expl="Restriction de l’environnement de l’utilisateur.">Interdire l’accès au Panneau de configuration aux membres des ligues</div>
  <div class="r" data-ok="ORDINATEUR" data-expl="Un logiciel installé pour tous les utilisateurs d’un poste : configuration ordinateur.">Installer un antivirus sur tous les postes de l’administration</div>
</div>

<div class="answer" data-id="a-dn" data-kind="code" data-label="Écrire des noms distinctifs et une arborescence" data-min="100" data-rows="7">
  <p>a) Écrire le nom distinctif (DN) du compte de Thomas Le Gall, membre de la ligue de tennis, et celui de l’OU <code>Ordinateurs</code>, dans l’arborescence de la M2L ci-dessus. b) Le groupe <code>GG_Tennis</code> doit pouvoir lire et modifier le partage <code>Tennis</code> : appliquer la méthode AGDLP (groupes à créer, appartenances, permissions).</p>
  <div class="corr">
    <pre class="code">a) CN=Thomas Le Gall,OU=Tennis,OU=Ligues,OU=M2L,DC=m2l,DC=lan
   OU=Ordinateurs,OU=M2L,DC=m2l,DC=lan
b) A  : thomas.legall, chloe.fontaine, mehdi.haddad
   G  : GG_Tennis (global) contient ces comptes
   DL : GL_Partage_Tennis_M (domaine local) contient GG_Tennis
   P  : GL_Partage_Tennis_M reçoit « Modifier » (NTFS) et « Modifier » (partage)
        sur le dossier Tennis</pre>
  </div>
</div>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Configurer sur un poste un serveur DNS extérieur (celui de la box, 9.9.9.9) : le poste ne trouve plus les contrôleurs de domaine.</li>
    <li>Confondre OU et groupe : l’OU range et sert aux stratégies ; le groupe donne des droits.</li>
    <li>Laisser les comptes dans les conteneurs <code>Users</code> et <code>Computers</code>, où aucune stratégie de groupe ne peut être liée.</li>
  </ul>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p1" data-title="Annuaire et Active Directory" data-label="Quiz de fin de partie">
  <div class="q" data-ok="2">
    <p class="qt">Quel service est indispensable pour qu’un poste trouve les contrôleurs de domaine ?</p>
    <ul><li>DHCP</li><li>DNS</li><li>NTP</li><li>SMB</li></ul>
    <div class="expl"><p>Les contrôleurs sont publiés dans le DNS par des enregistrements SRV.</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Quel protocole permet d’interroger un annuaire ?</p>
    <ul><li>SMTP</li><li>HTTP</li><li>SNMP</li><li>LDAP</li></ul>
    <div class="expl"><p>LDAP, port 389 (636 en LDAPS).</p></div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Selon la méthode AGDLP, à quoi donne-t-on les permissions sur un dossier partagé ?</p>
    <ul><li>À un groupe de domaine local</li><li>Directement aux utilisateurs</li><li>À une unité d’organisation</li><li>À un groupe global contenant les utilisateurs</li></ul>
    <div class="expl"><p>Comptes → groupes globaux → groupes de domaine local → permissions.</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Une GPO liée au domaine et une GPO liée à l’OU Ligues définissent le même paramètre avec des valeurs différentes. Laquelle s’applique à un compte de l’OU Ligues ?</p>
    <ul><li>Celle du domaine</li><li>Aucune</li><li>Celle de l’OU Ligues, appliquée en dernier</li><li>La plus ancienne</li></ul>
    <div class="expl"><p>Ordre LSDOU : l’OU est appliquée après le domaine, sa valeur l’emporte.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Quelle commande force l’application immédiate des stratégies de groupe sur un poste ?</p>
    <ul><li><code>gpresult /r</code></li><li><code>gpupdate /force</code></li><li><code>ipconfig /renew</code></li><li><code>dcpromo</code></li></ul>
    <div class="expl"><p><code>gpupdate /force</code> applique ; <code>gpresult /r</code> affiche les stratégies appliquées.</p></div>
  </div>
</div>

  <p class="aside-title">La suite</p>

</div>
