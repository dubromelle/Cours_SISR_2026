<template data-page="p4">
<h1>Sauvegarder et restaurer</h1>
<p class="lead">Un disque qui lâche, un fichier supprimé par erreur, un rançongiciel qui chiffre tout le serveur de fichiers, un incendie dans la salle serveur : sans sauvegarde, les données de la M2L et des ligues seraient perdues. Une sauvegarde n’a de valeur que si l’on sait <strong>restaurer</strong> : c’est l’opération qu’on prépare, qu’on teste et qu’on documente.</p>

<div class="aside caution">
  <p class="aside-title">Règle du cours</p>
  <p>Pas d’IA. Les calculs de volume et de capacité se font à la main, en posant les étapes.</p>
</div>

<h2>Définir le besoin : RPO et RTO</h2>
<p>Avant de choisir un outil, on se pose deux questions avec les responsables de la M2L :</p>
<ul>
  <li><strong>RPO</strong> (<em>Recovery Point Objective</em>, perte de données maximale admissible) : combien de travail peut-on accepter de perdre ? Avec une sauvegarde chaque nuit, une panne à 17 h fait perdre la journée : le RPO est de 24 heures.</li>
  <li><strong>RTO</strong> (<em>Recovery Time Objective</em>, durée maximale d’interruption admissible) : en combien de temps le service doit-il être rétabli ? Restaurer 2 To depuis un service en ligne peut prendre une journée entière.</li>
</ul>
<p>Plus le RPO et le RTO sont courts, plus la solution coûte cher. Un serveur de fichiers des ligues peut accepter un RPO de 24 h ; une base de données de réservations des salles, sans doute pas.</p>
<p>On définit aussi <strong>quoi</strong> sauvegarder (données des utilisateurs, bases de données, configurations des serveurs et des équipements réseau, annuaire), <strong>combien de temps</strong> garder les sauvegardes (rétention) et <strong>qui</strong> vérifie qu’elles ont réussi.</p>

<h2>Les trois types de sauvegarde</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Type</th><th>Ce qui est copié</th><th>Avantages</th><th>Inconvénients</th></tr>
  <tr><td><strong>Complète</strong></td><td>toutes les données</td><td>restauration simple : une seule sauvegarde</td><td>longue, occupe beaucoup d’espace</td></tr>
  <tr><td><strong>Incrémentale</strong></td><td>ce qui a changé depuis la <strong>dernière sauvegarde, quelle qu’elle soit</strong></td><td>rapide, peu d’espace</td><td>restauration = la complète + <strong>toutes</strong> les incrémentales suivantes ; une incrémentale perdue casse la chaîne</td></tr>
  <tr><td><strong>Différentielle</strong></td><td>ce qui a changé depuis la <strong>dernière complète</strong></td><td>restauration = la complète + la <strong>dernière</strong> différentielle</td><td>grossit chaque jour jusqu’à la complète suivante</td></tr>
</table></div>

<div class="answer" data-id="a-volumes" data-label="Calcul des volumes de sauvegarde" data-min="200" data-rows="9">
  <p>Le serveur de fichiers de la M2L contient 100 Go. Une sauvegarde complète est faite le dimanche soir. Chaque jour, du lundi au samedi, 5 Go de fichiers <strong>différents</strong> sont modifiés. a) Avec des incrémentales du lundi au samedi : volume de chaque incrémentale et volume total de la semaine ? b) Avec des différentielles : volume de chaque différentielle et volume total ? c) Le disque tombe en panne le jeudi matin : quelles sauvegardes faut-il restaurer, dans chaque cas, et dans quel ordre ?</p>
  <div class="corr">
    <p>a) Chaque incrémentale contient les 5 Go modifiés depuis la veille : 6 × 5 = 30 Go, plus 100 Go de complète : <strong>130 Go</strong>.</p>
    <p>b) La différentielle du lundi contient 5 Go, celle du mardi 10 Go (lundi + mardi), mercredi 15, jeudi 20, vendredi 25, samedi 30. Total : 5 + 10 + 15 + 20 + 25 + 30 = 105 Go, plus 100 Go : <strong>205 Go</strong>.</p>
    <p>c) La dernière sauvegarde disponible est celle du mercredi soir. Incrémentales : la complète du dimanche, puis les incrémentales du lundi, du mardi et du mercredi, <strong>dans cet ordre</strong> (4 restaurations). Différentielles : la complète, puis la seule différentielle du mercredi (2 restaurations). Dans les deux cas, le travail du jeudi matin est perdu (RPO de 24 h).</p>
  </div>
</div>

<div class="aside deep">
  <p class="aside-title">En profondeur : la rotation GFS</p>
  <p>On ne garde pas toutes les sauvegardes indéfiniment. La rotation <strong>grand-père, père, fils</strong> (GFS) garde par exemple les sauvegardes quotidiennes (fils) pendant une semaine, les hebdomadaires (pères) pendant un mois et les mensuelles (grands-pères) pendant un an. On peut ainsi revenir à la veille comme à l’état d’il y a six mois, sans conserver 365 sauvegardes. Les logiciels de sauvegarde modernes dédupliquent aussi les données : un même bloc présent dans plusieurs sauvegardes n’est stocké qu’une fois.</p>
</div>

<h2>La règle 3-2-1</h2>
<div class="regle321" role="img" aria-label="Règle 3-2-1 : trois copies, deux supports, une copie hors site">
  <div><strong>3</strong><span>copies des données</span><small>l’original + 2 sauvegardes</small></div>
  <div><strong>2</strong><span>supports différents</span><small>disque, NAS, bande…</small></div>
  <div><strong>1</strong><span>copie hors site</span><small>autre bâtiment, en ligne</small></div>
</div>
<p>Face aux rançongiciels, qui cherchent et chiffrent aussi les sauvegardes accessibles par le réseau, on parle désormais de <strong>3-2-1-1-0</strong> : en plus, <strong>1</strong> copie hors ligne ou non modifiable (bande retirée du lecteur, stockage « immuable » qui interdit la suppression pendant une durée fixée), et <strong>0</strong> erreur lors des tests de restauration.</p>

<div class="aside pro">
  <p class="aside-title">En entreprise</p>
  <p>Lors des attaques par rançongiciel qui ont touché des hôpitaux et des collectivités françaises, les organisations qui ont redémarré le plus vite étaient celles qui disposaient de sauvegardes hors ligne <strong>et</strong> d’une procédure de restauration déjà testée. L’ANSSI recommande de tester la restauration régulièrement, pas seulement la sauvegarde. Un journal « sauvegarde réussie » ne prouve pas qu’on saura restaurer.</p>
</div>

<h2>Le RAID n’est pas une sauvegarde</h2>
<p>Le <strong>RAID</strong> (<em>Redundant Array of Independent Disks</em>) regroupe plusieurs disques pour qu’un serveur continue de fonctionner quand l’un d’eux tombe en panne. Il protège la <strong>disponibilité</strong>, pas les données : un fichier supprimé ou chiffré par un rançongiciel l’est aussitôt sur tous les disques.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Niveau</th><th>Principe</th><th>Disques au minimum</th><th>Capacité utile avec n disques de taille T</th><th>Pannes tolérées</th></tr>
  <tr><td>RAID 0</td><td>données réparties (« striping ») : rapide</td><td>2</td><td>n × T</td><td>aucune : un disque perdu, tout est perdu</td></tr>
  <tr><td>RAID 1</td><td>miroir : chaque disque contient tout</td><td>2</td><td>T</td><td>n − 1</td></tr>
  <tr><td>RAID 5</td><td>répartition avec une parité</td><td>3</td><td>(n − 1) × T</td><td>1</td></tr>
  <tr><td>RAID 6</td><td>répartition avec deux parités</td><td>4</td><td>(n − 2) × T</td><td>2</td></tr>
  <tr><td>RAID 10</td><td>miroirs, puis répartition sur les miroirs</td><td>4</td><td>n × T / 2</td><td>1 au moins (1 par miroir)</td></tr>
</table></div>
<p>La <strong>parité</strong> est une information calculée (par un OU exclusif) qui permet de reconstituer les données d’un disque manquant à partir des autres. Pendant la reconstruction sur un disque neuf, les disques restants sont très sollicités : avec de gros disques, une seconde panne à ce moment n’est pas rare, d’où l’intérêt du RAID 6.</p>

<div class="ctab" data-id="c-raid-cap" data-head="Configuration" data-cols="Capacité utile (To)" data-choices="4|8|12|16" data-label="Calculer la capacité utile en RAID">
  <div class="r" data-ok="16" data-expl="RAID 0 : 4 × 4 = 16 To, mais aucune tolérance de panne.">RAID 0 avec 4 disques de 4 To</div>
  <div class="r" data-ok="4" data-expl="RAID 1 : chaque disque est une copie complète, 4 To utiles ; un disque peut tomber.">RAID 1 avec 2 disques de 4 To</div>
  <div class="r" data-ok="12" data-expl="RAID 5 : (4 − 1) × 4 = 12 To ; l’équivalent d’un disque sert à la parité.">RAID 5 avec 4 disques de 4 To</div>
  <div class="r" data-ok="8" data-expl="RAID 6 : (4 − 2) × 4 = 8 To ; deux parités, deux pannes tolérées.">RAID 6 avec 4 disques de 4 To</div>
  <div class="r" data-ok="8" data-expl="RAID 10 : 4 × 4 / 2 = 8 To. Une panne est toujours tolérée ; une seconde aussi si elle touche l’autre miroir, mais ce n’est pas garanti.">RAID 10 avec 4 disques de 4 To</div>
</div>

<div class="ctab" data-id="c-raid-pannes" data-head="Configuration" data-cols="Pannes de disque tolérées (garanties)" data-choices="0|1|2" data-label="Combien de pannes de disque sont tolérées ?">
  <div class="r" data-ok="0" data-expl="RAID 0 : aucune redondance, un seul disque perdu et toutes les données sont perdues.">RAID 0 avec 4 disques de 4 To</div>
  <div class="r" data-ok="1" data-expl="RAID 1 à deux disques : un disque peut tomber, l’autre contient tout.">RAID 1 avec 2 disques de 4 To</div>
  <div class="r" data-ok="1" data-expl="RAID 5 : une parité, donc une panne tolérée.">RAID 5 avec 4 disques de 4 To</div>
  <div class="r" data-ok="2" data-expl="RAID 6 : deux parités, donc deux pannes tolérées.">RAID 6 avec 4 disques de 4 To</div>
  <div class="r" data-ok="1" data-expl="RAID 10 : une panne est toujours tolérée ; une seconde aussi si elle touche l’autre miroir, mais ce n’est pas garanti.">RAID 10 avec 4 disques de 4 To</div>
</div>

<h2>Les outils</h2>
<h3>Sous Linux : tar et rsync</h3>
<pre class="code terminal"><span class="cm"># Archive compressée et datée du site web et de la configuration d’Apache</span>
<span class="pr">etudiant@srv-deb:~$</span> sudo mkdir -p /srv/sauvegardes
<span class="pr">etudiant@srv-deb:~$</span> sudo tar -czf /srv/sauvegardes/web-$(date +%F).tar.gz -C / var/www etc/apache2
<span class="pr">etudiant@srv-deb:~$</span> tar -tzf /srv/sauvegardes/web-2027-03-10.tar.gz | head        <span class="cm"># lister le contenu</span>
<span class="cm"># Copie vers un autre serveur : seuls les fichiers modifiés sont transférés</span>
<span class="pr">etudiant@srv-deb:~$</span> rsync -av /srv/sauvegardes/ sauvegarde@172.16.2.230:/srv/copies/srv-deb/</pre>
<p><code>-c</code> crée l’archive, <code>-z</code> la compresse, <code>-f</code> donne son nom, <code>-C /</code> se place à la racine pour enregistrer des chemins relatifs (<code>var/www/…</code>), <code>-t</code> liste, <code>-x</code> extrait. Attention à <code>rsync --delete</code> : il reproduit aussi les suppressions, ce qui fait un <strong>miroir</strong>, pas une sauvegarde : un fichier supprimé par erreur disparaît aussi de la copie à la synchronisation suivante.</p>
<h3>Sous Windows Server</h3>
<p>La fonctionnalité <strong>Sauvegarde Windows Server</strong> (<code>Install-WindowsFeature Windows-Server-Backup</code>, console <code>wbadmin.msc</code>) sauvegarde des volumes, des dossiers ou l’« état du système ». Sur un contrôleur de domaine, l’état du système contient l’annuaire Active Directory : <code>wbadmin start systemstatebackup -backupTarget:E:</code>. Pour les fichiers des utilisateurs, les <strong>clichés instantanés</strong> (onglet <em>Versions précédentes</em>) permettent à un utilisateur de récupérer seul une version d’hier d’un fichier, sans remplacer une vraie sauvegarde.</p>
<div class="aside note">
  <p class="aside-title">Instantané de machine virtuelle et sauvegarde</p>
  <p>Les instantanés VirtualBox que vous faites avant chaque TP sont pratiques pour revenir en arrière, mais ce ne sont pas des sauvegardes : ils sont stockés avec la machine virtuelle, sur le même disque, et dépendent du disque d’origine. Le TP 13 a montré qu’en plus, restaurer un instantané d’un membre du domaine peut casser sa relation avec le contrôleur.</p>
</div>

<h2>Tester la restauration</h2>
<div class="answer" data-id="a-restauration" data-kind="code" data-label="Test de restauration sur SRV-DEB" data-min="150" data-rows="10">
  <p>Sur SRV-DEB : faire la sauvegarde <code>tar</code> ci-dessus ; supprimer <code>/var/www/html/index.html</code> et constater l’erreur 404 en demandant <code>http://localhost/index.html</code> ; restaurer <strong>ce seul fichier</strong> depuis l’archive ; vérifier. Noter les commandes utilisées et le temps total, puis rédiger en trois lignes la procédure de restauration pour un collègue.</p>
  <div class="corr">
<pre class="code">sudo tar -czf /srv/sauvegardes/web-$(date +%F).tar.gz -C / var/www etc/apache2
sudo rm /var/www/html/index.html
curl -I http://localhost/index.html   <span class="cm"># HTTP/1.1 404 Not Found</span>
sudo tar -xzf /srv/sauvegardes/web-2027-03-10.tar.gz -C / var/www/html/index.html
curl -I http://localhost/index.html   <span class="cm"># HTTP/1.1 200 OK</span></pre>
    <p>On donne à <code>tar -x</code> le chemin exact tel qu’il est enregistré dans l’archive (sans <code>/</code> initial, vérifié avec <code>tar -tzf</code>) et <code>-C /</code> pour extraire au bon endroit. Procédure type : 1) repérer l’archive datée voulue dans <code>/srv/sauvegardes</code> ; 2) vérifier la présence du fichier avec <code>tar -tzf … | grep</code> ; 3) l’extraire avec <code>tar -xzf … -C /</code> suivi du chemin, puis vérifier propriétaire et droits (<code>ls -l</code>). Le temps mesuré donne une première idée du RTO.</p>
  </div>
</div>

<div class="quiz" data-id="q-fin-p4">
  <div class="q" data-ok="3">
    <p class="qt">Un serveur est sauvegardé chaque nuit à 23 h. Quel est son RPO ?</p>
    <ul><li>23 heures</li><li>1 heure</li><li>24 heures</li><li>Le temps de restaurer</li></ul>
    <div class="expl">Une panne juste avant 23 h fait perdre presque 24 heures de travail : c’est la perte de données maximale. Le temps de restauration, lui, correspond au RTO.</div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Avec une complète le dimanche et des différentielles chaque jour, que faut-il pour restaurer l’état du vendredi soir ?</p>
    <ul><li>La complète et la différentielle du vendredi</li><li>La complète et toutes les différentielles de la semaine</li><li>Seulement la différentielle du vendredi</li><li>La complète seulement</li></ul>
    <div class="expl">Une différentielle contient tout ce qui a changé depuis la dernière complète : la complète plus la dernière différentielle suffisent.</div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Le serveur de fichiers est en RAID 5. Un rançongiciel chiffre tous les fichiers. Que se passe-t-il ?</p>
    <ul><li>Le RAID reconstruit les fichiers</li><li>Un seul disque est touché</li><li>La parité permet de déchiffrer les fichiers</li><li>Les fichiers sont chiffrés sur tous les disques : seule une sauvegarde permet de les récupérer</li></ul>
    <div class="expl">Le RAID recopie immédiatement chaque écriture, y compris les fichiers chiffrés ou supprimés. Il protège contre la panne d’un disque, pas contre la perte de données.</div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Dans la règle 3-2-1, que signifie le « 1 » ?</p>
    <ul><li>Une seule sauvegarde suffit</li><li>Une copie est conservée hors site</li><li>Une sauvegarde par jour</li><li>Un seul administrateur a accès aux sauvegardes</li></ul>
    <div class="expl">Une copie hors site protège contre un sinistre qui touche tout le bâtiment : incendie, inondation, vol.</div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Quelle preuve montre qu’une sauvegarde est utilisable ?</p>
    <ul><li>Le journal indique « sauvegarde terminée »</li><li>Le fichier de sauvegarde est volumineux</li><li>Une restauration a été testée avec succès</li><li>La sauvegarde est chiffrée</li></ul>
    <div class="expl">Seule une restauration réussie, faite régulièrement, prouve que la sauvegarde est complète et lisible, et que la procédure est connue.</div>
  </div>
</div>

<div class="aside next">
  <p class="aside-title">La suite</p>
  <p>Restaurer un fichier supprimé est l’une des demandes que reçoit un centre de services. La <a href="#p5">partie 5</a> présente la méthode pour traiter incidents et demandes, et l’outil GLPI.</p>
</div>

<template data-page="p5">
<h1>Gérer les incidents et les demandes</h1>
<p class="lead">« L’imprimante ne marche plus », « J’ai besoin d’un compte pour notre nouvelle bénévole », « Internet est lent ». Le service informatique de la M2L reçoit chaque jour des appels de ce type. Pour ne rien oublier, traiter d’abord l’urgent et garder une trace de ce qui a été fait, on suit une méthode issue d’<strong>ITIL</strong> et un outil de gestion des tickets : <strong>GLPI</strong>. C’est le cœur de la compétence B1.2 « Répondre aux incidents et aux demandes d’assistance et d’évolution ».</p>

<div class="aside caution">
  <p class="aside-title">Règle du cours</p>
  <p>Pas d’IA. Une partie de cette compétence est humaine : écouter, questionner, reformuler, expliquer. Elle s’entraîne au TP 15 par un jeu de rôle.</p>
</div>

<h2>Le vocabulaire ITIL</h2>
<p><strong>ITIL</strong> (<em>Information Technology Infrastructure Library</em>) est un ensemble de bonnes pratiques de gestion des services informatiques, utilisé dans la plupart des entreprises et des services publics. On y distingue quatre notions qu’il ne faut pas confondre :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Notion</th><th>Définition</th><th>Exemple à la M2L</th><th>Objectif</th></tr>
  <tr><td><strong>Incident</strong></td><td>interruption ou dégradation d’un service qui fonctionnait</td><td>la ligue de volley n’accède plus à son partage</td><td>rétablir le service <strong>le plus vite possible</strong>, même par un contournement</td></tr>
  <tr><td><strong>Demande</strong></td><td>besoin d’un utilisateur, sans panne : un service prévu au catalogue</td><td>créer un compte, installer un logiciel, réinitialiser un mot de passe</td><td>satisfaire la demande dans les délais annoncés</td></tr>
  <tr><td><strong>Problème</strong></td><td>cause inconnue d’un ou de plusieurs incidents</td><td>le Wi-Fi visiteurs se coupe tous les jours vers 14 h : 12 tickets cette semaine</td><td>trouver la <strong>cause racine</strong> et la supprimer, pour que les incidents ne reviennent plus</td></tr>
  <tr><td><strong>Changement</strong></td><td>ajout, modification ou suppression d’un élément de l’infrastructure</td><td>mettre à jour le firmware du pare-feu, ajouter un VLAN</td><td>modifier sans casser : planifier, prévoir un retour arrière, informer</td></tr>
</table></div>

<ol class="steps">
  <li><strong>Enregistrer</strong> : tout appel, courriel ou passage au bureau devient un ticket. Ce qui n’est pas tracé n’existe pas : impossible d’en mesurer la charge ou de retrouver la solution plus tard.</li>
  <li><strong>Qualifier</strong> : type (incident ou demande), catégorie (réseau, impression, compte…), demandeur, matériel concerné, impact et urgence, d’où la priorité.</li>
  <li><strong>Attribuer</strong> : à un technicien ou à un groupe de techniciens.</li>
  <li><strong>Diagnostiquer et traiter</strong> : chercher d’abord dans la base de connaissances ; noter dans le ticket chaque action (« suivi ») ; mettre le ticket <em>en attente</em> si l’on attend l’utilisateur ou une pièce, en le disant au demandeur.</li>
  <li><strong>Résoudre</strong> : décrire la solution apportée, en termes compréhensibles par l’utilisateur.</li>
  <li><strong>Clore</strong> : après validation par l’utilisateur (ou automatiquement au bout de quelques jours). Une solution refusée rouvre le ticket.</li>
</ol>

<h2>La priorité : impact × urgence</h2>
<p>La priorité ne dépend pas de qui crie le plus fort. On la calcule à partir de deux critères :</p>
<ul>
  <li><strong>l’impact</strong> : combien de personnes ou quelle part de l’activité sont touchées (un poste, une ligue, toute la M2L) ;</li>
  <li><strong>l’urgence</strong> : à quelle vitesse le dommage s’aggrave (contournement possible ou non, échéance proche).</li>
</ul>
<div class="tbl-wrap"><table class="data">
  <tr><th>Impact \ Urgence</th><th>Élevée</th><th>Moyenne</th><th>Faible</th></tr>
  <tr><th>Élevé</th><td>1 Critique</td><td>2 Haute</td><td>3 Moyenne</td></tr>
  <tr><th>Moyen</th><td>2 Haute</td><td>3 Moyenne</td><td>4 Basse</td></tr>
  <tr><th>Faible</th><td>3 Moyenne</td><td>4 Basse</td><td>5 Très basse</td></tr>
</table></div>
<p>GLPI calcule la priorité automatiquement à partir de cette matrice (réglable dans <em>Configuration &gt; Générales &gt; Assistance</em>).</p>

<div class="ctab" data-id="c-priorite" data-head="Ticket" data-cols="Priorité" data-choices="1|2|3|4|5" data-label="Calculer la priorité des tickets">
  <div class="r" data-ok="1" data-expl="Impact élevé (toute la M2L, les 24 ligues) et urgence élevée (aucun contournement) : priorité 1.">Plus personne à la M2L n’accède à Internet ni à la messagerie.</div>
  <div class="r" data-ok="4" data-expl="Impact faible (une personne) et urgence moyenne (gênant mais il peut travailler) : priorité 4.">La souris sans fil du directeur fonctionne mal ; il utilise le pavé tactile de son portable en attendant.</div>
  <div class="r" data-ok="2" data-expl="Impact moyen (une ligue) et urgence élevée (échéance dans 2 heures, aucun autre moyen) : priorité 2.">La ligue de volley n’accède plus à son partage, et doit envoyer à la fédération un dossier qui s’y trouve avant 12 h.</div>
  <div class="r" data-ok="5" data-expl="Impact faible et urgence faible : c’est même plutôt une demande. Priorité 5.">Une secrétaire voudrait un fond d’écran aux couleurs de sa ligue.</div>

</div>

<h2>L’organisation du support</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Niveau</th><th>Rôle</th><th>Exemples</th></tr>
  <tr><td><strong>Niveau 1</strong> (centre de services, <em>hotline</em>)</td><td>point de contact unique ; enregistre, qualifie, résout les cas simples et connus, souvent avec la base de connaissances</td><td>mot de passe, imprimante, accès à un partage</td></tr>
  <tr><td><strong>Niveau 2</strong> (techniciens spécialisés)</td><td>diagnostics plus poussés, intervention sur les serveurs et le réseau</td><td>panne d’un service DHCP, droits NTFS, VLAN</td></tr>
  <tr><td><strong>Niveau 3</strong> (experts, éditeurs, prestataires)</td><td>problèmes complexes, correctifs, contrats de maintenance</td><td>bogue d’un logiciel, panne matérielle sous garantie</td></tr>
</table></div>
<p>Transmettre un ticket au niveau supérieur s’appelle une <strong>escalade</strong>. Elle se fait avec un ticket complet : symptômes exacts, ce qui a été testé et le résultat de chaque test. Rien n’agace plus un technicien de niveau 2 que de refaire les tests déjà faits.</p>
<p>Les engagements de délai sont fixés dans une <strong>convention de service</strong> (SLA, <em>Service Level Agreement</em>), par exemple : prise en compte d’un ticket de priorité 1 en 15 minutes, résolution en 4 heures. GLPI mesure ces délais : temps de prise en compte (TTO, <em>Time To Own</em>) et temps de résolution (TTR, <em>Time To Resolve</em>).</p>

<h2>Communiquer avec l’utilisateur</h2>
<ul>
  <li><strong>Écouter et reformuler</strong> : « Si je comprends bien, depuis ce matin, vous ne voyez plus le lecteur V: sur votre poste, mais vos collègues le voient ? »</li>
  <li><strong>Questionner</strong> : depuis quand ? Qu’est-ce qui a changé ? Un seul poste ou plusieurs ? Quel est le message exact (une capture d’écran) ?</li>
  <li><strong>Parler simplement</strong> : pas de « votre bail DHCP a expiré », mais « votre ordinateur n’a pas reçu d’adresse réseau ».</li>
  <li><strong>Annoncer un délai</strong> réaliste, et prévenir s’il change.</li>
  <li><strong>Respecter la confidentialité</strong> : un technicien ne demande jamais son mot de passe à un utilisateur ; une prise de main à distance se fait avec son accord.</li>
</ul>

<div class="aside pro">
  <p class="aside-title">En entreprise</p>
  <p>Le métier de technicien support est souvent le premier poste après un BTS SIO, et beaucoup de stages et d’alternances s’y déroulent. Les recruteurs y regardent autant la qualité des tickets rédigés et l’attitude au téléphone que les connaissances techniques. Un ticket bien écrit est relu par vos collègues, par votre responsable, et parfois par le client.</p>
</div>

<h2>La base de connaissances et le compte rendu</h2>
<p>Quand une solution a été trouvée, on la rédige dans la <strong>base de connaissances</strong> sous forme de fiche : symptôme, cause, solution pas à pas, date et auteur. La fois suivante, le niveau 1 la trouvera en tapant le message d’erreur et résoudra le ticket en quelques minutes. Une fiche peut être interne (pour les techniciens) ou publique (pour que les utilisateurs se dépannent seuls).</p>
<div class="answer" data-id="a-ticket" data-label="Rédiger le suivi et la solution d’un ticket" data-min="200" data-rows="9">
  <p>Ticket : « J’ai pas internet !!! » (Inès Benali, ligue de volley, poste <code>BAE2L06S01P01</code>). Vous avez constaté que le câble réseau était débranché de la prise murale après un déménagement de bureau, l’avez rebranché, et le poste a reçu l’adresse <code>172.16.8.163</code>. Rédiger : a) un titre de ticket correct ; b) le suivi technique (pour les collègues) ; c) le texte de la solution (pour l’utilisatrice).</p>
  <div class="corr">
    <p>a) « Pas d’accès réseau sur le poste BAE2L06S01P01 (ligue de volley) ». Un titre décrit le symptôme et le lieu, sans majuscules ni points d’exclamation.</p>
    <p>b) Suivi : « Poste sans adresse IP (169.254.x.x, adresse automatique). Pas de lien sur la carte réseau. Câble débranché de la prise murale suite au déménagement du bureau. Câble rebranché : lien actif, adresse 172.16.8.163 reçue par DHCP, accès à Internet et au partage vérifiés. Durée : 15 min. »</p>
    <p>c) Solution : « Bonjour Madame Benali, le câble réseau de votre ordinateur avait été débranché de la prise du mur lors du déménagement de votre bureau. Je l’ai rebranché et j’ai vérifié avec vous l’accès à Internet et au dossier de la ligue. Si le problème revient, n’hésitez pas à rouvrir ce ticket. Cordialement. »</p>
    <p>L’adresse <code>172.16.8.163</code> appartient bien au réseau de la ligue 06 : 172.16.8.0 + 5 × 32 = 172.16.8.160/27 (chapitre 2).</p>
  </div>
</div>

<h2>GLPI : l’outil de la M2L</h2>
<p><strong>GLPI</strong> (Gestionnaire Libre de Parc Informatique) est un logiciel libre français, écrit en PHP avec une base MariaDB, très utilisé dans les collectivités, l’enseignement et les PME. Il réunit :</p>
<ul>
  <li>l’<strong>assistance</strong> : tickets, problèmes, changements, SLA, statistiques ;</li>
  <li>la <strong>gestion de parc</strong> : ordinateurs, imprimantes, matériels réseau, logiciels et licences, alimentée automatiquement par l’<strong>agent GLPI</strong> installé sur les postes (inventaire) ;</li>
  <li>la <strong>base de connaissances</strong>, les contrats, les fournisseurs, les documents.</li>
</ul>
<p>Chaque utilisateur a un <strong>profil</strong> qui détermine ce qu’il voit et peut faire : <em>Self-Service</em> (déclarer et suivre ses tickets), <em>Technician</em>, <em>Supervisor</em>, <em>Admin</em>, <em>Super-Admin</em>. Une installation neuve contient quatre comptes : <code>glpi</code> (super-administrateur), <code>tech</code>, <code>normal</code> et <code>post-only</code>, avec des mots de passe connus (<code>glpi</code>, <code>tech</code>, <code>normal</code>, <code>postonly</code>) : la première chose à faire est de les changer ou de les désactiver, ce que GLPI rappelle par un bandeau d’avertissement. GLPI peut aussi s’appuyer sur l’annuaire Active Directory (LDAP) pour l’authentification : les utilisateurs se connectent alors avec leur compte <code>m2l.lan</code>.</p>

<div class="quiz" data-id="q-fin-p5">

  <div class="q" data-ok="3">

  <div class="q" data-ok="2">

    <div class="expl">Les comptes <code>glpi</code>, <code>tech</code>, <code>normal</code> et <code>post-only</code> ont des mots de passe connus de tous : laissés tels quels, ils donnent l’accès à l’outil, et même son administration complète avec <code>glpi</code>.</div>

<h2>Mission 2 : la méthode de diagnostic</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Du symptôme à la cause, couche par couche</summary>
  <div class="task-body">
    <p>Un diagnostic méthodique suit toujours le même cheminement :</p>
    <ol class="steps">
      <li><strong>Reproduire et délimiter</strong> : quel est le message exact ? Un seul poste ou plusieurs ? Un seul service ou tous ? Depuis quand ? Qu’est-ce qui a changé ?</li>
      <li><strong>Tester couche par couche</strong>, en partant du bas : le lien (câble, carte, VLAN), l’adresse IP et la passerelle (<code>ipconfig</code>, <code>ip a</code>), la connectivité (<code>ping</code> de la passerelle, puis du serveur), la résolution de noms (<code>nslookup</code>), le service lui-même (port ouvert : <code>Test-NetConnection -Port</code>, <code>ss -tlnp</code>), puis les droits et l’application.</li>
      <li><strong>Formuler une hypothèse</strong> et la vérifier par un test qui peut la contredire.</li>
      <li><strong>Corriger une seule chose à la fois</strong>, et vérifier après chaque modification.</li>
      <li><strong>Vérifier avec l’utilisateur</strong> que le service est rétabli, puis <strong>documenter</strong>.</li>
    </ol>
    <div class="match" data-id="m-premier-test" data-label="Quel premier test pour quel symptôme ?" data-options="ipconfig /all|nslookup|Test-NetConnection -Port|Get-ADUser|journalctl">
      <div class="r" data-ok="ipconfig /all" data-expl="Une adresse 169.254.x.x indique que le poste n’a pas reçu de réponse du DHCP : on vérifie d’abord sa configuration IP.">« Je n’ai plus rien : ni Internet, ni le partage, ni la messagerie » (un seul poste concerné).</div>
      <div class="r" data-ok="nslookup" data-expl="Le serveur répond par son adresse mais pas par son nom : la résolution de noms est en cause.">« Le site intranet ne s’affiche plus, mais le technicien y accède en tapant son adresse IP. »</div>
      <div class="r" data-ok="Test-NetConnection -Port" data-expl="Le serveur répond au ping : il faut tester le port du service (80 ou 443) pour savoir s’il écoute ou si un filtre le bloque.">« Le site web ne répond plus, mais le serveur répond au ping. »</div>
      <div class="r" data-ok="Get-ADUser" data-expl="Problème propre à un compte : on regarde l’état du compte dans l’annuaire (désactivé, verrouillé, expiré). Get-ADUser lea.martin -Properties LockedOut, Enabled.">« Mon collègue arrive à se connecter sur mon poste, mais pas moi. »</div>

    </div>

<h2>Mission 3 : le jeu de rôle</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Trois tours, trois rôles</summary>
  <div class="task-body">
    <p>Chaque tour dure environ 30 minutes. À chaque tour, on change de rôle, et une nouvelle panne est introduite.</p>
    <div class="tbl-wrap"><table class="data wide">
      <tr><th>Rôle</th><th>Ce qu’il fait</th><th>Ce qu’il ne fait pas</th></tr>
      <tr><td><strong>Utilisateur</strong></td><td>reçoit une fiche décrivant ce qu’il « voit » ; déclare le ticket dans GLPI (compte Self-Service), puis appelle le niveau 1 ; répond aux questions comme un utilisateur non technicien ; valide ou refuse la solution</td><td>donner le diagnostic, utiliser le vocabulaire technique</td></tr>
      <tr><td><strong>Niveau 1</strong></td><td>prend l’appel, questionne, reformule ; qualifie le ticket ; teste depuis le poste client ; cherche dans la base de connaissances ; résout ou escalade avec un ticket complet</td><td>intervenir sur les serveurs</td></tr>
      <tr><td><strong>Niveau 2</strong></td><td>reprend un ticket escaladé ; diagnostique et corrige sur les serveurs (SRV-WIN, SRV-DEB, pfSense) ; note chaque action dans une tâche ; rédige la solution</td><td>recontacter l’utilisateur pour des questions déjà posées</td></tr>
    </table></div>
    <p>Pendant le jeu, respecter les règles de la partie 5 : la priorité se déduit de l’impact et de l’urgence, chaque action est tracée, on ne demande jamais un mot de passe, on annonce un délai.</p>
    <div class="answer" data-id="t15-tour1" data-label="Tour 1 : résumé du ticket" data-min="200" data-rows="8">
      <p>Numéro du ticket GLPI, votre rôle, symptôme déclaré, type et priorité retenus (avec justification), tests réalisés dans l’ordre avec leur résultat, cause trouvée, correction, durée totale. Ce qui a bien ou mal fonctionné dans la communication.</p>
      <div class="corr">
        <p>Correction faite par l’enseignant, qui connaît la panne introduite. Critères : les tests suivent un ordre logique (du bas vers le haut, du poste vers le serveur) ; chaque test est noté avec son résultat exact ; la cause est démontrée par un test, pas devinée ; une seule modification à la fois ; la solution est vérifiée avec l’utilisateur ; le ticket est compréhensible par un collègue qui n’était pas là.</p>
      </div>
    </div>
    <div class="answer" data-id="t15-tour2" data-label="Tour 2 : résumé du ticket" data-min="200" data-rows="8">
      <p>Même grille qu’au tour 1.</p>
      <div class="corr">
        <p>Correction faite par l’enseignant (mêmes critères qu’au tour 1). Une escalade est réussie si le niveau 2 n’a eu à refaire aucun test du niveau 1.</p>
      </div>
    </div>
    <div class="answer" data-id="t15-tour3" data-label="Tour 3 : résumé du ticket" data-min="200" data-rows="8">
      <p>Même grille qu’au tour 1.</p>
      <div class="corr">
        <p>Correction faite par l’enseignant (mêmes critères qu’au tour 1). Au troisième tour, le délai de résolution doit avoir diminué grâce à la méthode et à la base de connaissances.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 4 : capitaliser dans la base de connaissances</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Une fiche utile pour le prochain technicien</summary>
  <div class="task-body">
    <p>Dans GLPI, <em>Outils &gt; Base de connaissances</em>, rédiger une fiche pour la panne que vous avez résolue en tant que niveau 2. Elle doit permettre à un technicien de niveau 1 de la reconnaître et, si possible, de la résoudre seul.</p>
    <div class="answer" data-id="t15-kb" data-label="Mission 4 : fiche de la base de connaissances" data-min="250" data-rows="12">
      <p>Coller le texte de la fiche : titre (le symptôme, avec le message exact), symptômes, cause, procédure de diagnostic, solution pas à pas, vérification, précautions.</p>
      <div class="corr">
        <p>Exemple attendu, pour une étendue DHCP désactivée :</p>
        <p><strong>Titre</strong> : « Postes en 169.254.x.x, “Connectivité limitée” : étendue DHCP désactivée ». <strong>Symptômes</strong> : plusieurs postes du même réseau sans accès ; <code>ipconfig</code> affiche une adresse 169.254.x.x et aucune passerelle. Les postes déjà allumés fonctionnent jusqu’à l’expiration de leur bail. <strong>Cause</strong> : étendue désactivée sur SRV-WIN (ou service DHCP arrêté). <strong>Diagnostic</strong> : sur SRV-WIN, <code>Get-DhcpServerv4Scope</code> (colonne <code>State</code>) et <code>Get-Service DHCPServer</code>. <strong>Solution</strong> : <code>Set-DhcpServerv4Scope -ScopeId 192.168.50.0 -State Active</code> (ou <code>Start-Service DHCPServer</code>). <strong>Vérification</strong> : sur un poste, <code>ipconfig /renew</code>, puis adresse dans la plage .30 à .59. <strong>Précaution</strong> : chercher pourquoi l’étendue a été désactivée (historique, journal Système) et noter qui a fait la modification.</p>
      </div>
    </div>
  </div>
</details>

<h2>Fiche mémo : les notions</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Notion</th><th>À retenir</th></tr>
  <tr><td>Annuaire, LDAP</td><td>Base centrale des comptes, groupes, ordinateurs ; interrogée par LDAP (389, 636 en LDAPS). Nom distinctif (DN) : <code>CN=…,OU=…,DC=m2l,DC=lan</code>.</td></tr>
  <tr><td>Active Directory</td><td>Domaine <code>m2l.lan</code> (NetBIOS <code>M2L</code>), contrôleurs de domaine (deux au moins), DNS indispensable (enregistrements SRV), Kerberos (88) avec 5 minutes d’écart d’horloge au plus.</td></tr>
  <tr><td>OU et groupes</td><td>OU : ranger, lier des GPO, déléguer ; un objet dans une seule OU. Groupe : donner des droits ; un compte dans plusieurs groupes. AGDLP : comptes → groupe global → groupe de domaine local → permission.</td></tr>
  <tr><td>GPO</td><td>Configuration ordinateur / utilisateur ; ordre local, site, domaine, OU (la dernière l’emporte) ; liée à l’emplacement du compte ou de l’ordinateur ; <code>gpupdate /force</code>, <code>gpresult /r</code>.</td></tr>
  <tr><td>Scripts</td><td>Bash (<code>#!/bin/bash</code>, <code>chmod +x</code>, <code>"$var"</code>, <code>[ … ]</code>, <code>-eq -gt</code>) et PowerShell (objets, Verbe-Nom, <code>$_</code>, <code>Import-Csv</code>, <code>-WhatIf</code>). Code de retour 0 = succès. Idempotence, mode test, pas de mot de passe en clair.</td></tr>
  <tr><td>Journaux</td><td>Date, source, gravité, message. Syslog 0 (urgence) à 7 (débogage), UDP/TCP 514. <code>journalctl</code> sous Debian 12 ; Observateur d’événements (4624, 4625, 4720, 4740, 7036, 1074). Centraliser ; serveurs à l’heure (NTP) ; conservation de 6 mois à 1 an (CNIL).</td></tr>
  <tr><td>Indicateurs</td><td>Disque, mémoire, processeur, services, réseau, disponibilité ; seuils d’alerte justifiés ; supervision (Zabbix, Centreon), SNMPv3.</td></tr>
  <tr><td>Sauvegarde</td><td>RPO (perte maximale), RTO (interruption maximale). Complète, incrémentale (depuis la dernière sauvegarde), différentielle (depuis la dernière complète). 3-2-1 (et 3-2-1-1-0). Tester la restauration.</td></tr>
  <tr><td>RAID</td><td>Disponibilité, pas sauvegarde. RAID 0 n × T, 0 panne ; RAID 1 T ; RAID 5 (n − 1) × T, 1 panne ; RAID 6 (n − 2) × T, 2 pannes ; RAID 10 n × T / 2.</td></tr>
  <tr><td>ITIL</td><td>Incident (rétablir vite), demande (service prévu), problème (cause racine), changement (modifier sans casser). Priorité = impact × urgence. Niveaux 1, 2, 3 ; escalade documentée ; SLA (TTO, TTR) ; base de connaissances.</td></tr>
  <tr><td>Diagnostic</td><td>Délimiter (qui, quoi, depuis quand, qu’est-ce qui a changé), tester couche par couche, une hypothèse vérifiée par un test, une modification à la fois, vérifier avec l’utilisateur, documenter.</td></tr>
</table></div>

<h2>Fiche mémo : les commandes</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Besoin</th><th>Commandes</th></tr>
  <tr><td>Créer le domaine</td><td><code>Install-WindowsFeature AD-Domain-Services -IncludeManagementTools</code>, <code>Install-ADDSForest -DomainName m2l.lan -DomainNetbiosName M2L -InstallDns</code>, <code>Add-DhcpServerInDC</code></td></tr>

  <tr><td>Poste du domaine</td><td><code>Add-Computer -DomainName m2l.lan -Restart</code>, <code>whoami</code>, <code>whoami /groups</code>, <code>nltest /dsgetdc:m2l.lan</code>, <code>Test-ComputerSecureChannel -Repair</code>, <code>w32tm /resync</code></td></tr>
  <tr><td>GPO et mots de passe</td><td><code>New-GPO … | New-GPLink -Target …</code>, <code>Set-GPRegistryValue</code>, <code>Set-ADDefaultDomainPasswordPolicy</code>, <code>gpupdate /force</code>, <code>gpresult /r</code></td></tr>

  <tr><td>Comptes Linux</td><td><code>useradd -m -s /bin/bash -G</code>, <code>groupadd</code>, <code>chpasswd</code>, <code>chage -d 0</code>, <code>id</code>, <code>getent group</code></td></tr>
  <tr><td>Journaux</td><td><code>journalctl -u ssh --since today</code>, <code>journalctl -p err -b</code>, <code>journalctl -f</code>, <code>last</code>, <code>lastb</code>, <code>Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4625}</code></td></tr>
  <tr><td>Indicateurs</td><td><code>df -h</code>, <code>free -h</code>, <code>uptime</code>, <code>systemctl --failed</code>, <code>Get-Volume</code>, <code>Get-Counter</code>, <code>Test-NetConnection -Port</code></td></tr>

  /* ---------- QUIZ ---------- */

  /* ---------- RÉPONSE RÉDIGÉE ---------- */

        recordCheck(k, st, good === ok.length && st.v.length === ok.length ? 1 : 0, 1); render(); return;
      }
      if (b && b.hasAttribute('data-retry')) { st.checked = false; st.v = []; state.items[k] = st; changed(); render(); return; }
      var tr = e.target.closest('tbody tr'); if (tr) toggle(tr);
    });
    box.addEventListener('keydown', function (e) { var tr = e.target.closest('tbody tr'); if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(tr); var again = $('tbody tr[data-n="' + tr.getAttribute('data-n') + '"]', box); if (again) again.focus(); } });
    render();
  }

  /* ---------- page de démarrage ---------- */
  function renderStart(el) {
    var s = state.student;
    if (!state.ui.started) {
      el.innerHTML = '<div class="panel start"><p class="start-step">Étape obligatoire</p><h3 class="nonum">Qui travaille ?</h3>' +
        '<div class="fields"><div class="field"><label for="st-nom">Nom</label><input id="st-nom" autocomplete="family-name" value="' + esc(s.nom || '') + '"></div><div class="field"><label for="st-prenom">Prénom</label><input id="st-prenom" autocomplete="given-name" value="' + esc(s.prenom || '') + '"></div><div class="field"><label for="st-classe">Classe</label><input id="st-classe" placeholder="Exemple : SIO1 A" value="' + esc(s.classe || '') + '"></div></div>' +
        '<div class="row"><button type="button" class="btn primary" data-create disabled>Créer mon fichier de sauvegarde et commencer</button><span class="note-line" data-createnote>Remplir les trois champs.</span></div>' +
        '<hr><p><strong>J’ai déjà commencé</strong> (sur un autre poste, à l’internat, à la maison) :</p><div class="row"><label class="btn" for="st-file">Ouvrir mon fichier de sauvegarde</label><input type="file" id="st-file" accept=".json,application/json" class="sr-only"></div><div data-filemsg></div></div>';
      var inputs = $$('input:not([type=file])', el), btn = $('[data-create]', el), note = $('[data-createnote]', el);
      function upd() { var okk = inputs.every(function (i) { return i.value.trim().length > 0; }); btn.disabled = !okk; note.textContent = okk ? '' : 'Remplir les trois champs.'; }
      inputs.forEach(function (i) { i.addEventListener('input', upd); }); upd();
      btn.addEventListener('click', function () {
        state.student.nom = $('#st-nom').value.trim().toUpperCase(); state.student.prenom = $('#st-prenom').value.trim(); state.student.classe = $('#st-classe').value.trim();
        if (!state.student.id) { state.student.id = newId(); state.student.createdAt = Date.now(); }
        state.ui.started = true; logEvent('start', null, { id: state.student.id });
        var name = fileSave(); state.ui.firstFile = name; saveNow();
        render('accueil'); var sc = $('#start'); if (sc) sc.scrollIntoView({ block: 'start' });
      });
      fileInput($('#st-file', el), $('[data-filemsg]', el));
      return;
    }
    var next = PAGES.filter(function (p) { var st = pageStats(p.id); return p.id !== 'accueil' && p.id !== 'bilan' && st.total && st.done < st.total; })[0];
    el.innerHTML = '<div class="panel start ok"><p class="start-step">Prêt</p><p class="start-who">' + esc(fullName()) + ' · ' + esc(s.classe || '') + '</p><p class="note-line">Identifiant personnel : <strong class="mono">' + esc(s.id) + '</strong> (il figure sur le compte rendu)</p>' +
      (state.ui.firstFile && state.ui.saves === 1 ? '<div class="notice warn"><p><strong>Fichier téléchargé : <code>' + esc(state.ui.firstFile) + '</code></strong></p><p>Il se trouve dans le dossier <em>Téléchargements</em>. Le ranger maintenant à un endroit retrouvable depuis l’extérieur : OneDrive, Teams, clé USB ou dépôt GitHub.</p></div>' : '') +
      '<p data-restore-ok class="ck-msg good" hidden>Travail restauré à partir du fichier.</p>' +
      '<p>Dernière sauvegarde dans un fichier : <strong>' + (state.ui.fileAt ? fmtDate(state.ui.fileAt, true) + ' (' + ago(state.ui.fileAt) + ')' : 'aucune') + '</strong>' + (dirty() ? ' · <span class="ko-t">des réponses ne sont pas encore sauvegardées</span>' : '') + '</p>' +
      '<div class="row"><button type="button" class="btn primary" data-savenow>Sauvegarder maintenant</button><label class="btn" for="st-file2">Ouvrir un fichier de sauvegarde</label><input type="file" id="st-file2" accept=".json,application/json" class="sr-only">' + (next ? '<a class="btn" href="#' + next.id + '">Continuer : ' + next.n + ' →</a>' : '<a class="btn" href="#bilan">Voir le bilan →</a>') + '</div><div data-filemsg></div>' +
      '<details class="ident-edit"><summary>Corriger mon nom ou ma classe</summary><div class="fields"><div class="field"><label for="st-nom">Nom</label><input id="st-nom" value="' + esc(s.nom || '') + '"></div><div class="field"><label for="st-prenom">Prénom</label><input id="st-prenom" value="' + esc(s.prenom || '') + '"></div><div class="field"><label for="st-classe">Classe</label><input id="st-classe" value="' + esc(s.classe || '') + '"></div></div><button type="button" class="btn small" data-ident>Enregistrer la correction</button></details></div>';
    $('[data-savenow]', el).addEventListener('click', function () { fileSave(); renderStart(el); });
    fileInput($('#st-file2', el), $('[data-filemsg]', el));
    $('[data-ident]', el).addEventListener('click', function () {
      var before = fullName() + ' · ' + (s.classe || '');
      s.nom = $('#st-nom', el).value.trim().toUpperCase() || s.nom; s.prenom = $('#st-prenom', el).value.trim() || s.prenom; s.classe = $('#st-classe', el).value.trim() || s.classe;
      logEvent('identity', null, { from: before, to: fullName() + ' · ' + (s.classe || '') }); changed(); updateWho(); renderStart(el);
    });
  }
  function renderIdentityCard(el) {
    var s = state.student;
    el.innerHTML = '<div class="panel"><p class="start-who">' + esc(fullName()) + ' · ' + esc(s.classe || '') + '</p><p class="note-line">Identifiant : <strong class="mono">' + esc(s.id || '') + '</strong> · travail commencé le ' + (s.createdAt ? fmtDate(s.createdAt, true) : '—') + ' · ' + (state.ui.saves || 0) + ' sauvegarde(s) dans un fichier. Pour corriger son nom : <a href="#accueil">page de démarrage</a>.</p></div>';
  }
  function renderParcours(el) {
    el.innerHTML = '<ol class="parcours">' + PAGES.filter(function (p) { return p.id !== 'accueil'; }).map(function (p) {
      var s = pageStats(p.id), pill = '';
      if (s.total && s.started) pill = s.done === s.total ? '<span class="pill done">✓ terminé</span>' : '<span class="pill go">' + s.done + '/' + s.total + '</span>';
      else if (p.id !== 'bilan') pill = '<span class="pill">à faire</span>';
      return '<li><a href="#' + p.id + '"><span class="k' + (p.kind.indexOf('TP') === 0 ? ' tp' : '') + '">' + p.n + (p.dur ? ' · ' + p.dur : '') + '</span><span class="t">' + p.title + '<small>' + p.kind + '</small></span>' + pill + '</a></li>';
    }).join('') + '</ol>';
  }

  /* ---------- bilan ---------- */
  function allItems() {
    var out = [];
    PAGES.forEach(function (p) { (MANIFEST[p.id] || []).forEach(function (it) { out.push({ page: p, it: it, st: state.items[it.key], f: state.firsts[it.key] }); }); });
    return out;
  }
  function itemResult(x) {
    var it = x.it, s = x.st, f = x.f;
    if (it.type === 'answer') {
      if (!s) return { txt: 'non commencé', level: null };
      if (!s.self) return { txt: s.revealed ? 'correction vue, non évaluée' : 'rédigée, correction non consultée', level: null };
      var t = SELF[s.self] + (f && f.self && f.self !== s.self ? ' (1re évaluation : ' + SELF[f.self] + ')' : '');
      return { txt: t, level: f && f.self ? f.self : s.self };
    }
    if (!f) return { txt: s ? 'en cours' : 'non commencé', level: null };
    var p = pct(f.score, f.total), lv = it.type === 'quiz' ? (p >= 80 ? 'ok' : p >= 50 ? 'mid' : 'ko') : (p === 100 ? 'ok' : p >= 60 ? 'mid' : 'ko');
    var extra = s && s.attempts > 1 ? ' · ' + s.attempts + ' tentatives' + (s.best != null ? ', meilleur ' + s.best + ' / ' + f.total : '') : '';
    return { txt: '1re tentative ' + f.score + ' / ' + f.total + extra, level: lv };
  }
  function renderBilan(el) {
    var items = allItems(), done = items.filter(function (x) { return isDone(x.it); }).length;
    var qz = items.filter(function (x) { return x.it.type === 'quiz' && x.f; }), ck = items.filter(function (x) { return x.it.type === 'check' && x.f; });
    function sum(a, k2) { return a.reduce(function (t, x) { return t + x.f[k2]; }, 0); }
    var selfs = { ok: 0, mid: 0, ko: 0 }; items.forEach(function (x) { if (x.it.type === 'answer' && x.st && x.st.self) selfs[x.st.self]++; });
    var html = '<div class="stats"><div class="stat"><b>' + done + ' / ' + items.length + '</b><span>activités terminées</span></div>' +
      '<div class="stat"><b>' + (qz.length ? pct(sum(qz, 'score'), sum(qz, 'total')) + ' %' : '—') + '</b><span>réussite aux quiz (1res tentatives)</span></div>' +
      '<div class="stat"><b>' + (ck.length ? pct(sum(ck, 'score'), sum(ck, 'total')) + ' %' : '—') + '</b><span>réussite aux activités auto-corrigées (1res tentatives)</span></div>' +
      '<div class="stat"><b>' + selfs.ok + ' · ' + selfs.mid + ' · ' + selfs.ko + '</b><span>réponses rédigées : réussi · en partie · à revoir</span></div></div>';
    html += '<div class="tbl-wrap"><table class="data wide bilan-tbl"><thead><tr><th>Étape</th><th>Activités</th><th>Quiz</th><th>Auto-corrigé</th><th>Auto-évaluation</th></tr></thead><tbody>';
    PAGES.forEach(function (p) {
      var its = items.filter(function (x) { return x.page.id === p.id; }); if (!its.length) return;
      var s = pageStats(p.id);
      if (!s.started) { html += '<tr><td><a href="#' + p.id + '">' + p.n + ' — ' + p.title + '</a></td><td colspan="4" class="null">pas encore commencée</td></tr>'; return; }
      var q = its.filter(function (x) { return x.it.type === 'quiz' && x.f; }), c = its.filter(function (x) { return x.it.type === 'check' && x.f; });
      var se = { ok: 0, mid: 0, ko: 0 }; its.forEach(function (x) { if (x.it.type === 'answer' && x.st && x.st.self) se[x.st.self]++; });
      var na = its.filter(function (x) { return x.it.type === 'answer'; }).length;
      html += '<tr><td><a href="#' + p.id + '">' + p.n + ' — ' + p.title + '</a></td><td>' + s.done + ' / ' + s.total + '</td><td>' + (q.length ? sum(q, 'score') + ' / ' + sum(q, 'total') : '—') + '</td><td>' + (c.length ? sum(c, 'score') + ' / ' + sum(c, 'total') : '—') + '</td><td>' + (na ? '<span class="chip ok">' + se.ok + '</span><span class="chip mid">' + se.mid + '</span><span class="chip ko">' + se.ko + '</span>' : '—') + '</td></tr>';
    });
    html += '</tbody></table></div><p class="note-line">Les scores affichés sont ceux de la première tentative ; les tentatives suivantes servent à s’entraîner.</p>';
    var rev = items.filter(function (x) { var r = itemResult(x); return r.level === 'ko' || r.level === 'mid'; });
    html += '<h3 class="nonum">Points à revoir</h3>' + (rev.length ? '<ul class="revoir">' + rev.map(function (x) { var r = itemResult(x); return '<li><span class="chip ' + r.level + '">' + esc(r.txt) + '</span><a href="#' + x.page.id + '" data-anchor="' + x.it.anchor + '">' + x.page.n + ' · ' + esc(x.it.label) + '</a></li>'; }).join('') + '</ul>' : '<p class="note-line">Aucun point signalé pour l’instant.</p>');
    el.innerHTML = html;
  }

  /* ---------- journal et compte rendu ---------- */
  function labelOf(k) { var p = k && k.split(':')[0]; var it = (MANIFEST[p] || []).filter(function (x) { return x.key === k; })[0]; return it ? (pageById(p).n + ' · ' + it.label) : (k || ''); }
  function eventText(ev) {
    var d = ev.d || {};
    switch (ev.e) {
      case 'start': return 'Début du travail (identifiant ' + d.id + ')';
      case 'save': return 'Sauvegarde dans un fichier n° ' + d.n;
      case 'restore': return 'Restauration d’un fichier' + (d.id ? ' (identifiant ' + d.id + ')' : '') + (d.date ? ', sauvegardé le ' + fmtDate(d.date, true) : '') + (d.forced ? ' — malgré l’avertissement' : '');
      case 'quiz': return labelOf(ev.k) + ' : ' + d.s + ' / ' + d.t + ' (tentative ' + d.a + ')';
      case 'check': return labelOf(ev.k) + ' : ' + d.s + ' / ' + d.t + ' (tentative ' + d.a + ')';
      case 'reveal': return labelOf(ev.k) + ' : correction consultée' + (d.sec != null ? ' ' + (d.sec < 90 ? d.sec + ' s' : Math.round(d.sec / 60) + ' min') + ' après le début de la rédaction' : '') + (d.len != null ? ' (' + d.len + ' caractères écrits)' : '');
      case 'edit-after': return labelOf(ev.k) + ' : réponse modifiée après la correction';
      case 'self': return labelOf(ev.k) + ' : auto-évaluation « ' + SELF[d.to] + ' »';
      case 'self-change': return labelOf(ev.k) + ' : auto-évaluation changée de « ' + SELF[d.from] + ' » à « ' + SELF[d.to] + ' »';
      case 'hint': return labelOf(ev.k) + ' : indice consulté';
      case 'reset': return 'Effacement des réponses en cours (les premiers résultats sont conservés)';
      case 'identity': return 'Identité modifiée : ' + d.from + ' → ' + d.to;
      default: return ev.e;
    }
  }
  function headerLines() {
    var s = state.student;
    return { who: fullName() || 'Nom non renseigné', classe: s.classe || '', id: s.id || '—', created: s.createdAt ? fmtDate(s.createdAt, true) : '—', saves: state.ui.saves || 0, restores: state.log.filter(function (e) { return e.e === 'restore'; }).length };
  }
  function buildReport(asHTML) {
    var items = allItems(), H = headerLines(), d = fmtDate(Date.now(), true);
    var pages = PAGES.filter(function (p) { return (MANIFEST[p.id] || []).length; });
    if (!asHTML) {
      var t = 'COMPTE RENDU — ' + TITLE.toUpperCase() + '\n' + H.who + ' — ' + H.classe + ' — identifiant ' + H.id + '\nTravail commencé le ' + H.created + ' · édité le ' + d + ' · ' + H.saves + ' sauvegarde(s), ' + H.restores + ' restauration(s)\n';
      pages.forEach(function (p) {
        t += '\n==== ' + p.n + ' — ' + p.title + ' ====\n';
        if (!pageStats(p.id).started) { t += '(pas encore commencée)\n'; return; }
        items.filter(function (x) { return x.page.id === p.id; }).forEach(function (x) {
          var r = itemResult(x);
          t += '\n• ' + x.it.label + ' [' + r.txt + ']' + (x.st && x.st.editedAfter ? ' (complétée après la correction)' : '') + '\n';
          if (x.it.type === 'answer' && x.st) { if (x.st.text) t += x.st.text.replace(/^/gm, '    ') + '\n'; if (x.st.tables) t += tablesToText(x.st).replace(/^/gm, '    ') + '\n'; }
        });
      });
      t += '\n==== Journal ====\n' + state.log.map(function (ev) { return fmtDate(ev.t, true) + ' · ' + eventText(ev); }).join('\n') + '\n';
      return t;
    }
    var css = 'body{font:15px/1.5 system-ui,sans-serif;max-width:52rem;margin:2rem auto;padding:0 16px;color:#161d2e}h1{font-size:1.5rem}h2{margin-top:2rem;border-bottom:2px solid #2c48c9;padding-bottom:4px;font-size:1.15rem}.it{border:1px solid #d8ddeb;border-radius:8px;padding:10px 14px;margin:10px 0}.lab{font-weight:700}.res{float:right;font-size:.8rem;padding:2px 8px;border-radius:99px;background:#eef1f8;margin-left:8px}.ok{background:#e3f4e8;color:#17803d}.mid{background:#fbf1d9;color:#9a6200}.ko{background:#fbe6e6;color:#c53030}pre{white-space:pre-wrap;font:13px/1.45 ui-monospace,Consolas,monospace;background:#f6f7fb;padding:8px;border-radius:6px}table{border-collapse:collapse;margin:6px 6px 6px 0;font-size:13px}td,th{border:1px solid #ccd;padding:3px 8px;text-align:left}th{background:#eef1f8}.tables{display:flex;flex-wrap:wrap;gap:8px}u{text-decoration-thickness:2px}.tbl-name{font-weight:700;margin:4px 0 0;font-size:12px}.note{color:#9a6200;font-size:.8rem}.id{font-family:ui-monospace,Consolas,monospace;font-weight:700}.log{font-size:13px}.log td:first-child{white-space:nowrap;color:#556079}.null{color:#556079;font-style:italic}';
    var out = '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Compte rendu — ' + esc(H.who) + '</title><style>' + css + '</style></head><body><h1>Compte rendu — ' + esc(TITLE) + '</h1><p><strong>' + esc(H.who) + '</strong> — ' + esc(H.classe) + ' — identifiant <span class="id">' + esc(H.id) + '</span><br>Travail commencé le ' + H.created + ' · édité le ' + d + ' · ' + H.saves + ' sauvegarde(s) dans un fichier, ' + H.restores + ' restauration(s)</p>';
    pages.forEach(function (p) {
      out += '<h2>' + p.n + ' — ' + esc(p.title) + '</h2>';
      if (!pageStats(p.id).started) { out += '<p class="null">Pas encore commencée.</p>'; return; }
      items.filter(function (x) { return x.page.id === p.id; }).forEach(function (x) {
        var r = itemResult(x);
        out += '<div class="it"><span class="res ' + (r.level || '') + '">' + esc(r.txt) + '</span><div class="lab">' + esc(x.it.label) + '</div>';
        if (x.st && x.st.editedAfter) out += '<div class="note">Réponse complétée après la consultation de la correction.</div>';
        if (x.it.type === 'answer' && x.st) { if (x.st.text) out += '<pre>' + esc(x.st.text) + '</pre>'; if (x.st.tables) out += tablesToHTML(x.st); }
        out += '</div>';
      });
    });
    out += '<h2>Journal</h2><table class="log">' + state.log.map(function (ev) { return '<tr><td>' + fmtDate(ev.t, true) + '</td><td>' + esc(eventText(ev)) + '</td></tr>'; }).join('') + '</table>';
    return out + '</body></html>';
  }
  function renderExport(el) {
    el.innerHTML = '<div class="row"><button type="button" class="btn primary" data-dlrep>Télécharger le compte rendu (.html)</button><button type="button" class="btn" data-copyrep>Copier le compte rendu (texte)</button><button type="button" class="btn ghost" data-showrep>Afficher</button></div><p class="note-line">Le compte rendu contient les réponses, les résultats des premières tentatives et le journal horodaté (tentatives, corrections consultées, sauvegardes, restaurations).</p><textarea id="rep-area" rows="12" readonly hidden style="width:100%;font:.8rem/1.45 var(--f-mono);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)"></textarea>';
    var area = $('#rep-area', el);
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-copyrep')) copyText(buildReport(false), b, area);
      if (b.hasAttribute('data-dlrep')) download('compte-rendu-' + (CONFIG.fileSlug || 'cours') + '-' + slug(fullName()) + '.html', buildReport(true), 'text/html');
      if (b.hasAttribute('data-showrep')) { area.hidden = !area.hidden; area.value = buildReport(false); b.textContent = area.hidden ? 'Afficher' : 'Masquer'; }
    });
  }
  function renderBackup(el) {
    el.innerHTML = '<div class="row"><button type="button" class="btn primary" data-dlbk>Sauvegarder dans un fichier</button><label class="btn" for="bk-file">Ouvrir un fichier de sauvegarde</label><input type="file" id="bk-file" accept=".json,application/json" class="sr-only"></div><div data-bkmsg></div>' +
      '<hr><div class="row"><button type="button" class="btn ghost" data-reset>Effacer mes réponses en cours…</button><span class="confirm" data-confirm hidden>Effacer les réponses de ce navigateur ? Les résultats des premières tentatives et le journal sont conservés. <button type="button" class="btn small" data-reset-yes style="border-color:var(--ko);color:var(--ko)">Oui, effacer</button><button type="button" class="btn small" data-reset-no>Annuler</button></span></div>';
    fileInput($('#bk-file', el), $('[data-bkmsg]', el));
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-dlbk')) fileSave();
      if (b.hasAttribute('data-reset')) $('[data-confirm]', el).hidden = false;
      if (b.hasAttribute('data-reset-no')) $('[data-confirm]', el).hidden = true;
      if (b.hasAttribute('data-reset-yes')) { state.items = {}; logEvent('reset'); saveNow(); render(PAGE); }
    });
  }

  /* ---------- démarrage ---------- */
  function start() {
    load(); buildShell(); buildManifest();
    var t = location.hash.slice(1);
    render(pageById(t) ? t : 'accueil');
    window.__support = { state: function () { return state; } }; // utile pour les tests
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
