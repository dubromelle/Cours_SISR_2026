/* Normalisation des bases de données — BTS SIO
   Mise en page : documentation en trois colonnes (parcours · contenu · sommaire de la page),
   inspirée des supports « Partie 1…4 » ; une seule colonne sur téléphone. */
:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #eef1f8;
  --fg: #161d2e;
  --muted: #556079;
  --line: #d8ddeb;
  --accent: #2c48c9;
  --accent-soft: #e5e9fb;
  --key: #a8550a;          /* clés primaires / étrangères */
  --key-soft: #fbefe2;
  --ok: #17803d;
  --ok-soft: #e3f4e8;
  --mid: #9a6200;
  --mid-soft: #fbf1d9;
  --ko: #c53030;
  --ko-soft: #fbe6e6;
  --shadow: 0 1px 2px rgba(22, 29, 46, .06), 0 4px 16px rgba(22, 29, 46, .05);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --top: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1420; --surface: #161d2c; --surface-2: #1d2639; --fg: #e5e9f3; --muted: #9ba6bf;
    --line: #2c3651; --accent: #93a6ff; --accent-soft: #1f2a4d; --key: #f2b469; --key-soft: #33261a;
    --ok: #5ad48a; --ok-soft: #15301f; --mid: #f3c35a; --mid-soft: #33290f; --ko: #ff8a8a; --ko-soft: #3a1b1d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1420; --surface: #161d2c; --surface-2: #1d2639; --fg: #e5e9f3; --muted: #9ba6bf;
  --line: #2c3651; --accent: #93a6ff; --accent-soft: #1f2a4d; --key: #f2b469; --key-soft: #33261a;
  --ok: #5ad48a; --ok-soft: #15301f; --mid: #f3c35a; --mid-soft: #33290f; --ko: #ff8a8a; --ko-soft: #3a1b1d;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(var(--top) + 16px); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 17px/1.65 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code, kbd { font-family: var(--f-mono); font-size: .86em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: .05em .35em; }
button { font: inherit; color: inherit; }
img { max-width: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- barre du haut ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--top);
  display: flex; align-items: center; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: .5ch; text-decoration: none; color: var(--fg); font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; white-space: nowrap; }
.brand span { color: var(--accent); }
.brand small { font: 600 .72rem var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.topbar .spacer { flex: 1; }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.who { font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
.theme-sel { font: inherit; font-size: .85rem; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }

.save-btn { white-space: nowrap; }
.save-btn.dirty { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.save-btn.dirty::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--key-soft); margin-right: 6px; vertical-align: 1px; }
.save-btn.dirty:hover:not(:disabled) { color: var(--surface); filter: brightness(1.08); }
.notices { max-width: calc(46rem + 15rem + 48px); margin: 0 auto 20px; display: grid; gap: 10px; }
.notice { border-radius: 12px; padding: 12px 16px; border: 1px solid var(--line); font-size: .93rem; }
.notice p { margin: 0 0 6px; }
.notice p:last-child { margin-bottom: 0; }
.notice.warn { background: var(--mid-soft); border-color: var(--mid); }
.notice.ko { background: var(--ko-soft); border-color: var(--ko); }

/* ---------- grille ---------- */
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - var(--top)); }
.sidebar {
  position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px)); align-self: start;
  height: calc(100vh - var(--top)); overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--surface);
  padding: 20px 14px 40px max(16px, env(safe-area-inset-left, 0px));
}
.nav-group { margin: 0 0 18px; }
.nav-group > p { margin: 0 0 6px 10px; font: 600 .72rem var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.nav-group ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav-link { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--fg); font-size: .93rem; line-height: 1.3; }
.nav-link:hover { background: var(--surface-2); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav-link .n { display: block; font: 600 .7rem var(--f-mono); color: var(--muted); letter-spacing: .03em; }
.nav-link[aria-current="page"] .n { color: var(--accent); }
.pill { font: 600 .68rem var(--f-mono); padding: 2px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill:empty { display: none; }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.go { background: var(--accent-soft); color: var(--accent); }

.main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
.page-grid { display: grid; grid-template-columns: minmax(0, 46rem) 15rem; gap: 48px; justify-content: center; }
.toc { position: sticky; top: calc(var(--top) + 24px); align-self: start; max-height: calc(100vh - var(--top) - 48px); overflow-y: auto; font-size: .85rem; }
.toc p { margin: 0 0 8px; font: 700 1rem var(--f-display); }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.toc a { display: block; color: var(--muted); text-decoration: none; line-height: 1.35; padding: 2px 0; }
.toc a.h3 { padding-left: 14px; }
.toc a:hover, .toc a.on { color: var(--accent); }
.toc a.on { font-weight: 700; }

/* ---------- contenu ---------- */
article { min-width: 0; counter-reset: h2; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 0 0 10px; font: 600 .78rem var(--f-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.eyebrow .kind { color: var(--accent); }
article h1 { font: 700 clamp(2rem, 4.2vw, 2.75rem)/1.12 var(--f-display); letter-spacing: -.02em; margin: 0 0 18px; text-wrap: balance; }
.lead { font-size: 1.12rem; color: var(--muted); margin: 0 0 26px; }
article h2 { font: 700 1.75rem/1.2 var(--f-display); letter-spacing: -.01em; margin: 56px 0 14px; text-wrap: balance; counter-increment: h2; counter-reset: h3; }
article h2::before { content: counter(h2) ". "; color: var(--accent); }
article h2.nonum::before { content: none; }
article h3 { font: 700 1.25rem/1.3 var(--f-display); margin: 34px 0 10px; counter-increment: h3; text-wrap: balance; }
article h3::before { content: counter(h2) "." counter(h3) ". "; color: var(--muted); }
article h3.nonum::before { content: none; }
article p, article li { max-width: 68ch; }
article ul, article ol { padding-left: 1.3em; }
article li + li { margin-top: 4px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }

/* étapes numérotées (comme les supports modèles) */
ol.steps { list-style: none; padding: 0; counter-reset: st; display: grid; gap: 14px; }
ol.steps > li { counter-increment: st; position: relative; padding-left: 42px; margin: 0; min-height: 28px; }
ol.steps > li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; font: 600 .8rem var(--f-mono); }

/* encadrés */
.aside { border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; padding: 14px 18px; margin: 22px 0; }
.aside > :first-child { margin-top: 0; }
.aside > :last-child { margin-bottom: 0; }
.aside-title { font-weight: 700; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
.aside-title::before { font: 700 .75rem var(--f-mono); padding: 1px 7px; border-radius: 99px; background: var(--surface); }
.aside.tip { border-color: var(--ok); background: var(--ok-soft); }
.aside.tip .aside-title::before { content: "ASTUCE"; color: var(--ok); }
.aside.note { border-color: var(--accent); }
.aside.note .aside-title::before { content: "NOTE"; color: var(--accent); }
.aside.caution { border-color: var(--mid); background: var(--mid-soft); }
.aside.caution .aside-title::before { content: "IMPORTANT"; color: var(--mid); }
.aside.next { border-color: var(--muted); background: var(--surface-2); }
.aside.next .aside-title::before { content: "LA SUITE"; color: var(--muted); }

/* définition : une fiche de vocabulaire */
.def { margin: 22px 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 18px; box-shadow: var(--shadow); }
.def dt { font: 700 1.05rem var(--f-display); color: var(--accent); }
.def dt small { font: 600 .72rem var(--f-mono); color: var(--muted); margin-left: 8px; letter-spacing: .05em; text-transform: uppercase; }
.def dd { margin: 4px 0 0; }
.def dd + dt { margin-top: 12px; }

/* schéma relationnel et dépendances */
.schema, .dfl {
  font-family: var(--f-mono); font-size: .93rem; line-height: 1.7;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px; margin: 14px 0; overflow-x: auto; white-space: nowrap; max-width: 100%;
}
.schema.stack, .dfl.stack { white-space: normal; }
.schema.stack > div, .dfl.stack > div { white-space: nowrap; }
.schema b, .dfl b { color: var(--accent); }
u, .pk { text-decoration: underline; text-decoration-color: var(--key); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.fk { color: var(--key); font-weight: 600; }
.dfa { display: inline-flex; align-items: center; margin: 0 .5ch; vertical-align: middle; color: var(--muted); font: 600 .7rem var(--f-mono); }
.dfa::before { content: ""; width: 1.4em; border-top: 1.5px solid currentColor; }
.dfa > span { padding: 0 3px; }
.dfa > i { display: inline-block; width: 1.6em; height: 0; border-top: 1.5px solid currentColor; position: relative; }
.dfa > i::after { content: ""; position: absolute; right: -2px; top: -5.25px; border-left: 8px solid currentColor; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
.ok-t { color: var(--ok); font-weight: 700; }
.ko-t { color: var(--ko); font-weight: 700; }

/* tables de données */
.tables { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; margin: 16px 0; }
.tbl { min-width: 0; max-width: 100%; overflow-x: auto; }
.tbl-name { margin: 0 0 4px; font: 700 .8rem var(--f-mono); letter-spacing: .06em; color: var(--muted); }
table.data { border-collapse: separate; border-spacing: 0; font-size: .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
table.data th, table.data td { padding: 6px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data th { font: 600 .78rem var(--f-mono); background: var(--surface-2); letter-spacing: .02em; }
table.data td { font-variant-numeric: tabular-nums; }
table.data td.null { color: var(--muted); font: italic .8rem var(--f-mono); }
table.data td.num, table.data th.num { color: var(--muted); font: .75rem var(--f-mono); text-align: right; width: 2.5em; }
table.data tr.hl td { background: var(--mid-soft); }
table.wide { width: 100%; }
.tbl-wrap { overflow-x: auto; max-width: 100%; margin: 14px 0; }
.tbl-wrap > table.data { min-width: 100%; }

/* carte mentale (vue d'ensemble) */
.carte { margin: 8px 0 26px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow-x: auto; }
.carte-in { display: flex; align-items: center; gap: 0; min-width: max-content; }
.carte-root { font: 700 1.05rem var(--f-display); padding: 10px 16px; border-radius: 10px; background: var(--accent); color: var(--surface); }
.carte ul { list-style: none; margin: 0; padding: 0 0 0 28px; position: relative; display: grid; gap: 8px; }
.carte ul::before { content: ""; position: absolute; left: 0; top: 50%; width: 28px; border-top: 2px solid var(--line); }
.carte li { position: relative; padding-left: 22px; margin: 0; max-width: none; }
.carte li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 2px solid var(--line); }
.carte li:first-child::before { top: 50%; }
.carte li:last-child::before { bottom: 50%; }
.carte li:only-child::before { display: none; }
.carte li::after { content: ""; position: absolute; left: 0; top: 50%; width: 22px; border-top: 2px solid var(--line); }
.carte li > span { display: inline-block; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: .92rem; line-height: 1.3; }
.carte li > span b { color: var(--accent); }

/* facture (exemple de document métier) */
.facture { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 18px 20px; margin: 18px 0; box-shadow: var(--shadow); font-size: .92rem; }
.facture header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; border-bottom: 2px dashed var(--line); padding-bottom: 10px; margin-bottom: 12px; }
.facture h4 { margin: 0; font: 700 1.1rem var(--f-display); letter-spacing: .08em; }
.facture .meta { font-family: var(--f-mono); font-size: .82rem; color: var(--muted); }
.facture .total td { font-weight: 700; }

/* niveaux d'exercice */
details.task { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin: 16px 0; box-shadow: var(--shadow); }
details.task > summary { cursor: pointer; list-style: none; padding: 14px 18px; display: flex; gap: 12px; align-items: center; font: 700 1.05rem var(--f-display); }
details.task > summary::-webkit-details-marker { display: none; }
details.task > summary::after { content: "+"; margin-left: auto; font: 600 1.2rem var(--f-mono); color: var(--muted); }
details.task[open] > summary::after { content: "−"; }
details.task > summary .lvl { font: 600 .7rem var(--f-mono); padding: 3px 8px; border-radius: 99px; letter-spacing: .04em; white-space: nowrap; }
.lvl1 .lvl { background: var(--ok-soft); color: var(--ok); }
.lvl2 .lvl { background: var(--accent-soft); color: var(--accent); }
.lvl3 .lvl { background: var(--key-soft); color: var(--key); }
details.task > .task-body { padding: 0 18px 18px; border-top: 1px solid var(--line); }

/* ---------- composants interactifs ---------- */
.btn { cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: 9px; font-size: .9rem; font-weight: 700; line-height: 1.2; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover:not(:disabled) { color: var(--surface); filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); font-weight: 600; }
.btn.small { padding: 4px 9px; font-size: .8rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.note-line { font-size: .84rem; color: var(--muted); }

/* quiz */
.quiz { margin: 22px 0; }
.qz { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.qz-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.qz-title { margin: 0; font: 700 1.02rem var(--f-display); }
.qz-badge { font: 600 .75rem var(--f-mono); background: var(--surface-2); border-radius: 99px; padding: 3px 9px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.qz-body { padding: 18px 20px; }
.qz-q { font-weight: 700; margin: 0 0 14px; }
.qz-opts { display: grid; gap: 8px; }
.qz-opt { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; text-align: left; cursor: pointer; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: .95rem; line-height: 1.45; }
.qz-opt .l { font: 700 .75rem/1.9 var(--f-mono); color: var(--muted); }
.qz-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.qz-opt:disabled { cursor: default; }
.qz-opt.good { border-color: var(--ok); background: var(--ok-soft); }
.qz-opt.bad { border-color: var(--ko); background: var(--ko-soft); }
.qz-opt.good .l, .qz-opt.bad .l { color: var(--fg); }
.qz-hint { margin-top: 12px; }
.qz-hint-box, .hint-box { margin-top: 8px; padding: 10px 14px; border-radius: 10px; background: var(--mid-soft); font-size: .92rem; }
.qz-fb { margin-top: 14px; padding: 12px 16px; border-radius: 10px; font-size: .94rem; }
.qz-fb.good { background: var(--ok-soft); }
.qz-fb.bad { background: var(--ko-soft); }
.qz-fb > strong { display: block; margin-bottom: 4px; }
.qz-fb.good > strong { color: var(--ok); }
.qz-fb.bad > strong { color: var(--ko); }
.qz-fb p { margin: 6px 0 0; }
.qz-foot { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2); }
.qz-track { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.qz-track > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.qz-score { font: 700 2.2rem var(--f-display); margin: 0; font-variant-numeric: tabular-nums; }
.qz-recap { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; font-size: .9rem; }
.qz-recap li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; max-width: none; margin: 0; }

/* réponse rédigée */
.answer { margin: 18px 0 26px; }
.ans { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.ans-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.ans-tag { font: 600 .74rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.ans-saved { font-size: .78rem; color: var(--muted); }
.ans-body { padding: 14px 16px; display: grid; gap: 10px; }
.ans textarea { width: 100%; resize: vertical; min-height: 4.5em; font: .95rem/1.55 var(--f-body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.ans.k-schema textarea { font-family: var(--f-mono); font-size: .88rem; }
.ans textarea:focus, .te input:focus, .field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.ans-syntax { font-size: .8rem; color: var(--muted); }
.ans-syntax code { font-size: .78rem; }
.ans-preview { font-family: var(--f-mono); font-size: .88rem; padding: 8px 12px; border-radius: 10px; border: 1px dashed var(--line); white-space: pre-wrap; overflow-x: auto; min-height: 2.4em; }
.ans-preview:empty::before { content: "Aperçu de la notation…"; color: var(--muted); font-style: italic; }
.ans-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ans-corr { border-top: 1px solid var(--line); padding: 14px 16px; background: var(--ok-soft); }
.ans-corr-title { margin: 0 0 6px; font: 700 .78rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ok); }
.ans-corr > :last-child { margin-bottom: 0; }
.ans-corr .schema, .ans-corr .dfl, .ans-corr table.data { background: var(--surface); }
.ans-self { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 8px; border-radius: 0 0 14px 14px; }
.ans-self p { margin: 0; font-size: .9rem; font-weight: 700; }
.self-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.self-btn { cursor: pointer; border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 99px; font-size: .88rem; font-weight: 700; }
.self-btn[aria-pressed="true"].s-ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.self-btn[aria-pressed="true"].s-mid { background: var(--mid); border-color: var(--mid); color: var(--surface); }
.self-btn[aria-pressed="true"].s-ko { background: var(--ko); border-color: var(--ko); color: var(--surface); }
.self-btn.s-ok:hover { border-color: var(--ok); }
.self-btn.s-mid:hover { border-color: var(--mid); }
.self-btn.s-ko:hover { border-color: var(--ko); }

/* éditeur de tables */
.te { display: grid; gap: 12px; }
.te-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); min-width: 0; }
.te-name { font: 700 .85rem var(--f-mono); width: min(100%, 22ch); padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--fg); text-transform: uppercase; }
.te-scroll { overflow-x: auto; margin: 8px 0; }
.te table { border-collapse: collapse; }
.te th, .te td { border: 1px solid var(--line); padding: 0; background: var(--surface); }
.te th { background: var(--surface-2); vertical-align: top; }
.te input.c { font: .82rem var(--f-mono); width: 16ch; border: 0; padding: 6px 7px; background: transparent; color: var(--fg); }
.te th input.c { font-weight: 600; }
.te th.is-pk input.c { text-decoration: underline; text-decoration-color: var(--key); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.te-flags { display: flex; gap: 4px; padding: 0 5px 5px; }
.te-flag { cursor: pointer; font: 600 .65rem var(--f-mono); padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.te-flag[aria-pressed="true"] { background: var(--key); border-color: var(--key); color: var(--surface); }
.te-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.te-links { display: grid; gap: 4px; font-size: .85rem; }
.te-links input { font: .85rem var(--f-mono); padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }

/* tableau à cocher (OUI / NON…) */
.ctab, .match, .pick { margin: 18px 0 26px; }
.ck { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.ck-head { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.ck-scroll { overflow-x: auto; }
.ck table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.ck th, .ck td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.ck th { font: 600 .74rem var(--f-mono); background: var(--surface-2); letter-spacing: .03em; white-space: nowrap; }
.ck td.lab { min-width: 14em; }
.ck td.cell { white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { cursor: pointer; border: 0; background: var(--surface); padding: 5px 10px; font: 600 .78rem var(--f-mono); color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.seg button:disabled { cursor: not-allowed; opacity: .4; }
td.cell.good .seg { outline: 2px solid var(--ok); outline-offset: 2px; }
td.cell.bad .seg { outline: 2px solid var(--ko); outline-offset: 2px; }
td.cell .mark, .m-row .mark { font: 700 .8rem var(--f-mono); margin-left: 6px; }
.good .mark { color: var(--ok); }
.bad .mark { color: var(--ko); }
tr.ck-expl td { background: var(--surface-2); font-size: .86rem; color: var(--fg); padding-top: 6px; }
.ck-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: var(--surface-2); }
.ck-msg { font-size: .9rem; font-weight: 700; }
.ck-msg.good { color: var(--ok); }
.ck-msg.bad { color: var(--ko); }
.ck-msg.mid { color: var(--mid); }
.ck-after { padding: 12px 16px; border-top: 1px solid var(--line); background: var(--ok-soft); font-size: .93rem; }
.ck-after > :first-child { margin-top: 0; }
.ck-after > :last-child { margin-bottom: 0; }

.m-list { display: grid; }
.m-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(12rem, 16rem); gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.m-row select { font: inherit; font-size: .88rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; }
.m-row.good select { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
.m-row.bad select { border-color: var(--ko); box-shadow: 0 0 0 1px var(--ko); }
.m-row .m-expl { grid-column: 1 / -1; font-size: .85rem; background: var(--surface-2); padding: 6px 10px; border-radius: 8px; }

.pick tbody tr { cursor: pointer; }
.pick tbody tr:hover td { background: var(--accent-soft); }
.pick tbody tr.picked td { background: var(--accent-soft); box-shadow: inset 0 0 0 0 transparent; }
.pick tbody tr.picked td:first-child { box-shadow: inset 4px 0 0 var(--accent); }
.pick tbody tr.p-good td { background: var(--ok-soft); }
.pick tbody tr.p-bad td { background: var(--ko-soft); }
.pick tbody tr.p-miss td { background: var(--mid-soft); }
.pick tbody tr.p-good td:first-child { box-shadow: inset 4px 0 0 var(--ok); }
.pick tbody tr.p-bad td:first-child { box-shadow: inset 4px 0 0 var(--ko); }
.pick tbody tr.p-miss td:first-child { box-shadow: inset 4px 0 0 var(--mid); }
.pick .ck-scroll { padding: 12px 16px; }
.pick table.data { width: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

/* progression de la page */
.page-progress { margin: 48px 0 0; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); display: grid; gap: 10px; }
.page-progress p { margin: 0; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.bar.full > span { background: var(--ok); }

/* navigation de séquence */
.seq { margin-top: 28px; display: grid; gap: 12px; }
.seq-progress { font-size: .85rem; color: var(--muted); margin: 0; }
.seq-links { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seq-link { display: grid; gap: 2px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--fg); background: var(--surface); }
.seq-link:hover { border-color: var(--accent); }
.seq-link.next { text-align: right; grid-column: 2; }
.seq-dir { font-size: .8rem; color: var(--muted); }
.seq-title { font-weight: 700; color: var(--accent); line-height: 1.3; }

/* champs (accueil / bilan) */
.field { display: grid; gap: 4px; }
.field label { font-size: .85rem; font-weight: 700; }
.field input, .field textarea, .field select { font: inherit; font-size: .95rem; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; }
.field textarea { font: .82rem/1.45 var(--f-mono); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 12px; margin: 14px 0; }
.panel { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 16px 18px; margin: 18px 0; box-shadow: var(--shadow); }
.panel > :first-child { margin-top: 0; }
.panel > :last-child { margin-bottom: 0; }

.parcours { list-style: none; padding: 0; margin: 18px 0; display: grid; gap: 8px; }
.parcours li { max-width: none; margin: 0; }
.parcours a { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; color: var(--fg); }
.parcours a:hover { border-color: var(--accent); }
.parcours .k { font: 600 .74rem var(--f-mono); color: var(--muted); letter-spacing: .03em; }
.parcours .k.tp { color: var(--key); }
.parcours .t { font-weight: 700; line-height: 1.3; }
.parcours .t small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 12px; margin: 16px 0; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.stat b { display: block; font: 700 1.7rem var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: .82rem; color: var(--muted); }
.bilan-tbl td, .bilan-tbl th { white-space: nowrap; }
.bilan-tbl td:first-child { white-space: normal; min-width: 12em; }
.revoir { display: grid; gap: 6px; padding-left: 1.2em; }
.chip { display: inline-block; font: 600 .7rem var(--f-mono); padding: 1px 7px; border-radius: 99px; margin-right: 6px; }
.chip.ko { background: var(--ko-soft); color: var(--ko); }
.chip.mid { background: var(--mid-soft); color: var(--mid); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .9rem; }

/* ---------- responsive ---------- */
@media (max-width: 1240px) {
  .page-grid { grid-template-columns: minmax(0, 46rem); }
  .notices { max-width: 46rem; }
  .toc { display: none; }
}
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-block; }
  .sidebar { position: fixed; z-index: 45; top: calc(var(--top) + env(safe-area-inset-top, 0px)); left: 0; width: min(86vw, 320px); transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow); }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 25, .4); }
  .who { display: none; }
}
@media (max-width: 560px) {
  body { font-size: 16px; }
  .brand small { display: none; }
  .brand { font-size: 1.05rem; }
  .topbar { gap: 8px; }
  .theme-sel { display: none; }
  .brand span { display: none; }
  .seq-links { grid-template-columns: 1fr; }
  .seq-link.next { grid-column: 1; }
  .parcours a { grid-template-columns: minmax(0, 1fr) auto; }
  .parcours .k { grid-column: 1 / -1; }
  .m-row { grid-template-columns: minmax(0, 1fr); }
  .qz-body, .qz-head, .qz-foot { padding-left: 14px; padding-right: 14px; }
  .carte-in { flex-direction: column; align-items: flex-start; min-width: 0; gap: 10px; }
  .carte ul { padding-left: 14px; }
  .carte ul::before { display: none; }
  .carte li > span { white-space: normal; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}

/* ---------- fichier unique : démarrage, entraînement, rappel ---------- */
.mono { font-family: var(--f-mono); letter-spacing: .03em; }
.qz-badge.train { background: var(--mid-soft); color: var(--mid); }
.qz-first, .qz-first-inline { font-size: .84rem; color: var(--muted); }
.qz-first { padding: 8px 20px; border-top: 1px solid var(--line); }
.panel.start { border-width: 2px; border-color: var(--accent); display: grid; gap: 10px; }
.panel.start.ok { border-color: var(--ok); }
.panel.start p { margin: 0; }
.panel.start hr { margin: 6px 0; }
.start-step { font: 600 .74rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.panel.start.ok .start-step { color: var(--ok); }
.start-who { font: 700 1.3rem var(--f-display); margin: 0; }
.panel.start .fields { margin: 0; }
.ident-edit summary { cursor: pointer; font-size: .88rem; color: var(--muted); }
.ident-edit[open] { display: grid; gap: 10px; }
.notice.gate { margin-top: 10px; }
a.btn { text-decoration: none; display: inline-block; }
.remind {
  position: fixed; z-index: 70; max-width: min(26rem, calc(100vw - 32px));
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border: 2px solid var(--mid); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); font-size: .92rem;
  display: grid; gap: 8px;
}
.remind p { margin: 0; }
.notices:empty, .notices[hidden] { display: none; }

/* ---------- code (SQL, C#, PHP…) ---------- */
pre.code { font: .86rem/1.55 var(--f-mono); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 14px 0; }
pre.code.terminal { background: #10151f; color: #dce3f0; border-color: #10151f; }
pre.code .kw { color: var(--accent); font-weight: 600; }
pre.code.terminal .kw { color: #93a6ff; }
.ans.k-code textarea { font-family: var(--f-mono); font-size: .88rem; tab-size: 4; }

/* ---------- Ajouts du chapitre 2 (réseaux) ---------- */
.answer, .ans-prompt, .task-body { min-width: 0; }
.ans-prompt pre.code { max-width: 100%; overflow-x: auto; }
pre.code .cm { color: var(--muted); font-style: italic; }
pre.code .pr { color: var(--ok); font-weight: 600; }
pre.code .st { color: var(--key); }
pre.code .hl { background: var(--mid-soft); color: var(--fg); border-radius: 3px; }
figure.fig { margin: 1.4rem 0; padding: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
figure.fig svg { display: block; width: 100%; height: auto; max-width: 760px; margin: 0 auto; }
figure.fig figcaption { margin-top: .6rem; font-size: .88rem; color: var(--muted); text-align: center; }
figure.fig svg text { fill: var(--fg); font-family: var(--f-body); font-size: 13px; }
figure.fig svg text.sm { font-size: 11px; fill: var(--muted); }
figure.fig svg text.b { font-weight: 700; }
figure.fig svg .ln { stroke: var(--muted); stroke-width: 2; fill: none; }
figure.fig svg .ln-acc { stroke: var(--accent); stroke-width: 2.5; fill: none; }
figure.fig svg .bx { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; }
figure.fig svg .bx-acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
figure.fig svg .bx-key { fill: var(--key-soft); stroke: var(--key); stroke-width: 1.5; }
figure.fig svg .bx-ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.5; }
figure.fig svg .bx-mid { fill: var(--mid-soft); stroke: var(--mid); stroke-width: 1.5; }
figure.fig svg .dot { fill: var(--accent); }
.encap { display: grid; gap: 6px; font-family: var(--f-mono); font-size: .8rem; margin: 1rem 0; }
.encap > div { display: flex; align-items: stretch; gap: 0; overflow-x: auto; }
.encap .lab { flex: 0 0 8.5rem; font-family: var(--f-body); font-size: .85rem; color: var(--muted); padding: .35rem .5rem .35rem 0; }
.encap span { padding: .35rem .55rem; border: 1px solid var(--line); white-space: nowrap; }
.encap span + span { border-left: 0; }
.encap .h2l { background: var(--key-soft); } .encap .h3l { background: var(--accent-soft); }
.encap .h4l { background: var(--ok-soft); } .encap .d7 { background: var(--surface-2); flex: 1 0 auto; }
.encap .t2l { background: var(--key-soft); }
table.data.bits td, table.data.bits th { text-align: center; font-family: var(--f-mono); padding-left: .45rem; padding-right: .45rem; }
table.data td.hl, table.data th.hl { background: var(--mid-soft); }
table.data td.mono, .mono { font-family: var(--f-mono); }
.dl-cap { display: inline-flex; align-items: center; gap: .5rem; padding: .55rem .9rem; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; text-decoration: none; }
.dl-cap:hover { background: var(--accent); color: #fff; }
.aside.deep { border-color: var(--accent); background: var(--accent-soft); }
.aside.deep .aside-title::before { content: "EN PROFONDEUR"; color: var(--accent); }
.aside.pro { border-color: var(--key); background: var(--key-soft); }
.aside.pro .aside-title::before { content: "EN ENTREPRISE"; color: var(--key); }
.refco { font-size: .88rem; color: var(--muted); }
@media (max-width: 600px) {
  .encap > div { flex-wrap: wrap; }
  .encap .lab { flex-basis: 100%; padding-bottom: 0; }
}

<h1 data-cfg="title">Titre du cours</h1>
<p class="lead"><span data-cfg="lead"></span> Chaque activité se corrige seul : répondre, comparer, s’auto-évaluer.</p>

<div class="aside caution">
  <p class="aside-title">À lire avant tout</p>
  <p><strong>Fermer le navigateur sans avoir sauvegardé, c’est risquer de perdre son travail.</strong> Les réponses sont gardées par le navigateur tant qu’il le veut bien : un autre poste, un poste du lycée réinitialisé ou un navigateur qui efface ses données suffisent à tout perdre. Seul le <strong>fichier de sauvegarde</strong> est sûr.</p>
</div>

<p>Avant d’accéder au cours : saisir son identité, puis créer son fichier de sauvegarde. Si le travail a déjà commencé ailleurs, ouvrir son dernier fichier de sauvegarde.</p>
<div id="start" data-widget="start"></div>

<h2>Mode d’emploi</h2>
<ol class="steps">
  <li>Suivre le parcours dans l’ordre : chaque partie s’appuie sur la précédente, et les TP arrivent au moment où les notions nécessaires ont été vues.</li>
  <li>Lire le cours, répondre aux questions au fil de la page, puis faire le quiz « Vérifier ses connaissances ».</li>
  <li>Pour chaque réponse rédigée, écrire sa propre réponse avant de demander la correction : le bouton « Comparer avec la correction » ne s’active qu’ensuite.</li>
  <li>Comparer, puis s’auto-évaluer : <span class="chip ok">Réussi</span><span class="chip mid">En partie</span><span class="chip ko">À revoir</span></li>
  <li>Terminer par le bilan : il liste les points à revoir et produit le compte rendu à rendre.</li>
</ol>

<h2>Les types d’activités</h2>
<dl class="def">
  <dt>Quiz</dt><dd>Questions à choix multiple, avec indice et explication après chaque réponse.</dd>
  <dt>Activité auto-corrigée</dt><dd>Tableaux à cocher, associations, lignes à repérer dans une capture ou une table : la vérification est immédiate, avec une explication pour chaque ligne.</dd>
  <dt>Réponse rédigée</dt><dd>Calculs d’adressage, plans d’adressage, commandes, explications et diagnostics. La correction se débloque après la rédaction ; l’auto-évaluation termine l’activité. Pour un calcul, <strong>poser le calcul</strong> (binaire, taille de bloc) : c’est la méthode qui est corrigée, pas seulement le résultat.</dd>
  <dt>La première tentative fait foi</dt><dd>Pour les quiz et les activités auto-corrigées, le premier résultat est retenu dans le bilan. Il est ensuite possible de recommencer autant de fois que l’on veut, en mode <span class="qz-badge train">Entraînement</span>, sans changer ce résultat.</dd>
  <dt>Niveaux d’exercice</dt><dd><span class="chip ok">essentiel</span> pour tous, <span class="chip" style="background:var(--accent-soft);color:var(--accent)">intermédiaire</span> pour consolider, <span class="chip" style="background:var(--key-soft);color:var(--key)">défi</span> pour aller plus loin.</dd>
  <dt>Encadrés « En profondeur » et « En entreprise »</dt><dd>Ils expliquent le pourquoi des choses (histoire, normes, fonctionnement interne) et la réalité du terrain. Ils ne sont pas évalués, mais ce sont eux qui permettent de comprendre au lieu d’apprendre par cœur, et de savoir réexpliquer une notion à quelqu’un.</dd>
</dl>

<h2>Le fil rouge : sécuriser la M2L</h2>
<p>La <strong>M2L</strong> du Réseau Certa accueille 24 ligues, des visiteurs en Wi-Fi, un site web public et des données personnelles (adhérents, licenciés, bénévoles). Les chapitres précédents ont construit son réseau (adressage, VLAN, DMZ, pare-feu) et son système d’information (domaine <code>m2l.lan</code>, sauvegardes, GLPI). Ce chapitre se place du point de vue de la sécurité : quels risques pèsent sur la M2L, comment protéger ses comptes, son réseau et ses services, et comment réagir le jour où une attaque réussit.</p>
<p class="refco">Public : tronc commun (SISR et SLAM). La partie 3 et le TP 16 (sécurité des commutateurs et du Wi-Fi) sont plus orientés SISR, mais ne demandent que les bases de commutation du chapitre 2 ; les parties 2 et 4 (mots de passe, hachage, HTTPS) intéressent directement les développeurs SLAM. Prérequis : chapitres 2, 3 et 5 ; le TP 12 (DMZ) est utile mais pas obligatoire.</p>

<h2>Compétences travaillées</h2>
<ul class="refco">
  <li><strong>B3.1</strong> Protéger les données à caractère personnel : recenser les traitements, vérifier le respect des droits des personnes.</li>
  <li><strong>B3.2</strong> Préserver l’identité numérique de l’organisation : protéger l’identité numérique d’un compte, d’un site.</li>
  <li><strong>B3.3</strong> Sécuriser les équipements et les usages des utilisateurs : informer sur les risques, gérer les accès et les privilèges, vérifier l’efficacité de la protection.</li>
  <li><strong>B3.4</strong> Garantir la disponibilité, l’intégrité et la confidentialité des services informatiques et des données : caractériser les risques liés aux services, recenser les vulnérabilités, réagir à un incident de sécurité.</li>
  <li><strong>B2.3 SISR</strong> (partie 3, TP 16) : sécuriser les équipements d’interconnexion.</li>
</ul>

<template data-page="p1">
<h1>Les fondamentaux : risques, besoins de sécurité et cadre légal</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : chapitres 2 à 5 (réseau de la M2L, DMZ, domaine <code>m2l.lan</code>, journaux, sauvegardes). Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Sécurité du SI</div><ul>
  <li><span><b>Besoins</b> : disponibilité, intégrité, confidentialité, preuve</span></li>
  <li><span><b>Risque</b> : actif, menace, vulnérabilité, impact</span></li>
  <li><span><b>Traiter</b> : réduire, transférer, éviter, accepter</span></li>
  <li><span><b>Acteurs</b> : ANSSI, CNIL, CERT-FR, Cybermalveillance</span></li>
  <li><span><b>Droit</b> : RGPD, Code pénal, charte informatique</span></li>
</ul></div></figure>

<p class="lead">La sécurité informatique n’est pas une liste d’outils à installer. C’est une démarche : savoir ce que l’on protège, contre quoi, et à quel prix. Un technicien qui ajoute un pare-feu sans savoir quel risque il traite perd son temps ; un technicien qui sait expliquer pourquoi une mesure est nécessaire la fait accepter par sa direction et par les utilisateurs.</p>

<h2>Ce que l’on protège : les besoins de sécurité</h2>
<p>On décrit les besoins de sécurité d’une information ou d’un service par quatre critères, souvent résumés par le sigle <strong>DICP</strong> :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Critère</th><th>Question</th><th>Exemple d’atteinte à la M2L</th><th>Protections typiques</th></tr>
  <tr><td><strong>Disponibilité</strong></td><td>Le service est-il accessible quand on en a besoin ?</td><td>Le serveur de fichiers est chiffré par un rançongiciel : les ligues ne peuvent plus travailler.</td><td>Sauvegardes, redondance, onduleur, supervision</td></tr>
  <tr><td><strong>Intégrité</strong></td><td>L’information est-elle exacte et complète, non modifiée sans autorisation ?</td><td>Le site web est défiguré ; le RIB d’un fournisseur est modifié dans un courriel.</td><td>Droits d’accès, hachage, signature, journalisation</td></tr>
  <tr><td><strong>Confidentialité</strong></td><td>L’information n’est-elle accessible qu’aux personnes autorisées ?</td><td>La liste des licenciés d’une ligue, avec adresses et dates de naissance, circule sur Internet.</td><td>Authentification, droits, chiffrement</td></tr>
  <tr><td><strong>Preuve</strong> (traçabilité)</td><td>Peut-on savoir qui a fait quoi, et le prouver ?</td><td>Un compte administrateur a été créé, mais personne ne sait par qui.</td><td>Journaux horodatés et centralisés, comptes nominatifs</td></tr>
</table></div>
<p>On ajoute parfois l’<strong>authenticité</strong> (être sûr de l’identité de l’émetteur) et la <strong>non-répudiation</strong> (l’émetteur ne peut pas nier avoir envoyé un message), que l’on obtient par la signature électronique (partie 4).</p>
<p>Tous les actifs n’ont pas les mêmes besoins. On les note souvent de 1 (faible) à 4 (critique) pour chaque critère : le site web public a un besoin de confidentialité faible (tout y est public) mais un besoin d’intégrité fort (une défiguration nuit à l’image de la M2L) ; le fichier des licenciés a un besoin de confidentialité fort (données personnelles).</p>

<div class="ctab" data-id="c-dicp" data-head="Événement" data-cols="Critère principalement atteint" data-choices="D|I|C|P" data-label="Quel critère de sécurité est atteint ?">
  <div class="r" data-ok="C" data-expl="Des personnes non autorisées ont eu accès à l’information : confidentialité.">Un bénévole envoie par erreur le tableau des licenciés de la ligue de tennis (noms, adresses, certificats médicaux) à toute sa liste de contacts.</div>
  <div class="r" data-ok="D" data-expl="Le service est indisponible : disponibilité.">Une coupure électrique arrête la salle serveur pendant toute une matinée ; aucun onduleur n’est installé.</div>
  <div class="r" data-ok="I" data-expl="Une information a été modifiée sans autorisation : intégrité.">Un attaquant modifie la page d’accueil du site web de la M2L pour y afficher un message revendicatif.</div>
  <div class="r" data-ok="P" data-expl="On ne peut pas savoir qui a agi : absence de traçabilité (preuve).">Un dossier partagé a été supprimé ; les journaux d’accès n’étaient pas activés et tout le monde utilise le compte commun « accueil ».</div>
  <div class="r" data-ok="I" data-expl="Le montant (la donnée) a été modifié : intégrité. C’est le principe de la fraude au faux RIB.">Le RIB d’un fournisseur est remplacé dans une facture transmise par courriel ; le paiement part vers le compte d’un escroc.</div>
  <div class="r" data-ok="D" data-expl="Le service est saturé et inaccessible : disponibilité. C’est une attaque par déni de service distribué (DDoS).">Des milliers de machines envoient des requêtes au site web, qui ne répond plus pendant la période des inscriptions.</div>
</div>

<h2>Le vocabulaire du risque</h2>
<dl class="def">
  <dt>Actif (ou bien)</dt><dd>Ce qui a de la valeur pour l’organisation. On distingue les <strong>biens essentiels</strong> (informations et processus métier : le fichier des licenciés, la réservation des salles) et les <strong>biens supports</strong> sur lesquels ils reposent (serveurs, réseau, logiciels, personnes, locaux).</dd>
  <dt>Menace</dt><dd>Cause potentielle d’un incident : un attaquant, une erreur humaine, une panne, un incendie. Elle suit souvent un <strong>scénario</strong> : hameçonnage, puis vol de mot de passe, puis rançongiciel.</dd>
  <dt>Vulnérabilité</dt><dd>Faiblesse qu’une menace peut exploiter : logiciel non mis à jour, mot de passe faible, port ouvert inutile, utilisateur non sensibilisé, salle serveur non fermée à clé.</dd>
  <dt>Impact (gravité)</dt><dd>Conséquences si l’incident se produit : arrêt d’activité, coût, atteinte à l’image, sanction, atteinte aux personnes.</dd>
  <dt>Risque</dt><dd>Combinaison de la <strong>vraisemblance</strong> qu’une menace exploite une vulnérabilité et de la <strong>gravité</strong> de l’impact. On le résume souvent par : <strong>risque = vraisemblance × gravité</strong>.</dd>
</dl>
<p>Sans vulnérabilité, la menace ne peut rien ; sans menace, la vulnérabilité ne coûte rien ; sans actif de valeur, il n’y a rien à perdre. La sécurité agit surtout sur les vulnérabilités (on ne supprime pas les attaquants) et sur l’impact (sauvegardes, plan de reprise).</p>

<h3>Traiter un risque</h3>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Option</th><th>Principe</th><th>Exemple à la M2L</th></tr>
  <tr><td><strong>Réduire</strong></td><td>Mettre en place des mesures qui diminuent la vraisemblance ou la gravité</td><td>Authentification à deux facteurs sur la messagerie ; sauvegardes hors ligne</td></tr>
  <tr><td><strong>Transférer</strong></td><td>Faire porter tout ou partie du risque par un tiers</td><td>Assurance cyber ; hébergement du site chez un prestataire qui s’engage par contrat</td></tr>
  <tr><td><strong>Éviter</strong></td><td>Renoncer à l’activité qui crée le risque</td><td>Ne plus conserver les copies des certificats médicaux des licenciés</td></tr>
  <tr><td><strong>Accepter</strong></td><td>Assumer un risque jugé faible, en connaissance de cause et par écrit</td><td>Pas de second accès à Internet : une coupure de quelques heures est acceptée par la direction</td></tr>
</table></div>
<p>Le <strong>risque résiduel</strong> est celui qui reste après traitement : il doit être connu et accepté par la direction, pas par le technicien seul. En France, la méthode d’analyse de risques de référence est <strong>EBIOS Risk Manager</strong>, publiée par l’ANSSI ; la norme internationale de management de la sécurité est l’<strong>ISO/IEC 27001</strong>.</p>

<div class="answer" data-id="a-risques" data-label="Analyse de trois risques de la M2L" data-min="250" data-rows="10">
  <p>Pour chacune des situations suivantes, identifier l’actif, la menace, la vulnérabilité, l’impact principal (avec le critère DICP), puis proposer une mesure et dire s’il s’agit de réduire, transférer, éviter ou accepter le risque. 1) Le Wi-Fi visiteurs et le réseau des ligues sont dans le même VLAN. 2) Le serveur web de la DMZ fonctionne avec une version de Debian qui n’a pas été mise à jour depuis deux ans. 3) Les secrétaires des ligues notent leur mot de passe sur un papier collé sous le clavier.</p>
  <div class="corr">
    <p>1) Actif : les postes et les données des ligues. Menace : un visiteur malveillant, ou un appareil infecté apporté par un visiteur. Vulnérabilité : absence de cloisonnement. Impact : vol ou chiffrement de données (C, D). Mesure : séparer le Wi-Fi visiteurs dans son propre VLAN filtré vers Internet seulement (chapitre 4) : réduire.</p>
    <p>2) Actif : le site web (image de la M2L) et le serveur. Menace : un attaquant qui exploite une faille connue, publiée et parfois exploitée automatiquement par des robots. Vulnérabilité : logiciels non mis à jour. Impact : défiguration (I), arrêt du site (D), rebond vers d’autres machines. Mesure : mises à jour régulières et automatiques de sécurité, veille du CERT-FR (TP 17, partie 5) : réduire.</p>
    <p>3) Actif : les comptes et les données des ligues. Menace : une personne de passage (visiteur, prestataire). Vulnérabilité : mot de passe exposé, utilisateurs non sensibilisés. Impact : usurpation d’identité, accès aux données (C, P : les actions faites avec le compte seraient attribuées à la secrétaire). Mesure : sensibilisation, gestionnaire de mots de passe, authentification à deux facteurs (partie 2) : réduire.</p>
  </div>
</div>

<h2>Les acteurs de la cybersécurité en France</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Acteur</th><th>Rôle</th><th>Utile pour</th></tr>
  <tr><td><strong>ANSSI</strong> (Agence nationale de la sécurité des systèmes d’information)</td><td>Autorité nationale : défense des systèmes de l’État et des opérateurs essentiels, guides et recommandations, certification de produits</td><td>Guide d’hygiène informatique (42 mesures), recommandations sur les mots de passe, SSH, TLS…</td></tr>
  <tr><td><strong>CERT-FR</strong></td><td>Centre gouvernemental de veille, d’alerte et de réponse aux attaques, rattaché à l’ANSSI</td><td>Avis et alertes de sécurité sur les logiciels courants (veille, partie 5)</td></tr>
  <tr><td><strong>CNIL</strong> (Commission nationale de l’informatique et des libertés)</td><td>Autorité de protection des données personnelles : conseil, contrôle, sanction</td><td>Guide de la sécurité des données personnelles, notification des violations de données</td></tr>
  <tr><td><strong>Cybermalveillance.gouv.fr</strong></td><td>Dispositif d’assistance aux particuliers, entreprises, associations et collectivités victimes</td><td>Diagnostic en ligne, mise en relation avec des prestataires, fiches de sensibilisation ; plateforme <strong>17Cyber</strong></td></tr>
  <tr><td><strong>Police et gendarmerie</strong></td><td>Enquêtes, réception des plaintes</td><td>Porter plainte après une attaque ; signalement en ligne</td></tr>
</table></div>

<div class="aside deep">
  <p class="aside-title">En profondeur : l’hygiène informatique</p>
  <p>Le <strong>guide d’hygiène informatique</strong> de l’ANSSI regroupe 42 mesures simples qui suffisent à bloquer une grande partie des attaques courantes : connaître son parc, sensibiliser les utilisateurs, comptes nominatifs, comptes d’administration séparés, mots de passe robustes, mises à jour, cloisonnement du réseau, sauvegardes hors ligne, journaux… La plupart de ces mesures ont déjà été mises en place dans les chapitres 2 à 5 : le chapitre 6 en donne la justification. Pour une association comme la M2L, appliquer ces mesures de base protège bien plus qu’acheter un produit coûteux.</p>
</div>

<h2>Le cadre légal</h2>
<h3>Le RGPD : protéger les données personnelles</h3>
<p>Le <strong>Règlement général sur la protection des données</strong> (RGPD), applicable depuis le 25 mai 2018 dans toute l’Union européenne, encadre tout <strong>traitement de données à caractère personnel</strong> : toute information qui permet d’identifier directement ou indirectement une personne (nom, adresse électronique, adresse IP, identifiant, photo, numéro de licence…).</p>
<ul>
  <li><strong>Principes</strong> : une finalité précise et légitime ; seulement les données nécessaires (minimisation) ; des données exactes ; une <strong>durée de conservation</strong> limitée ; la <strong>sécurité</strong> des données (article 32).</li>
  <li><strong>Droits des personnes</strong> : information, accès, rectification, effacement, opposition, portabilité.</li>
  <li><strong>Obligations de l’organisme</strong> : tenir un <strong>registre des traitements</strong> ; désigner un délégué à la protection des données (DPO) dans certains cas ; <strong>notifier à la CNIL toute violation de données</strong> présentant un risque, dans les <strong>72 heures</strong> après en avoir pris connaissance, et informer les personnes concernées si le risque est élevé.</li>
  <li><strong>Sanctions</strong> : jusqu’à 20 millions d’euros ou 4 % du chiffre d’affaires annuel mondial.</li>
</ul>
<p>Les certificats médicaux des licenciés sont des <strong>données de santé</strong>, dites « sensibles » : leur traitement est en principe interdit, sauf exceptions, et exige une protection renforcée.</p>

<h3>Le Code pénal : les atteintes aux systèmes</h3>
<p>Depuis la loi Godfrain de 1988, les articles 323-1 et suivants du Code pénal punissent les atteintes aux « systèmes de traitement automatisé de données » :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Infraction</th><th>Peine maximale</th></tr>
  <tr><td>Accéder ou se maintenir frauduleusement dans tout ou partie d’un système (article 323-1)</td><td>3 ans d’emprisonnement et 100 000 € d’amende</td></tr>
  <tr><td>Même chose avec suppression ou modification de données, ou altération du fonctionnement</td><td>5 ans et 150 000 €</td></tr>
  <tr><td>Entraver ou fausser le fonctionnement d’un système, par exemple par un déni de service (323-2) ; introduire, modifier ou supprimer frauduleusement des données (323-3)</td><td>jusqu’à 5 ans et 150 000 €, davantage pour un système de l’État</td></tr>
  <tr><td>Détenir ou fournir sans motif légitime un outil conçu pour commettre ces infractions (323-3-1)</td><td>les peines de l’infraction elle-même</td></tr>
</table></div>
<p>Un accès est « frauduleux » dès qu’il est fait sans droit, même sans protection à contourner, même sans rien abîmer, même « pour tester ». Le technicien ou l’auditeur qui teste la sécurité d’un système doit avoir une <strong>autorisation écrite</strong> du responsable, qui précise le périmètre et la période. C’est la raison de la règle de ce cours : outils de test uniquement sur la maquette.</p>

<h3>NIS 2 et les obligations des organisations</h3>
<p>La directive européenne <strong>NIS 2</strong> (2022) étend les obligations de cybersécurité à des milliers d’entités « essentielles » et « importantes » (énergie, santé, transports, collectivités, numérique, fabrication…) : gestion des risques, mesures de sécurité, déclaration des incidents. En France, sa transposition passe par un projet de loi relatif à la résilience des infrastructures critiques ; à l’automne 2026, ce texte n’était <strong>pas encore définitivement adopté</strong>. Une association comme la M2L n’est pas directement concernée, mais ses partenaires (collectivités, fédérations) peuvent l’être, et lui imposer des exigences par contrat.</p>

<h3>La charte informatique</h3>
<p>Dans une organisation, la <strong>charte informatique</strong> (ou charte d’utilisation du SI) fixe les règles d’usage pour les utilisateurs (mots de passe personnels, usage d’Internet, matériel personnel) et pour les administrateurs (accès aux données des utilisateurs seulement pour les besoins du service, confidentialité). Elle informe aussi les utilisateurs des contrôles (journaux, filtrage). Annexée au règlement intérieur, elle devient opposable. Un administrateur a de larges droits techniques, mais <strong>pas le droit</strong> de lire les fichiers ou les messages personnels des utilisateurs par curiosité.</p>

<div class="aside pro">
  <p class="aside-title">En entreprise</p>
  <p>En stage et en alternance, vous aurez souvent des droits d’administration étendus. Les règles professionnelles sont simples : ne jamais utiliser ces droits en dehors de la mission ; ne jamais conserver de copie des données ; signaler immédiatement une faille découverte à son tuteur au lieu de « vérifier jusqu’où on peut aller » ; ne jamais tester un outil d’attaque sur le réseau de l’entreprise sans autorisation écrite. Ces règles figurent souvent dans la convention de stage et dans la charte que vous signerez.</p>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p1" data-title="Risques et cadre légal" data-label="Quiz de fin de partie">
  <div class="q" data-ok="3">
    <p class="qt">Que signifie le « C » de DICP ?</p>
    <ul><li>Contrôle</li><li>Chiffrement</li><li>Confidentialité</li><li>Continuité</li></ul>
    <div class="expl">Disponibilité, Intégrité, Confidentialité, Preuve. Le chiffrement est un moyen d’assurer la confidentialité, pas un critère.</div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Un serveur non mis à jour depuis deux ans est…</p>
    <ul><li>une menace</li><li>une vulnérabilité</li><li>un impact</li><li>un risque accepté</li></ul>
    <div class="expl">C’est une faiblesse qu’une menace (un attaquant, un robot) peut exploiter. Le risque n’est « accepté » que si la direction l’a décidé en connaissance de cause.</div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">La M2L souscrit une assurance qui couvre les frais de reconstruction après une cyberattaque. Quelle option de traitement du risque est-ce ?</p>
    <ul><li>Réduire</li><li>Éviter</li><li>Accepter</li><li>Transférer</li></ul>
    <div class="expl">Les conséquences financières sont transférées à l’assureur. L’assurance ne réduit pas la vraisemblance de l’attaque : elle doit compléter les mesures techniques, pas les remplacer.</div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Dans quel délai une violation de données personnelles doit-elle être notifiée à la CNIL ?</p>
    <ul><li>72 heures après en avoir pris connaissance</li><li>1 mois</li><li>24 heures après l’attaque</li><li>Aucune obligation pour une association</li></ul>
    <div class="expl">Le RGPD s’applique aussi aux associations. La notification se fait sur le site de la CNIL, même incomplète, puis on la complète.</div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Un étudiant lance un scanner de ports sur le serveur de la mairie « juste pour voir », sans rien modifier. Que risque-t-il ?</p>
    <ul><li>Rien, puisqu’il n’a rien modifié</li><li>Des poursuites pénales : tenter d’accéder sans droit à un système est un délit</li><li>Seulement une amende de la CNIL</li><li>Rien, si le serveur n’avait pas de mot de passe</li></ul>
    <div class="expl">La tentative est punie comme l’infraction (article 323-7). Un test de sécurité exige toujours une autorisation écrite du responsable du système.</div>
  </div>
</div>

<h1>Attaques courantes et protection des identités</h1>

<div class="aside caution">

  <p>Prérequis : partie 1, comptes et stratégies de mots de passe du chapitre 5. Travail <strong>sans IA</strong>. Les techniques d’attaque sont présentées pour savoir s’en protéger ; les tester hors de la maquette est un délit.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Attaques et identités</div><ul>
  <li><span><b>Ingénierie sociale</b> : hameçonnage, fraudes</span></li>

<p class="lead">La plupart des attaques contre les petites organisations ne commencent pas par une prouesse technique, mais par un courriel, un appel téléphonique ou un mot de passe réutilisé. L’utilisateur et son compte sont la porte d’entrée : c’est donc là que la protection commence.</p>

<h2>L’ingénierie sociale</h2>
<p>L’<strong>ingénierie sociale</strong> consiste à manipuler une personne pour qu’elle donne une information ou fasse une action : cliquer, ouvrir une pièce jointe, donner un mot de passe, faire un virement. Elle joue sur l’urgence, l’autorité, la peur, la curiosité ou l’envie d’aider.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Attaque</th><th>Principe</th><th>Exemple</th></tr>
  <tr><td><strong>Hameçonnage</strong> (<em>phishing</em>)</td><td>Message qui imite un expéditeur de confiance pour faire saisir des identifiants ou ouvrir un fichier piégé. Par SMS : <em>smishing</em> ; par téléphone : <em>vishing</em>.</td><td>« Votre boîte aux lettres est pleine, reconnectez-vous ici. »</td></tr>
  <tr><td><strong>Hameçonnage ciblé</strong> (<em>spear phishing</em>)</td><td>Message préparé pour une personne précise, avec des détails réels trouvés sur le site web ou les réseaux sociaux</td><td>Courriel au trésorier de la ligue de volley citant le dernier tournoi</td></tr>
  <tr><td><strong>Fraude au président</strong>, <strong>faux RIB</strong></td><td>L’escroc se fait passer pour un dirigeant ou un fournisseur et demande un virement urgent ou un changement de coordonnées bancaires</td><td>« Le président est en déplacement, il faut payer ce prestataire aujourd’hui, en toute discrétion. »</td></tr>
  <tr><td><strong>Faux support technique</strong></td><td>Un faux technicien appelle ou affiche une fausse alerte pour obtenir une prise de main à distance</td><td>« Bonjour, ici le service informatique, votre poste envoie des virus, installez ce logiciel. »</td></tr>
  <tr><td><strong>Clé USB piégée</strong></td><td>Support abandonné dans un parking ou envoyé par courrier, qui contient un logiciel malveillant</td><td>Clé « Photos AG 2027 » trouvée dans le hall</td></tr>
</table></div>

<div class="pick" data-id="k-phishing" data-ok="1,3,5,6,7" data-label="Repérer les indices d’un hameçonnage">
  <div class="pq"><p>Léa Martin, présidente de la ligue de volley, reçoit ce courriel. Cliquer sur toutes les lignes qui contiennent un <strong>indice d’hameçonnage</strong>. Rappel : le domaine de la M2L est <code>lorraine-sport.net</code>.</p></div>

  </tbody></table></div>

<h2>Les logiciels malveillants</h2>
<dl class="def">
  <dt>Virus, ver</dt><dd>Un virus s’attache à un fichier et se propage quand on l’ouvre ; un ver se propage seul par le réseau en exploitant une faille (WannaCry, en 2017, utilisait une faille de SMB corrigée deux mois plus tôt).</dd>
  <dt>Cheval de Troie</dt><dd>Programme d’apparence utile (logiciel « gratuit », faux lecteur vidéo) qui ouvre un accès à l’attaquant ou vole des données ; un enregistreur de frappe (<em>keylogger</em>) capture ce qui est tapé au clavier.</dd>
  <dt>Rançongiciel</dt><dd>Chiffre les fichiers et réclame une rançon pour la clé. Les groupes actuels volent d’abord les données et menacent de les publier (double extorsion). Ils cherchent aussi à détruire les sauvegardes accessibles par le réseau, d’où la règle 3-2-1-1-0 du chapitre 5. L’ANSSI et la police recommandent de <strong>ne pas payer</strong> : rien ne garantit la restitution, et le paiement finance de nouvelles attaques.</dd>
</dl>
<p>Protections : mises à jour, antivirus et EDR (logiciel qui surveille le comportement des postes), filtrage de la messagerie, utilisateurs sans droits d’administration sur leur poste (un logiciel malveillant hérite des droits de l’utilisateur qui l’a lancé), blocage des macros des documents venus d’Internet, sauvegardes hors ligne.</p>

<h2>Les attaques contre les mots de passe</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Attaque</th><th>Principe</th><th>Parade</th></tr>
  <tr><td>Force brute</td><td>Essayer toutes les combinaisons</td><td>Longueur du mot de passe ; verrouillage après plusieurs échecs (chapitre 5)</td></tr>
  <tr><td>Dictionnaire</td><td>Essayer des mots courants et leurs variantes (<code>Volley2027!</code>, <code>Azerty123</code>)</td><td>Interdire les mots de passe courants ; phrases de passe aléatoires</td></tr>
  <tr><td>Pulvérisation (<em>password spraying</em>)</td><td>Essayer un ou deux mots de passe très courants sur des centaines de comptes, pour éviter les verrouillages</td><td>Détection dans les journaux (événements 4625 sur de nombreux comptes) ; authentification à plusieurs facteurs</td></tr>
  <tr><td>Réutilisation (<em>credential stuffing</em>)</td><td>Essayer sur d’autres sites les identifiants volés lors de la fuite d’un site</td><td>Un mot de passe différent par service (gestionnaire de mots de passe) ; MFA</td></tr>
  <tr><td>Vol</td><td>Hameçonnage, enregistreur de frappe, papier sous le clavier</td><td>Sensibilisation ; MFA</td></tr>
</table></div>

<h3>Mesurer la robustesse : l’entropie</h3>
<p>Le nombre de mots de passe possibles est <strong>N<sup>L</sup></strong>, où <strong>N</strong> est le nombre de caractères possibles (l’alphabet) et <strong>L</strong> la longueur. On l’exprime en <strong>bits d’entropie</strong> : <strong>L × log<sub>2</sub>(N)</strong>. Chaque bit en plus double le nombre d’essais nécessaires. Ce calcul suppose un mot de passe <strong>tiré au hasard</strong> : <code>Volley2027!</code> a 11 caractères, mais il sera trouvé très vite par une attaque par dictionnaire.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Politique</th><th>Alphabet N</th><th>Combinaisons</th><th>Entropie</th><th>Temps maximal à 10 milliards d’essais par seconde</th></tr>
  <tr><td>8 minuscules</td><td>26</td><td>2,1 × 10<sup>11</sup></td><td>37,6 bits</td><td>21 secondes</td></tr>
  <tr><td>8 caractères : majuscules, minuscules, chiffres</td><td>62</td><td>2,2 × 10<sup>14</sup></td><td>47,6 bits</td><td>6 heures</td></tr>
  <tr><td>12 caractères des 4 types (37 caractères spéciaux)</td><td>99</td><td>8,9 × 10<sup>23</sup></td><td>79,6 bits</td><td>2,8 millions d’années</td></tr>
  <tr><td>14 caractères : majuscules, minuscules, chiffres</td><td>62</td><td>1,2 × 10<sup>25</sup></td><td>83,4 bits</td><td>39 millions d’années</td></tr>
</table></div>
<p>La vitesse de 10 milliards d’essais par seconde correspond à une attaque <strong>hors ligne</strong> (sur une base de condensats volée) avec des cartes graphiques et une fonction de hachage rapide. En ligne, sur un formulaire de connexion protégé par un verrouillage, l’attaquant n’a que quelques essais.</p>
<p>La <strong>CNIL</strong> (recommandation de 2022) fixe ses exigences par niveau d’entropie, et non par une règle unique :</p>
<ul>
  <li><strong>mot de passe seul</strong> : 80 bits au moins, par exemple 12 caractères des 4 types, 14 caractères sans caractère spécial obligatoire, ou une phrase de passe de 7 mots ;</li>
  <li><strong>mot de passe avec restriction d’accès</strong> (temporisation ou blocage après plusieurs échecs, comme au chapitre 5) : 50 bits au moins ;</li>
  <li><strong>avec un matériel détenu par la personne</strong> (carte à puce, téléphone) : un code court suffit, avec blocage après 3 échecs.</li>
</ul>
<p>Elle n’impose plus de changer régulièrement les mots de passe des comptes ordinaires (cela pousse à des variantes prévisibles : <code>Volley2027!</code> devient <code>Volley2028!</code>), mais le recommande pour les comptes à privilèges.</p>

<div class="answer" data-id="a-entropie" data-label="Calculer l’entropie de mots de passe" data-min="150" data-rows="7">
  <p>a) Calculer l’entropie d’un code PIN de 4 chiffres, et d’un mot de passe de 10 caractères tirés au hasard parmi les 26 minuscules et les 10 chiffres. b) Une phrase de passe est formée de 6 mots tirés au hasard dans une liste de 7 776 mots (méthode « Diceware ») : quelle est son entropie ? c) Le PIN de 4 chiffres de votre téléphone est-il pour autant une mauvaise protection ? Justifier avec la recommandation de la CNIL.</p>
  <div class="corr">
    <p>a) PIN : 4 × log<sub>2</sub>(10) = 4 × 3,32 ≈ <strong>13,3 bits</strong> (10 000 combinaisons). 10 caractères parmi 36 : 10 × log<sub>2</sub>(36) = 10 × 5,17 ≈ <strong>51,7 bits</strong>.</p>
    <p>b) Chaque mot apporte log<sub>2</sub>(7 776) ≈ 12,9 bits (7 776 = 6<sup>5</sup> : cinq lancers de dé par mot). 6 mots : 6 × 12,9 ≈ <strong>77,5 bits</strong>, avec une phrase bien plus facile à retenir qu’une suite de caractères aléatoires.</p>
    <p>c) Non : le PIN protège un <strong>matériel que la personne détient</strong> (le téléphone, sa puce sécurisée) et le nombre d’essais est limité, avec effacement ou blocage. Un voleur ne peut pas faire 10 000 essais. C’est le cas « 13 bits avec matériel détenu et blocage après 3 échecs » de la CNIL. La robustesse dépend toujours du nombre d’essais que l’attaquant peut faire.</p>
  </div>
</div>

<h2>Stocker les mots de passe : le hachage</h2>
<p>Un site ou un serveur ne doit <strong>jamais</strong> stocker un mot de passe en clair, ni chiffré (qui a la clé peut le déchiffrer). Il stocke un <strong>condensat</strong> (<em>hash</em>) : le résultat d’une fonction de hachage, à sens unique. À la connexion, il hache le mot de passe saisi et compare les deux condensats.</p>
<pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> echo -n 'Volley2027!' | sha256sum
ceebc57dc8065417ab13564a8238f3debee928af13960fc9cb3c2c5f1933f7f5  -
<span class="pr">etudiant@srv-deb:~$</span> echo -n 'volley2027!' | sha256sum
5fe4274f542f2d10a5c7810cefc17077ebfa85fb0181d660cdd86684c099da96  -</pre>
<p>Une fonction de hachage donne toujours un résultat de même taille (256 bits pour SHA-256) ; changer un seul caractère change tout le condensat ; on ne peut pas remonter du condensat au mot de passe, sauf en essayant des mots de passe un par un. D’où deux précautions supplémentaires :</p>
<ul>
  <li><strong>le sel</strong> : une valeur aléatoire, différente pour chaque compte, ajoutée au mot de passe avant le hachage. Deux utilisateurs qui ont le même mot de passe ont alors des condensats différents, et les tables de condensats précalculées (<em>rainbow tables</em>) deviennent inutiles ;</li>
  <li><strong>une fonction lente</strong>, conçue pour les mots de passe : <strong>Argon2</strong>, <strong>bcrypt</strong>, <strong>scrypt</strong>. Elles sont volontairement coûteuses en calcul et en mémoire, pour qu’une attaque hors ligne ne fasse que quelques milliers d’essais par seconde au lieu de milliards. SHA-256 seul est trop rapide pour cet usage.</li>
</ul>
<p>Sous Debian, le fichier <code>/etc/shadow</code> (lisible seulement par root) contient pour chaque compte une ligne comme <code>lea.martin:$y$j9T$…sel…$…condensat…:20590:0:99999:7:::</code> : <code>$y$</code> désigne l’algorithme <strong>yescrypt</strong>, une fonction lente, suivi du sel et du condensat.</p>

<div class="aside pro">
  <p class="aside-title">En entreprise (et pour les développeurs SLAM)</p>
  <p>En PHP, on n’écrit jamais sa propre fonction : <code>password_hash($mdp, PASSWORD_DEFAULT)</code> produit un condensat bcrypt salé, et <code>password_verify()</code> le vérifie ; en C#, on utilise une bibliothèque reconnue (par exemple <code>Rfc2898DeriveBytes</code> avec de nombreuses itérations, ou une implémentation d’Argon2). Les sites dont les bases de données sont volées sont nombreux : le site <em>Have I Been Pwned</em> recense des milliards de comptes issus de fuites. Quand les mots de passe étaient stockés en clair ou avec une fonction rapide, ils ont été retrouvés et réutilisés sur d’autres sites.</p>
</div>

<h2>L’authentification à plusieurs facteurs</h2>
<p>Un <strong>facteur d’authentification</strong> est une preuve d’identité d’une des trois catégories suivantes :</p>
<ul>
  <li>ce que l’on <strong>sait</strong> : mot de passe, code PIN ;</li>
  <li>ce que l’on <strong>possède</strong> : téléphone avec une application qui génère des codes temporaires (TOTP), clé de sécurité physique (FIDO2), carte à puce ;</li>
  <li>ce que l’on <strong>est</strong> : empreinte digitale, visage.</li>
</ul>
<p>L’<strong>authentification multifacteur</strong> (MFA) combine au moins deux facteurs de catégories <strong>différentes</strong> : un mot de passe et un code reçu par SMS, oui ; deux mots de passe, non. Un mot de passe volé par hameçonnage ne suffit alors plus. Toutes les méthodes ne se valent pas : le SMS peut être détourné (échange frauduleux de carte SIM) ; les notifications « Approuver ? » peuvent être acceptées par lassitude si l’attaquant en envoie des dizaines ; les <strong>clés de sécurité FIDO2</strong> et les <strong>clés d’accès</strong> (<em>passkeys</em>) résistent à l’hameçonnage, car elles vérifient elles-mêmes le nom du site.</p>
<p>Priorité de déploiement à la M2L : la messagerie, l’accès à distance (VPN), les comptes d’administration et tout service accessible depuis Internet.</p>

<h2>Le moindre privilège</h2>
<ul>
  <li>Chaque compte n’a que les droits nécessaires à sa mission (méthode AGDLP, chapitre 5).</li>
  <li>Les administrateurs utilisent un compte ordinaire pour la messagerie et la navigation, et un compte d’administration séparé (<code>adm.paul.garnier</code>) seulement pour administrer.</li>
  <li>Les utilisateurs ne sont pas administrateurs de leur poste.</li>
  <li>Pas de compte partagé (« accueil », « stagiaire ») : sans compte nominatif, pas de traçabilité.</li>
  <li>Les comptes des personnes parties sont désactivés immédiatement (défi du TP 14) ; les comptes par défaut (<code>admin</code>, <code>glpi</code>…) sont désactivés ou leur mot de passe est changé.</li>
</ul>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p2" data-title="Attaques et identités" data-label="Quiz de fin de partie">
  <div class="q" data-ok="3">
    <p class="qt">Quel est le vrai domaine du lien <code>https://lorraine-sport.net.verif-compte.xyz/login</code> ?</p>
    <ul><li>lorraine-sport.net</li><li>login</li><li>verif-compte.xyz</li><li>net.verif-compte</li></ul>
    <div class="expl">Le nom du serveur est ce qui se trouve entre <code>https://</code> et le premier <code>/</code> ; il se lit de droite à gauche : extension <code>.xyz</code>, domaine <code>verif-compte.xyz</code>. Tout ce qui est à gauche n’est qu’un sous-domaine librement choisi par le propriétaire de <code>verif-compte.xyz</code>.</div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Pourquoi ajoute-t-on un sel avant de hacher un mot de passe ?</p>
    <ul><li>Pour que deux mots de passe identiques donnent des condensats différents et rendre inutiles les tables précalculées</li><li>Pour pouvoir déchiffrer le mot de passe plus tard</li><li>Pour raccourcir le condensat</li><li>Pour accélérer la vérification</li></ul>
    <div class="expl">Le sel, aléatoire et propre à chaque compte, oblige l’attaquant à attaquer chaque compte séparément. Un condensat ne se déchiffre jamais.</div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Lequel de ces couples constitue une authentification à deux facteurs ?</p>
    <ul><li>Un mot de passe et une question secrète</li><li>Deux mots de passe différents</li><li>Un identifiant et un mot de passe</li><li>Un mot de passe et un code généré par une application sur le téléphone</li></ul>
    <div class="expl">Il faut deux catégories différentes : ce que l’on sait (mot de passe) et ce que l’on possède (le téléphone). Une question secrète est un second élément « que l’on sait ».</div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Quel est le premier geste face à un rançongiciel qui chiffre les fichiers d’un poste ?</p>
    <ul><li>Payer la rançon rapidement</li><li>Isoler le poste du réseau (débrancher le câble, couper le Wi-Fi) et prévenir le service informatique</li><li>Supprimer les fichiers chiffrés</li><li>Lancer une restauration immédiatement</li></ul>
    <div class="expl">On limite d’abord la propagation, sans éteindre brutalement (des traces utiles à l’enquête sont en mémoire). La restauration vient après avoir compris et supprimé la cause (partie 5).</div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Pourquoi un utilisateur ne doit-il pas être administrateur de son poste ?</p>
    <ul><li>Pour économiser des licences</li><li>Parce qu’il ne saurait pas s’en servir</li><li>Parce qu’un logiciel malveillant lancé par l’utilisateur hérite de ses droits</li><li>Parce que Windows l’interdit</li></ul>
    <div class="expl">Avec des droits limités, un programme malveillant ne peut ni désactiver l’antivirus, ni s’installer dans le système, ni facilement se propager.</div>
  </div>
</div>

<div class="aside next">
  <p class="aside-title">La suite</p>
  <p>Un attaquant qui branche un ordinateur sur une prise réseau de la M2L, ou qui se connecte au Wi-Fi, ne doit pas pouvoir aller plus loin. La <a href="#p3">partie 3</a> présente la sécurité du réseau d’accès.</p>
</div>
