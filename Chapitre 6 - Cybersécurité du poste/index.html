<template data-page="p5">
<h1>Vulnérabilités et réponse à incident</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : parties 1 à 4, journaux, sauvegardes et gestion des incidents du chapitre 5. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Vulnérabilités et incidents</div><ul>
  <li><span><b>Vulnérabilité</b> : CVE, score CVSS, exploitation</span></li>
  <li><span><b>Veille</b> : CERT-FR, éditeurs, priorisation des correctifs</span></li>
  <li><span><b>Incident</b> : détecter, contenir, éradiquer, rétablir</span></li>
  <li><span><b>Obligations</b> : preuves, CNIL, plainte, communication</span></li>
</ul></div></figure>

<p class="lead">Aucun système n’est invulnérable : des failles sont découvertes chaque jour dans les logiciels les plus utilisés. L’enjeu est de les corriger <strong>avant</strong> qu’elles soient exploitées contre soi, et de savoir réagir le jour où une attaque réussit malgré tout. Une organisation préparée perd des heures ; une organisation surprise perd des semaines.</p>

<h2>Le cycle de vie d’une vulnérabilité</h2>
<ol class="steps">
  <li><strong>Découverte</strong> par un chercheur, l’éditeur, ou un attaquant. Si un attaquant l’exploite avant que l’éditeur la connaisse, on parle de faille <strong>« zero-day »</strong> (zéro jour pour se protéger).</li>
  <li><strong>Divulgation coordonnée</strong> : le chercheur prévient l’éditeur, qui prépare un correctif avant la publication.</li>
  <li><strong>Publication</strong> d’un avis et d’un <strong>correctif</strong> (mise à jour), avec un identifiant <strong>CVE</strong>.</li>
  <li><strong>Exploitation</strong> : dès la publication, des attaquants analysent le correctif pour fabriquer un programme d’exploitation et cherchent sur Internet les systèmes non mis à jour, parfois en quelques heures.</li>
</ol>
<dl class="def">
  <dt>CVE</dt><dd><em>Common Vulnerabilities and Exposures</em> : un identifiant unique et public par vulnérabilité, de la forme <code>CVE-année-numéro</code>. Exemple : <code>CVE-2021-44228</code>, la faille « Log4Shell » de la bibliothèque Java Log4j (décembre 2021), qui permettait de prendre le contrôle d’un serveur par une simple chaîne de caractères envoyée dans une requête, et touchait des milliers de logiciels.</dd>
  <dt>CVSS</dt><dd><em>Common Vulnerability Scoring System</em> : un score de gravité de 0 à 10, calculé à partir de critères publics (exploitable à distance ou non, complexité, privilèges nécessaires, interaction de l’utilisateur, impact sur la confidentialité, l’intégrité, la disponibilité). Niveaux : faible (0,1 à 3,9), moyen (4,0 à 6,9), élevé (7,0 à 8,9), critique (9,0 à 10). Log4Shell avait le score maximal de 10.</dd>
  <dt>Avis et alertes du CERT-FR</dt><dd>Le CERT-FR publie en français des <strong>avis</strong> (vulnérabilités et correctifs des logiciels courants) et des <strong>alertes</strong> (vulnérabilités activement exploitées, à traiter en urgence), avec les références CVE et les liens vers les correctifs.</dd>
</dl>

<div class="aside deep">
  <p class="aside-title">En profondeur : WannaCry, la leçon des correctifs</p>
  <p>En mai 2017, le rançongiciel WannaCry a touché des centaines de milliers d’ordinateurs dans plus de 150 pays, dont des hôpitaux britanniques et des usines françaises. Il se propageait seul, comme un ver, par une faille du protocole SMB de Windows (bulletin Microsoft MS17-010, <code>CVE-2017-0144</code>). Le correctif était disponible depuis <strong>deux mois</strong>. Les machines à jour, et celles dont le port 445 n’était pas exposé, n’ont pas été touchées. La plupart des attaques réussies exploitent des failles connues et corrigées, pas des failles inconnues.</p>
</div>

<h2>La veille et la gestion des correctifs</h2>
<p>La <strong>veille</strong> consiste à suivre les vulnérabilités qui concernent son parc. Elle suppose de <strong>connaître son parc</strong> : quels logiciels, quelles versions, sur quelles machines (l’inventaire GLPI du chapitre 5). Sources : avis du CERT-FR (flux RSS, liste de diffusion), bulletins des éditeurs (Microsoft publie ses correctifs le deuxième mardi de chaque mois), avis de sécurité de Debian (DSA), catalogue des vulnérabilités activement exploitées tenu par l’agence américaine CISA (KEV).</p>
<p>On ne peut pas tout corriger immédiatement : on <strong>priorise</strong> selon trois questions.</p>
<ul>
  <li>La faille est-elle <strong>exploitée activement</strong> (alerte du CERT-FR, catalogue KEV) ?</li>
  <li>Le système est-il <strong>exposé</strong> (accessible depuis Internet, ou par de nombreux utilisateurs) ?</li>
  <li>Quelle est sa <strong>gravité</strong> (score CVSS) et quelle est l’importance du système touché ?</li>
</ul>
<p>Quand le correctif ne peut pas être appliqué tout de suite, on met en place une <strong>mesure de contournement</strong> recommandée par l’éditeur : désactiver la fonction vulnérable, filtrer le port, couper l’accès depuis Internet. Toute application de correctif sur un serveur suit la gestion des changements (chapitre 5) : planification, sauvegarde, test, retour arrière possible.</p>

<div class="ctab" data-id="c-correctifs" data-head="Vulnérabilité publiée" data-cols="Délai de correction" data-choices="IMMÉDIAT|SOUS 1 SEMAINE|CYCLE NORMAL" data-label="Prioriser les correctifs de la M2L">
  <div class="r" data-ok="IMMÉDIAT" data-expl="Critique, exploitée activement, sur un serveur exposé à Internet : correctif ou contournement le jour même.">Faille d’Apache, score 9,8, exploitée activement selon une alerte du CERT-FR ; le serveur web de la DMZ est concerné.</div>
  <div class="r" data-ok="CYCLE NORMAL" data-expl="Gravité moyenne, système interne peu exposé, pas d’exploitation connue : à intégrer au cycle de mises à jour habituel.">Faille du micrologiciel des imprimantes, score 5,3, exploitable seulement depuis le réseau interne ; aucune exploitation connue.</div>
  <div class="r" data-ok="IMMÉDIAT" data-expl="Les navigateurs sont exposés à tous les sites visités : une faille exploitée activement se corrige sans attendre (mise à jour automatique, vérifiée).">Faille de Firefox, score 8,8, exploitée activement par des pages web piégées ; le navigateur est installé sur tous les postes.</div>
  <div class="r" data-ok="SOUS 1 SEMAINE" data-expl="Grave, avec un programme d’exploitation public, mais il faut déjà un accès au serveur : prioritaire sans être une urgence absolue.">Faille du noyau Linux, score 7,8, qui permet à un utilisateur local de devenir root ; un programme d’exploitation est publié. Les serveurs Debian sont concernés.</div>
  <div class="r" data-ok="SOUS 1 SEMAINE" data-expl="Score critique, mais le poste n’est pas exposé et aucune exploitation n’est connue ; il reste prioritaire, car l’isolement d’un poste n’est jamais parfait.">Faille d’un logiciel de montage vidéo, score 9,1, présent sur un seul poste de la salle multimédia, sans accès au réseau ; aucune exploitation connue.</div>
</div>

<h2>Réagir à un incident de sécurité</h2>
<p>Un <strong>incident de sécurité</strong> est un événement qui porte atteinte (ou risque de porter atteinte) à la disponibilité, l’intégrité, la confidentialité ou la traçabilité du système d’information : compte piraté, rançongiciel, fuite de données, défiguration du site. Sa gestion suit des étapes reconnues :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Étape</th><th>Objectif</th><th>Exemples d’actions</th></tr>
  <tr><td><strong>Préparation</strong></td><td>Être prêt avant l’incident</td><td>Sauvegardes hors ligne testées, journaux centralisés, liste des contacts d’urgence (direction, prestataire, assureur), fiches réflexes imprimées, inventaire à jour</td></tr>
  <tr><td><strong>Détection et analyse</strong></td><td>Confirmer l’incident et en mesurer l’étendue</td><td>Alerte d’un utilisateur ou de la supervision, lecture des journaux, identification des machines et des comptes touchés</td></tr>
  <tr><td><strong>Confinement</strong></td><td>Empêcher la propagation</td><td>Isoler du réseau les machines touchées (câble débranché, port désactivé, Wi-Fi coupé) <strong>sans les éteindre</strong> ; désactiver les comptes compromis ; couper l’accès à distance</td></tr>
  <tr><td><strong>Éradication</strong></td><td>Supprimer la cause</td><td>Trouver le point d’entrée, corriger la faille, réinstaller les machines compromises, changer les mots de passe depuis un poste sain</td></tr>
  <tr><td><strong>Rétablissement</strong></td><td>Reprendre l’activité</td><td>Restaurer depuis des sauvegardes saines, remettre les services en route par ordre de priorité, surveiller de près</td></tr>
  <tr><td><strong>Retour d’expérience</strong></td><td>Ne pas revivre le même incident</td><td>Chronologie, causes, ce qui a bien ou mal fonctionné, plan d’action (base de connaissances, chapitre 5)</td></tr>
</table></div>

<h3>Les réflexes et les obligations</h3>
<ul>
  <li><strong>Ne pas éteindre</strong> les machines touchées : la mémoire contient des traces utiles à l’enquête (processus, connexions). On les <strong>isole</strong> du réseau.</li>
  <li><strong>Tenir une main courante</strong> : un journal horodaté de tout ce qui est constaté et fait, par qui. Il sert à l’enquête, à l’assurance, au retour d’expérience.</li>
  <li><strong>Conserver les preuves</strong> : journaux, copies des disques, messages reçus. Ne pas « nettoyer » avant d’avoir sauvegardé les traces.</li>
  <li><strong>Prévenir</strong> immédiatement la hiérarchie et le responsable de la sécurité ; ne pas communiquer à l’extérieur sans accord de la direction.</li>
  <li><strong>Ne pas payer de rançon.</strong></li>
  <li><strong>Notifier la CNIL</strong> dans les 72 heures si des données personnelles sont concernées (partie 1), et informer les personnes si le risque pour elles est élevé.</li>
  <li><strong>Porter plainte</strong> auprès de la police ou de la gendarmerie, et prévenir l’assureur.</li>
  <li><strong>Se faire aider</strong> : Cybermalveillance.gouv.fr et sa plateforme 17Cyber orientent les victimes vers des prestataires ; les prestataires qualifiés par l’ANSSI (label PRIS) interviennent sur les incidents graves.</li>
</ul>

<div class="aside pro">
  <p class="aside-title">En entreprise</p>
  <p>Les grandes organisations ont un <strong>CSIRT</strong> ou un <strong>SOC</strong> (centre opérationnel de sécurité) qui surveille les alertes jour et nuit. Dans une association comme la M2L, c’est le technicien qui recevra le premier appel. Son rôle n’est pas de tout résoudre seul, mais d’appliquer les premiers réflexes (isoler, noter, prévenir) et de ne rien aggraver. Un exercice de crise annuel, même sur table, fait gagner un temps précieux le jour venu.</p>
</div>

<div class="answer" data-id="a-incident" data-label="Gérer une attaque par rançongiciel à la M2L" data-min="300" data-rows="12">
  <p>Lundi, 8 h 15. La secrétaire de la ligue de tennis appelle : ses fichiers ont tous l’extension <code>.lock</code>, et un fichier <code>LISEZ-MOI.txt</code> réclame une rançon. À 8 h 30, deux autres ligues signalent la même chose sur le partage du serveur de fichiers. Décrire, dans l’ordre et en les justifiant, les actions à mener pendant la première heure, puis celles des jours suivants. Préciser ce qu’il ne faut surtout pas faire.</p>
  <div class="corr">
    <p><strong>Première heure</strong> : 1) ouvrir une main courante horodatée (heure des appels, constats) ; 2) <strong>confiner</strong> : débrancher du réseau le poste de la secrétaire sans l’éteindre, puis, puisque le partage est touché, isoler le serveur de fichiers (ou désactiver le partage) et, si nécessaire, couper les liaisons entre zones sur le pare-feu ; 3) prévenir la direction et le responsable informatique ; 4) identifier l’étendue : quels postes, quels comptes accèdent aux fichiers chiffrés (ouvertures de session, événements 4624, et accès aux fichiers si l’audit est activé, événement 5145 ; chapitre 5) ; désactiver le compte utilisé pour chiffrer ; 5) vérifier que les <strong>sauvegardes hors ligne</strong> sont intactes et les déconnecter du réseau si ce n’est pas le cas ; 6) relever les preuves (message de rançon, extension, journaux).</p>
    <p><strong>Jours suivants</strong> : porter plainte ; notifier la CNIL dans les 72 heures (les fichiers des ligues contiennent des données personnelles, peut-être volées avant le chiffrement) ; prévenir l’assureur ; contacter Cybermalveillance.gouv.fr ou un prestataire ; trouver le point d’entrée (hameçonnage, mot de passe réutilisé, faille non corrigée) ; réinstaller les machines compromises ; changer les mots de passe depuis un poste sain ; restaurer depuis des sauvegardes antérieures à l’infection ; reprendre par ordre de priorité ; informer les ligues ; faire le retour d’expérience et le plan d’action.</p>
    <p><strong>À ne pas faire</strong> : éteindre ou réinstaller immédiatement (perte des preuves) ; payer la rançon ; restaurer avant d’avoir supprimé la cause (réinfection) ; brancher les sauvegardes sur le réseau infecté ; communiquer à l’extérieur sans validation.</p>
  </div>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p5" data-title="Vulnérabilités et incidents" data-label="Quiz de fin de partie">
  <div class="q" data-ok="3">
    <p class="qt">Que désigne <code>CVE-2021-44228</code> ?</p>
    <ul><li>Un logiciel antivirus</li><li>Une norme de chiffrement</li><li>Une vulnérabilité précise, identifiée de façon unique</li><li>Un groupe d’attaquants</li></ul>
    <div class="expl">Chaque vulnérabilité publiée reçoit un identifiant CVE. Celui-ci correspond à Log4Shell, dans la bibliothèque Java Log4j.</div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Un score CVSS de 9,3 correspond à une gravité…</p>
    <ul><li>moyenne</li><li>critique</li><li>faible</li><li>élevée</li></ul>
    <div class="expl">Critique : de 9,0 à 10. Élevée : de 7,0 à 8,9.</div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Un poste est infecté par un rançongiciel. Quelle est la bonne première action ?</p>
    <ul><li>L’éteindre immédiatement</li><li>Lancer une restauration</li><li>Payer pour récupérer les fichiers au plus vite</li><li>L’isoler du réseau sans l’éteindre, et prévenir</li></ul>
    <div class="expl">Isoler empêche la propagation ; garder la machine allumée conserve les traces en mémoire. La restauration vient après l’éradication.</div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Pourquoi une faille corrigée par l’éditeur reste-t-elle dangereuse ?</p>
    <ul><li>Parce que de nombreux systèmes ne sont pas mis à jour, et que les attaquants analysent les correctifs pour fabriquer leurs attaques</li><li>Parce que les correctifs ne fonctionnent jamais</li><li>Parce que le CVE reste secret</li><li>Elle n’est plus dangereuse</li></ul>
    <div class="expl">WannaCry a exploité une faille corrigée deux mois plus tôt. Le délai entre la publication d’un correctif et son application est la période la plus dangereuse.</div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">À quoi sert la « main courante » pendant un incident ?</p>
    <ul><li>À remplacer les sauvegardes</li><li>À garder une trace horodatée des constats et des actions, pour l’enquête, l’assurance et le retour d’expérience</li><li>À prévenir la presse</li><li>À bloquer l’attaquant</li></ul>
    <div class="expl">Dans le stress d’un incident, la mémoire est peu fiable. La main courante permet de reconstituer la chronologie et de justifier les décisions.</div>
  </div>
</div>

  <p class="aside-title">La suite</p>

</div>

<h2>Mission 3 : évaluer les risques</h2>
<details class="task lvl2" open>

    <p>Pour chaque non-conformité, on estime la <strong>vraisemblance</strong> (1 : peu probable ; 2 : possible ; 3 : probable ; 4 : quasi certaine) et la <strong>gravité</strong> (1 : faible ; 2 : significative ; 3 : grave ; 4 : critique). Le niveau de risque est leur produit, de 1 à 16 : de 1 à 4, faible ; de 5 à 8, moyen ; de 9 à 16, élevé.</p>

      <p>Coter les huit non-conformités de la mission 2 (vraisemblance, gravité, niveau), en justifiant chaque note en une phrase, puis classer les risques du plus élevé au plus faible.</p>
      <div class="corr">
        <p>Les notes se discutent ; c’est la <strong>justification</strong> qui est évaluée. Exemple de cotation :</p>
        <ul>
          <li>Bureau à distance exposé : V 4 (port scanné en permanence) × G 4 (contrôleur de domaine, donc tout le SI) = <strong>16</strong>.</li>
          <li>Sauvegardes non protégées et non testées : V 3 × G 4 (perte de toutes les données en cas de rançongiciel) = <strong>12</strong>.</li>
          <li>Fichier des licenciés accessible à toutes les ligues : V 3 (24 ligues, des centaines de comptes) × G 4 (données de santé, sanction possible, atteinte aux personnes) = <strong>12</strong>.</li>
          <li>Secrétaires administratrices de leur poste : V 3 × G 3 = <strong>9</strong>.</li>
          <li>Serveur de la DMZ dans le domaine : V 2 (il faut d’abord compromettre le serveur web) × G 4 (rebond direct vers le contrôleur de domaine) = <strong>8</strong>.</li>
          <li>Mot de passe par défaut de GLPI : V 2 (accessible depuis le réseau interne seulement) × G 3 (inventaire complet du parc, tickets) = <strong>6</strong>.</li>
          <li>Compte partagé « accueil » : V 3 × G 2 = <strong>6</strong>.</li>
          <li>Journaux pfSense trop courts et locaux : V 2 × G 2 (ils ne causent pas d’incident, mais empêchent l’enquête) = <strong>4</strong>.</li>
        </ul>
      </div>
    </div>
  </div>
</details>

<h2>Mission 4 : vérifier la maquette</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Prouver par des tests, pas par des affirmations</summary>
  <div class="task-body">
    <p>Un audit ne se contente pas d’entretiens : il vérifie. Sur votre maquette, réaliser chacun des contrôles suivants, et noter la commande, le résultat obtenu et la conclusion (conforme ou non).</p>
    <div class="tbl-wrap"><table class="data wide">
      <tr><th class="num">N°</th><th>Contrôle</th><th>Chapitre</th></tr>
      <tr><td class="num">1</td><td>Le poste client obtient sa configuration IP du bon serveur DHCP, et résout <code>intranet.m2l.lan</code></td><td>2, 3</td></tr>
      <tr><td class="num">2</td><td>Le poste client trouve le contrôleur de domaine (enregistrement SRV) et la session est ouverte avec un compte du domaine</td><td>5</td></tr>
      <tr><td class="num">3</td><td>Un compte d’une ligue n’a pas accès au partage d’une autre ligue</td><td>3, 5</td></tr>
      <tr><td class="num">4</td><td>La politique de mots de passe et le verrouillage du domaine correspondent à la recommandation de la CNIL</td><td>5, 6</td></tr>
      <tr><td class="num">5</td><td>Le serveur web n’accepte SSH que par clé, et le site est servi en HTTPS avec TLS 1.2 ou 1.3</td><td>6</td></tr>
      <tr><td class="num">6</td><td>Depuis le réseau interne, seuls les ports prévus du serveur web sont joignables</td><td>4, 6</td></tr>
      <tr><td class="num">7</td><td>Un faux serveur DHCP est sans effet dans la maquette Packet Tracer</td><td>6</td></tr>
      <tr><td class="num">8</td><td>Un fichier supprimé du site web peut être restauré depuis la sauvegarde</td><td>5</td></tr>
    </table></div>
    <div class="answer" data-id="tb-controles" data-label="Mission 4 : résultats des contrôles" data-min="400" data-rows="14">
      <p>Pour chacun des 8 contrôles : commande(s), résultat, conclusion.</p>
      <div class="corr">
        <p>Commandes attendues (résultats propres à chaque maquette) :</p>
        <ol>
          <li><code>ipconfig /all</code> (serveur DHCP <code>192.168.50.20</code>, bail dans la plage .30 à .59), <code>nslookup intranet.m2l.lan</code> (alias vers <code>srv-deb.m2l.lan</code>).</li>
          <li><code>nslookup -type=SRV _ldap._tcp.dc._msdcs.m2l.lan</code>, <code>whoami</code> (<code>m2l\…</code>), <code>echo %LOGONSERVER%</code>.</li>
          <li>Session <code>thomas.legall</code> : <code>\\srv-win\Volley</code> refusé ; <code>Get-SmbShareAccess Volley</code> et <code>icacls</code> (méthode AGDLP).</li>
          <li><code>Get-ADDefaultDomainPasswordPolicy</code> : 12 caractères au moins et verrouillage après 5 échecs. Avec la complexité exigée par défaut, cela dépasse les 50 bits de la CNIL pour un mot de passe avec restriction d’accès : conforme.</li>
          <li><code>ssh</code> depuis une machine sans clé : <code>Permission denied (publickey)</code> ; <code>sudo sshd -T | grep -i passwordauthentication</code> : <code>no</code> ; <code>curl -I http://intranet.m2l.lan</code> : 301 vers HTTPS ; <code>openssl s_client</code> : TLSv1.3.</li>
          <li><code>Test-NetConnection -Port</code> sur 22, 80, 443 (ouverts) et 3306, 3389, 445 (fermés) ; <code>sudo ufw status</code>.</li>
          <li>Dans Packet Tracer : renouvellement DHCP des PC avec PIRATE allumé, adresses toujours en <code>172.16.8.16x</code> ; <code>show ip dhcp snooping</code>.</li>
          <li><code>tar -xzf … -C / var/www/html/index.html</code> à partir de l’archive datée, puis <code>curl -I</code> : 200.</li>
        </ol>
        <p>Un contrôle non réalisable (maquette incomplète) est noté comme tel : « non vérifié », avec la raison. Un auditeur n’affirme jamais ce qu’il n’a pas vérifié.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 5 : le plan d’action et la restitution</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Convaincre la direction</summary>
  <div class="task-body">
    <div class="answer" data-id="tb-plan" data-label="Mission 5 : plan d’action priorisé" data-min="300" data-rows="12">
      <p>Rédiger le plan d’action : pour chaque risque, la mesure proposée, sa priorité (immédiate, sous 3 mois, sous 1 an), son coût approximatif (faible, moyen, élevé), la personne responsable, et l’indicateur qui permettra de vérifier qu’elle a été appliquée. Distinguer les mesures rapides et peu coûteuses des projets plus lourds.</p>
      <div class="corr">
        <p>Exemple de plan :</p>
        <ul>
          <li><strong>Immédiat, coût faible</strong> : supprimer la redirection du port 3389 (indicateur : port fermé vu d’Internet) ; changer le mot de passe du compte <code>glpi</code> et désactiver les comptes par défaut ; retirer les droits d’administration locaux des secrétaires (par GPO) ; restreindre les droits sur le fichier des licenciés à chaque ligue, et supprimer les copies de certificats médicaux inutiles.</li>
          <li><strong>Sous 3 mois</strong> : une copie des sauvegardes hors ligne ou hors site, et un test de restauration trimestriel (indicateur : procès-verbal de test) ; comptes nominatifs pour l’accueil ; sortir le serveur web du domaine ; VPN avec authentification à deux facteurs pour l’administration à distance.</li>
          <li><strong>Sous 1 an, coût moyen</strong> : serveur central de journaux avec conservation de 6 mois à 1 an ; supervision ; Wi-Fi WPA2 ou WPA3 Entreprise avec NPS pour le personnel ; sensibilisation annuelle des utilisateurs (indicateur : taux de participation, résultat d’un exercice d’hameçonnage).</li>
        </ul>
        <p>Chaque mesure est reliée à un risque coté à la mission 3 : la direction doit comprendre pourquoi elle paie, et quel risque elle accepte si elle refuse une mesure.</p>
      </div>
    </div>
    <div class="answer" data-id="tb-sensibilisation" data-label="Mission 5 : page de sensibilisation des utilisateurs" data-min="250" data-rows="10">
      <p>Rédiger une page destinée aux bénévoles et salariés des ligues (pas de vocabulaire technique) : les 6 à 8 règles les plus importantes pour eux, et qui contacter en cas de doute.</p>
      <div class="corr">
        <p>Exemple : 1) Votre mot de passe est personnel : ne le donnez à personne, même au service informatique, qui ne vous le demandera jamais. 2) Un mot de passe différent pour chaque service ; utilisez une phrase de passe ou le gestionnaire fourni. 3) Méfiez-vous des messages urgents qui demandent de cliquer, de se reconnecter ou de payer : vérifiez l’expéditeur et le lien, et en cas de doute, appelez. 4) Ne branchez pas de clé USB inconnue, ne branchez aucun appareil personnel sur les prises réseau. 5) Verrouillez votre poste quand vous le quittez (touches Windows + L). 6) Rangez les documents des licenciés dans le dossier de votre ligue, nulle part ailleurs. 7) Si quelque chose vous paraît anormal (fichiers illisibles, message de rançon, mot de passe refusé), débranchez le câble réseau et appelez immédiatement le service informatique au numéro affiché : signaler vite n’est jamais une faute.</p>
      </div>
    </div>
    <p><strong>Restitution orale</strong> (5 minutes par binôme, devant la « direction ») : le contexte et le périmètre, les trois risques principaux expliqués simplement, le plan d’action, et ce que la direction doit décider. Pas de commandes à l’écran : la direction veut comprendre les enjeux, pas la technique.</p>
  </div>
</details>

<h2>Défis</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Exercice de crise sur table</summary>
  <div class="task-body">
    <div class="answer" data-id="tb-crise" data-label="Défi : exercice de crise" data-min="250" data-rows="10">
      <p>L’enseignant joue l’animateur et donne les événements un par un, toutes les 5 minutes : (1) le site web affiche une page revendicative ; (2) le journal d’Apache montre des requêtes inhabituelles vers <code>/admin/upload.php</code> depuis une adresse étrangère ; (3) un journaliste local appelle la M2L ; (4) on découvre un fichier <code>licencies.csv</code> téléchargé la veille depuis le serveur. Pour chaque événement, noter les décisions prises, qui les prend, et les messages envoyés (interne, CNIL, presse).</p>
      <div class="corr">
        <p>Attendus : (1) main courante, isoler le serveur web (règle pfSense ou arrêt du site avec une page de maintenance), copier les journaux et une image du disque avant toute réinstallation, prévenir la direction. (2) L’analyse oriente vers une faille de l’application (dépôt de fichier non contrôlé) : chercher d’autres fichiers déposés, l’étendue de la compromission, si le serveur a servi de rebond (journaux pfSense de la DMZ vers le LAN). (3) Aucune déclaration technique improvisée : la direction répond avec un message validé, factuel et sans spéculation. (4) Violation de données personnelles : notification à la CNIL dans les 72 heures, information des licenciés si le risque est élevé, plainte, et vérification du contenu du fichier. Retour d’expérience : contrôle des fichiers déposés, mises à jour de l’application, séparation des données des licenciés et du serveur web.</p>
      </div>
    </div>
  </div>
</details>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Pour les SLAM : auditer son application web</summary>
  <div class="task-body">
    <div class="answer" data-id="tb-slam" data-label="Défi SLAM : sécurité d’une application web" data-min="200" data-rows="8">
      <p>Appliquer à une application PHP que vous avez développée en atelier professionnel la grille suivante, et noter pour chaque point la preuve (extrait de code ou test) : mots de passe stockés avec <code>password_hash()</code> ; requêtes préparées (PDO) pour toutes les requêtes contenant une saisie ; échappement des données affichées (<code>htmlspecialchars()</code>) ; session régénérée à la connexion (<code>session_regenerate_id()</code>) ; cookie de session <code>HttpOnly</code> et <code>Secure</code> ; site servi en HTTPS ; aucun mot de passe de base de données dans le dépôt GitHub.</p>
      <div class="corr">
        <p>Chaque point correspond à une catégorie du <strong>Top 10 de l’OWASP</strong> (référence des risques des applications web) : stockage des mots de passe (défaillances cryptographiques), requêtes préparées (injection SQL), échappement (XSS, également une injection), gestion de session (authentification), HTTPS et cookies <code>Secure</code> (partie 4 : vol de session vu dans la capture), secrets hors du dépôt (fichier de configuration exclu par <code>.gitignore</code>, variables d’environnement). Un point non conforme fait l’objet d’un ticket dans le dépôt, avec sa correction.</p>
      </div>
    </div>
  </div>
</details>

<h2>Fiche mémo : les notions</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Notion</th><th>À retenir</th></tr>
  <tr><td>Besoins de sécurité</td><td>DICP : disponibilité, intégrité, confidentialité, preuve (traçabilité) ; plus authenticité et non-répudiation.</td></tr>
  <tr><td>Risque</td><td>Actif (bien essentiel, bien support), menace, vulnérabilité, impact. Risque = vraisemblance × gravité. Traiter : réduire, transférer, éviter, accepter ; risque résiduel accepté par la direction. EBIOS RM, ISO 27001.</td></tr>
  <tr><td>Acteurs</td><td>ANSSI (guide d’hygiène, 42 mesures), CERT-FR (avis, alertes), CNIL, Cybermalveillance.gouv.fr (17Cyber), police et gendarmerie.</td></tr>
  <tr><td>Droit</td><td>RGPD : finalité, minimisation, conservation limitée, sécurité, registre, violation notifiée à la CNIL sous 72 h. Code pénal 323-1 : accès frauduleux, 3 ans et 100 000 € (5 ans et 150 000 € avec dommages) ; la tentative est punie. Autorisation écrite pour tout test. Charte informatique.</td></tr>
  <tr><td>Ingénierie sociale</td><td>Hameçonnage (ciblé), fraude au président, faux RIB, faux support. Indices : urgence, expéditeur, lien (domaine juste avant le premier <code>/</code>), demande de mot de passe.</td></tr>
  <tr><td>Mots de passe</td><td>Entropie = L × log<sub>2</sub>(N). CNIL : 80 bits seul (12 caractères des 4 types, 14 sans spéciaux, 7 mots) ; 50 bits avec restriction d’accès. Stockage : hachage salé lent (Argon2, bcrypt, yescrypt), jamais en clair.</td></tr>
  <tr><td>MFA</td><td>Deux facteurs de catégories différentes (savoir, posséder, être). FIDO2 et clés d’accès résistent à l’hameçonnage.</td></tr>
  <tr><td>Réseau d’accès</td><td>Ports inutilisés désactivés ; mode accès fixe ; sécurité des ports (maximum, sticky, protect / restrict / shutdown) ; surveillance DHCP (port de confiance, table de liaisons) ; inspection ARP dynamique ; garde BPDU ; 802.1X (demandeur, authentificateur, RADIUS).</td></tr>
  <tr><td>Wi-Fi</td><td>WEP et WPA à proscrire ; WPA2 (AES) ; WPA3 (SAE, PMF). Personnel (clé partagée) ou Entreprise (802.1X, compte par utilisateur). Réseau invités isolé.</td></tr>
  <tr><td>Cryptographie</td><td>Symétrique (AES, rapide, une clé partagée) ; asymétrique (RSA, courbes elliptiques ; clé publique et clé privée) ; hybride. Chiffrer avec la clé publique du destinataire ; signer avec sa clé privée. Encodage ≠ chiffrement.</td></tr>
  <tr><td>Certificats et TLS</td><td>X.509 : sujet, noms alternatifs, clé publique, émetteur, validité, signature de l’AC. Chaîne de confiance jusqu’à une AC racine. Let’s Encrypt, AC interne, auto-signé. TLS 1.2 et 1.3 seulement ; SNI en clair ; HSTS.</td></tr>
  <tr><td>Durcissement</td><td>Mettre à jour, retirer l’inutile, moindre privilège, SSH par clés sans root, HTTPS, pare-feu local, fail2ban, masquer les versions ; mesurer avant et après (Lynis).</td></tr>
  <tr><td>Vulnérabilités</td><td>CVE (identifiant), CVSS (0 à 10 ; critique à partir de 9,0), zero-day. Veille CERT-FR ; priorité selon exploitation active, exposition et gravité ; contournement en attendant le correctif.</td></tr>
  <tr><td>Incident de sécurité</td><td>Préparation, détection, confinement (isoler sans éteindre), éradication, rétablissement, retour d’expérience. Main courante, preuves, ne pas payer, CNIL 72 h, plainte, assureur.</td></tr>
</table></div>

<h2>Fiche mémo : les commandes</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Besoin</th><th>Commandes</th></tr>
  <tr><td>Sécurité des ports (Cisco)</td><td><code>switchport mode access</code>, <code>switchport port-security</code>, <code>… maximum 1</code>, <code>… mac-address sticky</code>, <code>… violation shutdown</code>, <code>show port-security interface</code>, <code>shutdown</code> / <code>no shutdown</code></td></tr>
  <tr><td>Surveillance DHCP (Cisco)</td><td><code>ip dhcp snooping</code>, <code>ip dhcp snooping vlan 1</code>, <code>no ip dhcp snooping information option</code>, <code>ip dhcp snooping trust</code>, <code>ip dhcp snooping limit rate 10</code>, <code>show ip dhcp snooping binding</code></td></tr>

  <tr><td>SSH par clés</td><td><code>ssh-keygen -t ed25519</code>, <code>~/.ssh/authorized_keys</code> (700 / 600), <code>/etc/ssh/sshd_config.d/</code> : <code>PermitRootLogin no</code>, <code>PasswordAuthentication no</code> ; <code>sshd -t</code>, <code>systemctl reload ssh</code></td></tr>
  <tr><td>Certificats et TLS</td><td><code>openssl req -x509 -newkey rsa:3072 …</code>, <code>openssl x509 -noout -subject -issuer -dates</code>, <code>openssl s_client -connect hôte:443</code>, <code>a2enmod ssl headers</code>, <code>SSLProtocol -all +TLSv1.2 +TLSv1.3</code></td></tr>

</table></div>

      items.filter(function (x) { return x.page.id === p.id; }).forEach(function (x) {
        var r = itemResult(x);
        out += '<div class="it"><span class="res ' + (r.level || '') + '">' + esc(r.txt) + '</span><div class="lab">' + esc(x.it.label) + '</div>';
        if (x.st && x.st.editedAfter) out += '<div class="note">Réponse complétée après la consultation de la correction.</div>';
        if (x.it.type === 'answer' && x.st) { if (x.st.text) out += '<pre>' + esc(x.st.text) + '</pre>'; if (x.st.tables) out += tablesToHTML(x.st); }
        out += '</div>';
      });
    });
    out += '<h2>Journal</h2><table class="log">' + state.log.map(function (ev) { return '<tr><td>' + fmtDate(ev.t, true) + '</td><td>' + esc(eventText(ev)) + '</td></tr>'; }).join('') + '</table>';
    return out + '</body></html>';
  }
  function renderExport(el) {
    el.innerHTML = '<div class="row"><button type="button" class="btn primary" data-dlrep>Télécharger le compte rendu (.html)</button><button type="button" class="btn" data-copyrep>Copier le compte rendu (texte)</button><button type="button" class="btn ghost" data-showrep>Afficher</button></div><p class="note-line">Le compte rendu contient les réponses, les résultats des premières tentatives et le journal horodaté (tentatives, corrections consultées, sauvegardes, restaurations).</p><textarea id="rep-area" rows="12" readonly hidden style="width:100%;font:.8rem/1.45 var(--f-mono);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)"></textarea>';
    var area = $('#rep-area', el);
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-copyrep')) copyText(buildReport(false), b, area);
      if (b.hasAttribute('data-dlrep')) download('compte-rendu-' + (CONFIG.fileSlug || 'cours') + '-' + slug(fullName()) + '.html', buildReport(true), 'text/html');
      if (b.hasAttribute('data-showrep')) { area.hidden = !area.hidden; area.value = buildReport(false); b.textContent = area.hidden ? 'Afficher' : 'Masquer'; }
    });
  }
  function renderBackup(el) {
    el.innerHTML = '<div class="row"><button type="button" class="btn primary" data-dlbk>Sauvegarder dans un fichier</button><label class="btn" for="bk-file">Ouvrir un fichier de sauvegarde</label><input type="file" id="bk-file" accept=".json,application/json" class="sr-only"></div><div data-bkmsg></div>' +
      '<hr><div class="row"><button type="button" class="btn ghost" data-reset>Effacer mes réponses en cours…</button><span class="confirm" data-confirm hidden>Effacer les réponses de ce navigateur ? Les résultats des premières tentatives et le journal sont conservés. <button type="button" class="btn small" data-reset-yes style="border-color:var(--ko);color:var(--ko)">Oui, effacer</button><button type="button" class="btn small" data-reset-no>Annuler</button></span></div>';
    fileInput($('#bk-file', el), $('[data-bkmsg]', el));
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-dlbk')) fileSave();
      if (b.hasAttribute('data-reset')) $('[data-confirm]', el).hidden = false;
      if (b.hasAttribute('data-reset-no')) $('[data-confirm]', el).hidden = true;
      if (b.hasAttribute('data-reset-yes')) { state.items = {}; logEvent('reset'); saveNow(); render(PAGE); }
    });
  }

  /* ---------- démarrage ---------- */
  function start() {
    load(); buildShell(); buildManifest();
    var t = location.hash.slice(1);
    render(pageById(t) ? t : 'accueil');
    window.__support = { state: function () { return state; } }; // utile pour les tests
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
</body>
</html>
