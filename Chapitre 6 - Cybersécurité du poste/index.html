<template data-page="p3">
<h1>Sécuriser l’accès au réseau : commutateurs et Wi-Fi</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : chapitre 2 (Ethernet, adresses MAC, ARP, commutation, commandes Cisco de base), chapitre 3 (DHCP). Les VLAN du chapitre 4 sont un plus. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Réseau d’accès</div><ul>
  <li><span><b>Attaques locales</b> : prise libre, MAC, ARP, faux DHCP, VLAN</span></li>
  <li><span><b>Commutateur</b> : sécurité des ports, DHCP, ARP</span></li>
  <li><span><b>802.1X</b> : authentifier avant d’ouvrir le port</span></li>
  <li><span><b>Wi-Fi</b> : WPA2, WPA3, Personnel ou Entreprise, réseau invités</span></li>
</ul></div></figure>

<p class="lead">Le pare-feu protège la frontière avec Internet. Mais un visiteur qui branche son ordinateur portable sur une prise murale d’une salle de réunion, ou un poste infecté à l’intérieur, se trouve déjà <strong>derrière</strong> le pare-feu. Les protocoles de la couche 2 (Ethernet, ARP) et DHCP ont été conçus pour des réseaux de confiance : ils n’authentifient personne. Il faut donc sécuriser aussi le réseau d’accès, là où se branchent les utilisateurs.</p>

<h2>Les attaques sur le réseau local</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Attaque</th><th>Principe</th><th>Conséquence</th></tr>
  <tr><td><strong>Branchement non autorisé</strong></td><td>Un ordinateur inconnu est branché sur une prise libre ou à la place d’un poste (ou d’une imprimante)</td><td>Accès au réseau interne derrière le pare-feu</td></tr>
  <tr><td><strong>Saturation de la table MAC</strong> (<em>MAC flooding</em>)</td><td>Envoyer des milliers de trames avec des adresses MAC source inventées : la table du commutateur est pleine</td><td>Le commutateur diffuse les trames sur tous les ports, comme un concentrateur : l’attaquant peut tout capturer</td></tr>
  <tr><td><strong>Faux serveur DHCP</strong></td><td>Un serveur DHCP pirate (ou une box branchée par erreur) répond plus vite que le vrai</td><td>Les postes reçoivent une mauvaise passerelle ou un mauvais DNS : le trafic passe par l’attaquant (homme du milieu), ou plus rien ne fonctionne</td></tr>
  <tr><td><strong>Usurpation ARP</strong> (<em>ARP spoofing</em>)</td><td>Envoyer de fausses réponses ARP : « l’adresse IP de la passerelle, c’est ma MAC »</td><td>Homme du milieu : l’attaquant lit et modifie le trafic</td></tr>
  <tr><td><strong>Saut de VLAN</strong> (<em>VLAN hopping</em>)</td><td>Négocier un trunk (DTP) avec le commutateur, ou envoyer des trames à double étiquette par le VLAN natif</td><td>Accès à d’autres VLAN que le sien</td></tr>
</table></div>
<p>Rappel du chapitre 2 : ARP associe une adresse IP à une adresse MAC, et un poste accepte une réponse ARP même s’il n’a rien demandé. Le DHCP, lui, fait confiance au premier serveur qui répond. Aucun des deux ne vérifie l’identité de l’émetteur.</p>

<h2>Les protections sur le commutateur</h2>
<h3>Désactiver ce qui ne sert pas</h3>
<p>Une prise non utilisée doit être <strong>désactivée</strong> (<code>shutdown</code>), et rangée dans un VLAN inutilisé. Les ports des postes sont configurés en mode accès fixe (<code>switchport mode access</code> et <code>switchport nonegotiate</code>), ce qui empêche la négociation d’un trunk par DTP. Le VLAN natif des trunks est un VLAN inutilisé (999 à la M2L, chapitre 4).</p>

<h3>La sécurité des ports (<em>port security</em>)</h3>
<p>Le commutateur limite le nombre d’adresses MAC autorisées sur un port, et peut retenir lesquelles. En cas de violation :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Mode de violation</th><th>Trafic de l’adresse inconnue</th><th>Message et compteur</th><th>Port</th></tr>
  <tr><td><code>protect</code></td><td>bloqué</td><td>non</td><td>reste actif</td></tr>
  <tr><td><code>restrict</code></td><td>bloqué</td><td>oui (journal syslog, compteur)</td><td>reste actif</td></tr>
  <tr><td><code>shutdown</code> (par défaut)</td><td>bloqué</td><td>oui</td><td>désactivé (état <em>err-disabled</em>) jusqu’à intervention</td></tr>
</table></div>
<pre class="code"><span class="pr">SW-ACCES(config)#</span> interface FastEthernet0/1
<span class="pr">SW-ACCES(config-if)#</span> switchport mode access
<span class="pr">SW-ACCES(config-if)#</span> switchport port-security
<span class="pr">SW-ACCES(config-if)#</span> switchport port-security maximum 1
<span class="pr">SW-ACCES(config-if)#</span> switchport port-security mac-address sticky
<span class="pr">SW-ACCES(config-if)#</span> switchport port-security violation shutdown
<span class="pr">SW-ACCES#</span> show port-security interface FastEthernet0/1</pre>
<p>Avec <code>sticky</code>, la première adresse MAC vue sur le port est apprise et ajoutée à la configuration ; il faut ensuite enregistrer la configuration (<code>copy running-config startup-config</code>) pour la garder après un redémarrage. La sécurité des ports protège aussi contre la saturation de la table MAC, puisque le port n’accepte qu’un nombre limité d’adresses.</p>

<h3>La surveillance DHCP (<em>DHCP snooping</em>)</h3>
<p>Les ports du commutateur sont classés en deux catégories :</p>
<ul>
  <li><strong>ports de confiance</strong> (<em>trusted</em>) : ceux qui mènent au vrai serveur DHCP (ou au relais) ; les réponses DHCP (Offer, Ack) y sont acceptées ;</li>
  <li><strong>ports non fiables</strong> (<em>untrusted</em>, par défaut) : ceux des postes ; les réponses DHCP qui en arrivent sont <strong>jetées</strong>. Un faux serveur branché sur une prise ne peut donc plus répondre.</li>
</ul>
<p>Le commutateur construit en plus une <strong>table de liaisons</strong> (adresse MAC, adresse IP attribuée, port, VLAN, durée du bail) en observant les échanges DHCP. Cette table sert à l’<strong>inspection ARP dynamique</strong> (DAI, <em>Dynamic ARP Inspection</em>) : une réponse ARP qui ne correspond pas à la table (« je suis la passerelle ») est rejetée.</p>
<pre class="code"><span class="pr">SW-ACCES(config)#</span> ip dhcp snooping
<span class="pr">SW-ACCES(config)#</span> ip dhcp snooping vlan 1
<span class="pr">SW-ACCES(config)#</span> no ip dhcp snooping information option
<span class="pr">SW-ACCES(config)#</span> interface FastEthernet0/24
<span class="pr">SW-ACCES(config-if)#</span> ip dhcp snooping trust
<span class="pr">SW-ACCES(config-if)#</span> exit
<span class="pr">SW-ACCES(config)#</span> interface range FastEthernet0/1 - 20
<span class="pr">SW-ACCES(config-if-range)#</span> ip dhcp snooping limit rate 10
<span class="pr">SW-ACCES#</span> show ip dhcp snooping
<span class="pr">SW-ACCES#</span> show ip dhcp snooping binding</pre>
<p>La commande <code>no ip dhcp snooping information option</code> empêche le commutateur d’ajouter l’option 82 aux requêtes : beaucoup de serveurs DHCP (dont celui de Packet Tracer et Windows Server dans certaines configurations) rejettent sinon ces requêtes, et plus aucun poste n’obtient d’adresse. La limite de débit (<code>limit rate</code>, en paquets par seconde) protège le serveur contre un poste qui l’inonde de demandes pour épuiser les adresses disponibles.</p>

<div class="aside deep">
  <p class="aside-title">En profondeur : le garde BPDU</p>
  <p>Le protocole STP (<em>Spanning Tree</em>) évite les boucles entre commutateurs en échangeant des trames appelées BPDU. Un poste n’en envoie jamais. Sur les ports des postes, on active <code>spanning-tree portfast</code> (le port passe immédiatement en transmission) et <code>spanning-tree bpduguard enable</code> : si une BPDU arrive (un commutateur personnel branché, ou un attaquant qui veut devenir le pont racine pour attirer le trafic), le port est désactivé. Vous étudierez STP en détail en deuxième année.</p>
</div>

<h3>802.1X : authentifier avant d’ouvrir le port</h3>
<p>Les protections précédentes limitent les dégâts, mais n’identifient personne. Avec <strong>802.1X</strong>, le port du commutateur reste fermé (seul le trafic d’authentification passe) tant que l’appareil ne s’est pas authentifié :</p>
<figure class="fig">

  </svg>
  <figcaption>Les trois acteurs de 802.1X.</figcaption>
</figure>
<p>Le serveur <strong>RADIUS</strong> (sous Windows Server : le rôle NPS ; sous Linux : FreeRADIUS) vérifie l’identité dans l’annuaire Active Directory, par l’identifiant et le mot de passe de l’utilisateur ou par un certificat de l’ordinateur. Il peut renvoyer le numéro de VLAN à attribuer : un poste de la ligue de volley est placé automatiquement dans le VLAN 106, quelle que soit la prise utilisée. Les appareils qui ne savent pas faire de 802.1X (imprimantes, téléphones) sont authentifiés par leur adresse MAC (MAB), méthode plus faible à compléter par d’autres contrôles. Ensemble, ces mécanismes forment un <strong>contrôle d’accès au réseau</strong> (NAC).</p>

<div class="match" data-id="m-attaque-parade" data-label="Quelle protection contre quelle attaque ?" data-options="Sécurité des ports|Surveillance DHCP|Inspection ARP dynamique|Mode accès fixe et VLAN natif inutilisé|802.1X">
  <div class="r" data-ok="Surveillance DHCP" data-expl="Les réponses DHCP qui arrivent d’un port non fiable sont jetées.">Un stagiaire branche dans une salle de réunion une box Internet qui distribue ses propres adresses ; plusieurs postes perdent l’accès au réseau.</div>
  <div class="r" data-ok="Sécurité des ports" data-expl="Le port n’accepte qu’un nombre limité d’adresses MAC : les milliers d’adresses inventées sont rejetées.">Un outil envoie des milliers de trames avec des adresses MAC source aléatoires sur un port.</div>
  <div class="r" data-ok="Inspection ARP dynamique" data-expl="L’inspection ARP compare chaque réponse ARP à la table de liaisons construite par la surveillance DHCP.">Un poste envoie des réponses ARP non sollicitées qui annoncent sa propre adresse MAC pour l’adresse IP de la passerelle.</div>
  <div class="r" data-ok="Mode accès fixe et VLAN natif inutilisé" data-expl="Sans négociation DTP, pas de trunk ; avec un VLAN natif inutilisé, pas de double étiquetage exploitable.">Un attaquant tente de faire passer le port de son poste en trunk pour accéder à tous les VLAN.</div>
  <div class="r" data-ok="802.1X" data-expl="Le port reste fermé tant que l’appareil ne s’est pas authentifié auprès du serveur RADIUS.">La direction veut qu’aucun appareil ne puisse utiliser le réseau filaire sans que son utilisateur se soit authentifié avec son compte du domaine.</div>
</div>

<h2>Sécuriser le Wi-Fi</h2>
<p>Le Wi-Fi traverse les murs : n’importe qui sur le parking peut capter les ondes. Le chiffrement et l’authentification ne sont donc pas facultatifs.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Protocole</th><th>Année</th><th>Chiffrement</th><th>État</th></tr>
  <tr><td>WEP</td><td>1999</td><td>RC4</td><td><strong>cassé</strong> : la clé se retrouve en quelques minutes ; à proscrire</td></tr>
  <tr><td>WPA</td><td>2003</td><td>TKIP (RC4)</td><td>obsolète, à proscrire</td></tr>
  <tr><td>WPA2</td><td>2004</td><td>AES-CCMP</td><td>encore très répandu ; en mode Personnel, une capture de la connexion d’un client permet une attaque par dictionnaire <strong>hors ligne</strong> sur la clé partagée</td></tr>
  <tr><td>WPA3</td><td>2018</td><td>AES (GCMP en mode 192 bits)</td><td>recommandé : en mode Personnel, l’échange SAE résiste aux attaques par dictionnaire hors ligne ; la protection des trames de gestion (PMF) est obligatoire</td></tr>
</table></div>
<dl class="def">
  <dt>Mode Personnel (PSK, SAE)</dt><dd>Une même clé partagée pour tout le monde. Simple, mais la clé circule (affichée sur un mur, donnée aux anciens bénévoles) et on ne sait pas qui est connecté. Pour un petit réseau, avec une clé longue changée régulièrement.</dd>
  <dt>Mode Entreprise (802.1X)</dt><dd>Chaque utilisateur s’authentifie avec son propre compte (ou un certificat) auprès d’un serveur RADIUS, comme pour 802.1X filaire. Un compte désactivé dans l’annuaire perd immédiatement l’accès ; les connexions sont tracées nominativement. C’est le mode adapté au personnel de la M2L et des ligues.</dd>
  <dt>Réseau invités</dt><dd>SSID séparé, dans son propre VLAN, filtré vers Internet uniquement (chapitre 4), souvent avec un <strong>portail captif</strong> (page d’acceptation des conditions d’utilisation, ou code remis à l’accueil). Les clients sont isolés entre eux. Une organisation qui offre un accès à Internet au public peut avoir l’obligation de conserver les données de connexion pendant un an : on se renseigne avant d’ouvrir le service.</dd>
</dl>
<div class="aside pro">
  <p class="aside-title">En entreprise</p>
  <p>Un piège classique est le <strong>point d’accès pirate</strong> : un faux réseau « M2L-Invites » diffusé par un attaquant avec le même nom que le vrai (<em>evil twin</em>). Les clients s’y connectent et tout leur trafic passe par lui. Les bornes professionnelles détectent ces réseaux pirates ; côté utilisateurs, les postes de l’entreprise ne doivent se connecter qu’aux réseaux en mode Entreprise, qui vérifient le certificat du serveur RADIUS.</p>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p3" data-title="Sécurité du réseau d’accès" data-label="Quiz de fin de partie">
  <div class="q" data-ok="2">
    <p class="qt">Avec la surveillance DHCP, sur quel port faut-il configurer <code>ip dhcp snooping trust</code> ?</p>
    <ul><li>Sur tous les ports des postes</li><li>Sur le port qui mène au vrai serveur DHCP</li><li>Sur aucun port</li><li>Sur le port de l’attaquant</li></ul>
    <div class="expl">Seuls les ports de confiance acceptent les réponses DHCP. Si on oublie de déclarer le port du vrai serveur, plus aucun poste n’obtient d’adresse.</div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Un port configuré avec <code>switchport port-security violation shutdown</code> détecte une adresse MAC non autorisée. Que se passe-t-il ?</p>
    <ul><li>Le trafic inconnu est bloqué, le port reste actif</li><li>Rien, un message est simplement enregistré</li><li>Le port passe à l’état err-disabled et plus rien ne passe</li><li>Le commutateur redémarre</li></ul>
    <div class="expl">En mode <code>shutdown</code>, le port est désactivé jusqu’à une intervention (<code>shutdown</code> puis <code>no shutdown</code>) ou une réactivation automatique configurée.</div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Dans 802.1X, quel est le rôle du commutateur ?</p>
    <ul><li>Authentificateur : il relaie l’authentification vers le serveur RADIUS et ouvre le port si elle réussit</li><li>Serveur d’authentification : il vérifie le mot de passe</li><li>Demandeur : il s’authentifie auprès du poste</li><li>Aucun : 802.1X ne concerne que le Wi-Fi</li></ul>
    <div class="expl">Le commutateur (ou la borne Wi-Fi) ne connaît pas les mots de passe : il transmet les échanges EAP au serveur RADIUS et applique sa décision.</div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Pourquoi préférer WPA2 ou WPA3 Entreprise au mode Personnel pour le personnel de la M2L ?</p>
    <ul><li>Il est plus rapide</li><li>Il ne demande aucun serveur</li><li>Il évite tout chiffrement</li><li>Chaque utilisateur a son propre compte : accès retiré en désactivant le compte, connexions nominatives</li></ul>
    <div class="expl">Avec une clé partagée, il faudrait changer la clé sur tous les appareils à chaque départ. Le mode Entreprise s’appuie sur l’annuaire.</div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Quel protocole Wi-Fi faut-il absolument abandonner ?</p>
    <ul><li>WPA3</li><li>WEP</li><li>WPA2 Entreprise</li><li>802.1X</li></ul>
    <div class="expl">La clé WEP se retrouve en quelques minutes à partir d’une capture du trafic. WPA (TKIP) est également obsolète.</div>
  </div>
</div>

<div class="aside next">
  <p class="aside-title">La suite</p>
  <p>Au <a href="#tp16">TP 16</a>, vous attaquez votre propre maquette Packet Tracer avec un faux serveur DHCP, puis vous la protégez : surveillance DHCP, sécurité des ports et Wi-Fi WPA2 Entreprise avec un serveur RADIUS.</p>
</div>
</template>

<template data-page="tp16">
<h1>Sécuriser le réseau d’accès de la M2L</h1>
<p class="lead">La salle de la ligue de volley (ligue 06, réseau <code>172.16.8.160/27</code>) va être équipée d’un commutateur et d’une borne Wi-Fi. Avant la mise en service, le responsable veut une démonstration : montrer qu’un faux serveur DHCP détourne les postes, puis que la configuration proposée l’en empêche, qu’un appareil inconnu branché à la place d’un poste est bloqué, et que le Wi-Fi n’accepte que les membres de la ligue, chacun avec son compte.</p>

<div class="aside caution">
  <p class="aside-title">Consignes</p>
  <ul>
    <li>Outil : <strong>Cisco Packet Tracer</strong>. Enregistrer la maquette sous <code>TP16-nom-prenom.pkt</code> à la fin de chaque mission.</li>
    <li>Le faux serveur DHCP n’existe que dans la maquette. Brancher un serveur DHCP ou une box sur le réseau du lycée perturberait toute la salle, voire tout l’établissement : c’est interdit.</li>
    <li>Travail individuel, <strong>sans IA</strong>. Noter les résultats exacts des commandes <code>show</code>.</li>
  </ul>
</div>

<h2>La maquette</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Équipement</th><th>Modèle Packet Tracer</th><th>Port du commutateur</th><th>Adresse</th></tr>
  <tr><td>SW-ACCES</td><td>2960-24TT</td><td>—</td><td>—</td></tr>
  <tr><td>SRV-VOLLEY (DHCP et RADIUS)</td><td>Server-PT</td><td>Fa0/24</td><td><code>172.16.8.189/27</code></td></tr>
  <tr><td>PC-VOLLEY1, PC-VOLLEY2, PC-VOLLEY3</td><td>PC-PT</td><td>Fa0/1, Fa0/2, Fa0/3</td><td>DHCP</td></tr>
  <tr><td>PIRATE (faux serveur DHCP)</td><td>Server-PT</td><td>Fa0/10 (prise libre de la salle)</td><td><code>10.66.66.1/24</code></td></tr>
  <tr><td>WIFI-VOLLEY (borne)</td><td>WRT300N</td><td>Fa0/20 (port LAN de la borne)</td><td><code>172.16.8.188/27</code></td></tr>
  <tr><td>PORTABLE1</td><td>Laptop-PT avec une carte WPC300N</td><td>sans fil</td><td>DHCP</td></tr>
</table></div>

<h2>Mission 1 : construire la maquette et constater l’attaque</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Un réseau qui fonctionne, puis un faux serveur DHCP</summary>
  <div class="task-body">
    <ol class="steps">
      <li>Placer et câbler SW-ACCES, SRV-VOLLEY et les trois PC (câbles droits). Nommer le commutateur et protéger son accès : <code>hostname SW-ACCES</code>, <code>enable secret</code>, mot de passe console.</li>
      <li>SRV-VOLLEY : adresse statique <code>172.16.8.189/27</code>, passerelle <code>172.16.8.190</code>. Onglet <em>Services &gt; DHCP</em> : activer le service, pool <code>serverPool</code> avec passerelle par défaut <code>172.16.8.190</code>, DNS <code>172.16.8.189</code>, adresse de début <code>172.16.8.161</code>, masque <code>255.255.255.224</code>, 20 utilisateurs au plus ; enregistrer.</li>
      <li>Sur chaque PC : <em>Desktop &gt; IP Configuration &gt; DHCP</em>. Vérifier qu’ils obtiennent une adresse en <code>172.16.8.16x</code> et qu’ils se joignent (<code>ping</code>).</li>
      <li>Placer PIRATE sur Fa0/10 : adresse statique <code>10.66.66.1/24</code> ; service DHCP activé avec un pool dont la passerelle et le DNS sont <code>10.66.66.1</code>, adresse de début <code>10.66.66.10</code>.</li>
      <li>Sur chaque PC, repasser en <em>Static</em> puis en <em>DHCP</em> pour redemander une adresse. Recommencer plusieurs fois et noter les adresses obtenues.</li>
    </ol>
    <div class="answer" data-id="t16-attaque" data-label="Mission 1 : effets du faux serveur DHCP" data-min="200" data-rows="8">
      <p>a) Quelles adresses, passerelles et serveurs DNS les PC ont-ils obtenus ? Pourquoi le résultat change-t-il d’une demande à l’autre ? b) Que pourrait faire un vrai attaquant dont le poste est la passerelle et le serveur DNS des victimes ? c) Pourquoi ce problème arrive-t-il aussi sans attaquant, dans une vraie entreprise ?</p>
      <div class="corr">
        <p>a) Selon les demandes, des adresses en <code>172.16.8.16x</code> (vrai serveur) ou en <code>10.66.66.x</code> avec la passerelle et le DNS <code>10.66.66.1</code> (PIRATE). Le Discover est diffusé : les deux serveurs le reçoivent et répondent, et le client accepte la <strong>première offre</strong> reçue. Rien dans DHCP ne permet au client de savoir quel serveur est légitime.</p>
        <p>b) Toutes les communications des victimes vers l’extérieur passent par lui : il peut les lire (mots de passe envoyés sans chiffrement), les modifier, et répondre aux requêtes DNS par de fausses adresses (faux site de connexion à la messagerie). C’est une attaque de l’homme du milieu.</p>
        <p>c) Une box Internet, un routeur Wi-Fi personnel ou une machine virtuelle en mode pont avec un serveur DHCP actif, branchés par erreur, ont exactement le même effet : des postes qui perdent l’accès au réseau, de façon aléatoire et difficile à diagnostiquer.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 2 : activer la surveillance DHCP</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Seul le port du vrai serveur peut répondre</summary>
  <div class="task-body">
    <pre class="code"><span class="pr">SW-ACCES(config)#</span> ip dhcp snooping
<span class="pr">SW-ACCES(config)#</span> ip dhcp snooping vlan 1
<span class="pr">SW-ACCES(config)#</span> no ip dhcp snooping information option
<span class="pr">SW-ACCES(config)#</span> interface FastEthernet0/24
<span class="pr">SW-ACCES(config-if)#</span> description Vers SRV-VOLLEY (serveur DHCP legitime)
<span class="pr">SW-ACCES(config-if)#</span> ip dhcp snooping trust
<span class="pr">SW-ACCES(config-if)#</span> exit
<span class="pr">SW-ACCES(config)#</span> interface range FastEthernet0/1 - 23
<span class="pr">SW-ACCES(config-if-range)#</span> ip dhcp snooping limit rate 10
<span class="pr">SW-ACCES(config-if-range)#</span> end
<span class="pr">SW-ACCES#</span> copy running-config startup-config</pre>
    <p>Redemander plusieurs fois une adresse sur chaque PC, puis afficher <code>show ip dhcp snooping</code> et <code>show ip dhcp snooping binding</code>.</p>
    <div class="answer" data-id="t16-snooping" data-label="Mission 2 : résultats de la surveillance DHCP" data-min="200" data-rows="8">
      <p>a) Quelles adresses les PC obtiennent-ils désormais ? Que deviennent les offres de PIRATE ? b) Recopier la table de liaisons et expliquer chaque colonne. c) Que se passe-t-il si l’on oublie la commande <code>ip dhcp snooping trust</code> sur Fa0/24 ? Le vérifier, puis rétablir.</p>
      <div class="corr">
        <p>a) Toujours une adresse en <code>172.16.8.16x</code> du vrai serveur. Les Offer et Ack de PIRATE arrivent sur Fa0/10, port non fiable : le commutateur les jette. PIRATE reçoit toujours les Discover (diffusés), mais ses réponses n’atteignent plus personne.</p>
        <p>b) Une ligne par bail : <code>MacAddress</code> (adresse MAC du PC), <code>IpAddress</code> (adresse attribuée), <code>Lease(sec)</code> (durée du bail en secondes), <code>Type</code> (<code>dhcp-snooping</code> : liaison apprise en observant DHCP), <code>VLAN</code> (1), <code>Interface</code> (port du PC). C’est cette table qu’utiliserait l’inspection ARP dynamique pour vérifier les réponses ARP.</p>
        <p>c) Plus aucun PC n’obtient d’adresse : les réponses du vrai serveur sont jetées elles aussi (tous les ports sont non fiables par défaut). Les PC prennent une adresse automatique en <code>169.254.x.x</code>. C’est l’erreur la plus fréquente lors de la mise en place de la surveillance DHCP, et un bon exemple de mesure de sécurité qui casse le service si elle est mal configurée.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 3 : sécurité des ports et prises inutilisées</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Un poste par prise, et pas une prise de plus</summary>
  <div class="task-body">
    <pre class="code"><span class="pr">SW-ACCES(config)#</span> interface range FastEthernet0/1 - 3
<span class="pr">SW-ACCES(config-if-range)#</span> description Postes de la ligue de volley
<span class="pr">SW-ACCES(config-if-range)#</span> switchport mode access
<span class="pr">SW-ACCES(config-if-range)#</span> switchport port-security
<span class="pr">SW-ACCES(config-if-range)#</span> switchport port-security maximum 1
<span class="pr">SW-ACCES(config-if-range)#</span> switchport port-security mac-address sticky
<span class="pr">SW-ACCES(config-if-range)#</span> switchport port-security violation shutdown
<span class="pr">SW-ACCES(config-if-range)#</span> exit
<span class="pr">SW-ACCES(config)#</span> interface range FastEthernet0/4 - 19 , FastEthernet0/21 - 23 , GigabitEthernet0/1 - 2
<span class="pr">SW-ACCES(config-if-range)#</span> description Prise inutilisee
<span class="pr">SW-ACCES(config-if-range)#</span> shutdown</pre>
    <ol class="steps">
      <li>Depuis chaque PC, faire un <code>ping 172.16.8.189</code> (le commutateur apprend ainsi l’adresse MAC de chaque poste), puis afficher <code>show port-security</code>, <code>show port-security interface FastEthernet0/1</code> et <code>show running-config</code> (interface Fa0/1).</li>
      <li>Simuler un intrus : débrancher PC-VOLLEY1 et brancher à sa place un nouveau PC (INTRUS) sur Fa0/1, en DHCP. Faire un <code>ping</code> depuis INTRUS.</li>
      <li>Afficher <code>show interfaces FastEthernet0/1 status</code> et <code>show port-security interface FastEthernet0/1</code>.</li>
      <li>Remettre PC-VOLLEY1 et réactiver le port : <code>interface FastEthernet0/1</code>, <code>shutdown</code>, <code>no shutdown</code>.</li>
    </ol>
    <div class="answer" data-id="t16-portsec" data-label="Mission 3 : sécurité des ports" data-min="250" data-rows="10">
      <p>a) Quelle ligne la commande <code>sticky</code> a-t-elle ajoutée à la configuration de Fa0/1 ? b) Que se passe-t-il quand INTRUS est branché ? Relever l’état du port et le compteur de violations. c) Le PC de la secrétaire tombe en panne et il est remplacé par un PC neuf : quelle manipulation doit faire le technicien sur le commutateur ? d) Pourquoi la prise Fa0/10 de PIRATE est-elle maintenant désactivée, alors que la surveillance DHCP neutralisait déjà le faux serveur ?</p>
      <div class="corr">
        <p>a) <code>switchport port-security mac-address sticky 00XX.XXXX.XXXX</code> avec l’adresse MAC de PC-VOLLEY1 (elle s’affiche aussi dans <code>show port-security address</code>). Il faut enregistrer la configuration pour la conserver au redémarrage.</p>
        <p>b) Dès la première trame d’INTRUS (son Discover DHCP), l’adresse MAC ne correspond pas : violation, le port passe à l’état <code>err-disabled</code> (voyant rouge dans Packet Tracer), <code>Port Status : Secure-shutdown</code>, <code>Security Violation Count : 1</code>. INTRUS n’obtient pas d’adresse, et PC-VOLLEY1 non plus s’il est rebranché tant que le port n’a pas été réactivé.</p>
        <p>c) Effacer l’adresse apprise (<code>no switchport port-security mac-address sticky &lt;ancienne MAC&gt;</code>, ou <code>clear port-security sticky interface Fa0/1</code> selon la version), réactiver le port si besoin (<code>shutdown</code>, <code>no shutdown</code>), laisser le nouveau PC se faire apprendre, enregistrer la configuration, et <strong>tracer l’intervention dans un ticket</strong> (chapitre 5). C’est le coût de cette protection : chaque changement de matériel demande une intervention.</p>
        <p>d) Défense en profondeur : la surveillance DHCP ne bloque que les réponses DHCP. Par une prise active, un attaquant pourrait encore se brancher, scanner le réseau, tenter une usurpation ARP ou attaquer les postes et le serveur directement. Une prise qui ne sert pas doit être désactivée.</p>
      </div>
    </div>
    <div class="answer" data-id="t16-borne" data-label="Mission 3 : quelle sécurité pour le port de la borne Wi-Fi ?" data-min="120" data-rows="5">
      <p>Le port Fa0/20 relie la borne Wi-Fi, derrière laquelle se connecteront jusqu’à 15 portables. Peut-on lui appliquer <code>maximum 1</code> ? Quelle configuration proposer ?</p>
      <div class="corr">
        <p>Non. Si la borne fonctionne en pont (comme ici, son serveur DHCP étant désactivé), le commutateur voit sur Fa0/20 l’adresse MAC de chaque portable : avec <code>maximum 1</code>, le port serait désactivé dès le deuxième appareil. On fixe un maximum adapté (par exemple 20 : la borne et les portables, avec une marge), en mode <code>restrict</code> plutôt que <code>shutdown</code> pour ne pas couper tout le Wi-Fi à cause d’un appareil de trop, sans <code>sticky</code> (les portables changent). Le contrôle d’accès des utilisateurs se fait sur la borne, par WPA2 Entreprise (mission 4). Remarque : beaucoup de systèmes récents utilisent des adresses MAC aléatoires en Wi-Fi, ce qui rend le filtrage par adresse MAC peu fiable.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 4 : Wi-Fi WPA2 Entreprise avec un serveur RADIUS</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Chaque membre se connecte avec son propre compte</summary>
  <div class="task-body">
    <ol class="steps">
      <li><strong>Borne WIFI-VOLLEY</strong> (onglet <em>GUI</em>) : <em>Setup</em> : adresse du routeur <code>172.16.8.188</code>, masque <code>255.255.255.224</code>, serveur DHCP <strong>désactivé</strong> ; enregistrer. Relier un port <strong>LAN</strong> (Ethernet 1), et non le port Internet, à Fa0/20.</li>
      <li><em>Wireless &gt; Basic Wireless Settings</em> : SSID <code>M2L-Volley</code>. <em>Wireless &gt; Wireless Security</em> : mode <em>WPA2 Enterprise</em>, chiffrement AES, serveur RADIUS <code>172.16.8.189</code>, port 1812, secret partagé <code>R@dius-Volley-2027</code>.</li>
      <li><strong>SRV-VOLLEY</strong>, <em>Services &gt; AAA</em> : activer le service ; dans <em>Network Configuration</em>, ajouter le client <code>WIFI-VOLLEY</code>, adresse <code>172.16.8.188</code>, même secret, type <em>Radius</em> ; dans <em>User Setup</em>, créer <code>lea.martin</code> et <code>ines.benali</code> avec un mot de passe chacun.</li>
      <li><strong>PORTABLE1</strong> : éteindre l’appareil (onglet <em>Physical</em>), remplacer la carte réseau filaire par une carte <strong>WPC300N</strong>, rallumer. <em>Desktop &gt; PC Wireless</em> (ou <em>Wireless</em>) : réseau <code>M2L-Volley</code>, sécurité <em>WPA2-Enterprise</em>, identifiant <code>lea.martin</code> et son mot de passe. Puis <em>IP Configuration &gt; DHCP</em>.</li>
      <li>Tester avec un mauvais mot de passe, puis supprimer le compte <code>ines.benali</code> dans le serveur AAA et tenter de se connecter avec.</li>
    </ol>
    <div class="answer" data-id="t16-wifi" data-label="Mission 4 : Wi-Fi WPA2 Entreprise" data-min="200" data-rows="8">
      <p>a) Quelle adresse PORTABLE1 obtient-il, et de quel serveur ? Peut-il joindre PC-VOLLEY2 ? b) Que se passe-t-il avec un mauvais mot de passe, puis avec le compte supprimé ? c) Comparer avec le mode WPA2 Personnel : que faudrait-il faire, dans chacun des deux modes, quand Inès Benali quitte la ligue ? d) Dans une vraie installation, où seraient stockés les comptes, et quel rôle de Windows Server jouerait le serveur RADIUS ?</p>
      <div class="corr">
        <p>a) Une adresse en <code>172.16.8.16x</code>, attribuée par SRV-VOLLEY : la borne en pont transmet la requête DHCP au réseau filaire (si votre version de Packet Tracer ne la transmet pas, configurer une adresse statique libre, par exemple <code>172.16.8.170</code>). Le portable joint PC-VOLLEY2 : même réseau.</p>
        <p>b) Mauvais mot de passe : l’association échoue, le portable reste sans connexion (pas d’adresse IP). Compte supprimé : même chose. Le serveur RADIUS refuse l’accès et la borne n’ouvre pas la connexion.</p>
        <p>c) Mode Personnel : la clé partagée est connue d’Inès ; il faut la changer sur la borne <strong>et sur tous les appareils des autres membres</strong>, sinon elle garde l’accès. Mode Entreprise : on désactive son compte, et elle perd immédiatement l’accès, sans toucher aux autres. Les connexions sont en plus tracées par compte (journal du serveur RADIUS).</p>
        <p>d) Dans l’annuaire Active Directory <code>m2l.lan</code> (chapitre 5), avec les mêmes identifiants que pour ouvrir une session. Le serveur RADIUS serait le rôle <strong>NPS</strong> (serveur de stratégies réseau) de Windows Server, qui peut limiter l’accès à un groupe (<code>GG_Volley</code>) et placer l’utilisateur dans le bon VLAN.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 5 : rédiger le rapport de configuration</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Expliquer au responsable ce qui protège quoi</summary>
  <div class="task-body">
    <div class="answer" data-id="t16-rapport" data-label="Mission 5 : rapport au responsable" data-min="250" data-rows="10">
      <p>Rédiger un court rapport destiné au responsable de la M2L (non technicien) : pour chaque mesure configurée, la menace qu’elle traite, comment elle a été testée et le résultat, et la contrainte qu’elle crée pour l’exploitation. Terminer par une mesure qui reste à prévoir.</p>
      <div class="corr">
        <p>Éléments attendus, en langage clair :</p>
        <p><strong>Surveillance DHCP</strong> : empêche un appareil branché sur une prise (box, ordinateur pirate) de distribuer de fausses adresses et de détourner le trafic. Testé avec un faux serveur sur Fa0/10 : avant, des postes recevaient une adresse pirate ; après, tous reçoivent une adresse du vrai serveur. Contrainte : le port du serveur doit être déclaré de confiance, sinon plus personne n’a d’adresse.</p>
        <p><strong>Sécurité des ports</strong> : un seul appareil autorisé par prise de poste. Testé en remplaçant un PC : le port s’est désactivé. Contrainte : chaque remplacement de PC demande une intervention du service informatique.</p>
        <p><strong>Prises inutilisées désactivées</strong> : rien ne peut s’y connecter. Contrainte : une nouvelle prise doit être activée sur demande (ticket).</p>
        <p><strong>Wi-Fi WPA2 Entreprise</strong> : chaque membre se connecte avec son compte personnel ; un départ se gère en désactivant le compte. Testé avec un bon compte, un mauvais mot de passe et un compte supprimé.</p>
        <p><strong>À prévoir</strong> : relier le serveur RADIUS à l’annuaire du domaine (NPS), passer à WPA3 si les appareils le permettent, activer l’inspection ARP dynamique, centraliser les journaux du commutateur (chapitre 5), et 802.1X sur les prises filaires.</p>
      </div>
    </div>
  </div>
</details>

<h2>Défi : aller plus loin</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>VLAN de la ligue, inspection ARP et matériel réel</summary>
  <div class="task-body">
    <ul>
      <li>Placer les postes de la ligue dans le VLAN <code>106</code> (plan du chapitre 4) et activer la surveillance DHCP pour ce VLAN.</li>
      <li>Si votre version de Packet Tracer le permet : <code>ip arp inspection vlan 106</code>, port du serveur en <code>ip arp inspection trust</code>, puis vérifier avec <code>show ip arp inspection</code>.</li>
      <li>Ajouter <code>spanning-tree portfast</code> et <code>spanning-tree bpduguard enable</code> sur les ports des postes, et tester en branchant un second commutateur sur Fa0/3.</li>
      <li>Refaire la mission 3 sur un commutateur Cisco de la baie, et configurer la réactivation automatique : <code>errdisable recovery cause psecure-violation</code>, <code>errdisable recovery interval 300</code>.</li>
    </ul>
    <div class="answer" data-id="t16-defi" data-label="Défi : résultats et limites" data-min="150" data-rows="6">
      <p>Noter les commandes acceptées ou refusées par votre version de Packet Tracer et par le matériel réel, et les résultats des tests. Quel est l’intérêt et le risque de la réactivation automatique d’un port après 5 minutes ?</p>
      <div class="corr">
        <p>Les résultats dépendent de la version de Packet Tracer et de l’IOS du matériel. Réactivation automatique : intérêt, pas d’intervention pour une erreur ponctuelle (un utilisateur qui branche son ordinateur personnel, puis le retire) ; risque, un attaquant qui reste branché provoque une désactivation toutes les 5 minutes, et l’incident peut passer inaperçu si les journaux du commutateur ne sont ni centralisés ni lus. On l’accompagne donc toujours d’une remontée des alertes (syslog vers un serveur central, chapitre 5).</p>
      </div>
    </div>
  </div>
</details>

<div class="aside next">
  <p class="aside-title">La suite</p>
  <p>Le réseau d’accès est protégé ; reste à protéger ce qui y circule. La <a href="#p4">partie 4</a> explique comment le chiffrement et les certificats protègent les échanges, par exemple la connexion à un site web.</p>
</div>
</template>

<template data-page="p4">
<h1>Chiffrement, certificats et HTTPS</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : chapitre 3 (TCP, HTTP, Wireshark), partie 2 (hachage). Wireshark installé sur le poste. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Cryptographie</div><ul>
  <li><span><b>Symétrique</b> : une clé secrète partagée (AES)</span></li>
  <li><span><b>Asymétrique</b> : clé publique et clé privée</span></li>
  <li><span><b>Signature</b> : prouver l’auteur et l’intégrité</span></li>
  <li><span><b>Certificats</b> : relier une clé publique à une identité</span></li>
  <li><span><b>TLS et HTTPS</b> : protéger les échanges web</span></li>
</ul></div></figure>

<p class="lead">Au chapitre 3, Wireshark montrait le contenu complet d’une page web échangée en HTTP. Tout ce qui circule en clair sur un réseau peut être lu par quiconque se trouve sur le chemin : un attaquant branché sur le même réseau (partie 3), un Wi-Fi public, un équipement compromis. Le <strong>chiffrement</strong> rend les données illisibles pour tous, sauf pour les destinataires qui possèdent la bonne clé.</p>

<h2>Le vocabulaire</h2>
<dl class="def">
  <dt>Chiffrer, déchiffrer</dt><dd>Transformer un message clair en message chiffré à l’aide d’une <strong>clé</strong>, et inversement. On dit « chiffrer » ; « crypter » est un anglicisme à éviter. <strong>Décrypter</strong>, c’est retrouver le message sans connaître la clé : c’est ce que fait un attaquant.</dd>
  <dt>Algorithme</dt><dd>Le procédé est public (AES, RSA…) ; seule la clé est secrète. Un algorithme dont la sécurité repose sur le secret du procédé n’est pas fiable (principe de Kerckhoffs, 1883).</dd>
  <dt>Encodage</dt><dd>Base64, l’encodage URL ou l’hexadécimal transforment la présentation des données, <strong>sans clé</strong> : n’importe qui les décode. Ce n’est pas du chiffrement.</dd>
</dl>

<h2>Le chiffrement symétrique</h2>
<p>La même <strong>clé secrète</strong> sert à chiffrer et à déchiffrer. L’algorithme de référence est <strong>AES</strong> (<em>Advanced Encryption Standard</em>, 2001), avec des clés de 128 ou 256 bits. Il est très rapide : les processeurs ont des instructions dédiées, et il chiffre les disques (BitLocker, LUKS), les archives et les communications.</p>
<p>Sa difficulté : <strong>partager la clé</strong>. Il faut la transmettre au destinataire par un canal sûr, et prévoir une clé différente pour chaque couple de personnes. Avec <em>n</em> personnes, il faut <em>n</em> × (<em>n</em> − 1) / 2 clés : 435 clés pour 30 personnes.</p>

<h2>Le chiffrement asymétrique</h2>
<p>Chaque personne (ou serveur) possède une <strong>paire de clés</strong> liées mathématiquement :</p>
<ul>
  <li>une <strong>clé publique</strong>, que l’on peut donner à tout le monde ;</li>
  <li>une <strong>clé privée</strong>, qui ne quitte jamais son propriétaire.</li>
</ul>
<p>Ce qui est chiffré avec l’une ne se déchiffre qu’avec l’autre, et l’on ne peut pas retrouver la clé privée à partir de la clé publique. Algorithmes : <strong>RSA</strong> (clés de 2 048 bits au moins, 3 072 recommandés) et les <strong>courbes elliptiques</strong> (ECDSA, Ed25519, X25519), plus courtes à sécurité égale. Ils sont beaucoup plus lents que AES.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Objectif</th><th>Léa chiffre ou signe avec…</th><th>Paul utilise…</th><th>Ce que l’on obtient</th></tr>
  <tr><td>Envoyer à Paul un message que lui seul peut lire</td><td>la clé <strong>publique de Paul</strong></td><td>sa clé <strong>privée</strong> pour déchiffrer</td><td>Confidentialité</td></tr>
  <tr><td>Signer un document</td><td>sa clé <strong>privée</strong> (elle chiffre un condensat du document : c’est la signature)</td><td>la clé <strong>publique de Léa</strong> pour vérifier</td><td>Authenticité, intégrité, non-répudiation</td></tr>
</table></div>
<p>Une <strong>signature</strong> se vérifie ainsi : Paul calcule lui-même le condensat du document reçu, déchiffre la signature avec la clé publique de Léa, et compare. Si le document a été modifié d’un seul caractère, ou si la signature n’a pas été faite avec la clé privée de Léa, les deux condensats diffèrent.</p>

<div class="match" data-id="m-cles" data-label="Quelle clé pour quelle opération ?" data-options="Clé publique de Paul|Clé privée de Paul|Clé publique de Léa|Clé privée de Léa|Clé secrète partagée">
  <div class="r" data-ok="Clé publique de Paul" data-expl="On chiffre avec la clé publique du destinataire : seul le détenteur de la clé privée correspondante pourra déchiffrer.">Léa chiffre un fichier que seul Paul doit pouvoir lire.</div>
  <div class="r" data-ok="Clé privée de Paul" data-expl="La clé privée du destinataire déchiffre ce qui a été chiffré avec sa clé publique.">Paul déchiffre le fichier reçu de Léa.</div>
  <div class="r" data-ok="Clé privée de Léa" data-expl="Signer, c’est utiliser sa propre clé privée, que personne d’autre ne possède.">Léa signe le procès-verbal de l’assemblée générale.</div>
  <div class="r" data-ok="Clé publique de Léa" data-expl="Tout le monde peut vérifier une signature avec la clé publique de son auteur.">Paul vérifie que le procès-verbal vient bien de Léa et n’a pas été modifié.</div>
  <div class="r" data-ok="Clé secrète partagée" data-expl="Après la négociation, TLS chiffre les données avec un algorithme symétrique (AES ou ChaCha20), bien plus rapide.">Le navigateur et le serveur chiffrent les pages échangées après la poignée de main TLS.</div>
</div>

<h3>Le chiffrement hybride</h3>
<p>En pratique, on combine les deux : l’asymétrique sert à <strong>s’authentifier</strong> et à <strong>se mettre d’accord sur une clé secrète</strong> (échange de clés Diffie-Hellman, ici sur courbes elliptiques : ECDHE), puis le symétrique chiffre les données. C’est le principe de TLS, de SSH et des VPN. Comme une nouvelle clé de session est créée à chaque connexion puis oubliée, un attaquant qui volerait plus tard la clé privée du serveur ne pourrait pas déchiffrer les échanges enregistrés auparavant (<strong>confidentialité persistante</strong>, <em>forward secrecy</em>).</p>

<h2>Les certificats : à qui appartient cette clé publique ?</h2>
<p>Si un attaquant donne sa propre clé publique en prétendant être <code>intranet.m2l.lan</code>, le navigateur chiffrera pour l’attaquant. Il faut donc un moyen de relier une clé publique à une identité : le <strong>certificat</strong> (norme X.509), signé par une <strong>autorité de certification</strong> (AC) à laquelle on fait confiance.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Champ du certificat</th><th>Exemple</th></tr>
  <tr><td>Sujet et noms alternatifs (SAN)</td><td><code>intranet.m2l.lan</code>, <code>www.m2l.lan</code> : les noms pour lesquels le certificat est valable</td></tr>
  <tr><td>Clé publique</td><td>la clé publique du serveur (RSA ou courbe elliptique)</td></tr>
  <tr><td>Émetteur</td><td>l’autorité qui a signé le certificat</td></tr>
  <tr><td>Validité</td><td>dates de début et de fin</td></tr>
  <tr><td>Signature</td><td>la signature de l’autorité, faite avec sa clé privée</td></tr>
</table></div>
<p>Le navigateur vérifie une <strong>chaîne de confiance</strong> : le certificat du serveur est signé par une AC intermédiaire, elle-même signée par une <strong>AC racine</strong> dont le certificat est préinstallé dans le système ou le navigateur. Il vérifie aussi que le nom demandé figure dans le certificat, que celui-ci n’est pas expiré ni révoqué. Si une vérification échoue, il affiche un avertissement (« La connexion n’est pas sécurisée ») : apprendre aux utilisateurs à ne <strong>jamais</strong> l’ignorer sur un site inconnu.</p>
<ul>
  <li><strong>Site public</strong> : certificat délivré par une AC publique. <strong>Let’s Encrypt</strong> en délivre gratuitement et automatiquement (protocole ACME, outil <code>certbot</code>), pour 90 jours. Les durées de validité maximales des certificats publics sont progressivement réduites (200 jours depuis mars 2026, 47 jours prévus en 2029) : le renouvellement doit être automatisé.</li>
  <li><strong>Réseau interne</strong> (<code>m2l.lan</code> n’est pas un domaine public) : une <strong>AC interne</strong>, par exemple le rôle Services de certificats Active Directory de Windows Server, dont le certificat racine est distribué aux postes du domaine par stratégie de groupe.</li>
  <li><strong>Certificat auto-signé</strong> : signé par sa propre clé. Il chiffre aussi bien, mais n’authentifie personne : le navigateur avertit. Acceptable pour une maquette (TP 17), pas pour un service utilisé par des personnes.</li>
</ul>

<h2>TLS et HTTPS</h2>
<p><strong>TLS</strong> (<em>Transport Layer Security</em>, successeur de SSL) s’insère entre TCP et l’application. <strong>HTTPS</strong>, c’est HTTP dans TLS, sur le port 443. Les mêmes principes protègent la messagerie (IMAPS, SMTP avec STARTTLS), LDAPS, etc. Seules les versions <strong>TLS 1.2 et TLS 1.3</strong> sont acceptables ; SSL 2 et 3, TLS 1.0 et 1.1 sont obsolètes et désactivés.</p>
<ol class="steps">
  <li><strong>Client Hello</strong> : le client propose les versions et les suites de chiffrement qu’il connaît, et indique en clair le nom du site demandé (SNI), car un même serveur peut héberger plusieurs sites.</li>
  <li><strong>Server Hello</strong> : le serveur choisit la version et la suite ; les deux calculent une clé de session par l’échange ECDHE. En TLS 1.3, tout ce qui suit est déjà chiffré, y compris le certificat du serveur.</li>
  <li>Le serveur prouve qu’il possède la clé privée correspondant à son certificat (signature) ; le client vérifie le certificat.</li>
  <li>Les données HTTP sont échangées, chiffrées en AES-GCM ou ChaCha20, avec un contrôle d’intégrité.</li>
</ol>

<div class="answer" data-id="a-tls" data-label="Analyser la poignée de main TLS" data-min="200" data-rows="9">
  <p>Dans la connexion HTTPS : a) trame 14 (Client Hello) : quel nom de site est visible, dans quelle extension ? Quelles suites de chiffrement le client propose-t-il ? b) trame 16 (Server Hello) : quelle version de TLS et quelle suite le serveur choisit-il (indice : extension <em>supported_versions</em>) ? c) Pourquoi ne voit-on pas le certificat du serveur dans la capture ? d) Que peut encore apprendre un observateur de cette connexion chiffrée ?</p>
  <div class="corr">
    <p>a) <code>intranet.m2l.lan</code>, dans l’extension <em>server_name</em> (SNI). Suites proposées : <code>TLS_AES_128_GCM_SHA256</code> (0x1301), <code>TLS_AES_256_GCM_SHA384</code> (0x1302), <code>TLS_CHACHA20_POLY1305_SHA256</code> (0x1303), les trois suites de TLS 1.3.</p>
    <p>b) Le champ « version » de l’en-tête indique TLS 1.2 (0x0303) pour rester compatible avec les anciens équipements, mais l’extension <em>supported_versions</em> vaut 0x0304 : <strong>TLS 1.3</strong>. Suite choisie : <code>TLS_AES_128_GCM_SHA256</code>. L’extension <em>key_share</em> contient la part X25519 de l’échange de clés ECDHE.</p>
    <p>c) En TLS 1.3, le certificat est envoyé <strong>après</strong> l’accord sur les clés, donc chiffré : il fait partie de l’« Application Data » de la trame 16. En TLS 1.2, il passait en clair.</p>
    <p>d) Les adresses IP et les ports, le nom du site (SNI, en clair), les dates et heures, la durée et la taille des échanges. Pas le contenu : ni l’adresse de la page, ni le mot de passe, ni le cookie. HTTPS protège le contenu, pas le fait que la communication a eu lieu.</p>
  </div>
</div>

<div class="aside deep">
  <p class="aside-title">En profondeur : ce que le cadenas ne garantit pas</p>
  <p>Le cadenas du navigateur garantit qu’on parle bien au serveur dont le nom figure dans la barre d’adresse, et que personne ne lit ni ne modifie l’échange. Il ne garantit pas que le site est honnête : la grande majorité des sites d’hameçonnage ont un certificat valide (gratuit avec Let’s Encrypt) pour <code>verif-compte.xyz</code>. Il ne protège pas non plus un poste infecté, qui voit les données avant leur chiffrement. Enfin, l’en-tête <strong>HSTS</strong> (<code>Strict-Transport-Security</code>) demande au navigateur de n’utiliser que HTTPS pour un site, ce qui empêche un attaquant de forcer une première connexion en HTTP.</p>
</div>

<h2>SSH : la même logique</h2>
<p>SSH (chapitre 4) utilise aussi un échange de clés puis un chiffrement symétrique. À la première connexion, il affiche l’<strong>empreinte</strong> de la clé du serveur (« The authenticity of host … can’t be established ») : on doit la comparer à l’empreinte connue, transmise par un autre canal. Elle est ensuite enregistrée dans <code>~/.ssh/known_hosts</code> ; si elle change, SSH refuse de se connecter et signale une possible attaque de l’homme du milieu. L’utilisateur peut lui aussi s’authentifier par une paire de clés (<code>ssh-keygen</code>) au lieu d’un mot de passe : la clé publique est déposée sur le serveur, la clé privée reste sur le poste, protégée par une phrase de passe. C’est ce que vous configurerez au TP 17.</p>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p4" data-title="Chiffrement et HTTPS" data-label="Quiz de fin de partie">
  <div class="q" data-ok="2">
    <p class="qt">Un mot de passe est transmis en Base64 dans une requête HTTP. Est-il protégé ?</p>
    <ul><li>Oui, Base64 est un chiffrement</li><li>Non, Base64 est un encodage que tout le monde peut décoder sans clé</li><li>Oui, si le mot de passe est long</li><li>Oui, car il n’est plus lisible directement</li></ul>
    <div class="expl">Un encodage n’utilise aucune clé. C’est par exemple le cas de l’authentification HTTP « Basic », qui n’est acceptable que dans une connexion HTTPS.</div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Pour signer un document, Léa utilise…</p>
    <ul><li>la clé publique du destinataire</li><li>sa clé publique</li><li>une clé secrète partagée</li><li>sa clé privée</li></ul>
    <div class="expl">Seule Léa possède sa clé privée : une signature faite avec elle prouve que Léa en est l’auteur. Tout le monde la vérifie avec sa clé publique.</div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Pourquoi TLS utilise-t-il un chiffrement symétrique pour les données, après la poignée de main ?</p>
    <ul><li>Parce qu’il est beaucoup plus rapide que l’asymétrique</li><li>Parce que l’asymétrique est cassé</li><li>Parce qu’il ne demande aucune clé</li><li>Parce que les navigateurs ne savent pas faire d’asymétrique</li></ul>
    <div class="expl">L’asymétrique sert à authentifier et à s’accorder sur une clé de session ; le symétrique (AES, ChaCha20) chiffre ensuite les données, rapidement.</div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Le navigateur affiche « La connexion n’est pas sécurisée » pour un site que l’on visite pour la première fois. Que faut-il faire ?</p>
    <ul><li>Cliquer sur « Accepter le risque » pour continuer</li><li>Vider le cache du navigateur</li><li>Ne pas continuer, et vérifier l’adresse ou signaler le problème</li><li>Désactiver l’antivirus</li></ul>
    <div class="expl">L’avertissement signale un certificat non valable pour ce nom, expiré ou non signé par une autorité reconnue : ce peut être une attaque de l’homme du milieu.</div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Que voit un observateur d’une connexion HTTPS vers <code>intranet.m2l.lan</code> ?</p>
    <ul><li>Le mot de passe saisi</li><li>Le contenu de la page</li><li>Les adresses IP, les ports et le nom du site (SNI)</li><li>Rien du tout</li></ul>
    <div class="expl">Le contenu est chiffré, mais les en-têtes IP et TCP restent en clair, et le nom du site figure dans le Client Hello.</div>
  </div>
</div>

<div class="aside next">
  <p class="aside-title">La suite</p>

</div>

<h1>Durcir et auditer le serveur web</h1>
<p class="lead">Le serveur web de la M2L (SRV-DEB, dans la DMZ) est exposé : il est le premier visé. Votre mission : mesurer son niveau de sécurité, le <strong>durcir</strong> (réduire sa surface d’attaque et corriger ses faiblesses), puis mesurer de nouveau et rendre un rapport « avant / après » au responsable.</p>

<div class="aside caution">
  <p class="aside-title">Consignes</p>
  <ul>
    <li>Machines : <strong>SRV-DEB</strong> (Debian 12, Apache du chapitre 3, dans la DMZ du TP 12 ou sur <code>tp5</code>), <strong>PC-CLIENT</strong> (Windows) et SRV-WIN (DNS : <code>intranet.m2l.lan</code> est un alias de <code>srv-deb.m2l.lan</code>). <strong>Instantané <code>avant-TP17</code> de SRV-DEB obligatoire.</strong></li>
    <li>SRV-DEB a besoin d’un accès aux dépôts Debian (<code>apt</code>) : par pfSense, ou par une seconde carte en NAT si votre salle le prévoit.</li>
    <li>Règle d’or de l’administration à distance : <strong>garder une session SSH ouverte</strong> pendant que l’on modifie la configuration de SSH ou du pare-feu, et tester avec une seconde session avant de fermer la première. Sinon, en cas d’erreur, on s’enferme dehors.</li>
    <li>Les outils d’audit (<code>nmap</code>, <code>lynis</code>) ne sont utilisés que sur SRV-DEB. Travail <strong>sans IA</strong>.</li>
  </ul>
</div>

<h2>Mission 1 : l’audit initial</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Mesurer avant de modifier</summary>
  <div class="task-body">
    <pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> sudo ss -tulnp                                   <span class="cm"># services en écoute, avec leur programme</span>
<span class="pr">etudiant@srv-deb:~$</span> systemctl list-units --type=service --state=running
<span class="pr">etudiant@srv-deb:~$</span> sudo apt update ; apt list --upgradable
<span class="pr">etudiant@srv-deb:~$</span> sudo sshd -T | grep -Ei '^(permitrootlogin|passwordauthentication|maxauthtries)'
<span class="pr">etudiant@srv-deb:~$</span> curl -sI http://localhost/ | grep -i '^server'
<span class="pr">etudiant@srv-deb:~$</span> sudo apt install lynis nmap
<span class="pr">etudiant@srv-deb:~$</span> nmap -sV localhost
<span class="pr">etudiant@srv-deb:~$</span> sudo lynis audit system | tee ~/lynis-avant.txt</pre>
    <p>Depuis PC-CLIENT, en PowerShell, tester les ports vus depuis le réseau (le pare-feu pfSense filtre peut-être certains d’entre eux) :</p>
    <pre class="code terminal"><span class="pr">PS C:\&gt;</span> 22, 80, 443, 3306 | ForEach-Object { "$_ : " + (Test-NetConnection intranet.m2l.lan -Port $_ -InformationLevel Quiet) }</pre>
    <div class="answer" data-id="t17-audit1" data-label="Mission 1 : état initial du serveur" data-min="250" data-rows="10">
      <p>Relever : a) les ports en écoute et le programme de chacun, en distinguant ceux qui écoutent sur toutes les adresses (<code>0.0.0.0</code>, <code>*</code>) et ceux qui n’écoutent que localement (<code>127.0.0.1</code>) ; b) le nombre de paquets à mettre à jour ; c) les valeurs de <code>permitrootlogin</code>, <code>passwordauthentication</code> et <code>maxauthtries</code> ; d) ce que révèle l’en-tête <code>Server</code> ; e) l’indice de durcissement de Lynis (<em>Hardening index</em>) et trois de ses avertissements ou suggestions. Pour chaque point, dire s’il représente une vulnérabilité et pourquoi.</p>
      <div class="corr">
        <p>Les valeurs exactes dépendent de chaque machine. Attendus :</p>
        <p>a) En général : SSH (22, <code>sshd</code>) et HTTP (80, <code>apache2</code>) sur toutes les adresses ; parfois un serveur de base de données (3306, <code>mariadbd</code>) installé pour un TP SLAM, qui doit n’écouter que sur <code>127.0.0.1</code> s’il ne sert qu’au site local. Tout service qui écoute sur le réseau sans raison est une surface d’attaque inutile.</p>
        <p>b) Chaque paquet en attente peut corriger une faille publiée : un serveur exposé doit être à jour.</p>
        <p>c) Sous Debian 12 par défaut : <code>permitrootlogin without-password</code> (connexion de root seulement par clé ; c’est le nom interne de <code>prohibit-password</code>), <code>passwordauthentication yes</code>, <code>maxauthtries 6</code>. L’authentification par mot de passe expose le serveur aux attaques par essais (partie 2 ; journal du chapitre 5).</p>
        <p>d) <code>Server: Apache/2.4.62 (Debian)</code> : la version exacte aide un attaquant à chercher les failles correspondantes. La masquer ne corrige rien, mais réduit les informations données gratuitement.</p>
        <p>e) Indice souvent compris entre 55 et 65 sur une installation neuve. Suggestions courantes : installer fail2ban, durcir SSH (<code>SSH-7408</code>), mettre en place un pare-feu local, des mises à jour automatiques, un mot de passe pour GRUB, séparer certaines partitions. Lynis donne des pistes, pas des ordres : chaque suggestion se juge selon le contexte.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 2 : mises à jour et réduction de la surface d’attaque</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Corriger les failles connues, retirer l’inutile</summary>
  <div class="task-body">
    <pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> sudo apt full-upgrade
<span class="pr">etudiant@srv-deb:~$</span> sudo apt install unattended-upgrades apt-listchanges
<span class="pr">etudiant@srv-deb:~$</span> sudo dpkg-reconfigure -plow unattended-upgrades          <span class="cm"># répondre Oui</span>
<span class="pr">etudiant@srv-deb:~$</span> cat /etc/apt/apt.conf.d/20auto-upgrades
<span class="pr">etudiant@srv-deb:~$</span> sudo unattended-upgrade --dry-run --debug | tail -n 5
<span class="cm"># Masquer la version d’Apache</span>
<span class="pr">etudiant@srv-deb:~$</span> sudo nano /etc/apache2/conf-available/security.conf      <span class="cm"># ServerTokens Prod  et  ServerSignature Off</span>
<span class="pr">etudiant@srv-deb:~$</span> sudo apache2ctl configtest &amp;&amp; sudo systemctl reload apache2</pre>
    <p>Si un service inutile écoute sur le réseau (par exemple MariaDB alors que le site n’en a pas besoin), l’arrêter et le désactiver (<code>sudo systemctl disable --now mariadb</code>), ou le limiter à l’écoute locale (<code>bind-address = 127.0.0.1</code>).</p>
    <div class="answer" data-id="t17-maj" data-label="Mission 2 : mises à jour et surface d’attaque" data-min="150" data-rows="7">
      <p>a) Que contient le fichier <code>20auto-upgrades</code>, et quelles mises à jour <code>unattended-upgrades</code> installe-t-il par défaut sous Debian ? b) Quels sont les risques des mises à jour automatiques sur un serveur, et comment les limiter ? c) Quel en-tête <code>Server</code> obtenez-vous maintenant ?</p>
      <div class="corr">
        <p>a) <code>APT::Periodic::Update-Package-Lists "1";</code> et <code>APT::Periodic::Unattended-Upgrade "1";</code> : mise à jour de la liste des paquets et installation automatique chaque jour. Par défaut, seules les mises à jour de l’origine <strong>Debian-Security</strong> (et celles de la version stable en cours) sont installées, ce qui limite les changements aux correctifs.</p>
        <p>b) Une mise à jour peut casser un service ou nécessiter un redémarrage (noyau) ; elle peut s’installer au mauvais moment. Parades : ne prendre automatiquement que les correctifs de sécurité, recevoir un rapport par courriel (<code>apt-listchanges</code>, <code>Unattended-Upgrade::Mail</code>), surveiller le service après la mise à jour (chapitre 5), tester d’abord sur une maquette pour les mises à jour majeures, garder des sauvegardes. Ne pas mettre à jour est un risque bien plus grand pour un serveur exposé.</p>
        <p>c) <code>Server: Apache</code>, sans version ni système.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 3 : SSH par clés</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Plus de mots de passe pour administrer le serveur</summary>
  <div class="task-body">
    <p>Sur <strong>PC-CLIENT</strong> (le client OpenSSH est intégré à Windows 10 et 11), en PowerShell :</p>
    <pre class="code terminal"><span class="pr">PS C:\Users\paul.garnier&gt;</span> ssh-keygen -t ed25519 -C "paul.garnier@PC-CLIENT"
<span class="cm"># Accepter l’emplacement proposé et choisir une phrase de passe</span>
<span class="pr">PS C:\Users\paul.garnier&gt;</span> type $env:USERPROFILE\.ssh\id_ed25519.pub | ssh etudiant@intranet.m2l.lan "mkdir -p ~/.ssh &amp;&amp; chmod 700 ~/.ssh &amp;&amp; cat &gt;&gt; ~/.ssh/authorized_keys &amp;&amp; chmod 600 ~/.ssh/authorized_keys"
<span class="pr">PS C:\Users\paul.garnier&gt;</span> ssh etudiant@intranet.m2l.lan</pre>
    <p>La dernière connexion doit demander la <strong>phrase de passe de la clé</strong>, et non le mot de passe du compte. Puis, <strong>dans cette session ouverte</strong>, sur SRV-DEB :</p>
    <pre class="code"><span class="cm"># /etc/ssh/sshd_config.d/durcissement.conf</span>
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
MaxAuthTries 3
AllowUsers etudiant</pre>
    <pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> sudo sshd -t &amp;&amp; echo "configuration valide"
<span class="pr">etudiant@srv-deb:~$</span> sudo systemctl reload ssh</pre>
    <p>Sans fermer la première session, en ouvrir une seconde depuis PC-CLIENT pour vérifier. Puis tenter une connexion depuis SRV-WIN (qui n’a pas la clé) : <code>ssh etudiant@intranet.m2l.lan</code>.</p>
    <div class="answer" data-id="t17-ssh" data-label="Mission 3 : authentification SSH par clés" data-min="200" data-rows="8">
      <p>a) Quels fichiers <code>ssh-keygen</code> a-t-il créés sur PC-CLIENT ? Lequel ne doit jamais quitter le poste ? b) Quel message obtient-on depuis SRV-WIN ? c) Pourquoi la phrase de passe de la clé est-elle importante ? d) Pourquoi tester avec <code>sshd -t</code> et garder une session ouverte ?</p>
      <div class="corr">
        <p>a) <code>id_ed25519</code> (clé <strong>privée</strong>, à ne jamais copier ni envoyer) et <code>id_ed25519.pub</code> (clé publique, déposée dans <code>~/.ssh/authorized_keys</code> sur le serveur).</p>
        <p>b) <code>etudiant@intranet.m2l.lan: Permission denied (publickey).</code> : le serveur n’accepte plus que les clés, et SRV-WIN n’en a pas d’autorisée. Une attaque par essais de mots de passe devient inutile.</p>
        <p>c) Si le poste est volé ou compromis, la clé privée est chiffrée par la phrase de passe : le voleur ne peut pas l’utiliser directement. L’agent SSH (<code>ssh-agent</code>) évite de la retaper à chaque connexion.</p>
        <p>d) <code>sshd -t</code> détecte une erreur de syntaxe avant le rechargement : un service SSH qui ne redémarre pas, sur un serveur distant, c’est un serveur qu’on ne peut plus administrer qu’avec une console (ou un déplacement). La session ouverte reste active même si la nouvelle configuration empêche les nouvelles connexions : elle permet de corriger. Dans la vraie vie, on a aussi un accès de secours (console de l’hyperviseur, accès hors bande, chapitre 4).</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 4 : passer le site en HTTPS</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Certificat, configuration TLS et redirection</summary>
  <div class="task-body">
    <p>L’intranet n’est pas un domaine public : Let’s Encrypt ne peut pas lui délivrer de certificat. On crée un certificat <strong>auto-signé</strong> pour la maquette (le défi le remplace par un certificat de l’autorité interne).</p>
    <pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> sudo openssl req -x509 -newkey rsa:3072 -sha256 -days 365 -nodes -keyout /etc/ssl/private/intranet.key -out /etc/ssl/certs/intranet.crt -subj "/CN=intranet.m2l.lan" -addext "subjectAltName=DNS:intranet.m2l.lan,DNS:www.m2l.lan"
<span class="pr">etudiant@srv-deb:~$</span> sudo chmod 600 /etc/ssl/private/intranet.key
<span class="pr">etudiant@srv-deb:~$</span> openssl x509 -in /etc/ssl/certs/intranet.crt -noout -subject -issuer -dates -ext subjectAltName
<span class="pr">etudiant@srv-deb:~$</span> sudo a2enmod ssl headers</pre>
    <pre class="code"><span class="cm"># /etc/apache2/sites-available/intranet-ssl.conf</span>
&lt;VirtualHost *:443&gt;
    ServerName intranet.m2l.lan
    ServerAlias www.m2l.lan
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/intranet.crt
    SSLCertificateKeyFile /etc/ssl/private/intranet.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    Header always set X-Content-Type-Options "nosniff"
    <span class="cm"># Avec un vrai certificat seulement : HSTS</span>
    <span class="cm"># Header always set Strict-Transport-Security "max-age=31536000"</span>
&lt;/VirtualHost&gt;</pre>
    <p>Dans <code>/etc/apache2/sites-available/000-default.conf</code> (le site HTTP), ajouter dans le bloc <code>&lt;VirtualHost *:80&gt;</code> la ligne <code>Redirect permanent / https://intranet.m2l.lan/</code>. Puis :</p>
    <pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> sudo a2ensite intranet-ssl
<span class="pr">etudiant@srv-deb:~$</span> sudo apache2ctl configtest &amp;&amp; sudo systemctl reload apache2
<span class="pr">etudiant@srv-deb:~$</span> curl -sI http://localhost/ | head -n 3
<span class="pr">etudiant@srv-deb:~$</span> curl -skI https://localhost/ | head -n 1
<span class="pr">etudiant@srv-deb:~$</span> openssl s_client -connect localhost:443 -servername intranet.m2l.lan -tls1_1 &lt; /dev/null
<span class="pr">etudiant@srv-deb:~$</span> openssl s_client -connect localhost:443 -servername intranet.m2l.lan &lt; /dev/null 2&gt;/dev/null | grep -E 'Protocol|Cipher'</pre>
    <p>Si SRV-DEB est dans la DMZ, vérifier que la règle pfSense du TP 12 autorise le port 443 (alias <code>PORTS_WEB</code>). Ouvrir <code>http://intranet.m2l.lan</code> dans le navigateur de PC-CLIENT.</p>
    <div class="answer" data-id="t17-https" data-label="Mission 4 : HTTPS" data-min="250" data-rows="10">
      <p>a) Que répond le serveur en HTTP ? b) Que donne la tentative en TLS 1.1, puis la connexion normale (protocole et suite) ? c) Que se passe-t-il dans le navigateur, et pourquoi ? Que montre le détail du certificat ? d) Pourquoi l’en-tête HSTS est-il en commentaire ? e) Pourquoi le fichier de clé privée est-il en mode <code>600</code> dans <code>/etc/ssl/private</code> ?</p>
      <div class="corr">
        <p>a) <code>HTTP/1.1 301 Moved Permanently</code> avec <code>Location: https://intranet.m2l.lan/</code> : le navigateur est renvoyé vers HTTPS.</p>
        <p>b) TLS 1.1 : échec de la poignée de main (alerte <em>protocol version</em> ou « no protocols available » : le client OpenSSL de Debian 12 refuse lui-même TLS 1.1 par défaut, ce qui confirme qu’il est obsolète). Connexion normale : <code>Protocol: TLSv1.3</code>, suite <code>TLS_AES_256_GCM_SHA384</code> en général.</p>
        <p>c) Avertissement « Attention : risque probable de sécurité » (Firefox) ou « Votre connexion n’est pas privée » (Edge) : le certificat est signé par lui-même (émetteur = sujet), aucune autorité de confiance du poste ne l’a signé. Le détail montre le sujet et l’émetteur <code>CN=intranet.m2l.lan</code>, les noms alternatifs <code>intranet.m2l.lan</code> et <code>www.m2l.lan</code>, la validité d’un an, une clé RSA 3072 bits. La connexion est chiffrée, mais le poste ne peut pas savoir s’il parle au vrai serveur : on ne demande jamais à des utilisateurs d’accepter ce type d’avertissement.</p>
        <p>d) HSTS interdit au navigateur d’ignorer une erreur de certificat pour ce site pendant toute la durée indiquée (un an ici) : avec un certificat auto-signé, le site deviendrait inaccessible depuis ce navigateur. On ne l’active qu’avec un certificat reconnu (défi), et d’abord avec une durée courte.</p>
        <p>e) Quiconque obtient la clé privée peut se faire passer pour le serveur et, sans confidentialité persistante, déchiffrer des échanges. Seul root doit pouvoir la lire (Apache la lit au démarrage, avec les droits de root, avant de changer d’utilisateur).</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 5 : pare-feu local et fail2ban</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Défense en profondeur sur le serveur lui-même</summary>
  <div class="task-body">
    <pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> sudo apt install ufw fail2ban python3-systemd
<span class="pr">etudiant@srv-deb:~$</span> sudo ufw default deny incoming
<span class="pr">etudiant@srv-deb:~$</span> sudo ufw default allow outgoing
<span class="pr">etudiant@srv-deb:~$</span> sudo ufw allow 22/tcp
<span class="pr">etudiant@srv-deb:~$</span> sudo ufw allow 80,443/tcp
<span class="pr">etudiant@srv-deb:~$</span> sudo ufw enable
<span class="pr">etudiant@srv-deb:~$</span> sudo ufw status verbose</pre>
    <pre class="code"><span class="cm"># /etc/fail2ban/jail.local</span>
[sshd]
enabled  = true
backend  = systemd
maxretry = 5
findtime = 10m
bantime  = 15m</pre>
    <pre class="code terminal"><span class="pr">etudiant@srv-deb:~$</span> sudo systemctl restart fail2ban
<span class="pr">etudiant@srv-deb:~$</span> sudo fail2ban-client status sshd</pre>
    <p>Test : depuis SRV-WIN (qui n’a pas de clé), tenter 6 connexions SSH avec un utilisateur inexistant (<code>ssh test@intranet.m2l.lan</code>). Observer <code>fail2ban-client status sshd</code>, puis débloquer : <code>sudo fail2ban-client set sshd unbanip</code> suivi de l’adresse de SRV-WIN.</p>
    <div class="answer" data-id="t17-f2b" data-label="Mission 5 : pare-feu local et fail2ban" data-min="200" data-rows="8">
      <p>a) Pourquoi un pare-feu local sur SRV-DEB, alors que pfSense filtre déjà la DMZ ? b) Pourquoi faut-il autoriser le port 22 <strong>avant</strong> <code>ufw enable</code> ? c) Résultat du test fail2ban : que voit-on dans le statut, et que se passe-t-il pour SRV-WIN ? d) Pourquoi faut-il <code>backend = systemd</code> sous Debian 12 ?</p>
      <div class="corr">
        <p>a) Défense en profondeur : si une règle pfSense est trop large (erreur, modification), ou si une autre machine de la DMZ est compromise et attaque SRV-DEB de l’intérieur de la zone (sans passer par pfSense), le pare-feu local protège encore. Il garantit aussi qu’un service installé plus tard (base de données, outil de test) n’est pas exposé par accident.</p>
        <p>b) Avec la politique « tout refuser en entrée », activer le pare-feu sans règle SSH couperait la session d’administration en cours et toutes les suivantes. Même règle d’or qu’à la mission 3.</p>
        <p>c) <code>Currently failed</code> augmente à chaque tentative, puis, au 5<sup>e</sup> échec dans la fenêtre de 10 minutes, l’adresse de SRV-WIN apparaît dans <code>Banned IP list</code> et <code>Total banned</code> passe à 1. SRV-WIN ne peut plus du tout joindre le port SSH (délai d’attente dépassé) pendant 15 minutes. Les autres adresses ne sont pas touchées.</p>
        <p>d) Debian 12 n’installe plus <code>rsyslog</code> : le fichier <code>/var/log/auth.log</code>, que fail2ban surveille par défaut, n’existe pas, et le service refuse de démarrer. Avec <code>backend = systemd</code>, fail2ban lit directement le journal de systemd (<code>journalctl</code>, chapitre 5), ce qui demande le paquet <code>python3-systemd</code>.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 6 : l’audit final et le rapport</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Prouver l’amélioration</summary>
  <div class="task-body">
    <p>Refaire les mesures de la mission 1 (<code>ss -tulnp</code>, <code>sshd -T</code>, en-tête <code>Server</code>, <code>Test-NetConnection</code>), puis <code>sudo lynis audit system | tee ~/lynis-apres.txt</code>.</p>
    <div class="answer" data-id="t17-rapport" data-label="Mission 6 : rapport avant / après" data-min="300" data-rows="12">
      <p>Rédiger le rapport pour le responsable : un tableau avant / après (indice Lynis, ports exposés, authentification SSH, version affichée, chiffrement du site, mises à jour), la liste des mesures prises avec la menace traitée par chacune, les suggestions de Lynis que vous n’avez pas appliquées (avec la raison), et les risques qui restent.</p>
      <div class="corr">
        <p>Attendus : l’indice Lynis augmente nettement (souvent de 10 à 20 points) ; il n’atteint pas 100, et ce n’est pas le but. Tableau typique : ports 22 et 80 → 22, 80 (redirection) et 443 ; SSH par mot de passe et <code>root</code> par clé → clés uniquement, <code>root</code> interdit, 3 essais, un seul compte autorisé ; <code>Apache/2.4.62 (Debian)</code> → <code>Apache</code> ; HTTP en clair → HTTPS TLS 1.2 et 1.3 avec redirection ; mises à jour manuelles → correctifs de sécurité automatiques ; pas de pare-feu local → ufw ; pas de blocage des essais → fail2ban.</p>
        <p>Suggestions non appliquées, avec justification : mot de passe GRUB (accès physique déjà contrôlé : machine virtuelle), partitions séparées (réinstallation nécessaire), antivirus (peu pertinent sur ce serveur), etc. Une suggestion écartée doit être <strong>justifiée</strong>, pas ignorée.</p>
        <p>Risques restants : certificat auto-signé (à remplacer par un certificat de l’autorité interne), sécurité de l’application web elle-même (injections SQL, failles XSS : travail des développeurs SLAM), journaux non centralisés, pas de sauvegarde de la configuration, clé privée SSH du poste d’administration à protéger.</p>
      </div>
    </div>
  </div>
</details>

<h2>Défi : un certificat de l’autorité interne</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Plus d’avertissement sur les postes du domaine</summary>
  <div class="task-body">
    <div class="answer" data-id="t17-defi" data-label="Défi : certificat signé par l’AC interne" data-min="200" data-rows="8">
      <p>Sur SRV-WIN, installer le rôle <strong>Services de certificats Active Directory</strong> (autorité de certification d’entreprise racine, <code>M2L-CA</code>). Sur SRV-DEB, créer une demande de certificat (<code>openssl req -new</code> avec les mêmes noms), la faire signer par l’AC avec le modèle <em>Serveur Web</em> (<code>certreq -submit -attrib "CertificateTemplate:WebServer"</code>), installer le certificat obtenu dans Apache, puis ouvrir le site depuis PC-CLIENT. Décrire les étapes, le résultat, et expliquer pourquoi les postes du domaine font confiance à ce certificat. Peut-on alors activer HSTS ?</p>
      <div class="corr">
        <p>Étapes : <code>Install-WindowsFeature ADCS-Cert-Authority -IncludeManagementTools</code>, puis <code>Install-AdcsCertificationAuthority -CAType EnterpriseRootCA -CACommonName "M2L-CA"</code> ; sur SRV-DEB, <code>openssl req -new -newkey rsa:3072 -nodes -keyout intranet.key -out intranet.csr -subj "/CN=intranet.m2l.lan" -addext "subjectAltName=DNS:intranet.m2l.lan,DNS:www.m2l.lan"</code> ; copier la demande sur SRV-WIN, <code>certreq -submit -attrib "CertificateTemplate:WebServer" intranet.csr intranet.cer</code> ; copier le certificat sur SRV-DEB, l’indiquer dans <code>SSLCertificateFile</code> (avec la nouvelle clé), recharger Apache.</p>
        <p>Résultat : plus d’avertissement sur PC-CLIENT, cadenas normal. Une AC d’entreprise publie automatiquement son certificat racine dans l’annuaire, et les postes du domaine l’ajoutent à leurs autorités racines de confiance (par stratégie de groupe) : la chaîne de confiance est complète. Un poste hors domaine (un portable personnel) affiche toujours l’avertissement. HSTS peut alors être activé, d’abord avec une durée courte (<code>max-age=300</code>), car tous les clients concernés font confiance à l’AC.</p>
      </div>
    </div>
  </div>
</details>

<div class="aside next">
  <p class="aside-title">La suite</p>
  <p>Un serveur durci aujourd’hui sera vulnérable demain : de nouvelles failles sont publiées chaque jour. La <a href="#p5">partie 5</a> présente la veille sur les vulnérabilités et la conduite à tenir le jour où une attaque réussit.</p>
</div>
