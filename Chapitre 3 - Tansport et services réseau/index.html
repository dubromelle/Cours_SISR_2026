/* Normalisation des bases de données — BTS SIO

:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #eef1f8;
  --fg: #161d2e;
  --muted: #556079;
  --line: #d8ddeb;
  --accent: #2c48c9;
  --accent-soft: #e5e9fb;
  --key: #a8550a;          /* clés primaires / étrangères */
  --key-soft: #fbefe2;
  --ok: #17803d;
  --ok-soft: #e3f4e8;
  --mid: #9a6200;
  --mid-soft: #fbf1d9;
  --ko: #c53030;
  --ko-soft: #fbe6e6;
  --shadow: 0 1px 2px rgba(22, 29, 46, .06), 0 4px 16px rgba(22, 29, 46, .05);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --top: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1420; --surface: #161d2c; --surface-2: #1d2639; --fg: #e5e9f3; --muted: #9ba6bf;
    --line: #2c3651; --accent: #93a6ff; --accent-soft: #1f2a4d; --key: #f2b469; --key-soft: #33261a;
    --ok: #5ad48a; --ok-soft: #15301f; --mid: #f3c35a; --mid-soft: #33290f; --ko: #ff8a8a; --ko-soft: #3a1b1d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1420; --surface: #161d2c; --surface-2: #1d2639; --fg: #e5e9f3; --muted: #9ba6bf;
  --line: #2c3651; --accent: #93a6ff; --accent-soft: #1f2a4d; --key: #f2b469; --key-soft: #33261a;
  --ok: #5ad48a; --ok-soft: #15301f; --mid: #f3c35a; --mid-soft: #33290f; --ko: #ff8a8a; --ko-soft: #3a1b1d;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(var(--top) + 16px); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 17px/1.65 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code, kbd { font-family: var(--f-mono); font-size: .86em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: .05em .35em; }
button { font: inherit; color: inherit; }
img { max-width: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- barre du haut ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--top);
  display: flex; align-items: center; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: .5ch; text-decoration: none; color: var(--fg); font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; white-space: nowrap; }
.brand span { color: var(--accent); }
.brand small { font: 600 .72rem var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.topbar .spacer { flex: 1; }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.who { font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
.theme-sel { font: inherit; font-size: .85rem; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }

.save-btn { white-space: nowrap; }
.save-btn.dirty { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.save-btn.dirty::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--key-soft); margin-right: 6px; vertical-align: 1px; }
.save-btn.dirty:hover:not(:disabled) { color: var(--surface); filter: brightness(1.08); }
.notices { max-width: calc(46rem + 15rem + 48px); margin: 0 auto 20px; display: grid; gap: 10px; }
.notice { border-radius: 12px; padding: 12px 16px; border: 1px solid var(--line); font-size: .93rem; }
.notice p { margin: 0 0 6px; }
.notice p:last-child { margin-bottom: 0; }
.notice.warn { background: var(--mid-soft); border-color: var(--mid); }
.notice.ko { background: var(--ko-soft); border-color: var(--ko); }

/* ---------- grille ---------- */
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - var(--top)); }
.sidebar {
  position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px)); align-self: start;
  height: calc(100vh - var(--top)); overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--surface);
  padding: 20px 14px 40px max(16px, env(safe-area-inset-left, 0px));
}
.nav-group { margin: 0 0 18px; }
.nav-group > p { margin: 0 0 6px 10px; font: 600 .72rem var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.nav-group ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav-link { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--fg); font-size: .93rem; line-height: 1.3; }
.nav-link:hover { background: var(--surface-2); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav-link .n { display: block; font: 600 .7rem var(--f-mono); color: var(--muted); letter-spacing: .03em; }
.nav-link[aria-current="page"] .n { color: var(--accent); }
.pill { font: 600 .68rem var(--f-mono); padding: 2px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill:empty { display: none; }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.go { background: var(--accent-soft); color: var(--accent); }

.main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
.page-grid { display: grid; grid-template-columns: minmax(0, 46rem) 15rem; gap: 48px; justify-content: center; }
.toc { position: sticky; top: calc(var(--top) + 24px); align-self: start; max-height: calc(100vh - var(--top) - 48px); overflow-y: auto; font-size: .85rem; }
.toc p { margin: 0 0 8px; font: 700 1rem var(--f-display); }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.toc a { display: block; color: var(--muted); text-decoration: none; line-height: 1.35; padding: 2px 0; }
.toc a.h3 { padding-left: 14px; }
.toc a:hover, .toc a.on { color: var(--accent); }
.toc a.on { font-weight: 700; }

/* ---------- contenu ---------- */
article { min-width: 0; counter-reset: h2; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 0 0 10px; font: 600 .78rem var(--f-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.eyebrow .kind { color: var(--accent); }
article h1 { font: 700 clamp(2rem, 4.2vw, 2.75rem)/1.12 var(--f-display); letter-spacing: -.02em; margin: 0 0 18px; text-wrap: balance; }
.lead { font-size: 1.12rem; color: var(--muted); margin: 0 0 26px; }
article h2 { font: 700 1.75rem/1.2 var(--f-display); letter-spacing: -.01em; margin: 56px 0 14px; text-wrap: balance; counter-increment: h2; counter-reset: h3; }
article h2::before { content: counter(h2) ". "; color: var(--accent); }
article h2.nonum::before { content: none; }
article h3 { font: 700 1.25rem/1.3 var(--f-display); margin: 34px 0 10px; counter-increment: h3; text-wrap: balance; }
article h3::before { content: counter(h2) "." counter(h3) ". "; color: var(--muted); }
article h3.nonum::before { content: none; }
article p, article li { max-width: 68ch; }
article ul, article ol { padding-left: 1.3em; }
article li + li { margin-top: 4px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }

/* étapes numérotées (comme les supports modèles) */
ol.steps { list-style: none; padding: 0; counter-reset: st; display: grid; gap: 14px; }
ol.steps > li { counter-increment: st; position: relative; padding-left: 42px; margin: 0; min-height: 28px; }
ol.steps > li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; font: 600 .8rem var(--f-mono); }

/* encadrés */
.aside { border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; padding: 14px 18px; margin: 22px 0; }
.aside > :first-child { margin-top: 0; }
.aside > :last-child { margin-bottom: 0; }
.aside-title { font-weight: 700; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
.aside-title::before { font: 700 .75rem var(--f-mono); padding: 1px 7px; border-radius: 99px; background: var(--surface); }
.aside.tip { border-color: var(--ok); background: var(--ok-soft); }
.aside.tip .aside-title::before { content: "ASTUCE"; color: var(--ok); }
.aside.note { border-color: var(--accent); }
.aside.note .aside-title::before { content: "NOTE"; color: var(--accent); }
.aside.caution { border-color: var(--mid); background: var(--mid-soft); }
.aside.caution .aside-title::before { content: "IMPORTANT"; color: var(--mid); }
.aside.next { border-color: var(--muted); background: var(--surface-2); }
.aside.next .aside-title::before { content: "LA SUITE"; color: var(--muted); }

/* définition : une fiche de vocabulaire */
.def { margin: 22px 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 18px; box-shadow: var(--shadow); }
.def dt { font: 700 1.05rem var(--f-display); color: var(--accent); }
.def dt small { font: 600 .72rem var(--f-mono); color: var(--muted); margin-left: 8px; letter-spacing: .05em; text-transform: uppercase; }
.def dd { margin: 4px 0 0; }
.def dd + dt { margin-top: 12px; }

/* schéma relationnel et dépendances */
.schema, .dfl {
  font-family: var(--f-mono); font-size: .93rem; line-height: 1.7;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px; margin: 14px 0; overflow-x: auto; white-space: nowrap; max-width: 100%;
}
.schema.stack, .dfl.stack { white-space: normal; }
.schema.stack > div, .dfl.stack > div { white-space: nowrap; }
.schema b, .dfl b { color: var(--accent); }
u, .pk { text-decoration: underline; text-decoration-color: var(--key); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.fk { color: var(--key); font-weight: 600; }
.dfa { display: inline-flex; align-items: center; margin: 0 .5ch; vertical-align: middle; color: var(--muted); font: 600 .7rem var(--f-mono); }
.dfa::before { content: ""; width: 1.4em; border-top: 1.5px solid currentColor; }
.dfa > span { padding: 0 3px; }
.dfa > i { display: inline-block; width: 1.6em; height: 0; border-top: 1.5px solid currentColor; position: relative; }
.dfa > i::after { content: ""; position: absolute; right: -2px; top: -5.25px; border-left: 8px solid currentColor; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
.ok-t { color: var(--ok); font-weight: 700; }
.ko-t { color: var(--ko); font-weight: 700; }

/* tables de données */
.tables { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; margin: 16px 0; }
.tbl { min-width: 0; max-width: 100%; overflow-x: auto; }
.tbl-name { margin: 0 0 4px; font: 700 .8rem var(--f-mono); letter-spacing: .06em; color: var(--muted); }
table.data { border-collapse: separate; border-spacing: 0; font-size: .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
table.data th, table.data td { padding: 6px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data th { font: 600 .78rem var(--f-mono); background: var(--surface-2); letter-spacing: .02em; }
table.data td { font-variant-numeric: tabular-nums; }
table.data td.null { color: var(--muted); font: italic .8rem var(--f-mono); }
table.data td.num, table.data th.num { color: var(--muted); font: .75rem var(--f-mono); text-align: right; width: 2.5em; }
table.data tr.hl td { background: var(--mid-soft); }
table.wide { width: 100%; }
.tbl-wrap { overflow-x: auto; max-width: 100%; margin: 14px 0; }
.tbl-wrap > table.data { min-width: 100%; }

/* carte mentale (vue d'ensemble) */
.carte { margin: 8px 0 26px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow-x: auto; }
.carte-in { display: flex; align-items: center; gap: 0; min-width: max-content; }
.carte-root { font: 700 1.05rem var(--f-display); padding: 10px 16px; border-radius: 10px; background: var(--accent); color: var(--surface); }
.carte ul { list-style: none; margin: 0; padding: 0 0 0 28px; position: relative; display: grid; gap: 8px; }
.carte ul::before { content: ""; position: absolute; left: 0; top: 50%; width: 28px; border-top: 2px solid var(--line); }
.carte li { position: relative; padding-left: 22px; margin: 0; max-width: none; }
.carte li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 2px solid var(--line); }
.carte li:first-child::before { top: 50%; }
.carte li:last-child::before { bottom: 50%; }
.carte li:only-child::before { display: none; }
.carte li::after { content: ""; position: absolute; left: 0; top: 50%; width: 22px; border-top: 2px solid var(--line); }
.carte li > span { display: inline-block; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: .92rem; line-height: 1.3; }
.carte li > span b { color: var(--accent); }

/* facture (exemple de document métier) */
.facture { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 18px 20px; margin: 18px 0; box-shadow: var(--shadow); font-size: .92rem; }
.facture header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; border-bottom: 2px dashed var(--line); padding-bottom: 10px; margin-bottom: 12px; }
.facture h4 { margin: 0; font: 700 1.1rem var(--f-display); letter-spacing: .08em; }
.facture .meta { font-family: var(--f-mono); font-size: .82rem; color: var(--muted); }
.facture .total td { font-weight: 700; }

/* niveaux d'exercice */
details.task { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin: 16px 0; box-shadow: var(--shadow); }

details.task[open] > summary::after { content: "−"; }

.lvl1 .lvl { background: var(--ok-soft); color: var(--ok); }
.lvl2 .lvl { background: var(--accent-soft); color: var(--accent); }
.lvl3 .lvl { background: var(--key-soft); color: var(--key); }
details.task > .task-body { padding: 0 18px 18px; border-top: 1px solid var(--line); }

/* ---------- composants interactifs ---------- */
.btn { cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: 9px; font-size: .9rem; font-weight: 700; line-height: 1.2; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover:not(:disabled) { color: var(--surface); filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); font-weight: 600; }
.btn.small { padding: 4px 9px; font-size: .8rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.note-line { font-size: .84rem; color: var(--muted); }

.qz-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }

.qz-body { padding: 18px 20px; }
.qz-q { font-weight: 700; margin: 0 0 14px; }
.qz-opts { display: grid; gap: 8px; }
.qz-opt { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; text-align: left; cursor: pointer; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: .95rem; line-height: 1.45; }
.qz-opt .l { font: 700 .75rem/1.9 var(--f-mono); color: var(--muted); }
.qz-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.qz-opt:disabled { cursor: default; }
.qz-opt.good { border-color: var(--ok); background: var(--ok-soft); }
.qz-opt.bad { border-color: var(--ko); background: var(--ko-soft); }
.qz-opt.good .l, .qz-opt.bad .l { color: var(--fg); }
.qz-hint { margin-top: 12px; }
.qz-hint-box, .hint-box { margin-top: 8px; padding: 10px 14px; border-radius: 10px; background: var(--mid-soft); font-size: .92rem; }
.qz-fb { margin-top: 14px; padding: 12px 16px; border-radius: 10px; font-size: .94rem; }
.qz-fb.good { background: var(--ok-soft); }
.qz-fb.bad { background: var(--ko-soft); }
.qz-fb > strong { display: block; margin-bottom: 4px; }
.qz-fb.good > strong { color: var(--ok); }
.qz-fb.bad > strong { color: var(--ko); }
.qz-fb p { margin: 6px 0 0; }
.qz-foot { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2); }
.qz-track { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.qz-track > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.qz-score { font: 700 2.2rem var(--f-display); margin: 0; font-variant-numeric: tabular-nums; }
.qz-recap { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; font-size: .9rem; }
.qz-recap li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; max-width: none; margin: 0; }

/* réponse rédigée */
.answer { margin: 18px 0 26px; }
.ans { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.ans-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.ans-tag { font: 600 .74rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.ans-saved { font-size: .78rem; color: var(--muted); }
.ans-body { padding: 14px 16px; display: grid; gap: 10px; }
.ans textarea { width: 100%; resize: vertical; min-height: 4.5em; font: .95rem/1.55 var(--f-body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.ans.k-schema textarea { font-family: var(--f-mono); font-size: .88rem; }
.ans textarea:focus, .te input:focus, .field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.ans-syntax { font-size: .8rem; color: var(--muted); }
.ans-syntax code { font-size: .78rem; }
.ans-preview { font-family: var(--f-mono); font-size: .88rem; padding: 8px 12px; border-radius: 10px; border: 1px dashed var(--line); white-space: pre-wrap; overflow-x: auto; min-height: 2.4em; }
.ans-preview:empty::before { content: "Aperçu de la notation…"; color: var(--muted); font-style: italic; }
.ans-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ans-corr { border-top: 1px solid var(--line); padding: 14px 16px; background: var(--ok-soft); }
.ans-corr-title { margin: 0 0 6px; font: 700 .78rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ok); }
.ans-corr > :last-child { margin-bottom: 0; }
.ans-corr .schema, .ans-corr .dfl, .ans-corr table.data { background: var(--surface); }
.ans-self { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 8px; border-radius: 0 0 14px 14px; }
.ans-self p { margin: 0; font-size: .9rem; font-weight: 700; }
.self-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.self-btn { cursor: pointer; border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 99px; font-size: .88rem; font-weight: 700; }
.self-btn[aria-pressed="true"].s-ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.self-btn[aria-pressed="true"].s-mid { background: var(--mid); border-color: var(--mid); color: var(--surface); }
.self-btn[aria-pressed="true"].s-ko { background: var(--ko); border-color: var(--ko); color: var(--surface); }
.self-btn.s-ok:hover { border-color: var(--ok); }
.self-btn.s-mid:hover { border-color: var(--mid); }
.self-btn.s-ko:hover { border-color: var(--ko); }

/* éditeur de tables */
.te { display: grid; gap: 12px; }
.te-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); min-width: 0; }
.te-name { font: 700 .85rem var(--f-mono); width: min(100%, 22ch); padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--fg); text-transform: uppercase; }
.te-scroll { overflow-x: auto; margin: 8px 0; }
.te table { border-collapse: collapse; }
.te th, .te td { border: 1px solid var(--line); padding: 0; background: var(--surface); }
.te th { background: var(--surface-2); vertical-align: top; }
.te input.c { font: .82rem var(--f-mono); width: 16ch; border: 0; padding: 6px 7px; background: transparent; color: var(--fg); }
.te th input.c { font-weight: 600; }
.te th.is-pk input.c { text-decoration: underline; text-decoration-color: var(--key); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.te-flags { display: flex; gap: 4px; padding: 0 5px 5px; }
.te-flag { cursor: pointer; font: 600 .65rem var(--f-mono); padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.te-flag[aria-pressed="true"] { background: var(--key); border-color: var(--key); color: var(--surface); }
.te-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.te-links { display: grid; gap: 4px; font-size: .85rem; }
.te-links input { font: .85rem var(--f-mono); padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }

/* tableau à cocher (OUI / NON…) */
.ctab, .match, .pick { margin: 18px 0 26px; }
.ck { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.ck-head { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.ck-scroll { overflow-x: auto; }
.ck table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.ck th, .ck td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.ck th { font: 600 .74rem var(--f-mono); background: var(--surface-2); letter-spacing: .03em; white-space: nowrap; }
.ck td.lab { min-width: 14em; }
.ck td.cell { white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { cursor: pointer; border: 0; background: var(--surface); padding: 5px 10px; font: 600 .78rem var(--f-mono); color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.seg button:disabled { cursor: not-allowed; opacity: .4; }
td.cell.good .seg { outline: 2px solid var(--ok); outline-offset: 2px; }
td.cell.bad .seg { outline: 2px solid var(--ko); outline-offset: 2px; }
td.cell .mark, .m-row .mark { font: 700 .8rem var(--f-mono); margin-left: 6px; }
.good .mark { color: var(--ok); }
.bad .mark { color: var(--ko); }
tr.ck-expl td { background: var(--surface-2); font-size: .86rem; color: var(--fg); padding-top: 6px; }
.ck-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: var(--surface-2); }
.ck-msg { font-size: .9rem; font-weight: 700; }
.ck-msg.good { color: var(--ok); }
.ck-msg.bad { color: var(--ko); }
.ck-msg.mid { color: var(--mid); }
.ck-after { padding: 12px 16px; border-top: 1px solid var(--line); background: var(--ok-soft); font-size: .93rem; }
.ck-after > :first-child { margin-top: 0; }
.ck-after > :last-child { margin-bottom: 0; }

.m-list { display: grid; }
.m-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(12rem, 16rem); gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.m-row select { font: inherit; font-size: .88rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; }
.m-row.good select { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
.m-row.bad select { border-color: var(--ko); box-shadow: 0 0 0 1px var(--ko); }
.m-row .m-expl { grid-column: 1 / -1; font-size: .85rem; background: var(--surface-2); padding: 6px 10px; border-radius: 8px; }

.pick tbody tr { cursor: pointer; }
.pick tbody tr:hover td { background: var(--accent-soft); }
.pick tbody tr.picked td { background: var(--accent-soft); box-shadow: inset 0 0 0 0 transparent; }
.pick tbody tr.picked td:first-child { box-shadow: inset 4px 0 0 var(--accent); }
.pick tbody tr.p-good td { background: var(--ok-soft); }
.pick tbody tr.p-bad td { background: var(--ko-soft); }
.pick tbody tr.p-miss td { background: var(--mid-soft); }
.pick tbody tr.p-good td:first-child { box-shadow: inset 4px 0 0 var(--ok); }
.pick tbody tr.p-bad td:first-child { box-shadow: inset 4px 0 0 var(--ko); }
.pick tbody tr.p-miss td:first-child { box-shadow: inset 4px 0 0 var(--mid); }
.pick .ck-scroll { padding: 12px 16px; }
.pick table.data { width: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

/* progression de la page */
.page-progress { margin: 48px 0 0; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); display: grid; gap: 10px; }
.page-progress p { margin: 0; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.bar.full > span { background: var(--ok); }

/* navigation de séquence */
.seq { margin-top: 28px; display: grid; gap: 12px; }
.seq-progress { font-size: .85rem; color: var(--muted); margin: 0; }
.seq-links { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seq-link { display: grid; gap: 2px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--fg); background: var(--surface); }
.seq-link:hover { border-color: var(--accent); }
.seq-link.next { text-align: right; grid-column: 2; }
.seq-dir { font-size: .8rem; color: var(--muted); }
.seq-title { font-weight: 700; color: var(--accent); line-height: 1.3; }

/* champs (accueil / bilan) */
.field { display: grid; gap: 4px; }
.field label { font-size: .85rem; font-weight: 700; }
.field input, .field textarea, .field select { font: inherit; font-size: .95rem; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; }
.field textarea { font: .82rem/1.45 var(--f-mono); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 12px; margin: 14px 0; }
.panel { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 16px 18px; margin: 18px 0; box-shadow: var(--shadow); }
.panel > :first-child { margin-top: 0; }
.panel > :last-child { margin-bottom: 0; }

.parcours { list-style: none; padding: 0; margin: 18px 0; display: grid; gap: 8px; }
.parcours li { max-width: none; margin: 0; }
.parcours a { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; color: var(--fg); }
.parcours a:hover { border-color: var(--accent); }
.parcours .k { font: 600 .74rem var(--f-mono); color: var(--muted); letter-spacing: .03em; }
.parcours .k.tp { color: var(--key); }
.parcours .t { font-weight: 700; line-height: 1.3; }
.parcours .t small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 12px; margin: 16px 0; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.stat b { display: block; font: 700 1.7rem var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: .82rem; color: var(--muted); }
.bilan-tbl td, .bilan-tbl th { white-space: nowrap; }
.bilan-tbl td:first-child { white-space: normal; min-width: 12em; }
.revoir { display: grid; gap: 6px; padding-left: 1.2em; }
.chip { display: inline-block; font: 600 .7rem var(--f-mono); padding: 1px 7px; border-radius: 99px; margin-right: 6px; }
.chip.ko { background: var(--ko-soft); color: var(--ko); }
.chip.mid { background: var(--mid-soft); color: var(--mid); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .9rem; }

/* ---------- responsive ---------- */
@media (max-width: 1240px) {
  .page-grid { grid-template-columns: minmax(0, 46rem); }
  .notices { max-width: 46rem; }
  .toc { display: none; }
}
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-block; }
  .sidebar { position: fixed; z-index: 45; top: calc(var(--top) + env(safe-area-inset-top, 0px)); left: 0; width: min(86vw, 320px); transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow); }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 25, .4); }
  .who { display: none; }
}
@media (max-width: 560px) {
  body { font-size: 16px; }
  .brand small { display: none; }
  .brand { font-size: 1.05rem; }
  .topbar { gap: 8px; }
  .theme-sel { display: none; }
  .brand span { display: none; }
  .seq-links { grid-template-columns: 1fr; }
  .seq-link.next { grid-column: 1; }
  .parcours a { grid-template-columns: minmax(0, 1fr) auto; }
  .parcours .k { grid-column: 1 / -1; }
  .m-row { grid-template-columns: minmax(0, 1fr); }
  .qz-body, .qz-head, .qz-foot { padding-left: 14px; padding-right: 14px; }
  .carte-in { flex-direction: column; align-items: flex-start; min-width: 0; gap: 10px; }
  .carte ul { padding-left: 14px; }
  .carte ul::before { display: none; }
  .carte li > span { white-space: normal; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}

/* ---------- fichier unique : démarrage, entraînement, rappel ---------- */
.mono { font-family: var(--f-mono); letter-spacing: .03em; }
.qz-badge.train { background: var(--mid-soft); color: var(--mid); }
.qz-first, .qz-first-inline { font-size: .84rem; color: var(--muted); }
.qz-first { padding: 8px 20px; border-top: 1px solid var(--line); }
.panel.start { border-width: 2px; border-color: var(--accent); display: grid; gap: 10px; }
.panel.start.ok { border-color: var(--ok); }
.panel.start p { margin: 0; }
.panel.start hr { margin: 6px 0; }
.start-step { font: 600 .74rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.panel.start.ok .start-step { color: var(--ok); }
.start-who { font: 700 1.3rem var(--f-display); margin: 0; }
.panel.start .fields { margin: 0; }
.ident-edit summary { cursor: pointer; font-size: .88rem; color: var(--muted); }
.ident-edit[open] { display: grid; gap: 10px; }
.notice.gate { margin-top: 10px; }
a.btn { text-decoration: none; display: inline-block; }
.remind {
  position: fixed; z-index: 70; max-width: min(26rem, calc(100vw - 32px));
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border: 2px solid var(--mid); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); font-size: .92rem;
  display: grid; gap: 8px;
}
.remind p { margin: 0; }
.notices:empty, .notices[hidden] { display: none; }

/* ---------- code (SQL, C#, PHP…) ---------- */
pre.code { font: .86rem/1.55 var(--f-mono); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 14px 0; }
pre.code.terminal { background: #10151f; color: #dce3f0; border-color: #10151f; }
pre.code .kw { color: var(--accent); font-weight: 600; }
pre.code.terminal .kw { color: #93a6ff; }
.ans.k-code textarea { font-family: var(--f-mono); font-size: .88rem; tab-size: 4; }

/* ---------- Ajouts du chapitre 2 (réseaux) ---------- */
.answer, .ans-prompt, .task-body { min-width: 0; }
.ans-prompt pre.code { max-width: 100%; overflow-x: auto; }
pre.code .cm { color: var(--muted); font-style: italic; }
pre.code .pr { color: var(--ok); font-weight: 600; }
pre.code .st { color: var(--key); }
pre.code .hl { background: var(--mid-soft); color: var(--fg); border-radius: 3px; }
figure.fig { margin: 1.4rem 0; padding: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
figure.fig svg { display: block; width: 100%; height: auto; max-width: 760px; margin: 0 auto; }
figure.fig figcaption { margin-top: .6rem; font-size: .88rem; color: var(--muted); text-align: center; }
figure.fig svg text { fill: var(--fg); font-family: var(--f-body); font-size: 13px; }
figure.fig svg text.sm { font-size: 11px; fill: var(--muted); }
figure.fig svg text.b { font-weight: 700; }
figure.fig svg .ln { stroke: var(--muted); stroke-width: 2; fill: none; }
figure.fig svg .ln-acc { stroke: var(--accent); stroke-width: 2.5; fill: none; }
figure.fig svg .bx { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; }
figure.fig svg .bx-acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
figure.fig svg .bx-key { fill: var(--key-soft); stroke: var(--key); stroke-width: 1.5; }
figure.fig svg .bx-ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.5; }
figure.fig svg .bx-mid { fill: var(--mid-soft); stroke: var(--mid); stroke-width: 1.5; }
figure.fig svg .dot { fill: var(--accent); }
.encap { display: grid; gap: 6px; font-family: var(--f-mono); font-size: .8rem; margin: 1rem 0; }
.encap > div { display: flex; align-items: stretch; gap: 0; overflow-x: auto; }
.encap .lab { flex: 0 0 8.5rem; font-family: var(--f-body); font-size: .85rem; color: var(--muted); padding: .35rem .5rem .35rem 0; }
.encap span { padding: .35rem .55rem; border: 1px solid var(--line); white-space: nowrap; }
.encap span + span { border-left: 0; }
.encap .h2l { background: var(--key-soft); } .encap .h3l { background: var(--accent-soft); }
.encap .h4l { background: var(--ok-soft); } .encap .d7 { background: var(--surface-2); flex: 1 0 auto; }
.encap .t2l { background: var(--key-soft); }
table.data.bits td, table.data.bits th { text-align: center; font-family: var(--f-mono); padding-left: .45rem; padding-right: .45rem; }
table.data td.hl, table.data th.hl { background: var(--mid-soft); }
table.data td.mono, .mono { font-family: var(--f-mono); }
.dl-cap { display: inline-flex; align-items: center; gap: .5rem; padding: .55rem .9rem; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; text-decoration: none; }
.dl-cap:hover { background: var(--accent); color: #fff; }
.aside.deep { border-color: var(--accent); background: var(--accent-soft); }
.aside.deep .aside-title::before { content: "EN PROFONDEUR"; color: var(--accent); }
.aside.pro { border-color: var(--key); background: var(--key-soft); }
.aside.pro .aside-title::before { content: "EN ENTREPRISE"; color: var(--key); }
.refco { font-size: .88rem; color: var(--muted); }
@media (max-width: 600px) {
  .encap > div { flex-wrap: wrap; }
  .encap .lab { flex-basis: 100%; padding-bottom: 0; }
}
ol.steps, ol.steps > li { min-width: 0; max-width: 100%; }
ol.steps > li .tbl-wrap { max-width: 100%; overflow-x: auto; }
article li code, article td code, article p code { overflow-wrap: anywhere; }

</style>

<body>
<article></article>
<noscript><p style="padding:16px">Ce cours a besoin de JavaScript pour fonctionner.</p></noscript>
<!-- ================= PAGE accueil ================= -->
<template data-page="accueil">
<p class="eyebrow"><span class="kind" data-cfg="level">BTS SIO</span><span data-cfg="chapter"></span></p>
<h1 data-cfg="title">Titre du cours</h1>

<h1>La couche transport : TCP et UDP</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : chapitre 2 (modèles en couches, encapsulation, lecture d’une capture dans Wireshark). Garder Wireshark ouvert : une capture est fournie dans cette partie. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Couche transport</div><ul>
  <li><span><b>Ports</b> : désigner une application sur une machine</span></li>
  <li><span><b>UDP</b> : simple, rapide, sans garantie</span></li>
  <li><span><b>TCP</b> : connexion, fiabilité, ordre, contrôle de flux</span></li>
  <li><span><b>Poignée de main</b> : SYN, SYN-ACK, ACK</span></li>

<p class="lead">L’adresse IP amène le paquet jusqu’à la bonne machine. Mais sur un serveur tournent en même temps un site web, un partage de fichiers, un accès à distance… La couche transport (couche 4) livre les données au <strong>bon programme</strong>, grâce aux numéros de <strong>ports</strong>, et choisit entre deux façons de transporter : <strong>UDP</strong>, rapide mais sans garantie, ou <strong>TCP</strong>, fiable mais plus lourd.</p>

<h2>Les ports</h2>
<p>Un <strong>port</strong> est un numéro de <strong>16 bits</strong> (de 0 à 65 535) qui identifie une application sur une machine. Un programme serveur « <strong>écoute</strong> » sur un port connu à l’avance (80 pour le web) ; le client, lui, utilise un port choisi au hasard par son système, dit <strong>port éphémère</strong>.</p>
<dl class="def">
  <dt>Socket</dt><dd>Le couple <strong>adresse IP + port</strong>, pour un protocole donné : <code>192.168.50.10:80/TCP</code>. C’est la « porte » d’une application sur le réseau.</dd>
  <dt>Connexion</dt><dd>Identifiée par cinq éléments : protocole, IP source, port source, IP de destination, port de destination. Deux onglets du navigateur vers le même serveur forment deux connexions distinctes, car leurs ports sources diffèrent.</dd>
</dl>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Plage</th><th>Nom</th><th>Usage</th></tr>
  <tr><td>0 à 1 023</td><td>Ports <strong>bien connus</strong> (système)</td><td>Services standard (web, messagerie, DNS…). Sous Linux, il faut les droits d’administration pour écouter sur l’un d’eux.</td></tr>
  <tr><td>1 024 à 49 151</td><td>Ports <strong>enregistrés</strong></td><td>Applications déclarées auprès de l’IANA : 3306 (MariaDB), 3389 (bureau à distance)…</td></tr>

</table></div>

<h2>UDP : le transport sans connexion</h2>
<p><strong>UDP</strong> (<em>User Datagram Protocol</em>, RFC 768) se contente d’ajouter les ports et une somme de contrôle. Son en-tête ne fait que <strong>8 octets</strong> : port source, port de destination, longueur, somme de contrôle.</p>
<ul>
  <li><strong>Pas de connexion</strong> : on envoie directement, sans prévenir le destinataire.</li>
  <li><strong>Pas de garantie</strong> : un datagramme perdu n’est pas renvoyé ; l’ordre d’arrivée n’est pas garanti. Si c’est nécessaire, c’est l’application qui s’en charge (le client DNS repose sa question s’il n’a pas de réponse).</li>
  <li><strong>Rapide et léger</strong> : pas d’attente ni d’acquittement.</li>
</ul>
<p>Usages : <strong>DNS</strong> (une question, une réponse), <strong>DHCP</strong> (le client n’a pas encore d’adresse, il ne peut pas ouvrir de connexion), <strong>NTP</strong>, <strong>voix sur IP</strong> et visioconférence (mieux vaut perdre un morceau de son que l’entendre en retard), jeux en ligne, et <strong>QUIC</strong>, le protocole de HTTP/3, qui reconstruit sa propre fiabilité au-dessus d’UDP.</p>

<h2>TCP : le transport fiable</h2>
<p><strong>TCP</strong> (<em>Transmission Control Protocol</em>, RFC 9293) garantit que les données arrivent <strong>toutes</strong>, <strong>dans l’ordre</strong> et <strong>sans erreur</strong>, ou que l’application est prévenue de l’échec. Il est utilisé par le web, la messagerie, le partage de fichiers, SSH, les bases de données.</p>
<dl class="def">
  <dt>Orienté connexion</dt><dd>Avant d’échanger des données, client et serveur établissent une connexion (poignée de main en trois temps) ; ils la ferment ensuite.</dd>
  <dt>Numéros de séquence</dt><dd>Chaque <strong>octet</strong> envoyé est numéroté. Le numéro de séquence d’un segment est celui de son premier octet de données.</dd>
  <dt>Acquittements</dt><dd>Le récepteur renvoie le numéro du <strong>prochain octet attendu</strong> (champ <em>Acknowledgment</em>). Un segment non acquitté à temps est <strong>retransmis</strong>.</dd>
  <dt>Contrôle de flux <small>fenêtre</small></dt><dd>Le champ <em>Window</em> indique combien d’octets le récepteur peut encore recevoir : l’émetteur ralentit si le récepteur est saturé.</dd>
  <dt>Contrôle de congestion</dt><dd>TCP réduit son débit quand il détecte des pertes, pour ne pas saturer le réseau.</dd>
</dl>

<h3>L’en-tête TCP</h3>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Champ</th><th>Taille</th><th>Rôle</th></tr>
  <tr><td>Port source, port de destination</td><td>2 + 2 octets</td><td>Les applications aux deux extrémités.</td></tr>
  <tr><td>Numéro de séquence</td><td>4 octets</td><td>Position du premier octet de données du segment.</td></tr>
  <tr><td>Numéro d’acquittement</td><td>4 octets</td><td>Prochain octet attendu de l’autre côté.</td></tr>
  <tr><td>Longueur d’en-tête, drapeaux</td><td>2 octets</td><td>Drapeaux : <strong>SYN</strong> (ouverture), <strong>ACK</strong> (acquittement valide), <strong>FIN</strong> (fin d’envoi), <strong>RST</strong> (réinitialisation, refus), <strong>PSH</strong> (transmettre tout de suite à l’application).</td></tr>
  <tr><td>Fenêtre</td><td>2 octets</td><td>Place disponible chez le récepteur.</td></tr>
  <tr><td>Somme de contrôle, pointeur d’urgence</td><td>2 + 2 octets</td><td>Contrôle d’erreur ; le pointeur d’urgence n’est presque plus utilisé.</td></tr>
  <tr><td>Options</td><td>0 à 40 octets</td><td>Taille maximale de segment (MSS), facteur d’échelle de la fenêtre…</td></tr>
</table></div>
<p>L’en-tête TCP mesure <strong>20 octets</strong> sans option (jusqu’à 60), contre 8 pour UDP : c’est le prix de la fiabilité.</p>

<h3>L’ouverture et la fermeture d’une connexion</h3>
<figure class="fig" aria-label="Poignée de main TCP en trois temps">

  <line class="ln-acc" x1="550" y1="85" x2="90" y2="110"/><text x="320" y="91" text-anchor="middle">SYN, ACK  seq=0 ack=1</text>
  <line class="ln-acc" x1="90" y1="120" x2="550" y2="145"/><text x="320" y="126" text-anchor="middle">ACK  seq=1 ack=1</text>

  <line class="ln" x1="550" y1="260" x2="90" y2="277"/><text x="320" y="264" text-anchor="middle" class="sm">FIN, ACK  seq=324 ack=76  puis ACK</text>
</svg>
<figcaption>Numéros relatifs (comme dans Wireshark) : chaque côté commence à 0. Le SYN et le FIN comptent chacun pour un octet.</figcaption>
</figure>
<ol class="steps">
  <li><strong>SYN</strong> : le client demande l’ouverture et annonce son numéro de séquence initial.</li>
  <li><strong>SYN, ACK</strong> : le serveur accepte, annonce le sien et acquitte celui du client (+1).</li>
  <li><strong>ACK</strong> : le client acquitte. La connexion est <strong>établie</strong> (état <code>ESTABLISHED</code>) ; les données peuvent circuler dans les deux sens.</li>
  <li><strong>Fermeture</strong> : chaque côté envoie un <strong>FIN</strong>, acquitté par l’autre (souvent en 3 ou 4 segments).</li>
  <li><strong>Refus</strong> : si aucun programme n’écoute sur le port demandé, le serveur répond à SYN par <strong>RST</strong> : « connexion refusée ».</li>
</ol>

<h3>Observer une vraie connexion</h3>
<p>Le poste PC-ADM (<code>192.168.50.30</code>) a affiché l’intranet du serveur web SRV-DEB avec la commande <code>curl http://www.m2l.lan</code>, puis a tenté une connexion en HTTPS (<code>curl https://www.m2l.lan</code>) alors que le serveur n’écoute pas sur le port 443.</p>

<div class="answer" data-id="a-seq" data-kind="code" data-label="Expliquer les numéros de séquence et d’acquittement" data-min="120" data-rows="8">
  <p>À partir de la liste ci-dessus et du détail des trames dans Wireshark : a) Quelle est la longueur des données TCP de la trame 4 (champ <em>Len</em>) ? Pourquoi le serveur acquitte-t-il avec <code>Ack=75</code> en trame 5 ? b) Même question pour <code>Ack=324</code> en trame 7. c) Pourquoi la trame 10 contient-elle <code>Ack=325</code> et non <code>Ack=324</code> ? d) Quels sont les ports source et destination de la trame 6 ?</p>
  <p class="hint">Ack = numéro du prochain octet attendu = Seq reçu + nombre d’octets reçus. Le SYN et le FIN comptent pour un octet.</p>
  <div class="corr">
    <pre class="code">a) Trame 4 : Seq=1, Len=74 → octets 1 à 74 reçus → prochain attendu : 75
b) Trame 6 : Seq=1, Len=323 → octets 1 à 323 reçus → prochain attendu : 324
c) La trame 9 (FIN du serveur, Seq=324) « consomme » un numéro :
   le client acquitte 324 + 1 = 325
d) Trame 6 (réponse du serveur) : port source 80, port de destination 49712</pre>
    <p>Les ports s’inversent dans les réponses : le client écrit depuis son port éphémère 49712 vers le port 80 ; le serveur répond depuis 80 vers 49712. C’est ainsi que le poste sait à quel programme (quel onglet, quelle commande) remettre la réponse.</p>
  </div>
</div>

<div class="aside deep">
  <p class="aside-title">Refusé, ou filtré ?</p>
  <p>Quand une connexion TCP échoue, deux cas se distinguent nettement dans une capture et dans les messages d’erreur. <strong>Refusé</strong> (trame 12) : la machine est joignable mais aucun programme n’écoute, elle répond aussitôt par RST (« connexion refusée », <em>connection refused</em>). <strong>Filtré</strong> : un pare-feu jette le SYN sans répondre ; le client renvoie plusieurs SYN puis abandonne au bout de plusieurs secondes (« délai dépassé », <em>timed out</em>). Le premier cas oriente vers le service (arrêté, mauvais port), le second vers un pare-feu. Avec UDP, l’équivalent du refus est un message ICMP « port injoignable » (type 3, code 3).</p>
</div>

<h2>TCP ou UDP ?</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th></th><th>TCP</th><th>UDP</th></tr>
  <tr><td>Connexion</td><td>Oui (SYN, SYN-ACK, ACK)</td><td>Non</td></tr>
  <tr><td>Fiabilité, ordre</td><td>Garantis (acquittements, retransmissions)</td><td>Non garantis</td></tr>
  <tr><td>En-tête</td><td>20 à 60 octets</td><td>8 octets</td></tr>
  <tr><td>Vitesse, délai</td><td>Plus lent à démarrer, ralentit en cas de pertes</td><td>Immédiat</td></tr>
  <tr><td>Exemples</td><td>HTTP/HTTPS, SMB, SSH, SMTP, IMAP, MariaDB</td><td>DNS, DHCP, NTP, voix sur IP, vidéo en direct, QUIC</td></tr>
</table></div>

<h2>Voir les ports et les connexions d’une machine</h2>
<pre class="code terminal"><span class="cm"># Windows : toutes les connexions et ports en écoute, avec le numéro de processus</span>
<span class="pr">C:\&gt;</span> netstat -ano
  Proto  Adresse locale         Adresse distante       État            PID
  TCP    0.0.0.0:135            0.0.0.0:0              LISTENING       1012
  TCP    0.0.0.0:445            0.0.0.0:0              LISTENING       4
  TCP    192.168.50.30:49712    192.168.50.10:80       ESTABLISHED     6280
  UDP    0.0.0.0:5353           *:*                                    2140
<span class="pr">PS C:\&gt;</span> Get-NetTCPConnection -State Listen
<span class="pr">PS C:\&gt;</span> Test-NetConnection 192.168.50.10 -Port 80
ComputerName     : 192.168.50.10
RemoteAddress    : 192.168.50.10
RemotePort       : 80
InterfaceAlias   : Ethernet
SourceAddress    : 192.168.50.30
TcpTestSucceeded : True

<span class="cm"># Linux : ports TCP (t) et UDP (u) en écoute (l), numériques (n), avec le programme (p)</span>
<span class="pr">$</span> sudo ss -tulnp
Netid State  Recv-Q Send-Q Local Address:Port Peer Address:Port Process
tcp   LISTEN 0      511                *:80              *:*     users:(("apache2",pid=812,fd=4))
tcp   LISTEN 0      128          0.0.0.0:22        0.0.0.0:*     users:(("sshd",pid=640,fd=3))
<span class="pr">$</span> ss -tn                 <span class="cm"># connexions TCP établies</span></pre>
<p><code>0.0.0.0:445</code> (ou <code>*:80</code>) signifie « en écoute sur toutes les adresses de la machine ». <code>127.0.0.1:3306</code> signifierait « seulement pour la machine elle-même » : un service ainsi configuré est injoignable depuis le réseau, ce qui est parfois voulu (base de données utilisée uniquement par le serveur web local), parfois une erreur de configuration à repérer.</p>
<div class="aside pro">
  <p class="aside-title">Ports ouverts = surface d’attaque</p>
  <p>Chaque port en écoute est une porte d’entrée possible. Un réflexe d’administrateur, et un point de contrôle de l’audit de sécurité (bloc 3) : lister les ports en écoute d’un serveur, vérifier que chacun correspond à un service <strong>voulu</strong>, arrêter les autres. Telnet (23) ou FTP (21) ouverts sur un serveur récent doivent alerter : ils transmettent les mots de passe en clair.</p>
</div>

<div class="answer" data-id="a-netstat" data-label="Lire une sortie de netstat" data-min="80" data-rows="5">
  <p>Dans la sortie <code>netstat -ano</code> ci-dessus : a) quels services le poste propose-t-il en TCP ? b) que fait le processus 6280, et vers quelle machine ? c) Le serveur SRV-DEB affiche <code>tcp LISTEN 0 80 127.0.0.1:3306 0.0.0.0:*</code>. Un poste du réseau pourra-t-il se connecter à MariaDB ? Expliquer.</p>
  <div class="corr">
    <p>a) Il écoute sur les ports 135 (service RPC de Windows) et 445 (partage de fichiers SMB), sur toutes ses adresses.</p>
    <p>b) Le processus 6280 (par exemple le navigateur ou <code>curl</code>) a une connexion <strong>établie</strong> depuis son port éphémère 49712 vers le port 80 de 192.168.50.10 : il consulte le serveur web SRV-DEB.</p>
    <p>c) Non : MariaDB n’écoute que sur l’adresse de bouclage <code>127.0.0.1</code>, donc seulement pour les programmes du serveur lui-même. Une tentative depuis le réseau recevra un RST (connexion refusée). C’est la configuration par défaut de MariaDB sous Debian, volontairement prudente.</p>
  </div>
</div>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Croire que le client utilise le même port que le serveur : le client prend un port éphémère (49712), seul le serveur utilise le port connu (80).</li>
    <li>Croire qu’UDP est « moins bien » que TCP : il est plus adapté quand la rapidité compte plus que la garantie (voix, DNS).</li>
    <li>Conclure qu’un serveur est en panne quand le port ne répond pas : regarder d’abord si la connexion est <strong>refusée</strong> (service arrêté) ou <strong>filtrée</strong> (pare-feu).</li>
  </ul>
</div>

<h1>DHCP : l’adressage automatique</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : <a href="#p1">partie 1</a> (UDP, ports), chapitre 2 (adresse, masque, passerelle, diffusion, APIPA). Une capture est fournie. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">DHCP</div><ul>
  <li><span><b>Le besoin</b> : configurer des centaines de postes sans erreur</span></li>
  <li><span><b>DORA</b> : Discover, Offer, Request, Ack</span></li>
  <li><span><b>Le bail</b> : durée, renouvellement à 50 % et 87,5 %</span></li>
  <li><span><b>Le serveur</b> : étendue, exclusions, réservations, options</span></li>
  <li><span><b>Le relais</b> : un serveur pour plusieurs réseaux</span></li>
</ul></div></figure>

<p class="lead">Configurer à la main l’adresse, le masque, la passerelle et le DNS de 300 appareils, dont les smartphones des visiteurs, est impossible et source d’erreurs (adresses en double, mauvais masque : tickets T1 à T4 du TP 5). <strong>DHCP</strong> (<em>Dynamic Host Configuration Protocol</em>, RFC 2131) distribue automatiquement cette configuration. À la M2L, les postes des ligues sont en adressage automatique, et c’est le serveur d’annuaire et de fichiers de l’administration qui assure le DHCP.</p>

<h2>Ce que fournit DHCP</h2>
<p>Un serveur DHCP <strong>prête</strong> une adresse IP pour une durée limitée, le <strong>bail</strong>, accompagnée d’<strong>options</strong> numérotées :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Option</th><th>Contenu</th><th>Exemple (réseau de test)</th></tr>
  <tr><td>—</td><td>Adresse IP attribuée (champ <em>yiaddr</em> du message)</td><td class="mono">192.168.50.30</td></tr>
  <tr><td>1</td><td>Masque de sous-réseau</td><td class="mono">255.255.255.192</td></tr>
  <tr><td>3</td><td>Routeur (passerelle par défaut)</td><td class="mono">192.168.50.62</td></tr>
  <tr><td>6</td><td>Serveur(s) DNS</td><td class="mono">192.168.50.20</td></tr>
  <tr><td>15</td><td>Nom de domaine (suffixe DNS)</td><td class="mono">m2l.lan</td></tr>
  <tr><td>51</td><td>Durée du bail (en secondes)</td><td class="mono">691200 (8 jours)</td></tr>
  <tr><td>54</td><td>Identifiant du serveur DHCP</td><td class="mono">192.168.50.20</td></tr>
</table></div>
<p>DHCP utilise <strong>UDP</strong> : port <strong>67</strong> pour le serveur, <strong>68</strong> pour le client. Il ne peut pas utiliser TCP : au début de l’échange, le client n’a même pas d’adresse IP.</p>

<h2>L’échange DORA</h2>
<ol class="steps">
  <li><strong>Discover</strong> (découverte) : le client, sans adresse, envoie en <strong>diffusion</strong> « y a-t-il un serveur DHCP ? ». Adresse IP source <code>0.0.0.0</code>, destination <code>255.255.255.255</code>, adresse MAC de destination <code>ff:ff:ff:ff:ff:ff</code>. Le message contient l’adresse MAC du client.</li>
  <li><strong>Offer</strong> (offre) : chaque serveur qui a une adresse libre propose une configuration (adresse, masque, options, bail).</li>
  <li><strong>Request</strong> (demande) : le client choisit une offre et la demande, <strong>encore en diffusion</strong>, en citant le serveur choisi (option 54). Les autres serveurs comprennent ainsi que leur offre est refusée et libèrent l’adresse proposée.</li>
  <li><strong>Ack</strong> (acquittement) : le serveur choisi confirme. Le client vérifie souvent que personne n’utilise déjà l’adresse (requête ARP « sonde »), puis configure sa carte. Si l’adresse n’est plus disponible, le serveur répond <strong>NAK</strong> et le client recommence.</li>
</ol>
<p>Les quatre messages d’un même échange portent le même <strong>identifiant de transaction</strong> (<em>Transaction ID</em>, choisi par le client).</p>

<h3>Observer un échange DHCP</h3>
<p>Le poste PC-ADM vient d’être branché sur le réseau de test ; le serveur DHCP est SRV-WIN (<code>192.168.50.20</code>). Une minute plus tard, l’utilisateur a tapé <code>ipconfig /renew</code>.</p>

<div class="answer" data-id="a-dhcp-ack" data-kind="code" data-label="Lire le contenu d’un acquittement DHCP" data-min="120" data-rows="9">
  <p>Déplier la trame 4 (<em>Dynamic Host Configuration Protocol</em>) et relever : l’adresse attribuée (<em>Your (client) IP address</em>), le masque, la passerelle, le serveur DNS, le nom de domaine, la durée du bail, les durées de renouvellement (options 58 et 59). Convertir les durées en jours et calculer le rapport entre chaque durée de renouvellement et la durée du bail.</p>
  <div class="corr">
    <pre class="code">Adresse attribuée : 192.168.50.30
Masque (1)        : 255.255.255.192
Routeur (3)       : 192.168.50.62
DNS (6)           : 192.168.50.20
Domaine (15)      : m2l.lan
Bail (51)         : 691 200 s = 691 200 / 86 400 = 8 jours
Renouvellement T1 (58) : 345 600 s = 4 jours  → 50 % du bail
Liaison T2 (59)        : 604 800 s = 7 jours  → 87,5 % du bail</pre>
    <p>8 jours est la durée de bail par défaut du serveur DHCP de Windows Server.</p>
  </div>
</div>

<h2>La vie d’un bail</h2>
<dl class="def">
  <dt>T1, 50 % du bail : renouvellement</dt><dd>Le client demande au serveur qui lui a prêté l’adresse de prolonger le bail, par un Request <strong>en envoi individuel</strong> (trame 7 : il a une adresse, il connaît le serveur). Le serveur répond Ack : le bail repart pour sa durée complète.</dd>
  <dt>T2, 87,5 % du bail : nouvelle liaison</dt><dd>Si le serveur n’a pas répondu, le client demande en diffusion à n’importe quel serveur DHCP.</dd>
  <dt>Fin du bail</dt><dd>Sans réponse, le client doit cesser d’utiliser l’adresse. Un poste Windows sans serveur DHCP se donne alors une adresse APIPA <code>169.254.x.x</code> (chapitre 2).</dd>
  <dt>Libération</dt><dd>Un client peut rendre son adresse avant la fin (message <strong>Release</strong>, par exemple avec <code>ipconfig /release</code>).</dd>
</dl>
<p>Choisir la durée du bail : courte (1 à 8 heures) pour un réseau où les appareils changent souvent, comme le <strong>Wi-Fi visiteurs</strong>, sinon les adresses restent réservées à des appareils partis depuis longtemps ; longue (plusieurs jours) pour des postes fixes, ce qui réduit le trafic et la dépendance au serveur.</p>

<h3>Côté client</h3>
<pre class="code terminal"><span class="cm"># Windows</span>
<span class="pr">C:\&gt;</span> ipconfig /all
   DHCP activé. . . . . . . . . . . . . . : Oui
   Adresse IPv4. . . . . . . . . . . . . .: 192.168.50.30(préféré)
   Bail obtenu. . . . . . . . . . . . . . : jeudi 29 octobre 2026 09:38:00
   Bail expirant. . . . . . . . . . . . . : vendredi 6 novembre 2026 09:38:00
   Passerelle par défaut. . . . . . . . . : 192.168.50.62
   Serveur DHCP . . . . . . . . . . . . . : 192.168.50.20
   Serveurs DNS. . .  . . . . . . . . . . : 192.168.50.20
<span class="pr">C:\&gt;</span> ipconfig /release     <span class="cm"># rendre l’adresse</span>
<span class="pr">C:\&gt;</span> ipconfig /renew       <span class="cm"># demander ou renouveler une adresse</span>

<span class="cm"># Debian (carte déclarée « inet dhcp » dans /etc/network/interfaces)</span>
<span class="pr">$</span> sudo ifdown enp0s3 &amp;&amp; sudo ifup enp0s3
<span class="pr">$</span> ip address show enp0s3      <span class="cm"># « dynamic » : adresse obtenue par DHCP, avec sa durée restante</span>
<span class="pr">$</span> cat /etc/resolv.conf        <span class="cm"># le serveur DNS reçu</span></pre>

<h2>Le serveur DHCP</h2>
<dl class="def">
  <dt>Étendue <small>scope, pool</small></dt><dd>La plage d’adresses que le serveur peut distribuer dans un réseau, avec son masque. Exemple : <code>192.168.50.30</code> à <code>192.168.50.59</code>. Il faut <strong>une étendue par réseau</strong> à servir.</dd>
  <dt>Exclusion</dt><dd>Adresses de l’étendue que le serveur ne distribue jamais, parce qu’elles sont configurées à la main sur des équipements (serveurs, imprimantes, passerelle).</dd>
  <dt>Réservation</dt><dd>Adresse toujours attribuée au même appareil, reconnu par son <strong>adresse MAC</strong>. L’appareil reste en DHCP, mais garde une adresse fixe : pratique pour une imprimante, que l’on gère alors depuis le serveur.</dd>
  <dt>Options d’étendue et options de serveur</dt><dd>Les options d’<strong>étendue</strong> (routeur, par exemple) ne s’appliquent qu’à ce réseau ; les options de <strong>serveur</strong> (DNS, domaine) s’appliquent à toutes les étendues. Une option de réservation l’emporte sur une option d’étendue, qui l’emporte sur une option de serveur.</dd>
</dl>
<div class="aside caution">
  <p class="aside-title">Deux serveurs DHCP sur un réseau, c’est la panne assurée</p>
  <p>Un client prend la <strong>première</strong> offre reçue. Si deux serveurs distribuent des configurations différentes (une box branchée par erreur, un serveur de test oublié), une partie des postes reçoit une mauvaise passerelle ou un mauvais réseau. Un serveur DHCP non autorisé est aussi une technique d’attaque (<strong>faux serveur DHCP</strong>, <em>rogue DHCP</em>) : il se déclare comme passerelle et intercepte le trafic. La parade sur les commutateurs, la <strong>surveillance DHCP</strong> (<em>DHCP snooping</em>), sera vue dans le chapitre consacré à la cybersécurité. Pour la tolérance de panne, Windows Server propose un vrai mécanisme de <strong>basculement DHCP</strong> entre deux serveurs qui partagent la même étendue.</p>
</div>

<h2>Le relais DHCP : un serveur pour plusieurs réseaux</h2>
<p>Le Discover est une <strong>diffusion</strong> : il ne traverse pas les routeurs (chapitre 2). Or, à la M2L, le serveur DHCP est dans le réseau des serveurs (<code>172.16.2.224/28</code>) et doit servir l’administration, la salle multimédia, les 24 ligues… Plutôt qu’un serveur par réseau, on configure un <strong>relais DHCP</strong> (<em>DHCP relay agent</em>) sur le routeur :</p>
<ol class="steps">
  <li>Le routeur reçoit le Discover sur son interface du réseau du client (par exemple la salle multimédia, <code>172.16.2.222</code>).</li>
  <li>Il le transmet <strong>en envoi individuel</strong> au serveur DHCP, en inscrivant dans le champ <strong>giaddr</strong> l’adresse de son interface côté client.</li>
  <li>Grâce à giaddr, le serveur sait de quel réseau vient la demande et choisit <strong>la bonne étendue</strong>. Il répond au relais, qui transmet au client.</li>
</ol>
<pre class="code terminal"><span class="pr">R1(config)#</span> interface GigabitEthernet0/0/1
<span class="pr">R1(config-if)#</span> ip address 172.16.2.222 255.255.255.224
<span class="pr">R1(config-if)#</span> ip helper-address 172.16.2.225</pre>
<p>Sur un routeur Cisco, la commande <code>ip helper-address</code> active le relais vers le serveur indiqué. On la mettra en œuvre dans Packet Tracer au <a href="#tp8">TP 8</a>.</p>

<div class="answer" data-id="a-etendue" data-label="Concevoir l’étendue DHCP de la salle multimédia" data-min="150" data-rows="9">
  <p>Le serveur DHCP de la M2L (<code>172.16.2.225</code>, réseau des serveurs) doit servir la salle multimédia, dont le réseau est <code>172.16.2.192/27</code> (passerelle <code>.222</code>, imprimante en <code>.193</code> : plan du TP 6). Le serveur DNS est aussi <code>172.16.2.225</code>, et le domaine interne <code>m2l.lan</code>. Proposer : l’étendue (début, fin, masque), les exclusions ou réservations éventuelles, les options d’étendue, une durée de bail justifiée, et ce qu’il faut configurer sur le routeur pour que les PC de la salle obtiennent une adresse.</p>
  <div class="corr">
    <ul>
      <li><strong>Étendue</strong> : <code>172.16.2.194</code> à <code>172.16.2.221</code>, masque <code>255.255.255.224</code> (28 adresses pour 25 PC).</li>
      <li><strong>Imprimante</strong> : soit hors étendue avec une adresse fixe <code>.193</code> configurée sur l’imprimante, soit une étendue de <code>.193</code> à <code>.221</code> avec une <strong>réservation</strong> de <code>.193</code> pour l’adresse MAC de l’imprimante. La passerelle <code>.222</code> est hors étendue.</li>
      <li><strong>Options</strong> : 003 routeur <code>172.16.2.222</code> ; 006 DNS <code>172.16.2.225</code> ; 015 domaine <code>m2l.lan</code> (ces deux dernières peuvent être des options de serveur, communes à toutes les étendues).</li>
      <li><strong>Bail</strong> : par exemple 8 heures ou 1 jour. Les PC de la salle sont fixes, un bail long conviendrait aussi ; une durée courte limite surtout les problèmes si des visiteurs branchent leur propre portable. Toute justification cohérente est acceptée.</li>
      <li><strong>Routeur</strong> : un relais DHCP sur l’interface de la salle multimédia, <code>ip helper-address 172.16.2.225</code>. Sans lui, les Discover restent dans la salle et les PC finissent en APIPA.</li>
    </ul>
  </div>
</div>

<div class="aside deep">
  <p class="aside-title">Et en IPv6 ?</p>
  <p>En IPv6, l’adressage automatique repose d’abord sur l’<strong>annonce de routeur</strong> et SLAAC (chapitre 2, partie 7). <strong>DHCPv6</strong> (ports UDP 546 et 547) vient en complément : pour fournir seulement les serveurs DNS (sans état), ou aussi les adresses (avec état), selon les drapeaux O et M de l’annonce. La passerelle, elle, n’est jamais fournie par DHCPv6 : elle vient toujours de l’annonce de routeur.</p>
</div>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Oublier d’exclure les adresses fixes (serveurs, imprimantes, passerelle) de l’étendue : le serveur les distribue, d’où des conflits d’adresses.</li>
    <li>Croire qu’un Discover traverse le routeur : sans relais (<code>ip helper-address</code>), un réseau sans serveur DHCP local ne reçoit aucune adresse.</li>
    <li>Oublier les options 003 et 006 : les postes obtiennent une adresse mais ne sortent pas du réseau, ou ne résolvent aucun nom.</li>
  </ul>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p2" data-title="DHCP" data-label="Quiz de fin de partie">
  <div class="q" data-ok="2">
    <p class="qt">Dans quel ordre se déroule l’échange DHCP initial ?</p>
    <ul><li>Request, Offer, Discover, Ack</li><li>Discover, Offer, Request, Ack</li><li>Discover, Request, Offer, Ack</li><li>Offer, Discover, Ack, Request</li></ul>
    <div class="expl"><p>DORA : Discover, Offer, Request, Ack.</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Quelle est l’adresse IP source d’un message DHCP Discover ?</p>
    <ul><li>L’adresse du serveur DHCP</li><li>255.255.255.255</li><li>0.0.0.0</li><li>169.254.0.1</li></ul>
    <div class="expl"><p>Le client n’a pas encore d’adresse : source <code>0.0.0.0</code>, destination <code>255.255.255.255</code>.</p></div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Un bail de 24 heures a été obtenu à 8 h. À quelle heure le client tente-t-il de le renouveler pour la première fois ?</p>
    <ul><li>20 h (50 % du bail)</li><li>8 h le lendemain</li><li>2 h du matin (75 %)</li><li>9 h (1 heure après)</li></ul>
    <div class="expl"><p>T1 = 50 % du bail : 12 heures après l’obtention, soit à 20 h.</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Comment garantir que l’imprimante d’une ligue obtienne toujours la même adresse tout en restant en DHCP ?</p>
    <ul><li>Une exclusion</li><li>Une option 003</li><li>Un bail infini pour tous les clients</li><li>Une réservation liée à son adresse MAC</li></ul>
    <div class="expl"><p>La réservation associe une adresse IP à une adresse MAC. Une exclusion, au contraire, empêche le serveur de distribuer l’adresse.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Les postes d’une nouvelle ligue sont tous en <code>169.254.x.x</code>, alors que les étendues sont correctes sur le serveur DHCP placé dans un autre réseau. Que vérifier en priorité ?</p>
    <ul><li>Le serveur DNS</li><li>Le relais DHCP (<code>ip helper-address</code>) sur l’interface du routeur côté ligue</li><li>La durée du bail</li><li>L’option 015</li></ul>
    <div class="expl"><p>Les Discover sont des diffusions arrêtées par le routeur. Sans relais sur l’interface de ce réseau, aucune demande n’atteint le serveur.</p></div>
  </div>
</div>

  <p class="aside-title">La suite</p>

</div>
