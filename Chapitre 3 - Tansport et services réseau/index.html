<template data-page="p3">
<h1>DNS : des noms aux adresses</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : <a href="#p1">partie 1</a> (UDP, port 53) et <a href="#p2">partie 2</a> (le serveur DNS est fourni par DHCP, option 006). Une capture est fournie. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">DNS</div><ul>
  <li><span><b>Espace de noms</b> : racine, domaines de premier niveau, domaines, FQDN</span></li>
  <li><span><b>Serveurs</b> : résolveurs et serveurs faisant autorité</span></li>
  <li><span><b>Résolution</b> : récursive, itérative, cache, TTL</span></li>
  <li><span><b>Enregistrements</b> : A, AAAA, CNAME, MX, NS, SOA, PTR</span></li>
  <li><span><b>Outils</b> : nslookup, Resolve-DnsName, dig</span></li>
</ul></div></figure>

<p class="lead">Les utilisateurs retiennent <code>intranet.m2l.lan</code> ou <code>www.lorraine-sport.net</code>, pas <code>192.168.50.10</code>. Le <strong>DNS</strong> (<em>Domain Name System</em>, RFC 1034 et 1035) traduit les noms en adresses, et inversement. C’est un service si central qu’une panne DNS ressemble pour l’utilisateur à une panne totale : « Internet ne marche plus », alors que le réseau fonctionne.</p>

<h2>Pourquoi un système de noms ?</h2>
<p>Aux débuts d’Internet, chaque machine avait un fichier <code>hosts</code> qui listait tous les noms et leurs adresses, téléchargé régulièrement depuis un serveur central. Avec la croissance du réseau, ce fichier est devenu ingérable. Le DNS (1983) l’a remplacé par une <strong>base de données répartie</strong> : chaque organisation gère ses propres noms, sur ses propres serveurs.</p>
<p>Le fichier <code>hosts</code> existe toujours (<code>C:\Windows\System32\drivers\etc\hosts</code> sous Windows, <code>/etc/hosts</code> sous Linux) et il est consulté <strong>avant</strong> le DNS. Une ligne oubliée dans ce fichier peut expliquer qu’un seul poste « voie » un site à une mauvaise adresse : c’est un point de contrôle en dépannage, et un fichier visé par certains logiciels malveillants.</p>

<h2>L’espace de noms</h2>
<p>Les noms forment un <strong>arbre</strong>, que l’on lit de droite à gauche :</p>
<pre class="code">www.lorraine-sport.net.
                     └─ la racine (le point final, en général omis)
                  └──── net : domaine de premier niveau (TLD)
     └───────────────── lorraine-sport : domaine de la M2L
 └───────────────────── www : nom d’une machine (ou d’un service)</pre>
<dl class="def">
  <dt>Racine</dt><dd>Le sommet de l’arbre, noté par un point. Elle est servie par 13 identités de serveurs racines (a.root-servers.net à m.root-servers.net), répliquées en centaines d’exemplaires dans le monde.</dd>
  <dt>Domaine de premier niveau <small>TLD</small></dt><dd>Génériques (<code>.com</code>, <code>.org</code>, <code>.net</code>) ou nationaux (<code>.fr</code>, géré par l’AFNIC ; <code>.de</code>…).</dd>
  <dt>Domaine, sous-domaine</dt><dd><code>lorraine-sport.net</code> est un domaine, réservé auprès d’un bureau d’enregistrement ; l’organisation peut y créer des sous-domaines (<code>volley.lorraine-sport.net</code>).</dd>
  <dt>FQDN <small>nom de domaine complètement qualifié</small></dt><dd>Le nom complet d’une machine, jusqu’à la racine : <code>srv-deb.m2l.lan.</code> Un nom court (<code>srv-deb</code>) est complété par le <strong>suffixe DNS</strong> du poste (option DHCP 015).</dd>
  <dt>Zone</dt><dd>La partie de l’arbre dont un serveur a la responsabilité, décrite dans un fichier ou une base : la zone <code>m2l.lan</code> sur SRV-WIN. Le serveur est alors <strong>faisant autorité</strong> pour cette zone.</dd>
  <dt>Délégation</dt><dd>Un serveur confie une sous-partie de l’arbre à d’autres serveurs, par des enregistrements NS : la racine délègue <code>.net</code>, qui délègue <code>lorraine-sport.net</code> aux serveurs choisis par la M2L.</dd>
</dl>
<div class="aside deep">
  <p class="aside-title">Quel nom pour le réseau interne ?</p>
  <p>Beaucoup de réseaux internes utilisent un domaine inventé comme <code>m2l.lan</code> (ce que fait ce cours, comme de nombreux contextes pédagogiques). Ce domaine n’existe pas sur Internet : il n’est connu que des serveurs DNS internes. Deux bonnes pratiques modernes : utiliser un <strong>sous-domaine d’un domaine que l’on possède</strong> (<code>ad.lorraine-sport.net</code>), ou le domaine de premier niveau <code>.internal</code>, réservé par l’ICANN en 2024 aux usages privés. À éviter : <code>.local</code>, utilisé par le protocole mDNS (découverte automatique des imprimantes, des appareils Apple), qui entre en conflit avec un DNS classique.</p>
</div>

<h2>Les serveurs DNS et la résolution</h2>
<dl class="def">
  <dt>Client DNS <small>stub resolver</small></dt><dd>La partie du système d’exploitation qui pose les questions. Il interroge le serveur DNS configuré (par DHCP ou à la main) et garde les réponses en cache.</dd>
  <dt>Résolveur <small>serveur récursif</small></dt><dd>Serveur qui accepte de chercher la réponse complète pour le client, en interrogeant d’autres serveurs, puis la garde en cache. Celui de la box, de l’opérateur, ou le serveur DNS de l’organisation.</dd>
  <dt>Serveur faisant autorité</dt><dd>Serveur qui détient la zone et répond avec certitude pour ses noms (drapeau <strong>AA</strong>, <em>Authoritative Answer</em>, dans la réponse).</dd>
</dl>
<h3>Exemple : résoudre <code>www.lorraine-sport.net</code></h3>
<ol class="steps">
  <li>Le poste consulte son cache et son fichier <code>hosts</code>. Rien : il demande au résolveur de la M2L « adresse de <code>www.lorraine-sport.net</code> ? ». C’est une requête <strong>récursive</strong> : « trouve-moi la réponse ».</li>
  <li>Le résolveur n’a rien en cache. Il demande à un <strong>serveur racine</strong>, qui répond : « je ne sais pas, mais voici les serveurs de <code>.net</code> ». C’est une requête <strong>itérative</strong> : on obtient une indication, pas la réponse.</li>
  <li>Il demande à un serveur de <code>.net</code> : « voici les serveurs de <code>lorraine-sport.net</code> ».</li>
  <li>Il demande au serveur faisant autorité de <code>lorraine-sport.net</code>, qui répond l’adresse.</li>
  <li>Le résolveur met la réponse en <strong>cache</strong> pour la durée indiquée (le <strong>TTL</strong>, en secondes), puis la transmet au poste, qui la met aussi en cache.</li>
</ol>
<p>Les demandes suivantes, pour le même nom ou pour un nom du même domaine, sont beaucoup plus rapides grâce aux caches. Revers : quand on change une adresse, les anciennes réponses restent en cache jusqu’à l’expiration du TTL. On baisse donc le TTL quelques heures <strong>avant</strong> un changement prévu.</p>
<p>Transport : <strong>UDP port 53</strong> pour les questions courantes ; <strong>TCP port 53</strong> pour les réponses trop grandes et pour les <strong>transferts de zone</strong> (copie d’une zone vers un serveur secondaire). Les versions chiffrées, DNS sur TLS (port 853) et DNS sur HTTPS (port 443), protègent la confidentialité des questions.</p>

<div class="answer" data-id="a-resolution" data-label="Expliquer une résolution DNS et le rôle du cache" data-min="120" data-rows="7">
  <p>Un utilisateur de la ligue de volley ouvre <code>www.ffvolley.org</code> pour la première fois de la journée ; dix secondes plus tard, son collègue ouvre le même site. a) Décrire les échanges DNS dans le premier cas, en précisant qui fait une requête récursive et qui fait des requêtes itératives. b) Qu’est-ce qui change pour le collègue ? c) Le site change d’adresse IP à midi, avec un TTL de 86 400 s. Quel problème peut-on observer, et comment l’éviter ?</p>
  <div class="corr">
    <p>a) Le poste envoie une requête <strong>récursive</strong> au résolveur de la M2L. Le résolveur, sans réponse en cache, fait des requêtes <strong>itératives</strong> : racine (qui le renvoie vers <code>.org</code>), serveur de <code>.org</code> (qui le renvoie vers les serveurs de <code>ffvolley.org</code>), puis serveur faisant autorité de <code>ffvolley.org</code>, qui donne l’adresse. Le résolveur la met en cache et la renvoie au poste.</p>
    <p>b) Le résolveur a la réponse en cache : il répond immédiatement au collègue, sans interroger la racine ni les autres serveurs.</p>
    <p>c) 86 400 s = 24 heures : des résolveurs et des postes peuvent garder l’ancienne adresse jusqu’à 24 heures après le changement, et le site semble « en panne » pour certains utilisateurs seulement. Il faut baisser le TTL (par exemple à 300 s) au moins 24 heures avant le changement, puis le remonter ensuite. Pour un poste précis, on peut vider son cache (<code>ipconfig /flushdns</code>).</p>
  </div>
</div>

<h2>Les enregistrements</h2>
<p>Une zone est une liste d’<strong>enregistrements de ressource</strong> (<em>resource records</em>) : nom, durée de vie (TTL), classe (<code>IN</code>, Internet), type, valeur.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Type</th><th>Rôle</th><th>Exemple</th></tr>
  <tr><td><strong>A</strong></td><td>Nom → adresse IPv4</td><td class="mono">srv-deb.m2l.lan.  IN A  192.168.50.10</td></tr>
  <tr><td><strong>AAAA</strong></td><td>Nom → adresse IPv6</td><td class="mono">srv-deb.m2l.lan.  IN AAAA  2001:db8:acad:50::10</td></tr>
  <tr><td><strong>CNAME</strong></td><td>Alias : un nom qui renvoie vers un autre nom</td><td class="mono">www.m2l.lan.  IN CNAME  srv-deb.m2l.lan.</td></tr>
  <tr><td><strong>MX</strong></td><td>Serveur de messagerie du domaine, avec une priorité (le plus petit nombre est essayé d’abord)</td><td class="mono">lorraine-sport.net.  IN MX 10 mail.lorraine-sport.net.</td></tr>
  <tr><td><strong>NS</strong></td><td>Serveur faisant autorité pour la zone (sert aussi aux délégations)</td><td class="mono">m2l.lan.  IN NS  srv-win.m2l.lan.</td></tr>
  <tr><td><strong>SOA</strong></td><td>Début de l’autorité : serveur principal, adresse du responsable, numéro de série et durées de la zone. Un seul par zone.</td><td class="mono">m2l.lan.  IN SOA  srv-win.m2l.lan. hostmaster.m2l.lan. (…)</td></tr>
  <tr><td><strong>PTR</strong></td><td>Résolution <strong>inverse</strong> : adresse → nom, dans une zone spéciale</td><td class="mono">10.50.168.192.in-addr.arpa.  IN PTR  srv-deb.m2l.lan.</td></tr>
  <tr><td>TXT, SRV</td><td>Texte libre (vérifications, politique anti-usurpation des courriels SPF) ; localisation de services (Active Directory publie ses contrôleurs de domaine par des SRV)</td><td class="mono">_ldap._tcp.m2l.lan.  IN SRV 0 100 389 srv-win.m2l.lan.</td></tr>
</table></div>
<p>La résolution inverse utilise la zone <code>in-addr.arpa</code>, dans laquelle l’adresse est écrite <strong>à l’envers</strong> (pour respecter la lecture de droite à gauche de l’arbre) : l’adresse <code>192.168.50.10</code> devient <code>10.50.168.192.in-addr.arpa</code>. En IPv6, la zone est <code>ip6.arpa</code>.</p>

<h3>Une zone complète</h3>
<p>Fichier de zone au format standard (celui du serveur BIND ; le serveur DNS de Windows stocke la même information, gérée depuis sa console ou PowerShell) :</p>
<pre class="code"><span class="cm">; Zone m2l.lan — réseau de test</span>
$TTL 3600
@         IN SOA   srv-win.m2l.lan. hostmaster.m2l.lan. (
                   2026102401 <span class="cm">; numéro de série (date + numéro)</span>
                   900        <span class="cm">; rafraîchissement des secondaires</span>
                   600        <span class="cm">; nouvel essai</span>
                   86400      <span class="cm">; expiration</span>
                   3600 )     <span class="cm">; durée de cache des réponses négatives</span>
          IN NS    srv-win.m2l.lan.
srv-win   IN A     192.168.50.20
srv-deb   IN A     192.168.50.10
www       IN CNAME srv-deb
intranet  IN CNAME srv-deb</pre>
<p><code>@</code> désigne la zone elle-même ; un nom sans point final (<code>srv-deb</code>) est complété par le nom de la zone. <strong>Oublier le point final</strong> d’un nom complet est une erreur classique : <code>srv-deb.m2l.lan</code> sans point deviendrait <code>srv-deb.m2l.lan.m2l.lan</code>.</p>

<div class="match" data-id="m-rr" data-label="Choisir le type d’enregistrement adapté" data-options="A|AAAA|CNAME|MX|NS|PTR">
  <div class="r" data-ok="A" data-expl="Nom → adresse IPv4 : enregistrement A.">Associer srv-win.m2l.lan à 192.168.50.20</div>
  <div class="r" data-ok="CNAME" data-expl="Un deuxième nom pour la même machine : alias CNAME.">Faire répondre intranet.m2l.lan avec la même machine que srv-deb.m2l.lan</div>
  <div class="r" data-ok="MX" data-expl="Le serveur qui reçoit le courrier d’un domaine est indiqué par un MX.">Indiquer quel serveur reçoit les courriels adressés à …@lorraine-sport.net</div>
  <div class="r" data-ok="PTR" data-expl="Adresse → nom : résolution inverse, enregistrement PTR.">Permettre de retrouver le nom de la machine 192.168.50.10</div>
  <div class="r" data-ok="AAAA" data-expl="Nom → adresse IPv6 : AAAA (quatre fois plus long qu’une adresse IPv4).">Associer srv-deb.m2l.lan à 2001:db8:acad:50::10</div>
  <div class="r" data-ok="NS" data-expl="Le serveur faisant autorité d’une zone est déclaré par un NS.">Déclarer que srv-win.m2l.lan fait autorité pour la zone m2l.lan</div>
</div>

<h2>Interroger le DNS</h2>
<pre class="code terminal"><span class="cm"># Windows</span>
<span class="pr">C:\&gt;</span> nslookup www.m2l.lan
Serveur :   srv-win.m2l.lan
Address:  192.168.50.20

Nom :    srv-deb.m2l.lan
Address:  192.168.50.10
Aliases:  www.m2l.lan

<span class="pr">C:\&gt;</span> nslookup www.m2l.lan 192.168.50.20     <span class="cm"># interroger un serveur précis</span>
<span class="pr">PS C:\&gt;</span> Resolve-DnsName www.m2l.lan -Type A
<span class="pr">C:\&gt;</span> ipconfig /displaydns                    <span class="cm"># voir le cache du poste</span>
<span class="pr">C:\&gt;</span> ipconfig /flushdns                      <span class="cm"># vider le cache</span>

<span class="cm"># Linux (paquet bind9-dnsutils pour dig et nslookup)</span>
<span class="pr">$</span> dig www.m2l.lan
;; -&gt;&gt;HEADER&lt;&lt;- opcode: QUERY, status: NOERROR, id: 31265
;; flags: qr aa rd ra; QUERY: 1, ANSWER: 2, AUTHORITY: 0, ADDITIONAL: 1
;; ANSWER SECTION:
www.m2l.lan.            3600    IN      CNAME   srv-deb.m2l.lan.
srv-deb.m2l.lan.        3600    IN      A       192.168.50.10
;; SERVER: 192.168.50.20#53(192.168.50.20) (UDP)
<span class="pr">$</span> dig -x 192.168.50.10 +short    <span class="cm"># résolution inverse</span>
<span class="pr">$</span> dig lorraine-sport.net MX
<span class="pr">$</span> getent hosts www.m2l.lan        <span class="cm"># comme une application : hosts puis DNS, sans paquet à installer</span>
<span class="pr">$</span> cat /etc/resolv.conf             <span class="cm"># serveur(s) DNS utilisé(s) et domaine de recherche</span></pre>
<p>Dans la sortie de <code>dig</code>, <code>status: NOERROR</code> signale une réponse normale, <code>NXDOMAIN</code> un nom inexistant, <code>SERVFAIL</code> un échec du serveur ; le drapeau <code>aa</code> indique une réponse faisant autorité. Sur Kubuntu, <code>/etc/resolv.conf</code> pointe vers <code>127.0.0.53</code> : c’est le cache local <em>systemd-resolved</em> ; les vrais serveurs s’affichent avec <code>resolvectl status</code>.</p>

<h3>Observer des requêtes DNS</h3>
<p>Le poste PC-ADM interroge le serveur DNS SRV-WIN : il ouvre <code>www.m2l.lan</code>, cherche une imprimante qui n’est pas déclarée, puis l’administrateur fait une recherche inverse sur <code>192.168.50.10</code>.</p>

<div class="answer" data-id="a-dnscap" data-label="Analyser une réponse DNS dans Wireshark" data-min="100" data-rows="6">
  <p>Déplier la trame 2 dans Wireshark (<em>Domain Name System (response)</em>). Relever : le protocole de transport et les ports ; l’identifiant de transaction et son rôle ; les drapeaux importants (réponse faisant autorité ? récursion disponible ?) ; le TTL des enregistrements, en heures. Pourquoi le poste a-t-il envoyé ensuite la question de la trame 3 ?</p>

    <p>UDP, du port 53 (serveur) vers le port 51544 (port éphémère du client). Identifiant 0x7a21, le même que la question : il permet au client d’associer la réponse à sa question. Drapeaux : <em>Authoritative</em> = oui (SRV-WIN détient la zone m2l.lan), <em>Recursion desired</em> et <em>Recursion available</em> = oui. TTL 3 600 s = 1 heure. La trame 3 demande l’adresse <strong>IPv6</strong> (AAAA) : les systèmes en double pile demandent les deux types d’adresses et préfèrent IPv6 quand elle existe.</p>

<h2>Diagnostiquer un problème de noms</h2>
<ul>
  <li><strong>L’adresse IP répond, pas le nom</strong> : problème DNS (méthode du chapitre 2). Vérifier le serveur DNS configuré (<code>ipconfig /all</code>), puis interroger directement ce serveur avec <code>nslookup nom serveur</code>.</li>
  <li><strong>NXDOMAIN</strong> : le nom n’existe pas dans la zone (faute de frappe, enregistrement oublié) ou le suffixe DNS est absent (nom court non complété).</li>
  <li><strong>Délai dépassé</strong> : le serveur DNS est injoignable ou arrêté (service, pare-feu sur le port 53).</li>
  <li><strong>Mauvaise adresse</strong> : cache encore valide (TTL), fichier <code>hosts</code> modifié, enregistrement erroné.</li>
</ul>
<div class="ctab" data-id="c-dnsdiag" data-head="Symptôme" data-cols="Cause la plus probable" data-choices="DNS|AUTRE" data-label="Problème de DNS ou autre cause">
  <div class="r" data-ok="DNS" data-expl="L’adresse répond, le nom non : la résolution échoue.">ping 192.168.50.10 répond, ping srv-deb.m2l.lan affiche « La requête Ping n’a pas pu trouver l’hôte ».</div>
  <div class="r" data-ok="AUTRE" data-expl="Ni le nom ni l’adresse ne répondent : problème réseau ou machine arrêtée, avant même le DNS.">ping srv-deb.m2l.lan et ping 192.168.50.10 échouent tous les deux par délai dépassé.</div>
  <div class="r" data-ok="DNS" data-expl="Le poste utilise encore l’ancienne adresse : cache DNS (TTL) ou fichier hosts.">Après le déplacement du serveur web, un seul poste continue à joindre l’ancienne adresse.</div>
  <div class="r" data-ok="DNS" data-expl="nslookup interroge le serveur DNS : NXDOMAIN signifie que l’enregistrement manque dans la zone.">nslookup intranet.m2l.lan répond « Non-existent domain ».</div>
  <div class="r" data-ok="AUTRE" data-expl="Le nom est bien résolu (bonne adresse) : c’est le service web qui ne répond pas (port fermé, service arrêté, pare-feu).">nslookup donne la bonne adresse, mais le navigateur affiche « Impossible de se connecter ».</div>
</div>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Confondre la requête récursive (le client au résolveur : « donne-moi la réponse ») et la requête itérative (le résolveur aux autres serveurs : « dis-moi où chercher »).</li>
    <li>Oublier le point final des noms complets dans un fichier de zone, ou oublier d’augmenter le numéro de série après une modification : les serveurs secondaires ne voient pas le changement.</li>
    <li>Croire que changer un enregistrement prend effet immédiatement partout : les caches gardent l’ancienne valeur jusqu’à la fin du TTL.</li>
  </ul>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p3" data-title="DNS" data-label="Quiz de fin de partie">
  <div class="q" data-ok="3">
    <p class="qt">Quel type d’enregistrement associe un nom à une adresse IPv6 ?</p>
    <ul><li>A</li><li>PTR</li><li>AAAA</li><li>CNAME</li></ul>
    <div class="expl"><p>AAAA pour IPv6, A pour IPv4, PTR pour la résolution inverse, CNAME pour un alias.</p></div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Quel enregistrement indique le serveur qui reçoit le courrier d’un domaine ?</p>
    <ul><li>MX</li><li>NS</li><li>SOA</li><li>A</li></ul>
    <div class="expl"><p>MX (<em>Mail eXchanger</em>), avec une priorité.</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Quel nom faut-il interroger pour la résolution inverse de l’adresse 172.16.2.225 ?</p>
    <ul><li>172.16.2.225.in-addr.arpa</li><li>225.2.16.172.ip6.arpa</li><li>in-addr.arpa.172.16.2.225</li><li>225.2.16.172.in-addr.arpa</li></ul>
    <div class="expl"><p>L’adresse s’écrit à l’envers dans la zone <code>in-addr.arpa</code> : <code>225.2.16.172.in-addr.arpa</code>.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Que signifie un TTL de 3 600 sur un enregistrement ?</p>
    <ul><li>Le nom expire dans 3 600 jours</li><li>La réponse peut être gardée en cache pendant 1 heure</li><li>Le serveur répond en 3 600 ms</li><li>Le paquet peut traverser 3 600 routeurs</li></ul>
    <div class="expl"><p>Le TTL d’un enregistrement DNS est la durée, en secondes, pendant laquelle une réponse peut être conservée en cache (sans rapport avec le TTL d’un paquet IP).</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Quel port et quel protocole utilise principalement une question DNS d’un poste ?</p>
    <ul><li>TCP 80</li><li>UDP 67</li><li>UDP 53</li><li>TCP 445</li></ul>
    <div class="expl"><p>UDP 53. TCP 53 sert aux grandes réponses et aux transferts de zone.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Un poste résout <code>srv-deb</code> (nom court) en <code>srv-deb.m2l.lan</code>. D’où vient le complément <code>m2l.lan</code> ?</p>
    <ul><li>Du fichier de zone</li><li>Du suffixe DNS du poste (par exemple fourni par l’option DHCP 015)</li><li>De l’enregistrement PTR</li><li>Du serveur racine</li></ul>
    <div class="expl"><p>Le client complète les noms courts avec son suffixe (domaine de recherche), configuré à la main ou reçu par DHCP (option 015).</p></div>
  </div>
</div>

  <p class="aside-title">La suite</p>
  <p>Place à la pratique : le <a href="#tp8">TP 8</a> fait installer un serveur DNS et un serveur DHCP, d’abord dans Packet Tracer, puis sur Windows Server 2019, et les tester depuis Debian.</p>
</div>

<h1>Installer et tester DHCP et DNS</h1>
<p class="lead">Le service informatique de la M2L veut que tous les réseaux reçoivent leur configuration automatiquement et que les serveurs soient joignables par leur nom. Il faut d’abord valider l’architecture sur une maquette Packet Tracer (un serveur central et un relais sur le routeur), puis installer réellement les rôles DNS et DHCP sur Windows Server 2019, les tester depuis Debian et préparer les réponses aux pannes les plus courantes.</p>

<div class="aside caution">
  <p class="aside-title">Consignes</p>
  <ul>
    <li>Outils : <strong>Cisco Packet Tracer</strong> (mission 1), <strong>VirtualBox</strong> avec SRV-WIN (Windows Server 2019, <code>192.168.50.20</code>) et SRV-DEB (Debian, <code>192.168.50.10</code>) sur le réseau interne <code>tp5</code> (missions 2 à 4).</li>
    <li><strong>Jamais de serveur DHCP en dehors du « Réseau interne »</strong> : vérifier le mode de la carte de SRV-WIN avant d’installer le rôle DHCP.</li>
    <li>Travail individuel, <strong>sans IA</strong>. Taper les commandes plutôt que les copier : il faudra savoir les réexpliquer.</li>
    <li>Pour chaque test : écrire le résultat attendu, puis le résultat obtenu.</li>
  </ul>
</div>

<h2>Préparation des machines virtuelles</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Installer les outils et prendre un instantané</summary>
  <div class="task-body">
    <p>Les machines virtuelles n’ont pas accès à Internet sur le réseau interne. On installe donc tout ce qui servira aux TP 8 et 9 en une seule fois.</p>
    <ol class="steps">
      <li>SRV-DEB éteinte : <em>Configuration &gt; Réseau &gt; Carte 1</em> en mode <strong>NAT</strong>. Démarrer, puis installer les paquets :<br><code>sudo apt update &amp;&amp; sudo apt install bind9-dnsutils curl apache2 smbclient</code></li>
      <li>Éteindre SRV-DEB et remettre la carte 1 en <strong>Réseau interne</strong> <code>tp5</code>. Vérifier au redémarrage qu’elle a bien gardé <code>192.168.50.10/26</code> (<code>ip a</code>).</li>
      <li>Sur SRV-WIN, renommer la machine si ce n’est pas déjà fait (le nom apparaîtra dans le DNS) : <code>Rename-Computer -NewName SRV-WIN -Restart</code> (PowerShell administrateur).</li>
      <li>Prendre un <strong>instantané</strong> de chaque machine virtuelle (VirtualBox : <em>Instantanés &gt; Prendre</em>), nommé <code>avant-TP8</code>. En cas de fausse manipulation, on revient en arrière en un clic : c’est la pratique professionnelle avant toute modification d’un serveur.</li>

<h2>Mission 1 : la maquette M2L dans Packet Tracer</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Un serveur DHCP et DNS central, un relais sur le routeur</summary>
  <div class="task-body">
    <p>On reprend trois réseaux du plan d’adressage du chapitre 2 (TP 6) :</p>
    <div class="tbl-wrap"><table class="data wide">
      <tr><th>Réseau</th><th>Adresse</th><th>Interface de R1 (passerelle)</th><th>Équipements</th></tr>
      <tr><td>Serveurs</td><td class="mono">172.16.2.224/28</td><td class="mono">G0/0/0 — 172.16.2.238</td><td>Serveur SRV-AD <code>172.16.2.225</code> (DHCP, DNS, web)</td></tr>
      <tr><td>Salle multimédia</td><td class="mono">172.16.2.192/27</td><td class="mono">G0/0/1 — 172.16.2.222</td><td>PC-MM1, PC-MM2 en DHCP</td></tr>
      <tr><td>Administration</td><td class="mono">172.16.2.128/26</td><td class="mono">G0/0/2 — 172.16.2.190</td><td>PC-ADM1 en DHCP</td></tr>
    </table></div>
    <ol class="steps">
      <li>Placer un routeur <strong>4331</strong> (R1), trois commutateurs 2960, un <strong>Server</strong> (<em>End Devices</em>) et trois PC. Câbler chaque interface de R1 vers le commutateur de son réseau.</li>
      <li>Configurer R1 (CLI) :</li>
    </ol>
    <pre class="code terminal">Router&gt; enable
Router# configure terminal
Router(config)# hostname R1
R1(config)# interface GigabitEthernet0/0/0
R1(config-if)# ip address 172.16.2.238 255.255.255.240
R1(config-if)# no shutdown
R1(config-if)# interface GigabitEthernet0/0/1
R1(config-if)# ip address 172.16.2.222 255.255.255.224
R1(config-if)# ip helper-address 172.16.2.225
R1(config-if)# no shutdown
R1(config-if)# interface GigabitEthernet0/0/2
R1(config-if)# ip address 172.16.2.190 255.255.255.192
R1(config-if)# ip helper-address 172.16.2.225
R1(config-if)# no shutdown
R1(config-if)# end
R1# copy running-config startup-config</pre>
    <ol class="steps">
      <li>Serveur SRV-AD : <em>Desktop &gt; IP Configuration</em>, en statique : <code>172.16.2.225</code>, masque <code>255.255.255.240</code>, passerelle <code>172.16.2.238</code>, DNS <code>172.16.2.225</code>.</li>
      <li>Onglet <em>Services &gt; DHCP</em> : <em>Service On</em>. Créer deux pools (remplir les champs, puis <em>Add</em>) ; ne pas modifier <em>serverPool</em>.
        <div class="tbl-wrap"><table class="data">
          <tr><th>Pool Name</th><th>Default Gateway</th><th>DNS Server</th><th>Start IP Address</th><th>Subnet Mask</th><th>Maximum Users</th></tr>
          <tr><td>Multimedia</td><td class="mono">172.16.2.222</td><td class="mono">172.16.2.225</td><td class="mono">172.16.2.194</td><td class="mono">255.255.255.224</td><td>28</td></tr>
          <tr><td>Administration</td><td class="mono">172.16.2.190</td><td class="mono">172.16.2.225</td><td class="mono">172.16.2.140</td><td class="mono">255.255.255.192</td><td>50</td></tr>
        </table></div>
      </li>
      <li>Onglet <em>Services &gt; DNS</em> : <em>DNS Service On</em>. Ajouter un enregistrement <code>srv-ad.m2l.lan</code> de type <em>A Record</em> vers <code>172.16.2.225</code>, puis <code>intranet.m2l.lan</code> de type <em>CNAME</em> vers <code>srv-ad.m2l.lan</code>.</li>
      <li>Onglet <em>Services &gt; HTTP</em> : vérifier que le service est actif (page par défaut).</li>
      <li>Sur chaque PC : <em>Desktop &gt; IP Configuration</em>, choisir <strong>DHCP</strong>. Attendre le message <em>DHCP request successful</em>.</li>
    </ol>
    <div class="answer" data-id="t8-pt" data-label="Mission 1 : jeu d’essai de la maquette et rôle du relais" data-min="150" data-rows="9">
      <p>a) Avant de tester, écrire la configuration attendue de PC-MM1 (adresse probable, masque, passerelle, DNS), puis la relever avec <code>ipconfig /all</code>. b) Tester depuis PC-ADM1 : <code>nslookup intranet.m2l.lan</code>, puis le navigateur (<em>Web Browser</em>) sur <code>http://intranet.m2l.lan</code>. c) Supprimer temporairement <code>ip helper-address</code> sur G0/0/2 (<code>no ip helper-address 172.16.2.225</code>) et refaire la demande DHCP de PC-ADM1. Expliquer le résultat. Remettre la commande. d) Comment le serveur sait-il qu’il doit répondre à PC-MM1 avec le pool <em>Multimedia</em> et non <em>Administration</em> ?</p>
      <p class="hint">c) Le mode Simulation (filtre DHCP) montre où s’arrête le Discover.</p>
      <div class="corr">
        <p>a) Attendu et obtenu : adresse dans le pool Multimedia, en général <code>172.16.2.194</code> pour le premier PC ; masque <code>255.255.255.224</code> ; passerelle <code>172.16.2.222</code> ; DNS <code>172.16.2.225</code>.</p>
        <p>b) <code>nslookup</code> indique le serveur <code>172.16.2.225</code> et la réponse <code>172.16.2.225</code> pour <code>intranet.m2l.lan</code> (via l’alias). Le navigateur affiche la page par défaut du serveur : DHCP (adresse, passerelle, DNS), routage, DNS et HTTP fonctionnent ensemble.</p>
        <p>c) Sans relais, PC-ADM1 n’obtient pas d’adresse (échec de la demande, puis adresse APIPA <code>169.254.x.x</code>). Le Discover est une diffusion : R1 ne la transmet pas au réseau des serveurs. En simulation, on le voit s’arrêter sur R1.</p>
        <p>d) Le relais inscrit l’adresse de l’interface qui a reçu la demande (<code>172.16.2.222</code> pour la salle multimédia) dans le champ <strong>giaddr</strong>. Le serveur choisit le pool dont la passerelle et le réseau correspondent à cette adresse.</p>
      </div>
    </div>
    <p>Enregistrer la maquette sous <code>TP8-NOM-Prenom.pkt</code>.</p>
  </div>
</details>

<h2>Mission 2 : le serveur DNS sur Windows Server 2019</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Créer la zone m2l.lan et sa zone inverse</summary>
  <div class="task-body">
    <p><strong>Méthode graphique</strong> : <em>Gestionnaire de serveur &gt; Gérer &gt; Ajouter des rôles et fonctionnalités</em>, rôle <strong>Serveur DNS</strong>. Puis <em>Outils &gt; DNS</em>, clic droit sur <em>Zones de recherche directe &gt; Nouvelle zone</em> : zone principale, nom <code>m2l.lan</code>, nouveau fichier, ne pas autoriser les mises à jour dynamiques. Créer ensuite les enregistrements (clic droit sur la zone : <em>Nouvel hôte (A ou AAAA)</em>, <em>Nouvel alias (CNAME)</em>).</p>
    <p><strong>Méthode PowerShell</strong> (administrateur), à documenter dans le compte rendu :</p>
    <pre class="code terminal"><span class="pr">PS C:\&gt;</span> Install-WindowsFeature DNS -IncludeManagementTools
<span class="pr">PS C:\&gt;</span> Add-DnsServerPrimaryZone -Name "m2l.lan" -ZoneFile "m2l.lan.dns"
<span class="pr">PS C:\&gt;</span> Add-DnsServerResourceRecordA -ZoneName "m2l.lan" -Name "srv-win" -IPv4Address 192.168.50.20
<span class="pr">PS C:\&gt;</span> Add-DnsServerResourceRecordA -ZoneName "m2l.lan" -Name "srv-deb" -IPv4Address 192.168.50.10
<span class="pr">PS C:\&gt;</span> Add-DnsServerResourceRecordCName -ZoneName "m2l.lan" -Name "www" -HostNameAlias "srv-deb.m2l.lan"
<span class="pr">PS C:\&gt;</span> Add-DnsServerResourceRecordCName -ZoneName "m2l.lan" -Name "intranet" -HostNameAlias "srv-deb.m2l.lan"
<span class="cm"># Zone inverse du réseau 192.168.50.x et enregistrements PTR</span>
<span class="pr">PS C:\&gt;</span> Add-DnsServerPrimaryZone -NetworkId "192.168.50.0/24" -ZoneFile "50.168.192.in-addr.arpa.dns"
<span class="pr">PS C:\&gt;</span> Add-DnsServerResourceRecordPtr -ZoneName "50.168.192.in-addr.arpa" -Name "10" -PtrDomainName "srv-deb.m2l.lan"
<span class="pr">PS C:\&gt;</span> Add-DnsServerResourceRecordPtr -ZoneName "50.168.192.in-addr.arpa" -Name "20" -PtrDomainName "srv-win.m2l.lan"
<span class="pr">PS C:\&gt;</span> Get-DnsServerResourceRecord -ZoneName "m2l.lan"
<span class="cm"># Le serveur utilise son propre service DNS</span>
<span class="pr">PS C:\&gt;</span> Set-DnsClientServerAddress -InterfaceAlias "Ethernet" -ServerAddresses 192.168.50.20</pre>
    <p>Sur SRV-DEB (toujours en adresse fixe), indiquer le serveur DNS et le domaine de recherche : <code>sudo nano /etc/resolv.conf</code>, puis remplacer le contenu par :</p>
    <pre class="code">search m2l.lan
nameserver 192.168.50.20</pre>
    <div class="answer" data-id="t8-dns" data-kind="code" data-label="Mission 2 : tests du serveur DNS" data-min="150" data-rows="10">
      <p>Écrire le résultat attendu, puis le résultat obtenu, de ces tests. Sur SRV-WIN : <code>Resolve-DnsName www.m2l.lan</code>. Sur SRV-DEB : <code>dig www.m2l.lan</code>, <code>dig -x 192.168.50.20 +short</code>, <code>dig imprimante.m2l.lan</code>, <code>ping -c 2 srv-win</code> (nom court). Pour chaque test, noter la ligne qui prouve le résultat (statut, réponse, drapeau <code>aa</code>…).</p>
      <div class="corr">
        <pre class="code">Resolve-DnsName www.m2l.lan  → CNAME srv-deb.m2l.lan, puis A 192.168.50.10
dig www.m2l.lan              → status: NOERROR, flags: qr aa rd ra
                               www.m2l.lan. 3600 IN CNAME srv-deb.m2l.lan.
                               srv-deb.m2l.lan. 3600 IN A 192.168.50.10
                               SERVER: 192.168.50.20#53
dig -x 192.168.50.20 +short  → srv-win.m2l.lan.
dig imprimante.m2l.lan       → status: NXDOMAIN (et le SOA de la zone)
ping -c 2 srv-win            → PING srv-win.m2l.lan (192.168.50.20) …
                               le nom court est complété grâce à « search m2l.lan »</pre>
        <p>Le drapeau <code>aa</code> prouve que SRV-WIN fait autorité pour <code>m2l.lan</code>. Si <code>ping srv-win</code> échoue alors que le DNS répond, penser au pare-feu de Windows (règle ICMP du TP 5) : ce n’est alors plus un problème de nom.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 3 : le serveur DHCP sur Windows Server 2019</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Étendue, options, bail et réservation</summary>
  <div class="task-body">
    <p>Vérifier d’abord que la carte de SRV-WIN est en <strong>Réseau interne</strong>. Puis installer et configurer :</p>
    <pre class="code terminal"><span class="pr">PS C:\&gt;</span> Install-WindowsFeature DHCP -IncludeManagementTools
<span class="cm"># Fin de l’installation (hors domaine) : groupes de sécurité DHCP, puis redémarrage du service</span>
<span class="pr">PS C:\&gt;</span> netsh dhcp add securitygroups
<span class="pr">PS C:\&gt;</span> Restart-Service DHCPServer
<span class="cm"># Étendue du réseau de test : .30 à .59, bail de 8 jours</span>
<span class="pr">PS C:\&gt;</span> Add-DhcpServerv4Scope -Name "Reseau de test" -StartRange 192.168.50.30 -EndRange 192.168.50.59 -SubnetMask 255.255.255.192 -LeaseDuration 8.00:00:00 -State Active
<span class="cm"># Option d’étendue : routeur ; options de serveur : DNS et domaine</span>
<span class="pr">PS C:\&gt;</span> Set-DhcpServerv4OptionValue -ScopeId 192.168.50.0 -Router 192.168.50.62
<span class="pr">PS C:\&gt;</span> Set-DhcpServerv4OptionValue -DnsServer 192.168.50.20 -DnsDomain "m2l.lan"
<span class="pr">PS C:\&gt;</span> Get-DhcpServerv4Scope
<span class="pr">PS C:\&gt;</span> Get-DhcpServerv4OptionValue -ScopeId 192.168.50.0 -All</pre>
    <p>Dans le Gestionnaire de serveur, une notification « Terminer la configuration DHCP » peut apparaître : la valider (le serveur n’est pas dans un domaine, il n’y a pas d’autorisation Active Directory à faire).</p>
    <p>Passer SRV-DEB en client DHCP, <strong>dans cet ordre</strong> :</p>
    <ol class="steps">
      <li>Désactiver la carte avec l’ancienne configuration : <code>sudo ifdown enp0s3</code>.</li>
      <li>Dans <code>/etc/network/interfaces</code>, remplacer le bloc <code>iface enp0s3 inet static</code> et ses lignes <code>address</code> et <code>gateway</code> par : <code>iface enp0s3 inet dhcp</code>.</li>
      <li>Réactiver : <code>sudo ifup enp0s3</code>, puis observer <code>ip a</code>, <code>ip route</code> et <code>cat /etc/resolv.conf</code>.</li>
      <li>Sur SRV-WIN : <code>Get-DhcpServerv4Lease -ScopeId 192.168.50.0</code>.</li>
    </ol>
    <div class="answer" data-id="t8-dhcp" data-label="Mission 3 : configuration reçue et bail côté serveur" data-min="120" data-rows="8">
      <p>a) Quelle configuration SRV-DEB a-t-il reçue (adresse, masque, passerelle, DNS, domaine) ? D’où vient chaque élément ? b) Quelles informations le serveur affiche-t-il sur ce bail ? c) Pourquoi la configuration DNS de SRV-DEB a-t-elle changé toute seule ?</p>
      <div class="corr">
        <p>a) En général <code>192.168.50.30/26</code> (première adresse libre de l’étendue) ; passerelle <code>192.168.50.62</code> (option 003, option d’étendue) ; DNS <code>192.168.50.20</code> et domaine <code>m2l.lan</code> (options 006 et 015, options de serveur). <code>ip a</code> marque l’adresse <code>dynamic</code>, avec sa durée de validité restante.</p>
        <p>b) <code>Get-DhcpServerv4Lease</code> affiche l’adresse prêtée, l’adresse MAC du client (<code>ClientId</code>), son nom d’hôte, l’état du bail (<em>Active</em>) et sa date d’expiration (8 jours plus tard).</p>
        <p>c) Le client DHCP de Debian a récrit <code>/etc/resolv.conf</code> avec les options DNS reçues (<code>nameserver 192.168.50.20</code>, <code>search m2l.lan</code>) : c’est l’intérêt de DHCP, aucune configuration manuelle n’est plus nécessaire.</p>
      </div>
    </div>
    <p>Créer une <strong>réservation</strong> pour SRV-DEB (adresse MAC lue avec <code>ip link</code>, à écrire avec des tirets) :</p>
    <pre class="code terminal"><span class="pr">PS C:\&gt;</span> Add-DhcpServerv4Reservation -ScopeId 192.168.50.0 -IPAddress 192.168.50.35 -ClientId "08-00-27-91-B2-4E" -Name "SRV-DEB"</pre>
    <div class="answer" data-id="t8-resa" data-label="Mission 3 : tester la réservation" data-min="80" data-rows="5">
      <p>Sur SRV-DEB : <code>sudo ifdown enp0s3 &amp;&amp; sudo ifup enp0s3</code>. Quelle adresse est maintenant attribuée ? Pourquoi ? Dans quel cas réel préfère-t-on une réservation à une adresse configurée à la main sur l’équipement ?</p>
      <div class="corr">
        <p>SRV-DEB reçoit <code>192.168.50.35</code> : le serveur reconnaît son adresse MAC et lui attribue l’adresse réservée. Une réservation garde l’équipement en DHCP tout en lui donnant une adresse stable : on change la passerelle ou le DNS de toutes les imprimantes de la M2L en modifiant une option sur le serveur, sans se déplacer devant chaque imprimante. Pour un serveur essentiel (DNS, DHCP lui-même), on préfère une adresse fixe configurée sur la machine, qui ne dépend d’aucun autre service.</p>
      </div>
    </div>
    <div class="aside caution">
      <p class="aside-title">Remettre SRV-DEB en adresse fixe</p>
      <p>Le TP 9 a besoin de SRV-DEB en <code>192.168.50.10</code> (c’est l’adresse enregistrée dans le DNS). <code>sudo ifdown enp0s3</code>, remettre le bloc <code>inet static</code> du TP 5, <code>sudo ifup enp0s3</code>, puis vérifier <code>ip a</code> et que <code>/etc/resolv.conf</code> contient toujours <code>nameserver 192.168.50.20</code> et <code>search m2l.lan</code>.</p>
    </div>
  </div>
</details>

<h2>Mission 4 : préparer les pannes</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Provoquer, observer, réparer</summary>
  <div class="task-body">
    <p>Un technicien de support doit reconnaître les symptômes des pannes DHCP et DNS. Pour chaque scénario : écrire le symptôme <strong>attendu</strong>, provoquer la panne, noter le symptôme <strong>observé</strong>, réparer, vérifier.</p>
    <div class="tbl-wrap"><table class="data wide">
      <tr><th>Scénario</th><th>Provoquer (SRV-WIN)</th><th>Observer (SRV-DEB)</th><th>Réparer</th></tr>
      <tr><td>S1 : service DNS arrêté</td><td><code>Stop-Service DNS</code></td><td><code>dig www.m2l.lan</code>, <code>ping -c 2 192.168.50.20</code></td><td><code>Start-Service DNS</code></td></tr>
      <tr><td>S2 : enregistrement supprimé</td><td><code>Remove-DnsServerResourceRecord -ZoneName m2l.lan -Name intranet -RRType CName -Force</code></td><td><code>dig intranet.m2l.lan</code></td><td>Recréer le CNAME</td></tr>
      <tr><td>S3 : service DHCP arrêté</td><td><code>Stop-Service DHCPServer</code></td><td>SRV-DEB repassé temporairement en DHCP : <code>sudo ifdown enp0s3 &amp;&amp; sudo ifup enp0s3</code></td><td><code>Start-Service DHCPServer</code>, puis remettre SRV-DEB en adresse fixe</td></tr>
    </table></div>
    <div class="answer" data-id="t8-pannes" data-label="Mission 4 : symptômes et diagnostic des pannes DHCP et DNS" data-min="200" data-rows="10">
      <p>Pour chaque scénario : symptôme attendu, symptôme observé (message exact), et la phrase que l’on écrirait dans le ticket pour expliquer la cause à un collègue.</p>
      <div class="corr">
        <p><strong>S1</strong> : <code>dig</code> attend puis affiche une erreur de délai (<code>connection timed out; no servers could be reached</code>, ou un message proche selon la version), mais le <code>ping 192.168.50.20</code> répond. Ticket : « Le serveur DNS est joignable sur le réseau mais ne répond pas aux requêtes DNS : service DNS arrêté sur SRV-WIN, redémarré. »</p>
        <p><strong>S2</strong> : réponse immédiate <code>status: NXDOMAIN</code>, avec le SOA de la zone. Le serveur fonctionne, c’est le nom qui manque. Ticket : « L’alias intranet.m2l.lan n’existait plus dans la zone m2l.lan ; enregistrement CNAME recréé vers srv-deb.m2l.lan. » La différence entre S1 (délai, pas de réponse) et S2 (réponse « nom inexistant ») oriente immédiatement le diagnostic.</p>
        <p><strong>S3</strong> : le client DHCP de Debian envoie plusieurs Discover, n’obtient aucune offre et finit sans adresse IPv4 (message du type « No DHCPOFFERS received »). Un poste Windows aurait pris une adresse APIPA <code>169.254.x.x</code>. Ticket : « Aucun serveur DHCP ne répond sur le réseau de test : service DHCP arrêté sur SRV-WIN, redémarré ; le client a obtenu son adresse après une nouvelle demande. » Les postes qui avaient déjà un bail valide continuent de fonctionner jusqu’à leur renouvellement : une panne DHCP se remarque surtout sur les postes qui démarrent.</p>
      </div>
    </div>
  </div>
</details>

<h2>Défi : le DNS en IPv6</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Ajouter les enregistrements AAAA des serveurs</summary>
  <div class="task-body">
    <div class="answer" data-id="t8-defi" data-kind="code" data-label="Défi : enregistrements AAAA et préférence IPv6" data-min="80" data-rows="7">
      <p>Les deux serveurs ont gardé leurs adresses IPv6 du TP 7 (<code>2001:db8:acad:50::10</code> et <code>::20</code>). Écrire les commandes PowerShell qui ajoutent leurs enregistrements AAAA dans la zone <code>m2l.lan</code>. Depuis SRV-WIN, lancer <code>ping srv-deb.m2l.lan</code> : quelle adresse est utilisée ? Pourquoi ?</p>
      <div class="corr">
        <pre class="code">Add-DnsServerResourceRecordAAAA -ZoneName "m2l.lan" -Name "srv-deb" -IPv6Address 2001:db8:acad:50::10
Add-DnsServerResourceRecordAAAA -ZoneName "m2l.lan" -Name "srv-win" -IPv6Address 2001:db8:acad:50::20
PS C:\&gt; ping srv-deb.m2l.lan
Envoi d’une requête 'ping' sur srv-deb.m2l.lan [2001:db8:acad:50::10] avec 32 octets de données :</pre>
        <p>Le nom a maintenant une adresse IPv4 et une adresse IPv6 ; Windows, comme la plupart des systèmes, <strong>préfère IPv6</strong> quand les deux existent. C’est ce qu’on voyait dans la capture DNS de la partie 3 : le poste demande toujours A et AAAA. Pour forcer IPv4 : <code>ping -4 srv-deb.m2l.lan</code>.</p>
      </div>
    </div>
  </div>
</details>

<template data-page="p4">
<h1>Les services applicatifs et leur déploiement</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : <a href="#p1">partie 1</a> (ports, TCP), <a href="#p3">partie 3</a> (DNS) et <a href="#tp8">TP 8</a>. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Services applicatifs</div><ul>
  <li><span><b>Anatomie d’un service</b> : programme, port, configuration, journaux</span></li>
  <li><span><b>Web</b> : HTTP, requêtes, codes de réponse, HTTPS</span></li>
  <li><span><b>Messagerie</b> : SMTP, IMAP, MX</span></li>
  <li><span><b>Fichiers, impression, accès distant</b> : SMB, SFTP, IPP, SSH, RDP</span></li>
  <li><span><b>Déployer</b> : tests d’intégration et d’acceptation, documentation</span></li>
</ul></div></figure>

<p class="lead">DHCP et DNS sont des services d’<strong>infrastructure</strong> : l’utilisateur ne les voit pas. Les services <strong>applicatifs</strong>, eux, sont ceux qu’il utilise : le site de sa ligue, sa messagerie, ses dossiers partagés, l’imprimante. Les mettre à disposition (compétence B1.5), c’est les installer, les configurer, les <strong>tester</strong> avec méthode, les documenter et accompagner les utilisateurs.</p>

<h2>L’anatomie d’un service</h2>
<p>Quel que soit le service, on retrouve les mêmes éléments, et donc les mêmes points de contrôle en cas de panne :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Élément</th><th>Exemple : serveur web Apache sur Debian</th><th>Vérification</th></tr>
  <tr><td>Un <strong>programme</strong> qui tourne en permanence (démon sous Linux, service sous Windows)</td><td><code>apache2</code></td><td><code>systemctl status apache2</code> ; Windows : <code>Get-Service</code>, <code>services.msc</code></td></tr>
  <tr><td>Un ou plusieurs <strong>ports en écoute</strong></td><td>TCP 80 (et 443 si HTTPS)</td><td><code>ss -tlnp</code> ; <code>netstat -ano</code></td></tr>
  <tr><td>Des fichiers de <strong>configuration</strong></td><td><code>/etc/apache2/</code></td><td>Vérifier la syntaxe avant de redémarrer : <code>apache2ctl configtest</code></td></tr>
  <tr><td>Des <strong>données</strong></td><td><code>/var/www/html/</code></td><td>Droits sur les fichiers, espace disque</td></tr>
  <tr><td>Des <strong>journaux</strong></td><td><code>/var/log/apache2/access.log</code> et <code>error.log</code></td><td><code>tail</code>, <code>journalctl -u apache2</code> ; Windows : Observateur d’événements</td></tr>
  <tr><td>Des <strong>dépendances</strong></td><td>Nom DNS <code>www.m2l.lan</code>, pare-feu ouvert sur le port 80</td><td><code>dig</code>, <code>Test-NetConnection</code>, <code>curl</code></td></tr>
</table></div>
<pre class="code terminal"><span class="pr">$</span> sudo systemctl status apache2     <span class="cm"># état : active (running) ?</span>
<span class="pr">$</span> sudo systemctl restart apache2    <span class="cm"># redémarrer après une modification</span>
<span class="pr">$</span> sudo systemctl enable apache2     <span class="cm"># démarrer automatiquement avec la machine</span>
<span class="pr">$</span> sudo journalctl -u apache2 -n 20  <span class="cm"># 20 dernières lignes du journal du service</span>
<span class="pr">PS C:\&gt;</span> Get-Service DNS, DHCPServer
<span class="pr">PS C:\&gt;</span> Restart-Service DNS</pre>

<h2>Le web : HTTP et HTTPS</h2>
<p><strong>HTTP</strong> (<em>HyperText Transfer Protocol</em>) fonctionne par <strong>requête et réponse</strong>, en texte lisible pour HTTP/1.1. La capture de la <a href="#p1">partie 1</a> contient l’exemple complet :</p>
<pre class="code"><span class="cm"># Requête du client (trame 4)</span>
GET / HTTP/1.1
Host: www.m2l.lan
User-Agent: curl/8.9.1
Accept: */*

<span class="cm"># Réponse du serveur (trame 6)</span>
HTTP/1.1 200 OK
Server: Apache/2.4.62 (Debian)
Content-Length: 189
Content-Type: text/html

&lt;!DOCTYPE html&gt; … (la page)</pre>
<ul>
  <li>La première ligne de la requête donne la <strong>méthode</strong> (<code>GET</code> pour lire, <code>POST</code> pour envoyer un formulaire), la ressource demandée (<code>/</code>) et la version.</li>
  <li>L’en-tête <code>Host</code> indique le nom demandé : un même serveur peut héberger plusieurs sites (<code>www.m2l.lan</code>, <code>intranet.m2l.lan</code>) sur la même adresse IP, grâce aux <strong>hôtes virtuels</strong>.</li>
  <li>La réponse commence par un <strong>code d’état</strong> à trois chiffres, puis des en-têtes, une ligne vide et le contenu.</li>
</ul>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Famille</th><th>Sens</th><th>Codes courants</th></tr>
  <tr><td>2xx</td><td>Succès</td><td><code>200 OK</code></td></tr>
  <tr><td>3xx</td><td>Redirection</td><td><code>301 Moved Permanently</code> (par exemple de HTTP vers HTTPS), <code>304 Not Modified</code> (la copie en cache est à jour)</td></tr>
  <tr><td>4xx</td><td>Erreur <strong>du client</strong></td><td><code>401 Unauthorized</code> (authentification requise), <code>403 Forbidden</code> (accès interdit), <code>404 Not Found</code> (ressource inexistante)</td></tr>
  <tr><td>5xx</td><td>Erreur <strong>du serveur</strong></td><td><code>500 Internal Server Error</code> (erreur dans l’application), <code>502 Bad Gateway</code>, <code>503 Service Unavailable</code> (surcharge, maintenance)</td></tr>
</table></div>
<p><strong>HTTPS</strong> est HTTP transporté dans une connexion chiffrée <strong>TLS</strong>, sur le port 443 : le serveur présente un <strong>certificat</strong> qui prouve son identité. Les principes du chiffrement et des certificats seront vus dans le chapitre consacré à la cybersécurité. Serveurs web courants : <strong>Apache</strong> et <strong>Nginx</strong> (Linux), <strong>IIS</strong> (Windows Server).</p>

<div class="match" data-id="m-http" data-label="Interpréter les codes de réponse HTTP" data-options="200|301|403|404|500|503">
  <div class="r" data-ok="404" data-expl="La ressource demandée n’existe pas sur le serveur : 404, erreur du client (mauvaise adresse).">Un utilisateur tape une adresse avec une faute : la page n’existe pas.</div>
  <div class="r" data-ok="403" data-expl="La ressource existe mais son accès est interdit : 403 (droits sur les fichiers, configuration).">Le dossier existe, mais le serveur refuse d’en afficher le contenu.</div>
  <div class="r" data-ok="500" data-expl="Erreur du côté du serveur, dans l’application : 500. Regarder le journal error.log.">Le script PHP du site de la ligue contient une erreur et plante.</div>
  <div class="r" data-ok="301" data-expl="Redirection permanente : le navigateur suit automatiquement la nouvelle adresse.">Le site renvoie automatiquement de http:// vers https://.</div>
  <div class="r" data-ok="503" data-expl="Service temporairement indisponible : maintenance ou surcharge.">Le site est en maintenance programmée.</div>
  <div class="r" data-ok="200" data-expl="Tout s’est bien passé : 200 OK.">La page d’accueil s’affiche normalement.</div>
</div>

<h2>Les autres services courants</h2>
<h3>La messagerie</h3>
<p>Un courriel passe par plusieurs serveurs et plusieurs protocoles :</p>
<ol class="steps">
  <li>Le logiciel de messagerie de l’utilisateur (Outlook, Thunderbird, un webmail) <strong>envoie</strong> le message à son serveur en <strong>SMTP</strong> (port 587, avec authentification).</li>
  <li>Le serveur de la M2L cherche dans le DNS l’enregistrement <strong>MX</strong> du domaine du destinataire, puis lui transmet le message en <strong>SMTP</strong> (port 25).</li>
  <li>Le destinataire <strong>lit</strong> ses messages sur son serveur en <strong>IMAP</strong> (port 993 chiffré : les messages restent sur le serveur, synchronisés sur tous ses appareils) ou en POP3 (port 995 : les messages sont téléchargés).</li>
</ol>
<p>À la M2L, le serveur de messagerie du domaine <code>lorraine-sport.net</code> est dans la <strong>DMZ</strong>, puisqu’il doit recevoir des messages depuis Internet.</p>
<h3>Le transfert et le partage de fichiers</h3>
<ul>
  <li><strong>SMB</strong> (TCP 445) : le partage de fichiers et d’imprimantes de Windows (<code>\\srv-win\Volley</code>), aussi disponible sous Linux avec Samba. L’accès est contrôlé par des <strong>autorisations de partage</strong> et des <strong>autorisations NTFS</strong> sur les dossiers : c’est la plus restrictive des deux qui s’applique (détaillé au chapitre 5).</li>
  <li><strong>NFS</strong> (TCP 2049) : le partage de fichiers du monde Unix et Linux.</li>
  <li><strong>FTP</strong> (TCP 21) : ancien, mots de passe en clair. On lui préfère <strong>SFTP</strong>, qui passe par SSH (TCP 22), ou FTPS (FTP avec TLS).</li>
</ul>
<h3>L’impression, l’accès distant, l’heure</h3>
<ul>
  <li><strong>Impression</strong> : un serveur d’impression gère les files d’attente et les pilotes ; les postes impriment via <strong>IPP</strong> (TCP 631) ou en direct sur le port <strong>9100</strong> de l’imprimante.</li>
  <li><strong>Accès distant</strong> : <strong>SSH</strong> (TCP 22, ligne de commande chiffrée, surtout Linux et équipements réseau) ; <strong>RDP</strong> (TCP 3389, bureau à distance Windows). <strong>Telnet</strong> (TCP 23) transmet tout en clair : à remplacer par SSH.</li>
  <li><strong>NTP</strong> (UDP 123) : synchronise l’heure. Indispensable : des journaux horodatés de façon incohérente sont inexploitables, et l’authentification Active Directory (Kerberos) refuse les machines dont l’horloge s’écarte de plus de 5 minutes.</li>
</ul>

<div class="match" data-id="m-services" data-label="Associer chaque protocole à son usage" data-options="Envoyer un courriel|Lire ses courriels en les gardant sur le serveur|Accéder à un dossier partagé Windows|Transférer un fichier de façon chiffrée|Prendre la main sur le bureau d’un serveur Windows|Synchroniser l’heure des machines|Administrer un commutateur à distance de façon chiffrée">

  <div class="r" data-ok="Lire ses courriels en les gardant sur le serveur" data-expl="IMAP : les messages restent sur le serveur, synchronisés.">IMAP</div>
  <div class="r" data-ok="Accéder à un dossier partagé Windows" data-expl="SMB, port 445.">SMB</div>
  <div class="r" data-ok="Transférer un fichier de façon chiffrée" data-expl="SFTP, au-dessus de SSH.">SFTP</div>
  <div class="r" data-ok="Prendre la main sur le bureau d’un serveur Windows" data-expl="RDP, port 3389.">RDP</div>
  <div class="r" data-ok="Synchroniser l’heure des machines" data-expl="NTP, UDP 123.">NTP</div>
  <div class="r" data-ok="Administrer un commutateur à distance de façon chiffrée" data-expl="SSH (plutôt que Telnet, qui circule en clair).">SSH</div>
</div>

<h2>Déployer un service : la démarche</h2>
<ol class="steps">
  <li><strong>Analyser le besoin</strong> : qui utilisera le service, pour quoi faire, avec quels droits, quel niveau de disponibilité ? (exemple : un intranet consultable par toutes les ligues, modifiable par l’administration seulement).</li>
  <li><strong>Choisir</strong> la solution et son emplacement (réseau des serveurs, DMZ), préparer le nom DNS et l’adresse dans le plan d’adressage.</li>
  <li><strong>Installer et configurer sur une maquette</strong> (machines virtuelles, Packet Tracer) : jamais directement en production.</li>
  <li><strong>Tester</strong> : tests d’intégration, puis tests d’acceptation, consignés dans un <strong>rapport de test</strong>.</li>
  <li><strong>Documenter</strong> : documentation <strong>technique</strong> (procédure d’installation, configuration, sauvegarde) pour les administrateurs ; documentation <strong>utilisateur</strong> (comment accéder au service, à qui s’adresser) pour les utilisateurs.</li>
  <li><strong>Mettre en production</strong>, en prévoyant le retour arrière (instantané, sauvegarde de la configuration).</li>
  <li><strong>Accompagner</strong> les utilisateurs : les informer, les former, recueillir leurs retours.</li>
</ol>
<dl class="def">
  <dt>Test d’intégration</dt><dd>Test <strong>technique</strong> : le service fonctionne-t-il dans son environnement, avec les autres éléments (réseau, DNS, pare-feu, autres serveurs) ? Mené par l’équipe technique. Exemple : « depuis le réseau des ligues, <code>curl http://intranet.m2l.lan</code> renvoie 200 ».</dd>
  <dt>Test d’acceptation <small>recette</small></dt><dd>Test <strong>du point de vue de l’utilisateur</strong> : le service répond-il au besoin exprimé ? Mené avec ou par les utilisateurs, à partir de scénarios réels. Exemple : « une salariée de la ligue de volley trouve le planning des salles en moins d’une minute depuis son poste ».</dd>
  <dt>Jeu d’essai</dt><dd>Liste des tests prévus, avec pour chacun : les conditions, l’action, le <strong>résultat attendu</strong>, puis le résultat obtenu et la conclusion. Il comprend des cas <strong>positifs</strong> (ce qui doit marcher) et des cas <strong>négatifs</strong> (ce qui doit être refusé : un utilisateur non autorisé, une mauvaise adresse).</dd>
</dl>
<div class="ctab" data-id="c-tests" data-head="Test" data-cols="Type de test" data-choices="INTÉGRATION|ACCEPTATION" data-label="Test d’intégration ou d’acceptation">
  <div class="r" data-ok="INTÉGRATION" data-expl="Vérification technique du lien entre le nom DNS et le serveur.">Vérifier que intranet.m2l.lan est résolu en 192.168.50.10 depuis le réseau de l’administration.</div>
  <div class="r" data-ok="ACCEPTATION" data-expl="Scénario réel, du point de vue de l’utilisateur.">Le trésorier de la ligue de tennis dépose son bilan dans le dossier partagé de sa ligue et le retrouve depuis un autre poste.</div>
  <div class="r" data-ok="INTÉGRATION" data-expl="Vérification technique de l’accessibilité du port à travers le pare-feu.">Vérifier que le port TCP 445 du serveur de fichiers est joignable depuis le réseau des ligues, et bloqué depuis le Wi-Fi visiteurs.</div>
  <div class="r" data-ok="ACCEPTATION" data-expl="Le besoin exprimé par le responsable est vérifié avec lui, sur un cas d’usage.">Le responsable de la communication valide que la page d’accueil de l’intranet affiche bien les actualités des ligues.</div>
  <div class="r" data-ok="INTÉGRATION" data-expl="Interaction technique entre deux services (DHCP et DNS).">Vérifier qu’un poste qui démarre reçoit le bon serveur DNS par DHCP et résout les noms des serveurs.</div>
</div>

<div class="answer" data-id="a-jeu" data-label="Rédiger un jeu d’essai pour l’intranet" data-min="200" data-rows="10">
  <p>La M2L met en service son intranet <code>http://intranet.m2l.lan</code> sur le serveur Debian. Rédiger un jeu d’essai de 5 tests au moins, sous forme de tableau ou de liste : numéro, type (intégration ou acceptation), action, résultat attendu. Prévoir au moins un cas négatif.</p>
  <div class="corr">
    <div class="tbl-wrap"><table class="data wide">
      <tr><th>N°</th><th>Type</th><th>Action</th><th>Résultat attendu</th></tr>
      <tr><td>1</td><td>Intégration</td><td>Sur le serveur : <code>systemctl status apache2</code> et <code>ss -tlnp</code></td><td>Service <em>active (running)</em>, en écoute sur TCP 80</td></tr>
      <tr><td>2</td><td>Intégration</td><td>Depuis un poste : <code>nslookup intranet.m2l.lan</code></td><td>Adresse 192.168.50.10 (via l’alias vers srv-deb)</td></tr>
      <tr><td>3</td><td>Intégration</td><td>Depuis un poste : <code>Test-NetConnection intranet.m2l.lan -Port 80</code></td><td><code>TcpTestSucceeded : True</code></td></tr>
      <tr><td>4</td><td>Intégration (négatif)</td><td><code>curl http://intranet.m2l.lan/inexistant</code></td><td>Code 404, ligne correspondante dans <code>error.log</code> ou <code>access.log</code></td></tr>
      <tr><td>5</td><td>Acceptation</td><td>Une salariée de ligue ouvre l’intranet depuis son navigateur, avec le nom</td><td>La page d’accueil s’affiche en moins de 2 secondes, sans message d’erreur</td></tr>
      <tr><td>6</td><td>Acceptation</td><td>Le responsable valide le contenu et la présentation de la page</td><td>Conformes à la demande (actualités, contacts)</td></tr>
    </table></div>
    <p>D’autres tests sont valables s’ils précisent l’action et un résultat attendu vérifiable (pas « ça marche »).</p>
  </div>
</div>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Confondre les erreurs 4xx (la demande du client est en cause) et 5xx (le serveur est en cause) : elles n’orientent pas le diagnostic au même endroit.</li>
    <li>Déclarer un service « opérationnel » après un seul test réussi sur le serveur lui-même (<code>curl localhost</code>) : il faut tester depuis les réseaux des utilisateurs, avec le nom DNS.</li>
    <li>Oublier la documentation : un service non documenté devient impossible à dépanner quand son installateur est absent (ou parti en fin de stage).</li>
  </ul>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p4" data-title="Services applicatifs" data-label="Quiz de fin de partie">
  <div class="q" data-ok="2">
    <p class="qt">Que signifie le code de réponse HTTP <code>404</code> ?</p>
    <ul><li>Le serveur est en panne</li><li>La ressource demandée n’existe pas</li><li>L’accès est interdit</li><li>La page a été déplacée définitivement</li></ul>
    <div class="expl"><p>404 Not Found : ressource inexistante. Serveur en erreur : 5xx ; accès interdit : 403 ; déplacée : 301.</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Quel protocole un logiciel de messagerie utilise-t-il pour lire les courriels en les laissant sur le serveur ?</p>
    <ul><li>SMTP</li><li>POP3</li><li>SMB</li><li>IMAP</li></ul>
    <div class="expl"><p>IMAP garde les messages sur le serveur ; POP3 les télécharge ; SMTP sert à l’envoi.</p></div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Sur un serveur Debian, quelle commande indique si le service web Apache fonctionne ?</p>
    <ul><li><code>systemctl status apache2</code></li><li><code>ipconfig /all</code></li><li><code>apt install apache2</code></li><li><code>dig apache2</code></li></ul>
    <div class="expl"><p><code>systemctl status</code> affiche l’état du service (<em>active (running)</em> ou non) et les dernières lignes de son journal.</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Quelle est la différence entre un test d’intégration et un test d’acceptation ?</p>
    <ul><li>Il n’y en a pas</li><li>Le test d’intégration est fait par l’utilisateur, le test d’acceptation par le technicien</li><li>Le test d’intégration vérifie le fonctionnement technique dans l’environnement ; le test d’acceptation vérifie que le besoin de l’utilisateur est satisfait</li><li>Le test d’acceptation se fait avant l’installation</li></ul>
    <div class="expl"><p>Intégration : technique (réseau, DNS, ports, autres services). Acceptation (recette) : du point de vue de l’utilisateur, sur des scénarios réels.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Pourquoi remplacer Telnet par SSH pour administrer un équipement ?</p>
    <ul><li>SSH est plus rapide</li><li>Telnet transmet tout en clair, y compris les mots de passe ; SSH chiffre la connexion</li><li>Telnet ne fonctionne pas en IPv4</li><li>SSH n’a pas besoin de mot de passe</li></ul>
    <div class="expl"><p>Une simple capture du réseau suffit pour lire un mot de passe Telnet. SSH chiffre tout l’échange.</p></div>
  </div>
</div>

<template data-page="tp9">
<h1>Déployer un serveur web et un partage de fichiers</h1>
<p class="lead">La M2L met à disposition deux nouveaux services : un <strong>intranet</strong> consultable par tous, hébergé sur le serveur Debian, et un <strong>dossier partagé</strong> réservé à la ligue de volley, sur le serveur Windows. Il faut les installer sur la maquette, les tester avec un jeu d’essai (cas autorisés et cas refusés), puis rédiger le rapport de test et la documentation pour les utilisateurs.</p>

<div class="aside caution">
  <p class="aside-title">Consignes</p>
  <ul>
    <li>Outils : <strong>VirtualBox</strong>, SRV-DEB (Debian, <code>192.168.50.10</code>, paquets installés au TP 8) et SRV-WIN (Windows Server 2019, <code>192.168.50.20</code>, serveur DNS de la zone <code>m2l.lan</code>), sur le réseau interne <code>tp5</code>.</li>
    <li>Prérequis : TP 8 terminé (zone DNS <code>m2l.lan</code> avec <code>www</code> et <code>intranet</code> en alias de <code>srv-deb</code>, SRV-DEB revenu en adresse fixe et utilisant le DNS de SRV-WIN).</li>
    <li>Travail individuel, <strong>sans IA</strong>. Avant de commencer, prendre un instantané <code>avant-TP9</code> des deux machines.</li>
  </ul>
</div>

<h2>Mission 1 : l’intranet sur Apache</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Vérifier le service, publier la page, tester depuis le réseau</summary>
  <div class="task-body">
    <ol class="steps">
      <li>Sur SRV-DEB, vérifier l’état du service et le port : <code>sudo systemctl status apache2</code>, puis <code>sudo ss -tlnp</code>.</li>
      <li>Tester en local : <code>curl -I http://localhost</code> (la page par défaut d’Apache sous Debian).</li>
      <li>Remplacer la page par défaut par la page de l’intranet : <code>sudo nano /var/www/html/index.html</code>, effacer le contenu, puis saisir :</li>
    </ol>
    <pre class="code">&lt;!DOCTYPE html&gt;
&lt;html lang="fr"&gt;
&lt;head&gt;&lt;meta charset="utf-8"&gt;&lt;title&gt;Intranet M2L&lt;/title&gt;&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Intranet de la Maison des Ligues&lt;/h1&gt;
  &lt;p&gt;Réservation des salles, annuaire des ligues, actualités.&lt;/p&gt;
  &lt;p&gt;Assistance : service informatique, poste 2100.&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;</pre>
    <ol class="steps">
      <li>Depuis SRV-WIN (PowerShell), tester avec le nom : <code>curl.exe -I http://intranet.m2l.lan</code>, puis <code>(Invoke-WebRequest http://intranet.m2l.lan -UseBasicParsing).Content</code>.</li>
      <li>Toujours depuis SRV-WIN : <code>Test-NetConnection intranet.m2l.lan -Port 80</code> et <code>curl.exe -I http://intranet.m2l.lan/planning.html</code> (page qui n’existe pas).</li>
      <li>Sur SRV-DEB, lire les dernières lignes du journal des accès : <code>sudo tail -n 5 /var/log/apache2/access.log</code>.</li>
    </ol>
    <div class="answer" data-id="t9-web" data-kind="code" data-label="Mission 1 : résultats des tests de l’intranet" data-min="150" data-rows="10">
      <p>Pour chaque test (étapes 1, 2, 4, 5 et 6), noter le résultat attendu, puis la ligne du résultat obtenu qui le prouve. Expliquer ensuite une ligne du journal <code>access.log</code> : qui a demandé quoi, quand, avec quel résultat.</p>
      <p class="hint">Format d’une ligne de journal Apache : adresse du client, date, requête, code de réponse, taille de la réponse, puis le logiciel client.</p>
      <div class="corr">
        <pre class="code">1. status   → Active: active (running)
   ss -tlnp → LISTEN … *:80 … users:(("apache2",…))
2. curl -I http://localhost          → HTTP/1.1 200 OK
4. curl.exe -I http://intranet.m2l.lan → HTTP/1.1 200 OK, Server: Apache/… (Debian)
   Invoke-WebRequest … .Content       → le code HTML de la page de l’intranet
5. Test-NetConnection … -Port 80      → TcpTestSucceeded : True
   …/planning.html                    → HTTP/1.1 404 Not Found (cas négatif attendu)
6. 192.168.50.20 - - [29/Oct/2026:10:12:44 +0100] "GET / HTTP/1.1" 200 312 "-" "curl/8.x"</pre>
        <p>La ligne de journal se lit : le poste <code>192.168.50.20</code> (SRV-WIN) a demandé la page <code>/</code> en HTTP/1.1, à la date indiquée ; le serveur a répondu <code>200</code> (succès) en envoyant 312 octets (taille de la page, qui dépend du texte saisi) ; le client était <code>curl</code>. Les journaux servent à vérifier les tests, à diagnostiquer (404, 500) et à tracer les accès.</p>
        <p>Le test 4 vérifie en une seule fois le DNS (le nom est résolu), le réseau, le port 80 et le service : c’est un test d’<strong>intégration</strong>.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 2 : le dossier partagé de la ligue de volley</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Comptes, groupe, partage et droits NTFS</summary>
  <div class="task-body">
    <p>Règle de gestion : seuls les membres du groupe <code>GG_Volley</code> peuvent lire et modifier le dossier ; personne d’autre n’y a accès. On crée deux comptes locaux pour tester : un membre de la ligue et une personne d’une autre ligue.</p>
    <pre class="code terminal"><span class="cm"># Comptes et groupe (le mot de passe est demandé ; il doit respecter la complexité exigée par Windows)</span>
<span class="pr">PS C:\&gt;</span> New-LocalUser -Name "volley.tresorier" -FullName "Tresorier ligue de volley" -Password (Read-Host -AsSecureString "Mot de passe")
<span class="pr">PS C:\&gt;</span> New-LocalUser -Name "tennis.secretaire" -FullName "Secretaire ligue de tennis" -Password (Read-Host -AsSecureString "Mot de passe")
<span class="pr">PS C:\&gt;</span> New-LocalGroup -Name "GG_Volley" -Description "Membres de la ligue de volley"
<span class="pr">PS C:\&gt;</span> Add-LocalGroupMember -Group "GG_Volley" -Member "volley.tresorier"
<span class="cm"># Dossier, partage et droits NTFS</span>
<span class="pr">PS C:\&gt;</span> New-Item -Path "C:\Partages\Volley" -ItemType Directory
<span class="pr">PS C:\&gt;</span> New-SmbShare -Name "Volley" -Path "C:\Partages\Volley" -ChangeAccess "GG_Volley"
<span class="pr">PS C:\&gt;</span> icacls "C:\Partages\Volley" /grant "GG_Volley:(OI)(CI)M"
<span class="cm"># Ouvrir le port SMB dans le pare-feu, puis vérifier</span>
<span class="pr">PS C:\&gt;</span> Enable-NetFirewallRule -Name FPS-SMB-In-TCP
<span class="pr">PS C:\&gt;</span> Get-SmbShareAccess -Name "Volley"
<span class="pr">PS C:\&gt;</span> icacls "C:\Partages\Volley"</pre>
    <p>Dans <code>icacls</code>, <code>M</code> signifie « modification » (lire, écrire, supprimer), <code>(OI)(CI)</code> que le droit s’applique aux fichiers et sous-dossiers créés dans le dossier. Deux niveaux de droits s’appliquent sur un partage : les <strong>autorisations du partage</strong> (<code>New-SmbShare</code>) et les <strong>autorisations NTFS</strong> du dossier (<code>icacls</code>). L’utilisateur obtient le plus restrictif des deux.</p>

    <p>Tester depuis SRV-DEB avec <code>smbclient</code> (compte local de SRV-WIN, d’où le préfixe <code>SRV-WIN\</code>) :</p>
    <pre class="code terminal"><span class="pr">$</span> smbclient -L //srv-win.m2l.lan -U 'SRV-WIN\volley.tresorier'          <span class="cm"># lister les partages</span>
<span class="pr">$</span> echo "Bilan 2026 de la ligue de volley" &gt; bilan.txt
<span class="pr">$</span> smbclient //srv-win.m2l.lan/Volley -U 'SRV-WIN\volley.tresorier'
smb: \&gt; put bilan.txt
smb: \&gt; ls
smb: \&gt; exit
<span class="pr">$</span> smbclient //srv-win.m2l.lan/Volley -U 'SRV-WIN\tennis.secretaire'</pre>
    <div class="answer" data-id="t9-smb" data-label="Mission 2 : tests du partage (cas autorisés et refusés)" data-min="150" data-rows="9">
      <p>a) Écrire, avant de tester, le résultat attendu pour : la liste des partages ; le dépôt de <code>bilan.txt</code> par <code>volley.tresorier</code> ; la connexion de <code>tennis.secretaire</code> ; une connexion de <code>volley.tresorier</code> avec un mauvais mot de passe. b) Noter les résultats obtenus (messages exacts). c) Pendant qu’une session <code>smbclient</code> est ouverte, que montrent <code>ss -tn</code> sur SRV-DEB et <code>Get-SmbSession</code> sur SRV-WIN ?</p>
      <div class="corr">
        <p>a et b) Liste : les partages <code>Volley</code>, ainsi que les partages administratifs <code>ADMIN$</code>, <code>C$</code>, <code>IPC$</code>. Dépôt par le trésorier : <code>putting file bilan.txt as \bilan.txt</code>, puis <code>ls</code> affiche le fichier ; il est visible dans <code>C:\Partages\Volley</code> sur le serveur. Secrétaire de tennis : l’authentification réussit (le compte existe) mais l’accès au partage est refusé : <code>NT_STATUS_ACCESS_DENIED</code>. Mauvais mot de passe : <code>NT_STATUS_LOGON_FAILURE</code>, l’authentification échoue.</p>
        <p>La distinction entre ces deux refus est importante pour l’assistance : <strong>LOGON_FAILURE</strong> = problème d’identifiant ou de mot de passe ; <strong>ACCESS_DENIED</strong> = la personne est bien identifiée mais n’a pas les droits (groupe, autorisations).</p>
        <p>c) <code>ss -tn</code> montre une connexion <code>ESTAB</code> de <code>192.168.50.10:</code>(port éphémère) vers <code>192.168.50.20:445</code>. <code>Get-SmbSession</code> affiche la session de l’utilisateur <code>SRV-WIN\volley.tresorier</code> depuis le client <code>192.168.50.10</code>. On retrouve la couche transport de la partie 1 : SMB utilise TCP 445.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 3 : rapport de test et documentation</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Rendre compte et accompagner les utilisateurs</summary>
  <div class="task-body">
    <div class="answer" data-id="t9-rapport" data-label="Mission 3 : rapport de test des deux services" data-min="200" data-rows="10">
      <p>Rédiger le rapport de test des deux services, sous forme de tableau : numéro, service, type (intégration ou acceptation), action, résultat attendu, résultat obtenu, conclusion (conforme ou non). Au moins 8 lignes, dont au moins 3 cas négatifs. Terminer par une conclusion : les services peuvent-ils être mis en production ? Reste-t-il des réserves ?</p>
      <div class="corr">
        <p>Éléments attendus :</p>
        <ul>
          <li><strong>Intranet</strong> : service actif et port 80 en écoute ; résolution DNS d’<code>intranet.m2l.lan</code> et de <code>www.m2l.lan</code> ; <code>Test-NetConnection</code> réussi ; page affichée avec le nom ; <strong>négatifs</strong> : page inexistante (404), HTTPS non disponible (port 443 refusé, ce qui est une réserve).</li>
          <li><strong>Partage</strong> : partage visible ; dépôt et lecture d’un fichier par un membre de <code>GG_Volley</code> ; fichier visible sur le serveur ; <strong>négatifs</strong> : accès refusé à un membre d’une autre ligue (<code>ACCESS_DENIED</code>), mauvais mot de passe (<code>LOGON_FAILURE</code>).</li>
          <li><strong>Acceptation</strong> : un « utilisateur » (un camarade dans le rôle du trésorier) trouve et ouvre le dossier en suivant seulement la documentation utilisateur.</li>
          <li><strong>Conclusion</strong> : services conformes sur la maquette. Réserves : intranet en HTTP non chiffré (HTTPS à prévoir, chapitre cybersécurité) ; comptes locaux au lieu d’un annuaire centralisé (chapitre 5) ; sauvegarde du dossier partagé à mettre en place avant la production.</li>
        </ul>
      </div>
    </div>
    <div class="answer" data-id="t9-doc" data-label="Mission 3 : documentation utilisateur du dossier partagé" data-min="150" data-rows="9">
      <p>Rédiger la documentation destinée aux membres de la ligue de volley (une demi-page) : à quoi sert le dossier, comment y accéder depuis un poste Windows (Explorateur de fichiers, connecter un lecteur réseau), quels identifiants utiliser, que faire en cas de problème. Vocabulaire adapté à un utilisateur non informaticien.</p>
      <div class="corr">
        <p>Exemple :</p>
        <p><strong>Le dossier partagé de la ligue de volley.</strong> Ce dossier, enregistré sur un serveur de la M2L et sauvegardé régulièrement, permet aux membres de la ligue de partager leurs documents (bilans, comptes rendus). Seuls les membres de la ligue y ont accès.</p>
        <ol>
          <li>Ouvrir l’Explorateur de fichiers (touche Windows + E).</li>
          <li>Dans la barre d’adresse, taper <code>\\srv-win.m2l.lan\Volley</code> puis Entrée.</li>
          <li>Saisir l’identifiant et le mot de passe remis par le service informatique.</li>
          <li>Pour retrouver le dossier facilement : clic droit sur <em>Ce PC</em> &gt; <em>Connecter un lecteur réseau</em>, choisir une lettre (par exemple V:), indiquer <code>\\srv-win.m2l.lan\Volley</code> et cocher « Se reconnecter lors de la connexion ».</li>
        </ol>
        <p>En cas de message « accès refusé » ou de mot de passe oublié : contacter le service informatique (poste 2100), en précisant le message affiché. Ne jamais communiquer son mot de passe, même au service informatique.</p>
        <p>Points d’évaluation : pas de jargon inutile (pas de « SMB », de « port 445 ») ; étapes numérotées ; contact d’assistance ; rappel de sécurité.</p>
      </div>
    </div>
  </div>
</details>

<h2>Défi : deux sites sur un même serveur</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Un hôte virtuel Apache pour intranet.m2l.lan</summary>
  <div class="task-body">
    <p>Pour l’instant, <code>www.m2l.lan</code> et <code>intranet.m2l.lan</code> affichent la même page. On veut deux sites distincts sur la même adresse IP, distingués par l’en-tête <code>Host</code> de la requête HTTP.</p>
    <pre class="code terminal"><span class="pr">$</span> sudo mkdir /var/www/intranet
<span class="pr">$</span> sudo cp /var/www/html/index.html /var/www/intranet/index.html
<span class="pr">$</span> echo "&lt;h1&gt;Site public de la M2L&lt;/h1&gt;" | sudo tee /var/www/html/index.html
<span class="pr">$</span> sudo nano /etc/apache2/sites-available/intranet.conf</pre>
    <pre class="code">&lt;VirtualHost *:80&gt;
    ServerName intranet.m2l.lan
    DocumentRoot /var/www/intranet
    ErrorLog ${APACHE_LOG_DIR}/intranet-error.log
    CustomLog ${APACHE_LOG_DIR}/intranet-access.log combined
&lt;/VirtualHost&gt;</pre>
    <pre class="code terminal"><span class="pr">$</span> sudo a2ensite intranet
<span class="pr">$</span> sudo apache2ctl configtest
<span class="pr">$</span> sudo systemctl reload apache2</pre>
    <div class="answer" data-id="t9-defi" data-label="Défi : tester et expliquer les hôtes virtuels" data-min="100" data-rows="6">
      <p>Tester depuis SRV-WIN <code>curl.exe http://www.m2l.lan</code>, <code>curl.exe http://intranet.m2l.lan</code> et <code>curl.exe http://192.168.50.10</code>. Expliquer les résultats : comment Apache sait-il quel site renvoyer, alors que les trois requêtes arrivent sur la même adresse IP et le même port ?</p>
      <div class="corr">
        <p><code>intranet.m2l.lan</code> renvoie la page de l’intranet ; <code>www.m2l.lan</code> et <code>192.168.50.10</code> renvoient le « site public ». Les trois requêtes arrivent sur <code>192.168.50.10:80</code>, mais l’en-tête <code>Host</code> diffère (<code>intranet.m2l.lan</code>, <code>www.m2l.lan</code>, <code>192.168.50.10</code>). Apache compare cet en-tête au <code>ServerName</code> de chaque hôte virtuel ; s’il ne trouve aucune correspondance, il utilise le premier site, le site par défaut (<code>000-default</code>). C’est ainsi qu’un seul serveur héberge des dizaines de sites, par exemple un site par ligue.</p>
      </div>
    </div>
  </div>
</details>
