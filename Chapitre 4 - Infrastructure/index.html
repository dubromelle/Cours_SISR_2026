/* Normalisation des bases de données — BTS SIO

:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #eef1f8;
  --fg: #161d2e;
  --muted: #556079;

  --mid-soft: #fbf1d9;
  --ko: #c53030;
  --ko-soft: #fbe6e6;
  --shadow: 0 1px 2px rgba(22, 29, 46, .06), 0 4px 16px rgba(22, 29, 46, .05);

}

    --line: #2c3651; --accent: #93a6ff; --accent-soft: #1f2a4d; --key: #f2b469; --key-soft: #33261a;
    --ok: #5ad48a; --ok-soft: #15301f; --mid: #f3c35a; --mid-soft: #33290f; --ko: #ff8a8a; --ko-soft: #3a1b1d;

  }
}
:root[data-theme="dark"] {
  --bg: #0f1420; --surface: #161d2c; --surface-2: #1d2639; --fg: #e5e9f3; --muted: #9ba6bf;
  --line: #2c3651; --accent: #93a6ff; --accent-soft: #1f2a4d; --key: #f2b469; --key-soft: #33261a;
  --ok: #5ad48a; --ok-soft: #15301f; --mid: #f3c35a; --mid-soft: #33290f; --ko: #ff8a8a; --ko-soft: #3a1b1d;

}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(var(--top) + 16px); }
body {

}

a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

button { font: inherit; color: inherit; }
img { max-width: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- barre du haut ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--top);
  display: flex; align-items: center; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}

.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.who { font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
.theme-sel { font: inherit; font-size: .85rem; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }

.save-btn { white-space: nowrap; }
.save-btn.dirty { background: var(--accent); border-color: var(--accent); color: var(--surface); }

.save-btn.dirty:hover:not(:disabled) { color: var(--surface); filter: brightness(1.08); }
.notices { max-width: calc(46rem + 15rem + 48px); margin: 0 auto 20px; display: grid; gap: 10px; }
.notice { border-radius: 12px; padding: 12px 16px; border: 1px solid var(--line); font-size: .93rem; }
.notice p { margin: 0 0 6px; }
.notice p:last-child { margin-bottom: 0; }
.notice.warn { background: var(--mid-soft); border-color: var(--mid); }
.notice.ko { background: var(--ko-soft); border-color: var(--ko); }

/* ---------- grille ---------- */
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - var(--top)); }
.sidebar {
  position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px)); align-self: start;
  height: calc(100vh - var(--top)); overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--surface);
  padding: 20px 14px 40px max(16px, env(safe-area-inset-left, 0px));
}
.nav-group { margin: 0 0 18px; }

.nav-group ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav-link { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--fg); font-size: .93rem; line-height: 1.3; }
.nav-link:hover { background: var(--surface-2); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }

.nav-link[aria-current="page"] .n { color: var(--accent); }
.pill { font: 600 .68rem var(--f-mono); padding: 2px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill:empty { display: none; }
.pill.done { background: var(--ok-soft); color: var(--ok); }

.main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
.page-grid { display: grid; grid-template-columns: minmax(0, 46rem) 15rem; gap: 48px; justify-content: center; }
.toc { position: sticky; top: calc(var(--top) + 24px); align-self: start; max-height: calc(100vh - var(--top) - 48px); overflow-y: auto; font-size: .85rem; }
.toc p { margin: 0 0 8px; font: 700 1rem var(--f-display); }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.toc a { display: block; color: var(--muted); text-decoration: none; line-height: 1.35; padding: 2px 0; }
.toc a.h3 { padding-left: 14px; }
.toc a:hover, .toc a.on { color: var(--accent); }
.toc a.on { font-weight: 700; }

/* ---------- contenu ---------- */
article { min-width: 0; counter-reset: h2; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 0 0 10px; font: 600 .78rem var(--f-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.eyebrow .kind { color: var(--accent); }
article h1 { font: 700 clamp(2rem, 4.2vw, 2.75rem)/1.12 var(--f-display); letter-spacing: -.02em; margin: 0 0 18px; text-wrap: balance; }
.lead { font-size: 1.12rem; color: var(--muted); margin: 0 0 26px; }

article h2::before { content: counter(h2) ". "; color: var(--accent); }
article h2.nonum::before { content: none; }

article h3::before { content: counter(h2) "." counter(h3) ". "; color: var(--muted); }
article h3.nonum::before { content: none; }
article p, article li { max-width: 68ch; }
article ul, article ol { padding-left: 1.3em; }
article li + li { margin-top: 4px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }

/* étapes numérotées (comme les supports modèles) */
ol.steps { list-style: none; padding: 0; counter-reset: st; display: grid; gap: 14px; }
ol.steps > li { counter-increment: st; position: relative; padding-left: 42px; margin: 0; min-height: 28px; }
ol.steps > li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; font: 600 .8rem var(--f-mono); }

/* encadrés */
.aside { border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; padding: 14px 18px; margin: 22px 0; }
.aside > :first-child { margin-top: 0; }
.aside > :last-child { margin-bottom: 0; }
.aside-title { font-weight: 700; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
.aside-title::before { font: 700 .75rem var(--f-mono); padding: 1px 7px; border-radius: 99px; background: var(--surface); }
.aside.tip { border-color: var(--ok); background: var(--ok-soft); }
.aside.tip .aside-title::before { content: "ASTUCE"; color: var(--ok); }
.aside.note { border-color: var(--accent); }
.aside.note .aside-title::before { content: "NOTE"; color: var(--accent); }
.aside.caution { border-color: var(--mid); background: var(--mid-soft); }
.aside.caution .aside-title::before { content: "IMPORTANT"; color: var(--mid); }
.aside.next { border-color: var(--muted); background: var(--surface-2); }
.aside.next .aside-title::before { content: "LA SUITE"; color: var(--muted); }

/* définition : une fiche de vocabulaire */
.def { margin: 22px 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 18px; box-shadow: var(--shadow); }
.def dt { font: 700 1.05rem var(--f-display); color: var(--accent); }
.def dt small { font: 600 .72rem var(--f-mono); color: var(--muted); margin-left: 8px; letter-spacing: .05em; text-transform: uppercase; }

/* schéma relationnel et dépendances */
.schema, .dfl {
  font-family: var(--f-mono); font-size: .93rem; line-height: 1.7;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px; margin: 14px 0; overflow-x: auto; white-space: nowrap; max-width: 100%;
}
.schema.stack, .dfl.stack { white-space: normal; }
.schema.stack > div, .dfl.stack > div { white-space: nowrap; }
.schema b, .dfl b { color: var(--accent); }
u, .pk { text-decoration: underline; text-decoration-color: var(--key); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.fk { color: var(--key); font-weight: 600; }
.dfa { display: inline-flex; align-items: center; margin: 0 .5ch; vertical-align: middle; color: var(--muted); font: 600 .7rem var(--f-mono); }
.dfa::before { content: ""; width: 1.4em; border-top: 1.5px solid currentColor; }
.dfa > span { padding: 0 3px; }
.dfa > i { display: inline-block; width: 1.6em; height: 0; border-top: 1.5px solid currentColor; position: relative; }
.dfa > i::after { content: ""; position: absolute; right: -2px; top: -5.25px; border-left: 8px solid currentColor; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
.ok-t { color: var(--ok); font-weight: 700; }
.ko-t { color: var(--ko); font-weight: 700; }

/* tables de données */
.tables { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; margin: 16px 0; }
.tbl { min-width: 0; max-width: 100%; overflow-x: auto; }
.tbl-name { margin: 0 0 4px; font: 700 .8rem var(--f-mono); letter-spacing: .06em; color: var(--muted); }
table.data { border-collapse: separate; border-spacing: 0; font-size: .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
table.data th, table.data td { padding: 6px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data th { font: 600 .78rem var(--f-mono); background: var(--surface-2); letter-spacing: .02em; }
table.data td { font-variant-numeric: tabular-nums; }
table.data td.null { color: var(--muted); font: italic .8rem var(--f-mono); }
table.data td.num, table.data th.num { color: var(--muted); font: .75rem var(--f-mono); text-align: right; width: 2.5em; }
table.data tr.hl td { background: var(--mid-soft); }
table.wide { width: 100%; }
.tbl-wrap { overflow-x: auto; max-width: 100%; margin: 14px 0; }
.tbl-wrap > table.data { min-width: 100%; }

/* carte mentale (vue d'ensemble) */
.carte { margin: 8px 0 26px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow-x: auto; }
.carte-in { display: flex; align-items: center; gap: 0; min-width: max-content; }
.carte-root { font: 700 1.05rem var(--f-display); padding: 10px 16px; border-radius: 10px; background: var(--accent); color: var(--surface); }
.carte ul { list-style: none; margin: 0; padding: 0 0 0 28px; position: relative; display: grid; gap: 8px; }
.carte ul::before { content: ""; position: absolute; left: 0; top: 50%; width: 28px; border-top: 2px solid var(--line); }
.carte li { position: relative; padding-left: 22px; margin: 0; max-width: none; }
.carte li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 2px solid var(--line); }
.carte li:first-child::before { top: 50%; }
.carte li:last-child::before { bottom: 50%; }

.carte li::after { content: ""; position: absolute; left: 0; top: 50%; width: 22px; border-top: 2px solid var(--line); }
.carte li > span { display: inline-block; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: .92rem; line-height: 1.3; }

.quiz { margin: 22px 0; }
.qz { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.qz-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.qz-title { margin: 0; font: 700 1.02rem var(--f-display); }
.qz-badge { font: 600 .75rem var(--f-mono); background: var(--surface-2); border-radius: 99px; padding: 3px 9px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.qz-body { padding: 18px 20px; }
.qz-q { font-weight: 700; margin: 0 0 14px; }
.qz-opts { display: grid; gap: 8px; }
.qz-opt { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; text-align: left; cursor: pointer; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: .95rem; line-height: 1.45; }
.qz-opt .l { font: 700 .75rem/1.9 var(--f-mono); color: var(--muted); }
.qz-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.qz-opt:disabled { cursor: default; }
.qz-opt.good { border-color: var(--ok); background: var(--ok-soft); }
.qz-opt.bad { border-color: var(--ko); background: var(--ko-soft); }
.qz-opt.good .l, .qz-opt.bad .l { color: var(--fg); }
.qz-hint { margin-top: 12px; }
.qz-hint-box, .hint-box { margin-top: 8px; padding: 10px 14px; border-radius: 10px; background: var(--mid-soft); font-size: .92rem; }
.qz-fb { margin-top: 14px; padding: 12px 16px; border-radius: 10px; font-size: .94rem; }
.qz-fb.good { background: var(--ok-soft); }
.qz-fb.bad { background: var(--ko-soft); }
.qz-fb > strong { display: block; margin-bottom: 4px; }
.qz-fb.good > strong { color: var(--ok); }
.qz-fb.bad > strong { color: var(--ko); }
.qz-fb p { margin: 6px 0 0; }
.qz-foot { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2); }
.qz-track { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.qz-track > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.qz-score { font: 700 2.2rem var(--f-display); margin: 0; font-variant-numeric: tabular-nums; }
.qz-recap { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; font-size: .9rem; }
.qz-recap li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; max-width: none; margin: 0; }

/* réponse rédigée */
.answer { margin: 18px 0 26px; }
.ans { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.ans-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.ans-tag { font: 600 .74rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.ans-saved { font-size: .78rem; color: var(--muted); }
.ans-body { padding: 14px 16px; display: grid; gap: 10px; }
.ans textarea { width: 100%; resize: vertical; min-height: 4.5em; font: .95rem/1.55 var(--f-body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.ans.k-schema textarea { font-family: var(--f-mono); font-size: .88rem; }
.ans textarea:focus, .te input:focus, .field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.ans-syntax { font-size: .8rem; color: var(--muted); }
.ans-syntax code { font-size: .78rem; }
.ans-preview { font-family: var(--f-mono); font-size: .88rem; padding: 8px 12px; border-radius: 10px; border: 1px dashed var(--line); white-space: pre-wrap; overflow-x: auto; min-height: 2.4em; }
.ans-preview:empty::before { content: "Aperçu de la notation…"; color: var(--muted); font-style: italic; }
.ans-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ans-corr { border-top: 1px solid var(--line); padding: 14px 16px; background: var(--ok-soft); }
.ans-corr-title { margin: 0 0 6px; font: 700 .78rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ok); }
.ans-corr > :last-child { margin-bottom: 0; }
.ans-corr .schema, .ans-corr .dfl, .ans-corr table.data { background: var(--surface); }
.ans-self { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 8px; border-radius: 0 0 14px 14px; }
.ans-self p { margin: 0; font-size: .9rem; font-weight: 700; }
.self-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.self-btn { cursor: pointer; border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 99px; font-size: .88rem; font-weight: 700; }
.self-btn[aria-pressed="true"].s-ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.self-btn[aria-pressed="true"].s-mid { background: var(--mid); border-color: var(--mid); color: var(--surface); }
.self-btn[aria-pressed="true"].s-ko { background: var(--ko); border-color: var(--ko); color: var(--surface); }
.self-btn.s-ok:hover { border-color: var(--ok); }
.self-btn.s-mid:hover { border-color: var(--mid); }
.self-btn.s-ko:hover { border-color: var(--ko); }

/* éditeur de tables */
.te { display: grid; gap: 12px; }
.te-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); min-width: 0; }
.te-name { font: 700 .85rem var(--f-mono); width: min(100%, 22ch); padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--fg); text-transform: uppercase; }
.te-scroll { overflow-x: auto; margin: 8px 0; }
.te table { border-collapse: collapse; }
.te th, .te td { border: 1px solid var(--line); padding: 0; background: var(--surface); }
.te th { background: var(--surface-2); vertical-align: top; }
.te input.c { font: .82rem var(--f-mono); width: 16ch; border: 0; padding: 6px 7px; background: transparent; color: var(--fg); }
.te th input.c { font-weight: 600; }
.te th.is-pk input.c { text-decoration: underline; text-decoration-color: var(--key); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.te-flags { display: flex; gap: 4px; padding: 0 5px 5px; }
.te-flag { cursor: pointer; font: 600 .65rem var(--f-mono); padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.te-flag[aria-pressed="true"] { background: var(--key); border-color: var(--key); color: var(--surface); }
.te-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.te-links { display: grid; gap: 4px; font-size: .85rem; }
.te-links input { font: .85rem var(--f-mono); padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }

/* tableau à cocher (OUI / NON…) */
.ctab, .match, .pick { margin: 18px 0 26px; }
.ck { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.ck-head { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.ck-scroll { overflow-x: auto; }
.ck table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.ck th, .ck td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.ck th { font: 600 .74rem var(--f-mono); background: var(--surface-2); letter-spacing: .03em; white-space: nowrap; }
.ck td.lab { min-width: 14em; }
.ck td.cell { white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { cursor: pointer; border: 0; background: var(--surface); padding: 5px 10px; font: 600 .78rem var(--f-mono); color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.seg button:disabled { cursor: not-allowed; opacity: .4; }
td.cell.good .seg { outline: 2px solid var(--ok); outline-offset: 2px; }
td.cell.bad .seg { outline: 2px solid var(--ko); outline-offset: 2px; }
td.cell .mark, .m-row .mark { font: 700 .8rem var(--f-mono); margin-left: 6px; }
.good .mark { color: var(--ok); }
.bad .mark { color: var(--ko); }
tr.ck-expl td { background: var(--surface-2); font-size: .86rem; color: var(--fg); padding-top: 6px; }
.ck-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: var(--surface-2); }
.ck-msg { font-size: .9rem; font-weight: 700; }
.ck-msg.good { color: var(--ok); }
.ck-msg.bad { color: var(--ko); }
.ck-msg.mid { color: var(--mid); }
.ck-after { padding: 12px 16px; border-top: 1px solid var(--line); background: var(--ok-soft); font-size: .93rem; }
.ck-after > :first-child { margin-top: 0; }
.ck-after > :last-child { margin-bottom: 0; }

.m-list { display: grid; }
.m-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(12rem, 16rem); gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.m-row select { font: inherit; font-size: .88rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; }
.m-row.good select { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
.m-row.bad select { border-color: var(--ko); box-shadow: 0 0 0 1px var(--ko); }
.m-row .m-expl { grid-column: 1 / -1; font-size: .85rem; background: var(--surface-2); padding: 6px 10px; border-radius: 8px; }

.pick tbody tr { cursor: pointer; }
.pick tbody tr:hover td { background: var(--accent-soft); }
.pick tbody tr.picked td { background: var(--accent-soft); box-shadow: inset 0 0 0 0 transparent; }
.pick tbody tr.picked td:first-child { box-shadow: inset 4px 0 0 var(--accent); }
.pick tbody tr.p-good td { background: var(--ok-soft); }
.pick tbody tr.p-bad td { background: var(--ko-soft); }
.pick tbody tr.p-miss td { background: var(--mid-soft); }
.pick tbody tr.p-good td:first-child { box-shadow: inset 4px 0 0 var(--ok); }
.pick tbody tr.p-bad td:first-child { box-shadow: inset 4px 0 0 var(--ko); }
.pick tbody tr.p-miss td:first-child { box-shadow: inset 4px 0 0 var(--mid); }
.pick .ck-scroll { padding: 12px 16px; }
.pick table.data { width: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

/* progression de la page */
.page-progress { margin: 48px 0 0; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); display: grid; gap: 10px; }
.page-progress p { margin: 0; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.bar.full > span { background: var(--ok); }

/* navigation de séquence */
.seq { margin-top: 28px; display: grid; gap: 12px; }
.seq-progress { font-size: .85rem; color: var(--muted); margin: 0; }
.seq-links { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seq-link { display: grid; gap: 2px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--fg); background: var(--surface); }
.seq-link:hover { border-color: var(--accent); }
.seq-link.next { text-align: right; grid-column: 2; }
.seq-dir { font-size: .8rem; color: var(--muted); }
.seq-title { font-weight: 700; color: var(--accent); line-height: 1.3; }

/* champs (accueil / bilan) */
.field { display: grid; gap: 4px; }
.field label { font-size: .85rem; font-weight: 700; }
.field input, .field textarea, .field select { font: inherit; font-size: .95rem; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; }
.field textarea { font: .82rem/1.45 var(--f-mono); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 12px; margin: 14px 0; }
.panel { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 16px 18px; margin: 18px 0; box-shadow: var(--shadow); }
.panel > :first-child { margin-top: 0; }
.panel > :last-child { margin-bottom: 0; }

.parcours { list-style: none; padding: 0; margin: 18px 0; display: grid; gap: 8px; }
.parcours li { max-width: none; margin: 0; }
.parcours a { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; color: var(--fg); }
.parcours a:hover { border-color: var(--accent); }
.parcours .k { font: 600 .74rem var(--f-mono); color: var(--muted); letter-spacing: .03em; }
.parcours .k.tp { color: var(--key); }
.parcours .t { font-weight: 700; line-height: 1.3; }
.parcours .t small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 12px; margin: 16px 0; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.stat b { display: block; font: 700 1.7rem var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: .82rem; color: var(--muted); }
.bilan-tbl td, .bilan-tbl th { white-space: nowrap; }
.bilan-tbl td:first-child { white-space: normal; min-width: 12em; }
.revoir { display: grid; gap: 6px; padding-left: 1.2em; }
.chip { display: inline-block; font: 600 .7rem var(--f-mono); padding: 1px 7px; border-radius: 99px; margin-right: 6px; }
.chip.ko { background: var(--ko-soft); color: var(--ko); }
.chip.mid { background: var(--mid-soft); color: var(--mid); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .9rem; }

/* ---------- responsive ---------- */
@media (max-width: 1240px) {
  .page-grid { grid-template-columns: minmax(0, 46rem); }
  .notices { max-width: 46rem; }
  .toc { display: none; }
}
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-block; }
  .sidebar { position: fixed; z-index: 45; top: calc(var(--top) + env(safe-area-inset-top, 0px)); left: 0; width: min(86vw, 320px); transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow); }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 25, .4); }
  .who { display: none; }
}
@media (max-width: 560px) {
  body { font-size: 16px; }
  .brand small { display: none; }
  .brand { font-size: 1.05rem; }
  .topbar { gap: 8px; }
  .theme-sel { display: none; }
  .brand span { display: none; }
  .seq-links { grid-template-columns: 1fr; }
  .seq-link.next { grid-column: 1; }
  .parcours a { grid-template-columns: minmax(0, 1fr) auto; }
  .parcours .k { grid-column: 1 / -1; }
  .m-row { grid-template-columns: minmax(0, 1fr); }
  .qz-body, .qz-head, .qz-foot { padding-left: 14px; padding-right: 14px; }
  .carte-in { flex-direction: column; align-items: flex-start; min-width: 0; gap: 10px; }
  .carte ul { padding-left: 14px; }
  .carte ul::before { display: none; }
  .carte li > span { white-space: normal; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}

/* ---------- fichier unique : démarrage, entraînement, rappel ---------- */
.mono { font-family: var(--f-mono); letter-spacing: .03em; }
.qz-badge.train { background: var(--mid-soft); color: var(--mid); }
.qz-first, .qz-first-inline { font-size: .84rem; color: var(--muted); }
.qz-first { padding: 8px 20px; border-top: 1px solid var(--line); }
.panel.start { border-width: 2px; border-color: var(--accent); display: grid; gap: 10px; }
.panel.start.ok { border-color: var(--ok); }
.panel.start p { margin: 0; }
.panel.start hr { margin: 6px 0; }
.start-step { font: 600 .74rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.panel.start.ok .start-step { color: var(--ok); }
.start-who { font: 700 1.3rem var(--f-display); margin: 0; }
.panel.start .fields { margin: 0; }
.ident-edit summary { cursor: pointer; font-size: .88rem; color: var(--muted); }
.ident-edit[open] { display: grid; gap: 10px; }
.notice.gate { margin-top: 10px; }
a.btn { text-decoration: none; display: inline-block; }
.remind {
  position: fixed; z-index: 70; max-width: min(26rem, calc(100vw - 32px));
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border: 2px solid var(--mid); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); font-size: .92rem;
  display: grid; gap: 8px;
}
.remind p { margin: 0; }
.notices:empty, .notices[hidden] { display: none; }

/* ---------- code (SQL, C#, PHP…) ---------- */
pre.code { font: .86rem/1.55 var(--f-mono); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 14px 0; }
pre.code.terminal { background: #10151f; color: #dce3f0; border-color: #10151f; }
pre.code .kw { color: var(--accent); font-weight: 600; }
pre.code.terminal .kw { color: #93a6ff; }
.ans.k-code textarea { font-family: var(--f-mono); font-size: .88rem; tab-size: 4; }

/* ---------- Ajouts du chapitre 2 (réseaux) ---------- */
.answer, .ans-prompt, .task-body { min-width: 0; }
.ans-prompt pre.code { max-width: 100%; overflow-x: auto; }
pre.code .cm { color: var(--muted); font-style: italic; }
pre.code .pr { color: var(--ok); font-weight: 600; }
pre.code .st { color: var(--key); }
pre.code .hl { background: var(--mid-soft); color: var(--fg); border-radius: 3px; }
figure.fig { margin: 1.4rem 0; padding: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
figure.fig svg { display: block; width: 100%; height: auto; max-width: 760px; margin: 0 auto; }
figure.fig figcaption { margin-top: .6rem; font-size: .88rem; color: var(--muted); text-align: center; }
figure.fig svg text { fill: var(--fg); font-family: var(--f-body); font-size: 13px; }
figure.fig svg text.sm { font-size: 11px; fill: var(--muted); }
figure.fig svg text.b { font-weight: 700; }
figure.fig svg .ln { stroke: var(--muted); stroke-width: 2; fill: none; }
figure.fig svg .ln-acc { stroke: var(--accent); stroke-width: 2.5; fill: none; }
figure.fig svg .bx { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; }
figure.fig svg .bx-acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
figure.fig svg .bx-key { fill: var(--key-soft); stroke: var(--key); stroke-width: 1.5; }
figure.fig svg .bx-ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.5; }
figure.fig svg .bx-mid { fill: var(--mid-soft); stroke: var(--mid); stroke-width: 1.5; }
figure.fig svg .dot { fill: var(--accent); }
.encap { display: grid; gap: 6px; font-family: var(--f-mono); font-size: .8rem; margin: 1rem 0; }
.encap > div { display: flex; align-items: stretch; gap: 0; overflow-x: auto; }
.encap .lab { flex: 0 0 8.5rem; font-family: var(--f-body); font-size: .85rem; color: var(--muted); padding: .35rem .5rem .35rem 0; }
.encap span { padding: .35rem .55rem; border: 1px solid var(--line); white-space: nowrap; }
.encap span + span { border-left: 0; }
.encap .h2l { background: var(--key-soft); } .encap .h3l { background: var(--accent-soft); }
.encap .h4l { background: var(--ok-soft); } .encap .d7 { background: var(--surface-2); flex: 1 0 auto; }
.encap .t2l { background: var(--key-soft); }
table.data.bits td, table.data.bits th { text-align: center; font-family: var(--f-mono); padding-left: .45rem; padding-right: .45rem; }
table.data td.hl, table.data th.hl { background: var(--mid-soft); }
table.data td.mono, .mono { font-family: var(--f-mono); }
.dl-cap { display: inline-flex; align-items: center; gap: .5rem; padding: .55rem .9rem; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; text-decoration: none; }
.dl-cap:hover { background: var(--accent); color: #fff; }
.aside.deep { border-color: var(--accent); background: var(--accent-soft); }
.aside.deep .aside-title::before { content: "EN PROFONDEUR"; color: var(--accent); }
.aside.pro { border-color: var(--key); background: var(--key-soft); }
.aside.pro .aside-title::before { content: "EN ENTREPRISE"; color: var(--key); }
.refco { font-size: .88rem; color: var(--muted); }
@media (max-width: 600px) {
  .encap > div { flex-wrap: wrap; }
  .encap .lab { flex-basis: 100%; padding-bottom: 0; }
}

<h1 data-cfg="title">Titre du cours</h1>
<p class="lead"><span data-cfg="lead"></span> Chaque activité se corrige seul : répondre, comparer, s’auto-évaluer.</p>

<h2>Mode d’emploi</h2>
<ol class="steps">
  <li>Suivre le parcours dans l’ordre : chaque partie s’appuie sur la précédente, et les TP arrivent au moment où les notions nécessaires ont été vues.</li>
  <li>Lire le cours, répondre aux questions au fil de la page, puis faire le quiz « Vérifier ses connaissances ».</li>
  <li>Pour chaque réponse rédigée, écrire sa propre réponse avant de demander la correction : le bouton « Comparer avec la correction » ne s’active qu’ensuite.</li>
  <li>Comparer, puis s’auto-évaluer : <span class="chip ok">Réussi</span><span class="chip mid">En partie</span><span class="chip ko">À revoir</span></li>
  <li>Terminer par le bilan : il liste les points à revoir et produit le compte rendu à rendre.</li>
</ol>

<h2>Les types d’activités</h2>
<dl class="def">
  <dt>Quiz</dt><dd>Questions à choix multiple, avec indice et explication après chaque réponse.</dd>
  <dt>Activité auto-corrigée</dt><dd>Tableaux à cocher, associations, lignes à repérer dans une capture ou une table : la vérification est immédiate, avec une explication pour chaque ligne.</dd>
  <dt>Réponse rédigée</dt><dd>Calculs d’adressage, plans d’adressage, commandes, explications et diagnostics. La correction se débloque après la rédaction ; l’auto-évaluation termine l’activité. Pour un calcul, <strong>poser le calcul</strong> (binaire, taille de bloc) : c’est la méthode qui est corrigée, pas seulement le résultat.</dd>
  <dt>La première tentative fait foi</dt><dd>Pour les quiz et les activités auto-corrigées, le premier résultat est retenu dans le bilan. Il est ensuite possible de recommencer autant de fois que l’on veut, en mode <span class="qz-badge train">Entraînement</span>, sans changer ce résultat.</dd>
  <dt>Niveaux d’exercice</dt><dd><span class="chip ok">essentiel</span> pour tous, <span class="chip" style="background:var(--accent-soft);color:var(--accent)">intermédiaire</span> pour consolider, <span class="chip" style="background:var(--key-soft);color:var(--key)">défi</span> pour aller plus loin.</dd>
  <dt>Encadrés « En profondeur » et « En entreprise »</dt><dd>Ils expliquent le pourquoi des choses (histoire, normes, fonctionnement interne) et la réalité du terrain. Ils ne sont pas évalués, mais ce sont eux qui permettent de comprendre au lieu d’apprendre par cœur, et de savoir réexpliquer une notion à quelqu’un.</dd>
</dl>

<div class="aside caution">

<div class="aside note">
  <p class="aside-title">Règles du jeu</p>
  <ul>
    <li><strong>Travail individuel et sans IA</strong> : concevoir un plan de VLAN, écrire une route ou une règle de pare-feu demandent un raisonnement qui doit devenir personnel. En stage, à l’épreuve E5 ou en entretien, il faudra justifier chaque choix d’architecture et chaque commande.</li>
    <li>Les commandes sont à <strong>taper</strong>, pas à copier-coller : c’est en les tapant qu’on les retient et qu’on comprend leurs paramètres.</li>

    <li>Chaque étudiant reçoit un <strong>identifiant personnel</strong> qui figure sur toutes les pages et sur le compte rendu. Le fichier de sauvegarde est personnel : ne pas le partager.</li>
  </ul>
</div>

<h2>Le fil rouge : la segmentation de la M2L</h2>
<p>Le contexte <strong>M2L</strong> du Réseau Certa décrit un réseau commun aux ligues et à l’administration, avec une DMZ, une connexion Internet mutualisée et un <strong>projet de segmentation</strong> pour renforcer la sécurité, pas encore en place. Ce chapitre réalise ce projet à partir du plan d’adressage du chapitre 2 (TP 6) : un VLAN par usage et par ligue, un routeur entre les VLAN, un site annexe relié au site principal (ajout pédagogique au contexte), la traduction d’adresses vers Internet, et un pare-feu pfSense qui protège la DMZ où se trouve le serveur web du chapitre 3.</p>
<p class="refco">Public : option <strong>SISR</strong> (bloc 2, semestre 2). Prérequis : chapitres 2 et 3 (adressage, plan d’adressage de la M2L, DHCP, DNS, serveurs SRV-WIN et SRV-DEB).</p>

<h2>Compétences travaillées</h2>
<ul class="refco">
  <li><strong>B2.1 SISR</strong> Concevoir une solution d’infrastructure réseau : principes des architectures réseau, périmètres de réseau, routage, plans d’adressage ; maquetter et prototyper une solution ; outil de conception et de simulation.</li>
  <li><strong>B2.2 SISR</strong> Installer, tester et déployer : installation et configuration des éléments d’interconnexion et des services techniques réseau ; techniques et protocoles d’administration à distance ; documentation technique.</li>
  <li><strong>B2.3 SISR</strong> Exploiter et dépanner : administrer sur site et à distance les éléments d’une infrastructure.</li>
  <li><strong>B3.4</strong> (première approche) : segmentation du réseau en zones de sécurité, sécurité de l’administration, accès distants.</li>
</ul>

<template data-page="p1">
<h1>Concevoir une architecture réseau</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : chapitre 2 (topologies, commutateur, routeur, plan d’adressage de la M2L) et chapitre 3 (services). Cette partie fixe la démarche de conception utilisée dans tout le chapitre. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Concevoir</div><ul>
  <li><span><b>Le besoin</b> : cahier des charges, existant, contraintes</span></li>
  <li><span><b>Le modèle hiérarchique</b> : accès, distribution, cœur</span></li>
  <li><span><b>Les schémas</b> : physique et logique</span></li>
  <li><span><b>Maquette et prototype</b> : valider avant de déployer</span></li>
  <li><span><b>Le dossier de choix</b> : coût, qualité, environnement</span></li>
</ul></div></figure>

<p class="lead">Un réseau d’entreprise ne s’improvise pas : il se <strong>conçoit</strong> à partir d’un besoin, se <strong>représente</strong> par des schémas et des plans, se <strong>valide</strong> sur une maquette, puis se <strong>justifie</strong> dans un dossier de choix. C’est le cœur de la compétence B2.1 et de l’épreuve E5 de l’option SISR.</p>

<h2>Partir du besoin et de l’existant</h2>
<p>Le point de départ est un <strong>besoin exprimé</strong>, plus ou moins formalisé : une demande d’un responsable, ou un <strong>cahier des charges</strong> qui précise :</p>
<ul>
  <li>les <strong>besoins fonctionnels</strong> : ce que les utilisateurs doivent pouvoir faire (« chaque ligue accède à ses fichiers et à Internet, pas aux fichiers des autres ligues ») ;</li>
  <li>les <strong>exigences de qualité</strong> : débit, disponibilité, sécurité, conformité à la réglementation (RGPD) ;</li>
  <li>les <strong>contraintes</strong> : budget, délais, matériel existant à réutiliser, locaux, compétences de l’équipe ;</li>
  <li>depuis la réforme du BTS, les <strong>préoccupations éthiques et environnementales</strong> : consommation électrique, durée de vie et recyclage du matériel, choix du reconditionné.</li>
</ul>
<p>Avant de proposer quoi que ce soit, on étudie l’<strong>existant</strong> : inventaire du matériel (chapitre 1), schémas, plan d’adressage, flux entre services. Toute évolution doit être évaluée pour son <strong>impact</strong> sur le reste du système : un changement de plan d’adressage touche le DHCP, le DNS, les règles de pare-feu, les imprimantes configurées à la main… Le guide du BTS insiste sur la notion de <strong>régression</strong> : vérifier que ce qui marchait marche toujours.</p>

<h2>Le modèle hiérarchique</h2>
<p>Pour qu’un réseau reste lisible, évolutif et dépannable, on organise les équipements en <strong>couches</strong>, selon le modèle hiérarchique popularisé par Cisco :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Couche</th><th>Rôle</th><th>Équipements, fonctions</th></tr>
  <tr><td><strong>Accès</strong></td><td>Raccorder les utilisateurs et les équipements terminaux.</td><td>Commutateurs d’étage, bornes Wi-Fi ; affectation des ports aux VLAN, alimentation PoE, sécurité des ports.</td></tr>
  <tr><td><strong>Distribution</strong></td><td>Regrouper les commutateurs d’accès, router entre les VLAN, appliquer les règles.</td><td>Commutateurs de niveau 3 ou routeurs ; routage inter-VLAN, filtrage (listes de contrôle d’accès), redondance des liens montants.</td></tr>
  <tr><td><strong>Cœur</strong></td><td>Transporter très vite le trafic entre les blocs de distribution et vers les serveurs.</td><td>Commutateurs très rapides et redondants, sans traitement complexe.</td></tr>
</table></div>
<p>Dans une structure de taille moyenne comme la M2L, distribution et cœur sont souvent réunis dans les mêmes équipements : on parle de <strong>cœur réduit</strong> (<em>collapsed core</em>). C’est le rôle des deux commutateurs-routeurs empilés de l’armoire principale du bâtiment B.</p>

<div class="match" data-id="m-couches-h" data-label="Placer chaque fonction dans la bonne couche" data-options="Accès|Distribution|Cœur">
  <div class="r" data-ok="Accès" data-expl="Le raccordement des postes et l’affectation des ports aux VLAN se font en couche d’accès.">Raccorder les 20 postes d’un étage et alimenter les téléphones IP en PoE</div>
  <div class="r" data-ok="Distribution" data-expl="Le routage entre VLAN et le filtrage entre services sont des fonctions de distribution.">Router entre le VLAN de l’administration et celui des ligues, en filtrant certains flux</div>
  <div class="r" data-ok="Cœur" data-expl="Le cœur transporte vite et de façon redondante, sans traitement complexe.">Transporter à 10 Gb/s, de façon redondante, le trafic entre les blocs de bâtiments et la salle serveurs</div>
  <div class="r" data-ok="Accès" data-expl="Limiter le nombre d’adresses MAC par port (sécurité des ports) protège le point d’entrée des utilisateurs : couche d’accès.">Interdire qu’un visiteur branche un commutateur personnel sur une prise murale</div>
  <div class="r" data-ok="Distribution" data-expl="Regrouper les liaisons montantes des commutateurs d’étage est le rôle de la distribution.">Regrouper les liaisons montantes des quatre commutateurs du bâtiment A</div>
</div>

<h3>Redondance et disponibilité</h3>
<p>Une architecture en étoile a des <strong>points uniques de panne</strong> : un commutateur d’armoire, une liaison montante, le pare-feu. Les solutions (doubler les liaisons, empiler deux commutateurs, agréger des liens, protocole STP contre les boucles, partie 2) sont étudiées en détail en deuxième année, avec la haute disponibilité. En première année, on sait <strong>les repérer</strong> et les signaler dans un dossier.</p>

<h2>Représenter le réseau : les schémas</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th></th><th>Schéma physique</th><th>Schéma logique</th></tr>
  <tr><td>Montre</td><td>Où sont les équipements et comment ils sont câblés : bâtiments, baies, numéros de ports, types de câbles et de liaisons (cuivre, fibre).</td><td>Comment circulent les données : réseaux et VLAN, adresses, passerelles, routeurs, zones de sécurité, services.</td></tr>
  <tr><td>Sert à</td><td>Intervenir sur place, remplacer un équipement, retrouver une prise.</td><td>Configurer, filtrer, diagnostiquer un problème d’adressage ou de routage.</td></tr>
  <tr><td>Exemple d’information</td><td>« Port Gi0/1 de SW-A2 relié par fibre au port 12 de SW-B »</td><td>« VLAN 106, 172.16.8.160/27, passerelle .190 »</td></tr>
</table></div>
<p>Un schéma professionnel a un titre, une <strong>légende</strong>, une date et un numéro de version, et utilise des symboles standard (ceux de Cisco sont les plus répandus). Outils : Packet Tracer pour la maquette, <strong>diagrams.net</strong> (gratuit, aussi appelé draw.io) ou Visio pour la documentation.</p>
<div class="ctab" data-id="c-schema" data-head="Information" data-cols="Schéma où elle figure" data-choices="PHYSIQUE|LOGIQUE" data-label="Schéma physique ou logique">
  <div class="r" data-ok="PHYSIQUE" data-expl="L’emplacement et le câblage relèvent du schéma physique.">L’armoire du bâtiment C est reliée au bâtiment B par une fibre multimode.</div>
  <div class="r" data-ok="LOGIQUE" data-expl="Les réseaux et leurs passerelles relèvent du schéma logique.">Le VLAN 20 utilise le réseau 172.16.2.192/27, passerelle 172.16.2.222.</div>
  <div class="r" data-ok="LOGIQUE" data-expl="Les zones de sécurité et le rôle du pare-feu figurent sur le schéma logique.">Le serveur web est dans la DMZ, séparée du LAN par le pare-feu.</div>
  <div class="r" data-ok="PHYSIQUE" data-expl="Un numéro de port et une prise relèvent du schéma physique.">Le poste du bureau A201 est branché sur la prise 01, reliée au port Fa0/1 du commutateur de l’étage.</div>
</div>

<h2>Maquette et prototype</h2>
<dl class="def">
  <dt>Maquette</dt><dd>Représentation la plus fidèle possible de la solution dans un <strong>outil de simulation</strong> (Packet Tracer, GNS3). Elle valide l’architecture et les configurations sans matériel. Mais un simulateur ne reproduit pas tout : le référentiel précise qu’il ne peut pas remplacer complètement des équipements réels.</dd>
  <dt>Prototype</dt><dd>Réalisation dans un <strong>environnement de test proche de la production</strong> : machines virtuelles, matériel réel de la baie. Il révèle les problèmes concrets (versions, performances, compatibilité) avant la mise en production.</dd>
</dl>
<p>Dans ce chapitre : maquettes Packet Tracer aux TP 10 et 11, prototype sur le matériel de la baie (TP 10) et dans VirtualBox avec pfSense (TP 12).</p>

<h2>Le dossier de choix</h2>
<p>Quand plusieurs solutions répondent au besoin, on rédige un <strong>dossier de choix</strong> qui les compare selon des critères explicites et justifie la solution retenue :</p>
<ul>
  <li><strong>coût total de possession</strong> : achat, mais aussi installation, licences, maintenance, énergie, formation, sur la durée de vie ;</li>
  <li><strong>qualité</strong> : performances, disponibilité, sécurité, évolutivité ;</li>
  <li><strong>délai</strong> de mise en œuvre et compétences nécessaires ;</li>
  <li><strong>impact environnemental</strong> : consommation, réemploi du matériel existant, matériel reconditionné, durée du support du constructeur.</li>
</ul>
<p>Il se termine par les <strong>spécifications techniques</strong> de la solution (plan d’adressage, plan de VLAN, schémas, liste du matériel) et les <strong>tests</strong> qui permettront de la valider (chapitre 3, partie 4).</p>

<div class="answer" data-id="a-existant" data-label="Analyser l’existant de la M2L et proposer des évolutions" data-min="200" data-rows="10">
  <p>À partir de la description du réseau de la M2L (chapitre 2, partie 1 et TP 6), relever au moins quatre faiblesses de l’existant et, pour chacune, l’évolution proposée. Penser à la sécurité, aux performances, à la disponibilité et à l’exploitation.</p>
  <p class="hint">Réseau commun aux ligues et à l’administration ; commutateurs 10/100 du bâtiment A ; une seule liaison par armoire ; Wi-Fi visiteurs ; adressage automatique des ligues sans annuaire…</p>
  <div class="corr">
    <div class="tbl-wrap"><table class="data wide">
      <tr><th>Faiblesse</th><th>Conséquence</th><th>Évolution proposée</th></tr>
      <tr><td>Réseau « à plat », commun aux ligues et à l’administration</td><td>Une ligue peut atteindre les postes et serveurs de l’administration ou d’une autre ligue ; diffusions sur tout le réseau</td><td>Segmentation en VLAN (un par usage et par ligue) et filtrage entre VLAN (parties 2 et 5)</td></tr>
      <tr><td>Commutateurs 10/100 du bâtiment A, câblage Cat 5</td><td>Débits limités à 100 Mb/s (chapitre 2)</td><td>Remplacement par des commutateurs Gigabit PoE ; recâblage progressif en Cat 6A</td></tr>
      <tr><td>Une seule liaison entre chaque armoire et le bâtiment B</td><td>Point unique de panne : tout un étage coupé</td><td>Doubler les liaisons montantes (étude en deuxième année)</td></tr>
      <tr><td>Wi-Fi visiteurs sur le même réseau que les ligues (si non isolé)</td><td>Un visiteur malveillant atteint les postes internes</td><td>VLAN dédié, accès à Internet uniquement, filtré par le pare-feu</td></tr>
      <tr><td>Absence de schémas et de documentation à jour</td><td>Dépannages longs, erreurs de configuration</td><td>Schémas physique et logique versionnés, plans d’adressage et de VLAN, sauvegarde des configurations</td></tr>
    </table></div>
    <p>D’autres faiblesses sont acceptées si elles sont justifiées : postes des ligues hors annuaire, téléphonie analogique dans les bâtiments A et B, absence de supervision, etc.</p>
  </div>
</div>

<div class="aside note">

    <li>Proposer une solution technique avant d’avoir analysé le besoin et l’existant.</li>
    <li>Mélanger informations physiques et logiques sur un même schéma surchargé : faire deux schémas.</li>
    <li>Comparer des solutions sur leur seul prix d’achat, en oubliant la maintenance, l’énergie et la formation.</li>

<h1>Les VLAN et le routage inter-VLAN</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : chapitre 2 (commutateur, table MAC, domaine de diffusion, sous-réseaux) et <a href="#p1">partie 1</a>. Une capture est fournie. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">VLAN</div><ul>
  <li><span><b>Le principe</b> : plusieurs réseaux sur les mêmes commutateurs</span></li>
  <li><span><b>Port d’accès</b> : un VLAN, trames non étiquetées</span></li>
  <li><span><b>Trunk 802.1Q</b> : plusieurs VLAN, trames étiquetées</span></li>
  <li><span><b>Routage inter-VLAN</b> : routeur sur un bâton, commutateur de niveau 3</span></li>
  <li><span><b>STP</b> : éviter les boucles</span></li>
</ul></div></figure>

<p class="lead">Pour séparer les ligues, l’administration, les visiteurs et la téléphonie de la M2L, il faudrait sans VLAN un commutateur par réseau dans chaque armoire. Les <strong>VLAN</strong> (<em>Virtual LAN</em>, réseaux locaux virtuels) découpent un même commutateur en plusieurs réseaux isolés, et un seul câble entre deux armoires suffit pour les transporter tous.</p>

<h2>Qu’est-ce qu’un VLAN ?</h2>
<p>Un <strong>VLAN</strong> est un <strong>domaine de diffusion</strong> logique : les équipements d’un même VLAN communiquent directement entre eux (couche 2), même s’ils sont sur des commutateurs différents ; les équipements de VLAN différents sont isolés comme s’ils étaient sur des commutateurs séparés.</p>
<ul>
  <li>Chaque VLAN a un <strong>numéro</strong> (de 1 à 4094) et un nom. Le VLAN 1 existe par défaut : tous les ports y sont au départ.</li>
  <li>Règle d’or : <strong>un VLAN = un sous-réseau IP</strong>. Le VLAN 20 de la M2L correspond au réseau 172.16.2.192/27.</li>
  <li>Pour passer d’un VLAN à un autre, il faut <strong>un routeur</strong> (ou un commutateur de niveau 3), exactement comme entre deux réseaux physiques. C’est là qu’on <strong>filtre</strong> (partie 5).</li>
</ul>
<p>Intérêts : sécurité (isolement des ligues, des visiteurs), limitation des diffusions, souplesse (déplacer un poste dans un autre réseau = changer le VLAN d’un port, sans recâbler), économie de matériel.</p>

<h3>Le plan de VLAN de la M2L</h3>
<p>Ce plan, construit à partir du plan d’adressage du chapitre 2, sert dans tous les TP du chapitre :</p>

<p class="refco">Le VLAN 99 et son réseau <code>172.16.3.0/28</code> (pris dans la réserve du plan du TP 6) servent à joindre les commutateurs pour les administrer, séparément du trafic des utilisateurs.</p>

<h2>Ports d’accès et trunks</h2>
<dl class="def">
  <dt>Port d’accès <small>access</small></dt><dd>Port affecté à <strong>un seul VLAN</strong>, où l’on branche un poste, une imprimante, un serveur. Les trames y circulent <strong>sans étiquette</strong> : le poste ignore tout du VLAN, c’est le commutateur qui sait à quel VLAN appartient le port.</dd>
  <dt>Trunk <small>port d’agrégation, lien 802.1Q</small></dt><dd>Lien qui transporte <strong>plusieurs VLAN</strong> : entre deux commutateurs, vers un routeur, vers une borne Wi-Fi qui diffuse plusieurs SSID. Chaque trame y porte une <strong>étiquette</strong> (<em>tag</em>) qui indique son VLAN.</dd>
</dl>
<h3>L’étiquette 802.1Q</h3>
<p>La norme <strong>IEEE 802.1Q</strong> insère 4 octets dans la trame Ethernet, juste après l’adresse MAC source :</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>MAC dest</th><th>MAC src</th><th class="hl">TPID <code>0x8100</code> (2 octets)</th><th class="hl">PCP (3 bits) · DEI (1 bit) · <strong>VID (12 bits)</strong></th><th>EtherType</th><th>Données</th><th>FCS</th></tr>
</table></div>
<p>Le <strong>VID</strong> (12 bits) donne le numéro de VLAN : 2<sup>12</sup> = 4096 valeurs, dont 0 et 4095 réservées, d’où les VLAN 1 à 4094. Le <strong>PCP</strong> indique une priorité, utilisée pour favoriser la voix sur IP (qualité de service, deuxième année). Une trame étiquetée mesure jusqu’à 1 522 octets.</p>
<dl class="def">
  <dt>VLAN natif</dt><dd>Sur un trunk, les trames d’un VLAN particulier, le <strong>VLAN natif</strong> (par défaut le VLAN 1), circulent <strong>sans étiquette</strong>. Il doit être le même aux deux extrémités du trunk, sinon les trames passent d’un VLAN à l’autre (Cisco signale alors un <em>native VLAN mismatch</em>). Bonne pratique de sécurité : un VLAN natif inutilisé (999 à la M2L), et ne laisser aucun utilisateur dans le VLAN 1.</dd>
  <dt>VLAN autorisés</dt><dd>On limite la liste des VLAN transportés par chaque trunk à ceux qui sont nécessaires.</dd>
</dl>

<div class="ctab" data-id="c-acces-trunk" data-head="Port" data-cols="Mode du port" data-choices="ACCÈS|TRUNK" data-label="Port d’accès ou trunk">

<h3>Configurer les VLAN sur un commutateur Cisco</h3>
<pre class="code terminal"><span class="pr">SW-A2(config)#</span> vlan 106
<span class="pr">SW-A2(config-vlan)#</span> name LIGUE-06
<span class="pr">SW-A2(config-vlan)#</span> exit
<span class="pr">SW-A2(config)#</span> interface range FastEthernet0/1 - 10
<span class="pr">SW-A2(config-if-range)#</span> switchport mode access
<span class="pr">SW-A2(config-if-range)#</span> switchport access vlan 106
<span class="pr">SW-A2(config-if-range)#</span> exit
<span class="pr">SW-A2(config)#</span> interface GigabitEthernet0/1
<span class="pr">SW-A2(config-if)#</span> switchport mode trunk
<span class="pr">SW-A2(config-if)#</span> switchport trunk native vlan 999
<span class="pr">SW-A2(config-if)#</span> switchport trunk allowed vlan 50,99,106
<span class="pr">SW-A2(config-if)#</span> end
<span class="pr">SW-A2#</span> show vlan brief
VLAN Name                             Status    Ports
---- -------------------------------- --------- -------------------------------
1    default                          active    Fa0/11, Fa0/12, Fa0/13, …
106  LIGUE-06                         active    Fa0/1, Fa0/2, Fa0/3, Fa0/4
                                                Fa0/5, Fa0/6, Fa0/7, Fa0/8
                                                Fa0/9, Fa0/10
<span class="pr">SW-A2#</span> show interfaces trunk
Port        Mode         Encapsulation  Status        Native vlan
Gi0/1       on           802.1q         trunking      999
Port        Vlans allowed on trunk
Gi0/1       50,99,106</pre>
<p>Les ports en trunk n’apparaissent pas dans <code>show vlan brief</code> : on les vérifie avec <code>show interfaces trunk</code>. Les VLAN doivent aussi être <strong>créés</strong> sur chaque commutateur qui les transporte.</p>

<h2>Le routage inter-VLAN</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Méthode</th><th>Principe</th><th>Avantages / limites</th></tr>
  <tr><td>Un port de routeur par VLAN</td><td>Chaque VLAN arrive sur une interface physique du routeur.</td><td>Simple, mais il faut autant de ports et de câbles que de VLAN : abandonné.</td></tr>
  <tr><td><strong>Routeur sur un bâton</strong> (<em>router-on-a-stick</em>)</td><td>Un seul lien trunk vers le routeur, découpé en <strong>sous-interfaces</strong>, une par VLAN, chacune avec l’adresse de passerelle du VLAN.</td><td>Peu coûteux, idéal pour apprendre et pour une petite structure ; le lien unique limite le débit.</td></tr>
  <tr><td><strong>Commutateur de niveau 3</strong></td><td>Le commutateur route lui-même grâce à des interfaces virtuelles (<em>SVI</em>, <code>interface vlan 10</code>).</td><td>Très rapide, solution des entreprises (les commutateurs-routeurs de la M2L) ; plus coûteux.</td></tr>
</table></div>
<pre class="code terminal"><span class="cm">! Routeur sur un bâton : le port G0/0/0 est relié au trunk du commutateur central</span>
<span class="pr">R1(config)#</span> interface GigabitEthernet0/0/0
<span class="pr">R1(config-if)#</span> no shutdown
<span class="pr">R1(config-if)#</span> interface GigabitEthernet0/0/0.10
<span class="pr">R1(config-subif)#</span> encapsulation dot1Q 10
<span class="pr">R1(config-subif)#</span> ip address 172.16.2.190 255.255.255.192
<span class="pr">R1(config-subif)#</span> interface GigabitEthernet0/0/0.20
<span class="pr">R1(config-subif)#</span> encapsulation dot1Q 20
<span class="pr">R1(config-subif)#</span> ip address 172.16.2.222 255.255.255.224

<span class="cm">! Équivalent sur un commutateur de niveau 3</span>
<span class="pr">SW-B(config)#</span> ip routing
<span class="pr">SW-B(config)#</span> interface vlan 10
<span class="pr">SW-B(config-if)#</span> ip address 172.16.2.190 255.255.255.192</pre>
<p>Le numéro de sous-interface (<code>.10</code>) est libre, mais on le fait correspondre au VLAN par convention. C’est la commande <code>encapsulation dot1Q 10</code> qui associe réellement la sous-interface au VLAN 10.</p>

<div class="answer" data-id="a-trunk" data-label="Expliquer ce que montre la capture du trunk" data-min="150" data-rows="8">
  <p>a) Les trames 6 et 7 transportent le même paquet. Comparer leur étiquette VLAN, leurs adresses MAC source et destination, et leur TTL. Expliquer chaque différence. b) Pourquoi le premier ping (<code>seq=21</code>, trame 3) n’a-t-il pas de réponse ? c) Pourquoi les trames ARP mesurent-elles 64 octets ici, et non 60 comme au chapitre 2 ?</p>
  <div class="corr">
    <p>a) Trame 6 : VLAN 10, de PC-ADM1 vers R1, TTL 128. Trame 7 : VLAN 20, de R1 vers PC-MM1, TTL 127. Le paquet est entré dans R1 par la sous-interface du VLAN 10 ; R1 l’a routé vers la sous-interface du VLAN 20 : nouvelle trame, nouvelle étiquette, nouvelles adresses MAC (chapitre 2 : les MAC changent à chaque routeur), et TTL diminué de 1 par le routage. Les adresses IP n’ont pas changé.</p>
    <p>b) À l’arrivée du premier paquet, R1 ne connaissait pas l’adresse MAC de PC-MM1 : il a lancé une requête ARP (trames 4 et 5) et a abandonné ce premier paquet. Le ping suivant passe. C’est pourquoi le premier ping vers un nouveau réseau est souvent perdu (<em>délai d’attente dépassé</em>, puis trois réponses).</p>
    <p>c) L’étiquette 802.1Q ajoute 4 octets : 60 + 4 = 64 octets (sans le FCS).</p>
  </div>
</div>

<h2>Les boucles et le protocole STP</h2>
<p>Pour la disponibilité, on relie souvent les commutateurs par plusieurs chemins. Mais en couche 2, une <strong>boucle</strong> est catastrophique : une trame de diffusion tourne indéfiniment (il n’y a pas de TTL dans une trame Ethernet), se multiplie à chaque commutateur et sature le réseau en quelques secondes : c’est la <strong>tempête de diffusion</strong>. Les tables MAC deviennent instables.</p>
<p>Le protocole <strong>STP</strong> (<em>Spanning Tree Protocol</em>, IEEE 802.1D, et sa version rapide RSTP, 802.1w) empêche les boucles :</p>
<ol class="steps">
  <li>Les commutateurs échangent des messages (BPDU) et élisent un <strong>pont racine</strong> : celui qui a le plus petit identifiant (priorité, 32 768 par défaut, puis adresse MAC). On choisit le pont racine en baissant sa priorité, sinon c’est le plus ancien commutateur (plus petite MAC) qui l’emporte.</li>
  <li>Chaque commutateur calcule son meilleur chemin vers la racine.</li>
  <li>Les ports qui créeraient une boucle sont mis en état <strong>bloquant</strong> : ils ne transmettent plus de trames, mais se réactivent si le chemin principal tombe.</li>
</ol>
<p>Sur les ports d’accès (où ne sont branchés que des postes), on active <strong>PortFast</strong> pour que le port soit utilisable immédiatement, et <strong>BPDU Guard</strong> pour le désactiver si quelqu’un y branche un commutateur. Cisco utilise par défaut une version de STP par VLAN (PVST+). L’étude détaillée de STP relève de la deuxième année.</p>

<div class="aside pro">
  <p class="aside-title">La boucle du câble « en trop »</p>
  <p>Un grand classique du support : un utilisateur relie deux prises murales de son bureau avec un câble, ou branche un petit commutateur de bureau en double. Sans STP (ou avec un petit commutateur qui ne le gère pas), tout l’étage s’effondre. Les symptômes : voyants qui clignotent en permanence, réseau inutilisable, processeur du commutateur à 100 %. Le premier réflexe : débrancher les liens suspects un par un et regarder les journaux du commutateur.</p>
</div>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Oublier de créer le VLAN sur un commutateur intermédiaire : le trunk ne transporte pas ce VLAN.</li>
    <li>Des VLAN natifs différents aux deux bouts d’un trunk, ou une liste de VLAN autorisés incomplète.</li>
    <li>Croire que deux postes de VLAN différents communiquent parce qu’ils sont sur le même commutateur : sans routeur, c’est impossible.</li>
  </ul>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p2" data-title="VLAN" data-label="Quiz de fin de partie">
  <div class="q" data-ok="3">
    <p class="qt">Combien d’octets l’étiquette 802.1Q ajoute-t-elle à une trame ?</p>
    <ul><li>2</li><li>12</li><li>4</li><li>8</li></ul>
    <div class="expl"><p>4 octets : TPID (2 octets) et informations de contrôle (2 octets, dont le VID sur 12 bits).</p></div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Deux postes sont branchés sur le même commutateur, l’un dans le VLAN 10, l’autre dans le VLAN 20. Que faut-il pour qu’ils communiquent ?</p>
    <ul><li>Un routeur ou un commutateur de niveau 3</li><li>Rien, ils sont sur le même commutateur</li><li>Un câble croisé</li><li>Un second commutateur</li></ul>
    <div class="expl"><p>Deux VLAN sont deux réseaux distincts : il faut router entre eux.</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Quelle commande associe une sous-interface de routeur au VLAN 30 ?</p>
    <ul><li><code>switchport access vlan 30</code></li><li><code>vlan 30</code></li><li><code>interface vlan 30</code></li><li><code>encapsulation dot1Q 30</code></li></ul>
    <div class="expl"><p>Sur une sous-interface de routeur : <code>encapsulation dot1Q 30</code>. <code>switchport access vlan</code> affecte un port de commutateur ; <code>interface vlan</code> crée une SVI sur un commutateur de niveau 3.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Sur un trunk, comment circulent les trames du VLAN natif ?</p>
    <ul><li>Avec une étiquette 0</li><li>Sans étiquette</li><li>Chiffrées</li><li>Elles sont bloquées</li></ul>
    <div class="expl"><p>Le VLAN natif est transporté sans étiquette ; il doit être identique aux deux extrémités.</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">À quoi sert le protocole STP ?</p>
    <ul><li>À router entre VLAN</li><li>À attribuer des adresses</li><li>À empêcher les boucles de couche 2 en bloquant des ports redondants</li><li>À chiffrer les trunks</li></ul>
    <div class="expl"><p>STP élit un pont racine et bloque les ports qui formeraient une boucle, tout en les gardant en réserve.</p></div>
  </div>
</div>

<h2>Mission 3 : dépanner des VLAN</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Trois tickets, trois causes</summary>
  <div class="task-body">
    <div class="tbl-wrap"><table class="data wide">
      <tr><th>Ticket</th><th>Symptôme</th><th>Relevé</th></tr>
      <tr><td>T1</td><td>Un nouveau poste de la ligue de volley, branché sur SW-A2 Fa0/5, n’obtient rien : pas de réponse de la passerelle.</td><td><code>show vlan brief</code> sur SW-A2 : Fa0/5 apparaît dans le VLAN 1 (<em>default</em>).</td></tr>
      <tr><td>T2</td><td>Les postes de volley joignent leurs voisins de l’étage, mais ni leur passerelle ni les serveurs.</td><td><code>show interfaces trunk</code> sur SW-B : <code>Vlans allowed on trunk : 10,20,30,99,999</code> pour Gi0/1.</td></tr>
      <tr><td>T3</td><td>SW-B affiche régulièrement : <code>%CDP-4-NATIVE_VLAN_MISMATCH: Native VLAN mismatch discovered on GigabitEthernet0/1 (999), with SW-A2 GigabitEthernet0/1 (1).</code></td><td>—</td></tr>
    </table></div>
    <div class="answer" data-id="t10-pannes" data-label="Mission 3 : diagnostic des tickets VLAN" data-min="200" data-rows="9">
      <p>Pour chaque ticket : cause, conséquence, commandes de correction. Reproduire chaque panne dans la maquette pour vérifier le diagnostic, puis corriger.</p>
      <div class="corr">
        <p><strong>T1</strong> : le port Fa0/5 n’a pas été mis dans le VLAN 106 (configuration oubliée, ou commutateur remplacé). Le poste est dans le VLAN 1, isolé de son réseau. Correction : <code>interface Fa0/5</code>, <code>switchport mode access</code>, <code>switchport access vlan 106</code>.</p>
        <p><strong>T2</strong> : le VLAN 106 n’est pas autorisé sur le trunk entre SW-B et SW-A2. Les trames du VLAN 106 restent sur SW-A2 et n’atteignent jamais R1. Correction sur SW-B : <code>interface Gi0/1</code>, <code>switchport trunk allowed vlan add 106</code> (le mot <code>add</code> ajoute un VLAN à la liste ; sans lui, la liste est remplacée).</p>
        <p><strong>T3</strong> : VLAN natif différent aux deux extrémités du trunk (999 sur SW-B, 1 sur SW-A2). Les trames non étiquetées passent d’un VLAN à l’autre : risque de fuite entre VLAN. Correction sur SW-A2 : <code>interface Gi0/1</code>, <code>switchport trunk native vlan 999</code>. Le message est envoyé grâce au protocole CDP, par lequel les équipements Cisco voisins s’échangent des informations.</p>
      </div>
    </div>

<h2>Défi : le DHCP pour tous les VLAN</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Relais DHCP sur les sous-interfaces</summary>
  <div class="task-body">
    <div class="answer" data-id="t10-defi" data-kind="code" data-label="Défi : relais DHCP vers SRV-AD pour les VLAN 10, 20 et 106" data-min="100" data-rows="9">
      <p>Faire passer PC-ADM1, PC-MM1 et les postes de volley en DHCP, avec SRV-AD comme serveur DHCP unique (pools du TP 8, plus un pool pour la ligue 06). Écrire les commandes à ajouter sur R1 et les pools à créer, puis tester.</p>
      <div class="corr">
        <pre class="code">! R1 : relais sur chaque sous-interface des réseaux clients
interface GigabitEthernet0/0/0.10
 ip helper-address 172.16.2.225
interface GigabitEthernet0/0/0.20
 ip helper-address 172.16.2.225
interface GigabitEthernet0/0/0.106
 ip helper-address 172.16.2.225

! SRV-AD, Services &gt; DHCP : trois pools
Administration : passerelle 172.16.2.190, DNS 172.16.2.225, début 172.16.2.140, masque 255.255.255.192
Multimedia     : passerelle 172.16.2.222, DNS 172.16.2.225, début 172.16.2.194, masque 255.255.255.224
Ligue06        : passerelle 172.16.8.190, DNS 172.16.2.225, début 172.16.8.161, masque 255.255.255.224</pre>
        <p>Pas de relais sur la sous-interface .30 : le serveur est dans ce réseau et reçoit directement les diffusions. Un seul serveur DHCP sert maintenant tous les VLAN : c’est l’architecture du contexte M2L (le serveur de l’administration « assure aussi le DHCP »).</p>
      </div>
    </div>
  </div>
</details>

<template data-page="p3">
<h1>Le routage</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : chapitre 2 (passerelle, décision « local ou distant », résumé de routes) et <a href="#tp10">TP 10</a> (routes <code>C</code> et <code>L</code> de R1). Travail <strong>sans IA</strong>, brouillon conseillé pour dessiner les topologies.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Routage</div><ul>
  <li><span><b>Table de routage</b> : destination, masque, prochain saut, interface</span></li>
  <li><span><b>Types de routes</b> : connectées, statiques, par défaut, dynamiques</span></li>
  <li><span><b>Le choix</b> : préfixe le plus long, puis distance administrative</span></li>
  <li><span><b>Les routes retour</b> : un échange a deux sens</span></li>
  <li><span><b>Routage dynamique</b> : RIP, OSPF, BGP en notions</span></li>
</ul></div></figure>

<p class="lead">Un routeur reçoit un paquet, lit son adresse IP de destination et doit décider par où le faire sortir. Il consulte sa <strong>table de routage</strong>. Comprendre comment cette table se remplit et comment le routeur choisit une ligne, c’est savoir construire un réseau multi-sites et diagnostiquer les problèmes de « ça part mais ça ne revient pas ».</p>

<h2>La table de routage</h2>
<p>Chaque ligne (une <strong>route</strong>) indique : un <strong>réseau de destination</strong> et son masque, et le moyen de l’atteindre, soit une <strong>interface</strong> de sortie (réseau directement connecté), soit l’adresse du <strong>prochain saut</strong> (<em>next hop</em>), le routeur voisin à qui confier le paquet. Le routeur ne connaît jamais le chemin complet : il sait seulement à qui passer le paquet. Chaque routeur sur le chemin refait la même décision.</p>
<pre class="code terminal"><span class="pr">R-M2L#</span> show ip route
Codes: L - local, C - connected, S - static, R - RIP, O - OSPF, B - BGP, * - candidate default

Gateway of last resort is 203.0.113.1 to network 0.0.0.0

S*    0.0.0.0/0 [1/0] via 203.0.113.1
      172.16.0.0/16 is variably subnetted, 5 subnets, 4 masks
C        172.16.2.128/26 is directly connected, GigabitEthernet0/0/0
L        172.16.2.190/32 is directly connected, GigabitEthernet0/0/0
S        172.16.12.0/24 [1/0] via 172.16.15.250
C        172.16.15.248/30 is directly connected, GigabitEthernet0/0/1
L        172.16.15.249/32 is directly connected, GigabitEthernet0/0/1
      203.0.113.0/24 is variably subnetted, 2 subnets, 2 masks
C        203.0.113.0/30 is directly connected, GigabitEthernet0/0/2
L        203.0.113.2/32 is directly connected, GigabitEthernet0/0/2</pre>
<dl class="def">
  <dt>C <small>connected</small> et L <small>local</small></dt><dd>Créées automatiquement pour chaque interface active qui a une adresse : le réseau de l’interface (C) et l’adresse du routeur lui-même (L, en /32).</dd>
  <dt>S <small>static</small></dt><dd>Route <strong>statique</strong>, écrite à la main par l’administrateur. Ici : le réseau du site annexe, <code>172.16.12.0/24</code>, est joignable par le routeur voisin <code>172.16.15.250</code>.</dd>
  <dt>S* : la route par défaut</dt><dd><code>0.0.0.0/0</code> correspond à <strong>toutes</strong> les destinations : elle est utilisée quand aucune autre route ne convient (<em>gateway of last resort</em>). C’est l’équivalent, pour un routeur, de la passerelle par défaut d’un poste. Ici : tout le reste part vers l’opérateur.</dd>
  <dt>[1/0]</dt><dd>Distance administrative / métrique (voir plus bas).</dd>
</dl>
<p>Les postes ont aussi une table de routage : <code>route print</code> (Windows), <code>ip route</code> (Linux). Leur passerelle par défaut est une route <code>0.0.0.0/0</code>.</p>

<h3>Écrire des routes statiques</h3>
<pre class="code terminal"><span class="cm">! Cisco : ip route réseau masque prochain-saut</span>
<span class="pr">R-M2L(config)#</span> ip route 172.16.12.0 255.255.255.0 172.16.15.250
<span class="pr">R-M2L(config)#</span> ip route 0.0.0.0 0.0.0.0 203.0.113.1

<span class="cm"># Linux</span>
<span class="pr">$</span> sudo ip route add 172.16.12.0/24 via 172.16.2.190
<span class="cm"># Windows (-p : permanente, conservée au redémarrage)</span>
<span class="pr">C:\&gt;</span> route add 172.16.12.0 mask 255.255.255.0 172.16.2.190 -p</pre>
<p>Le prochain saut doit être <strong>directement joignable</strong> : il appartient à un réseau connecté au routeur.</p>

<h2>Comment le routeur choisit une route</h2>
<h3>Le préfixe le plus long</h3>
<p>Plusieurs routes peuvent correspondre à une destination (la route par défaut correspond toujours). Le routeur choisit la route au <strong>préfixe le plus long</strong> (<em>longest prefix match</em>), c’est-à-dire la plus précise.</p>
<p>Exercice : le routeur R-EX a la table suivante.</p>
<div class="tbl-wrap"><table class="data">
  <tr><th>Type</th><th>Réseau</th><th>Prochain saut / interface</th></tr>
  <tr><td>S*</td><td class="mono">0.0.0.0/0</td><td class="mono">via 203.0.113.1</td></tr>
  <tr><td>S</td><td class="mono">172.16.0.0/16</td><td class="mono">via 10.0.0.1</td></tr>
  <tr><td>S</td><td class="mono">172.16.12.0/24</td><td class="mono">via 172.16.15.250</td></tr>
  <tr><td>S</td><td class="mono">172.16.12.128/26</td><td class="mono">via 172.16.15.254</td></tr>
  <tr><td>C</td><td class="mono">172.16.2.128/26</td><td class="mono">GigabitEthernet0/0/0</td></tr>
</table></div>
<div class="match" data-id="m-lpm" data-label="Trouver la route utilisée (préfixe le plus long)" data-options="0.0.0.0/0 via 203.0.113.1|172.16.0.0/16 via 10.0.0.1|172.16.12.0/24 via 172.16.15.250|172.16.12.128/26 via 172.16.15.254|172.16.2.128/26 connecté (G0/0/0)">
