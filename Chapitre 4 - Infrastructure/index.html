<h3>La distance administrative et la métrique</h3>
<p>Si deux sources différentes proposent une route vers <strong>le même réseau avec le même masque</strong>, le routeur garde celle de la source la plus fiable : la plus petite <strong>distance administrative</strong>.</p>
<div class="tbl-wrap"><table class="data">
  <tr><th>Source</th><th>Distance administrative (Cisco)</th></tr>
  <tr><td>Réseau connecté</td><td>0</td></tr>
  <tr><td>Route statique</td><td>1</td></tr>
  <tr><td>OSPF</td><td>110</td></tr>
  <tr><td>RIP</td><td>120</td></tr>
</table></div>
<p>Entre plusieurs routes d’un même protocole dynamique, c’est la <strong>métrique</strong> qui départage : nombre de routeurs traversés (RIP), coût calculé à partir des débits (OSPF).</p>

<h2>Les routes retour</h2>
<p>Un échange a <strong>deux sens</strong>. Pour qu’un ping fonctionne, il faut une route vers la destination sur chaque routeur de l’aller, <strong>et</strong> une route vers la source sur chaque routeur du retour. Symptôme typique d’une route retour manquante : le paquet arrive (on le voit dans une capture côté destination), mais la réponse se perd ; le client affiche « Délai d’attente de la demande dépassé ».</p>

<div class="answer" data-id="a-routes" data-kind="code" data-label="Écrire les routes statiques de trois routeurs en chaîne" data-min="150" data-rows="10">
  <p>Trois routeurs sont reliés en chaîne : RA — RB — RC. LAN de RA : <code>10.1.0.0/24</code> ; LAN de RB : <code>10.2.0.0/24</code> ; LAN de RC : <code>10.3.0.0/24</code>. Liaison RA–RB : <code>10.0.0.0/30</code> (RA .1, RB .2) ; liaison RB–RC : <code>10.0.0.4/30</code> (RB .5, RC .6). Écrire les routes statiques nécessaires sur chaque routeur pour que les trois LAN communiquent. Proposer ensuite une écriture plus courte pour RA et RC.</p>
  <p class="hint">Pour chaque routeur, lister les réseaux qu’il ne connaît pas directement. Le prochain saut est toujours l’adresse du voisin.</p>
  <div class="corr">
    <pre class="code">RA : ip route 10.2.0.0 255.255.255.0 10.0.0.2
     ip route 10.3.0.0 255.255.255.0 10.0.0.2
     ip route 10.0.0.4 255.255.255.252 10.0.0.2   (facultative : liaison RB–RC)
RB : ip route 10.1.0.0 255.255.255.0 10.0.0.1
     ip route 10.3.0.0 255.255.255.0 10.0.0.6
RC : ip route 10.1.0.0 255.255.255.0 10.0.0.5
     ip route 10.2.0.0 255.255.255.0 10.0.0.5
     ip route 10.0.0.0 255.255.255.252 10.0.0.5   (facultative)

Plus court : RA et RC n’ont qu’un voisin, une route par défaut suffit
RA : ip route 0.0.0.0 0.0.0.0 10.0.0.2
RC : ip route 0.0.0.0 0.0.0.0 10.0.0.5</pre>
    <p>RB est relié aux deux autres : il lui faut une route précise vers chaque LAN distant. Un routeur « en bout de chaîne », avec une seule sortie, se contente d’une route par défaut : c’est le cas du routeur d’un site annexe.</p>
  </div>
</div>

<h2>Le routage dynamique</h2>
<p>Les routes statiques conviennent à un petit réseau stable. Au-delà de quelques routeurs, elles deviennent lourdes à maintenir et ne s’adaptent pas aux pannes. Les <strong>protocoles de routage dynamique</strong> permettent aux routeurs d’échanger leurs routes et de recalculer automatiquement les chemins quand une liaison tombe.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Protocole</th><th>Principe</th><th>Usage</th></tr>
  <tr><td><strong>RIP</strong> (v2)</td><td>Vecteur de distance : chaque routeur annonce ses routes à ses voisins ; métrique = nombre de sauts (15 au maximum).</td><td>Historique, pédagogique ; petits réseaux.</td></tr>
  <tr><td><strong>OSPF</strong></td><td>État de liens : chaque routeur connaît la carte complète de sa zone et calcule les plus courts chemins ; métrique = coût selon le débit. Convergence rapide.</td><td>Réseaux d’entreprise et de campus. Étudié en deuxième année.</td></tr>
  <tr><td><strong>BGP</strong></td><td>Routage entre <strong>systèmes autonomes</strong> (opérateurs, grandes organisations), avec des politiques de choix.</td><td>Le protocole qui fait tenir Internet ensemble.</td></tr>
</table></div>

<div class="aside deep">
  <p class="aside-title">Une panne BGP, et Internet perd un géant</p>
  <p>Le 4 octobre 2021, une erreur de configuration chez Facebook a retiré d’Internet, via BGP, les routes vers ses propres serveurs DNS. Pendant environ six heures, Facebook, Instagram et WhatsApp ont disparu pour des milliards d’utilisateurs ; les employés ne pouvaient même plus entrer dans les bâtiments dont les badges dépendaient du même réseau. Leçon pour tout administrateur : une modification de routage se teste, se fait avec un plan de retour arrière et un accès d’administration qui ne dépend pas du réseau que l’on modifie (accès hors bande, partie 6).</p>
</div>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Oublier les routes retour : l’aller fonctionne, la réponse ne revient jamais.</li>
    <li>Indiquer comme prochain saut une adresse qui n’est pas sur un réseau directement connecté au routeur.</li>
    <li>Croire que le routeur choisit la première route de la liste : il choisit la plus précise (préfixe le plus long).</li>
  </ul>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p3" data-title="Le routage" data-label="Quiz de fin de partie">
  <div class="q" data-ok="2">
    <p class="qt">Que représente la route <code>0.0.0.0/0</code> ?</p>
    <ul><li>Une route vers le réseau local</li><li>La route par défaut, utilisée quand aucune autre ne correspond</li><li>Une route invalide</li><li>L’adresse du routeur lui-même</li></ul>
    <div class="expl"><p>0.0.0.0/0 correspond à toutes les adresses ; comme c’est le préfixe le plus court, elle n’est choisie qu’en dernier recours.</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Un routeur a les routes 10.0.0.0/8 et 10.20.0.0/16. Quelle route utilise-t-il pour 10.20.5.1 ?</p>
    <ul><li>10.0.0.0/8, car elle apparaît en premier</li><li>Les deux, à tour de rôle</li><li>Aucune, il y a un conflit</li><li>10.20.0.0/16, la plus précise</li></ul>
    <div class="expl"><p>Règle du préfixe le plus long : /16 est plus précis que /8.</p></div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Quelle commande Cisco crée une route vers 192.168.60.0/24 par le voisin 10.0.0.2 ?</p>
    <ul><li><code>ip route 192.168.60.0 255.255.255.0 10.0.0.2</code></li><li><code>route add 192.168.60.0/24 10.0.0.2</code></li><li><code>ip route add 192.168.60.0/24 via 10.0.0.2</code></li><li><code>network 192.168.60.0 10.0.0.2</code></li></ul>
    <div class="expl"><p>Syntaxe Cisco : <code>ip route réseau masque prochain-saut</code>. La deuxième est une syntaxe Windows, la troisième une syntaxe Linux.</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Un ping vers un site distant échoue. Une capture sur le serveur distant montre que les demandes d’écho arrivent. Quelle est la cause la plus probable ?</p>
    <ul><li>Le câble du poste est débranché</li><li>Le DNS ne fonctionne pas</li><li>Une route retour vers le réseau du poste manque sur un routeur</li><li>Le poste n’a pas d’adresse IP</li></ul>
    <div class="expl"><p>L’aller fonctionne puisque les demandes arrivent : c’est le retour qui échoue, faute de route vers le réseau source (ou à cause d’un filtrage).</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Quelle est la distance administrative d’une route statique sur un routeur Cisco ?</p>
    <ul><li>0</li><li>1</li><li>110</li><li>120</li></ul>
    <div class="expl"><p>0 pour un réseau connecté, 1 pour une route statique, 110 pour OSPF, 120 pour RIP.</p></div>
  </div>
</div>

<h1>Relier le site annexe et Internet</h1>
<p class="lead">Pour l’exercice, on imagine que la M2L ouvre une <strong>antenne</strong> dans une autre ville, reliée au site principal par une liaison louée à un opérateur (cet ajout au contexte Certa sert à pratiquer le routage entre sites). Il faut relier les deux sites et Internet avec des routes statiques, tester méthodiquement, dépanner, et comprendre pourquoi Internet ne répond pas encore aux postes de la M2L.</p>

<h2>Mission 1 : adresses et routes statiques</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Configurer les interfaces, prévoir les routes, tester</summary>
  <div class="task-body">

      <li>Vérifier que chaque liaison fonctionne <strong>de voisin à voisin</strong> : depuis R1, <code>ping 172.16.15.250</code> et <code>ping 203.0.113.1</code>.</li>
    </ol>
    <div class="answer" data-id="t11-routes" data-kind="code" data-label="Mission 1 : routes statiques des trois routeurs" data-min="120" data-rows="8">
      <p>Avant de configurer : pour chaque routeur (R1, R-ANX, R-FAI), lister les réseaux qu’il connaît directement, puis écrire les routes statiques à ajouter pour que le site principal et le site annexe communiquent et que tout ce qui n’est pas interne parte vers l’opérateur. Ne rien ajouter sur R-FAI : un opérateur ne route jamais les adresses privées de ses clients.</p>
      <div class="corr">
        <pre class="code">R1    connaît : 172.16.2.128/26, .192/27, .224/28, 172.16.3.0/28,
                172.16.8.160/27, 172.16.15.248/30, 203.0.113.0/30

R-ANX connaît : 172.16.12.0/24, 172.16.15.248/30
      ip route 0.0.0.0 0.0.0.0 172.16.15.249
      (une seule sortie : la route par défaut suffit, elle couvre le site
       principal et Internet)
R-FAI connaît : 203.0.113.0/30, 198.51.100.0/24 — aucune route ajoutée</pre>
      </div>
    </div>
    <div class="answer" data-id="t11-essai" data-label="Mission 1 : jeu d’essai entre les sites et vers Internet" data-min="200" data-rows="10">
      <p>Écrire le résultat attendu, justifié, puis le résultat obtenu, de : a) PC-ADM1 → PC-ANX1 ; b) <code>tracert 172.16.12.1</code> depuis PC-ADM1 ; c) PC-ANX1 → SRV-AD (<code>172.16.2.225</code>) ; d) R1 → WEB-EXT (<code>ping 198.51.100.10</code> depuis R1) ; e) PC-ADM1 → WEB-EXT ; f) PC-ADM1 → <code>203.0.113.1</code>.</p>
      <p class="hint">Pour e) et f), suivre la réponse : R-FAI sait-il où se trouve 172.16.2.130 ?</p>
      <div class="corr">
        <p>a) <strong>Succès</strong> : R1 a une route vers 172.16.12.0/24 ; au retour, R-ANX envoie tout vers R1 par sa route par défaut. b) Trois sauts : 172.16.2.190 (R1), 172.16.15.250 (R-ANX), 172.16.12.1. c) <strong>Succès</strong>, mêmes routes en sens inverse.</p>
        <p>d) <strong>Succès</strong> : R1 envoie depuis son adresse 203.0.113.2 ; R-FAI connaît ce réseau (directement connecté) et répond.</p>
        <p>e) et f) <strong>Échec</strong>, alors que l’aller fonctionne : la demande arrive à WEB-EXT (ou à R-FAI), mais la réponse est adressée à 172.16.2.130, une adresse <strong>privée</strong>. R-FAI n’a aucune route vers elle et jette la réponse. Même le ping de l’interface de l’opérateur (f) échoue. Ajouter une route sur R-FAI serait irréaliste : sur Internet, aucun routeur ne route les adresses privées, utilisées par des millions de réseaux. La solution est la <strong>traduction d’adresses</strong> (NAT) sur R1 : <a href="#p4">partie 4</a>.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 2 : faire évoluer le site annexe</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Un deuxième réseau, une route résumée</summary>
  <div class="task-body">
    <div class="answer" data-id="t11-resume" data-kind="code" data-label="Mission 2 : route résumée vers le site annexe" data-min="100" data-rows="7">
      <p>Le site annexe ajoute un réseau pour la téléphonie, <code>172.16.13.0/24</code>, sur une sous-interface ou un port supplémentaire de R-ANX. a) Faut-il modifier R-ANX pour que ce réseau joigne le site principal ? b) Sur R1, remplacer la route vers <code>172.16.12.0/24</code> par <strong>une seule</strong> route qui couvre les deux réseaux de l’annexe. Vérifier que le préfixe choisi ne couvre rien d’autre. c) Écrire les commandes.</p>
      <div class="corr">
        <pre class="code">a) Non : R-ANX connaît directement ses deux réseaux et envoie tout le reste
   vers R1 par sa route par défaut.
b) 12 = 0000 1100, 13 = 0000 1101 → 7 bits communs dans le 3e octet
   → 172.16.12.0/23 (de 172.16.12.0 à 172.16.13.255), aligné car 12 est pair
c) R1(config)# no ip route 172.16.12.0 255.255.255.0 172.16.15.250
   R1(config)# ip route 172.16.12.0 255.255.254.0 172.16.15.250</pre>
        <p>Le résumé fonctionne parce que le plan d’adressage a prévu des réseaux contigus pour l’annexe : c’est l’intérêt de réserver un bloc aligné par site.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 3 : dépanner le routage</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Deux pannes à reproduire et à expliquer</summary>
  <div class="task-body">
    <div class="tbl-wrap"><table class="data wide">
      <tr><th>Ticket</th><th>Symptôme</th><th>Relevé</th></tr>
      <tr><td>T1</td><td>Plus aucun échange entre les deux sites.</td><td>Configuration de R1 : <code>ip route 172.16.12.0 255.255.255.0 172.16.15.205</code>. La route n’apparaît pas dans <code>show ip route</code>.</td></tr>
      <tr><td>T2</td><td>Depuis R1, <code>ping 172.16.12.1</code> réussit ; depuis PC-ADM1, le même ping échoue.</td><td>Sur R-ANX, <code>show ip route</code> ne contient que des lignes <code>C</code> et <code>L</code>.</td></tr>
    </table></div>
    <div class="answer" data-id="t11-pannes" data-label="Mission 3 : diagnostic des pannes de routage" data-min="200" data-rows="8">
      <p>Pour chaque ticket : expliquer la cause et le symptôme (pourquoi la route n’apparaît pas ; pourquoi le ping depuis R1 réussit), puis donner la correction. Reproduire les pannes dans la maquette pour vérifier.</p>
      <div class="corr">
        <p><strong>T1</strong> : faute de frappe dans le prochain saut (<code>.205</code> au lieu de <code>.250</code>). L’adresse 172.16.15.205 n’appartient à aucun réseau connecté à R1 : le routeur ne sait pas la joindre et n’installe pas la route dans sa table (elle reste dans la configuration). Correction : <code>no ip route 172.16.12.0 255.255.255.0 172.16.15.205</code> puis la bonne route.</p>
        <p><strong>T2</strong> : la route par défaut de R-ANX manque. Depuis R1, le ping part avec l’adresse source 172.16.15.249 (interface de sortie), réseau que R-ANX connaît directement : la réponse revient. Depuis PC-ADM1, la source est 172.16.2.130, inconnue de R-ANX : la réponse est jetée. C’est le piège de la route retour, et la raison pour laquelle un ping réussi depuis un routeur ne prouve pas que les postes communiquent. Correction : <code>ip route 0.0.0.0 0.0.0.0 172.16.15.249</code> sur R-ANX. Astuce : sur un routeur Cisco, <code>ping 172.16.12.1 source 172.16.2.190</code> teste avec une autre adresse source.</p>
      </div>
    </div>
  </div>
</details>

<h2>Défi : passer au routage dynamique OSPF</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Remplacer les routes statiques internes par OSPF</summary>
  <div class="task-body">
    <p>Supprimer la route vers l’annexe sur R1 et la route par défaut de R-ANX, puis activer OSPF sur les réseaux internes :</p>
    <pre class="code terminal">R1(config)# router ospf 1
R1(config-router)# router-id 1.1.1.1
R1(config-router)# network 172.16.0.0 0.0.15.255 area 0
R1(config-router)# default-information originate

R-ANX(config)# router ospf 1
R-ANX(config-router)# router-id 2.2.2.2
R-ANX(config-router)# network 172.16.0.0 0.0.15.255 area 0</pre>
    <div class="answer" data-id="t11-defi" data-label="Défi : observer et expliquer OSPF" data-min="120" data-rows="7">
      <p>a) Que représente <code>0.0.15.255</code> ? Quels réseaux de chaque routeur sont concernés ? b) Relever <code>show ip ospf neighbor</code> et les nouvelles lignes de <code>show ip route</code> sur R-ANX. c) Ajouter un réseau sur R-ANX (une interface de bouclage <code>interface loopback 1</code>, <code>ip address 172.16.14.1 255.255.255.0</code>) : que se passe-t-il sur R1 ? d) À quoi sert <code>default-information originate</code> ?</p>
      <div class="corr">
        <p>a) Un masque générique (<em>wildcard</em>) : l’inverse du masque /20 (255.255.240.0). OSPF est activé sur toutes les interfaces dont l’adresse est dans 172.16.0.0/20 : sur R1, les sous-interfaces des VLAN et la liaison inter-sites, pas l’interface vers l’opérateur (203.0.113.2) ; sur R-ANX, ses deux interfaces.</p>
        <p>b) Les deux routeurs sont voisins (état <code>FULL</code>). R-ANX affiche des routes <code>O</code> vers les réseaux des VLAN du site principal, avec une distance administrative de 110, et une route par défaut <code>O*E2 0.0.0.0/0</code> apprise de R1.</p>
        <p>c) Une route <code>O</code> vers ce nouveau réseau apparaît automatiquement dans la table de R1, sans aucune configuration sur R1 : c’est tout l’intérêt du routage dynamique. Particularité : OSPF annonce une interface de bouclage comme une adresse d’hôte, on voit donc <code>172.16.14.1/32</code> (avec un vrai réseau local, on verrait le /24).</p>
        <p>d) R1 annonce sa route par défaut aux autres routeurs OSPF : R-ANX apprend ainsi le chemin vers Internet sans route statique.</p>
      </div>
    </div>
  </div>
</details>

<div class="aside next">
  <p class="aside-title">La suite</p>
  <p>Pour que les postes de la M2L accèdent enfin à Internet, R1 doit traduire leurs adresses privées : la <a href="#p4">partie 4</a> explique la NAT et la fait configurer sur cette maquette.</p>
</div>

<template data-page="p4">
<h1>La traduction d’adresses (NAT)</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : chapitre 2 (adresses privées et publiques), chapitre 3 (ports TCP et UDP) et <a href="#tp11">TP 11</a> (mission 1, tests e et f). Garder ouverte la maquette <code>TP11-NOM-Prenom.pkt</code> : une mise en pratique termine la partie. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">NAT</div><ul>
  <li><span><b>Le problème</b> : les adresses privées ne sont pas routées sur Internet</span></li>
  <li><span><b>NAT statique, dynamique</b> : une adresse pour une adresse</span></li>
  <li><span><b>PAT</b> : toute la M2L derrière une seule adresse, grâce aux ports</span></li>
  <li><span><b>Redirection de ports</b> : publier un serveur</span></li>
  <li><span><b>Limites</b> : traçabilité, connexions entrantes, IPv6</span></li>
</ul></div></figure>

<p class="lead">Au TP 11, les paquets des postes de la M2L atteignaient Internet, mais les réponses, adressées à une adresse privée, se perdaient chez l’opérateur. La <strong>traduction d’adresses</strong> (<em>Network Address Translation</em>, NAT, RFC 3022) résout ce problème : le routeur de sortie remplace l’adresse privée par son adresse publique, et fait l’opération inverse sur les réponses.</p>

<h2>Le principe</h2>
<ol class="steps">
  <li>PC-ADM1 (<code>172.16.2.130</code>) envoie une requête vers WEB-EXT (<code>198.51.100.10</code>).</li>
  <li>R1, routeur de sortie, remplace l’adresse source privée par son adresse publique <code>203.0.113.2</code> et <strong>note la correspondance</strong> dans sa table de traduction.</li>
  <li>WEB-EXT répond à <code>203.0.113.2</code> : une adresse publique, que l’opérateur sait router.</li>
  <li>R1 retrouve la correspondance dans sa table, remet l’adresse de destination <code>172.16.2.130</code> et transmet la réponse à l’intérieur.</li>
</ol>
<p>Vocabulaire Cisco, à connaître pour lire les tables de traduction :</p>
<dl class="def">
  <dt>Inside local</dt><dd>L’adresse réelle d’un hôte interne (privée) : <code>172.16.2.130</code>.</dd>
  <dt>Inside global</dt><dd>L’adresse sous laquelle cet hôte apparaît à l’extérieur (publique) : <code>203.0.113.2</code>.</dd>
  <dt>Outside local / outside global</dt><dd>L’adresse de l’hôte extérieur vue de l’intérieur et de l’extérieur ; en général identiques (<code>198.51.100.10</code>).</dd>
</dl>

<h2>Les différents types de NAT</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Type</th><th>Principe</th><th>Usage</th></tr>
  <tr><td><strong>NAT statique</strong></td><td>Une adresse privée ↔ une adresse publique, de façon permanente.</td><td>Rendre un serveur interne joignable depuis Internet avec sa propre adresse publique.</td></tr>
  <tr><td><strong>NAT dynamique</strong></td><td>Les hôtes internes reçoivent temporairement une adresse d’un groupe (<em>pool</em>) d’adresses publiques.</td><td>Rare : il faut autant d’adresses publiques que d’hôtes connectés en même temps.</td></tr>
  <tr><td><strong>PAT</strong> (NAT avec surcharge, <em>overload</em>, « masquerade »)</td><td>Tous les hôtes internes partagent <strong>une seule</strong> adresse publique ; le routeur les distingue par les <strong>numéros de port</strong> source.</td><td>Le cas général : box Internet, entreprise, M2L.</td></tr>
  <tr><td><strong>Redirection de ports</strong> (NAT de destination, <em>port forwarding</em>)</td><td>Les connexions arrivant sur un port de l’adresse publique sont redirigées vers un serveur interne.</td><td>Publier le serveur web de la DMZ sur le port 80 de l’adresse publique.</td></tr>
</table></div>

<h3>Le PAT en détail</h3>
<p>Avec une seule adresse publique, comment R1 sait-il à quel poste rendre une réponse ? Grâce au <strong>port source</strong>. La table de traduction associe chaque couple (adresse privée, port) à un port de l’adresse publique :</p>
<pre class="code terminal"><span class="pr">R1#</span> show ip nat translations
Pro  Inside global      Inside local        Outside local       Outside global
icmp 203.0.113.2:1      172.16.2.130:1      198.51.100.10:1     198.51.100.10:1
tcp  203.0.113.2:1025   172.16.2.130:1025   198.51.100.10:80    198.51.100.10:80
tcp  203.0.113.2:1026   172.16.12.1:1025    198.51.100.10:80    198.51.100.10:80</pre>
<p>Lecture : PC-ADM1 et PC-ANX1 ont tous deux choisi le port source 1025 pour joindre le web de WEB-EXT. R1 garde 1025 pour le premier et attribue 1026 au second. Quand une réponse arrive sur <code>203.0.113.2:1026</code>, R1 sait qu’elle est pour <code>172.16.12.1:1025</code>. Pour ICMP, qui n’a pas de ports, c’est l’identifiant du ping qui sert. Un PAT peut ainsi gérer des dizaines de milliers de connexions simultanées avec une seule adresse.</p>

<div class="match" data-id="m-nat" data-label="Choisir le type de NAT adapté" data-options="PAT (surcharge)|NAT statique|Redirection de ports|Aucune NAT nécessaire">
  <div class="r" data-ok="PAT (surcharge)" data-expl="Beaucoup d’hôtes internes, une adresse publique : PAT.">Les 300 appareils de la M2L doivent naviguer sur Internet avec l’unique adresse publique fournie par l’opérateur.</div>
  <div class="r" data-ok="Redirection de ports" data-expl="On publie un service (port 80) de l’adresse publique vers un serveur interne.">Le serveur web de la DMZ doit être joignable depuis Internet sur le port 80 de l’adresse publique de la M2L.</div>
  <div class="r" data-ok="NAT statique" data-expl="Une adresse publique dédiée, associée en permanence à un serveur : NAT statique.">L’opérateur a fourni un bloc d’adresses publiques ; le serveur de messagerie doit avoir sa propre adresse publique, pour tous ses ports.</div>
  <div class="r" data-ok="Aucune NAT nécessaire" data-expl="Entre deux réseaux internes en adresses privées, le routage suffit : pas de traduction.">Le site annexe (172.16.12.0/24) doit joindre le serveur de fichiers du site principal (172.16.2.225).</div>
</div>

<h2>Configurer le PAT sur un routeur Cisco</h2>
<pre class="code terminal"><span class="cm">! 1. Quelles adresses traduire ? (liste de contrôle d’accès : tout 172.16.0.0/20)</span>
<span class="pr">R1(config)#</span> access-list 1 permit 172.16.0.0 0.0.15.255
<span class="cm">! 2. Quelles interfaces sont à l’intérieur, laquelle est à l’extérieur ?</span>
<span class="pr">R1(config)#</span> interface GigabitEthernet0/0/0.10
<span class="pr">R1(config-subif)#</span> ip nat inside
<span class="cm">!    (idem sur .20, .30, .99, .106 et sur G0/0/1, la liaison vers l’annexe)</span>
<span class="pr">R1(config-subif)#</span> interface GigabitEthernet0/0/2
<span class="pr">R1(config-if)#</span> ip nat outside
<span class="pr">R1(config-if)#</span> exit
<span class="cm">! 3. Traduire la liste 1 vers l’adresse de l’interface de sortie, avec surcharge</span>
<span class="pr">R1(config)#</span> ip nat inside source list 1 interface GigabitEthernet0/0/2 overload

<span class="cm">! Redirection de ports (exemple) : le port 80 public vers le serveur web 172.16.2.241</span>
<span class="pr">R1(config)#</span> ip nat inside source static tcp 172.16.2.241 80 203.0.113.2 80</pre>
<p><code>0.0.15.255</code> est un <strong>masque générique</strong> (<em>wildcard</em>) : l’inverse du masque /20 (255.255.240.0). Les bits à 0 doivent correspondre, les bits à 1 sont libres. On le retrouvera dans les listes de contrôle d’accès (partie 5).</p>

<div class="answer" data-id="a-pat" data-label="Mise en pratique : configurer le PAT sur la maquette du TP 11" data-min="150" data-rows="9">
  <p>Dans <code>TP11-NOM-Prenom.pkt</code>, configurer le PAT sur R1 (toutes les interfaces internes en <code>ip nat inside</code>). Refaire les tests e) et f) du TP 11, puis ouvrir <code>http://198.51.100.10</code> depuis le navigateur de PC-ADM1 et de PC-ANX1. Relever <code>show ip nat translations</code> et expliquer une ligne. Que voit WEB-EXT comme adresse source des requêtes ?</p>
  <div class="corr">
    <p>Les tests réussissent : les réponses sont adressées à 203.0.113.2, adresse que R-FAI connaît ; R1 les retraduit. La table montre des lignes <code>icmp</code> (pings) et <code>tcp</code> (navigation, port 80), avec l’adresse privée et le port de chaque poste (<em>inside local</em>) et leur correspondance sur 203.0.113.2 (<em>inside global</em>).</p>
    <p>WEB-EXT ne voit qu’une seule adresse source, <strong>203.0.113.2</strong>, pour tous les postes de la M2L et de l’annexe : il ne peut pas les distinguer, ni les contacter de lui-même. Si une interface interne a été oubliée en <code>ip nat inside</code> (par exemple G0/0/1), les postes de l’annexe ne sont pas traduits et n’ont toujours pas accès à Internet : bon test de vérification.</p>
    <p>Enregistrer la maquette : elle est complète pour la suite.</p>
  </div>
</div>

<h2>Les limites de la NAT</h2>
<ul>
  <li><strong>Connexions entrantes</strong> : un hôte d’Internet ne peut pas ouvrir de connexion vers un poste interne (il n’y a pas d’entrée dans la table). C’est un effet de bord protecteur, mais <strong>la NAT n’est pas un pare-feu</strong> : pour publier un service, il faut une redirection de ports, et pour filtrer, des règles (partie 5).</li>
  <li><strong>Traçabilité</strong> : sur Internet, tous les postes de la M2L ont la même adresse. Pour retrouver l’auteur d’une connexion (obligation légale de conservation des données de connexion), il faut garder les journaux de traduction avec les ports et l’heure exacte.</li>
  <li><strong>Protocoles sensibles</strong> : certains protocoles qui transportent des adresses dans leurs données (FTP actif, voix sur IP) demandent des aides particulières.</li>
  <li><strong>IPv6</strong> rend la NAT inutile : chaque appareil peut avoir une adresse globale. La sécurité repose alors entièrement sur le pare-feu.</li>
</ul>
<div class="aside deep">
  <p class="aside-title">La NAT chez l’opérateur (CGNAT)</p>
  <p>Faute d’adresses IPv4, certains opérateurs (notamment en 4G/5G) ne donnent même plus d’adresse publique à leurs clients : la box reçoit une adresse de la plage <code>100.64.0.0/10</code> (chapitre 2), et c’est l’opérateur qui traduit à nouveau, pour des milliers de clients, vers quelques adresses publiques. Conséquence : impossible d’héberger un serveur ou d’ouvrir une redirection de ports chez soi ; seule la connexion IPv6 de l’abonnement le permet.</p>
</div>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Oublier une interface en <code>ip nat inside</code> : les réseaux qui passent par elle ne sont pas traduits.</li>
    <li>Écrire un masque classique (<code>255.255.240.0</code>) au lieu d’un masque générique (<code>0.0.15.255</code>) dans la liste d’accès.</li>
    <li>Croire que la NAT protège à elle seule le réseau : elle ne filtre rien, elle traduit.</li>
  </ul>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p4" data-title="NAT" data-label="Quiz de fin de partie">
  <div class="q" data-ok="2">
    <p class="qt">Avec le PAT, comment le routeur distingue-t-il les réponses destinées à deux postes différents ?</p>
    <ul><li>Par leur adresse MAC</li><li>Par les numéros de port associés dans la table de traduction</li><li>Par le TTL</li><li>Il ne peut pas</li></ul>
    <div class="expl"><p>Chaque connexion est associée à un port de l’adresse publique ; la table permet de retrouver l’adresse et le port privés.</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Dans <code>show ip nat translations</code>, que désigne l’adresse « inside local » ?</p>
    <ul><li>L’adresse publique du routeur</li><li>L’adresse du serveur d’Internet</li><li>L’adresse réelle (privée) de l’hôte interne</li><li>L’adresse de la passerelle</li></ul>
    <div class="expl"><p>Inside local = adresse réelle de l’hôte interne ; inside global = son adresse vue de l’extérieur.</p></div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Quel masque générique correspond au réseau 172.16.0.0/20 ?</p>
    <ul><li>0.0.15.255</li><li>255.255.240.0</li><li>0.0.0.255</li><li>0.0.16.255</li></ul>
    <div class="expl"><p>/20 = 255.255.240.0 ; masque générique = 255.255.255.255 − masque = 0.0.15.255.</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Que faut-il configurer pour que le serveur web interne de la M2L soit joignable depuis Internet avec l’adresse publique du routeur ?</p>
    <ul><li>Rien, le PAT suffit</li><li>Une route par défaut</li><li>Une adresse privée sur le serveur</li><li>Une redirection de ports (NAT de destination) du port 80</li></ul>
    <div class="expl"><p>Le PAT ne traduit que les connexions sortantes ; pour une connexion entrante, il faut une redirection explicite.</p></div>
  </div>
</div>

<div class="aside next">
  <p class="aside-title">La suite</p>

</div>

<template data-page="p5">
<h1>Périmètres de sécurité, DMZ et filtrage</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : <a href="#p2">partie 2</a> (VLAN), <a href="#p3">partie 3</a> (routage), <a href="#p4">partie 4</a> (NAT, masque générique), chapitre 3 (ports). Le filtrage est abordé ici ; il sera approfondi en deuxième année et dans le bloc 3. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Périmètres</div><ul>
  <li><span><b>Zones</b> : LAN, serveurs, DMZ, invités, Internet, gestion</span></li>
  <li><span><b>Principes</b> : refus par défaut, moindre privilège</span></li>
  <li><span><b>Matrice des flux</b> : qui parle à qui, sur quel port</span></li>
  <li><span><b>Listes de contrôle d’accès</b> : filtrage sans état sur un routeur</span></li>
  <li><span><b>Pare-feu à états</b> : pfSense</span></li>
</ul></div></figure>

<p class="lead">Segmenter en VLAN ne suffit pas : si le routeur laisse tout passer entre les VLAN, un visiteur atteint toujours le serveur de fichiers. Il faut définir des <strong>zones</strong> de confiance différentes et <strong>filtrer</strong> les flux entre elles, selon une politique écrite. Le guide du BTS le rappelle : la segmentation est nécessaire, mais pas suffisante.</p>

<h2>Les zones de sécurité</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Zone</th><th>Contenu à la M2L</th><th>Niveau de confiance</th></tr>
  <tr><td>Internet (WAN)</td><td>Tout ce qui est extérieur</td><td>Aucun</td></tr>
  <tr><td><strong>DMZ</strong> (zone démilitarisée)</td><td>Serveurs joignables depuis Internet : web, messagerie <code>lorraine-sport.net</code></td><td>Faible : exposée, donc susceptible d’être compromise</td></tr>
  <tr><td>Invités</td><td>Wi-Fi visiteurs (VLAN 50)</td><td>Faible : appareils inconnus</td></tr>
  <tr><td>Ligues</td><td>Postes des 24 ligues (VLAN 101 à 124)</td><td>Moyen ; chaque ligue isolée des autres</td></tr>
  <tr><td>Administration, serveurs</td><td>Postes de l’administration (VLAN 10), serveurs internes (VLAN 30)</td><td>Élevé</td></tr>
  <tr><td>Gestion</td><td>Interfaces d’administration des équipements réseau (VLAN 99)</td><td>Le plus élevé : accès réservé aux administrateurs</td></tr>
</table></div>
<dl class="def">
  <dt>DMZ</dt><dd>Zone intermédiaire, séparée à la fois d’Internet et du réseau interne par un pare-feu. On y place les serveurs qui doivent être joignables depuis Internet. Si l’un d’eux est piraté, l’attaquant reste enfermé dans la DMZ : <strong>aucun flux de la DMZ vers le réseau interne</strong> n’est autorisé (ou le strict minimum).</dd>
</dl>

<h2>Les principes du filtrage</h2>
<ul>
  <li><strong>Refus par défaut</strong> : tout ce qui n’est pas explicitement autorisé est interdit. On n’écrit que des autorisations précises.</li>
  <li><strong>Moindre privilège</strong> : chaque zone n’accède qu’aux services dont elle a besoin (une ligue a besoin du serveur de fichiers sur le port 445, pas de tout le serveur).</li>
  <li><strong>Défense en profondeur</strong> : plusieurs barrières successives (pare-feu périphérique, filtrage entre VLAN, pare-feu des serveurs et des postes).</li>
  <li><strong>Traçabilité</strong> : journaliser les flux refusés (et certains flux autorisés) pour détecter les anomalies.</li>
</ul>

<h3>La matrice des flux</h3>
<p>La politique de filtrage s’écrit d’abord dans une <strong>matrice des flux</strong> : pour chaque couple de zones (source, destination), les services autorisés. C’est elle qui sert ensuite à écrire les règles, puis à les vérifier lors des tests.</p>
<div class="ctab" data-id="c-flux" data-head="Flux (source → destination : service)" data-cols="Décision" data-choices="AUTORISER|REFUSER" data-label="Construire la matrice des flux de la M2L">
  <div class="r" data-ok="AUTORISER" data-expl="C’est la raison d’être de la DMZ : publier le site web.">Internet → serveur web de la DMZ : HTTP et HTTPS (TCP 80, 443)</div>
  <div class="r" data-ok="REFUSER" data-expl="Aucune connexion entrante d’Internet vers le réseau interne.">Internet → postes de l’administration : tous services</div>
  <div class="r" data-ok="AUTORISER" data-expl="Le Wi-Fi visiteurs est prévu pour l’accès à Internet.">Wi-Fi visiteurs → Internet : HTTP et HTTPS</div>
  <div class="r" data-ok="REFUSER" data-expl="Les visiteurs n’ont aucune raison d’accéder aux ressources internes.">Wi-Fi visiteurs → serveur de fichiers : SMB (TCP 445)</div>
  <div class="r" data-ok="AUTORISER" data-expl="Besoin métier : les ligues déposent leurs documents sur le serveur de fichiers.">Ligue 06 → serveur de fichiers : SMB (TCP 445)</div>
  <div class="r" data-ok="REFUSER" data-expl="Les ligues sont isolées les unes des autres (confidentialité de leurs données).">Ligue 06 → postes de la ligue 07 : tous services</div>
  <div class="r" data-ok="REFUSER" data-expl="Un serveur exposé ne doit jamais pouvoir ouvrir de connexion vers le réseau interne.">Serveur web de la DMZ → postes de l’administration : tous services</div>
  <div class="r" data-ok="AUTORISER" data-expl="L’administration du serveur web se fait depuis l’intérieur, par un protocole chiffré.">Postes de l’administration → serveur web de la DMZ : SSH (TCP 22)</div>
  <div class="r" data-ok="AUTORISER" data-expl="Le serveur de messagerie doit recevoir les courriels envoyés par les autres serveurs d’Internet.">Internet → serveur de messagerie de la DMZ : SMTP (TCP 25)</div>
</div>

<h2>Filtrer sur un routeur : les listes de contrôle d’accès</h2>
<p>Une <strong>liste de contrôle d’accès</strong> (ACL, <em>Access Control List</em>) est une suite de règles <code>permit</code> ou <code>deny</code>, appliquée à une interface, <strong>en entrée</strong> (<code>in</code>, paquets qui arrivent) ou <strong>en sortie</strong> (<code>out</code>).</p>
<ul>
  <li>Les règles sont lues <strong>dans l’ordre</strong> ; la <strong>première</strong> qui correspond s’applique, les suivantes sont ignorées.</li>
  <li>Toute liste se termine par un <strong>refus implicite</strong> invisible (<code>deny any</code>) : un paquet qui ne correspond à aucune règle est rejeté.</li>
  <li><strong>ACL standard</strong> (numéros 1 à 99) : filtre seulement sur l’adresse source ; à placer près de la destination.</li>
  <li><strong>ACL étendue</strong> (100 à 199, ou nommée) : filtre sur le protocole, la source, la destination et les ports ; à placer <strong>près de la source</strong>, pour arrêter le trafic indésirable le plus tôt possible.</li>
  <li>Les adresses s’écrivent avec un <strong>masque générique</strong> ; <code>host 172.16.2.225</code> = une seule adresse ; <code>any</code> = toutes.</li>
</ul>
<pre class="code terminal"><span class="cm">! Les visiteurs (VLAN 50, 172.16.0.0/23) : Internet seulement</span>
<span class="pr">R1(config)#</span> ip access-list extended VISITEURS-IN
<span class="pr">R1(config-ext-nacl)#</span> remark DHCP : le poste n'a pas encore d'adresse (source 0.0.0.0)
<span class="pr">R1(config-ext-nacl)#</span> permit udp any any eq bootps
<span class="pr">R1(config-ext-nacl)#</span> remark DNS vers le serveur interne seulement
<span class="pr">R1(config-ext-nacl)#</span> permit udp 172.16.0.0 0.0.1.255 host 172.16.2.225 eq domain
<span class="pr">R1(config-ext-nacl)#</span> deny ip 172.16.0.0 0.0.1.255 172.16.0.0 0.0.15.255
<span class="pr">R1(config-ext-nacl)#</span> permit ip 172.16.0.0 0.0.1.255 any
<span class="pr">R1(config-ext-nacl)#</span> exit
<span class="pr">R1(config)#</span> interface GigabitEthernet0/0/0.50
<span class="pr">R1(config-subif)#</span> ip access-group VISITEURS-IN in
<span class="pr">R1#</span> show access-lists</pre>
<p>L’ordre est essentiel : si la ligne <code>deny ip … 172.16.0.0 0.0.15.255</code> était placée avant celle du DNS, le DNS serait bloqué. Et sans la première ligne, les postes n’obtiendraient même plus d’adresse : le Discover DHCP a pour source <code>0.0.0.0</code>, qui ne correspond à aucune autre règle et tomberait dans le refus implicite. <code>show access-lists</code> affiche le nombre de paquets qui ont correspondu à chaque ligne (<em>matches</em>), très utile pour vérifier.</p>

<div class="answer" data-id="a-acl" data-kind="code" data-label="Écrire une ACL étendue pour la ligue de volley" data-min="150" data-rows="9">
  <p>Écrire une ACL étendue nommée <code>LIGUE06-IN</code>, à appliquer en entrée de la sous-interface du VLAN 106 (<code>172.16.8.160/27</code>), qui : autorise le DHCP ; autorise le DNS et le partage de fichiers (SMB, TCP 445) vers le serveur <code>172.16.2.225</code> ; interdit tout autre accès vers le réseau interne <code>172.16.0.0/20</code> ; autorise le reste (Internet). Donner aussi la commande qui l’applique.</p>
  <p class="hint">Masque générique d’un /27 : 0.0.0.31.</p>
  <div class="corr">
    <pre class="code">ip access-list extended LIGUE06-IN
 permit udp any any eq bootps
 permit udp 172.16.8.160 0.0.0.31 host 172.16.2.225 eq domain
 permit tcp 172.16.8.160 0.0.0.31 host 172.16.2.225 eq 445
 deny   ip 172.16.8.160 0.0.0.31 172.16.0.0 0.0.15.255
 permit ip 172.16.8.160 0.0.0.31 any
interface GigabitEthernet0/0/0.106
 ip access-group LIGUE06-IN in</pre>
    <p>Une ACL n’analyse pas les connexions : le serveur de fichiers peut répondre parce que l’ACL est appliquée en <strong>entrée</strong> du VLAN de la ligue, pas sur les réponses qui y retournent. Si on filtrait aussi dans l’autre sens, il faudrait autoriser explicitement les réponses : c’est la limite d’un filtrage <strong>sans état</strong>.</p>
  </div>
</div>

<h2>Le pare-feu à états</h2>
<dl class="def">
  <dt>Filtrage sans état <small>stateless</small></dt><dd>Chaque paquet est examiné isolément (c’est le cas des ACL simples). Pour laisser passer les réponses, il faut écrire des règles dans les deux sens, souvent trop larges.</dd>
  <dt>Filtrage à états <small>stateful</small></dt><dd>Le pare-feu garde une <strong>table des connexions</strong> (états) ouvertes. Quand une connexion autorisée est établie (par exemple LAN → DMZ sur le port 80), <strong>les paquets de réponse sont automatiquement autorisés</strong>, et seulement eux. On n’écrit que les règles dans le sens de l’ouverture des connexions. C’est le fonctionnement de tous les pare-feu modernes.</dd>
</dl>
<p><strong>pfSense</strong> (et son cousin OPNsense) est un pare-feu à états libre, basé sur FreeBSD, très utilisé dans les PME et en formation. Ses règles se gèrent par une interface web :</p>
<ul>
  <li>les règles sont attachées à <strong>l’interface par laquelle le trafic entre</strong> dans le pare-feu (onglets LAN, DMZ, WAN) ;</li>
  <li>elles sont lues de haut en bas, <strong>la première qui correspond s’applique</strong> ;</li>
  <li>par défaut, le LAN a une règle « tout autoriser » et le WAN refuse tout ; une nouvelle interface (DMZ) n’a <strong>aucune règle</strong>, donc tout ce qui y entre est refusé ;</li>
  <li>les <strong>alias</strong> regroupent des adresses ou des ports sous un nom (« SERVEURS_WEB ») pour des règles lisibles ;</li>
  <li>il assure aussi la NAT (sortante automatique, redirections de ports), le DHCP, un résolveur DNS, les VPN.</li>
</ul>
<p>Pare-feu du marché : Stormshield (français, certifié par l’ANSSI), Fortinet, Palo Alto, Cisco… Les principes sont les mêmes.</p>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Oublier le refus implicite : une ACL avec seulement des <code>deny</code> bloque tout.</li>
    <li>Placer une règle générale avant une règle précise : la règle précise n’est jamais atteinte.</li>
    <li>Oublier les services d’infrastructure (DHCP, DNS) dans la matrice des flux : plus rien ne marche.</li>
  </ul>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p5" data-title="Périmètres et filtrage" data-label="Quiz de fin de partie">
  <div class="q" data-ok="3">
    <p class="qt">Quel flux doit être interdit dans une architecture avec DMZ ?</p>
    <ul><li>Internet → serveur web de la DMZ (TCP 443)</li><li>LAN → serveur web de la DMZ (TCP 443)</li><li>Serveur de la DMZ → postes du LAN</li><li>LAN → Internet (TCP 443)</li></ul>
    <div class="expl"><p>Un serveur de la DMZ peut être compromis : il ne doit pas pouvoir atteindre le réseau interne.</p></div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Que se passe-t-il pour un paquet qui ne correspond à aucune ligne d’une ACL ?</p>
    <ul><li>Il est rejeté (refus implicite)</li><li>Il est autorisé</li><li>Il est renvoyé à l’émetteur</li><li>Il est mis en attente</li></ul>
    <div class="expl"><p>Toute ACL se termine par un <code>deny any</code> implicite.</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Quel est l’avantage principal d’un pare-feu à états ?</p>
    <ul><li>Il est plus rapide qu’un commutateur</li><li>Il chiffre le trafic</li><li>Il n’a pas besoin de règles</li><li>Il autorise automatiquement les réponses des connexions autorisées, sans règle dans l’autre sens</li></ul>
    <div class="expl"><p>Grâce à sa table des connexions, on n’écrit que les règles dans le sens de l’ouverture.</p></div>
  </div>
  <div class="q" data-ok="2">
    <p class="qt">Où placer une ACL étendue ?</p>
    <ul><li>Le plus près possible de la destination</li><li>Le plus près possible de la source</li><li>Toujours sur l’interface Internet</li><li>N’importe où, cela ne change rien</li></ul>
    <div class="expl"><p>Une ACL étendue est précise (source, destination, port) : on la place près de la source pour éliminer tôt le trafic interdit.</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Dans pfSense, sur quel onglet écrit-on la règle qui autorise le serveur de la DMZ à télécharger ses mises à jour sur Internet ?</p>
    <ul><li>WAN</li><li>LAN</li><li>DMZ</li><li>Aucun, c’est autorisé par défaut</li></ul>
    <div class="expl"><p>Les règles s’appliquent à l’interface par laquelle le trafic <strong>entre</strong> dans le pare-feu : ici l’interface DMZ. Une nouvelle interface n’a aucune règle : sans règle, la mise à jour est refusée.</p></div>
  </div>
</div>

<h1>Une DMZ protégée par pfSense</h1>
<p class="lead">Le serveur web de la M2L doit être accessible depuis Internet sans exposer le réseau interne. On installe un pare-feu pfSense à trois interfaces (Internet, LAN, DMZ), on déplace le serveur web Debian dans la DMZ, on écrit les règles à partir de la matrice des flux, puis on publie le site par une redirection de ports. Les tests prouvent ce qui passe… et ce qui ne passe pas.</p>

<div class="aside caution">
  <p class="aside-title">Consignes</p>
  <ul>
    <li>Outils : <strong>VirtualBox</strong>, une machine virtuelle <strong>pfSense</strong> (fournie par l’enseignant ou installée selon la procédure de la salle), SRV-WIN et SRV-DEB des chapitres 2 et 3.</li>
    <li>L’interface web de pfSense demande un navigateur récent : installer Firefox sur SRV-WIN pendant la préparation (carte temporairement en NAT), ou utiliser une machine virtuelle cliente Kubuntu reliée au réseau interne <code>tp5</code>.</li>
    <li>Prendre un instantané <code>avant-TP12</code> de chaque machine virtuelle. Travail individuel, <strong>sans IA</strong>.</li>
    <li>Les tests vers Internet ne fonctionnent que si le poste hôte a lui-même accès à Internet ; sinon, les noter « non testable » dans le rapport.</li>
  </ul>
</div>

<h2>L’architecture</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Machine</th><th>Carte VirtualBox</th><th>Zone</th><th>Adresse</th></tr>

<p class="refco">La passerelle <code>192.168.50.62</code>, prévue dès le TP 5 du chapitre 2, existe enfin : c’est pfSense. Le réseau de la DMZ est celui du plan d’adressage du TP 6.</p>

<h2>Mission 1 : installer pfSense et la DMZ</h2>
<details class="task lvl1" open>
  <summary><span class="lvl">Essentiel</span>Interfaces, accès à l’interface web, déplacement du serveur web</summary>
  <div class="task-body">
    <ol class="steps">
      <li>Machine pfSense éteinte : configurer ses trois cartes comme dans le tableau. Démarrer.</li>

      <li>Option <strong>2) Set interface(s) IP address</strong>, interface LAN : adresse <code>192.168.50.62</code>, préfixe <code>26</code>, pas de passerelle, pas d’IPv6, <strong>ne pas activer le serveur DHCP</strong> (c’est SRV-WIN qui assure le DHCP du LAN : deux serveurs DHCP sur un réseau, c’est la panne assurée), conserver HTTPS pour l’interface web.</li>

      <p>Avant d’écrire la moindre règle, prévoir puis tester : a) depuis SRV-WIN, <code>curl.exe -I http://www.m2l.lan</code> ; b) depuis SRV-DEB, <code>ping -c 2 192.168.50.20</code> ; c) depuis SRV-DEB, <code>dig @172.16.2.246 deb.debian.org</code> ; d) depuis SRV-WIN, <code>Resolve-DnsName deb.debian.org</code> puis <code>curl.exe -I http://deb.debian.org</code>. Justifier avec les règles par défaut de pfSense (partie 5).</p>

<details class="task lvl1" open>

  <div class="task-body">

    <div class="tbl-wrap"><table class="data wide">
      <tr><th>N°</th><th>Action</th><th>Protocole</th><th>Source</th><th>Destination</th><th>Port</th><th>Description</th></tr>
      <tr><td>1</td><td>Pass</td><td>TCP/UDP</td><td>DMZ subnets</td><td>DMZ address</td><td>53 (DNS)</td><td>DNS vers le résolveur pfSense</td></tr>
      <tr><td>2</td><td>Block (cocher <em>Log</em>)</td><td>Any</td><td>DMZ subnets</td><td>LAN subnets</td><td>—</td><td>Interdire la DMZ vers le LAN</td></tr>
      <tr><td>3</td><td>Pass</td><td>TCP</td><td>DMZ subnets</td><td>any</td><td>alias <code>PORTS_WEB</code> (80, 443)</td><td>Mises à jour du serveur</td></tr>
    </table></div>
    <p>Créer d’abord l’alias : <em>Firewall &gt; Aliases &gt; Ports</em>, nom <code>PORTS_WEB</code>, ports <code>80</code> et <code>443</code>. Après chaque modification : <em>Apply Changes</em>.</p>
    <div class="answer" data-id="t12-regles" data-label="Mission 2 : tests des règles et lecture du journal" data-min="200" data-rows="10">
      <p>Refaire les tests b) et c) de la mission 1, puis, sur SRV-DEB, <code>sudo apt update</code>. Consulter <em>Status &gt; System Logs &gt; Firewall</em> : retrouver et expliquer la ligne correspondant au test b). Enfin, répondre : que se passerait-il si la règle 3 était placée <strong>avant</strong> la règle 2 ?</p>
      <div class="corr">
        <p>b) Toujours <strong>refusé</strong>, désormais explicitement par la règle 2, et journalisé. c) <strong>Succès</strong> grâce à la règle 1 (si pfSense a accès à Internet pour résoudre). <code>apt update</code> : <strong>succès</strong> grâce à la règle 3 (les dépôts Debian utilisent HTTP ou HTTPS).</p>
        <p>Journal : une ligne avec une croix (bloqué), interface DMZ, source 172.16.2.241, destination 192.168.50.20, protocole ICMP, et le nom de la règle (« Interdire la DMZ vers le LAN »). Le journal prouve que la politique est appliquée, et servira à détecter un serveur compromis qui tenterait d’atteindre le LAN.</p>
        <p>Règle 3 avant la règle 2 : la première règle qui correspond s’applique. Une connexion de la DMZ vers un service web du LAN (par exemple un intranet hébergé sur SRV-WIN, port 80) correspondrait à la règle 3 et serait <strong>autorisée</strong>, ce qui viole la politique. L’ordre des règles fait partie de la sécurité : les interdictions précises avant les autorisations générales.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 3 : publier le serveur web</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Redirection de ports et test depuis « Internet »</summary>
  <div class="task-body">
    <ol class="steps">
      <li><em>Firewall &gt; NAT &gt; Port Forward &gt; Add</em> : interface <code>WAN</code>, protocole <code>TCP</code>, destination <code>WAN address</code>, port de destination <code>HTTP</code>, <em>Redirect target IP</em> <code>172.16.2.241</code>, <em>Redirect target port</em> <code>HTTP</code>, description <code>Publication du site web</code>, <em>Filter rule association</em> : <em>Add associated filter rule</em>. <em>Save</em>, <em>Apply Changes</em>.</li>
      <li>Vérifier dans <em>Firewall &gt; Rules &gt; WAN</em> la règle créée automatiquement.</li>
      <li>Dans VirtualBox (machine pfSense, <em>Configuration &gt; Réseau &gt; Carte 1 &gt; Avancé &gt; Redirection de ports</em>), ajouter : nom <code>web</code>, protocole TCP, IP hôte <code>127.0.0.1</code>, port hôte <code>8080</code>, IP invité vide, port invité <code>80</code>.</li>
      <li>Sur le <strong>poste physique</strong>, ouvrir <code>http://127.0.0.1:8080</code> dans le navigateur.</li>
      <li>Sur SRV-DEB : <code>sudo tail -n 3 /var/log/apache2/access.log</code>.</li>
    </ol>
    <div class="answer" data-id="t12-nat" data-label="Mission 3 : suivre une requête depuis Internet jusqu’à la DMZ" data-min="200" data-rows="9">
      <p>a) La page du serveur web s’affiche-t-elle sur le poste physique ? b) Décrire toutes les traductions subies par la requête, du navigateur du poste physique jusqu’à Apache (adresses et ports). c) Quelle adresse source apparaît dans le journal d’Apache ? Pourquoi n’est-ce pas l’adresse du poste physique ? d) Depuis le poste physique, l’interface web de pfSense ou SRV-WIN sont-ils accessibles ? Pourquoi ?</p>
      <div class="corr">
        <p>a) Oui : le poste physique joue le rôle d’un internaute.</p>
        <p>b) Navigateur → <code>127.0.0.1:8080</code> ; la redirection de VirtualBox envoie la connexion vers le port 80 de l’interface WAN de pfSense (<code>10.0.2.15:80</code>), avec pour source la passerelle NAT de VirtualBox (<code>10.0.2.2</code>) ; la redirection de ports de pfSense traduit la destination en <code>172.16.2.241:80</code> (NAT de destination), puis la règle WAN associée l’autorise. Les réponses suivent le chemin inverse, grâce aux tables de traduction et d’états.</p>
        <p>c) <code>10.0.2.2</code>, l’adresse de la passerelle NAT de VirtualBox : chaque traduction masque l’adresse précédente. Sur un vrai accès Internet, Apache verrait l’adresse publique de l’internaute (pfSense ne traduit que la destination).</p>
        <p>d) Non : seul le port 80, redirigé vers la DMZ, est publié. Aucune règle WAN n’autorise l’accès au LAN ou à l’interface d’administration de pfSense depuis Internet ; c’est le comportement attendu, conforme à la matrice des flux.</p>
      </div>
    </div>
  </div>
</details>

<h2>Mission 4 : le rapport de test</h2>
<details class="task lvl2" open>
  <summary><span class="lvl">Intermédiaire</span>Vérifier la politique, flux par flux</summary>
  <div class="task-body">
    <div class="answer" data-id="t12-rapport" data-label="Mission 4 : rapport de test du pare-feu" data-min="200" data-rows="10">
      <p>Rédiger le rapport de test du pare-feu sous forme de tableau : flux testé (source, destination, service), règle concernée, résultat attendu, commande de test, résultat obtenu, conformité. Au moins 8 flux, dont au moins 4 qui doivent être <strong>refusés</strong>. Conclure : la configuration respecte-t-elle la matrice des flux de la partie 5 ? Quelles réserves restent ?</p>
      <div class="corr">
        <p>Flux attendus (exemples) : LAN → DMZ HTTP (autorisé, règle LAN par défaut) ; DMZ → LAN ICMP et SMB (refusés, règle DMZ 2, journalisés) ; DMZ → résolveur DNS (autorisé, règle 1) ; DMZ → Internet HTTP/HTTPS (autorisé, règle 3) ; DMZ → Internet SSH (refusé : aucune règle) ; Internet → DMZ HTTP (autorisé, redirection et règle WAN) ; Internet → DMZ SSH (refusé) ; Internet → LAN (refusé) ; Internet → interface web de pfSense (refusé).</p>
        <p>Les tests de refus sont aussi importants que les tests d’autorisation : ils prouvent que la politique est appliquée. Les commandes utilisées : <code>ping</code>, <code>curl</code>, <code>Test-NetConnection -Port</code>, <code>smbclient</code>, navigateur ; le journal du pare-feu confirme les refus.</p>
        <p>Réserves possibles : la règle LAN « tout autoriser » est trop large (moindre privilège) ; le site est publié en HTTP non chiffré ; aucune règle IPv6 n’a été écrite ; la configuration de pfSense doit être sauvegardée (<em>Diagnostics &gt; Backup &amp; Restore</em>) et documentée.</p>
      </div>
    </div>
  </div>
</details>

<h2>Défi : appliquer le moindre privilège au LAN</h2>
<details class="task lvl3">
  <summary><span class="lvl">Défi</span>Remplacer la règle « tout autoriser » du LAN</summary>
  <div class="task-body">
    <div class="answer" data-id="t12-defi" data-label="Défi : règles du LAN selon le moindre privilège" data-min="150" data-rows="8">
      <p>Proposer les règles de l’onglet LAN qui remplacent « Default allow LAN to any » : le LAN doit pouvoir utiliser le DNS de pfSense, naviguer sur Internet (HTTP, HTTPS), atteindre le serveur web de la DMZ (HTTP) et l’administrer (SSH), et pinguer pour le diagnostic. Quelle règle ne faut-il surtout pas supprimer ? Tester, puis désactiver la règle par défaut (sans la supprimer).</p>
      <div class="corr">
        <ol>
          <li>Pass TCP/UDP, LAN subnets → LAN address, port 53 (DNS de pfSense).</li>
          <li>Pass TCP, LAN subnets → 172.16.2.241, ports 80 et 22.</li>
          <li>Pass ICMP (echo request), LAN subnets → any.</li>
          <li>Pass TCP, LAN subnets → any, alias <code>PORTS_WEB</code>.</li>
        </ol>
        <p>Ne pas supprimer la règle <strong>anti-verrouillage</strong> (<em>Anti-Lockout Rule</em>), qui garantit l’accès à l’interface web de pfSense depuis le LAN : sans elle, une erreur de règle peut couper l’administrateur de son propre pare-feu. Désactiver plutôt que supprimer permet de revenir en arrière en un clic. Après le test, vérifier qu’un service non prévu (par exemple SMB vers Internet) est bien refusé.</p>
      </div>
    </div>
  </div>
</details>

<div class="aside next">
  <p class="aside-title">La suite</p>

</div>

<template data-page="p6">
<h1>L’accès distant sécurisé : SSH, RDP, VPN</h1>

<div class="aside caution">
  <p class="aside-title">Avant de commencer</p>
  <p>Prérequis : <a href="#tp10">TP 10</a> (VLAN 99 de gestion), <a href="#p5">partie 5</a> (zones, pare-feu), chapitre 3 (ports). Garder ouverte la maquette <code>TP11-NOM-Prenom.pkt</code> pour la mise en pratique. Travail <strong>sans IA</strong>.</p>
</div>

<figure class="carte" aria-label="Carte de la partie"><div class="carte-in"><div class="carte-root">Accès distant</div><ul>
  <li><span><b>Administrer</b> : console, réseau de gestion, dans la bande ou hors bande</span></li>
  <li><span><b>SSH</b> : ligne de commande chiffrée, clés</span></li>
  <li><span><b>RDP</b> : bureau à distance, jamais exposé directement</span></li>
  <li><span><b>VPN</b> : tunnel chiffré, nomade ou site à site</span></li>
</ul></div></figure>

<p class="lead">Les équipements de la M2L sont dans des armoires fermées et les serveurs dans la baie du bâtiment B : on les administre <strong>à distance</strong>. Les salariés en déplacement et le site annexe doivent aussi accéder au réseau interne. Ces accès sont des portes d’entrée privilégiées pour un attaquant : ils doivent être chiffrés, authentifiés et limités.</p>

<h2>Administrer les équipements</h2>
<dl class="def">
  <dt>Administration hors bande <small>out-of-band</small></dt><dd>Par un chemin séparé du réseau de production : le <strong>port console</strong> (câble sur place), ou un réseau d’administration physiquement distinct. Reste disponible quand le réseau est en panne, ou quand une erreur de configuration a coupé l’accès.</dd>
  <dt>Administration dans la bande <small>in-band</small></dt><dd>À travers le réseau de production, depuis un poste d’administrateur : SSH, interface web, RDP. Pratique, mais dépend du réseau. On la limite à un <strong>réseau de gestion</strong> dédié (le VLAN 99 de la M2L) et à quelques postes autorisés.</dd>
</dl>

<h2>SSH : la ligne de commande chiffrée</h2>
<p><strong>Telnet</strong> (TCP 23) transmet tout en clair : une simple capture suffit à lire le mot de passe de l’administrateur. <strong>SSH</strong> (<em>Secure Shell</em>, TCP 22) chiffre toute la session et authentifie le serveur et l’utilisateur.</p>
<ul>
  <li><strong>Authentification du serveur</strong> : à la première connexion, le client affiche l’<strong>empreinte</strong> de la clé du serveur et demande de la confirmer ; elle est ensuite mémorisée (<code>~/.ssh/known_hosts</code>). Si elle change un jour, le client affiche un avertissement : soit le serveur a été réinstallé, soit quelqu’un se fait passer pour lui.</li>
  <li><strong>Authentification de l’utilisateur</strong> : par mot de passe, ou mieux par <strong>paire de clés</strong> (clé privée gardée par l’administrateur, clé publique déposée sur le serveur). On désactive ensuite l’authentification par mot de passe et la connexion directe du compte <code>root</code>.</li>
  <li>SSH transporte aussi des fichiers (<strong>SFTP</strong>, <code>scp</code>) et des tunnels.</li>
</ul>
<pre class="code terminal"><span class="cm"># Depuis un poste d’administrateur (Linux ou Windows 10/11, client OpenSSH intégré)</span>
<span class="pr">$</span> ssh-keygen -t ed25519                        <span class="cm"># créer sa paire de clés</span>
<span class="pr">$</span> ssh-copy-id etudiant@srv-deb.m2l.lan          <span class="cm"># déposer la clé publique (Linux)</span>
<span class="pr">$</span> ssh etudiant@srv-deb.m2l.lan

<span class="cm"># Sur le serveur Debian : /etc/ssh/sshd_config, puis sudo systemctl restart ssh</span>
PermitRootLogin no
PasswordAuthentication no</pre>

<h3>Mise en pratique : SSH sur un commutateur Cisco</h3>
<p>Dans la maquette, configurer SW-B pour qu’il ne soit administrable qu’en SSH, avec un compte local :</p>
<pre class="code terminal">SW-B(config)# ip domain-name m2l.lan
SW-B(config)# username admin privilege 15 secret Adm1n-M2L-2027
SW-B(config)# crypto key generate rsa
How many bits in the modulus [512]: 2048
SW-B(config)# ip ssh version 2
SW-B(config)# line vty 0 15
SW-B(config-line)# transport input ssh
SW-B(config-line)# login local
SW-B(config-line)# end
SW-B# copy running-config startup-config</pre>
<div class="answer" data-id="a-ssh" data-label="Mise en pratique : tester l’accès SSH au commutateur" data-min="120" data-rows="7">
  <p>Depuis PC-ADM1 (<em>Command Prompt</em>) : <code>telnet 172.16.3.1</code>, puis <code>ssh -l admin 172.16.3.1</code>. Noter les résultats. a) Pourquoi faut-il un nom de domaine avant de générer les clés ? b) À quoi servent <code>transport input ssh</code> et <code>login local</code> ? c) Quelle règle de filtrage ajouter sur R1 pour que seul le VLAN 10 (administration) puisse joindre le VLAN 99 en SSH ?</p>
  <div class="corr">
    <p>Telnet est refusé ; SSH demande le mot de passe du compte <code>admin</code>, puis donne l’invite <code>SW-B#</code> (le privilège 15 donne directement le mode privilégié).</p>
    <p>a) La clé RSA du commutateur est nommée d’après son nom complet (nom d’hôte + domaine) : sans nom de domaine, IOS refuse de la générer. b) <code>transport input ssh</code> n’accepte que SSH sur les lignes virtuelles (Telnet refusé) ; <code>login local</code> vérifie l’identifiant et le mot de passe dans les comptes locaux (<code>username</code>), ce qui permet de savoir qui s’est connecté.</p>
    <p>c) Une ACL étendue en sortie de la sous-interface du VLAN 99 (ou en entrée des autres VLAN), par exemple : <code>permit tcp 172.16.2.128 0.0.0.63 172.16.3.0 0.0.0.15 eq 22</code>, puis <code>deny ip any 172.16.3.0 0.0.0.15</code>, puis <code>permit ip any any</code>. On peut aussi limiter directement les lignes VTY du commutateur avec <code>access-class</code>.</p>
  </div>
</div>

<h2>RDP : le bureau à distance</h2>
<p><strong>RDP</strong> (<em>Remote Desktop Protocol</em>, TCP 3389) donne accès au bureau graphique d’une machine Windows. Il sert à administrer Windows Server et à accéder à des postes ou à des applications à distance. Règles de sécurité :</p>
<ul>
  <li>activer l’<strong>authentification au niveau du réseau</strong> (NLA), qui exige l’authentification avant d’ouvrir la session graphique ;</li>
  <li><strong>ne jamais publier RDP directement sur Internet</strong> par une redirection de ports : c’est l’une des principales portes d’entrée des rançongiciels (attaques par essais de mots de passe, failles). On passe par un VPN, une passerelle RDS ou un bastion ;</li>
  <li>limiter les comptes autorisés et surveiller les échecs de connexion (journaux de sécurité).</li>
</ul>
<div class="aside pro">
  <p class="aside-title">Le bastion d’administration</p>
  <p>Dans les organisations sensibles, l’ANSSI recommande de faire passer toutes les connexions d’administration (SSH, RDP, interfaces web) par un <strong>bastion</strong> : un serveur unique, très protégé, sur lequel les administrateurs s’authentifient fortement, et qui enregistre les sessions. Les équipements n’acceptent alors les connexions d’administration que depuis le bastion.</p>
</div>

<h2>Les VPN</h2>
<p>Un <strong>VPN</strong> (<em>Virtual Private Network</em>, réseau privé virtuel) crée un <strong>tunnel chiffré</strong> à travers un réseau non sûr (Internet) : les paquets du réseau privé sont encapsulés et chiffrés dans des paquets ordinaires. Il assure la <strong>confidentialité</strong> (chiffrement), l’<strong>intégrité</strong> (détection des modifications) et l’<strong>authentification</strong> des extrémités.</p>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Type</th><th>Principe</th><th>Exemple à la M2L</th></tr>
  <tr><td><strong>Site à site</strong></td><td>Deux routeurs ou pare-feu établissent un tunnel permanent ; les postes des deux sites communiquent sans rien installer.</td><td>Relier le site annexe au site principal à travers Internet, plutôt qu’avec une liaison louée coûteuse.</td></tr>
  <tr><td><strong>Accès nomade</strong> (<em>client to site</em>)</td><td>Un logiciel client sur l’ordinateur de l’utilisateur ouvre le tunnel vers le pare-feu de l’organisation, après authentification.</td><td>Le directeur en déplacement accède au serveur de fichiers depuis son hôtel.</td></tr>
</table></div>
<p>Protocoles courants : <strong>IPsec</strong> (standard, surtout site à site, IKEv2), <strong>OpenVPN</strong> (basé sur TLS, très utilisé en accès nomade), <strong>WireGuard</strong> (récent, simple et rapide). pfSense les propose tous les trois ; leur mise en œuvre est approfondie en deuxième année et dans le bloc 3.</p>
<div class="aside deep">
  <p class="aside-title">Du VPN au « zéro confiance »</p>
  <p>Un VPN classique fait confiance à tout ce qui est « dans le réseau » une fois le tunnel ouvert. Le modèle <strong>zéro confiance</strong> (<em>Zero Trust</em>, cité par le référentiel du BTS) part du principe inverse : chaque accès à chaque application est vérifié (identité, état de l’appareil, contexte), où que soit l’utilisateur. Les deux approches coexistent aujourd’hui dans les entreprises.</p>
</div>

<div class="match" data-id="m-distant" data-label="Choisir la solution d’accès distant adaptée" data-options="Câble console|SSH|RDP à travers un VPN|VPN site à site|VPN nomade">
  <div class="r" data-ok="Câble console" data-expl="Le réseau est coupé : seul l’accès hors bande fonctionne.">Une erreur de configuration a coupé le commutateur du réseau ; il faut le reconfigurer.</div>
  <div class="r" data-ok="SSH" data-expl="Ligne de commande chiffrée depuis le réseau de gestion.">L’administrateur modifie la configuration d’un routeur depuis son bureau, sur le réseau de gestion.</div>
  <div class="r" data-ok="VPN site à site" data-expl="Deux sites reliés en permanence, sans logiciel sur les postes.">Relier en permanence le réseau du site annexe à celui du site principal à travers Internet.</div>
  <div class="r" data-ok="VPN nomade" data-expl="Un utilisateur isolé, un client VPN sur son ordinateur.">Le trésorier de la ligue de volley consulte le dossier partagé depuis son domicile.</div>
  <div class="r" data-ok="RDP à travers un VPN" data-expl="Le bureau à distance ne doit jamais être exposé directement sur Internet.">Un administrateur d’astreinte doit ouvrir, depuis chez lui, la console graphique du serveur Windows.</div>
</div>

<div class="aside note">
  <p class="aside-title">Pièges fréquents</p>
  <ul>
    <li>Laisser Telnet actif « en plus » de SSH sur les équipements (<code>transport input all</code>).</li>
    <li>Publier RDP ou l’interface d’administration d’un équipement sur Internet par une redirection de ports.</li>
    <li>Accepter sans vérifier un avertissement de changement d’empreinte SSH.</li>
  </ul>
</div>

<h2>Vérifier ses connaissances</h2>
<div class="quiz" data-id="q-fin-p6" data-title="Accès distant" data-label="Quiz de fin de partie">
  <div class="q" data-ok="2">
    <p class="qt">Pourquoi Telnet doit-il être remplacé par SSH ?</p>
    <ul><li>Telnet ne fonctionne pas sur les commutateurs</li><li>Telnet transmet tout en clair, y compris les mots de passe</li><li>SSH est plus rapide</li><li>Telnet utilise UDP</li></ul>
    <div class="expl"><p>Une capture suffit à lire une session Telnet ; SSH chiffre tout l’échange.</p></div>
  </div>
  <div class="q" data-ok="3">
    <p class="qt">Sur un commutateur Cisco, quelle commande n’autorise que SSH sur les lignes virtuelles ?</p>
    <ul><li><code>ip ssh version 2</code></li><li><code>login local</code></li><li><code>transport input ssh</code></li><li><code>crypto key generate rsa</code></li></ul>
    <div class="expl"><p><code>transport input ssh</code>, en mode <code>line vty</code>.</p></div>
  </div>
  <div class="q" data-ok="1">
    <p class="qt">Quel type de VPN relie en permanence deux sites, sans logiciel sur les postes ?</p>
    <ul><li>Le VPN site à site</li><li>Le VPN nomade</li><li>Le bureau à distance</li><li>Le VLAN</li></ul>
    <div class="expl"><p>Le tunnel est établi entre les deux pare-feu ou routeurs.</p></div>
  </div>
  <div class="q" data-ok="4">
    <p class="qt">Quelle pratique est dangereuse ?</p>
    <ul><li>Administrer les commutateurs depuis le VLAN de gestion</li><li>Utiliser des clés SSH plutôt que des mots de passe</li><li>Passer par un VPN pour accéder au bureau à distance</li><li>Rediriger le port 3389 de l’adresse publique vers un serveur Windows</li></ul>
    <div class="expl"><p>Exposer RDP directement sur Internet est une cause majeure d’intrusions et de rançongiciels.</p></div>
  </div>
</div>
