<h2>Sauvegarde</h2>
<p>Sauvegarder en fin de séance et ranger le fichier (OneDrive, Teams, clé USB, dépôt GitHub). Pour continuer ailleurs, ouvrir ce fichier depuis la page de démarrage ou ici.</p>
<div class="panel" data-widget="backup"></div>

<h2>Fiche mémo : les notions</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Notion</th><th>À retenir</th></tr>
  <tr><td>Conception</td><td>Besoin (fonctionnel, qualité, contraintes, environnement), existant, impact et régression ; maquette (simulation) puis prototype (environnement réel de test) ; dossier de choix (coût total, qualité, délai, environnement).</td></tr>
  <tr><td>Modèle hiérarchique</td><td>Accès (postes, VLAN des ports), distribution (routage inter-VLAN, filtrage), cœur (transport rapide). Cœur réduit dans les structures moyennes.</td></tr>
  <tr><td>Schémas</td><td>Physique (emplacements, câbles, ports) et logique (réseaux, VLAN, adresses, zones), avec légende, date, version.</td></tr>
  <tr><td>VLAN</td><td>Domaine de diffusion logique ; un VLAN = un sous-réseau ; il faut un routeur entre VLAN.</td></tr>
  <tr><td>Accès / trunk</td><td>Port d’accès : un VLAN, trames non étiquetées. Trunk 802.1Q : plusieurs VLAN, étiquette de 4 octets (VID sur 12 bits). VLAN natif non étiqueté, identique aux deux bouts.</td></tr>
  <tr><td>Routage inter-VLAN</td><td>Routeur sur un bâton (sous-interfaces, <code>encapsulation dot1Q</code>) ou commutateur de niveau 3 (SVI, <code>ip routing</code>).</td></tr>
  <tr><td>STP</td><td>Évite les boucles de couche 2 (tempêtes de diffusion) : élection d’un pont racine, ports redondants bloqués. PortFast et BPDU Guard sur les ports d’accès.</td></tr>
  <tr><td>Table de routage</td><td>C connectée, L locale, S statique, S* par défaut (0.0.0.0/0), O OSPF. Choix : préfixe le plus long, puis distance administrative (0, 1, 110, 120), puis métrique.</td></tr>
  <tr><td>Routes retour</td><td>Un échange a deux sens : une route vers la destination à l’aller, une route vers la source au retour.</td></tr>
  <tr><td>NAT / PAT</td><td>Traduction d’adresses privées en adresse publique ; le PAT distingue les connexions par les ports. Inside local (privée), inside global (publique). Redirection de ports pour publier un serveur. La NAT n’est pas un pare-feu.</td></tr>
  <tr><td>Zones, DMZ</td><td>Internet, DMZ (serveurs publiés), invités, ligues, administration, gestion. Aucun flux DMZ → LAN. Matrice des flux avant les règles.</td></tr>
  <tr><td>ACL</td><td>Règles lues dans l’ordre, première correspondance, refus implicite final. Standard (source, près de la destination), étendue (près de la source). Masque générique.</td></tr>
  <tr><td>Pare-feu à états</td><td>Table des connexions : les réponses sont autorisées automatiquement. pfSense : règles sur l’interface d’entrée, première règle correspondante, nouvelle interface = tout refusé.</td></tr>
  <tr><td>Accès distant</td><td>Hors bande (console) / dans la bande (réseau de gestion). SSH (22) plutôt que Telnet ; clés ; RDP (3389) jamais exposé directement. VPN site à site ou nomade (IPsec, OpenVPN, WireGuard).</td></tr>
</table></div>

<h2>Fiche mémo : les commandes Cisco</h2>
<div class="tbl-wrap"><table class="data wide">
  <tr><th>Besoin</th><th>Commandes</th></tr>
  <tr><td>Configuration de base</td><td><code>hostname</code>, <code>enable secret</code>, <code>service password-encryption</code>, <code>banner motd</code>, <code>line console 0</code> + <code>password</code> + <code>login</code>, <code>copy running-config startup-config</code></td></tr>
  <tr><td>VLAN</td><td><code>vlan 10</code>, <code>name</code>, <code>switchport mode access</code>, <code>switchport access vlan 10</code>, <code>show vlan brief</code></td></tr>
  <tr><td>Trunk</td><td><code>switchport mode trunk</code>, <code>switchport trunk native vlan 999</code>, <code>switchport trunk allowed vlan …</code> (<code>add</code>), <code>show interfaces trunk</code></td></tr>
  <tr><td>Gestion d’un commutateur</td><td><code>interface vlan 99</code> + <code>ip address</code>, <code>ip default-gateway</code></td></tr>
  <tr><td>Sous-interface</td><td><code>interface G0/0/0.10</code>, <code>encapsulation dot1Q 10</code>, <code>ip address</code></td></tr>
  <tr><td>Routage</td><td><code>ip route réseau masque prochain-saut</code>, <code>ip route 0.0.0.0 0.0.0.0 …</code>, <code>show ip route</code>, <code>router ospf 1</code> + <code>network … area 0</code></td></tr>
  <tr><td>NAT</td><td><code>ip nat inside</code> / <code>outside</code>, <code>access-list 1 permit … wildcard</code>, <code>ip nat inside source list 1 interface … overload</code>, <code>show ip nat translations</code></td></tr>
  <tr><td>ACL</td><td><code>ip access-list extended NOM</code>, <code>permit</code> / <code>deny</code>, <code>ip access-group NOM in</code>, <code>show access-lists</code></td></tr>
  <tr><td>SSH</td><td><code>ip domain-name</code>, <code>username … secret</code>, <code>crypto key generate rsa</code>, <code>ip ssh version 2</code>, <code>line vty 0 15</code> + <code>transport input ssh</code> + <code>login local</code></td></tr>
  <tr><td>Remise à zéro (matériel réel)</td><td><code>erase startup-config</code>, <code>delete flash:vlan.dat</code>, <code>reload</code></td></tr>
</table></div>
</template>

<script>
/* Moteur de support interactif BTS SIO (gabarit réutilisable)
   Toute la configuration du cours est dans <script type="application/json" id="course-config">.
   Moteur du support (fichier unique) : navigation interne, page de démarrage obligatoire,
   activités auto-corrigées, réponses rédigées, première tentative retenue, journal horodaté,
   identifiant étudiant, sauvegarde / restauration par fichier, alertes. */
(function () {
  'use strict';

  var CONFIG = {};
  try { CONFIG = JSON.parse(document.getElementById('course-config').textContent); } catch (err) { CONFIG = {}; }
  var PAGES = CONFIG.pages || [{ id: 'accueil', kind: 'Démarrer', n: 'Démarrage', title: 'Démarrage et sauvegardes' }, { id: 'bilan', kind: 'Bilan', n: 'Bilan', title: 'Bilan et compte rendu' }];
  var FILES = CONFIG.files || {};
  var TITLE = CONFIG.title || 'Support de cours';
  var KEY = CONFIG.storageKey || 'support:v1';
  var SELF = { ok: 'Réussi', mid: 'En partie', ko: 'À revoir' };
  var REMIND_MS = 20 * 60 * 1000;
  var SESSION_START = Date.now();

  /* ---------- utilitaires ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function h(tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function plain(html) { var d = document.createElement('div'); d.innerHTML = html; return (d.textContent || '').replace(/\s+/g, ' ').trim(); }
  var ARROW = '<span class="dfa" aria-label="détermine"><span>df</span><i></i></span>';
  function arrows(x) { return String(x || '').replace(/-df-(&gt;|>)/g, ARROW); }
  function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
  function pageById(id) { return PAGES.filter(function (p) { return p.id === id; })[0]; }
  function two(n) { return ('0' + n).slice(-2); }
  function fmtDate(t, withYear) { var d = new Date(t); return two(d.getDate()) + '/' + two(d.getMonth() + 1) + (withYear ? '/' + d.getFullYear() : '') + ' ' + two(d.getHours()) + ':' + two(d.getMinutes()); }
  function ago(t) { var m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'à l’instant' : m < 60 ? 'il y a ' + m + ' min' : 'il y a ' + Math.floor(m / 60) + ' h ' + two(m % 60); }
  function slug(s) { return (s || 'etudiant').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase(); }
  function fullName(st) { st = st || state.student; return ((st.prenom || '') + ' ' + (st.nom || '')).trim(); }

  /* ---------- état ---------- */
  var state, storageOK = true;
  function blank() { return { v: 2, student: {}, items: {}, firsts: {}, log: [], ui: {} }; }
  function normalize(s) {
    s = s && typeof s === 'object' ? s : blank();
    s.v = 2; s.student = s.student || {}; s.items = s.items || {}; s.firsts = s.firsts || {}; s.log = s.log || []; s.ui = s.ui || {};
    return s;
  }
  function load() {
    try { localStorage.setItem(KEY + ':test', '1'); storageOK = localStorage.getItem(KEY + ':test') === '1'; localStorage.removeItem(KEY + ':test'); } catch (e) { storageOK = false; }
    var s = null; try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) { s = null; }
    state = normalize(s);
  }
  var saveTimer = null;
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* stockage indisponible : l'état reste en mémoire */ } updateSaveBtn(); }
  function save() { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 150); }
  function saveNow() { clearTimeout(saveTimer); persist(); }

  function logEvent(e, k, d) {
    state.log.push({ t: Date.now(), e: e, p: k ? k.split(':')[0] : PAGE, k: k || null, d: d || null });
    if (state.log.length > 3000) state.log.splice(0, state.log.length - 3000);
  }
  function sig() {
    var t = JSON.stringify({ s: state.student, i: state.items, f: state.firsts }), x = 5381;
    for (var i = 0; i < t.length; i++) x = ((x << 5) + x + t.charCodeAt(i)) | 0;
    return String(x);
  }
  function hasWork() { return Object.keys(state.items).length > 0 || !!state.student.nom; }
  function dirty() { return hasWork() && state.ui.fileSig !== sig(); }
  function lastActivity(s) { var l = s.log && s.log.length ? s.log[s.log.length - 1].t : 0; return Math.max(l, s.ui && s.ui.fileAt || 0); }
  function newId() {
    var a = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', out = '', r = new Uint8Array(4);
    try { crypto.getRandomValues(r); } catch (e) { for (var j = 0; j < 4; j++) r[j] = Math.floor(Math.random() * 256); }
    for (var i = 0; i < 4; i++) out += a[r[i] % a.length];
    return (CONFIG.idPrefix || 'SIO') + '-' + out;
  }

  /* ---------- fichiers ---------- */
  function download(name, content, type) {
    try {
      var blob = new Blob([content], { type: type }), url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 800);
    } catch (e) { /* téléchargement impossible dans ce contexte */ }
  }
  function backupName() { var d = new Date(); return 'sauvegarde-' + (CONFIG.fileSlug || 'cours') + '-' + slug(fullName()) + '-' + d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()) + '-' + two(d.getHours()) + 'h' + two(d.getMinutes()) + '.json'; }
  function fileSave() {
    var name = backupName();
    state.ui.saves = (state.ui.saves || 0) + 1;
    logEvent('save', null, { n: state.ui.saves });
    state.ui.fileAt = Date.now();
    state.ui.fileSig = sig();
    download(name, JSON.stringify(state), 'application/json');
    saveNow(); hideReminder();
    return name;
  }
  function restoreText(txt, box, force) {
    var s;
    try { s = JSON.parse(txt); if (!s || !s.items) throw new Error('format'); } catch (e) { setMsg(box, 'Ce fichier n’est pas une sauvegarde de ce cours.', 'bad'); return; }
    s = normalize(s);
    if (!s.student.nom && s.student.name) s.student.nom = s.student.name; // ancienne version
    var warn = [];
    if (state.student.id && s.student.id && s.student.id !== state.student.id && hasWork()) warn.push('Ce fichier appartient à ' + esc(fullName(s.student) || 'un autre étudiant') + ' (' + esc(s.student.id) + '), pas à ' + esc(fullName()) + ' (' + esc(state.student.id) + ').');
    if (hasWork() && lastActivity(s) && lastActivity(s) < lastActivity(state) - 60000) warn.push('Ce fichier date du ' + fmtDate(lastActivity(s), true) + ' : il est plus ancien que le travail actuellement ouvert (' + fmtDate(lastActivity(state), true) + '). Le travail plus récent serait perdu.');
    if (warn.length && !force) {
      box.innerHTML = '<div class="notice ko"><p>' + warn.join('</p><p>') + '</p><p class="row"><button type="button" class="btn small" data-force>Remplacer quand même</button><button type="button" class="btn small" data-cancel>Annuler</button></p></div>';
      $('[data-force]', box).addEventListener('click', function () { restoreText(txt, box, true); });
      $('[data-cancel]', box).addEventListener('click', function () { box.innerHTML = ''; });
      return;
    }
    var theme = state.ui.theme, fromId = s.student.id, fromDate = s.ui.fileAt;
    state = s; state.ui.theme = theme; state.ui.started = true;
    if (!state.student.id) state.student.id = newId();
    logEvent('restore', null, { id: fromId || null, date: fromDate || null, forced: !!force });
    state.ui.fileSig = sig(); saveNow();
    render(PAGE);
    var m = $('[data-restore-ok]'); if (m) m.hidden = false;
  }
  function setMsg(box, txt, cls) { if (box) box.innerHTML = '<span class="ck-msg ' + cls + '">' + txt + '</span>'; }
  function fileInput(input, box) {
    input.addEventListener('change', function (e) {
      var f = e.target.files[0]; if (!f) return;
      var r = new FileReader(); r.onload = function () { restoreText(r.result, box, false); input.value = ''; }; r.readAsText(f);
    });
  }
  function copyText(txt, btn, area) {
    function ok() { var o = btn.textContent; btn.textContent = 'Copié'; setTimeout(function () { btn.textContent = o; }, 1600); }
    function fb() { if (area) { area.hidden = false; area.value = txt; area.focus(); area.select(); } btn.textContent = 'Sélectionner puis Ctrl+C'; }
    try { navigator.clipboard.writeText(txt).then(ok, fb); } catch (e) { fb(); }
  }

  /* ---------- manifeste de toutes les activités (calculé depuis les modèles) ---------- */
  var MANIFEST = {};
  var SEL = '.quiz, .answer, .ctab, .match, .pick';
  function typeOf(el) { return el.classList.contains('quiz') ? 'quiz' : el.classList.contains('answer') ? 'answer' : 'check'; }
  function headingBefore(el, root, fallback) {
    var last = null;
    $$('h2, h3', root).forEach(function (hd) { if (hd.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING) last = hd; });
    return last ? last.textContent.trim() : fallback;
  }
  function labelFor(el, root, pageTitle) {
    if (el.getAttribute('data-label')) return el.getAttribute('data-label');
    var hd = headingBefore(el, root, pageTitle);
    return typeOf(el) === 'quiz' ? 'Quiz : ' + (el.getAttribute('data-title') || hd) : hd;
  }
  function buildManifest() {
    PAGES.forEach(function (p) {
      var tpl = $('template[data-page="' + p.id + '"]'); MANIFEST[p.id] = [];
      if (!tpl) return;
      var root = document.createElement('div'); root.appendChild(tpl.content.cloneNode(true));
      $$(SEL, root).forEach(function (el) {
        MANIFEST[p.id].push({ key: p.id + ':' + el.getAttribute('data-id'), type: typeOf(el), label: labelFor(el, root, p.title), anchor: 'it-' + el.getAttribute('data-id'), total: typeOf(el) === 'quiz' ? $$(':scope > .q', el).length : null });
      });
    });
  }
  function isDone(it) {
    if (it.type === 'answer') { var s = state.items[it.key]; return !!(s && s.self); }
    return !!state.firsts[it.key];
  }
  function pageStats(id) { var its = MANIFEST[id] || []; return { done: its.filter(isDone).length, total: its.length, started: its.some(function (it) { return !!state.items[it.key]; }) }; }

  /* ---------- coque ---------- */
  var PAGE = 'accueil', PINFO = PAGES[0], article, tocObserver = null;
  function applyTheme(t) {
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }
  function buildShell() {
    article = $('article'); article.id = 'page-top';
    var top = h('header', { class: 'topbar' });
    top.innerHTML =
      '<button class="menu-btn" type="button" aria-expanded="false" aria-controls="sidebar">Menu</button>' +
      '<a class="brand" href="#accueil">' + esc(CONFIG.brand || TITLE) + '<span>·</span><small>' + esc(CONFIG.brandSub || 'BTS SIO') + '</small></a>' +
      '<span class="spacer"></span><span class="who" id="who"></span>' +
      '<button type="button" class="btn small save-btn" id="save-btn">Sauvegarder</button>' +
      '<label class="sr-only" for="theme-sel">Thème</label>' +
      '<select class="theme-sel" id="theme-sel"><option value="auto">Thème auto</option><option value="light">Clair</option><option value="dark">Sombre</option></select>';
    var layout = h('div', { class: 'layout' });
    var side = h('nav', { class: 'sidebar', id: 'sidebar', 'aria-label': 'Parcours' });
    var groups = CONFIG.groups || [['Parcours', PAGES.map(function (p) { return p.id; })]];
    side.innerHTML = groups.map(function (g) {
      return '<div class="nav-group"><p>' + g[0] + '</p><ol>' + g[1].map(function (id) {
        var p = pageById(id);
        return '<li><a class="nav-link" href="#' + p.id + '" data-nav="' + p.id + '"><span><span class="n">' + p.n + (p.dur ? ' · ' + p.dur : '') + '</span>' + p.title + '</span><span class="pill" data-pill="' + p.id + '"></span></a></li>';
      }).join('') + '</ol></div>';
    }).join('');
    var main = h('main', { class: 'main', id: 'main' });
    var notices = h('div', { class: 'notices', id: 'notices' });
    var grid = h('div', { class: 'page-grid' });
    var toc = h('aside', { class: 'toc', 'aria-label': 'Sur cette page' });
    article.parentNode.insertBefore(top, article);
    article.parentNode.insertBefore(layout, article);
    layout.appendChild(side); layout.appendChild(main); main.appendChild(notices); main.appendChild(grid);
    grid.appendChild(article); grid.appendChild(toc);
    document.body.appendChild(h('div', { class: 'scrim' }));
    document.body.appendChild(h('div', { class: 'remind', id: 'remind', hidden: '' }));

    var sel = $('#theme-sel'); sel.value = state.ui.theme || 'auto'; applyTheme(state.ui.theme);
    sel.addEventListener('change', function () { state.ui.theme = sel.value; applyTheme(sel.value); save(); });
    $('#save-btn').addEventListener('click', function () { if (!state.ui.started) { go('accueil'); return; } fileSave(); });
    var mb = $('.menu-btn');
    function closeNav() { document.body.classList.remove('nav-open'); mb.setAttribute('aria-expanded', 'false'); }
    mb.addEventListener('click', function () { var o = document.body.classList.toggle('nav-open'); mb.setAttribute('aria-expanded', o ? 'true' : 'false'); });
    $('.scrim').addEventListener('click', closeNav);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeNav(); });
    side.addEventListener('click', closeNav);

    // liens internes : #page, #ancre de la page courante
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a[href^="#"]'); if (!a) return;
      var t = a.getAttribute('href').slice(1);
      if (pageById(t)) { e.preventDefault(); go(t, a.getAttribute('data-anchor')); return; }
      var target = t && document.getElementById(t);
      if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    });
    function onHist() { var t = location.hash.slice(1) || 'accueil'; if (pageById(t) && t !== PAGE) render(t); }
    window.addEventListener('hashchange', onHist); window.addEventListener('popstate', onHist);
    window.addEventListener('beforeunload', function (e) {
      saveNow();
      if (state.ui.started && dirty()) { e.preventDefault(); e.returnValue = ''; return ''; }
    });
    setInterval(checkReminder, 30000);
  }
  function updateWho() {
    var w = $('#who'); if (!w) return;
    w.textContent = state.student.nom ? fullName() + (state.student.classe ? ' · ' + state.student.classe : '') + (state.student.id ? ' · ' + state.student.id : '') : '';
  }
  function updateSaveBtn() {
    var b = document.getElementById('save-btn'); if (!b) return;
    var d = !!(state.ui.started && dirty());
    b.classList.toggle('dirty', d);
    b.textContent = d || !hasWork() || !state.ui.started ? 'Sauvegarder' : 'Sauvegardé ✓';
    b.title = !state.ui.started ? 'Commencer par la page de démarrage.' : d ? 'Des réponses ne sont pas encore dans votre fichier de sauvegarde : cliquer pour le télécharger.' : (state.ui.fileAt ? 'Fichier de sauvegarde à jour (' + fmtDate(state.ui.fileAt, true) + ').' : '');
  }

  /* ---------- rappel des 20 minutes ---------- */
  function checkReminder() {
    var r = $('#remind'); if (!r || !state.ui.started) return;
    if (!dirty()) { r.hidden = true; return; }
    var since = Math.max(state.ui.fileAt || 0, SESSION_START);
    if (Date.now() - since < REMIND_MS || Date.now() < (state.ui.snooze || 0)) return;
    r.innerHTML = '<p><strong>Penser à sauvegarder.</strong> ' + (state.ui.fileAt ? 'Dernier fichier de sauvegarde : ' + ago(state.ui.fileAt) + '.' : 'Aucun fichier de sauvegarde depuis le début de la séance.') + ' Sans sauvegarde, fermer le navigateur peut faire perdre le travail.</p><p class="row"><button type="button" class="btn small primary" data-rsave>Sauvegarder maintenant</button><button type="button" class="btn small" data-rlater>Dans 10 min</button></p>';
    r.hidden = false;
    $('[data-rsave]', r).addEventListener('click', fileSave);
    $('[data-rlater]', r).addEventListener('click', function () { state.ui.snooze = Date.now() + 10 * 60000; save(); r.hidden = true; });
  }
  function hideReminder() { var r = $('#remind'); if (r) r.hidden = true; }

  /* ---------- rendu d'une page ---------- */
  function go(id, anchor) {
    if (location.hash.slice(1) !== id) { try { history.pushState(null, '', '#' + id); } catch (e) { /* contexte restreint */ } }
    render(id, anchor);
  }
  function render(id, anchor) {
    PAGE = pageById(id) ? id : 'accueil'; PINFO = pageById(PAGE);
    document.title = (PAGE === 'accueil' ? '' : PINFO.n + ' — ' + PINFO.title + ' · ') + TITLE;
    $$('[data-nav]').forEach(function (a) { if (a.getAttribute('data-nav') === PAGE) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    var tpl = $('template[data-page="' + PAGE + '"]');
    var gated = !state.ui.started && PAGE !== 'accueil';
    article.innerHTML = '';

            return '<tr>' + r.map(function (v, ci) { return '<td><input class="c" aria-label="Ligne ' + (ri + 1) + ', colonne ' + (ci + 1) + '" data-f="cell" data-t="' + ti + '" data-r="' + ri + '" data-c="' + ci + '" value="' + esc(v) + '"></td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table></div><div class="te-tools">' +
          '<button type="button" class="btn small" data-act="addcol" data-t="' + ti + '">+ colonne</button><button type="button" class="btn small" data-act="delcol" data-t="' + ti + '"' + (t.cols.length < 2 ? ' disabled' : '') + '>− colonne</button>' +
          '<button type="button" class="btn small" data-act="addrow" data-t="' + ti + '">+ ligne</button><button type="button" class="btn small" data-act="delrow" data-t="' + ti + '"' + (t.rows.length < 2 ? ' disabled' : '') + '>− ligne</button>' +
          (st.tables.length > 1 ? '<button type="button" class="btn small ghost" data-act="deltable" data-t="' + ti + '">Supprimer la relation</button>' : '') + '</div></div>';
      });
      out += '<div class="row"><button type="button" class="btn small" data-act="addtable">+ Ajouter une relation</button><span class="note-line">« clé » souligne l’attribut (clé primaire), « # » le marque comme clé étrangère.</span></div>';
      if (withLinks) out += '<div class="te-links"><label for="lk-' + id + '">Liens entre les tables (la flèche part de la clé étrangère)</label><input id="lk-' + id + '" data-f="links" placeholder="Exemple : VOITURE.TYPE# -> MODELE.TYPE" value="' + esc(st.links || '') + '"></div>';
      host.innerHTML = out;
    }
    host.addEventListener('input', function (e) {
      var i = e.target, f = i.getAttribute('data-f'); if (!f) return;
      var t = st.tables[+i.getAttribute('data-t')];
      if (f === 'name') t.name = i.value.toUpperCase();
      else if (f === 'col') t.cols[+i.getAttribute('data-c')].n = i.value;
      else if (f === 'cell') t.rows[+i.getAttribute('data-r')][+i.getAttribute('data-c')] = i.value;
      else if (f === 'links') st.links = i.value;

    });
    host.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]'); if (!b) return;
      var a = b.getAttribute('data-act'), t = st.tables[+b.getAttribute('data-t')], c = +b.getAttribute('data-c');
      if (a === 'pk') t.cols[c].pk = !t.cols[c].pk;
      else if (a === 'fk') t.cols[c].fk = !t.cols[c].fk;
      else if (a === 'addcol') { t.cols.push({ n: '' }); t.rows.forEach(function (r) { r.push(''); }); }
      else if (a === 'delcol' && t.cols.length > 1) { t.cols.pop(); t.rows.forEach(function (r) { r.pop(); }); }
      else if (a === 'addrow') t.rows.push(t.cols.map(function () { return ''; }));
      else if (a === 'delrow' && t.rows.length > 1) t.rows.pop();
      else if (a === 'deltable') st.tables.splice(+b.getAttribute('data-t'), 1);
      else if (a === 'addtable') st.tables.push({ name: '', cols: [{ n: '' }, { n: '' }], rows: [['', '']] });
      render(); onChange();
    });
    return { render: render };
  }

  /* ---------- activités auto-corrigées : fonctions communes ---------- */
  function checkFoot(k, st, p, okMsg, koMsg) {

      '<span class="note-line">' + (f && st.attempts > 1 ? firstLine(k) + ' · tentative n° ' + st.attempts : 'Tentative n° ' + st.attempts + ' (résultat retenu)') + '</span><button type="button" class="btn" data-retry>S’entraîner à nouveau</button>';
  }
  function checkHead(k, st, label, badge) {

  }
  function recordCheck(k, st, s, t) {

  /* ---------- TABLEAU À COCHER ---------- */
  function initCtab(root) {
    setAnchor(root);
    var cols = root.getAttribute('data-cols').split('|'), choices = (root.getAttribute('data-choices') || 'OUI|NON').split('|');
    var gateVal = root.getAttribute('data-gate'), headTxt = root.getAttribute('data-head') || 'Proposition';
    var after = $(':scope > .after', root), afterHTML = after ? after.innerHTML : ''; if (after) after.remove();
    var rows = $$(':scope > .r', root).map(function (r) { return { html: r.innerHTML, ok: (r.getAttribute('data-ok') || '').split('|'), expl: arrows(r.getAttribute('data-expl')) }; });
    var k = itemKey(root), st = state.items[k] || { v: [], checked: false, attempts: 0 };
    rows.forEach(function (r, i) { st.v[i] = st.v[i] || []; });
    root.innerHTML = ''; var box = h('div', { class: 'ck' }); root.appendChild(box);
    function off(i, c) { return c > 0 && gateVal && st.v[i][0] === gateVal; }
    function graded(i, c) { return rows[i].ok[c] !== undefined && rows[i].ok[c] !== ''; }
    function okList(i, c) { return rows[i].ok[c].split('/'); }
    function render() {
      var html = checkHead(k, st, 'Activité auto-corrigée', st.checked ? st.score + ' / ' + st.total : '') + '<div class="ck-scroll"><table><thead><tr><th>' + headTxt + '</th>' + cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>';
      rows.forEach(function (r, i) {
        html += '<tr><td class="lab">' + r.html + '</td>';
        cols.forEach(function (c, ci) {
          var cls = st.checked && graded(i, ci) ? (okList(i, ci).indexOf(st.v[i][ci]) > -1 ? ' good' : ' bad') : '';
          html += '<td class="cell' + cls + '"><span class="seg" role="group" aria-label="' + esc(plain(c)) + '">' + choices.map(function (ch) {
            return '<button type="button" data-i="' + i + '" data-c="' + ci + '" data-v="' + esc(ch) + '" aria-pressed="' + (st.v[i][ci] === ch ? 'true' : 'false') + '"' + (st.checked || off(i, ci) ? ' disabled' : '') + '>' + ch + '</button>';
          }).join('') + '</span>' + (cls ? '<span class="mark">' + (cls === ' good' ? '✓' : '✗ ' + esc(okList(i, ci)[0])) + '</span>' : '') + '</td>';
        });
        html += '</tr>' + (st.checked && r.expl ? '<tr class="ck-expl"><td colspan="' + (cols.length + 1) + '">' + r.expl + '</td></tr>' : '');
      });
      html += '</tbody></table></div><div class="ck-foot">' + (!st.checked ? '<button type="button" class="btn primary" data-check>Vérifier</button><span class="ck-msg" aria-live="polite"></span>' : checkFoot(k, st, pct(st.score, st.total), 'Tout est juste.', st.score + ' bonne(s) réponse(s) sur ' + st.total + '. Lire les explications sous chaque ligne.')) + '</div>';
      if (st.checked && afterHTML) html += '<div class="ck-after">' + afterHTML + '</div>';
      box.innerHTML = html;
    }
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b || b.disabled) return;
      if (b.hasAttribute('data-v')) {
        var i = +b.getAttribute('data-i'), c = +b.getAttribute('data-c'); st.v[i][c] = b.getAttribute('data-v');
        if (c === 0 && gateVal && st.v[i][0] === gateVal) for (var x = 1; x < cols.length; x++) st.v[i][x] = undefined;
        state.items[k] = st; save(); render(); return;
      }
      if (b.hasAttribute('data-check')) {
        var miss = 0; rows.forEach(function (r, i) { cols.forEach(function (c, ci) { if (!off(i, ci) && !st.v[i][ci]) miss++; }); });
        if (miss) { var m = $('.ck-msg', box); m.textContent = 'Répondre à toutes les cases actives avant de vérifier (' + miss + ' manquante' + (miss > 1 ? 's' : '') + ').'; m.className = 'ck-msg bad'; return; }
        var s = 0, t = 0; rows.forEach(function (r, i) { cols.forEach(function (c, ci) { if (graded(i, ci)) { t++; if (okList(i, ci).indexOf(st.v[i][ci]) > -1) s++; } }); });
        recordCheck(k, st, s, t); render(); return;
      }
      if (b.hasAttribute('data-retry')) { st.checked = false; st.v = rows.map(function () { return []; }); state.items[k] = st; changed(); render(); }
    });
    render();
  }

  /* ---------- ASSOCIATION ---------- */

        var s = 0; rows.forEach(function (r, i) { if (r.ok.indexOf(st.v[i]) > -1) s++; });

      }

  /* ---------- SÉLECTION DE LIGNES ---------- */
  function initPick(root) {
    setAnchor(root);
    var ok = root.getAttribute('data-ok').split(',').map(function (x) { return +x; });
    var q = $(':scope > .pq', root), qHTML = q ? q.innerHTML : '';

    var tblHTML = $('table', root).outerHTML;

    root.innerHTML = ''; var box = h('div', { class: 'ck' }); root.appendChild(box);
    function render() {
      box.innerHTML = checkHead(k, st, 'Cliquer sur les lignes concernées', st.checked ? (st.score === st.total ? 'Juste' : 'À corriger') : '') + (qHTML ? '<div class="ans-body" style="padding-bottom:0">' + qHTML + '</div>' : '') + '<div class="ck-scroll">' + tblHTML + '</div>' +
        (st.checked ? '<div class="ans-body" style="padding-top:0"><p class="legend"><span><i style="background:var(--ok-soft);border:2px solid var(--ok)"></i>bien repérée</span><span><i style="background:var(--ko-soft);border:2px solid var(--ko)"></i>sélectionnée à tort</span><span><i style="background:var(--mid-soft);border:2px solid var(--mid)"></i>oubliée</span></p></div>' : '') +
        '<div class="ck-foot">' + (!st.checked ? '<button type="button" class="btn primary" data-check>Vérifier</button><span class="ck-msg" aria-live="polite"></span>' : checkFoot(k, st, st.score === st.total ? 100 : 0, 'Bonne sélection.', 'Sélection incomplète ou erronée : comparer avec les couleurs.')) + '</div>' +
        (st.checked && afterHTML ? '<div class="ck-after">' + afterHTML + '</div>' : '');
      $$('tbody tr', box).forEach(function (tr, i) {
        var n = i + 1, on = st.v.indexOf(n) > -1;
        tr.setAttribute('tabindex', st.checked ? '-1' : '0'); tr.setAttribute('aria-selected', on ? 'true' : 'false'); tr.setAttribute('data-n', n);
        if (!st.checked) tr.classList.toggle('picked', on);

    function toggle(tr) { if (st.checked) return; var n = +tr.getAttribute('data-n'), i = st.v.indexOf(n); if (i > -1) st.v.splice(i, 1); else st.v.push(n); state.items[k] = st; save(); render(); }

        var good = st.v.filter(function (n) { return ok.indexOf(n) > -1; }).length;

    render();
  }

  /* ---------- bilan ---------- */
  function allItems() {
    var out = [];
    PAGES.forEach(function (p) { (MANIFEST[p.id] || []).forEach(function (it) { out.push({ page: p, it: it, st: state.items[it.key], f: state.firsts[it.key] }); }); });
    return out;
  }
  function itemResult(x) {
    var it = x.it, s = x.st, f = x.f;
    if (it.type === 'answer') {
      if (!s) return { txt: 'non commencé', level: null };
      if (!s.self) return { txt: s.revealed ? 'correction vue, non évaluée' : 'rédigée, correction non consultée', level: null };
      var t = SELF[s.self] + (f && f.self && f.self !== s.self ? ' (1re évaluation : ' + SELF[f.self] + ')' : '');
      return { txt: t, level: f && f.self ? f.self : s.self };
    }
    if (!f) return { txt: s ? 'en cours' : 'non commencé', level: null };
    var p = pct(f.score, f.total), lv = it.type === 'quiz' ? (p >= 80 ? 'ok' : p >= 50 ? 'mid' : 'ko') : (p === 100 ? 'ok' : p >= 60 ? 'mid' : 'ko');
    var extra = s && s.attempts > 1 ? ' · ' + s.attempts + ' tentatives' + (s.best != null ? ', meilleur ' + s.best + ' / ' + f.total : '') : '';
    return { txt: '1re tentative ' + f.score + ' / ' + f.total + extra, level: lv };
  }
  function renderBilan(el) {
    var items = allItems(), done = items.filter(function (x) { return isDone(x.it); }).length;
    var qz = items.filter(function (x) { return x.it.type === 'quiz' && x.f; }), ck = items.filter(function (x) { return x.it.type === 'check' && x.f; });
    function sum(a, k2) { return a.reduce(function (t, x) { return t + x.f[k2]; }, 0); }
    var selfs = { ok: 0, mid: 0, ko: 0 }; items.forEach(function (x) { if (x.it.type === 'answer' && x.st && x.st.self) selfs[x.st.self]++; });
    var html = '<div class="stats"><div class="stat"><b>' + done + ' / ' + items.length + '</b><span>activités terminées</span></div>' +
      '<div class="stat"><b>' + (qz.length ? pct(sum(qz, 'score'), sum(qz, 'total')) + ' %' : '—') + '</b><span>réussite aux quiz (1res tentatives)</span></div>' +
      '<div class="stat"><b>' + (ck.length ? pct(sum(ck, 'score'), sum(ck, 'total')) + ' %' : '—') + '</b><span>réussite aux activités auto-corrigées (1res tentatives)</span></div>' +
      '<div class="stat"><b>' + selfs.ok + ' · ' + selfs.mid + ' · ' + selfs.ko + '</b><span>réponses rédigées : réussi · en partie · à revoir</span></div></div>';
    html += '<div class="tbl-wrap"><table class="data wide bilan-tbl"><thead><tr><th>Étape</th><th>Activités</th><th>Quiz</th><th>Auto-corrigé</th><th>Auto-évaluation</th></tr></thead><tbody>';
    PAGES.forEach(function (p) {
      var its = items.filter(function (x) { return x.page.id === p.id; }); if (!its.length) return;
      var s = pageStats(p.id);
      if (!s.started) { html += '<tr><td><a href="#' + p.id + '">' + p.n + ' — ' + p.title + '</a></td><td colspan="4" class="null">pas encore commencée</td></tr>'; return; }
      var q = its.filter(function (x) { return x.it.type === 'quiz' && x.f; }), c = its.filter(function (x) { return x.it.type === 'check' && x.f; });
      var se = { ok: 0, mid: 0, ko: 0 }; its.forEach(function (x) { if (x.it.type === 'answer' && x.st && x.st.self) se[x.st.self]++; });
      var na = its.filter(function (x) { return x.it.type === 'answer'; }).length;
      html += '<tr><td><a href="#' + p.id + '">' + p.n + ' — ' + p.title + '</a></td><td>' + s.done + ' / ' + s.total + '</td><td>' + (q.length ? sum(q, 'score') + ' / ' + sum(q, 'total') : '—') + '</td><td>' + (c.length ? sum(c, 'score') + ' / ' + sum(c, 'total') : '—') + '</td><td>' + (na ? '<span class="chip ok">' + se.ok + '</span><span class="chip mid">' + se.mid + '</span><span class="chip ko">' + se.ko + '</span>' : '—') + '</td></tr>';
    });
    html += '</tbody></table></div><p class="note-line">Les scores affichés sont ceux de la première tentative ; les tentatives suivantes servent à s’entraîner.</p>';
    var rev = items.filter(function (x) { var r = itemResult(x); return r.level === 'ko' || r.level === 'mid'; });
    html += '<h3 class="nonum">Points à revoir</h3>' + (rev.length ? '<ul class="revoir">' + rev.map(function (x) { var r = itemResult(x); return '<li><span class="chip ' + r.level + '">' + esc(r.txt) + '</span><a href="#' + x.page.id + '" data-anchor="' + x.it.anchor + '">' + x.page.n + ' · ' + esc(x.it.label) + '</a></li>'; }).join('') + '</ul>' : '<p class="note-line">Aucun point signalé pour l’instant.</p>');
    el.innerHTML = html;
  }

  /* ---------- journal et compte rendu ---------- */
  function labelOf(k) { var p = k && k.split(':')[0]; var it = (MANIFEST[p] || []).filter(function (x) { return x.key === k; })[0]; return it ? (pageById(p).n + ' · ' + it.label) : (k || ''); }
  function eventText(ev) {
    var d = ev.d || {};
    switch (ev.e) {
      case 'start': return 'Début du travail (identifiant ' + d.id + ')';
      case 'save': return 'Sauvegarde dans un fichier n° ' + d.n;
      case 'restore': return 'Restauration d’un fichier' + (d.id ? ' (identifiant ' + d.id + ')' : '') + (d.date ? ', sauvegardé le ' + fmtDate(d.date, true) : '') + (d.forced ? ' — malgré l’avertissement' : '');
      case 'quiz': return labelOf(ev.k) + ' : ' + d.s + ' / ' + d.t + ' (tentative ' + d.a + ')';
      case 'check': return labelOf(ev.k) + ' : ' + d.s + ' / ' + d.t + ' (tentative ' + d.a + ')';
      case 'reveal': return labelOf(ev.k) + ' : correction consultée' + (d.sec != null ? ' ' + (d.sec < 90 ? d.sec + ' s' : Math.round(d.sec / 60) + ' min') + ' après le début de la rédaction' : '') + (d.len != null ? ' (' + d.len + ' caractères écrits)' : '');
      case 'edit-after': return labelOf(ev.k) + ' : réponse modifiée après la correction';
      case 'self': return labelOf(ev.k) + ' : auto-évaluation « ' + SELF[d.to] + ' »';
      case 'self-change': return labelOf(ev.k) + ' : auto-évaluation changée de « ' + SELF[d.from] + ' » à « ' + SELF[d.to] + ' »';
      case 'hint': return labelOf(ev.k) + ' : indice consulté';
      case 'reset': return 'Effacement des réponses en cours (les premiers résultats sont conservés)';
      case 'identity': return 'Identité modifiée : ' + d.from + ' → ' + d.to;
      default: return ev.e;
    }
  }
  function headerLines() {
    var s = state.student;
    return { who: fullName() || 'Nom non renseigné', classe: s.classe || '', id: s.id || '—', created: s.createdAt ? fmtDate(s.createdAt, true) : '—', saves: state.ui.saves || 0, restores: state.log.filter(function (e) { return e.e === 'restore'; }).length };
  }
  function buildReport(asHTML) {
    var items = allItems(), H = headerLines(), d = fmtDate(Date.now(), true);
    var pages = PAGES.filter(function (p) { return (MANIFEST[p.id] || []).length; });
    if (!asHTML) {
      var t = 'COMPTE RENDU — ' + TITLE.toUpperCase() + '\n' + H.who + ' — ' + H.classe + ' — identifiant ' + H.id + '\nTravail commencé le ' + H.created + ' · édité le ' + d + ' · ' + H.saves + ' sauvegarde(s), ' + H.restores + ' restauration(s)\n';
      pages.forEach(function (p) {
        t += '\n==== ' + p.n + ' — ' + p.title + ' ====\n';
        if (!pageStats(p.id).started) { t += '(pas encore commencée)\n'; return; }
        items.filter(function (x) { return x.page.id === p.id; }).forEach(function (x) {
          var r = itemResult(x);
          t += '\n• ' + x.it.label + ' [' + r.txt + ']' + (x.st && x.st.editedAfter ? ' (complétée après la correction)' : '') + '\n';
          if (x.it.type === 'answer' && x.st) { if (x.st.text) t += x.st.text.replace(/^/gm, '    ') + '\n'; if (x.st.tables) t += tablesToText(x.st).replace(/^/gm, '    ') + '\n'; }
        });
      });
      t += '\n==== Journal ====\n' + state.log.map(function (ev) { return fmtDate(ev.t, true) + ' · ' + eventText(ev); }).join('\n') + '\n';
      return t;
    }
    var css = 'body{font:15px/1.5 system-ui,sans-serif;max-width:52rem;margin:2rem auto;padding:0 16px;color:#161d2e}h1{font-size:1.5rem}h2{margin-top:2rem;border-bottom:2px solid #2c48c9;padding-bottom:4px;font-size:1.15rem}.it{border:1px solid #d8ddeb;border-radius:8px;padding:10px 14px;margin:10px 0}.lab{font-weight:700}.res{float:right;font-size:.8rem;padding:2px 8px;border-radius:99px;background:#eef1f8;margin-left:8px}.ok{background:#e3f4e8;color:#17803d}.mid{background:#fbf1d9;color:#9a6200}.ko{background:#fbe6e6;color:#c53030}pre{white-space:pre-wrap;font:13px/1.45 ui-monospace,Consolas,monospace;background:#f6f7fb;padding:8px;border-radius:6px}table{border-collapse:collapse;margin:6px 6px 6px 0;font-size:13px}td,th{border:1px solid #ccd;padding:3px 8px;text-align:left}th{background:#eef1f8}.tables{display:flex;flex-wrap:wrap;gap:8px}u{text-decoration-thickness:2px}.tbl-name{font-weight:700;margin:4px 0 0;font-size:12px}.note{color:#9a6200;font-size:.8rem}.id{font-family:ui-monospace,Consolas,monospace;font-weight:700}.log{font-size:13px}.log td:first-child{white-space:nowrap;color:#556079}.null{color:#556079;font-style:italic}';
    var out = '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Compte rendu — ' + esc(H.who) + '</title><style>' + css + '</style></head><body><h1>Compte rendu — ' + esc(TITLE) + '</h1><p><strong>' + esc(H.who) + '</strong> — ' + esc(H.classe) + ' — identifiant <span class="id">' + esc(H.id) + '</span><br>Travail commencé le ' + H.created + ' · édité le ' + d + ' · ' + H.saves + ' sauvegarde(s) dans un fichier, ' + H.restores + ' restauration(s)</p>';
    pages.forEach(function (p) {
      out += '<h2>' + p.n + ' — ' + esc(p.title) + '</h2>';
      if (!pageStats(p.id).started) { out += '<p class="null">Pas encore commencée.</p>'; return; }
      items.filter(function (x) { return x.page.id === p.id; }).forEach(function (x) {
        var r = itemResult(x);
        out += '<div class="it"><span class="res ' + (r.level || '') + '">' + esc(r.txt) + '</span><div class="lab">' + esc(x.it.label) + '</div>';
        if (x.st && x.st.editedAfter) out += '<div class="note">Réponse complétée après la consultation de la correction.</div>';
        if (x.it.type === 'answer' && x.st) { if (x.st.text) out += '<pre>' + esc(x.st.text) + '</pre>'; if (x.st.tables) out += tablesToHTML(x.st); }
        out += '</div>';
      });
    });
    out += '<h2>Journal</h2><table class="log">' + state.log.map(function (ev) { return '<tr><td>' + fmtDate(ev.t, true) + '</td><td>' + esc(eventText(ev)) + '</td></tr>'; }).join('') + '</table>';
    return out + '</body></html>';
  }
  function renderExport(el) {
    el.innerHTML = '<div class="row"><button type="button" class="btn primary" data-dlrep>Télécharger le compte rendu (.html)</button><button type="button" class="btn" data-copyrep>Copier le compte rendu (texte)</button><button type="button" class="btn ghost" data-showrep>Afficher</button></div><p class="note-line">Le compte rendu contient les réponses, les résultats des premières tentatives et le journal horodaté (tentatives, corrections consultées, sauvegardes, restaurations).</p><textarea id="rep-area" rows="12" readonly hidden style="width:100%;font:.8rem/1.45 var(--f-mono);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)"></textarea>';
    var area = $('#rep-area', el);
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-copyrep')) copyText(buildReport(false), b, area);
      if (b.hasAttribute('data-dlrep')) download('compte-rendu-' + (CONFIG.fileSlug || 'cours') + '-' + slug(fullName()) + '.html', buildReport(true), 'text/html');
      if (b.hasAttribute('data-showrep')) { area.hidden = !area.hidden; area.value = buildReport(false); b.textContent = area.hidden ? 'Afficher' : 'Masquer'; }
    });
  }
  function renderBackup(el) {
    el.innerHTML = '<div class="row"><button type="button" class="btn primary" data-dlbk>Sauvegarder dans un fichier</button><label class="btn" for="bk-file">Ouvrir un fichier de sauvegarde</label><input type="file" id="bk-file" accept=".json,application/json" class="sr-only"></div><div data-bkmsg></div>' +
      '<hr><div class="row"><button type="button" class="btn ghost" data-reset>Effacer mes réponses en cours…</button><span class="confirm" data-confirm hidden>Effacer les réponses de ce navigateur ? Les résultats des premières tentatives et le journal sont conservés. <button type="button" class="btn small" data-reset-yes style="border-color:var(--ko);color:var(--ko)">Oui, effacer</button><button type="button" class="btn small" data-reset-no>Annuler</button></span></div>';
    fileInput($('#bk-file', el), $('[data-bkmsg]', el));
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-dlbk')) fileSave();
      if (b.hasAttribute('data-reset')) $('[data-confirm]', el).hidden = false;
      if (b.hasAttribute('data-reset-no')) $('[data-confirm]', el).hidden = true;
      if (b.hasAttribute('data-reset-yes')) { state.items = {}; logEvent('reset'); saveNow(); render(PAGE); }
    });
  }

  /* ---------- démarrage ---------- */
  function start() {
    load(); buildShell(); buildManifest();
    var t = location.hash.slice(1);
    render(pageById(t) ? t : 'accueil');
    window.__support = { state: function () { return state; } }; // utile pour les tests
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
</body>
</html>
